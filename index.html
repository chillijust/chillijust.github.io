    '<span class="theme-count">' + wert + '/' + gesamt + '</span></div>';
}

// ── Sicherungscode ──────────────────────────────────────────
// Der alte Code war der ganze Lernstand als JSON in Base64 — mit 380
// kyrillischen Schlüsseln und Millisekunden-Zeitstempeln ein Klumpen von rund
// zwanzig Kilobyte, den niemand gern von Hand markiert.
//
// Format 2 kodiert stattdessen nur, was sich nicht ausrechnen lässt, und zwar
// in fester Breite:
//
//   CHG2~<Wörter>~<Sätze>~<Fakten>~<Zahlen>~<Einstellungen>~<Prüfsumme>
//
// Ein Wort belegt zehn Zeichen: sechs für eine **stabile Kennung** (Hash des
// russischen Wortes, nicht seine Position — sonst verschöbe eine neue Vokabel
// alle Stände), eines für die Stufe, drei für das Alter in Tagen. Tagesgenau
// genügt, weil alle Fristen in Tagen rechnen. Das ergibt etwa ein Fünftel der
// alten Länge und obendrein eine Prüfsumme, die abgeschnittenes Einfügen
// erkennt, statt still Unsinn zu laden.
var BK_KOPF = 'CHG2';
var BK_BEZUG = Date.UTC(2026, 0, 1);   // Tag 0 der Zeitrechnung im Code
var BK_KENNUNG = 6;                    // Zeichen je Kennung
var BK_TAGE = 3;                       // Zeichen je Alter
var BK_EINTRAG = BK_KENNUNG + 1 + BK_TAGE;

function bkFuellen(text, breite) {
  var t = String(text);
  while (t.length < breite) t = '0' + t;
  return t.slice(-breite);
}
// Dieselbe Streuung wie bei den Fakten, nur auf feste Breite gebracht.
function bkKennung(text) {
  return bkFuellen(faktId(text), BK_KENNUNG);
}
function bkTag(ms) {
  if (!ms) return 0;
  return Math.max(0, Math.min(46655, Math.floor((ms - BK_BEZUG) / TAG)));
}
function bkAusTag(t) {
  return BK_BEZUG + t * TAG;
}
function bkPruefsumme(text) {
  var h = 0;
  for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
  return bkFuellen((h >>> 0).toString(36), 7);
}

// Kennung → Inhalt. Einmal gebaut, danach nachgeschlagen.
var bkTabelle = null;
function bkNachschlagen() {
  if (bkTabelle) return bkTabelle;
  bkTabelle = { woerter: {}, saetze: {}, fakten: {}, buchstaben: {}, regeln: {}, schreibung: {} };
  ALL_VOCAB.forEach(function (v) { bkTabelle.woerter[bkKennung(v.id)] = v.id; });
  SENTENCES.forEach(function (x) { bkTabelle.saetze[bkKennung(x.ru)] = x.ru; });
  FACTS.forEach(function (f) { bkTabelle.fakten[bkKennung(f)] = faktId(f); });
  ALPHABET.forEach(function (b) { bkTabelle.buchstaben[bkKennung(b[1])] = b[1]; });
  GRAMMATIK.forEach(function (b) { bkTabelle.regeln[bkKennung(b.id)] = b.id; });
  ORTHO.forEach(function (r) { bkTabelle.schreibung[bkKennung(r.id)] = r.id; });
  return bkTabelle;
}

function bkStaendeAus(boxen, zeiten, kennungVon) {
  var teile = [];
  Object.keys(boxen).forEach(function (k) {
    var box = boxen[k] || 0;
    if (!box && !zeiten[k]) return;
    teile.push(kennungVon(k) +
      bkFuellen(Math.min(9, box).toString(36), 1) +
      bkFuellen(bkTag(zeiten[k]).toString(36), BK_TAGE));
  });
  return teile.join('');
}

function bkStaendeNach(text, tabelle, boxen, zeiten) {
  for (var i = 0; i + BK_EINTRAG <= text.length; i += BK_EINTRAG) {
    var kennung = text.slice(i, i + BK_KENNUNG);
    var ziel = tabelle[kennung];
    if (!ziel) continue;   // Inhalt gibt es nicht mehr — wie bei migriereIds
    boxen[ziel] = parseInt(text.slice(i + BK_KENNUNG, i + BK_KENNUNG + 1), 36) || 0;
    var tag = parseInt(text.slice(i + BK_KENNUNG + 1, i + BK_EINTRAG), 36) || 0;
    if (tag) zeiten[ziel] = bkAusTag(tag);
  }
}

// Die Einstellungen in fester Reihenfolge — Namen wären hier reine Länge. Ein
// `null` hält den Platz einer Einstellung, die es nicht mehr gibt: Die Stellen
// dürfen nicht wandern, sonst liest ein alter Code die falschen Schalter.
var BK_SETTINGS = ['confirmUeben', 'confirmUebersetzen', 'requireComplete', 'ton',
  null, 'tastaturAuto', 'kommentare'];

function encodeBackup() {
  var woerter = bkStaendeAus(state.boxes, state.lastSeen, bkKennung);
  var saetze = bkStaendeAus(state.satzBox, state.satzSeen, bkKennung);

  var fakten = [];
  Object.keys(state.fakten).forEach(function (id) {
    var st = state.fakten[id];
    if (!st || (!st.n && !st.f)) return;
    // Der Fakt ist schon über faktId gespeichert; für den Code wird auf feste
    // Breite gebracht, damit sich alles ohne Trennzeichen lesen lässt.
    fakten.push(bkFuellen(id, BK_KENNUNG) +
      bkFuellen(Math.min(1295, st.n || 0).toString(36), 2) + (st.f ? '1' : '0'));
  });

  var zahlen = [state.streak, state.bestStreak, state.answered, state.factIdx,
    state.typingStats.correct, state.typingStats.wrong,
    state.transStats.correct, state.transStats.wrong]
    .map(function (n) { return Math.max(0, n | 0).toString(36); }).join('.');

  var s = state.settings;
  var einst = BK_SETTINGS.map(function (k) { return k && s[k] ? '1' : '0'; }).join('') +
    '.' + s.tippenStufe + '.' + s.auffrischen + '.' +
    // Darstellung und Farbton gab es bis ADR 0039; ihre Stellen bleiben leer
    // stehen, damit das Schema nicht dorthin rutscht, wo ein älterer Code
    // etwas anderes führt.
    '-.-.' + SCHEMATA.map(function (t) { return t.wert; }).indexOf(s.schema);

  var abc = bkStaendeAus(state.abcBox, state.abcSeen, bkKennung);
  // Neuntes Feld: der Grammatikstand. Er führt Regeln, nicht Wörter — darum
  // bleibt er winzig, egal wie viel gelernt wurde.
  var regeln = bkStaendeAus(state.gramBox, state.gramSeen, bkKennung);
  // Zehntes Feld: die Schreibregeln. Auch sie führen Regeln, nicht Wörter.
  var schreib = bkStaendeAus(state.orthoBox, state.orthoSeen, bkKennung);

  // Elftes Feld: was man sich gemerkt hat (ADR 0067). Ein Fakt-Favorit steckt
  // seit jeher im Code — eine gemerkte Regel gehört genauso hinein. Die
  // Kennungen sind kurze Wörter aus [a-z0-9_-] mit einem Präfix; sie können
  // darum roh mit Punkten aneinandergereiht werden. **Angehängt, nicht
  // eingeschoben:** Ein älterer Code hat das Feld nicht, und ein älterer Leser
  // überliest es — beides geht nur, solange es hinten steht.
  var gemerkt = Object.keys(state.merk).sort().join('.');

  var rumpf = [BK_KOPF, woerter, saetze, fakten.join(''), zahlen, einst, abc, regeln,
    schreib, gemerkt].join('~');
  return rumpf + '~' + bkPruefsumme(rumpf);
}

// Was steckt in einem Stand? Sagt sowohl beim Erzeugen als auch nach dem
// Einlesen, worüber man gerade redet — sonst ist der Code eine Blackbox.
function bkUeberblick(st) {
  var w = 0, sa = 0;
  Object.keys(st.boxes).forEach(function (k) { if (st.boxes[k] > 0) w++; });
  Object.keys(st.satzBox).forEach(function (k) { if (st.satzBox[k] > 0) sa++; });
  var fa = Object.keys(st.fakten).length;
  var ab = 0;
  Object.keys(st.abcBox || {}).forEach(function (k) { if (st.abcBox[k] > 0) ab++; });
  var re = 0;
  Object.keys(st.gramBox || {}).forEach(function (k) { if (st.gramBox[k] > 0) re++; });
  var sr = 0;
  Object.keys(st.orthoBox || {}).forEach(function (k) { if (st.orthoBox[k] > 0) sr++; });
  return w + (w === 1 ? ' Wort' : ' Wörter') + ' · ' +
    sa + (sa === 1 ? ' Satz' : ' Sätze') + ' · ' +
    fa + (fa === 1 ? ' Fakt' : ' Fakten') +
    (ab ? ' · ' + ab + (ab === 1 ? ' Buchstabe' : ' Buchstaben') : '') +
    (re ? ' · ' + re + (re === 1 ? ' Regel' : ' Regeln') : '') +
    (sr ? ' · ' + sr + (sr === 1 ? ' Schreibregel' : ' Schreibregeln') : '');
}

function decodeBackup(code) {
  var roh = String(code).replace(/\s+/g, '');
  // Ein Code aus Format 1 ist Base64 und trägt weder Kopf noch Trennzeichen.
  if (roh.indexOf(BK_KOPF + '~') !== 0) return JSON.parse(decodeURIComponent(escape(atob(roh))));

  // Ältere Codes tragen sieben Felder, neuere acht (die Buchstaben kamen dazu).
  // Die Prüfsumme steht immer zuletzt und deckt alles davor ab.
  var teile = roh.split('~');
  if (teile.length < 7) throw new Error('unvollständig');
  var letzte = teile.length - 1;
  if (bkPruefsumme(teile.slice(0, letzte).join('~')) !== teile[letzte]) throw new Error('Prüfsumme');

  var t = bkNachschlagen();
  var d = defaultState();
  bkStaendeNach(teile[1], t.woerter, d.boxes, d.lastSeen);
  bkStaendeNach(teile[2], t.saetze, d.satzBox, d.satzSeen);
  if (teile.length > 7) bkStaendeNach(teile[6], t.buchstaben, d.abcBox, d.abcSeen);
  // Ältere Codes haben sieben oder acht Felder; ihr Grammatikstand bleibt leer.
  if (teile.length > 8) bkStaendeNach(teile[7], t.regeln, d.gramBox, d.gramSeen);
  // Und wer noch kein zehntes Feld kennt, hat schlicht keine Schreibregeln gelernt.
  if (teile.length > 9) bkStaendeNach(teile[8], t.schreibung, d.orthoBox, d.orthoSeen);
  // Elftes Feld: gemerkte Erklärungen (ADR 0067). Eine Regel, die es nicht mehr
  // gibt, fällt weg — dieselbe Regel wie bei den Inhalten oben.
  if (teile.length > 10 && teile[9]) {
    teile[9].split('.').forEach(function (k) {
      var t2 = k.split(':');
      if (t2.length !== 2) return;
      var da = t2[0] === 'g' ? gramFinde(t2[1]) : t2[0] === 'o' ? orthoFinde(t2[1]) : null;
      if (da) d.merk[k] = 1;
    });
  }

  var f = teile[3];
  for (var i = 0; i + BK_KENNUNG + 3 <= f.length; i += BK_KENNUNG + 3) {
    var id = t.fakten[f.slice(i, i + BK_KENNUNG)];
    if (!id) continue;
    d.fakten[id] = {
      n: parseInt(f.slice(i + BK_KENNUNG, i + BK_KENNUNG + 2), 36) || 0,
      f: f.charAt(i + BK_KENNUNG + 2) === '1'
    };
  }

  var z = teile[4].split('.').map(function (x) { return parseInt(x, 36) || 0; });
  d.streak = z[0]; d.bestStreak = z[1]; d.answered = z[2]; d.factIdx = z[3];
  d.typingStats = { correct: z[4] || 0, wrong: z[5] || 0 };
  d.transStats = { correct: z[6] || 0, wrong: z[7] || 0 };

  var e = teile[5].split('.');
  var schalter = e[0] || '';
  // Was der Code nicht führt, behält seine Vorgabe. Sonst machte ein älterer
  // Code aus jeder später hinzugekommenen Einstellung ein «aus».
  BK_SETTINGS.forEach(function (k, n) {
    if (k && n < schalter.length) d.settings[k] = schalter.charAt(n) === '1';
  });
  d.settings.tippenStufe = parseInt(e[1], 10) || 3;
  // Nicht `|| 21`: Eine gesicherte Null ist eine Entscheidung, keine Lücke
  // (ADR 0074). Die Grenzen zieht danach `mergeState()`.
  var frist = parseInt(e[2], 10);
  d.settings.auffrischen = isNaN(frist) ? 21 : frist;
  // An Stelle 4 und 5 standen bis ADR 0039 Darstellung und Farbton; heute steht
  // dort ein «-». Ein Code von damals wird über dieselben Regeln übersetzt wie
  // ein alter Lernstand, ein Code ohne Angabe bleibt bei der Vorgabe.
  var schema = SCHEMATA[parseInt(e[5], 10)];
  if (schema) d.settings.schema = schema.wert;
  else if (e.length > 4 && e[4] !== '-') {
    d.settings.schema = schemaAusAchsen(DARSTELLUNG_ALT[parseInt(e[3], 10)],
      FARBTOENE_ALT[parseInt(e[4], 10)]);
  }
  return d;
}

// ── Bilanz im Detail ────────────────────────────────────────
// Gezeigt werden nur Zahlen und Themen — nie eine Liste von Wörtern oder
// Sätzen, die man noch nicht kennt. Die Bilanz soll den Stand zeigen, nicht
// den Lehrplan verraten.
function renderBilanzDetail() {
  var html = '<section>';

  if (bilanzDetail === 'woerter') {
    var counts = [];
    for (var i = 0; i <= BOX_MAX; i++) counts.push(0);
    ALL_VOCAB.forEach(function (v) { counts[state.boxes[v.id] || 0]++; });
    var teile = counts.map(function (n, bi) {
      return {
        wert: n, farbe: STUFEN_FARBE[bi],
        name: bi === 0 ? 'Noch nicht begonnen' : (bi === BOX_MAX ? 'Stufe ' + bi + ' · sitzt' : 'Stufe ' + bi)
      };
    });
    html += donut(teile, counts[BOX_MAX], 'von ' + ALL_VOCAB.length + ' gemeistert') +
      legende(teile.slice().reverse());

    var faellig = faelligeAnzahl(ALL_VOCAB);
    html += '<p class="detail-fuss">' +
      (ALL_VOCAB.length - counts[0]) + ' Wörter begonnen, ' + counts[BOX_MAX] + ' sitzen. ' +
      (faellig ? faellig + (faellig === 1 ? ' Wort ist' : ' Wörter sind') + ' zur Wiederholung fällig.'
        : 'Gerade ist nichts fällig.') + '</p>';

    var themen = Object.keys(VOCAB_THEMES).map(function (t) {
      var ids = VOCAB_THEMES[t].map(function (w) { return w[0]; });
      return {
        name: t, gesamt: ids.length,
        gemeistert: ids.filter(function (id) { return (state.boxes[id] || 0) >= BOX_MAX; }).length,
        begonnen: ids.filter(function (id) { return (state.boxes[id] || 0) > 0; }).length
      };
    });
    var angefangen = themen.filter(function (t) { return t.begonnen > 0; });
    html += '<h2>Nach Themen</h2>';
    if (!angefangen.length) {
      html += '<p class="detail-fuss">Hier erscheint jedes Thema, sobald du das erste Wort ' +
        'daraus angefangen haben.</p>';
    } else {
      html += '<div class="theme-list">';
      angefangen.sort(function (a, b) { return b.gemeistert - a.gemeistert; }).forEach(function (t) {
        html += balkenZeile(t.name, t.gemeistert, t.gesamt);
      });
      html += '</div><p class="detail-fuss">' + angefangen.length + ' von ' + themen.length +
        ' Themen angefangen · der Balken zeigt, wie viel davon sitzt.</p>';
    }
  }

  if (bilanzDetail === 'saetze') {
    var sitzt = 0, offen = 0, gesperrt = 0;
    // Erst «sitzt», dann «frei»: sonst zählte ein gelernter Satz, dessen Wörter
    // zwischenzeitlich zurückgefallen sind, als gesperrt — und das Detail
    // zeigte eine andere Zahl als die Kachel, die hierher führt.
    SENTENCES.forEach(function (x) {
      if (satzBox(x) >= BOX_MAX) sitzt++;
      else if (satzFrei(x)) offen++;
      else gesperrt++;
    });
    var st = [
      { wert: sitzt, farbe: 'var(--akzent)', name: 'Sitzt' },
      { wert: offen, farbe: 'var(--ice)', name: 'Freigeschaltet, noch offen' },
      { wert: gesperrt, farbe: 'var(--line)', name: 'Noch gesperrt' }
    ];
    html += donut(st, sitzt, 'von ' + SENTENCES.length + ' sitzen') + legende(st);

    var stufen = [];
    SENTENCES.forEach(function (x) { if (stufen.indexOf(x.stufe) === -1) stufen.push(x.stufe); });
    stufen.sort(function (a, b) { return a - b; });
    html += '<h2>Nach Stufen</h2><div class="theme-list">';
    stufen.forEach(function (n) {
      var liste = stufenSaetze(n);
      var s2 = liste.filter(function (x) { return satzBox(x) >= BOX_MAX; }).length;
      html += balkenZeile('Stufe ' + n, s2, liste.length);
    });
    html += '</div><p class="detail-fuss">Ein Satz wird frei, sobald jedes seiner Wörter ' +
      'Stufe ' + SATZ_STUFE + ' erreicht hat, und gilt als sitzend nach ' + BOX_MAX +
      ' richtigen Übersetzungen.</p>';
  }

  if (bilanzDetail === 'antworten') {
    var tp = state.typingStats, tr = state.transStats;
    var tpG = tp.correct + tp.wrong, trG = tr.correct + tr.wrong;
    html += '<div class="donut-paar"><div>' +
      donut([{ wert: tp.correct, farbe: 'var(--good)' }, { wert: tp.wrong, farbe: 'var(--bad)' }],
        tpG ? Math.round(tp.correct / tpG * 100) + ' %' : '—', 'Tippen', true) +
      '</div><div>' +
      donut([{ wert: tr.correct, farbe: 'var(--good)' }, { wert: tr.wrong, farbe: 'var(--bad)' }],
        trG ? Math.round(tr.correct / trG * 100) + ' %' : '—', 'Übersetzen', true) +
      '</div></div>';
    html += legende([
      { wert: tp.correct + tr.correct, farbe: 'var(--good)', name: 'Richtig' },
      { wert: tp.wrong + tr.wrong, farbe: 'var(--bad)', name: 'Falsch' }
    ]);
    html += '<p class="detail-fuss">' + state.answered + ' Antworten insgesamt — darin zählen ' +
      'auch «Lernsets» und «Freestyle», die keine Fehlerquote führen. Die beiden Ringe zeigen ' +
      'nur, wo mitgezählt wird.</p>';
  }

  if (bilanzDetail === 'serie') {
    var jetzt = state.streak, best = state.bestStreak;
    html += donut([
      { wert: jetzt, farbe: 'var(--akzent)' },
      { wert: Math.max(0, best - jetzt), farbe: 'var(--line)' }
    ], jetzt, best ? 'von ' + best + ' in Folge' : 'in Folge');
    html += '<p class="detail-fuss">Die Serie zählt richtige Antworten hintereinander und ' +
      'fällt bei jedem Fehler auf null. Ab drei erscheint sie oben auf Home.' +
      (best > jetzt ? ' Deine beste Reihe waren ' + best + '.' : '') +
      (best && jetzt === best ? ' Das ist zugleich deine beste Reihe.' : '') + '</p>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="detailBack">Zurück zur Bilanz</button>' +
    '</div></section>';
  main.innerHTML = html;
  document.getElementById('detailBack').addEventListener('click', function () {
    bilanzDetail = null;
    renderBilanz();
    renderKopf();
  });
}

// ── Defizite ────────────────────────────────────────────────
// **Die App weiß vier Dinge über die eigenen Schwächen** und hat sie bisher
// nur für sich behalten: die zurückgefallenen Wörter (ADR 0033), das
// Fehlerprofil (ADR 0056), die Buchstaben unter der Schwelle und was gerade
// überfällig ist. Sie stehen an drei verschiedenen Stellen im Zustand — hier
// kommen sie zusammen.
//
// **Jede Zeile nennt einen Weg dorthin.** Ein Defizit ohne Ausgang ist ein
// Vorwurf; mit Ausgang ist es ein Vorschlag. Wo die zuständige Übung gerade
// nicht offen ist, entfällt der Knopf — er führte sonst ins Leere.
function defizite() {
  var raus = [];
  var jetzt = Date.now();

  // 1 · Zurückgefallen. Dreimal falsch geschrieben heißt: Der Satz ist wieder
  // zu, und das Wort steht im Topf des Power-Trainings.
  var topf = ptPool();
  if (topf.length) {
    raus.push({
      titel: 'Zurückgefallen',
      zahl: topf.length,
      text: topf.slice(0, 4).map(function (v) { return v.ru; }).join(', ') +
        (topf.length > 4 ? ' und ' + (topf.length - 4) + ' weitere' : ''),
      warum: topf.length === 1
        ? 'Ein Wort ist dreimal hintereinander falsch geschrieben worden und hat damit seinen Satz geschlossen.'
        : 'Diese Wörter sind dreimal hintereinander falsch geschrieben worden und haben damit ihre Sätze geschlossen.',
      ziel: ptOffen() ? 'power' : null,
      knopf: 'Zum Power-Training'
    });
  }

  // 2 · Verwechslungen. Nur Paare, die mehr als einmal vorkamen — ein
  // einzelner Fehlgriff ist ein Ausrutscher, kein Muster.
  var paare = [];
  Object.keys(state.verwechselt || {}).forEach(function (id) {
    var v = VOKABEL[id];
    if (!v) return;
    Object.keys(state.verwechselt[id]).forEach(function (mit) {
      var w = VOKABEL[mit];
      if (!w || state.verwechselt[id][mit] < 2) return;
      paare.push({ n: state.verwechselt[id][mit], text: v.ru + ' / ' + w.ru });
    });
  });
  paare.sort(function (a, b) { return b.n - a.n; });
  if (paare.length) {
    raus.push({
      titel: 'Verwechselt',
      zahl: paare.length,
      text: paare.slice(0, 3).map(function (p) { return p.text; }).join(' · '),
      warum: 'Diese Wörter hast du mehrfach füreinander gehalten. Sie kommen dir ' +
        'in «Lernsets» und «Freestyle» künftig gemeinsam unter.',
      ziel: 'freestyle',
      knopf: 'Zu «Freestyle»'
    });
  }

  // 3 · Zeichen. Buchstaben unter der Satzschwelle tragen jedes Wort mit, in
  // dem sie vorkommen — sie sind das Defizit, das am weitesten wirkt.
  var wacklig = ALPHABET.filter(function (b) { return abcBox(b) < SATZ_STUFE; });
  if (wacklig.length) {
    raus.push({
      titel: 'Zeichen sitzen noch nicht',
      zahl: wacklig.length,
      text: wacklig.slice(0, 8).map(function (b) { return b[1]; }).join(' '),
      warum: 'Ein Buchstabe, der nicht sitzt, macht jedes Wort schwer, in dem er vorkommt.',
      ziel: 'buchstaben',
      knopf: 'Zu «Buchstaben»'
    });
  }

  // 4 · Überfällig. Nicht «offen» — das wäre der Lernweg. Fällig heißt: Es war
  // schon einmal da und die Frist ist um.
  var woerterFaellig = faelligeAnzahl(freigeschalteteWoerter());
  var saetzeFaellig = SENTENCES.filter(function (x) {
    return satzFrei(x) && satzBox(x) > 0 && satzFaellig(x, jetzt);
  }).length;
  if (woerterFaellig + saetzeFaellig > 0) {
    var teile = [];
    if (woerterFaellig) teile.push(woerterFaellig + (woerterFaellig === 1 ? ' Wort' : ' Wörter'));
    if (saetzeFaellig) teile.push(saetzeFaellig + (saetzeFaellig === 1 ? ' Satz' : ' Sätze'));
    raus.push({
      titel: 'Überfällig',
      zahl: woerterFaellig + saetzeFaellig,
      text: teile.join(' · '),
      warum: 'Die Wiedervorlage ist durch. Je länger es liegt, desto mehr davon ' +
        'musst du neu lernen statt aufzufrischen.',
      ziel: woerterFaellig >= saetzeFaellig ? 'lernsets' : 'uebersetzen',
      knopf: woerterFaellig >= saetzeFaellig ? 'Zu «Lernsets»' : 'Zu «Übersetzen»'
    });
  }
  return raus;
}

function defiziteHtml() {
  var liste = defizite();
  var html = '<h2>Defizite</h2>';
  if (!liste.length) {
    return html + '<p class="backup-note">Nichts liegt quer: keine zurückgefallenen ' +
      'Wörter, keine wiederkehrenden Verwechslungen, alle Zeichen sitzen, nichts ' +
      'überfällig. Hier steht sonst, woran es gerade hakt.</p>';
  }
  html += '<div class="defizite">';
  liste.forEach(function (d, i) {
    html += '<div class="defizit">' +
      '<div class="defizit-kopf"><span class="defizit-titel">' + esc(d.titel) + '</span>' +
      '<span class="defizit-zahl">' + d.zahl + '</span></div>' +
      '<p class="defizit-text' + (d.titel === 'Zeichen sitzen noch nicht' ||
        d.titel === 'Zurückgefallen' || d.titel === 'Verwechselt' ? ' cyr' : '') + '">' +
      esc(d.text) + '</p>' +
      '<p class="defizit-warum">' + esc(d.warum) + '</p>' +
      (d.ziel ? '<button class="blatt-link" data-defizit="' + esc(d.ziel) + '">' +
        esc(d.knopf) + ' →</button>' : '') +
      '</div>';
  });
  return html + '</div>';
}

function renderBilanz() {
  if (bilanzDetail) { renderBilanzDetail(); return; }
  var counts = [];
  for (var i = 0; i <= BOX_MAX; i++) counts.push(0);
  ALL_VOCAB.forEach(function (v) { counts[state.boxes[v.id] || 0]++; });
  var mastered = counts[BOX_MAX];
  var started = ALL_VOCAB.length - counts[0];
  var readTotal = 0;
  readTotal = SENTENCES.length;
  var satzSitzt = SENTENCES.filter(function (s) { return satzBox(s) >= BOX_MAX; }).length;
  var readFrei = SENTENCES.filter(satzFrei).length;

  function stat(label, value, ziel, accent) {
    return '<button class="stat' + (accent ? ' accent' : '') + '" data-detail="' + ziel + '">' +
      '<span class="stat-value">' + value + '</span>' +
      '<span class="stat-label">' + label + '</span>' +
      '<span class="stat-mehr">Mehr</span></button>';
  }

  var html = '<section><div class="stats-grid">' +
    stat('Wörter gesamt', ALL_VOCAB.length, 'woerter') +
    stat('Begonnen', started, 'woerter') +
    stat('Gemeistert', mastered, 'woerter', true) +
    stat('Sätze sitzen', satzSitzt + '/' + readFrei, 'saetze') +
    stat('Beantwortet', state.answered, 'antworten') +
    stat('Beste Serie', state.bestStreak, 'serie', true) +
    '</div>';

  // **Vor dem Lernweg.** Was quer liegt, gehört nach oben — darunter steht,
  // wie weit man ist, und das liest sich anders, wenn man weiß, was klemmt.
  html += defiziteHtml();

  var aktuell = aktuellesSet();
  var frei = freigeschalteteWoerter();
  html += '<h2>Lernweg</h2><div class="theme-list">' +
    '<div class="theme-row"><span class="theme-name">Lernset</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + ((aktuell + 1) / LERNSETS.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + (aktuell + 1) + '/' + LERNSETS.length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Im Tippen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (tippenPool().length / ALL_VOCAB.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + tippenPool().length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Sätze offen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (readFrei / readTotal * 100) + '%"></div></div>' +
    '<span class="theme-count">' + readFrei + '/' + readTotal + '</span></div></div>' +
    '<p class="backup-note">Im laufenden Set fehlen noch ' +
    (LERNSETS[aktuell].woerter.length - setReif(aktuell)) + ' Wörter bis zu ' +
    LERNSETS[aktuell].saetze.length + ' weiteren Sätzen · ' + faelligeAnzahl(frei) +
    ' Wiederholungen fällig</p>';

  // Der Balken zeigt, was sitzt; die Zahl daneben, was gemeistert ist — dieselbe
  // Unterscheidung wie beim Wortschatz.
  var abcSitzen = abcGelernt();
  var abcMeister = abcMeisterschaft();
  if (abcSitzen > 0 || abcPool().length < ALPHABET.length) {
    html += '<div class="theme-list"><div class="theme-row">' +
      '<span class="theme-name">Buchstaben</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' +
      (abcSitzen / ALPHABET.length * 100) + '%"></div></div>' +
      '<span class="theme-count">' + abcSitzen + '/' + ALPHABET.length + '</span></div></div>' +
      '<p class="backup-note">' + abcSitzen + ' Buchstaben sitzen · ' + abcMeister +
      ' gemeistert</p>';
  }

  // Tempo: eine Beobachtung, kein Urteil. Sie steht erst da, wenn genug
  // gemessen wurde — eine Zahl aus drei Antworten wäre Rauschen.
  var tempoZeilen = [];
  UEBUNGEN.forEach(function (u) {
    var sek = tempoSchnitt(u.id);
    if (sek !== null) tempoZeilen.push(u.name + ' ' + sek.toFixed(1) + ' s');
  });
  if (tempoZeilen.length) {
    html += '<h2>Tempo</h2><p class="backup-note">Im Schnitt je Antwort: ' +
      esc(tempoZeilen.join(' · ')) + '. Was schnell kommt, sitzt — was lange dauert, ' +
      'ist gewusst, aber noch nicht abrufbar.</p>';
  }

  // Die Erinnerung an die Sicherung: eine Zeile, kein Blatt. Wer sie ignoriert,
  // wird nicht bedrängt — sie steht beim nächsten Mal wieder da.
  if (sicherungFaellig()) {
    var alter = sicherungAlter();
    html += '<p class="backup-note warnung">' +
      (alter === -1
        ? 'Du hast noch nie einen Sicherungscode erzeugt.'
        : 'Deine letzte Sicherung ist ' + alter + ' Tage her.') +
      ' Dein Fortschritt liegt nur auf diesem Gerät — im Menü unter «Sicherung» ' +
      'gibt es einen Code zum Kopieren.</p>';
  }

  html += '<h2>Leitner-Stufen</h2><div class="boxes">';
  counts.forEach(function (n, bi) {
    var h = Math.max(4, n / ALL_VOCAB.length * 100);
    html += '<div class="boxstat"><div class="boxbar-wrap">' +
      '<div class="boxbar' + (bi === BOX_MAX ? ' gold' : '') + '" style="height:' + h + '%"></div></div>' +
      '<span class="boxnum">' + n + '</span><span class="boxlabel">' + (bi === 0 ? 'neu' : 'St. ' + bi) + '</span></div>';
  });
  html += '</div>';

  // Nur Themen mit Fortschritt; der Rest steht hinter «alle anzeigen».
  var themen = Object.keys(VOCAB_THEMES).map(function (t) {
    var ids = VOCAB_THEMES[t].map(function (w) { return w[0]; });
    return {
      name: t,
      gesamt: ids.length,
      gemeistert: ids.filter(function (id) { return (state.boxes[id] || 0) >= BOX_MAX; }).length,
      begonnen: ids.filter(function (id) { return (state.boxes[id] || 0) > 0; }).length
    };
  });
  var mitFortschritt = themen.filter(function (t) { return t.gemeistert > 0; });
  var zeigen = themenOffen ? themen : mitFortschritt;

  html += '<h2>Nach Themen (gemeistert)</h2>';
  if (!zeigen.length) {
    html += '<p class="backup-note">Noch kein Thema gemeistert — hier erscheint jedes Thema, sobald ' +
      'das erste Wort daraus Stufe ' + BOX_MAX + ' erreicht.</p>';
  }
  html += '<div class="theme-list">';
  zeigen.forEach(function (t) {
    html += '<div class="theme-row"><span class="theme-name">' + esc(t.name) + '</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' + (t.gemeistert / t.gesamt * 100) + '%"></div></div>' +
      '<span class="theme-count">' + t.gemeistert + '/' + t.gesamt + '</span></div>';
  });
  html += '</div>';
  if (themen.length > mitFortschritt.length) {
    html += '<button class="mehr" id="themenMehr">' +
      (themenOffen ? 'Nur Themen mit Fortschritt' : 'Alle ' + themen.length + ' Themen anzeigen') +
      '</button>';
  }

  var gesehen = FACTS.filter(function (f) { return faktStand(f).n > 0; }).length;
  var favoriten = FACTS.filter(function (f) { return faktStand(f).f; }).length;
  html += '<h2>Sprachfakten</h2>' +
    '<p class="backup-note">' + gesehen + ' von ' + FACTS.length + ' gesehen · ' +
    favoriten + ' als Favorit gemerkt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="zuFakten">Fakten durchgehen</button></div>';

  // **Gemerkte Erklärungen** (ADR 0067) — dieselbe Frage wie beim Fakt: Was
  // habe ich mir aufgehoben? Der Abschnitt steht auch leer da, denn sonst
  // erführe niemand, dass es den Stern gibt.
  var gemerkt = gemerkteRegeln();
  html += '<h2>Gemerkte Regeln</h2>' +
    '<p class="backup-note">' + (gemerkt.length
      ? gemerkt.length + (gemerkt.length === 1 ? ' Erklärung' : ' Erklärungen') +
        ' hast du dir aufgehoben.'
      : 'Noch keine. In «Grammatik» und «Schreibung» sitzt ein Stern an jeder Regelkarte.') +
    '</p>' +
    (gemerkt.length
      ? '<div class="btn-row"><button class="btn ghost" id="zuMerk">Regeln nachlesen</button></div>'
      : '');

  html += '<h2>Sicherung</h2>' +
    '<p class="backup-note">Dein Fortschritt als kopierbarer Code steht im Men\u00fc unter \u00abSicherung\u00bb \u2014 dort wird er erzeugt und dort auch wieder eingespielt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="zuSicherung">Zur Sicherung</button></div>';

  html += '</section>';

  main.innerHTML = html;

  document.getElementById('zuSicherung').addEventListener('click', function () { setTab('sicherung'); });
  main.querySelectorAll('[data-detail]').forEach(function (b) {
    b.addEventListener('click', function () {
      bilanzDetail = b.dataset.detail;
      window.scrollTo(0, 0);
      renderBilanz();
      renderKopf();
    });
  });
  // Jedes Defizit nennt einen Weg dorthin — ein Defizit ohne Ausgang ist ein
  // Vorwurf, mit Ausgang ein Vorschlag.
  main.querySelectorAll('[data-defizit]').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.defizit); });
  });
  document.getElementById('zuFakten').addEventListener('click', function () { setTab('fakten'); });
  var zuMerk = document.getElementById('zuMerk');
  if (zuMerk) zuMerk.addEventListener('click', function () { setTab('merkzettel'); });
  var mehr = document.getElementById('themenMehr');
  if (mehr) mehr.addEventListener('click', function () { themenOffen = !themenOffen; renderBilanz(); });
}

// ── ÜBERSICHT EINRICHTEN ────────────────────────────────────
// **Drei Rubriken, ein Fenster** (ADR 0075). Bis 2.4.16 war das eine Reihe von
// acht Schaltern in den Einstellungen — sie konnte nur «zeigen» und
// «wegräumen», und die Ordnung oben blieb der App überlassen.
//
// Gespeichert wird **das Abweichende**, nicht der Bestand: `homeAus` sagt, was
// versteckt ist, `homeOben` (oder null) was oben steht. Eine neue Übung taucht
// damit von selbst unter «Weitere» auf, statt still zu fehlen — dieselbe Regel
// wie seit ADR 0066.
var EINR_RUBRIKEN = [
  { id: 'oben', titel: 'Meine Auswahl',
    note: 'Steht auf der Übersicht ganz oben — auch dann, wenn dort gerade nichts zu tun ist.' },
  { id: 'weitere', titel: 'Weitere Übungen',
    note: 'Liegt hinter dem Knopf «Weitere Übungen».' },
  { id: 'versteckt', titel: 'Versteckt',
    note: 'Taucht auf der Übersicht nicht auf und wird auch nicht vorgeschlagen. Die Übung bleibt erreichbar — im Tutorial stehen alle da.' }
];

// In welcher Rubrik steckt eine Übung gerade?
function einrRubrik(id) {
  if (!kachelSichtbar(id)) return 'versteckt';
  return homeOben(null).indexOf(id) !== -1 ? 'oben' : 'weitere';
}

// Verschieben — und zwar so, dass hinterher **beide** Listen stimmen. Wer nur
// eine anfasst, bekommt eine Übung, die in zwei Rubriken steht.
function einrSetzen(id, rubrik, wohin) {
  var aus = (state.settings.homeAus || []).slice();
  var i = aus.indexOf(id);
  // Die obere Rubrik wird mit der ersten Bewegung von Hand eingerichtet: Was
  // die Automatik gerade zeigt, ist der Ausgangspunkt — sonst spränge beim
  // ersten Ziehen alles andere weg.
  var oben = (state.settings.homeOben || homeOben(null)).slice();
  var k = oben.indexOf(id);
  if (k !== -1) oben.splice(k, 1);
  if (i !== -1) aus.splice(i, 1);

  if (rubrik === 'versteckt') aus.push(id);
  if (rubrik === 'oben') {
    var stelle = typeof wohin === 'number' ? Math.max(0, Math.min(oben.length, wohin)) : oben.length;
    oben.splice(stelle, 0, id);
  }
  state.settings.homeAus = aus;
  state.settings.homeOben = oben;
  save();
}

function einrZeileHtml(id, rubrik, erster, letzter) {
  var u = uebungVon(id);
  if (!u) return '';
  return '<div class="einr-zeile" data-eid="' + esc(id) + '" data-rubrik="' + esc(rubrik) + '">' +
    '<span class="einr-griff" aria-hidden="true"></span>' +
    '<span class="einr-name">' + esc(u.name) + '</span>' +
    '<button class="einr-pfeil" data-hoch="' + esc(id) + '"' + (erster ? ' disabled' : '') +
    ' aria-label="' + esc(u.name) + ' eine Rubrik nach oben">' + ICON.winkelRunter + '</button>' +
    '<button class="einr-pfeil" data-runter="' + esc(id) + '"' + (letzter ? ' disabled' : '') +
    ' aria-label="' + esc(u.name) + ' eine Rubrik nach unten">' + ICON.winkelRunter + '</button>' +
    '</div>';
}

function renderEinrichten() {
  var html = '<section>' +
    '<p class="settings-note">Zieh eine Übung in eine andere Rubrik — oder nimm die ' +
    'beiden Pfeile, wenn das Ziehen hakt. Die Reihenfolge in «Meine Auswahl» ist die ' +
    'Reihenfolge auf der Übersicht.</p>';

  EINR_RUBRIKEN.forEach(function (r, ri) {
    var drin = alleUebungIds().filter(function (id) { return einrRubrik(id) === r.id; });
    if (r.id === 'oben' && state.settings.homeOben) {
      // Von Hand eingerichtet: die gespeicherte Reihenfolge, nicht die des Lehrplans.
      drin = state.settings.homeOben.filter(function (id) { return einrRubrik(id) === 'oben'; });
    }
    html += '<h2>' + esc(r.titel) + '</h2>' +
      '<p class="settings-note einr-note">' + esc(r.note) + '</p>' +
      '<div class="einr-liste" data-liste="' + r.id + '">';
    drin.forEach(function (id) {
      html += einrZeileHtml(id, r.id, ri === 0, ri === EINR_RUBRIKEN.length - 1);
    });
    if (!drin.length) html += '<p class="einr-leer">Nichts hier. Zieh etwas herüber.</p>';
    html += '</div>';
  });

  html += '<div class="btn-row">' +
    '<button class="btn ghost" id="einrAuto">Automatisch verteilen</button>' +
    '<button class="btn primary" id="einrFertig">Fertig</button></div>' +
    '<p class="settings-note">«Automatisch verteilen» gibt die obere Rubrik wieder der ' +
    'App: Sie zeigt dann, was gerade fällig ist, höchstens drei. Versteckte Übungen ' +
    'bleiben versteckt — das ist eine eigene Entscheidung.</p></section>';
  main.innerHTML = html;

  document.getElementById('einrAuto').addEventListener('click', function () {
    state.settings.homeOben = null;
    save();
    renderEinrichten();
  });
  document.getElementById('einrFertig').addEventListener('click', function () { setTab('home'); });
  main.querySelectorAll('[data-hoch]').forEach(function (b) {
    b.addEventListener('click', function () { einrSchieben(b.dataset.hoch, -1); });
  });
  main.querySelectorAll('[data-runter]').forEach(function (b) {
    b.addEventListener('click', function () { einrSchieben(b.dataset.runter, 1); });
  });
  einrZiehenBinden();
}

// Eine Rubrik weiter — der Weg für Finger, die nicht ziehen wollen, und der
// einzige, den eine Tastatur kennt.
function einrSchieben(id, richtung) {
  var jetzt = einrRubrik(id);
  var i = 0;
  EINR_RUBRIKEN.forEach(function (r, k) { if (r.id === jetzt) i = k; });
  var ziel = EINR_RUBRIKEN[i + richtung];
  if (!ziel) return;
  einrSetzen(id, ziel.id);
  renderEinrichten();
}

// ── Ziehen ──────────────────────────────────────────────────
// Zeigerereignisse statt Touch: Sie decken Finger, Maus und Stift mit einem
// Satz Zuhörer ab, und `setPointerCapture` hält den Zeiger auch dann bei der
// Zeile, wenn sie unter ihm wegrutscht. Erst ab acht Pixeln wird daraus ein
// Ziehen — sonst verlöre jeder Tipp auf einen Pfeil sein Ereignis.
var einrZug = null;

function einrZiehenBinden() {
  main.querySelectorAll('.einr-zeile').forEach(function (zeile) {
    zeile.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('.einr-pfeil')) return;
      einrZug = {
        el: zeile, id: zeile.dataset.eid,
        startY: e.clientY, startX: e.clientX, laeuft: false,
        breite: zeile.getBoundingClientRect().width,
        griffY: e.clientY - zeile.getBoundingClientRect().top
      };
      try { zeile.setPointerCapture(e.pointerId); } catch (err) { /* dann eben ohne */ }
    });
    zeile.addEventListener('pointermove', function (e) {
      if (!einrZug || einrZug.el !== zeile) return;
      if (!einrZug.laeuft) {
        if (Math.abs(e.clientY - einrZug.startY) < 8 &&
          Math.abs(e.clientX - einrZug.startX) < 8) return;
        einrZug.laeuft = true;
        zeile.classList.add('zieht');
        zeile.style.width = einrZug.breite + 'px';
      }
      e.preventDefault();
      zeile.style.top = (e.clientY - einrZug.griffY) + 'px';
      einrZielZeigen(e.clientY);
    });
    var loslassen = function (e) {
      if (!einrZug || einrZug.el !== zeile) return;
      var lief = einrZug.laeuft;
      var y = e.clientY;
      zeile.classList.remove('zieht');
      zeile.style.width = '';
      zeile.style.top = '';
      einrZug = null;
      main.querySelectorAll('.einr-liste').forEach(function (l) { l.classList.remove('ziel'); });
      if (!lief) return;
      var ziel = einrListeBei(y);
      if (!ziel) return;
      einrSetzen(zeile.dataset.eid, ziel.dataset.liste, einrStelleBei(ziel, y));
      renderEinrichten();
    };
    zeile.addEventListener('pointerup', loslassen);
    zeile.addEventListener('pointercancel', loslassen);
  });
}

// Über welcher Rubrik hängt der Finger? Gemessen an den Kästen, nicht über
// `elementFromPoint` — die gezogene Zeile läge sonst immer selbst darunter.
function einrListeBei(y) {
  var treffer = null;
  main.querySelectorAll('.einr-liste').forEach(function (l) {
    var r = l.getBoundingClientRect();
    if (y >= r.top - 12 && y <= r.bottom + 12) treffer = l;
  });
  return treffer;
}
function einrZielZeigen(y) {
  var ziel = einrListeBei(y);
  main.querySelectorAll('.einr-liste').forEach(function (l) {
    l.classList.toggle('ziel', l === ziel);
  });
}
// An welcher Stelle innerhalb der Rubrik? Über der Mitte einer Zeile heißt
// davor — das ist die Erwartung, die jede Liste der Welt weckt.
function einrStelleBei(liste, y) {
  var stelle = 0;
  liste.querySelectorAll('.einr-zeile').forEach(function (z) {
    if (z.classList.contains('zieht')) return;
    var r = z.getBoundingClientRect();
    if (y > r.top + r.height / 2) stelle++;
  });
  return stelle;
}

// ── SICHERUNG ───────────────────────────────────────────────
// Eigene Rubrik im Menü statt eines Anhangs unter der Bilanz: Wer seinen
// Stand sichern oder auf ein anderes Gerät holen will, sucht ihn nicht unter
// Zahlen zum Lernfortschritt. Das Zurücksetzen steht hier mit — es ist die
// Kehrseite derselben Sache und gehört neben den Code, der es auffangen kann.
function renderSicherung() {
  var html = '<section>';
  html += '<p class="backup-note">Dein Fortschritt als kopierbarer Code \u2014 unabh\u00e4ngig vom automatischen ' +
    'Speichern. Er tr\u00e4gt eine Pr\u00fcfsumme: unvollst\u00e4ndig eingef\u00fcgt wird er abgewiesen statt ' +
    'halb \u00fcbernommen.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="bkMake">Sicherungscode erzeugen</button></div>';
  if (backupOpen) {
    html += '<p class="backup-note">' + esc(bkUeberblick(state)) + ' · ' +
      (backupCode.length / 1024).toFixed(1) + ' KB</p>' +
      '<textarea id="bkOut" readonly rows="3" aria-label="Sicherungscode">' + esc(backupCode) + '</textarea>';
  }
  html += '<textarea id="bkIn" rows="2" placeholder="Sicherungscode hier einf\u00fcgen \u2026" aria-label="Sicherungscode einfügen"></textarea>' +
    '<div class="btn-row"><button class="btn ghost" id="bkImport">Sicherung wiederherstellen</button></div>' +
    (backupMsg ? '<p class="session-info">' + esc(backupMsg) + '</p>' : '');

  html += '<div class="danger-zone">';
  if (!confirmReset) {
    html += '<button class="btn danger" id="rsAsk">Fortschritt zurücksetzen \u2026</button>';
  } else {
    html += '<div class="btn-row"><button class="btn ghost" id="rsNo">Abbrechen</button>' +
      '<button class="btn danger" id="rsYes">Endgültig löschen</button></div>';
  }
  html += '</div></section>';

  main.innerHTML = html;

  document.getElementById('bkMake').addEventListener('click', function () {
    backupCode = encodeBackup();
    backupOpen = true;
    backupMsg = '';
    // Erzeugt zählt als gesichert: Ob der Code danach wirklich irgendwo landet,
    // kann die App nicht wissen — und öfter zu erinnern als nötig wäre lästiger
    // als einmal zu wenig.
    state.gesichertAm = Date.now();
    save();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupCode).then(function () {
        backupMsg = 'Code in die Zwischenablage kopiert.';
        renderSicherung();
      }, function () {
        backupMsg = 'Bitte Code manuell markieren und kopieren.';
        renderSicherung();
      });
    } else {
      backupMsg = 'Bitte Code manuell markieren und kopieren.';
      renderSicherung();
    }
  });
  var out = document.getElementById('bkOut');
  if (out) out.addEventListener('focus', function () { out.select(); });
  document.getElementById('bkImport').addEventListener('click', function () {
    var code = document.getElementById('bkIn').value;
    if (!code.trim()) { backupMsg = 'Bitte zuerst einen Code einfügen.'; renderSicherung(); return; }
    try {
      var data = decodeBackup(code);
      if (!data || typeof data !== 'object' || !data.boxes) throw new Error('unlesbar');
      state = mergeState(data);
      // Der Sicherungscode führt die Jubelmarken nicht mit — er soll schlank
      // bleiben. Was der eingespielte Stand schon geschafft hat, gilt darum als
      // gefeiert; sonst käme das Fenster nach jeder Wiederherstellung erneut.
      setSchnittPruefen();
      jubelNachtragen();
      // Der Lernstand ist ein anderer — jede Übung muss neu aufbauen. Sonst
      // stünde in «Tippen» noch das alte Wort und in «Übersetzen» der alte Satz.
      ansichtenZuruecksetzen();
      backupOpen = false;
      save();
      updateDarstellung();
      updateKopf();
      backupMsg = 'Wiederhergestellt: ' + bkUeberblick(state) + '.';
    } catch (e) {
      backupMsg = e.message === 'Prüfsumme'
        ? 'Der Code ist beschädigt oder unvollständig — bitte noch einmal ganz einfügen.'
        : e.message === 'unvollständig'
          ? 'Der Code bricht mittendrin ab — bitte noch einmal ganz einfügen.'
          : 'Das ist kein Sicherungscode dieser App.';
    }
    renderSicherung();
  });
  var rsAsk = document.getElementById('rsAsk');
  if (rsAsk) rsAsk.addEventListener('click', function () { confirmReset = true; renderSicherung(); });
  var rsNo = document.getElementById('rsNo');
  if (rsNo) rsNo.addEventListener('click', function () { confirmReset = false; renderSicherung(); });
  var rsYes = document.getElementById('rsYes');
  if (rsYes) rsYes.addEventListener('click', function () {
    var behalten = state.settings; // Einstellungen sind kein Fortschritt
    state = defaultState();
    state.settings = behalten;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    ansichtenZuruecksetzen();
    confirmReset = false;
    backupOpen = false;
    backupMsg = '';
    updateKopf();
    save();
    renderSicherung();
  });
}

// ── Start ───────────────────────────────────────────────────
// Die Flamme steht dreimal im Kopf: in jedem runden Knopf, der die Chili
// beherbergen kann. Sie wird einmal eingesetzt, nicht bei jedem Zeichnen.
document.querySelectorAll('[data-flamme]').forEach(function (p) {
  p.innerHTML = ICON.flamme;
});
document.querySelectorAll('[data-symbol]').forEach(function (b) {
  b.insertAdjacentHTML('afterbegin', ICON[b.dataset.symbol] || '');
});
document.getElementById('filterZeichen').innerHTML = ICON.filter;
load();
ticketsLaden();
updateDarstellung();

// Jeder Tipp weckt den Klang. Nötig, weil iOS den Kontext beim Wegschalten
// anhält und `resume()` eine Nutzergeste verlangt — die Antwort selbst kommt
// dafür zu spät, sie soll ja schon klingen. Ein Aufwecken, das nichts zu tun
// hat, kostet nichts.
document.addEventListener('pointerdown', function () {
  tonEntsperren();
  tonWecken();
}, true);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) tonWecken();
});

// Ein Zuhörer für alle Hörknöpfe. Weil er am gleichbleibenden #main hängt und
// nicht an den Knöpfen selbst, überlebt er jeden Renderlauf.
main.addEventListener('click', function (e) {
  var k = e.target.closest ? e.target.closest('[data-say]') : null;
  if (k) speak(k.dataset.say, k.dataset.lang);
});

// Jede Ansicht setzt #main neu; der Beobachter merkt das und schickt die Chili
// zur passenden Station, ohne dass jede Renderfunktion daran denken muss.
if (window.MutationObserver) {
  new MutationObserver(function () { chiliAktualisieren(); }).observe(main, { childList: true });
}
// Erst zeichnen, dann die Chili das erste Mal setzen: sonst stünde sie kurz im
// Kopf (main ist noch leer) und spränge danach sichtbar auf ihren Platz in der
// Empfehlung — beim Neuladen sah das aus wie ein Fehler.
// **Nach einem Update dorthin zurück, wo getippt wurde** (ADR 0068). Vor dem
// ersten Zeichnen, damit die Übersicht gar nicht erst aufblitzt.
var swOrt = swOrtHolen();
if (swOrt) {
  currentTab = swOrt.tab;
  if (swOrt.reiter) einstReiter = swOrt.reiter;
  // Der Rückweg führt von dort nach Hause — der Stapel ist nach einem Neustart
  // leer, und ein «Zurück» ins Nichts wäre eine Sackgasse (ADR 0036).
  if (currentTab !== 'home') ansichtStapel = ['home'];
}

render();
menuSetzen(false);
chiliAktualisieren();
meldeKnopfZeigen();
netzZeigen();
speicherFesthalten();
swHinweisBinden();
swAnmelden();

// Beim allerersten Start das Tutorial anbieten — genau einmal. Wer nie eine
// Antwort gegeben hat, hat die App noch nicht gesehen; wer abbricht, bekommt
// die Frage nicht wieder.
if (!state.tutorialGesehen && state.answered === 0 && currentTab === 'home') {
  tutStarten('home', true);
}
</script>
