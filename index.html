  knopf.setAttribute('aria-expanded', auf ? 'true' : 'false');
  // Zugeklappt darf nichts darin erreichbar sein — sonst springt der Fokus
  // in ein unsichtbares Panel.
  document.getElementById('menuPanel').setAttribute('aria-hidden', auf ? 'false' : 'true');
  document.querySelectorAll('.menueintrag').forEach(function (b) {
    b.tabIndex = auf ? 0 : -1;
  });
  chiliAktualisieren();
}

// ── Auswahl (Filter) ────────────────────────────────────────
// Statt Klappmenüs und langer Chip-Reihen in jeder Übung: ein Knopf im Kopf,
// dahinter dasselbe Aufklapp-Panel wie beim Menü. Weicht die Auswahl vom
// Regelfall ab, färbt sich der Knopf wie ein gesetzter Chip.
var filterOffen = false;

function filterSetzen(auf) {
  filterOffen = auf && filterHatWahl();
  document.body.classList.toggle('filter-offen', filterOffen);
  var knopf = document.getElementById('filterKnopf');
  knopf.setAttribute('aria-expanded', filterOffen ? 'true' : 'false');
  document.getElementById('filterPanel').setAttribute('aria-hidden', filterOffen ? 'false' : 'true');
}

function filterHatWahl() {
  return currentTab === 'lernsets' || currentTab === 'freestyle' ||
    currentTab === 'tippen' || currentTab === 'uebersetzen' ||
    currentTab === 'buchstaben';
}

// Weicht etwas vom Regelfall ab? Nur dann ist der Knopf farbig.
function filterAktiv() {
  if (currentTab === 'lernsets') return uebAuswahl !== 'aktuell';
  if (currentTab === 'freestyle') return uebThema !== 'Alle';
  if (currentTab === 'tippen') return tippenModus !== 'lernen';
  if (currentTab === 'uebersetzen') {
    return trLevel !== 1 || trDir !== 'gemischt' || trModus !== 'lernen';
  }
  if (currentTab === 'buchstaben') return abcRichtung !== 'gemischt';
  return false;
}

function filterGruppe(titel, chips) {
  return '<div class="filtergruppe"><span class="filter-titel">' + esc(titel) +
    '</span><div class="filter-reihe">' + chips + '</div></div>';
}
function filterChip(gruppe, wert, text, gesetzt, gesperrt) {
  return '<button class="chip' + (gesetzt ? ' active' : '') + '" data-fw="' + gruppe +
    '" data-fv="' + esc(String(wert)) + '"' + (gesperrt ? ' disabled' : '') + '>' +
    esc(text) + '</button>';
}

function filterInhaltHtml() {
  if (currentTab === 'lernsets') {
    var aktuell = aktuellesSet();
    var chips = filterChip('set', 'aktuell', 'Aktuelles Set ' + (aktuell + 1), uebAuswahl === 'aktuell') +
      filterChip('set', 'alle', 'Alles Freigeschaltete', uebAuswahl === 'alle');
    var einzeln = '';
    LERNSETS.forEach(function (set, i) {
      einzeln += filterChip('set', i, 'Set ' + (i + 1), uebAuswahl === i, !setFrei(i));
    });
    return filterGruppe('Auswahl', chips) + filterGruppe('Einzelnes Set', einzeln);
  }
  if (currentTab === 'freestyle') {
    var themen = filterChip('thema', 'Alle', 'Alle', uebThema === 'Alle');
    Object.keys(VOCAB_THEMES).forEach(function (t) {
      themen += filterChip('thema', t, t, uebThema === t);
    });
    return filterGruppe('Thema', themen);
  }
  if (currentTab === 'tippen') {
    return filterGruppe('Stapel',
      filterChip('tmodus', 'lernen', 'Lernen · ' + tippenLernen().length, tippenModus === 'lernen') +
      filterChip('tmodus', 'wiederholung', 'Wiederholung · ' + tippenWiederholung().length,
        tippenModus === 'wiederholung'));
  }
  if (currentTab === 'uebersetzen') {
    var stufen = [];
    SENTENCES.forEach(function (x) { if (stufen.indexOf(x.stufe) === -1) stufen.push(x.stufe); });
    stufen.sort(function (a, b) { return a - b; });
    var st = '';
    stufen.forEach(function (n) {
      st += filterChip('stufe', n, 'Stufe ' + n + ' · ' + freieSaetze(n).length + '/' +
        stufenSaetze(n).length, trLevel === n);
    });
    return filterGruppe('Stufe', st) +
      filterGruppe('Richtung',
        filterChip('richtung', 'gemischt', 'Gemischt', trDir === 'gemischt') +
        filterChip('richtung', 'ru-de', 'RU \u2192 DE', trDir === 'ru-de') +
        filterChip('richtung', 'de-ru', 'DE \u2192 RU', trDir === 'de-ru')) +
      filterGruppe('Stapel',
        filterChip('trmodus', 'lernen', 'Lernen \u00b7 ' + trLernen(trLevel).length, trModus === 'lernen') +
        filterChip('trmodus', 'wiederholung', 'Wiederholung \u00b7 ' + trWiederholung(trLevel).length,
          trModus === 'wiederholung'));
  }
  if (currentTab === 'buchstaben') {
    // Die Tafel steckt im eigenen Knopf daneben, nicht mehr hier — sie ist
    // keine Einstellung, sondern ein zweiter Ort.
    return filterGruppe('Gefragt wird',
      filterChip('abcrichtung', 'gemischt', 'Gemischt', abcRichtung === 'gemischt') +
      filterChip('abcrichtung', 'zeichen', 'Zeichen \u2192 Laut', abcRichtung === 'zeichen') +
      filterChip('abcrichtung', 'laut', 'Laut \u2192 Zeichen', abcRichtung === 'laut'));
  }
  return '';
}

// Eine Auswahl wirkt sofort: Panel zu, Übung neu aufsetzen, Knopf nachziehen.
function filterWaehlen(gruppe, wert) {
  filterSetzen(false);
  if (gruppe === 'set') {
    uebAuswahl = (wert === 'aktuell' || wert === 'alle') ? wert : parseInt(wert, 10);
    uebNext(true);
  } else if (gruppe === 'thema') {
    uebThema = wert;
    uebNext(true);
  } else if (gruppe === 'tmodus') {
    if (tippenModus !== wert) {
      tippenModus = wert;
      tWord = null; tResult = null; tHint = false;
    }
    renderTippen();
  } else if (gruppe === 'abcrichtung') {
    if (abcRichtung !== wert) {
      abcRichtung = wert;
      abcQ = null;   // die laufende Frage passt zur alten Richtung
    }
    abcOffen = null;
    renderBuchstaben();
    renderKopf();
  } else {
    if (gruppe === 'stufe') trLevel = parseInt(wert, 10);
    if (gruppe === 'richtung') trDir = wert;
    if (gruppe === 'trmodus') trModus = wert;
    trTask = null; trBuilt = []; trPhase = 'ask'; trCorrect = null; trRevealed = false;
    buildTransTask();
    renderUebersetzen();
  }
  renderFilter();
}

function renderFilter() {
  var knopf = document.getElementById('filterKnopf');
  var hat = filterHatWahl();
  knopf.hidden = !hat;
  if (!hat) { filterSetzen(false); return; }
  knopf.classList.toggle('aktiv', filterAktiv());
  var panel = document.getElementById('filterInhalt');
  panel.innerHTML = filterInhaltHtml();
  panel.querySelectorAll('[data-fw]').forEach(function (b) {
    b.addEventListener('click', function () { filterWaehlen(b.dataset.fw, b.dataset.fv); });
    b.tabIndex = filterOffen ? 0 : -1;
  });
}

// ── Wissen: warum steht dieses Wort so da? ──────────────────
// Die Frage entsteht mitten im Satz — also wird sie dort beantwortet. Zwei Wege
// hinein: ein Wort antippen oder der Knopf für den ganzen Satz. Er heißt
// «Wissen» und nicht «Tipp»: Ein Tipp ist etwas, das man sich versagt, Wissen
// soll man sich holen (ADR 0030).
var wissenOffen = false;
var wissenWort = null;   // angetipptes Wort, sonst alle

function wissenSetzen(auf) {
  wissenOffen = auf && wissenHatWas();
  document.body.classList.toggle('wissen-offen', wissenOffen);
  var knopf = document.getElementById('wissenKnopf');
  knopf.setAttribute('aria-expanded', wissenOffen ? 'true' : 'false');
  document.getElementById('wissenPanel').setAttribute('aria-hidden', wissenOffen ? 'false' : 'true');
  if (!wissenOffen) wissenWort = null;
}

// Erklärt wird nur die russische Seite — und nur dann, wenn sie ohnehin
// dasteht. In der Richtung DE → RU wäre jede Erklärung die halbe Lösung.
function wissenHatWas() {
  return currentTab === 'uebersetzen' && !!trTask &&
    (trTask.dir === 'ru-de' || trPhase === 'feedback');
}

// Ein Wort des Satzes nachschlagen: erst als gebeugte Form, dann als Grundform.
function wissenZuWort(wort) {
  var rein = String(wort).replace(/[.,!?;:«»]/g, '');
  var klein = rein.toLowerCase();
  var formen = (trTask && trTask.satz && trTask.satz.formen) || {};
  var schluessel = null;
  Object.keys(formen).forEach(function (f) {
    if (f.toLowerCase() === klein) schluessel = f;
  });
  if (schluessel) {
    var grundform = formen[schluessel][0];
    var rolle = formen[schluessel][1];
    var v = VOKABEL[grundform];
    return {
      wort: rein, art: 'form', grundform: grundform, rolle: rolle,
      vokabel: v, geschlecht: v ? geschlecht(v.art) : ''
    };
  }
  var direkt = VOKABEL[klein] || VOKABEL[rein];
  if (direkt) return { wort: rein, art: 'grundform', vokabel: direkt };
  return { wort: rein, art: 'offen' };
}

var ROLLE_NAME = { akk: 'Akkusativ — wen? was?' };

function wissenKarteHtml(e) {
  if (e.art === 'grundform') {
    var v = e.vokabel;
    return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(v.ru) +
      hoerknopf(v.ru, 'ru') + '</p>' +
      '<p class="wissen-zeile">' + esc(v.de) + ' · <span class="translit">[' +
      esc(v.tr) + ']</span></p>' +
      (istNomen(v.art)
        ? '<p class="wissen-regel">Grundform · ' + GESCHLECHT_NAME[geschlecht(v.art)] + '</p>'
        : '<p class="wissen-regel">Grundform</p>') + '</div>';
  }
  if (e.art === 'offen') {
    return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(e.wort) + '</p>' +
      '<p class="wissen-regel offen">Diese Form ist noch nicht erklärt — sie kommt mit ' +
      'einem späteren Baustein in «Grammatik».</p></div>';
  }
  var g = e.geschlecht;
  var grund = e.grundform;
  var gleich = e.wort.toLowerCase() === grund.toLowerCase();
  return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(e.wort) +
    hoerknopf(e.wort, 'ru') + '</p>' +
    '<p class="wissen-zeile"><span class="cyr">' + esc(grund) + '</span>' +
    (e.vokabel ? ' · ' + esc(e.vokabel.de) : '') +
    (g ? ' · ' + GESCHLECHT_NAME[g] : '') + '</p>' +
    '<p class="wissen-regel">' + esc(ROLLE_NAME[e.rolle] || e.rolle) + '</p>' +
    '<p class="wissen-warum">' + (gleich
      ? 'Hier ändert sich nichts — die Form ist dieselbe wie die Grundform.'
      : '<span class="cyr">' + esc(grund.slice(-1)) + '</span> wird zu <span class="cyr">' +
        esc(e.wort.slice(-1).toLowerCase()) + '</span>.') + '</p></div>';
}

function wissenInhaltHtml() {
  if (!trTask) return '';
  var text = trTask.dir === 'ru-de' ? trTask.prompt : trTask.solution;
  var worte = text.split(/\s+/).filter(Boolean);
  var eintraege = wissenWort ? [wissenZuWort(wissenWort)] : worte.map(wissenZuWort);
  var html = '';
  if (wissenWort) {
    html += '<button class="chip wissen-alle" id="wissenAlle">Ganzer Satz</button>';
  }
  eintraege.forEach(function (e) { html += wissenKarteHtml(e); });
  return html;
}

function renderWissen() {
  var knopf = document.getElementById('wissenKnopf');
  var da = wissenHatWas();
  knopf.hidden = !da;
  if (!da) {
    if (wissenOffen) wissenSetzen(false);
    return;
  }
  knopf.innerHTML = ICON.wissen;
  var panel = document.getElementById('wissenInhalt');
  panel.innerHTML = wissenInhaltHtml();
  panel.querySelectorAll('button').forEach(function (b) { b.tabIndex = wissenOffen ? 0 : -1; });
  var alleKnopf = document.getElementById('wissenAlle');
  if (alleKnopf) alleKnopf.addEventListener('click', function () {
    wissenWort = null;
    renderWissen();
  });
}

// ── Home ────────────────────────────────────────────────────
// Nicht bloß ein Verzeichnis: jede Kachel sagt, was dort gerade ansteht.
function uebungsStand(id) {
  var jetzt = Date.now();
  if (id === 'lernsets') {
    var set = LERNSETS[aktuellesSet()];
    var offen = set.woerter.filter(function (v) { return (state.boxes[v.id] || 0) < SATZ_STUFE; }).length;
    return offen
      ? { text: 'Set ' + (aktuellesSet() + 1) + ' · ' + offen + ' offen', warm: true }
      : { text: 'Set ' + (aktuellesSet() + 1) + ' · bereit' };
  }
  if (id === 'freestyle') {
    var faellige = faelligeAnzahl(ALL_VOCAB);
    var begonnen = ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) > 0; }).length;
    return faellige
      ? { text: faellige + ' fällig', warm: true }
      : { text: begonnen + ' von ' + ALL_VOCAB.length + ' begonnen' };
  }
  if (id === 'tippen') {
    var lernen = tippenLernen().length, frisch = tippenWiederholung().length;
    if (!lernen && !frisch) {
      return tippenRuhend().length
        ? { text: 'alles getippt' }
        : { text: 'noch gesperrt', gesperrt: true };
    }
    return { text: lernen + ' offen' + (frisch ? ' · ' + frisch + ' fällig' : ''), warm: !!frisch };
  }
  if (id === 'uebersetzen') {
    var frei = 0, offen2 = 0, faellig2 = 0;
    [1, 2, 3].forEach(function (n) {
      frei += freieSaetze(n).length;
      offen2 += trLernen(n).length;
      faellig2 += trWiederholung(n).length;
    });
    if (!frei) return { text: 'noch gesperrt', gesperrt: true };
    if (!offen2 && !faellig2) return { text: 'alles übersetzt' };
    return { text: offen2 + ' offen' + (faellig2 ? ' · ' + faellig2 + ' fällig' : ''), warm: !!faellig2 };
  }
  if (id === 'buchstaben') {
    var sitzt = abcGelernt();
    var offen2 = abcPool().length;
    if (!offen2) return { text: 'alles gemeistert' };
    var faelligAbc = ALPHABET.filter(function (b) {
      return abcGemeistert(b) && abcFaellig(b, jetzt);
    }).length;
    return {
      text: sitzt + ' von ' + ALPHABET.length + ' sitzen' +
        (faelligAbc ? ' · ' + faelligAbc + ' fällig' : ''),
      warm: sitzt === 0 || !!faelligAbc
    };
  }
  if (id === 'grammatik') {
    var sitzen = gramMeisterschaft();
    var offenG = gramPool().length;
    if (!offenG) return { text: 'alle Regeln sitzen' };
    var naechster = gramWaehlen();
    return {
      text: naechster && !gramEntdeckt(naechster)
        ? naechster.name + ' · neu'
        : sitzen + ' von ' + GRAMMATIK.length + ' Regeln',
      warm: sitzen === 0
    };
  }
  return { text: '' };
}

// Der eine Knopf, der immer richtig ist: was jetzt am meisten bringt.
function empfehlung() {
  var set = LERNSETS[aktuellesSet()];
  var offen = set.woerter.filter(function (v) { return (state.boxes[v.id] || 0) < SATZ_STUFE; }).length;
  var frisch = tippenWiederholung().length;
  var trFrisch = trWiederholung(1).length + trWiederholung(2).length + trWiederholung(3).length;

  if (frisch + trFrisch >= 5) {
    return {
      ziel: frisch >= trFrisch ? 'tippen' : 'uebersetzen',
      titel: 'Erst auffrischen',
      note: (frisch + trFrisch) + ' Dinge warten auf die Sicherheitsrunde.'
    };
  }
  if (offen) {
    return {
      ziel: 'lernsets',
      titel: 'Weiter mit Set ' + (aktuellesSet() + 1),
      note: offen + (offen === 1 ? ' Wort' : ' Wörter') + ' bis zu ' +
        set.saetze.length + (set.saetze.length === 1 ? ' neuen Satz' : ' neuen Sätzen') + '.'
    };
  }
  var offeneSaetze = trLernen(1).length + trLernen(2).length + trLernen(3).length;
  if (offeneSaetze) {
    return { ziel: 'uebersetzen', titel: 'Sätze bauen', note: offeneSaetze + ' Sätze warten auf Sie.' };
  }
  if (tippenLernen().length) {
    return { ziel: 'tippen', titel: 'Schreiben üben', note: tippenLernen().length + ' Wörter sitzen fast.' };
  }

// ── ÜBEN: LERNSETS UND FREESTYLE ────────────────────────────
// Beide Übungen teilen sich Fragelogik und Zustand; unterschiedlich sind nur
// der Wortvorrat und der Kopf über der Frage.
var uebModus = 'lernsets';   // 'lernsets' · 'freestyle'
var uebAuswahl = 'aktuell';  // 'aktuell' · 'alle' · Nummer eines freien Sets
var uebThema = 'Alle';       // nur im Freestyle
var uebQ = null;
var uebPhase = 'ask'; // ask | feedback | fact
var uebBuilt = [];
var uebPicked = null;
var uebCorrect = null;
var uebRevealed = false;
var uebFactText = '';
var uebGeschafftesSet = null; // Nummer eines Sets, das gerade fertig wurde

// «Lernsets» arbeiten das laufende Set ab, «Freestyle» ein Thema freier Wahl.
function uebPool() {
  if (uebModus === 'freestyle') {
    if (uebThema === 'Alle') return ALL_VOCAB;
    return ALL_VOCAB.filter(function (v) { return v.theme === uebThema; });
  }
  if (uebAuswahl === 'alle') return freigeschalteteWoerter();
  var nr = uebAuswahl === 'aktuell' ? aktuellesSet() : uebAuswahl;
  if (!setFrei(nr)) nr = aktuellesSet();
  return LERNSETS[nr].woerter;
}

// Auswahl in drei Stufen: erstens fällige Wiederholungen, zweitens noch nie
// gesehene Wörter, drittens — innerhalb einer Sitzung der Regelfall — das am
// längsten Zurückliegende mit der niedrigsten Stufe.
// «nurWiederholen» überspringt die ersten beiden Stufen: Wer ausdrücklich
// wiederholt, will den ganzen Bestand, nicht bloß das noch Unbekannte.
function waehleWort(pool, nurWiederholen) {
  if (!pool.length) return null;
  var jetzt = Date.now();
  var faellige = pool.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); });
  var neue = pool.filter(function (v) { return !state.lastSeen[v.id]; });
  var quelle, nachAlter = false;
  if (nurWiederholen) {
    // Wiederholen heißt: bereits Begonnenes, das am längsten zurückliegt.
    quelle = pool.filter(function (v) { return state.lastSeen[v.id]; });
    nachAlter = true;
    if (!quelle.length) { quelle = pool; nachAlter = false; }
  } else if (faellige.length && (!neue.length || Math.random() < 0.65)) quelle = faellige;
  else if (neue.length) quelle = neue;
  else quelle = pool;

  var sortiert = quelle.slice().sort(function (a, b) {
    var boxA = state.boxes[a.id] || 0, boxB = state.boxes[b.id] || 0;
    var zeitA = state.lastSeen[a.id] || 0, zeitB = state.lastSeen[b.id] || 0;
    if (nachAlter) return zeitA - zeitB || boxA - boxB;
    if (boxA !== boxB) return boxA - boxB;
    return zeitA - zeitB;
  });
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}
// Zwei bis drei Buchstaben, die nicht im Wort stehen — bevorzugt solche, die
// dem Wort ähnlich sehen könnten.
function zusatzBuchstaben(wort) {
  var drin = {};
  wort.split('').forEach(function (c) { drin[c] = true; });
  var alphabet = KB_ROWS.reduce(function (a, reihe) { return a.concat(reihe); }, []);
  var frei = alphabet.filter(function (c) { return !drin[c]; });
  var wieviele = wort.length <= 4 ? 2 : 3;
  return shuffle(frei).slice(0, Math.min(wieviele, frei.length));
}

function buildQuestion() {
  var pool = uebPool();
  var word = waehleWort(pool, uebModus === 'lernsets' && uebAuswahl === 'alle');
  if (!word) return null;
  var box = state.boxes[word.id] || 0;
  // Unter drei Buchstaben ist nichts zusammenzusetzen — «я» oder «в» als Kachelaufgabe
  // wäre eine Farce. Über zwölf Buchstaben passt die Reihe nicht mehr aufs Telefon.
  var canTile = word.ru.indexOf(' ') === -1 && word.ru.length >= 3 && word.ru.length <= 12;
  var mode;
  if (box <= 1) mode = Math.random() < 0.5 ? 'mc-de' : 'mc-ru';
  else mode = canTile ? 'tiles' : 'mc-ru';

  if (mode === 'tiles') {
    // Mehr Kacheln als Buchstaben: erst dadurch zeigt sich, ob die Schreibweise
    // wirklich sitzt, statt dass man die vorhandenen Kacheln durchprobiert.
    var buchstaben = word.ru.split('');
    var tiles = shuffle(buchstaben.concat(zusatzBuchstaben(word.ru)));
    for (var i = 0; i < 10 && tiles.slice(0, buchstaben.length).join('') === word.ru; i++) {
      tiles = shuffle(tiles);
    }
    return {
      word: word, mode: mode, laenge: buchstaben.length,
      tiles: tiles.map(function (ch, k) { return { ch: ch, key: k }; })
    };
  }
  // Ablenker aus allem, womit schon gearbeitet wurde — sonst wiederholen sich
  // innerhalb eines Sets immer dieselben drei. Gleiches Thema zuerst, das fordert mehr.
  var quelle = verwechslungsPool();
  if (quelle.length < 4) quelle = ALL_VOCAB;
  var sameTheme = quelle.filter(function (v) { return v.theme === word.theme && v.id !== word.id; });
  var others = quelle.filter(function (v) { return v.theme !== word.theme && v.id !== word.id; });
  var distractors = shuffle(sameTheme).concat(shuffle(others)).slice(0, 3);
  return { word: word, mode: mode, options: shuffle([word].concat(distractors)) };
}
// Setzt die laufende Frage zurück, ohne zu zeichnen.
function uebZuruecksetzen() {

// ihren eigenen Zustand: die laufende Frage, das getippte Wort, den gelegten

function uebNext(skipFact) {
  if (uebGeschafftesSet !== null) {
    uebPhase = 'setfertig';
    renderUeben();
    return;
  }
  if (!skipFact && state.answered > 0 && state.answered % 5 === 0) {
    uebFactText = naechsterFakt();
    faktGezeigt(uebFactText);
    state.factIdx++;
    save();
    uebPhase = 'fact';
    renderUeben();
    return;
  }
  uebQ = buildQuestion();
  uebPhase = 'ask';
  uebBuilt = [];
  meisterMeldung = null;
  uebPicked = null;
  uebCorrect = null;
  uebRevealed = false;
  renderUeben();
}

// Kopf über der Frage — je nach Übung das Lernset oder die Themenwahl.
function uebKopfHtml() {
  return uebModus === 'lernsets' ? setKopfHtml() : themaKopfHtml();
}

function setKopfHtml() {
  var aktuell = aktuellesSet();
  var nr = uebAuswahl === 'alle' ? aktuell : (uebAuswahl === 'aktuell' ? aktuell : uebAuswahl);
  // Die Auswahl steckt im Filterknopf oben; hier steht nur, was gerade gilt.
  var html = '<p class="task-label">' +
    (uebAuswahl === 'alle' ? 'Alles Freigeschaltete'
      : 'Set ' + (nr + 1) + ' von ' + LERNSETS.length) + '</p>';

  var woerter = uebAuswahl === 'alle' ? freigeschalteteWoerter() : LERNSETS[nr].woerter;
  var reif = woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= SATZ_STUFE; }).length;
  var offen = faelligeAnzahl(woerter);

  html += '<div class="paket"><div class="paket-punkte" aria-hidden="true">';
  woerter.slice(0, 40).forEach(function (v) {
    html += '<span class="pp s' + (state.boxes[v.id] || 0) + '"></span>';
  });
  html += '</div><p class="paket-text">' + reif + ' von ' + woerter.length + ' auf Stufe ' + SATZ_STUFE;
  if (uebAuswahl !== 'alle') {
    var saetze = LERNSETS[nr].saetze.length;

      : ' · noch ' + (woerter.length - reif) + ' bis zu ' + saetze + ' Sätzen';
  }

  html += '</p></div>';
  return html;
}

function themaKopfHtml() {
  var html = '<p class="task-label">' + esc(uebThema === 'Alle' ? 'Alle Themen' : uebThema) + '</p>';

  var woerter = uebPool();
  var begonnen = woerter.filter(function (v) { return (state.boxes[v.id] || 0) > 0; }).length;
  var gemeistert = woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= BOX_MAX; }).length;
  html += '<div class="paket"><p class="paket-text">' + woerter.length + ' Wörter · ' +
    begonnen + ' begonnen · ' + gemeistert + ' gemeistert';
  var offen = faelligeAnzahl(woerter);
  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function uebAbgabeBereit() {
  if (!uebQ) return false;
  if (uebQ.mode === 'tiles') {
    return state.settings.requireComplete
      ? uebBuilt.length === uebQ.laenge
      : uebBuilt.length > 0;
  }
  return uebPicked !== null;
}

function uebPruefen() {
  var q = uebQ;
  var setVorher = aktuellesSet();
  if (q.mode === 'tiles') {
    var attempt = uebBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    uebCorrect = normalize(attempt) === normalize(q.word.ru);
  } else {
    uebCorrect = uebPicked === q.word.id;
  }
  var vorher = state.boxes[q.word.id] || 0;
  updateBox(q.word.id, uebCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, state.boxes[q.word.id], 'Wort', q.word.ru + ' — ' + q.word.de,
    woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
  meisterTon(uebCorrect);
  // Hat diese Antwort das laufende Set vollgemacht? Dann wartet der Jubel
  // auf das nächste «Weiter» — mitten in der Auflösung wäre er im Weg.
  if (aktuellesSet() !== setVorher && setGeschafft(setVorher)) uebGeschafftesSet = setVorher;
  uebPhase = 'feedback';
  renderUeben();
}

function renderUeben() {
  if (uebPhase === 'setfertig' && uebGeschafftesSet !== null) {
    var set = LERNSETS[uebGeschafftesSet];
    var offen = set.saetze.filter(satzFrei).length;
    var naechstes = aktuellesSet();
    main.innerHTML = '<section><div class="card jubel">' + maskottchen('gross') +
      '<p class="task-label">Set ' + (uebGeschafftesSet + 1) + ' geschafft</p>' +
      '<p class="word">' + offen + (offen === 1 ? ' Satz' : ' Sätze') + ' frei</p>' +
      '<p class="hint">' + (offen
        ? 'In «Übersetzen» wartet' + (offen === 1 ? '' : 'en') + ' unter anderem ' +
          set.saetze.slice(0, 2).map(function (satz) {
            return '<span class="cyr">' + esc(satz.ru) + '</span>';
          }).join(' und ')
        : 'Die Sätze dieses Sets sind schon geübt.') + '</p>' +
      (naechstes !== uebGeschafftesSet
        ? '<p class="hint">Als Nächstes: Set ' + (naechstes + 1) + ' mit ' +
          LERNSETS[naechstes].woerter.length + ' Wörtern.</p>' : '') +
      '</div><div class="btn-row">' +
      '<button class="btn ghost" id="jubelWeiter">Weiter lernen</button>' +
      '<button class="btn primary" id="jubelUebersetzen">Zu «Übersetzen»</button>' +
      '</div></section>';
    document.getElementById('jubelWeiter').addEventListener('click', function () {
      uebGeschafftesSet = null;
      uebNext(true);
    });
    document.getElementById('jubelUebersetzen').addEventListener('click', function () {
      // Frage neu aufsetzen, bevor wir gehen — sonst steht «Üben» bei der
      // Rückkehr noch in der Jubelphase und zeigt eine Frage ohne Knöpfe.
      uebZuruecksetzen();
      trTask = null;
      buildTransTask();
      setTab('uebersetzen');
    });
    return;
  }
  if (uebPhase === 'fact') {
    main.innerHTML =
      '<section>' +
      '<div class="sprechblase">' +
      '<span class="fact-label">Wussten Sie?</span>' +
      '<p class="fact-text">' + esc(uebFactText) + '</p></div>' +
      '<div class="fakt-fuss">' + maskottchen('klein') +
      '<button class="sternbtn' + (faktStand(uebFactText).f ? ' an' : '') + '" id="factFav" ' +
      'aria-pressed="' + (faktStand(uebFactText).f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
      (faktStand(uebFactText).f ? ICON.sternVoll : ICON.stern) + '</button></div>' +
      '<div class="btn-row"><button class="btn ghost" id="factAlle">Alle Fakten</button>' +
      '<button class="btn primary" id="factNext">Weiter üben</button></div>' +
      '</section>';
    document.getElementById('factNext').addEventListener('click', function () { uebNext(true); });
    document.getElementById('factAlle').addEventListener('click', function () { setTab('fakten'); });
    document.getElementById('factFav').addEventListener('click', function () {
      faktFavorit(uebFactText);
      renderUeben();
    });
    return;
  }
  if (!uebQ) uebQ = buildQuestion();
  if (!uebQ) { main.innerHTML = '<section>' + uebKopfHtml() + '</section>'; return; }
  var q = uebQ;
  var box = state.boxes[q.word.id] || 0;
  var promptRu = q.mode === 'mc-de';
  var prompt = (q.mode === 'tiles' || q.mode === 'mc-ru') ? q.word.de : q.word.ru;
  var taskLabel = q.mode === 'mc-de' ? 'Was bedeutet …' : q.mode === 'mc-ru' ? 'Welches Wort passt?' : 'Setzen Sie das Wort zusammen';

  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) dots += '<span class="' + (i <= box && box > 0 ? 'on' : '') + '"></span>';

  var html = '<section>' + uebKopfHtml();

  html += '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="card-theme">' + esc(q.word.theme) + '</span></div>' +
    '<p class="task-label">' + taskLabel + '</p>' +
    '<p class="word' + (promptRu ? ' cyr' : '') + '">' + esc(prompt) +
    hoerknopf(prompt, promptRu ? 'ru' : 'de') + '</p>';

  if (q.mode === 'tiles') {
    html += '<div class="slots cyr">';
    for (var s = 0; s < q.laenge; s++) {
      var filled = s < uebBuilt.length;
      var ch = filled ? q.tiles.filter(function (t) { return t.key === uebBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (filled ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (uebPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var used = uebBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (used ? ' used' : '') + '" data-tile="' + t.key + '"' + (used ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="tileUndo" aria-label="Letzten Buchstaben entfernen">' + ICON.ruecktaste + '</button></div>';
    }
  }

  if (q.mode === 'mc-de' || q.mode === 'mc-ru') {
    html += '<div class="options">';
    q.options.forEach(function (opt, oi) {
      var cls = '';
      if (uebPhase === 'feedback') {
        if (opt.id === q.word.id) cls = ' right';
        else if (opt.id === uebPicked) cls = ' wrong';
        else cls = ' muted';
      } else if (opt.id === uebPicked) {
        cls = ' picked';
      }
      html += '<button class="option' + (q.mode === 'mc-ru' ? ' cyr' : '') + cls + '" data-opt="' + oi + '"' +
        (uebPhase !== 'ask' ? ' disabled' : '') + '>' +
        esc(q.mode === 'mc-de' ? opt.de : opt.ru) + '</button>';
    });
    html += '</div>';
  }

  if (uebPhase === 'feedback') {
    html += '<div class="feedback ' + (uebCorrect ? 'good' : 'bad') + '">';
    if (uebCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig!</p>';
    else html += '<p>' + ICON.kreuz + (uebRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="cyr">' + esc(q.word.ru) + '</strong> — ' + esc(q.word.de) +
      ' <span class="translit">[' + esc(q.word.tr) + ']</span></p>';
    html += '</div>' + hoerzeile(q.word.ru, q.word.de) + meisterHtml();
  }

  html += '</div><div class="btn-row">';
  if (uebPhase === 'ask') {
    html += '<button class="btn ghost" id="uebReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="uebConfirm"' + (uebAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="uebNext">Weiter \u2192</button>';
  }
  html += '</div>';
  html += '<p class="session-info">' + state.answered + ' beantwortet · Beste Serie: ' + state.bestStreak + '</p></section>';

  main.innerHTML = html;

  if (uebPhase === 'ask') {
    document.getElementById('uebReveal').addEventListener('click', function () {
      uebRevealed = true;
      uebCorrect = false;
      updateBox(q.word.id, false);
      uebPhase = 'feedback';
      renderUeben();
    });
    main.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        uebPicked = q.options[parseInt(b.dataset.opt, 10)].id;
        if (state.settings.confirmUeben) renderUeben();
        else uebPruefen();
      });
    });
    main.querySelectorAll('[data-tile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.tile, 10);
        if (uebBuilt.indexOf(key) !== -1 || uebBuilt.length >= q.laenge) return;
        uebBuilt.push(key);
        if (!state.settings.confirmUeben && uebBuilt.length === q.laenge) uebPruefen();
        else renderUeben();
      });
    });
    var confirmBtn = document.getElementById('uebConfirm');
    if (confirmBtn) confirmBtn.addEventListener('click', function () {
      if (uebAbgabeBereit()) uebPruefen();
    });
    var undo = document.getElementById('tileUndo');
    if (undo) undo.addEventListener('click', function () {
      uebBuilt.pop();
      renderUeben();
    });
  } else {
    document.getElementById('uebNext').addEventListener('click', function () { uebNext(false); });
  }
}

// ── ÜBERSETZEN ──────────────────────────────────────────────
// Ein Satz wird erst angeboten, wenn jede seiner Voraussetzungen (Grundformen
// aus dem Lehrplan) mindestens SATZ_STUFE erreicht hat.
var SATZ_STUFE = 2;
var trLevel = 1, trDir = 'gemischt';   // 'gemischt' · 'ru-de' · 'de-ru'
var trModus = 'lernen';   // 'lernen' · 'wiederholung' — wie in «Tippen»
// 'gemischt' ist der Regelfall: die Richtung wechselt dann mit der Stufe.
var trTask = null, trBuilt = [], trPhase = 'ask', trCorrect = null, trRevealed = false;
// Der getippte Satz und die eingeblendete Tastatur. Beides gehört an die
// Ansicht, nicht ins Feld: Zwischen zwei Renderläufen wäre der Wert sonst weg.
var trEingabe = '', trKb = null;

// Ein Satz wird **zweimal getippt**, bevor er sitzt: Kacheln zeigen nur, dass
// man die Wörter wiedererkennt und ihre Reihenfolge kennt. Ab Stufe TR_TIPPEN
// (2) schreibt man ihn selbst — das sind die letzten beiden Runden vor der
// Endstufe, und dieselbe Form kommt in der Auffrischung wieder (ADR 0026).
var TR_TIPPEN = 2;
function trArt(satz) {
  return satzBox(satz) >= TR_TIPPEN ? 'tippen' : 'kacheln';
}

// **Die Richtung wechselt mit der Stufe.** «Gemischt» heißt hier nicht Zufall:
// Ein Satz, den man nur versteht, ist nicht derselbe wie einer, den man
// hinschreiben kann — beides muss dran sein, und beides in fester Ordnung,
// sonst hinge die Stufe vom Losglück ab (ADR 0029).
//
//   Stufe 0  RU → DE  Kacheln    verstehen
//   Stufe 1  DE → RU  Kacheln    bauen
//   Stufe 2  RU → DE  getippt    selbst formulieren
//   Stufe 3  DE → RU  getippt    das Schwerste
//   Stufe 4  DE → RU  getippt    Auffrischung — prüft die stärkste Behauptung
function trRichtungFuer(satz) {
  if (trDir !== 'gemischt') return trDir;
  var box = satzBox(satz);
  if (box >= BOX_MAX) return 'de-ru';
  return box % 2 === 0 ? 'ru-de' : 'de-ru';
}

// Deutsche Artikel zählen beim Vergleich nicht mit: Das Russische hat keine,
// und «Ich lese ein Buch» gegen «Ich lese das Buch» ist kein Übersetzungs-,
// sondern ein Ratefehler. Im Russischen wird dagegen jedes Wort gewertet.
var DE_ARTIKEL = {
  der: 1, die: 1, das: 1, den: 1, dem: 1, des: 1,
  ein: 1, eine: 1, einen: 1, einem: 1, einer: 1, eines: 1
};
function trVergleichbar(text, deutsch) {
  var worte = tokenize(normalize(text));
  if (deutsch) worte = worte.filter(function (w) { return !DE_ARTIKEL[w]; });
  return worte.join(' ');
}

function satzFrei(s) {
  return s.benoetigt.every(function (w) { return (state.boxes[w] || 0) >= SATZ_STUFE; });
}
function satzFehlt(s) {
  return s.benoetigt.filter(function (w) { return (state.boxes[w] || 0) < SATZ_STUFE; });
}
function stufenSaetze(stufe) {
  return SENTENCES.filter(function (s) { return s.stufe === stufe; });
}
function freieSaetze(stufe) {
  return stufenSaetze(stufe).filter(satzFrei);
}

// Dieselbe Teilung wie in «Tippen»: was noch nicht sitzt, und was sitzt, aber
// nach der Auffrischfrist einmal zur Sicherheit drankommt. Beim Lernen wird
// nicht nach Fälligkeit gefiltert — wer üben will, soll üben dürfen.
function trLernen(stufe) {
  return freieSaetze(stufe).filter(function (s) { return satzBox(s) < BOX_MAX; });
}
function trWiederholung(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && satzFaellig(s, jetzt);
  });
}
function trRuhend(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && !satzFaellig(s, jetzt);
  });
}
function trPool() {
  return trModus === 'wiederholung' ? trWiederholung(trLevel) : trLernen(trLevel);
}
function trNaechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  var beste = null;
  trRuhend(trLevel).forEach(function (s) {
    var wann = (state.satzSeen[s.ru] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Niedrigste Stufe zuerst, bei Gleichstand das am längsten Zurückliegende.
// Aus den vordersten vieren wird gelost, damit sich nicht jede Sitzung gleich
// anfühlt; der gerade gelöste Satz kommt nicht sofort wieder.
function waehleSatz(pool, ausser) {
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = satzBox(a), bb = satzBox(b);
    if (ba !== bb) return ba - bb;
    return (state.satzSeen[a.ru] || 0) - (state.satzSeen[b.ru] || 0);
  });
  if (ausser && sortiert.length > 1) {
    sortiert = sortiert.filter(function (s) { return s !== ausser; });
  }
  var fenster = sortiert.slice(0, Math.min(4, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Ohne Argument wird der nächste Satz gewählt; mit Argument ein bestimmter.
function buildTransTask(vorgabe) {
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln.
  if (!vorgabe && !trPool().length) {
    var anderer = trModus === 'lernen' ? 'wiederholung' : 'lernen';
    trModus = anderer;
    if (!trPool().length) trModus = 'lernen';
  }
  var liste = freieSaetze(trLevel);
  var satz = vorgabe || waehleSatz(trPool(), trTask ? trTask.satz : null);
  if (!satz) { trTask = null; return; }
  var ru = satz.ru, de = satz.de;
  // Ab hier zählt die Richtung *dieser* Aufgabe, nicht die eingestellte: Beim
  // Zeichnen darf sich nichts mehr verschieben, auch wenn der Filter wechselt.
  var richtung = trRichtungFuer(satz);
  var nachDe = richtung === 'ru-de';
  var prompt = nachDe ? ru : de;
  var targetTokens = tokenize(nachDe ? de : ru);
  var solution = nachDe ? de : ru;
  var targetNorm = {};
  targetTokens.forEach(function (w) { targetNorm[normalize(w)] = true; });
  // Ablenker kommen aus allen freigeschalteten Sätzen der Stufe, nicht nur aus
  // dem aktuellen Stapel — sonst wird die Auswahl mit der Zeit dünn.
  var otherWords = [];
  liste.forEach(function (p) {
    if (p === satz) return;
    tokenize(nachDe ? p.de : p.ru).forEach(function (w) {
      if (!targetNorm[normalize(w)]) otherWords.push(w);
    });
  });
  var uniq = [];
  var seen = {};
  otherWords.forEach(function (w) { if (!seen[w]) { seen[w] = true; uniq.push(w); } });
  var distractors = shuffle(uniq).slice(0, Math.min(3, uniq.length));
  var tiles = shuffle(targetTokens.concat(distractors)).map(function (word, i) {
    return { word: word, key: i };
  });
  trTask = {
    prompt: prompt, targetTokens: targetTokens, solution: solution, tiles: tiles,
    ru: ru, de: de, satz: satz, art: trArt(satz), dir: richtung,
    // Getippt wird in der Sprache der Lösung — die Tastatur richtet sich danach.
    loesungRu: !nachDe
  };
  trBuilt = [];
  trEingabe = '';
  trPhase = 'ask';
  trCorrect = null;
  trRevealed = false;
  meisterMeldung = null;
}

function trWort(key) {
  return trTask.tiles.filter(function (x) { return x.key === key; })[0].word;
}

// Ist genug gelegt oder geschrieben, um abgeben zu dürfen?
function trAbgabeBereit() {
  if (!trTask) return false;
  if (trTask.art === 'tippen') return normalize(trEingabe) !== '';
  return state.settings.requireComplete
    ? trBuilt.length === trTask.targetTokens.length
    : trBuilt.length > 0;
}

function trPruefen() {
  var ok;
  if (trTask.art === 'tippen') {
    // Wortweise verglichen, nicht Zeichen für Zeichen: `normalize()` räumt
    // Satzzeichen und Groß-/Kleinschreibung weg, ein doppeltes Leerzeichen
    // soll keinen Fehler bedeuten. Ins Deutsche zählen Artikel nicht mit.
    var deutsch = !trTask.loesungRu;
    ok = trVergleichbar(trEingabe, deutsch) === trVergleichbar(trTask.solution, deutsch);
  } else {
    ok = trBuilt.length === trTask.targetTokens.length && trBuilt.every(function (k, i) {
      return normalize(trWort(k)) === normalize(trTask.targetTokens[i]);
    });
  }
  trFinish(ok);
}

function trFinish(ok) {
  trCorrect = ok;
  trPhase = 'feedback';
  var vorher = satzBox(trTask.satz);
  satzUpdate(trTask.satz, ok);
  meisterMeldung = null;
  meisterPruefen(vorher, satzBox(trTask.satz), 'Satz', trTask.satz.ru,
    saetzeGemeistert() + ' von ' + SENTENCES.length + ' Sätzen');
  meisterTon(ok);
  state.transStats.correct += ok ? 1 : 0;
  state.transStats.wrong += ok ? 0 : 1;
  save();
}

function saetzeGemeistert() {
  return SENTENCES.filter(function (s) { return satzBox(s) >= BOX_MAX; }).length;
}

// Drei Gr\u00fcnde f\u00fcr eine leere Ansicht, die sich sehr verschieden anf\u00fchlen:
// noch kein Satz freigeschaltet, alle S\u00e4tze sitzen, oder nichts f\u00e4llig.
function renderUebersetzenLeer() {
  var frei = freieSaetze(trLevel);
  var offen = trLernen(trLevel).length;
  var frisch = trWiederholung(trLevel).length;
  var ruhend = trRuhend(trLevel).length;

  var html = '<section><div class="leer">' + maskottchen('gross');

  if (!frei.length) {
    var stufe = stufenSaetze(trLevel);
    var naechster = stufe.slice().sort(function (a, b) {
      return satzFehlt(a).length - satzFehlt(b).length;
    })[0];
    var fehlt = naechster ? satzFehlt(naechster) : [];
    html += '<h3>Noch kein Satz auf Stufe ' + trLevel + '</h3>' +
      '<p>Ein Satz erscheint, sobald alle seine W\u00f6rter in \u00abLernsets\u00bb oder \u00abFreestyle\u00bb ' +
      'mindestens Stufe ' + SATZ_STUFE + ' erreicht haben.</p>';
    if (fehlt.length) {
      html += '<p class="naechste">Dem n\u00e4chsten Satz fehlen noch: ' + fehlt.slice(0, 6).map(function (w) {
        return '<span class="cyr">' + esc(w) + '</span>';
      }).join(' \u00b7 ') + (fehlt.length > 6 ? ' \u2026' : '') + '</p>';
    }
    html += '<div class="btn-row"><button class="btn primary" id="trZuUeben">Zu \u00abLernsets\u00bb</button></div>';
  } else if (trModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts f\u00e4llig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Satz sitzt und ruht.' : ' S\u00e4tze sitzen und ruhen.') +
          ' Der n\u00e4chste kommt ' + esc(trNaechsteAuffrischung()) + ' zur Sicherheit noch einmal.'
        : 'Hier erscheinen S\u00e4tze, die Sie ' + BOX_MAX + '\u00d7 richtig \u00fcbersetzt haben \u2014 nach ' +
          (state.settings.auffrischen || 21) + ' Tagen einmal zur Sicherheit.') + '</p>';
    if (offen) {
      html += '<div class="btn-row"><button class="btn primary" id="trZuLernen">' +
        offen + (offen === 1 ? ' Satz offen' : ' S\u00e4tze offen') + '</button></div>';
    }
  } else {
    html += '<h3>Stufe ' + trLevel + ' sitzt</h3>' +
      '<p>Alle ' + frei.length + ' freigeschalteten S\u00e4tze dieser Stufe haben Sie ' + BOX_MAX +
      '\u00d7 richtig \u00fcbersetzt. ' +
      (frisch
        ? frisch + (frisch === 1 ? ' wartet' : ' warten') + ' zum Auffrischen.'
        : 'Die n\u00e4chste Auffrischung kommt ' + esc(trNaechsteAuffrischung()) + '.') + '</p>' +
      '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="trZuFrisch">Wiederholen</button>' : '') +
      '<button class="btn ghost" id="trZuUeben">Neue W\u00f6rter lernen</button></div>';
  }

  html += '</div></section>';
  main.innerHTML = html;

  var zu = document.getElementById('trZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('trZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    trModus = 'wiederholung';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
  });
  var lernBtn = document.getElementById('trZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    trModus = 'lernen';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
  });
}


// Jedes Wort des russischen Satzes wird ein Knopf: Antippen fragt, warum es so
// dasteht. Der Satz bleibt dabei lesbar — die Knöpfe tragen keine Ränder.
function satzMitWissen(text) {
  return text.split(/(\s+)/).map(function (teil) {
    if (!/\S/.test(teil)) return teil;
    return '<button class="satzwort" data-wissenwort="' + esc(teil) + '">' +
      esc(teil) + '</button>';
  }).join('');
}

// Stufenwahl mit Angabe, wie viele S\u00e4tze je Stufe schon offen sind.
function renderUebersetzen() {
  if (!trTask) buildTransTask();
  if (!trTask) { renderUebersetzenLeer(); return; }
  var t = trTask;
  var promptIsRu = t.dir === 'ru-de';
  var liste = freieSaetze(trLevel);

  var html = '<section>';

  var getippt = t.art === 'tippen';
  html += '<div class="card"><p class="task-label">Stufe ' + trLevel + ' · ' +
    (promptIsRu ? 'RU → DE' : 'DE → RU') +
    (trModus === 'wiederholung' ? ' · zur Sicherheit' : '') +
    (getippt ? ' · selbst schreiben' : '') + '</p>' +
    '<p class="sentence' + (promptIsRu ? ' cyr' : '') + '">' +
    (promptIsRu ? satzMitWissen(t.prompt) : esc(t.prompt)) +
    hoerknopf(t.prompt, promptIsRu ? 'ru' : 'de') + '</p>';

  if (getippt) {
    html += '<textarea id="trInput" rows="2" class="fliess' + (t.loesungRu ? ' cyr' : '') +
      (trPhase === 'feedback' ? (trCorrect ? ' ok' : ' err') : '') + '"' +
      ' lang="' + (t.loesungRu ? 'ru' : 'de') + '" autocapitalize="sentences"' +
      ' autocorrect="off" spellcheck="false"' + (trPhase === 'feedback' ? ' readonly' : '') +
      ' placeholder="' + (t.loesungRu ? 'Den Satz auf Russisch schreiben …'
        : 'Den Satz auf Deutsch schreiben …') + '">' + esc(trEingabe) + '</textarea>';
    if (!t.loesungRu && trPhase === 'ask') {
      html += '<p class="hint">Artikel zählen nicht mit — das Russische hat keine.</p>';
    }
  } else {
    html += '<div class="built' + (promptIsRu ? '' : ' cyr') + '">';
    if (trBuilt.length === 0 && trPhase === 'ask') {
      html += '<span class="built-placeholder">Wörter in der richtigen Reihenfolge antippen</span>';
    } else {
      trBuilt.forEach(function (k, i) {
        var w = esc(trWort(k));
        // In der Frage-Phase ist jedes gelegte Wort einzeln antippbar zum Entfernen.
        html += trPhase === 'ask'
          ? '<button class="built-word" data-built="' + i + '" aria-label="«' + w + '» entfernen">' + w + '</button>'
          : '<span class="built-word">' + w + '</span>';
      });
    }
    html += '</div>';
  }

  if (trPhase === 'ask' && !getippt) {
    if (trBuilt.length > 0) html += '<p class="hint">Zum Entfernen ein gelegtes Wort antippen.</p>';
    html += '<div class="tiles">';
    t.tiles.forEach(function (tile) {
      var used = trBuilt.indexOf(tile.key) !== -1;
      html += '<button class="wordtile' + (promptIsRu ? '' : ' cyr') + (used ? ' used' : '') +
        '" data-wtile="' + tile.key + '"' + (used ? ' disabled' : '') + '>' + esc(tile.word) + '</button>';
    });
    html += '<button class="wordtile fn" id="trUndo" aria-label="Letztes Wort entfernen">' + ICON.ruecktaste + '</button></div>';
  }

  if (trPhase === 'feedback') {
    html += '<div class="feedback ' + (trCorrect ? 'good' : 'bad') + '">';
    if (trCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig übersetzt!</p>';
    else html += '<p>' + ICON.kreuz + (trRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="' + (promptIsRu ? '' : 'cyr') + '">' + esc(t.solution) + '</strong></p>';
    html += '</div>' + hoerzeile(t.ru, t.de) + meisterHtml();
  }

  html += '</div><div class="btn-row">';
  if (trPhase === 'ask') {
    html += '<button class="btn ghost" id="trReveal">Aufdecken</button>';
    // Beim Schreiben braucht es die Abgabe immer \u2014 anders als bei den Kacheln
    // gibt es keinen Augenblick, an dem die Antwort erkennbar fertig ist.
    if (getippt || state.settings.confirmUebersetzen) {
      html += '<button class="btn primary" id="trConfirm"' + (trAbgabeBereit() ? '' : ' disabled') +
        '>' + (getippt ? 'Pr\u00fcfen' : 'Best\u00e4tigen') + '</button>';
    }
  } else {
    html += '<button class="btn primary" id="trNext">Weiter \u2192</button>';
  }
  html += '</div>';

  // Die eingebaute Tastatur nur, wo sie hilft: Ein deutscher Satz l\u00e4sst sich
  // mit der Ger\u00e4tetastatur schreiben, ein kyrillischer oft nicht.
  if (getippt && t.loesungRu) {
    html += '<button class="kb-toggle" id="trKbToggle">' +
      (trKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (trKb && trPhase === 'ask') html += tastaturHtml('trkey');
  }

  var sitzt = liste.filter(function (x) { return satzBox(x) >= BOX_MAX; }).length;
  html += '<p class="session-info">' + trPool().length +
    (trModus === 'wiederholung' ? ' zum Auffrischen' : ' offen') + ' · ' +
    sitzt + ' von ' + liste.length + ' sitzt';
  if (state.transStats.correct + state.transStats.wrong > 0) {
    html += ' · ' + state.transStats.correct + ' richtig, ' + state.transStats.wrong + ' falsch';
  }
  html += '</p></section>';

  main.innerHTML = html;


  main.querySelectorAll('[data-wissenwort]').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      menuSetzen(false);
      filterSetzen(false);
      wissenWort = b.dataset.wissenwort;
      wissenSetzen(true);
      renderWissen();
    });
  });

  var eingabe = document.getElementById('trInput');
  if (eingabe) {
    eingabe.addEventListener('input', function () {
      trEingabe = eingabe.value;
      // Der Abgabeknopf hängt am Inhalt, aber neu zeichnen dürfen wir hier
      // nicht — das nähme dem Feld den Fokus mitten im Schreiben.
      var knopf = document.getElementById('trConfirm');
      if (knopf) knopf.disabled = !trAbgabeBereit();
    });
  }
  var kbToggle = document.getElementById('trKbToggle');
  if (kbToggle) kbToggle.addEventListener('click', function () {
    trKb = !trKb;
    renderUebersetzen();
  });
  main.querySelectorAll('[data-trkey]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (trPhase !== 'ask') return;
      var k = b.dataset.trkey;
      trEingabe = k === 'BS' ? trEingabe.slice(0, -1) : trEingabe + k;
      var feld = document.getElementById('trInput');
      if (feld) feld.value = trEingabe;
      var knopf = document.getElementById('trConfirm');
      if (knopf) knopf.disabled = !trAbgabeBereit();
    });
  });

  if (trPhase === 'ask') {
    main.querySelectorAll('[data-wtile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.wtile, 10);
        if (trBuilt.indexOf(key) !== -1) return;
        trBuilt.push(key);
        if (!state.settings.confirmUebersetzen && trBuilt.length === trTask.targetTokens.length) trPruefen();
        renderUebersetzen();
      });
    });
    main.querySelectorAll('[data-built]').forEach(function (b) {
      b.addEventListener('click', function () {
        trBuilt.splice(parseInt(b.dataset.built, 10), 1);
        renderUebersetzen();
      });
    });
    var trConfirm = document.getElementById('trConfirm');
    if (trConfirm) trConfirm.addEventListener('click', function () {
      if (!trAbgabeBereit()) return;
      trPruefen();
      renderUebersetzen();
    });
    var undoTr = document.getElementById('trUndo');
    if (undoTr) undoTr.addEventListener('click', function () {
      trBuilt.pop();
      renderUebersetzen();
    });
    document.getElementById('trReveal').addEventListener('click', function () {
      trRevealed = true;
      trFinish(false);
      renderUebersetzen();
    });
  } else {
    document.getElementById('trNext').addEventListener('click', function () {
      buildTransTask();
      renderUebersetzen();
    });
  }
}

// ── BUCHSTABEN ──────────────────────────────────────────────
// Freiwillig: blockiert nichts, schaltet nichts frei und zählt weder in die
// Serie noch in «beantwortet». Wer das Alphabet schon kann, verpasst nichts.
// Eigener Topf (state.abcBox / abcSeen), damit der Wortschatz sauber bleibt.
//
// Die sechs falschen Freunde stehen hier und nicht in den Daten: Dass В wie ein
// B aussieht, ist eine Eigenschaft des *lateinischen* Alphabets, nicht des
// russischen. Sie treten im Quiz bevorzugt als Ablenker gegeneinander an.
var ABC_TUECKISCH = 'внрсух';
// Geübt wird ohne Umweg; die Tafel ist ein Nachschlagewerk und liegt hinter
// dem Knopf links neben der Auswahl.
var abcAnsicht = 'ueben';     // 'ueben' · 'tafel'
var abcRichtung = 'gemischt'; // 'zeichen' · 'laut' · 'gemischt'
var abcOffen = null;          // Buchstabe, dessen Merkhilfe in der Tafel aufgeklappt ist
var abcQ = null, abcPhase = 'ask', abcPicked = null, abcCorrect = null;
var abcBuilt = [], abcRevealed = false;

function abcBox(b) { return state.abcBox[b[1]] || 0; }
function abcFaellig(b, jetzt) {
  var seit = state.abcSeen[b[1]];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(abcBox(b));
}
// Dieselben zwei Schwellen wie beim Wortschatz: ab SATZ_STUFE «sitzt» ein
// Buchstabe — man erkennt ihn —, ab BOX_MAX ist er «gemeistert» und verlässt
// den Stapel bis zur Auffrischung. Dazwischen liegt die Kachelaufgabe.
function abcSitzt(b) { return abcBox(b) >= SATZ_STUFE; }
function abcGemeistert(b) { return abcBox(b) >= BOX_MAX; }
function abcGelernt() { return ALPHABET.filter(abcSitzt).length; }
function abcMeisterschaft() { return ALPHABET.filter(abcGemeistert).length; }

function abcUpdate(b, richtig) {
  var cur = abcBox(b);
  state.abcBox[b[1]] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.abcSeen[b[1]] = Date.now();
  save();
}

// Offen ist, was noch nicht gemeistert ist; dazu kommt Fertiges, dessen Frist
// um ist. Ein Buchstabe, der erst «sitzt», bleibt also im Stapel — genau dort
// wartet die Kachelaufgabe auf ihn.
function abcPool() {
  var jetzt = Date.now();
  var offen = ALPHABET.filter(function (b) { return !abcGemeistert(b); });
  var frisch = ALPHABET.filter(function (b) { return abcGemeistert(b) && abcFaellig(b, jetzt); });
  return offen.concat(frisch);
}

function abcWaehlen() {
  var pool = abcPool();
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = abcBox(a), bb = abcBox(b);
    if (ba !== bb) return ba - bb;
    return (state.abcSeen[a[1]] || 0) - (state.abcSeen[b[1]] || 0);
  });
  if (abcQ && sortiert.length > 1) {
    sortiert = sortiert.filter(function (b) { return b[1] !== abcQ.b[1]; });
  }
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Einstellige Laute wie «a» oder «w» kann man nicht zusammensetzen — «щ» mit
// seinen sieben Zeichen dagegen sehr wohl, und genau dort sitzt der Fehler.
// Ъ und Ь tragen ein deutsches Wort statt einer Lautschrift und fallen heraus.
function abcKachelbar(b) { return /^[a-z]{2,8}$/.test(b[2]); }

// Zwei bis drei lateinische Buchstaben, die im Laut nicht vorkommen — gezogen
// aus den Lauten des Alphabets, damit die Ablenker plausibel bleiben.
function abcZusatzKacheln(laut) {
  var drin = {};
  laut.split('').forEach(function (c) { drin[c] = true; });
  var vorrat = {};
  ALPHABET.forEach(function (x) {
    if (abcKachelbar(x)) x[2].split('').forEach(function (c) { vorrat[c] = true; });
  });
  var frei = Object.keys(vorrat).filter(function (c) { return !drin[c]; });
  return shuffle(frei).slice(0, Math.min(laut.length <= 3 ? 2 : 3, frei.length));
}

function abcFrageBauen() {
  var b = abcWaehlen();
  if (!b) { abcQ = null; return; }
  // Dieselbe Steigerung wie beim Wortschatz: erst wiedererkennen, dann
  // hinschreiben. Wer die Richtung fest wählt, behält sie — «Laut → Zeichen»
  // ist ohnehin schon die fordernde Seite.
  var box = abcBox(b);
  var basis = abcRichtung === 'gemischt'
    ? (Math.random() < 0.5 ? 'zeichen' : 'laut')
    : abcRichtung;
  var modus = (box >= SATZ_STUFE && basis === 'zeichen' && abcKachelbar(b))
    ? 'kacheln' : basis;

  abcPhase = 'ask';
  abcPicked = null;
  abcCorrect = null;
  abcBuilt = [];
  abcRevealed = false;

  gramBaustein = null;
  gramQ = null;
  gramPhase = 'ask';
  gramPicked = null;
  gramCorrect = null;
  gramEingabe = '';
  gramKb = null;
  gramRegelOffen = false;
  gramRegelNeu = false;

  if (modus === 'kacheln') {
    var laut = b[2];
    var zeichen = laut.split('');
    var kacheln = shuffle(zeichen.concat(abcZusatzKacheln(laut)));
    for (var i = 0; i < 10 && kacheln.slice(0, zeichen.length).join('') === laut; i++) {
      kacheln = shuffle(kacheln);
    }
    abcQ = {
      b: b, modus: modus, laut: laut, laenge: zeichen.length,
      tiles: kacheln.map(function (ch, k) { return { ch: ch, key: k }; })
    };
    return;
  }

  // Ablenker: bei einem falschen Freund die anderen falschen Freunde, sonst
  // Buchstaben mit ähnlich langem Laut — beides ist schwerer als Zufall.
  var tueckisch = ABC_TUECKISCH.indexOf(b[1]) !== -1;
  var kandidaten = ALPHABET.filter(function (x) {
    if (x[1] === b[1] || x[2] === b[2]) return false;
    return tueckisch ? ABC_TUECKISCH.indexOf(x[1]) !== -1 : true;
  });
  if (kandidaten.length < 3) {
    kandidaten = ALPHABET.filter(function (x) { return x[1] !== b[1] && x[2] !== b[2]; });
  }
  var optionen = shuffle(kandidaten).slice(0, 3).concat([b]);
  abcQ = { b: b, modus: modus, options: shuffle(optionen) };
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function abcAbgabeBereit() {
  if (!abcQ) return false;
  if (abcQ.modus === 'kacheln') {
    return state.settings.requireComplete
      ? abcBuilt.length === abcQ.laenge
      : abcBuilt.length > 0;
  }
  return abcPicked !== null;
}

function abcPruefen() {
  var q = abcQ;
  if (q.modus === 'kacheln') {
    var versuch = abcBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    abcCorrect = versuch === q.laut;
  } else {
    abcCorrect = abcPicked === q.b[1];
  }
  var vorher = abcBox(q.b);
  abcUpdate(q.b, abcCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, abcBox(q.b), 'Buchstabe', q.b[0] + ' ' + q.b[1] + ' — ' + q.b[2],
    abcMeisterschaft() + ' von ' + ALPHABET.length + ' Buchstaben');
  meisterTon(abcCorrect);
  abcPhase = 'feedback';
  renderBuchstaben();
}

// Kopf über der Frage — dasselbe Paket wie in «Lernsets», nur mit dem
// Alphabet als Inhalt: ein Punkt je Buchstabe, gefärbt nach seiner Stufe.
function abcKopfHtml() {
  var jetzt = Date.now();
  var sitzen = abcGelernt();

  var faellig = ALPHABET.filter(function (b) {

  }).length;

}

function abcUebenHtml() {
  if (!abcQ) abcFrageBauen();
  if (!abcQ) {
    var jetzt = Date.now();
    var ruhend = ALPHABET.filter(function (b) { return abcGemeistert(b) && !abcFaellig(b, jetzt); }).length;
    return abcKopfHtml() + '<div class="leer">' + maskottchen('gross') +
      '<h3>Das Alphabet sitzt</h3><p>Alle ' + ALPHABET.length + ' Buchstaben sind ' +

      '<div class="btn-row"><button class="btn ghost" id="abcZurTafel">Tafel ansehen</button></div></div>';
  }
  var q = abcQ;
  var zeichenFrage = q.modus !== 'laut';
  var box = abcBox(q.b);
  var taskLabel = q.modus === 'kacheln' ? 'Setzen Sie den Laut zusammen'
    : q.modus === 'zeichen' ? 'Wie klingt dieser Buchstabe?' : 'Welcher Buchstabe klingt so?';

  // Dieselben Fortschrittspunkte wie über einer Vokabel — dieselbe Leiter,
  // dieselbe Farbfolge, damit man den Stand ohne Erklärung liest.
  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) dots += '<span class="' + (i <= box && box > 0 ? 'on' : '') + '"></span>';

  var html = abcKopfHtml() + '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="card-theme">' +
    (ABC_TUECKISCH.indexOf(q.b[1]) !== -1 ? 'Falscher Freund' : 'Buchstabe') + '</span></div>' +
    '<p class="task-label">' + taskLabel + '</p>' +
    '<p class="word' + (zeichenFrage ? ' cyr' : '') + '">' +
    esc(zeichenFrage ? q.b[0] + ' ' + q.b[1] : q.b[2]) + '</p>';

  if (q.modus === 'kacheln') {
    html += '<div class="slots">';
    for (var s = 0; s < q.laenge; s++) {
      var gefuellt = s < abcBuilt.length;
      var ch = gefuellt ? q.tiles.filter(function (t) { return t.key === abcBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (gefuellt ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (abcPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var benutzt = abcBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile' + (benutzt ? ' used' : '') + '" data-abctile="' + t.key + '"' +
          (benutzt ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="abcUndo" aria-label="Letztes Zeichen entfernen">' +
        ICON.ruecktaste + '</button></div>';
    }
  } else {
    // Zwei Spalten: Laute wie «w» oder «tsch» füllen keine ganze Zeile, und ein
    // Raster hält die Trefferflächen trotzdem groß.
    html += '<div class="options abc-optionen">';
    q.options.forEach(function (o, i) {
      var gewaehlt = abcPicked === o[1];
      var klasse = 'option';
      if (abcPhase === 'feedback') {
        if (o[1] === q.b[1]) klasse += ' right';
        else if (gewaehlt) klasse += ' wrong';
        else klasse += ' muted';
      } else if (gewaehlt) klasse += ' picked';
      html += '<button class="' + klasse + (zeichenFrage ? '' : ' cyr') + '" data-abcopt="' + i + '"' +
        (abcPhase !== 'ask' ? ' disabled' : '') + '>' +
        esc(zeichenFrage ? o[2] : o[0] + ' ' + o[1]) + '</button>';
    });
    html += '</div>';
  }

  if (abcPhase === 'feedback') {
    html += '<div class="feedback ' + (abcCorrect ? 'good' : 'bad') + '">';
    html += abcCorrect
      ? '<p>' + ICON.haken + 'Richtig!</p>'
      : '<p>' + ICON.kreuz + (abcRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
        '<strong class="cyr">' + esc(q.b[0] + ' ' + q.b[1]) +
        '</strong> — klingt wie ' + esc(q.b[2]) + '</p>';
    // Erst nach der Auflösung — vorher wäre der Laut die Antwort.
    html += '</div>' + hoerzeile(q.b[1], null) + '<p class="hint">' + esc(q.b[3]) + '</p>' +
      meisterHtml();
  }
  html += '</div><div class="btn-row">';
  if (abcPhase === 'ask') {
    html += '<button class="btn ghost" id="abcReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="abcConfirm"' + (abcAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="abcNext">Weiter \u2192</button>';
  }
  html += '</div><p class="session-info">' + abcPool().length + ' offen · ' +
    abcGelernt() + ' von ' + ALPHABET.length + ' sitzen · ' +
    abcMeisterschaft() + ' gemeistert</p>';
  return html;
}

function renderBuchstaben() {
  main.innerHTML = '<section>' +
    (abcAnsicht === 'tafel' ? abcTafelHtml() : abcUebenHtml()) + '</section>';

  main.querySelectorAll('[data-abc]').forEach(function (b) {
    b.addEventListener('click', function () {
      var gew = ALPHABET[parseInt(b.dataset.abc, 10)];
      abcOffen = abcOffen === gew[1] ? null : gew[1];
      renderBuchstaben();
    });
  });
  var zurTafel = document.getElementById('abcZurTafel');
  if (zurTafel) zurTafel.addEventListener('click', function () {
    abcAnsicht = 'tafel';
    renderBuchstaben();
    renderKopf();
  });
  main.querySelectorAll('[data-abcopt]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (abcPhase !== 'ask') return;
      abcPicked = abcQ.options[parseInt(b.dataset.abcopt, 10)][1];
      if (state.settings.confirmUeben) renderBuchstaben();
      else abcPruefen();
    });
  });
  main.querySelectorAll('[data-abctile]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (abcPhase !== 'ask') return;
      var key = parseInt(b.dataset.abctile, 10);
      if (abcBuilt.indexOf(key) !== -1 || abcBuilt.length >= abcQ.laenge) return;
      abcBuilt.push(key);
      if (!state.settings.confirmUeben && abcBuilt.length === abcQ.laenge) abcPruefen();
      else renderBuchstaben();
    });
  });
  var undo = document.getElementById('abcUndo');
  if (undo) undo.addEventListener('click', function () {
    abcBuilt.pop();
    renderBuchstaben();
  });
  var reveal = document.getElementById('abcReveal');
  if (reveal) reveal.addEventListener('click', function () {
    abcRevealed = true;
    abcCorrect = false;
    abcUpdate(abcQ.b, false);
    abcPhase = 'feedback';
    renderBuchstaben();
  });
  var conf = document.getElementById('abcConfirm');
  if (conf) conf.addEventListener('click', function () { if (abcAbgabeBereit()) abcPruefen(); });
  var next = document.getElementById('abcNext');
  if (next) next.addEventListener('click', function () {
    abcFrageBauen();
    renderBuchstaben();
  });
}
