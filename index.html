  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function uebAbgabeBereit() {
  if (!uebQ) return false;
  if (uebQ.mode === 'tiles') {
    return state.settings.requireComplete
      ? uebBuilt.length === uebQ.laenge
      : uebBuilt.length > 0;
  }
  return uebPicked !== null;
}

function uebPruefen() {
  var q = uebQ;
  var setVorher = aktuellesSet();
  if (q.mode === 'tiles') {
    var attempt = uebBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    uebCorrect = normalize(attempt) === normalize(q.word.ru);
  } else {
    uebCorrect = uebPicked === q.word.id;
  }
  updateBox(q.word.id, uebCorrect);
  ton(uebCorrect);
  // Hat diese Antwort das laufende Set vollgemacht? Dann wartet der Jubel
  // auf das nächste «Weiter» — mitten in der Auflösung wäre er im Weg.
  if (aktuellesSet() !== setVorher && setGeschafft(setVorher)) uebGeschafftesSet = setVorher;
  uebPhase = 'feedback';
  renderUeben();
}

function renderUeben() {
  if (uebPhase === 'setfertig' && uebGeschafftesSet !== null) {
    var set = LERNSETS[uebGeschafftesSet];
    var offen = set.saetze.filter(satzFrei).length;
    var naechstes = aktuellesSet();
    main.innerHTML = '<section><div class="card jubel">' + maskottchen('gross') +
      '<p class="task-label">Set ' + (uebGeschafftesSet + 1) + ' geschafft</p>' +
      '<p class="word">' + offen + (offen === 1 ? ' Satz' : ' Sätze') + ' frei</p>' +
      '<p class="hint">' + (offen
        ? 'In «Übersetzen» wartet' + (offen === 1 ? '' : 'en') + ' unter anderem ' +
          set.saetze.slice(0, 2).map(function (satz) {
            return '<span class="cyr">' + esc(satz.ru) + '</span>';
          }).join(' und ')
        : 'Die Sätze dieses Sets sind schon geübt.') + '</p>' +
      (naechstes !== uebGeschafftesSet
        ? '<p class="hint">Als Nächstes: Set ' + (naechstes + 1) + ' mit ' +
          LERNSETS[naechstes].woerter.length + ' Wörtern.</p>' : '') +
      '</div><div class="btn-row">' +
      '<button class="btn ghost" id="jubelWeiter">Weiter lernen</button>' +
      '<button class="btn primary" id="jubelUebersetzen">Zu «Übersetzen»</button>' +
      '</div></section>';
    document.getElementById('jubelWeiter').addEventListener('click', function () {
      uebGeschafftesSet = null;
      uebNext(true);
    });
    document.getElementById('jubelUebersetzen').addEventListener('click', function () {
      // Frage neu aufsetzen, bevor wir gehen — sonst steht «Üben» bei der
      // Rückkehr noch in der Jubelphase und zeigt eine Frage ohne Knöpfe.
      uebZuruecksetzen();
      trTask = null;
      buildTransTask();
      setTab('uebersetzen');
    });
    return;
  }
  if (uebPhase === 'fact') {
    main.innerHTML =
      '<section>' +
      '<div class="sprechblase">' +
      '<span class="fact-label">Wussten Sie?</span>' +
      '<p class="fact-text">' + esc(uebFactText) + '</p></div>' +
      '<div class="fakt-fuss">' + maskottchen('klein') +
      '<button class="sternbtn' + (faktStand(uebFactText).f ? ' an' : '') + '" id="factFav" ' +
      'aria-pressed="' + (faktStand(uebFactText).f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
      (faktStand(uebFactText).f ? ICON.sternVoll : ICON.stern) + '</button></div>' +
      '<div class="btn-row"><button class="btn ghost" id="factAlle">Alle Fakten</button>' +
      '<button class="btn primary" id="factNext">Weiter üben</button></div>' +
      '</section>';
    document.getElementById('factNext').addEventListener('click', function () { uebNext(true); });
    document.getElementById('factAlle').addEventListener('click', function () { setTab('fakten'); });
    document.getElementById('factFav').addEventListener('click', function () {
      faktFavorit(uebFactText);
      renderUeben();
    });
    return;
  }
  if (!uebQ) uebQ = buildQuestion();
  if (!uebQ) { main.innerHTML = '<section>' + uebKopfHtml() + '</section>'; return; }
  var q = uebQ;
  var box = state.boxes[q.word.id] || 0;
  var promptRu = q.mode === 'mc-de';
  var prompt = (q.mode === 'tiles' || q.mode === 'mc-ru') ? q.word.de : q.word.ru;
  var taskLabel = q.mode === 'mc-de' ? 'Was bedeutet …' : q.mode === 'mc-ru' ? 'Welches Wort passt?' : 'Setzen Sie das Wort zusammen';

  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) dots += '<span class="' + (i <= box && box > 0 ? 'on' : '') + '"></span>';

  var html = '<section>' + uebKopfHtml();

  html += '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="card-theme">' + esc(q.word.theme) + '</span></div>' +
    '<p class="task-label">' + taskLabel + '</p>' +
    '<p class="word' + (promptRu ? ' cyr' : '') + '">' + esc(prompt) +
    (promptRu ? '<button class="speak" id="speakBtn" aria-label="Anhören">' + ICON.lautsprecher + '</button>' : '') + '</p>';

  if (q.mode === 'tiles') {
    html += '<div class="slots cyr">';
    for (var s = 0; s < q.laenge; s++) {
      var filled = s < uebBuilt.length;
      var ch = filled ? q.tiles.filter(function (t) { return t.key === uebBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (filled ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (uebPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var used = uebBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (used ? ' used' : '') + '" data-tile="' + t.key + '"' + (used ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="tileUndo" aria-label="Letzten Buchstaben entfernen">' + ICON.ruecktaste + '</button></div>';
    }
  }

  if (q.mode === 'mc-de' || q.mode === 'mc-ru') {
    html += '<div class="options">';
    q.options.forEach(function (opt, oi) {
      var cls = '';
      if (uebPhase === 'feedback') {
        if (opt.id === q.word.id) cls = ' right';
        else if (opt.id === uebPicked) cls = ' wrong';
        else cls = ' muted';
      } else if (opt.id === uebPicked) {
        cls = ' picked';
      }
      html += '<button class="option' + (q.mode === 'mc-ru' ? ' cyr' : '') + cls + '" data-opt="' + oi + '"' +
        (uebPhase !== 'ask' ? ' disabled' : '') + '>' +
        esc(q.mode === 'mc-de' ? opt.de : opt.ru) + '</button>';
    });
    html += '</div>';
  }

  if (uebPhase === 'feedback') {
    html += '<div class="feedback ' + (uebCorrect ? 'good' : 'bad') + '">';
    if (uebCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig!</p>';
    else html += '<p>' + ICON.kreuz + (uebRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="cyr">' + esc(q.word.ru) + '</strong> — ' + esc(q.word.de) +
      ' <span class="translit">[' + esc(q.word.tr) + ']</span></p>';
    html += '</div>';
  }

  html += '</div><div class="btn-row">';
  if (uebPhase === 'ask') {
    html += '<button class="btn ghost" id="uebReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="uebConfirm"' + (uebAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="uebNext">Weiter \u2192</button>';
  }
  html += '</div>';
  html += '<p class="session-info">' + state.answered + ' beantwortet · Beste Serie: ' + state.bestStreak + '</p></section>';

  main.innerHTML = html;

  var wahl = document.getElementById('uebWahl');
  if (wahl) wahl.addEventListener('change', function (e) {
    var w = e.target.value;
    uebAuswahl = (w === 'aktuell' || w === 'alle') ? w : parseInt(w, 10);
    uebNext(true);
  });
  var themaWahl = document.getElementById('uebThemaWahl');
  if (themaWahl) themaWahl.addEventListener('change', function (e) {
    uebThema = e.target.value;
    uebNext(true);
  });
  var sp = document.getElementById('speakBtn');
  if (sp) sp.addEventListener('click', function () { speak(q.word.ru); });

  if (uebPhase === 'ask') {
    document.getElementById('uebReveal').addEventListener('click', function () {
      uebRevealed = true;
      uebCorrect = false;
      updateBox(q.word.id, false);
      uebPhase = 'feedback';
      renderUeben();
    });
    main.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        uebPicked = q.options[parseInt(b.dataset.opt, 10)].id;
        if (state.settings.confirmUeben) renderUeben();
        else uebPruefen();
      });
    });
    main.querySelectorAll('[data-tile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.tile, 10);
        if (uebBuilt.indexOf(key) !== -1 || uebBuilt.length >= q.laenge) return;
        uebBuilt.push(key);
        if (!state.settings.confirmUeben && uebBuilt.length === q.laenge) uebPruefen();
        else renderUeben();
      });
    });
    var confirmBtn = document.getElementById('uebConfirm');
    if (confirmBtn) confirmBtn.addEventListener('click', function () {
      if (uebAbgabeBereit()) uebPruefen();
    });
    var undo = document.getElementById('tileUndo');
    if (undo) undo.addEventListener('click', function () {
      uebBuilt.pop();
      renderUeben();
    });
  } else {
    document.getElementById('uebNext').addEventListener('click', function () { uebNext(false); });
  }
}

// ── ÜBERSETZEN ──────────────────────────────────────────────
// Ein Satz wird erst angeboten, wenn jede seiner Voraussetzungen (Grundformen
// aus dem Lehrplan) mindestens SATZ_STUFE erreicht hat.
var SATZ_STUFE = 2;
var trLevel = 1, trDir = 'ru-de';
var trModus = 'lernen';   // 'lernen' · 'wiederholung' — wie in «Tippen»
var trTask = null, trBuilt = [], trPhase = 'ask', trCorrect = null, trRevealed = false;

function satzFrei(s) {
  return s.benoetigt.every(function (w) { return (state.boxes[w] || 0) >= SATZ_STUFE; });
}
function satzFehlt(s) {
  return s.benoetigt.filter(function (w) { return (state.boxes[w] || 0) < SATZ_STUFE; });
}
function stufenSaetze(stufe) {
  return SENTENCES.filter(function (s) { return s.stufe === stufe; });
}
function freieSaetze(stufe) {
  return stufenSaetze(stufe).filter(satzFrei);
}

// Dieselbe Teilung wie in «Tippen»: was noch nicht sitzt, und was sitzt, aber
// nach der Auffrischfrist einmal zur Sicherheit drankommt. Beim Lernen wird
// nicht nach Fälligkeit gefiltert — wer üben will, soll üben dürfen.
function trLernen(stufe) {
  return freieSaetze(stufe).filter(function (s) { return satzBox(s) < BOX_MAX; });
}
function trWiederholung(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && satzFaellig(s, jetzt);
  });
}
function trRuhend(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && !satzFaellig(s, jetzt);
  });
}
function trPool() {
  return trModus === 'wiederholung' ? trWiederholung(trLevel) : trLernen(trLevel);
}
function trNaechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  var beste = null;
  trRuhend(trLevel).forEach(function (s) {
    var wann = (state.satzSeen[s.ru] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Niedrigste Stufe zuerst, bei Gleichstand das am längsten Zurückliegende.
// Aus den vordersten vieren wird gelost, damit sich nicht jede Sitzung gleich
// anfühlt; der gerade gelöste Satz kommt nicht sofort wieder.
function waehleSatz(pool, ausser) {
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = satzBox(a), bb = satzBox(b);
    if (ba !== bb) return ba - bb;
    return (state.satzSeen[a.ru] || 0) - (state.satzSeen[b.ru] || 0);
  });
  if (ausser && sortiert.length > 1) {
    sortiert = sortiert.filter(function (s) { return s !== ausser; });
  }
  var fenster = sortiert.slice(0, Math.min(4, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Ohne Argument wird der nächste Satz gewählt; mit Argument ein bestimmter.
function buildTransTask(vorgabe) {
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln.
  if (!vorgabe && !trPool().length) {
    var anderer = trModus === 'lernen' ? 'wiederholung' : 'lernen';
    trModus = anderer;
    if (!trPool().length) trModus = 'lernen';
  }
  var liste = freieSaetze(trLevel);
  var satz = vorgabe || waehleSatz(trPool(), trTask ? trTask.satz : null);
  if (!satz) { trTask = null; return; }
  var ru = satz.ru, de = satz.de;
  var prompt = trDir === 'ru-de' ? ru : de;
  var targetTokens = tokenize(trDir === 'ru-de' ? de : ru);
  var solution = trDir === 'ru-de' ? de : ru;
  var targetNorm = {};
  targetTokens.forEach(function (w) { targetNorm[normalize(w)] = true; });
  // Ablenker kommen aus allen freigeschalteten Sätzen der Stufe, nicht nur aus
  // dem aktuellen Stapel — sonst wird die Auswahl mit der Zeit dünn.
  var otherWords = [];
  liste.forEach(function (p) {
    if (p === satz) return;
    tokenize(trDir === 'ru-de' ? p.de : p.ru).forEach(function (w) {
      if (!targetNorm[normalize(w)]) otherWords.push(w);
    });
  });
  var uniq = [];
  var seen = {};
  otherWords.forEach(function (w) { if (!seen[w]) { seen[w] = true; uniq.push(w); } });
  var distractors = shuffle(uniq).slice(0, Math.min(3, uniq.length));
  var tiles = shuffle(targetTokens.concat(distractors)).map(function (word, i) {
    return { word: word, key: i };
  });
  trTask = { prompt: prompt, targetTokens: targetTokens, solution: solution, tiles: tiles, ru: ru, satz: satz };
  trBuilt = [];
  trPhase = 'ask';
  trCorrect = null;
  trRevealed = false;
}

function trWort(key) {
  return trTask.tiles.filter(function (x) { return x.key === key; })[0].word;
}

// Ist genug gelegt, um abgeben zu dürfen?
function trAbgabeBereit() {
  if (!trTask) return false;
  return state.settings.requireComplete
    ? trBuilt.length === trTask.targetTokens.length
    : trBuilt.length > 0;
}

function trPruefen() {
  var ok = trBuilt.length === trTask.targetTokens.length && trBuilt.every(function (k, i) {
    return normalize(trWort(k)) === normalize(trTask.targetTokens[i]);
  });
  trFinish(ok);
}

function trFinish(ok) {
  trCorrect = ok;
  ton(ok);
  trPhase = 'feedback';
  satzUpdate(trTask.satz, ok);
  state.transStats.correct += ok ? 1 : 0;
  state.transStats.wrong += ok ? 0 : 1;
  save();
}

// Drei Gr\u00fcnde f\u00fcr eine leere Ansicht, die sich sehr verschieden anf\u00fchlen:
// noch kein Satz freigeschaltet, alle S\u00e4tze sitzen, oder nichts f\u00e4llig.
function renderUebersetzenLeer() {
  var frei = freieSaetze(trLevel);
  var offen = trLernen(trLevel).length;
  var frisch = trWiederholung(trLevel).length;
  var ruhend = trRuhend(trLevel).length;

  var html = '<section>' + stufenLeisteHtml() + trKacheln() +
    '<div class="leer">' + maskottchen('gross');

  if (!frei.length) {
    var stufe = stufenSaetze(trLevel);
    var naechster = stufe.slice().sort(function (a, b) {
      return satzFehlt(a).length - satzFehlt(b).length;
    })[0];
    var fehlt = naechster ? satzFehlt(naechster) : [];
    html += '<h3>Noch kein Satz auf Stufe ' + trLevel + '</h3>' +
      '<p>Ein Satz erscheint, sobald alle seine W\u00f6rter in \u00abLernsets\u00bb oder \u00abFreestyle\u00bb ' +
      'mindestens Stufe ' + SATZ_STUFE + ' erreicht haben.</p>';
    if (fehlt.length) {
      html += '<p class="naechste">Dem n\u00e4chsten Satz fehlen noch: ' + fehlt.slice(0, 6).map(function (w) {
        return '<span class="cyr">' + esc(w) + '</span>';
      }).join(' \u00b7 ') + (fehlt.length > 6 ? ' \u2026' : '') + '</p>';
    }
    html += '<div class="btn-row"><button class="btn primary" id="trZuUeben">Zu \u00abLernsets\u00bb</button></div>';
  } else if (trModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts f\u00e4llig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Satz sitzt und ruht.' : ' S\u00e4tze sitzen und ruhen.') +
          ' Der n\u00e4chste kommt ' + esc(trNaechsteAuffrischung()) + ' zur Sicherheit noch einmal.'
        : 'Hier erscheinen S\u00e4tze, die Sie ' + BOX_MAX + '\u00d7 richtig \u00fcbersetzt haben \u2014 nach ' +
          (state.settings.auffrischen || 21) + ' Tagen einmal zur Sicherheit.') + '</p>';
    if (offen) {
      html += '<div class="btn-row"><button class="btn primary" id="trZuLernen">' +
        offen + (offen === 1 ? ' Satz offen' : ' S\u00e4tze offen') + '</button></div>';
    }
  } else {
    html += '<h3>Stufe ' + trLevel + ' sitzt</h3>' +
      '<p>Alle ' + frei.length + ' freigeschalteten S\u00e4tze dieser Stufe haben Sie ' + BOX_MAX +
      '\u00d7 richtig \u00fcbersetzt. ' +
      (frisch
        ? frisch + (frisch === 1 ? ' wartet' : ' warten') + ' zum Auffrischen.'
        : 'Die n\u00e4chste Auffrischung kommt ' + esc(trNaechsteAuffrischung()) + '.') + '</p>' +
      '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="trZuFrisch">Wiederholen</button>' : '') +
      '<button class="btn ghost" id="trZuUeben">Neue W\u00f6rter lernen</button></div>';
  }

  html += '</div></section>';
  main.innerHTML = html;

  bindeStufenLeiste();
  var zu = document.getElementById('trZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('trZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    trModus = 'wiederholung';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
  });
  var lernBtn = document.getElementById('trZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    trModus = 'lernen';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
  });
}


// Stufenwahl mit Angabe, wie viele S\u00e4tze je Stufe schon offen sind.
function stufenLeisteHtml() {
  var stufen = [];
  SENTENCES.forEach(function (s) { if (stufen.indexOf(s.stufe) === -1) stufen.push(s.stufe); });
  stufen.sort(function (a, b) { return a - b; });
  var html = '<div class="controls">';
  stufen.forEach(function (l) {
    html += '<button class="chip' + (trLevel === l ? ' active' : '') + '" data-level="' + l + '">' +
      'Stufe ' + l + ' \u00b7 ' + freieSaetze(l).length + '/' + stufenSaetze(l).length + '</button>';
  });
  html += '<button class="chip" id="trDir">' + (trDir === 'ru-de' ? 'RU \u2192 DE' : 'DE \u2192 RU') + '</button></div>';
  return html;
}
// Zweite Reihe: derselbe Gedanke wie in «Tippen» — was noch offen ist und was
// nur zur Sicherheit noch einmal kommt.
function trKacheln() {
  var offen = trLernen(trLevel).length;
  var frisch = trWiederholung(trLevel).length;
  return '<div class="controls">' +
    '<button class="chip' + (trModus === 'lernen' ? ' active' : '') +
    '" data-trmodus="lernen">Lernen \u00b7 ' + offen + '</button>' +
    '<button class="chip' + (trModus === 'wiederholung' ? ' active' : '') +
    '" data-trmodus="wiederholung">Wiederholung \u00b7 ' + frisch + '</button></div>';
}

function bindeStufenLeiste() {
  main.querySelectorAll('[data-trmodus]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (trModus === b.dataset.trmodus) return;
      trModus = b.dataset.trmodus;
      trTask = null;
      trBuilt = [];
      trPhase = 'ask';
      trRevealed = false;
      buildTransTask();
      renderUebersetzen();
    });
  });
  main.querySelectorAll('[data-level]').forEach(function (b) {
    b.addEventListener('click', function () {
      trLevel = parseInt(b.dataset.level, 10);
      trTask = null;
      buildTransTask();
      renderUebersetzen();
    });
  });
  var dir = document.getElementById('trDir');
  if (dir) dir.addEventListener('click', function () {
    trDir = trDir === 'ru-de' ? 'de-ru' : 'ru-de';
    buildTransTask();
    renderUebersetzen();
  });
}

function renderUebersetzen() {
  if (!trTask) buildTransTask();
  if (!trTask) { renderUebersetzenLeer(); return; }
  var t = trTask;
  var promptIsRu = trDir === 'ru-de';
  var liste = freieSaetze(trLevel);

  var html = '<section>' + stufenLeisteHtml() + trKacheln();

  html += '<div class="card"><p class="task-label">Übersetzen Sie</p>' +
    '<p class="sentence' + (promptIsRu ? ' cyr' : '') + '">' + esc(t.prompt) +
    (promptIsRu ? '<button class="speak" id="trSpeak" aria-label="Anhören">' + ICON.lautsprecher + '</button>' : '') + '</p>';

  html += '<div class="built' + (promptIsRu ? '' : ' cyr') + '">';
  if (trBuilt.length === 0 && trPhase === 'ask') {
    html += '<span class="built-placeholder">Wörter in der richtigen Reihenfolge antippen</span>';
  } else {
    trBuilt.forEach(function (k, i) {
      var w = esc(trWort(k));
      // In der Frage-Phase ist jedes gelegte Wort einzeln antippbar zum Entfernen.
      html += trPhase === 'ask'
        ? '<button class="built-word" data-built="' + i + '" aria-label="«' + w + '» entfernen">' + w + '</button>'
        : '<span class="built-word">' + w + '</span>';
    });
  }
  html += '</div>';

  if (trPhase === 'ask') {
    if (trBuilt.length > 0) html += '<p class="hint">Zum Entfernen ein gelegtes Wort antippen.</p>';
    html += '<div class="tiles">';
    t.tiles.forEach(function (tile) {
      var used = trBuilt.indexOf(tile.key) !== -1;
      html += '<button class="wordtile' + (promptIsRu ? '' : ' cyr') + (used ? ' used' : '') +
        '" data-wtile="' + tile.key + '"' + (used ? ' disabled' : '') + '>' + esc(tile.word) + '</button>';
    });
    html += '<button class="wordtile fn" id="trUndo" aria-label="Letztes Wort entfernen">' + ICON.ruecktaste + '</button></div>';
  }

  if (trPhase === 'feedback') {
    html += '<div class="feedback ' + (trCorrect ? 'good' : 'bad') + '">';
    if (trCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig übersetzt!</p>';
    else html += '<p>' + ICON.kreuz + (trRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="' + (promptIsRu ? '' : 'cyr') + '">' + esc(t.solution) + '</strong></p>';
    html += '</div>';
  }

  html += '</div><div class="btn-row">';
  if (trPhase === 'ask') {
    html += '<button class="btn ghost" id="trReveal">Aufdecken</button>';
    if (state.settings.confirmUebersetzen) {
      html += '<button class="btn primary" id="trConfirm"' + (trAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="trNext">Weiter \u2192</button>';
  }
  html += '</div>';

  var sitzt = liste.filter(function (x) { return satzBox(x) >= BOX_MAX; }).length;
  html += '<p class="session-info">' + trPool().length +
    (trModus === 'wiederholung' ? ' zum Auffrischen' : ' offen') + ' · ' +
    sitzt + ' von ' + liste.length + ' sitzt';
  if (state.transStats.correct + state.transStats.wrong > 0) {
    html += ' · ' + state.transStats.correct + ' richtig, ' + state.transStats.wrong + ' falsch';
  }
  html += '</p></section>';

  main.innerHTML = html;

  bindeStufenLeiste();
  var sp = document.getElementById('trSpeak');
  if (sp) sp.addEventListener('click', function () { speak(trTask.ru); });

  if (trPhase === 'ask') {
    main.querySelectorAll('[data-wtile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.wtile, 10);
        if (trBuilt.indexOf(key) !== -1) return;
        trBuilt.push(key);
        if (!state.settings.confirmUebersetzen && trBuilt.length === trTask.targetTokens.length) trPruefen();
        renderUebersetzen();
      });
    });
    main.querySelectorAll('[data-built]').forEach(function (b) {
      b.addEventListener('click', function () {
        trBuilt.splice(parseInt(b.dataset.built, 10), 1);
        renderUebersetzen();
      });
    });
    var trConfirm = document.getElementById('trConfirm');
    if (trConfirm) trConfirm.addEventListener('click', function () {
      if (!trAbgabeBereit()) return;
      trPruefen();
      renderUebersetzen();
    });
    document.getElementById('trUndo').addEventListener('click', function () {
      trBuilt.pop();
      renderUebersetzen();
    });
    document.getElementById('trReveal').addEventListener('click', function () {
      trRevealed = true;
      trFinish(false);
      renderUebersetzen();
    });
  } else {
    document.getElementById('trNext').addEventListener('click', function () {
      buildTransTask();
      renderUebersetzen();
    });
  }
}

// ── TIPPEN ──────────────────────────────────────────────────
// Getippt wird, was beim Vokabeltraining angefangen hat zu sitzen — ab
// settings.tippenStufe. Wer ein Wort richtig tippt, macht damit die letzte
// Stufe voll; danach ist es **aus dem Pool**. Nach der Auffrischfrist kommt es
// einmal zur Sicherheit wieder — richtig getippt, und es ist wieder draußen.
var tWord = null, tResult = null, tHint = false, tKb = null;
var tippenModus = 'lernen';   // 'lernen' · 'wiederholung'

// Offen: begonnen, aber noch nicht fertig. Ohne Fälligkeitsfilter — wer üben
// will, soll üben dürfen, nicht auf den nächsten Tag warten.
function tippenLernen() {
  var schwelle = state.settings.tippenStufe;
  return ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b >= schwelle && b < BOX_MAX;
  });
}
// Fertig und die Frist ist um: einmal zur Sicherheit.
function tippenWiederholung() {
  var jetzt = Date.now();
  return ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && faellig(v, jetzt);
  });
}
function tippenPool() {
  return tippenModus === 'wiederholung' ? tippenWiederholung() : tippenLernen();
}
// Fertig, aber noch nicht fällig — das sind die, die gerade ruhen.
function tippenRuhend() {
  var jetzt = Date.now();
  return ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && !faellig(v, jetzt);
  });
}
// Wann wird das nächste ruhende Wort wieder fällig?
function naechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  var beste = null;
  tippenRuhend().forEach(function (v) {
    var wann = (state.lastSeen[v.id] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Die Kachelreihe: Lernen und Wiederholung mit ihren Beständen.
function tippenKacheln() {
  var offen = tippenLernen().length;
  var frisch = tippenWiederholung().length;
  return '<div class="controls">' +
    '<button class="chip' + (tippenModus === 'lernen' ? ' active' : '') +
    '" data-tmodus="lernen">Lernen \u00b7 ' + offen + '</button>' +
    '<button class="chip' + (tippenModus === 'wiederholung' ? ' active' : '') +
    '" data-tmodus="wiederholung">Wiederholung \u00b7 ' + frisch + '</button></div>';
}
function bindeTippenKacheln() {
  main.querySelectorAll('[data-tmodus]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (tippenModus === b.dataset.tmodus) return;
      tippenModus = b.dataset.tmodus;
      tWord = null;
      tResult = null;
      tHint = false;
      renderTippen();
    });
  });
}

// Leerzustand: drei Fälle, die sich sehr verschieden anfühlen — noch nichts
// freigeschaltet, alles getippt, oder gerade nichts fällig.
function renderTippenLeer() {
  var schwelle = state.settings.tippenStufe;
  var ruhend = tippenRuhend().length;
  var offen = tippenLernen().length;
  var frisch = tippenWiederholung().length;
  var fast = ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b > 0 && b < schwelle;
  }).sort(function (a, b) { return (state.boxes[b.id] || 0) - (state.boxes[a.id] || 0); });

  var html = '<section>' + tippenKacheln() + '<div class="leer">' + maskottchen('gross');

  if (tippenModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts fällig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Wort sitzt' : ' Wörter sitzen') + ' und ruhen. Das nächste kommt ' +
          esc(naechsteAuffrischung()) + ' zur Sicherheit noch einmal.'
        : 'Hier erscheinen Wörter, die Sie fertig gelernt haben — nach ' +
          (state.settings.auffrischen || 21) + ' Tagen einmal zur Sicherheit.') + '</p>';
    if (offen) {
      html += '<div class="btn-row"><button class="btn primary" id="tZuLernen">' +
        offen + (offen === 1 ? ' Wort offen' : ' Wörter offen') + '</button></div>';
    }
  } else if (ruhend || frisch) {
    html += '<h3>Alles getippt</h3>' +
      '<p>Auf der Lernstufe wartet kein Wort mehr. ' +
      (ruhend ? ruhend + (ruhend === 1 ? ' Wort sitzt und ruht. ' : ' Wörter sitzen und ruhen. ') : '') +
      (frisch
        ? frisch + (frisch === 1 ? ' ist' : ' sind') + ' zum Auffrischen bereit.'
        : 'Die nächste Auffrischung kommt ' + esc(naechsteAuffrischung()) + '.') +
      '</p>';
    html += '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="tZuFrisch">Wiederholen</button>' : '') +
      '<button class="btn ghost" id="tZuUeben">Neue Wörter lernen</button></div>';
  } else {
    html += '<h3>Noch kein Wort freigeschaltet</h3>' +
      '<p>Hier tippen Sie nur Wörter, die in «Lernsets» oder «Freestyle» angefangen haben zu sitzen — ' +
      'ab Stufe ' + schwelle + ' von ' + BOX_MAX + ', also ' + schwelle +
      '× nacheinander richtig beantwortet.</p>';
    if (fast.length) {
      html += '<p class="naechste">Am nächsten dran: ' + fast.slice(0, 3).map(function (v) {
        return '<span class="cyr">' + esc(v.ru) + '</span> (Stufe ' + (state.boxes[v.id] || 0) + ')';
      }).join(' · ') + '</p>';
    } else {
      html += '<p class="naechste">Noch kein Wort begonnen — fangen Sie mit dem ersten Lernset an.</p>';
    }
    html += '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Lernsets»</button></div>';
  }

  html += '</div><p class="session-info">Schwelle und Auffrischfrist stehen in den Einstellungen.</p></section>';
  main.innerHTML = html;

  bindeTippenKacheln();
  var zu = document.getElementById('tZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('tZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    tippenModus = 'wiederholung';
    tWord = null;
    renderTippen();
  });
  var lernBtn = document.getElementById('tZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    tippenModus = 'lernen';
    tWord = null;
    renderTippen();
  });
}

function renderTippen() {
  if (tKb === null) tKb = state.settings.tastaturAn;
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln —
  // sonst stünde man vor einem Leerzustand, obwohl es etwas zu tun gibt.
  if (!tResult && !tippenPool().length) {
    var anderer = tippenModus === 'lernen' ? 'wiederholung' : 'lernen';
    tippenModus = anderer;
    if (!tippenPool().length) tippenModus = 'lernen';
  }
  var pool = tippenPool();
  // Während der Rückmeldung bleibt das Wort stehen, auch wenn es nach einem
  // Fehler unter die Schwelle gerutscht ist — sonst verschwände die Auflösung.
  if (!tResult && (!tWord || pool.indexOf(tWord) === -1)) tWord = waehleWort(pool);
  if (!tWord) { renderTippenLeer(); return; }
  var w = tWord;
  var stats = state.typingStats;
  var total = stats.correct + stats.wrong;

  var html = '<section>' + tippenKacheln() + '<div class="card">' +
    '<p class="task-label">' + (tippenModus === 'wiederholung'
      ? 'Zur Sicherheit noch einmal' : 'Schreiben Sie auf Russisch') + '</p>' +
    '<p class="word">' + esc(w.de) + '</p>' +
    (tHint ? '<p class="translit">[' + esc(w.tr) + ']</p>' : '') +
    '<input type="text" id="tInput" class="cyr' + (tResult === 'right' ? ' ok' : tResult === 'wrong' ? ' err' : '') + '"' +
    ' placeholder="кириллица \u2026" lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
    (tResult ? ' readonly' : '') + '>';

  if (tResult === 'wrong') html += '<p class="feedback bad">' + ICON.kreuz + 'Richtig: <strong class="cyr">' + esc(w.ru) + '</strong></p>';
  if (tResult === 'right') html += '<p class="feedback good">' + ICON.haken + 'Правильно — richtig!</p>';
  html += '</div><div class="btn-row">';
  if (!tResult) {
    html += '<button class="btn ghost" id="tHintBtn">Hinweis</button>' +
      '<button class="btn primary" id="tCheck">Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="tNext">Nächstes Wort \u2192</button>';
  }
  html += '</div>';
  html += '<button class="kb-toggle" id="tKbToggle">' + (tKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
  if (tKb) {
    html += '<div>';
    KB_ROWS.forEach(function (row, ri) {
      html += '<div class="kb-row">';
      row.forEach(function (ch) {
        html += '<button class="key cyr" data-key="' + esc(ch) + '">' + esc(ch) + '</button>';
      });
      if (ri === 2) {
        html += '<button class="key wide" data-key=" ">\u2423</button>' +
          '<button class="key wide" data-key="BS" aria-label="Zeichen löschen">' + ICON.ruecktaste + '</button>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<p class="session-info">' + pool.length +
    (tippenModus === 'wiederholung' ? ' zum Auffrischen' : ' offen') + ' · ' +
    stats.correct + ' richtig · ' + stats.wrong + ' falsch' +
    (total > 0 ? ' · Quote ' + Math.round(stats.correct / total * 100) + ' %' : '') + '</p></section>';

  main.innerHTML = html;
  bindeTippenKacheln();

  var input = document.getElementById('tInput');

  function check() {
    if (tResult) return;
    var ok = normalize(input.value) === normalize(w.ru);
    tResult = ok ? 'right' : 'wrong';
    updateBox(w.id, ok);
    ton(ok);
    state.typingStats.correct += ok ? 1 : 0;
    state.typingStats.wrong += ok ? 0 : 1;
    save();
    var v = input.value;
    renderTippen();
    document.getElementById('tInput').value = v;
  }
  function next() {
    tResult = null;
    tHint = false;
    tWord = waehleWort(tippenPool());
    renderTippen();
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { if (tResult) next(); else check(); }
  });
  var hintBtn = document.getElementById('tHintBtn');
  if (hintBtn) hintBtn.addEventListener('click', function () {
    tHint = true;
    var v = input.value;
    renderTippen();
    document.getElementById('tInput').value = v;
  });
  var checkBtn = document.getElementById('tCheck');
  if (checkBtn) checkBtn.addEventListener('click', check);
  var nextBtn = document.getElementById('tNext');
  if (nextBtn) nextBtn.addEventListener('click', next);
  document.getElementById('tKbToggle').addEventListener('click', function () {
    tKb = !tKb;
    var v = document.getElementById('tInput').value;
    renderTippen();
    document.getElementById('tInput').value = v;
  });
  main.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (tResult) return;
      var inp = document.getElementById('tInput');
      var k = b.dataset.key;
      if (k === 'BS') inp.value = inp.value.slice(0, -1);
      else inp.value += k;
    });
  });
}

// ── EINSTELLUNGEN ───────────────────────────────────────────
function renderEinstellungen() {
  var s = state.settings;

  function schalter(key, titel, hinweis, gesperrt) {
    var an = s[key];
    return '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<button class="switch' + (an ? ' on' : '') + '" role="switch" aria-checked="' + (an ? 'true' : 'false') +
      '" aria-label="' + esc(titel) + '" data-set="' + key + '"' + (gesperrt ? ' disabled' : '') +
      '><span class="knob"></span></button></div>';
  }

  // Auswahl aus mehreren Werten (Leitner-Stufe) als Chip-Reihe.
  function wahl(key, titel, hinweis, werte) {
    var html = '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahl="' + key +
        '" data-wert="' + w.wert + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

  function wahlText(key, titel, hinweis, werte) {
    var html = '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahltext="' + key +
        '" data-wert="' + esc(w.wert) + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

  var ohneBestaetigung = !s.confirmUeben && !s.confirmUebersetzen;

  // Gegliedert nach der Frage, die die Einstellung beantwortet: *was* wird
  // wann geübt, *wie* gebe ich ab, *womit* tippe ich, *wie* wirkt die App.
  main.innerHTML = '<section><h2>Lernweg</h2>' +
    wahl('tippenStufe', 'Tippen ab Stufe',
      'Ab welcher Leitner-Stufe ein Wort in «Tippen» erscheint. Stufe 3 heißt: drei Mal nacheinander richtig — richtig getippt macht es dann Stufe 4 voll.',
      [{ wert: 2, text: '2' }, { wert: 3, text: '3' }, { wert: 4, text: '4' }]) +
    wahl('auffrischen', 'Auffrischen nach',
      'Fertig Gelerntes verschwindet aus «Tippen» und «Übersetzen». Nach dieser Frist kommt es einmal zur Sicherheit zurück — richtig beantwortet, und es ist wieder draußen.',
      [{ wert: 7, text: '7 T' }, { wert: 14, text: '14 T' }, { wert: 21, text: '21 T' }, { wert: 30, text: '30 T' }]) +
    '<h2>Abgabe</h2>' +
    schalter('confirmUeben', 'Bestätigen beim Vokabeltraining',
      'Antwort erst auswählen, dann mit «Bestätigen» abgeben. Aus: Der erste Tipp zählt sofort.') +
    schalter('confirmUebersetzen', 'Bestätigen in «Übersetzen»',
      'Satz erst zusammenstellen, dann mit «Bestätigen» abgeben. Aus: Der Satz zählt, sobald das letzte Wort liegt.') +
    schalter('requireComplete', 'Erst bei vollständiger Lösung',
      'Bestätigen ist erst möglich, wenn alle Buchstaben beziehungsweise Wörter liegen. Verrät dadurch die Länge der Lösung.',
      ohneBestaetigung) +
    '<h2>Eingabe</h2>' +
    schalter('tastaturAn', 'Tastatur gleich einblenden',
      'Zeigt die eingebaute kyrillische Tastatur in «Tippen» sofort. Aus: Sie klappen sie bei Bedarf auf.') +
    '<h2>Darstellung und Ton</h2>' +
    wahlText('darstellung', 'Darstellung',
      'Dunkel ist die Vorgabe. «System» folgt der Einstellung des iPhones.',
      [{ wert: 'system', text: 'System' }, { wert: 'dunkel', text: 'Dunkel' }, { wert: 'hell', text: 'Hell' }]) +
    schalter('ton', 'Ton bei richtig und falsch',
      'Ein kurzer Klang nach jeder Antwort. Der Stummschalter des iPhones hat Vorrang.') +
    '<p class="settings-note">Die Einstellungen gelten nur auf diesem Gerät und werden zusammen mit dem ' +
    'Lernstand gespeichert. «Fortschritt zurücksetzen» in der Bilanz lässt sie unberührt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="setBack">Zurück</button></div></section>';

  main.querySelectorAll('[data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      var key = b.dataset.set;
      state.settings[key] = !state.settings[key];
      save();
      renderEinstellungen();
    });
  });
  main.querySelectorAll('[data-wahltext]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.settings[b.dataset.wahltext] = b.dataset.wert;
      save();
      updateDarstellung();
      renderEinstellungen();
    });
  });
  main.querySelectorAll('[data-wahl]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.settings[b.dataset.wahl] = parseInt(b.dataset.wert, 10);
      save();
      renderEinstellungen();
    });
  });
  document.getElementById('setBack').addEventListener('click', function () { setTab(letzterTab); });
}

// ── SPRACHFAKTEN ────────────────────────────────────────────
var faktenFilter = 'gesehen'; // 'gesehen' · 'favoriten' · 'alle'

function renderFakten() {
  var gesehen = FACTS.filter(function (f) { return faktStand(f).n > 0; });
  var favoriten = FACTS.filter(function (f) { return faktStand(f).f; });
  var liste = faktenFilter === 'alle' ? FACTS
    : faktenFilter === 'favoriten' ? favoriten
    : gesehen;
  if (faktenFilter === 'gesehen') {
    // am häufigsten Gezeigtes zuerst — das sind die, die man wirklich kennt
    liste = liste.slice().sort(function (a, b) { return faktStand(b).n - faktStand(a).n; });
  }

  var html = '<section><div class="controls">' +
    [['gesehen', 'Gesehen ' + gesehen.length], ['favoriten', 'Favoriten ' + favoriten.length],
      ['alle', 'Alle ' + FACTS.length]].map(function (w) {
      return '<button class="chip' + (faktenFilter === w[0] ? ' active' : '') +
        '" data-filter="' + w[0] + '">' + esc(w[1]) + '</button>';
    }).join('') + '</div>';

  if (!liste.length) {
    html += '<div class="leer">' + maskottchen('gross') + '<h3>' +
      (faktenFilter === 'favoriten' ? 'Noch keine Favoriten' : 'Noch keinen Fakt gesehen') + '</h3>' +
      '<p>' + (faktenFilter === 'favoriten'
        ? 'Tippen Sie auf den Stern, wenn Ihnen einer gefällt — hier finden Sie ihn wieder.'
        : 'Nach je fünf Antworten erscheint ein Sprachfakt. Sie sammeln sich hier an.') +
      '</p></div>';
  } else {
    html += '<div class="faktenliste">';
    liste.forEach(function (f, i) {
      var stand = faktStand(f);
      html += '<div class="faktzeile' + (stand.n === 0 ? ' neu' : '') + '">' +
        '<span class="fakttext">' + esc(f) +
        '<span class="faktzahl">' + (stand.n === 0 ? 'noch nicht gezeigt'
          : stand.n === 1 ? 'einmal gezeigt' : stand.n + '× gezeigt') + '</span></span>' +
        '<button class="sternbtn' + (stand.f ? ' an' : '') + '" data-fav="' + i +
        '" aria-pressed="' + (stand.f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
        (stand.f ? ICON.sternVoll : ICON.stern) + '</button></div>';
    });
    html += '</div>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="faktenBack">Zurück</button></div></section>';
  main.innerHTML = html;

  main.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () { faktenFilter = b.dataset.filter; renderFakten(); });
  });
  main.querySelectorAll('[data-fav]').forEach(function (b) {
    b.addEventListener('click', function () {
      faktFavorit(liste[parseInt(b.dataset.fav, 10)]);
      renderFakten();
    });
  });
  document.getElementById('faktenBack').addEventListener('click', function () { setTab(letzterTab); });
}

      '<button class="btn primary" id="tkSichern">Sichern</button></div>';
  } else {
    html += '<div class="controls">' +
      '<button class="chip" data-neu="bug">Fehler melden</button>' +
      '<button class="chip" data-neu="feature">Wunsch melden</button></div>';

    if (!tickets.length) {
      html += '<div class="leer">' + maskottchen('gross') +

      html += '<div class="tkliste">';
      tickets.forEach(function (t, i) {
        html += '<div class="tkzeile' + (t.uebergeben ? ' gesendet' : '') + '">' +
          '<span class="tktext"><span class="tkart ' + t.art + '">' +
          (t.art === 'bug' ? 'Fehler' : 'Wunsch') + '</span>' + esc(t.titel) +
          '<span class="tkmeta">' + esc(datumKurz(t.erstellt)) + ' · ' + esc(t.reiter) + ' · ' +
          (t.uebergeben ? 'übergeben ' + esc(datumKurz(t.uebergeben)) : 'offen') + '</span></span>' +
          '<button class="sternbtn" data-tkweg="' + i + '" aria-label="Ticket löschen">' +
          ICON.kreuz + '</button></div>';
      });
      html += '</div><div class="btn-row">';
      if (offen.length) {
        html += '<button class="btn primary" id="tkKopieren">' + offen.length +
          (offen.length === 1 ? ' offenes kopieren' : ' offene kopieren') + '</button>';
      }
      if (uebergeben) {
        html += '<button class="btn ghost" id="tkAlle">Alle ' + tickets.length + ' kopieren</button>';
      }
      html += '</div>';
      if (uebergeben) {
        html += '<div class="btn-row"><button class="btn ghost" id="tkAufraeumen">' +
          'Übergebene löschen (' + uebergeben + ')</button></div>';
      }
    }

    html += '<p class="settings-note">Tickets liegen nur auf diesem Gerät und verlassen es nie ' +
      'von selbst. «Kopieren» legt alles als einen Text in die Zwischenablage — den geben Sie ' +
      'Claude Code, und was kopiert wurde, gilt als übergeben.</p>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="tkBack">Zurück</button></div></section>';
  main.innerHTML = html;

  if (tkAusgabe) {
    var feld = document.getElementById('tkAusgabe');
    feld.value = tkAusgabe;
    try { feld.setSelectionRange(0, tkAusgabe.length); } catch (e) {}
    document.getElementById('tkNochmal').addEventListener('click', function () {
      inZwischenablage(tkAusgabe);
      feld.select();
    });
    document.getElementById('tkFertig').addEventListener('click', function () {
      tkAusgabe = '';
      renderTickets();
    });
  } else if (tkForm) {
    var titel = document.getElementById('tkTitel');
    var text = document.getElementById('tkText');
    titel.value = tkForm.titel;
    text.value = tkForm.text;
    titel.addEventListener('input', function () { tkForm.titel = titel.value; });
    text.addEventListener('input', function () { tkForm.text = text.value; });
    document.getElementById('tkAbbruch').addEventListener('click', function () {
      tkForm = null;
      renderTickets();
    });
    document.getElementById('tkSichern').addEventListener('click', function () {
      if (!titel.value.replace(/^\s+|\s+$/g, '')) { titel.focus(); return; }
      ticketAnlegen(tkForm.art, titel.value, text.value, letzterTab);
      tkForm = null;
      renderTickets();
    });
  } else {
    main.querySelectorAll('[data-neu]').forEach(function (b) {
      b.addEventListener('click', function () {
        tkForm = { art: b.dataset.neu, titel: '', text: '' };
        renderTickets();
      });
    });
    main.querySelectorAll('[data-tkweg]').forEach(function (b) {
      b.addEventListener('click', function () {
        tickets.splice(parseInt(b.dataset.tkweg, 10), 1);
        ticketsSichern();
        renderTickets();
      });
    });
    // Bündeln heißt zugleich übergeben — sonst müsste man den Zustand zweimal
    // pflegen und wüsste beim nächsten Mal nicht, was neu ist.
    var kop = document.getElementById('tkKopieren');
    if (kop) kop.addEventListener('click', function () {
      var jetzt = Date.now();
      tkAusgabe = ticketsAlsText(offen);
      offen.forEach(function (t) { t.uebergeben = jetzt; });
      ticketsSichern();
      inZwischenablage(tkAusgabe);
      renderTickets();
    });
    var allesBtn = document.getElementById('tkAlle');
    if (allesBtn) allesBtn.addEventListener('click', function () {
      tkAusgabe = ticketsAlsText(tickets);
      inZwischenablage(tkAusgabe);
      renderTickets();
    });
    var weg = document.getElementById('tkAufraeumen');
    if (weg) weg.addEventListener('click', function () {
      tickets = ticketsOffen();
      ticketsSichern();
      renderTickets();
    });
  }

  document.getElementById('tkBack').addEventListener('click', function () { setTab(letzterTab); });
}

// ── BILANZ ──────────────────────────────────────────────────
var backupOpen = false, backupCode = '', backupMsg = '', confirmReset = false;
var themenOffen = false; // «alle Themen anzeigen» in der Bilanz

// ── Sicherungscode ──────────────────────────────────────────
// Der alte Code war der ganze Lernstand als JSON in Base64 — mit 380
// kyrillischen Schlüsseln und Millisekunden-Zeitstempeln ein Klumpen von rund
// zwanzig Kilobyte, den niemand gern von Hand markiert.
//
// Format 2 kodiert stattdessen nur, was sich nicht ausrechnen lässt, und zwar
// in fester Breite:
//
//   CHG2~<Wörter>~<Sätze>~<Fakten>~<Zahlen>~<Einstellungen>~<Prüfsumme>
//
// Ein Wort belegt zehn Zeichen: sechs für eine **stabile Kennung** (Hash des
// russischen Wortes, nicht seine Position — sonst verschöbe eine neue Vokabel
// alle Stände), eines für die Stufe, drei für das Alter in Tagen. Tagesgenau
// genügt, weil alle Fristen in Tagen rechnen. Das ergibt etwa ein Fünftel der
// alten Länge und obendrein eine Prüfsumme, die abgeschnittenes Einfügen
// erkennt, statt still Unsinn zu laden.
var BK_KOPF = 'CHG2';
var BK_BEZUG = Date.UTC(2026, 0, 1);   // Tag 0 der Zeitrechnung im Code
var BK_KENNUNG = 6;                    // Zeichen je Kennung
var BK_TAGE = 3;                       // Zeichen je Alter
var BK_EINTRAG = BK_KENNUNG + 1 + BK_TAGE;

function bkFuellen(text, breite) {
  var t = String(text);
  while (t.length < breite) t = '0' + t;
  return t.slice(-breite);
}
// Dieselbe Streuung wie bei den Fakten, nur auf feste Breite gebracht.
function bkKennung(text) {
  return bkFuellen(faktId(text), BK_KENNUNG);
}
function bkTag(ms) {
  if (!ms) return 0;
  return Math.max(0, Math.min(46655, Math.floor((ms - BK_BEZUG) / TAG)));
}
function bkAusTag(t) {
  return BK_BEZUG + t * TAG;
}
function bkPruefsumme(text) {
  var h = 0;
  for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
  return bkFuellen((h >>> 0).toString(36), 7);
}

// Kennung → Inhalt. Einmal gebaut, danach nachgeschlagen.
var bkTabelle = null;
function bkNachschlagen() {
  if (bkTabelle) return bkTabelle;
  bkTabelle = { woerter: {}, saetze: {}, fakten: {} };
  ALL_VOCAB.forEach(function (v) { bkTabelle.woerter[bkKennung(v.id)] = v.id; });
  SENTENCES.forEach(function (x) { bkTabelle.saetze[bkKennung(x.ru)] = x.ru; });
  FACTS.forEach(function (f) { bkTabelle.fakten[bkKennung(f)] = faktId(f); });
  return bkTabelle;
}

function bkStaendeAus(boxen, zeiten, kennungVon) {
  var teile = [];
  Object.keys(boxen).forEach(function (k) {
    var box = boxen[k] || 0;
    if (!box && !zeiten[k]) return;
    teile.push(kennungVon(k) +
      bkFuellen(Math.min(9, box).toString(36), 1) +
      bkFuellen(bkTag(zeiten[k]).toString(36), BK_TAGE));
  });
  return teile.join('');
}

function bkStaendeNach(text, tabelle, boxen, zeiten) {
  for (var i = 0; i + BK_EINTRAG <= text.length; i += BK_EINTRAG) {
    var kennung = text.slice(i, i + BK_KENNUNG);
    var ziel = tabelle[kennung];
    if (!ziel) continue;   // Inhalt gibt es nicht mehr — wie bei migriereIds
    boxen[ziel] = parseInt(text.slice(i + BK_KENNUNG, i + BK_KENNUNG + 1), 36) || 0;
    var tag = parseInt(text.slice(i + BK_KENNUNG + 1, i + BK_EINTRAG), 36) || 0;
    if (tag) zeiten[ziel] = bkAusTag(tag);
  }
}

// Die Einstellungen in fester Reihenfolge — Namen wären hier reine Länge.
var BK_SETTINGS = ['confirmUeben', 'confirmUebersetzen', 'requireComplete', 'ton', 'tastaturAn'];

function encodeBackup() {
  var woerter = bkStaendeAus(state.boxes, state.lastSeen, bkKennung);
  var saetze = bkStaendeAus(state.satzBox, state.satzSeen, bkKennung);

  var fakten = [];
  Object.keys(state.fakten).forEach(function (id) {
    var st = state.fakten[id];
    if (!st || (!st.n && !st.f)) return;
    // Der Fakt ist schon über faktId gespeichert; für den Code wird auf feste
    // Breite gebracht, damit sich alles ohne Trennzeichen lesen lässt.
    fakten.push(bkFuellen(id, BK_KENNUNG) +
      bkFuellen(Math.min(1295, st.n || 0).toString(36), 2) + (st.f ? '1' : '0'));
  });

  var zahlen = [state.streak, state.bestStreak, state.answered, state.factIdx,
    state.typingStats.correct, state.typingStats.wrong,
    state.transStats.correct, state.transStats.wrong]
    .map(function (n) { return Math.max(0, n | 0).toString(36); }).join('.');

  var s = state.settings;
  var einst = BK_SETTINGS.map(function (k) { return s[k] ? '1' : '0'; }).join('') +
    '.' + s.tippenStufe + '.' + s.auffrischen + '.' +
    ['system', 'dunkel', 'hell'].indexOf(s.darstellung);

  var rumpf = [BK_KOPF, woerter, saetze, fakten.join(''), zahlen, einst].join('~');
  return rumpf + '~' + bkPruefsumme(rumpf);
}

// Was steckt in einem Stand? Sagt sowohl beim Erzeugen als auch nach dem
// Einlesen, worüber man gerade redet — sonst ist der Code eine Blackbox.
function bkUeberblick(st) {
  var w = 0, sa = 0;
  Object.keys(st.boxes).forEach(function (k) { if (st.boxes[k] > 0) w++; });
  Object.keys(st.satzBox).forEach(function (k) { if (st.satzBox[k] > 0) sa++; });
  var fa = Object.keys(st.fakten).length;
  return w + (w === 1 ? ' Wort' : ' Wörter') + ' · ' +
    sa + (sa === 1 ? ' Satz' : ' Sätze') + ' · ' +
    fa + (fa === 1 ? ' Fakt' : ' Fakten');
}

function decodeBackup(code) {
  var roh = String(code).replace(/\s+/g, '');
  // Ein Code aus Format 1 ist Base64 und trägt weder Kopf noch Trennzeichen.
  if (roh.indexOf(BK_KOPF + '~') !== 0) return JSON.parse(decodeURIComponent(escape(atob(roh))));

  var teile = roh.split('~');
  if (teile.length !== 7) throw new Error('unvollständig');
  if (bkPruefsumme(teile.slice(0, 6).join('~')) !== teile[6]) throw new Error('Prüfsumme');

  var t = bkNachschlagen();
  var d = defaultState();
  bkStaendeNach(teile[1], t.woerter, d.boxes, d.lastSeen);
  bkStaendeNach(teile[2], t.saetze, d.satzBox, d.satzSeen);

  var f = teile[3];
  for (var i = 0; i + BK_KENNUNG + 3 <= f.length; i += BK_KENNUNG + 3) {
    var id = t.fakten[f.slice(i, i + BK_KENNUNG)];
    if (!id) continue;
    d.fakten[id] = {
      n: parseInt(f.slice(i + BK_KENNUNG, i + BK_KENNUNG + 2), 36) || 0,
      f: f.charAt(i + BK_KENNUNG + 2) === '1'
    };
  }

  var z = teile[4].split('.').map(function (x) { return parseInt(x, 36) || 0; });
  d.streak = z[0]; d.bestStreak = z[1]; d.answered = z[2]; d.factIdx = z[3];
  d.typingStats = { correct: z[4] || 0, wrong: z[5] || 0 };
  d.transStats = { correct: z[6] || 0, wrong: z[7] || 0 };

  var e = teile[5].split('.');
  var schalter = e[0] || '';
  BK_SETTINGS.forEach(function (k, n) { d.settings[k] = schalter.charAt(n) === '1'; });
  d.settings.tippenStufe = parseInt(e[1], 10) || 3;
  d.settings.auffrischen = parseInt(e[2], 10) || 21;
  d.settings.darstellung = ['system', 'dunkel', 'hell'][parseInt(e[3], 10)] || 'system';
  return d;
}

function renderBilanz() {
  var counts = [];
  for (var i = 0; i <= BOX_MAX; i++) counts.push(0);
  ALL_VOCAB.forEach(function (v) { counts[state.boxes[v.id] || 0]++; });
  var mastered = counts[BOX_MAX];
  var started = ALL_VOCAB.length - counts[0];
  var readTotal = 0;
  readTotal = SENTENCES.length;
  var satzSitzt = SENTENCES.filter(function (s) { return satzBox(s) >= BOX_MAX; }).length;
  var readFrei = SENTENCES.filter(satzFrei).length;

  function stat(label, value, accent) {
    return '<div class="stat' + (accent ? ' accent' : '') + '"><span class="stat-value">' + value +
      '</span><span class="stat-label">' + label + '</span></div>';
  }

  var html = '<section><div class="stats-grid">' +
    stat('Wörter gesamt', ALL_VOCAB.length) +
    stat('Begonnen', started) +
    stat('Gemeistert', mastered, true) +
    stat('Sätze sitzen', satzSitzt + '/' + readFrei) +
    stat('Beantwortet', state.answered) +
    stat('Beste Serie', state.bestStreak, true) +
    '</div>';

  var aktuell = aktuellesSet();
  var frei = freigeschalteteWoerter();
  html += '<h2>Lernweg</h2><div class="theme-list">' +
    '<div class="theme-row"><span class="theme-name">Lernset</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + ((aktuell + 1) / LERNSETS.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + (aktuell + 1) + '/' + LERNSETS.length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Im Tippen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (tippenPool().length / ALL_VOCAB.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + tippenPool().length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Sätze offen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (readFrei / readTotal * 100) + '%"></div></div>' +
    '<span class="theme-count">' + readFrei + '/' + readTotal + '</span></div></div>' +
    '<p class="backup-note">Im laufenden Set fehlen noch ' +
    (LERNSETS[aktuell].woerter.length - setReif(aktuell)) + ' Wörter bis zu ' +
    LERNSETS[aktuell].saetze.length + ' weiteren Sätzen · ' + faelligeAnzahl(frei) +
    ' Wiederholungen fällig</p>';

  html += '<h2>Leitner-Stufen</h2><div class="boxes">';
  counts.forEach(function (n, bi) {
    var h = Math.max(4, n / ALL_VOCAB.length * 100);
    html += '<div class="boxstat"><div class="boxbar-wrap">' +
      '<div class="boxbar' + (bi === BOX_MAX ? ' gold' : '') + '" style="height:' + h + '%"></div></div>' +
      '<span class="boxnum">' + n + '</span><span class="boxlabel">' + (bi === 0 ? 'neu' : 'St. ' + bi) + '</span></div>';
  });
  html += '</div>';

  // Nur Themen mit Fortschritt; der Rest steht hinter «alle anzeigen».
  var themen = Object.keys(VOCAB_THEMES).map(function (t) {
    var ids = VOCAB_THEMES[t].map(function (w) { return w[0]; });
    return {
      name: t,
      gesamt: ids.length,
      gemeistert: ids.filter(function (id) { return (state.boxes[id] || 0) >= BOX_MAX; }).length,
      begonnen: ids.filter(function (id) { return (state.boxes[id] || 0) > 0; }).length
    };
  });
  var mitFortschritt = themen.filter(function (t) { return t.gemeistert > 0; });
  var zeigen = themenOffen ? themen : mitFortschritt;

  html += '<h2>Nach Themen (gemeistert)</h2>';
  if (!zeigen.length) {
    html += '<p class="backup-note">Noch kein Thema gemeistert — hier erscheint jedes Thema, sobald ' +
      'das erste Wort daraus Stufe ' + BOX_MAX + ' erreicht.</p>';
  }
  html += '<div class="theme-list">';
  zeigen.forEach(function (t) {
    html += '<div class="theme-row"><span class="theme-name">' + esc(t.name) + '</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' + (t.gemeistert / t.gesamt * 100) + '%"></div></div>' +
      '<span class="theme-count">' + t.gemeistert + '/' + t.gesamt + '</span></div>';
  });
  html += '</div>';
  if (themen.length > mitFortschritt.length) {
    html += '<button class="mehr" id="themenMehr">' +
      (themenOffen ? 'Nur Themen mit Fortschritt' : 'Alle ' + themen.length + ' Themen anzeigen') +
      '</button>';
  }

  var gesehen = FACTS.filter(function (f) { return faktStand(f).n > 0; }).length;
  var favoriten = FACTS.filter(function (f) { return faktStand(f).f; }).length;
  html += '<h2>Sprachfakten</h2>' +
    '<p class="backup-note">' + gesehen + ' von ' + FACTS.length + ' gesehen · ' +
    favoriten + ' als Favorit gemerkt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="zuFakten">Fakten durchgehen</button></div>';

  html += '<h2>Sicherung</h2>' +
    '<p class="backup-note">Ihr Fortschritt als kopierbarer Code — unabhängig vom automatischen ' +
    'Speichern. Er trägt eine Prüfsumme: unvollständig eingefügt wird er abgewiesen statt ' +
    'halb übernommen.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="bkMake">Sicherungscode erzeugen</button></div>';
  if (backupOpen) {
    html += '<p class="backup-note">' + esc(bkUeberblick(state)) + ' · ' +
      (backupCode.length / 1024).toFixed(1) + ' KB</p>' +
      '<textarea id="bkOut" readonly rows="3" aria-label="Sicherungscode">' + esc(backupCode) + '</textarea>';
  }
  html += '<textarea id="bkIn" rows="2" placeholder="Sicherungscode hier einf\u00fcgen \u2026" aria-label="Sicherungscode einfügen"></textarea>' +
    '<div class="btn-row"><button class="btn ghost" id="bkImport">Sicherung wiederherstellen</button></div>' +
    (backupMsg ? '<p class="session-info">' + esc(backupMsg) + '</p>' : '');

  html += '<div class="danger-zone">';
  if (!confirmReset) {
    html += '<button class="btn danger" id="rsAsk">Fortschritt zurücksetzen \u2026</button>';
  } else {
    html += '<div class="btn-row"><button class="btn ghost" id="rsNo">Abbrechen</button>' +
      '<button class="btn danger" id="rsYes">Endgültig löschen</button></div>';
  }
  html += '</div></section>';

  main.innerHTML = html;

  document.getElementById('bkMake').addEventListener('click', function () {
    backupCode = encodeBackup();
    backupOpen = true;
    backupMsg = '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupCode).then(function () {
        backupMsg = 'Code in die Zwischenablage kopiert.';
        renderBilanz();
      }, function () {
        backupMsg = 'Bitte Code manuell markieren und kopieren.';
        renderBilanz();
      });
    } else {
      backupMsg = 'Bitte Code manuell markieren und kopieren.';
      renderBilanz();
    }
  });
  var out = document.getElementById('bkOut');
  if (out) out.addEventListener('focus', function () { out.select(); });
  document.getElementById('bkImport').addEventListener('click', function () {
    var code = document.getElementById('bkIn').value;
    if (!code.trim()) { backupMsg = 'Bitte zuerst einen Code einfügen.'; renderBilanz(); return; }
    try {
      var data = decodeBackup(code);
      if (!data || typeof data !== 'object' || !data.boxes) throw new Error('unlesbar');
      state = mergeState(data);
      // Der Lernstand ist ein anderer — jede Übung muss neu aufbauen. Sonst
      // stünde in «Tippen» noch das alte Wort und in «Übersetzen» der alte Satz.
      ansichtenZuruecksetzen();
      backupOpen = false;
      save();
      updateDarstellung();
      updateKopf();
      backupMsg = 'Wiederhergestellt: ' + bkUeberblick(state) + '.';
    } catch (e) {
      backupMsg = e.message === 'Prüfsumme'
        ? 'Der Code ist beschädigt oder unvollständig — bitte noch einmal ganz einfügen.'
        : e.message === 'unvollständig'
          ? 'Der Code bricht mittendrin ab — bitte noch einmal ganz einfügen.'
          : 'Das ist kein Sicherungscode dieser App.';
    }
    renderBilanz();
  });
  document.getElementById('zuFakten').addEventListener('click', function () { setTab('fakten'); });
  var mehr = document.getElementById('themenMehr');
  if (mehr) mehr.addEventListener('click', function () { themenOffen = !themenOffen; renderBilanz(); });
  var rsAsk = document.getElementById('rsAsk');
  if (rsAsk) rsAsk.addEventListener('click', function () { confirmReset = true; renderBilanz(); });
  var rsNo = document.getElementById('rsNo');
  if (rsNo) rsNo.addEventListener('click', function () { confirmReset = false; renderBilanz(); });
  var rsYes = document.getElementById('rsYes');
  if (rsYes) rsYes.addEventListener('click', function () {
    var behalten = state.settings; // Einstellungen sind kein Fortschritt
    state = defaultState();
    state.settings = behalten;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    ansichtenZuruecksetzen();
    confirmReset = false;
    backupOpen = false;
    backupMsg = '';
    updateKopf();
    save();
    renderBilanz();
  });
}

// ── Start ───────────────────────────────────────────────────
document.querySelectorAll('[data-symbol]').forEach(function (b) {
  b.insertAdjacentHTML('afterbegin', ICON[b.dataset.symbol] || '');
});
load();
ticketsLaden();
updateDarstellung();

// Jede Ansicht setzt #main neu; der Beobachter merkt das und schickt die Chili
// zur passenden Station, ohne dass jede Renderfunktion daran denken muss.
if (window.MutationObserver) {
  new MutationObserver(function () { chiliAktualisieren(); }).observe(main, { childList: true });
}
menuSetzen(false);
chiliAktualisieren();
updateKopf();
render();
</script>
</body>
</html>
