// ── BUCHSTABEN ──────────────────────────────────────────────
// Freiwillig: blockiert nichts, schaltet nichts frei und zählt weder in die
// Serie noch in «beantwortet». Wer das Alphabet schon kann, verpasst nichts.
// Eigener Topf (state.abcBox / abcSeen), damit der Wortschatz sauber bleibt.
//
// Die sechs falschen Freunde stehen hier und nicht in den Daten: Dass В wie ein
// B aussieht, ist eine Eigenschaft des *lateinischen* Alphabets, nicht des
// russischen. Sie treten im Quiz bevorzugt als Ablenker gegeneinander an.
var ABC_TUECKISCH = 'внрсух';
// Geübt wird ohne Umweg; die Tafel ist ein Nachschlagewerk und liegt hinter
// dem Knopf links neben der Auswahl.
var abcAnsicht = 'ueben';     // 'ueben' · 'tafel'
var abcRichtung = 'gemischt'; // 'zeichen' · 'laut' · 'gemischt'
var abcStapel = 'reihe';      // 'reihe' = offen und fällig · 'alle' = alle 33
var abcOffen = null;          // Buchstabe, dessen Merkhilfe in der Tafel aufgeklappt ist
var abcQ = null, abcPhase = 'ask', abcPicked = null, abcCorrect = null;
var abcBuilt = [], abcRevealed = false;

function abcBox(b) { return state.abcBox[b[1]] || 0; }
function abcFaellig(b, jetzt) {
  var seit = state.abcSeen[b[1]];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(abcBox(b));
}
// Dieselben zwei Schwellen wie beim Wortschatz: ab SATZ_STUFE «sitzt» ein
// Buchstabe — man erkennt ihn —, ab BOX_MAX ist er «gemeistert» und verlässt
// den Stapel bis zur Auffrischung. Dazwischen liegt die Kachelaufgabe.
function abcSitzt(b) { return abcBox(b) >= SATZ_STUFE; }
function abcGemeistert(b) { return abcBox(b) >= BOX_MAX; }
function abcGelernt() { return ALPHABET.filter(abcSitzt).length; }
function abcMeisterschaft() { return ALPHABET.filter(abcGemeistert).length; }

function abcUpdate(b, richtig) {
  tempoNotieren();
  var cur = abcBox(b);
  state.abcBox[b[1]] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.abcSeen[b[1]] = Date.now();
  save();
}

// Offen ist, was noch nicht gemeistert ist; dazu kommt Fertiges, dessen Frist
// um ist. Ein Buchstabe, der erst «sitzt», bleibt also im Stapel — genau dort
// wartet die Kachelaufgabe auf ihn.
//
// **«Alle» ist der zweite Stapel** (ADR 0048): Wer das Alphabet gemeistert hat,
// stand bis dahin vor einer verschlossenen Tür — die Übung war leer, und der
// einzige Weg zurück führte über das Warten auf die Auffrischfrist. Üben können
// darf nie an einem Datum hängen.
function abcPoolVon(stapel) {
  if (stapel === 'alle') return ALPHABET.slice();
  var jetzt = Date.now();
  var offen = ALPHABET.filter(function (b) { return !abcGemeistert(b); });
  var frisch = ALPHABET.filter(function (b) { return abcGemeistert(b) && abcFaellig(b, jetzt); });
  return offen.concat(frisch);
}
function abcPool() { return abcPoolVon(abcStapel); }

// ── Lesen: was die Buchstaben schon hergeben ────────────────
// «Buchstaben» und «Freestyle» standen nebeneinander, ohne voneinander zu
// wissen: Wer das Alphabet übte, sah nie, wozu. Ein Wort, dessen Buchstaben
// alle gemeistert sind, lässt sich lesen — und das ist der erste Lohn des
// Alphabets. Genau diese Wörter sammelt der Lesemodus (ADR 0035).
var LESE_MINDEST = 3;   // ab so vielen lesbaren Wörtern lohnt der Hinweis
var LESE_STRAFE = 4;    // so oft darf ein Buchstabe danebengehen, dann fällt er

function gemeisterteBuchstaben() {
  var meister = {};
  ALPHABET.forEach(function (b) {
    if (abcGemeistert(b)) meister[b[1]] = true;
  });
  return meister;
}

// Was in keinem Alphabet steht, hält kein Wort auf: Leerzeichen und Striche
// muss man nicht gemeistert haben.
function leseZeichenEgal(c) {
  return c === ' ' || c === '-' || c === '‑' || c === '’' || c === '\'';
}

function wortLesbar(v, meister) {
  var w = v.ru.toLowerCase();
  for (var i = 0; i < w.length; i++) {
    var c = w.charAt(i);
    if (leseZeichenEgal(c)) continue;
    if (!meister[c]) return false;
  }
  return true;
}

function leseWoerter() {
  var meister = gemeisterteBuchstaben();
  return ALL_VOCAB.filter(function (v) { return wortLesbar(v, meister); });
}

// ── Drei Aufgaben, die das Alphabet schärfen (ADR 0058) ────
// Erkennen ist nicht dasselbe wie unterscheiden. Wer «ш» kennt, kennt darum
// noch nicht den Unterschied zu «щ» — und genau daran scheitert das Lesen.
// Die drei Formen greifen erst, wenn ein Buchstabe schon einmal saß: Sie
// schärfen, sie führen nicht ein.

// **Die fünf Vokalpaare.** Der linke macht den Konsonanten davor hart, der
// rechte weich. Das ist die tragende Unterscheidung des Russischen, und die
// App erwähnte sie bisher nirgends.
var VOKALPAARE = [['а', 'я'], ['о', 'ё'], ['у', 'ю'], ['ы', 'и'], ['э', 'е']];
// Konsonanten, die die Unterscheidung überhaupt mitmachen. ж ш ц sind immer
// hart, ч щ й immer weich — an ihnen zeigt sich nichts.
var SILBEN_KONS = 'бвгдзклмнпрстф';

function abcPaarZu(c) {
  var aus = [];
  PAARE.forEach(function (p) {
    if (p[0] === c) aus.push([p[1], p[2]]);
    else if (p[1] === c) aus.push([p[0], p[2]]);
  });
  return aus.length ? aus[Math.floor(Math.random() * aus.length)] : null;
}
// Der erste Satz der Merkhilfe. Der Rest nennt oft den Nachbarn beim Namen —
// in einer Frage nach genau diesem Nachbarn wäre das die halbe Antwort.
function abcErsterSatz(text) {
  var m = String(text).match(/^[^.!?]*[.!?]/);
  return m ? m[0] : String(text);
}
// Zu welchem Paar gehört der Vokal, und steht er auf der weichen Seite?
function abcVokalPaar(c) {
  for (var i = 0; i < VOKALPAARE.length; i++) {
    if (VOKALPAARE[i][0] === c) return { paar: VOKALPAARE[i], weich: false };
    if (VOKALPAARE[i][1] === c) return { paar: VOKALPAARE[i], weich: true };
  }
  return null;
}
// Das Wort mit dem Zeichen hinter dem n-ten Vokal — ohne die Betonungsliste
// zu fragen. Sie sagt, welche Stelle richtig ist; hier werden alle gebaut.
function abcBetontStelle(ru, n) {
  var zaehler = 0;
  for (var i = 0; i < ru.length; i++) {
    if (VOKALE.indexOf(ru.charAt(i)) === -1) continue;
    zaehler++;
    if (zaehler === n) return ru.slice(0, i + 1) + '\u0301' + ru.slice(i + 1);
  }
  return ru;
}
function abcVokalzahl(ru) {
  var n = 0;
  for (var i = 0; i < ru.length; i++) if (VOKALE.indexOf(ru.charAt(i)) !== -1) n++;
  return n;
}
// Ein Wort, dessen betonter Vokal **genau dieser Buchstabe** ist. Nur dann
// gehört die Antwort zu diesem Buchstaben, und nur dann darf sie ihn bewerten.
function abcBetonungsWort(c) {
  var passt = ALL_VOCAB.filter(function (v) {
    var b = BETONUNG[v.ru];
    if (typeof b !== 'number') return false;          // mehrwortig oder ohne Angabe
    if (abcVokalzahl(v.ru) < 2 || abcVokalzahl(v.ru) > 4) return false;
    var zaehler = 0;
    for (var i = 0; i < v.ru.length; i++) {
      if (VOKALE.indexOf(v.ru.charAt(i)) === -1) continue;
      zaehler++;
      if (zaehler === b) return v.ru.charAt(i) === c;
    }
    return false;
  });
  return passt.length ? passt[Math.floor(Math.random() * passt.length)] : null;
}

function abcWaehlen() {
  var pool = abcPool();
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = abcBox(a), bb = abcBox(b);
    if (ba !== bb) return ba - bb;
    return (state.abcSeen[a[1]] || 0) - (state.abcSeen[b[1]] || 0);
  });
  if (abcQ && sortiert.length > 1) {
    sortiert = sortiert.filter(function (b) { return b[1] !== abcQ.b[1]; });
  }
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Einstellige Laute wie «a» oder «w» kann man nicht zusammensetzen — «щ» mit
// seinen sieben Zeichen dagegen sehr wohl, und genau dort sitzt der Fehler.
// Ъ und Ь tragen ein deutsches Wort statt einer Lautschrift und fallen heraus.
function abcKachelbar(b) { return /^[a-z]{2,8}$/.test(b[2]); }

// Zwei bis drei lateinische Buchstaben, die im Laut nicht vorkommen — gezogen
// aus den Lauten des Alphabets, damit die Ablenker plausibel bleiben.
function abcZusatzKacheln(laut) {
  var drin = {};
  laut.split('').forEach(function (c) { drin[c] = true; });
  var vorrat = {};
  ALPHABET.forEach(function (x) {
    if (abcKachelbar(x)) x[2].split('').forEach(function (c) { vorrat[c] = true; });
  });
  var frei = Object.keys(vorrat).filter(function (c) { return !drin[c]; });
  return shuffle(frei).slice(0, Math.min(laut.length <= 3 ? 2 : 3, frei.length));
}

// Eine der drei schärfenden Formen, wenn sie zu diesem Buchstaben passt.
// Ausgelost unter den anwendbaren — sonst käme immer dieselbe.
function abcSchaerfen(b) {
  var c = b[1];
  var wege = [];
  if (abcPaarZu(c)) wege.push('paar');
  if (abcVokalPaar(c)) wege.push('silbe');
  if (VOKALE.indexOf(c) !== -1 && abcBetonungsWort(c)) wege.push('betonung');
  // Die gewohnten Formen bleiben die Mehrheit: Sie prüfen den Buchstaben
  // selbst, und darum geht es hier immer noch.
  if (!wege.length || Math.random() > 0.45) return false;
  var weg = wege[Math.floor(Math.random() * wege.length)];
  if (weg === 'paar') return abcPaarAufgabe(b);
  if (weg === 'silbe') return abcSilbenAufgabe(b);
  return abcBetonungsAufgabe(b);
}

// D3 · Minimalpaar. Gezeigt wird die Merkhilfe, gewählt wird der Buchstabe —
// **zwei Möglichkeiten, wie es der Sache entspricht**: Ein Minimalpaar hat
// genau zwei Seiten. Wer den Unterschied kennt, trifft immer; wer rät, fällt
// eine Stufe.
function abcPaarAufgabe(b) {
  var partner = abcPaarZu(b[1]);
  var p = ALPHABET.filter(function (x) { return x[1] === partner[0]; })[0];
  if (!p) return false;
  abcQ = {
    b: b, modus: 'paar', loesung: b[1], hinweis: partner[1],
    frage: 'Welcher Buchstabe ist gemeint?', frage2: abcErsterSatz(b[3]),
    options: shuffle([b, p]).map(function (x) {
      return { id: x[1], text: x[0] + ' ' + x[1], kyr: true };
    })
  };
  return true;
}

// D4 · Silbenleiter. ма–мя, мо–мё, му–мю, мы–ми, мэ–ме: Der Vokal entscheidet,
// ob der Konsonant davor hart oder weich klingt. Gefragt ist die Seite, auf
// der **dieser** Buchstabe steht — darum trägt die richtige Silbe ihn.
function abcSilbenAufgabe(b) {
  var lage = abcVokalPaar(b[1]);
  var kons = shuffle(SILBEN_KONS.split(''));
  if (kons.length < 4) return false;
  var gegen = VOKALPAARE.filter(function (p) { return p !== lage.paar; });
  var falsch = shuffle(gegen).slice(0, 3).map(function (p, i) {
    return { id: kons[i + 1] + p[lage.weich ? 0 : 1], kyr: true };
  });
  var richtig = kons[0] + b[1];
  abcQ = {
    b: b, modus: 'silbe', loesung: richtig, weich: lage.weich,
    frage: lage.weich ? 'Welche Silbe ist weich?' : 'Welche Silbe ist hart?',
    hinweis: 'Nach ' + b[1] + ' klingt der Konsonant ' +
      (lage.weich ? 'weich' : 'hart') + '. Die fünf Paare sind ' +
      VOKALPAARE.map(function (p) { return p[0] + '–' + p[1]; }).join(', ') +
      ' — links hart, rechts weich.',
    options: shuffle([{ id: richtig, kyr: true }].concat(falsch)).map(function (o) {
      return { id: o.id, text: o.id, kyr: true };
    })
  };
  return true;
}

// D6 · Betonung setzen. Der betonte Vokal klingt voll, alle anderen fallen
// zusammen — молоко spricht sich «malakó». Gewählt wird nicht der Vokal,
// sondern das **ganze Wort in einer Lesart**: Bei молоко stünden sonst drei
// gleiche Knöpfe nebeneinander.
function abcBetonungsAufgabe(b) {
  var wort = abcBetonungsWort(b[1]);
  if (!wort) return false;
  var n = abcVokalzahl(wort.ru);
  var lesarten = [];
  for (var i = 1; i <= n; i++) lesarten.push(abcBetontStelle(wort.ru, i));
  abcQ = {
    b: b, modus: 'betonung', wort: wort,
    loesung: abcBetontStelle(wort.ru, BETONUNG[wort.ru]),
    frage: 'Welcher Vokal trägt die Betonung?',
    hinweis: 'Nur der betonte Vokal klingt voll. Alle anderen fallen zusammen — ' +
      'darum spricht sich ' + wort.ru + ' nicht so, wie es dasteht.',
    options: shuffle(lesarten).map(function (t) {
      return { id: t, text: t, kyr: true };
    })
  };
  return true;
}

function abcFrageBauen() {
  var b = abcWaehlen();
  if (!b) { abcQ = null; return; }
  // Dieselbe Steigerung wie beim Wortschatz: erst wiedererkennen, dann
  // hinschreiben. Wer die Richtung fest wählt, behält sie — «Laut → Zeichen»
  // ist ohnehin schon die fordernde Seite.
  var box = abcBox(b);
  var basis = abcRichtung === 'gemischt'
    ? (Math.random() < 0.5 ? 'zeichen' : 'laut')
    : abcRichtung;
  var modus = (box >= SATZ_STUFE && basis === 'zeichen' && abcKachelbar(b))
    ? 'kacheln' : basis;

  abcPhase = 'ask';
  aufgabeBeginnt();
  abcPicked = null;
  abcCorrect = null;
  abcBuilt = [];
  abcRevealed = false;

  gramBaustein = null;
  gramQ = null;
  gramPhase = 'ask';
  gramPicked = null;
  gramCorrect = null;
  gramEingabe = '';
  gramKb = null;
  gramRegelOffen = false;
  gramRegelNeu = false;

  // **Schärfen statt einführen.** Erst ab Stufe 1 — wer den Buchstaben noch
  // nie richtig hatte, braucht ihn ganz, nicht in Abgrenzung.
  //
  // Und nur bei «gemischt»: Die schärfenden Formen sind weder «Zeichen → Laut»
  // noch die Gegenrichtung. Wer im Filter eine Richtung festlegt, hat damit
  // etwas verlangt — ihm stattdessen eine Silbenleiter hinzustellen wäre ein
  // gebrochenes Versprechen.
  if (box >= 1 && abcRichtung === 'gemischt' && abcSchaerfen(b)) return;

  if (modus === 'kacheln') {
    var laut = b[2];
    var zeichen = laut.split('');
    var kacheln = shuffle(zeichen.concat(abcZusatzKacheln(laut)));
    for (var i = 0; i < 10 && kacheln.slice(0, zeichen.length).join('') === laut; i++) {
      kacheln = shuffle(kacheln);
    }
    abcQ = {
      b: b, modus: modus, laut: laut, laenge: zeichen.length,
      tiles: kacheln.map(function (ch, k) { return { ch: ch, key: k }; })
    };
    return;
  }

// Ablenker: bei einem falschen Freund die anderen falschen Freunde, sonst
  // Buchstaben mit ähnlich langem Laut — beides ist schwerer als Zufall.
  var tueckisch = ABC_TUECKISCH.indexOf(b[1]) !== -1;
  var kandidaten = ALPHABET.filter(function (x) {
    if (x[1] === b[1] || x[2] === b[2]) return false;
    return tueckisch ? ABC_TUECKISCH.indexOf(x[1]) !== -1 : true;
  });
  if (kandidaten.length < 3) {
    kandidaten = ALPHABET.filter(function (x) { return x[1] !== b[1] && x[2] !== b[2]; });
  }
  // **Kein Laut zweimal unter den Antworten.** Die Kandidaten sind schon gegen
  // die *richtige* Antwort abgeglichen, aber nicht untereinander — und vier
  // Buchstaben teilen sich zwei Laute: ж und ш beide «sch», з und с beide «s».
  // Standen zwei davon nebeneinander, gab es zwei gleich beschriftete Antworten,
  // und die Frage war nicht mehr zu beantworten. Passierte selten, darum fiel
  // es nur ab und zu auf (ADR 0066).
  var genommen = [b[2]];
  var ablenker = [];
  shuffle(kandidaten).forEach(function (x) {
    if (ablenker.length >= 3 || genommen.indexOf(x[2]) !== -1) return;
    genommen.push(x[2]);
    ablenker.push(x);
  });
  abcQ = { b: b, modus: modus, options: shuffle(ablenker.concat([b])) };
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function abcAbgabeBereit() {
  if (!abcQ) return false;
  if (abcQ.modus === 'kacheln') {
    return state.settings.requireComplete
      ? abcBuilt.length === abcQ.laenge
      : abcBuilt.length > 0;
  }
  return abcPicked !== null;
}

function abcPruefen() {
  var q = abcQ;
  if (q.modus === 'kacheln') {
    var versuch = abcBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    abcCorrect = versuch === q.laut;
  } else if (q.loesung !== undefined) {
    // Die drei schärfenden Formen führen ihre Lösung selbst — sie fragen
    // nicht nach dem Buchstaben, sondern nach dem, was er ausmacht.
    abcCorrect = abcPicked === q.loesung;
  } else {
    abcCorrect = abcPicked === q.b[1];
  }
  var vorher = abcBox(q.b);
  abcUpdate(q.b, abcCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, abcBox(q.b), 'Buchstabe', q.b[0] + ' ' + q.b[1] + ' — ' + q.b[2],
    abcMeisterschaft() + ' von ' + ALPHABET.length + ' Buchstaben');
  meisterTon(abcCorrect);
  zuletztGeuebt('buchstaben');
  // Nur der Übergang, und nur beim ersten Mal: War das der dreiunddreißigste?
  if (vorher < BOX_MAX && abcBox(q.b) >= BOX_MAX &&
    abcMeisterschaft() === ALPHABET.length) jubelEinmal('abc', 'abc');
  abcPhase = 'feedback';
  renderBuchstaben();
}

// Kopf über der Frage — dasselbe Paket wie in «Lernsets», nur mit dem

function abcUebenHtml() {
  if (!abcQ) abcFrageBauen();

    : q.modus === 'kacheln' ? 'Setz den Laut zusammen'
      : q.modus === 'zeichen' ? 'Wie klingt dieser Buchstabe?' : 'Welcher Buchstabe klingt so?';

  // Dieselben Fortschrittspunkte wie über einer Vokabel — dieselbe Leiter,
  // dieselbe Farbfolge, damit man den Stand ohne Erklärung liest.
  var dots = '';

  // Was über der Auswahl steht, hängt an der Form: das Minimalpaar zeigt die

        else klasse += ' muted';
      } else if (abcPicked === o.id) klasse += ' picked';
      html += '<button class="' + klasse + '" data-abcopt="' + i + '"' +

    });

  } else if (q.modus === 'kacheln') {
    html += '<div class="slots">';
    for (var s = 0; s < q.laenge; s++) {
      var gefuellt = s < abcBuilt.length;
      var ch = gefuellt ? q.tiles.filter(function (t) { return t.key === abcBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (gefuellt ? ' filled' : '') + '">' + esc(ch) + '</span>';

    if (abcPhase === 'ask') {

        html += '<button class="tile' + (benutzt ? ' used' : '') + '" data-abctile="' + t.key + '"' +
          (benutzt ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });

        ICON.ruecktaste + '</button></div>';

  } else {

    html += '<div class="options abc-optionen">';
    q.options.forEach(function (o, i) {

      if (abcPhase === 'feedback') {
        if (o[1] === q.b[1]) klasse += ' right';
        else if (gewaehlt) klasse += ' wrong';
        else klasse += ' muted';
      } else if (gewaehlt) klasse += ' picked';
      html += '<button class="' + klasse + (zeichenFrage ? '' : ' cyr') + '" data-abcopt="' + i + '"' +

    });

  if (abcPhase === 'feedback') {
    html += '<div class="feedback ' + (abcCorrect ? 'good' : 'bad') + '">';
    if (abcCorrect) html += '<p>' + ICON.haken + 'Richtig!</p>';
    else if (schaerfe) {

        '<strong class="cyr">' + esc(q.loesung) + '</strong></p>';

      html += '<p>' + ICON.kreuz + (abcRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
        '<strong class="cyr">' + esc(q.b[0] + ' ' + q.b[1]) +

    // Erst nach der Auflösung — vorher wäre der Laut die Antwort.
    html += '</div>' +
      (q.modus === 'betonung' ? hoerzeile(q.wort.ru, q.wort.de) : hoerzeile(q.b[1], null)) +
      '<p class="hint">' + esc(schaerfe ? q.hinweis : q.b[3]) + '</p>' +

  }
  html += '</div><div class="btn-row">';
  if (abcPhase === 'ask') {
    html += '<button class="btn ghost" id="abcReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="abcConfirm"' + (abcAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';

  html += '</div>' + leseWinkHtml() +
    '<p class="session-info">' + abcPool().length + ' offen · ' +
    abcGelernt() + ' von ' + ALPHABET.length + ' sitzen · ' +

  return html;
}

// Die eingebaute kyrillische Tastatur. Sie steht in drei Übungen; das
// Datenattribut sagt, wer die Tasten abholt.
// Die Eingabetaste der **Gerätetastatur** gibt ab — dieselbe Wirkung wie
// «Prüfen». Sie klickt den Abgabeknopf, statt die Prüfung selbst zu rufen: So
// gibt es nur einen Weg, und die beiden können nicht auseinanderlaufen. Ist der
// Knopf gesperrt, weil noch nichts dasteht, tut sie nichts.
//
// `preventDefault()` verhindert den Zeilenumbruch, den ein `textarea` sonst
// einfügt. Mit Umschalt bleibt der Umbruch möglich — gebraucht wird er hier
// zwar nie, aber ihn zu verbieten wäre eine Anmaßung.
//
// Nur in den Übungen: Im Meldeblatt schreibt man Absätze, dort wäre die Taste
// eine Falle.
function enterGibtAb(feld, knopfId) {
  if (!feld) return;
  feld.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    // Ein leeres Feld gibt nichts ab. In drei Übungen sperrt schon der Knopf;
    // in «Tippen» tut er es nicht — dort zählt eine leere Abgabe als Fehler,
    // und die Taste liegt beim Schreiben zu nah, um das zu riskieren.
    if (!feld.value.replace(/^\s+|\s+$/g, '')) return;
    var knopf = document.getElementById(knopfId);
    if (knopf && !knopf.disabled) knopf.click();
  });
}

// Kommt die eingebaute Tastatur von selbst? Nur da, wo sie überhaupt hilft:
// Ein deutscher Satz lässt sich mit der Gerätetastatur schreiben, ein
// kyrillischer auf einem deutschen iPhone nicht. Die Sprache der
// *Gerätetastatur* kann eine Seite nicht wählen — das ist Sache von iOS.
function tastaturVorgabe(kyrillisch) {
  return !!kyrillisch && state.settings.tastaturAuto;
}

// **Die Schreibmarke gehört ins Feld** (ADR 0068). Wer über die eingebaute
// Tastatur schreibt, sah bis 2.4.9 nicht, wo er im Text steht: Das Feld bekam
// bei jedem Tastendruck seinen Wert gesetzt, aber nie den Fokus — und ohne
// Fokus blinkt nichts.
//
// Fokussieren allein wäre die Falle gewesen: Auf iOS klappt damit die
// **Geräte**tastatur auf, und genau die soll die eingebaute ersetzen.
// `inputmode="none"` sagt dem Browser, dass er keine aufklappen soll; das Feld
// bleibt trotzdem ein Feld, mit Marke und allem. Das Attribut steht darum nur
// dort, wo die eingebaute Tastatur wirklich offen ist — siehe `kbFeldAttr()`.
function feldSchreiben(id, text) {
  var f = document.getElementById(id);
  if (!f) return;
  f.value = text;
  try {
    // Ohne `preventScroll` springt die Seite auf einem Handy zum Feld, sobald
    // es den Fokus bekommt — bei jedem Tastendruck.
    f.focus({ preventScroll: true });
    f.setSelectionRange(text.length, text.length);
  } catch (e) { /* ein Browser, der das nicht kann, hat den Text trotzdem */ }
}
// Was ein Schreibfeld zusätzlich trägt, solange die eingebaute Tastatur offen
// ist. Ist sie zu, muss die Gerätetastatur aufgehen dürfen — dann darf hier
// nichts stehen.
function kbFeldAttr(kbOffen) {
  return kbOffen ? ' inputmode="none"' : '';
}

// Der Aufbau folgt der gewohnten Tastatur: die Rücktaste rechts am Ende der
// dritten Reihe, das Leerzeichen allein in einer vierten — breit und mittig.
// Vorher hingen beide hinten an der dritten Reihe; die brach dadurch um, und
// die Rücktaste landete allein und mittig auf einer eigenen Zeile.
function tastaturHtml(attr) {
  var html = '<div>';
  KB_ROWS.forEach(function (row, ri) {
    html += '<div class="kb-row">';
    row.forEach(function (ch) {
      html += '<button class="key cyr" data-' + attr + '="' + esc(ch) + '">' + esc(ch) + '</button>';
    });
    if (ri === KB_ROWS.length - 1) {
      html += '<button class="key wide" data-' + attr + '="BS" aria-label="Zeichen löschen">' +
        ICON.ruecktaste + '</button>';
    }
    html += '</div>';
  });
  html += '<div class="kb-row"><button class="key space" data-' + attr + '=" "' +
    ' aria-label="Leerzeichen">\u2423</button></div>';
  return html + '</div>';
}

// ── REKONSTRUKTION ──────────────────────────────────────────
// Die Lösung anzusehen genügt nicht. Wer sich verschreibt, schreibt das Wort
// einmal richtig nach, bevor es weitergeht — die Hand lernt beim Schreiben,
// nicht beim Lesen (ADR 0056).
//
// **Sie bewertet nichts.** Die Antwort ist längst gezählt, die Stufe längst
// gefallen; die Nachschrift hält nur den «Weiter»-Knopf zu. Wäre sie eine
// zweite Bewertung, könnte man sich aus einem Fehler heraustippen.
//
// **Nur bei Kyrillisch** — einen deutschen Satz nachzuschreiben lehrt kein
// Russisch. Ganze Sätze bleiben in der Vorgabe draußen: Sechs Wörter auf einer
// Bildschirmtastatur sind keine Übung mehr, sondern eine Strafe. Wer sie will,
// stellt «immer» ein.
//
// **Getippt oder gelegt** (ADR 0070). Bis 2.4.11 hieß die Bedingung «nur bei
// Getipptem» — gelegt ist nicht geschrieben. Für Lob und Prüfzeile stimmt das
// weiter: Wer aus vorgelegten Kacheln wählt, hat nicht buchstabiert. Für die
// Nachschrift stimmt es nicht, denn sie fragt nicht, *wie* die Antwort zustande
// kam, sondern ob die Schreibweise sitzt — und wer ein Wort falsch **legt**,
// weiß sie so wenig wie der, der es falsch tippt. Was draußen bleibt, ist die
// **Wahl** unter fertigen Wörtern: Dort behauptet niemand eine Schreibweise.
var reko = null;   // { loesung, eingabe, kb } — die verlangte Nachschrift

function rekoVerlangen(loesung, getippt, richtig, satz) {
  reko = null;
  var wahl = state.settings.rekonstruktion;
  if (wahl === 'nie' || !getippt || richtig || !loesung) return;
  if (satz && wahl !== 'immer') return;
  reko = { loesung: loesung, eingabe: '', kb: null };
}
// Steht der Weg weiter offen? Ohne Nachschrift immer, sonst erst wenn sie sitzt.
function rekoFertig() {
  return !reko || normalize(reko.eingabe) === normalize(reko.loesung);
}
function rekoHtml() {
  if (!reko) return '';
  var fertig = rekoFertig();
  var html = '<div class="reko' + (fertig ? ' sitzt' : '') + '">' +
    '<p class="task-label">' + (fertig ? 'Sitzt' : 'Schreib es einmal richtig') + '</p>' +
    '<p class="reko-vorlage cyr">' + esc(reko.loesung) + '</p>';
  html += fertig
    ? pruefzeileHtml(reko.eingabe, reko.loesung, true, 'form')
    : '<textarea id="rekoInput" rows="1" class="fliess cyr"' +
      ' lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
      kbFeldAttr(reko.kb) + ' placeholder="nachschreiben …">' + esc(reko.eingabe) + '</textarea>';
  html += '</div>';
  if (!fertig) {
    if (reko.kb === null) reko.kb = tastaturVorgabe(true);
    html += '<button class="kb-toggle" id="rekoKbToggle">' +
      (reko.kb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (reko.kb) html += tastaturHtml('rekokey');
  }
  return html;
}
// `neu` zeichnet die laufende Übung noch einmal — die Nachschrift steckt in
// deren Ansicht, und der «Weiter»-Knopf gehört ihr auch.
function rekoBinden(neu) {
  if (!reko) return;
  var feld = document.getElementById('rekoInput');
  if (feld) feld.addEventListener('input', function () {
    reko.eingabe = feld.value;
    if (rekoFertig()) { ton(true); neu(); }
  });
  var kb = document.getElementById('rekoKbToggle');
  if (kb) kb.addEventListener('click', function () { reko.kb = !reko.kb; neu(); });
  main.querySelectorAll('[data-rekokey]').forEach(function (el) {
    el.addEventListener('click', function () {
      var k = el.dataset.rekokey;
      reko.eingabe = k === 'BS' ? reko.eingabe.slice(0, -1) : reko.eingabe + k;
      feldSchreiben('rekoInput', reko.eingabe);
      if (rekoFertig()) { ton(true); neu(); }
    });
  });
}

// ── GRAMMATIK ───────────────────────────────────────────────
// Vokabeln sind Fakten, Regeln sind Funktionen. Darum ist hier die Karteikarte
// die **Regel** und nicht das Wort: Gemeistert ist sie, wenn sie viermal auf
// verschiedene Wörter gewirkt hat. Und darum verlangt die Aufgabe ein bekanntes
// Wort in einer nie gesehenen Form — wer auswendig gelernt hat, scheitert
// daran, wer die Regel hat, nicht (ADR 0030).
//
// Freiwillig wie die Buchstaben: blockiert nichts, zählt nicht in Serie und
// «beantwortet», eigener Topf.
var gramBaustein = null;   // Kennung des laufenden Bausteins
var gramQ = null;          // die laufende Aufgabe
var gramPhase = 'ask';     // 'ask' · 'feedback'
var gramPicked = null;
var gramCorrect = null;
var gramEingabe = '';
var gramKb = null;
var gramRegelOffen = false;   // Regelkarte über «Mehr …» aufgeklappt
// Ausdrücklich gewählter Baustein. Null heißt: der Reihe nach. Damit lässt
// sich auch Gemeistertes wiederholen, ohne auf die Auffrischfrist zu warten.
var gramWahl = null;
var gramRegelNeu = false;     // frisch entdeckt: die Regel steht ganzseitig da

function gramBox(b) { return state.gramBox[b.id] || 0; }
function gramEntdeckt(b) { return state.gramSeen[b.id] !== undefined; }
function gramGemeistert(b) { return gramBox(b) >= BOX_MAX; }
function gramFaellig(b, jetzt) {
  var seit = state.gramSeen[b.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(gramBox(b));
}
function gramMeisterschaft() { return GRAMMATIK.filter(gramGemeistert).length; }

function gramFinde(id) {
  return GRAMMATIK.filter(function (b) { return b.id === id; })[0] || null;
}

// Offen ist, was noch nicht gemeistert ist; dazu Fertiges, dessen Frist um ist.
function gramPool() {
  var jetzt = Date.now();
  var offen = GRAMMATIK.filter(function (b) { return !gramGemeistert(b); });
  var frisch = GRAMMATIK.filter(function (b) { return gramGemeistert(b) && gramFaellig(b, jetzt); });
  return offen.concat(frisch);
}

// Der Reihe nach: Bausteine bauen aufeinander auf, ein Zufallsgriff wäre hier
// falsch. Der erste, der noch nicht sitzt, ist dran.
function gramWaehlen() {
  var pool = gramPool();
  return pool.length ? pool[0] : null;
}

function gramAktuell() {
  if (gramWahl) {
    var gewaehlt = gramFinde(gramWahl);
    if (gewaehlt) { gramBaustein = gewaehlt.id; return gewaehlt; }
    gramWahl = null;
  }
  var b = gramBaustein ? gramFinde(gramBaustein) : null;
  if (!b) { b = gramWaehlen(); gramBaustein = b ? b.id : null; }
  return b;
}

function gramUpdate(b, richtig) {
  tempoNotieren();
  var cur = gramBox(b);
  state.gramBox[b.id] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.gramSeen[b.id] = Date.now();
  save();
}

// ── Die Wörter, an denen geübt wird ─────────────────────────
// Aus dem begonnenen Wortschatz: Die Regel soll auf ein Wort wirken, das man
// kennt — sonst prüft die Aufgabe zwei Dinge auf einmal. Ist noch nichts
// begonnen, tun es die Beispiele des Bausteins.
// Verben, an denen sich eine Regel zeigen lässt. Wer einen eigenen Stamm hat,
// bleibt draußen: «писать → пиш-» kann man nicht herleiten, nur wissen — die
// Aufgabe prüfte dann Gedächtnis statt Regel. Im Satz erklärt «Wissen» solche
// Formen trotzdem. Bei der Ich-Form ist es anders: Dort liegt der Stamm offen
// vor (die ты-Form steht da), also darf auch спать mitspielen.
function gramVerbPasst(b, v) {
  if (v.art !== 'v') return false;
  if (/ться$/.test(v.ru)) return false;      // rückbezüglich — eigener Baustein
  // **Ein vollendetes Verb hat kein Präsens und keine zusammengesetzte
  // Zukunft.** «скажу» heißt «ich werde sagen»; es als Gegenwart abzufragen
  // wäre eine Falschaussage, und «буду сказать» gibt es nicht.
  if (perfektiv(v.ru) && (b.aufgabe === 'praes' || b.aufgabe === 'ichform' ||
    b.aufgabe === 'fut')) return false;
  // Die Zukunft braucht nur die Grundform — jedes unvollendete Verb taugt.
  if (b.aufgabe === 'fut') return true;
  // Die Vergangenheit hat ihre eigene Regel: Sie greift auch bei Verben mit
  // eigenem Präsensstamm (писать → писал), aber nicht bei denen mit eigener
  // Vergangenheit (идти → шёл) und nicht bei denen ohne -ть.
  if (b.aufgabe === 'praet') {
    return !(VERBEN[v.ru] && VERBEN[v.ru].praet) && !!praeteritum(v.ru, 'm');
  }
  if (!verbBau(v.ru)) return false;
  var klasse = verbKlasse(v.ru);
  if (!klasse) return false;                 // folgt keiner Reihe
  if (b.aufgabe === 'ichform') return verbIchWandel(v.ru);
  if (VERBEN[v.ru]) return false;
  return !b.klasse || klasse === b.klasse;
}

// Adjektive, an denen sich die Übereinstimmung zeigen lässt: alle, deren
// Grundform die Maschine beugen kann. «холодно» und «жарко» sind keine —
// sie stehen in den Daten als unveränderlich.
function gramAdjektive() {
  return ALL_VOCAB.filter(function (v) { return v.art === 'a' && adjTeile(v.ru); });
}

function gramWortPool(b) {
  var stufe = gramBox(b);
  // Die Übereinstimmung zeigt sich am Adjektiv, nicht am Nomen — geübt wird
  // also an Adjektiven, das Nomen kommt als Partner dazu.
  if (b.aufgabe === 'adj') {
    var adj = gramAdjektive();
    var begonnenA = adj.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
    if (begonnenA.length >= 4) return begonnenA;
    var vorratA = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
      .filter(function (v) { return v && v.art === 'a' && adjTeile(v.ru); });
    begonnenA.forEach(function (v) { if (vorratA.indexOf(v) === -1) vorratA.push(v); });
    return vorratA.length ? vorratA : adj.slice(0, 12);
  }
  if (b.aufgabe === 'praes' || b.aufgabe === 'ichform' || b.aufgabe === 'praet') {
    var verben = ALL_VOCAB.filter(function (v) {
      return (state.boxes[v.id] || 0) > 0 && gramVerbPasst(b, v);
    });
    if (verben.length >= 4) return verben;
    var vorrat = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
      .filter(function (v) { return v && gramVerbPasst(b, v); });
    verben.forEach(function (v) {
      if (vorrat.indexOf(v) === -1) vorrat.push(v);
    });
    return vorrat;
  }
  // «Wo?» verlangt einen Ort — und ob ein Wort einer sein kann, sagt keine
  // Endung. «в маме» wäre grammatisch richtig und Unsinn, «в утре» ebenso.
  // Darum ist der Präpositiv die eine Rubrik mit ausgesuchten Wörtern: Der
  // Baustein nennt sie, die Regel selbst gilt trotzdem für jedes Nomen — im
  // Satz führt «Wissen» sie vor.
  // Dieselbe Vorsicht bei Mehrzahl und Genitiv: «zwei Wasser» ist keine
  // Mehrzahl, sondern eine Sonderbedeutung, und «нет музыки» sagt niemand.
  // Auch hier nennt der Baustein seine Wörter selbst.
  // Und der Dativ ist der Fall des **Empfängers** — empfangen kann nur, wer
  // lebt. «книге нравится» ist tadellos gebeugt und trotzdem Unsinn; hier
  // steht die Vorsicht genau andersherum als beim Präpositiv.
  if (b.aufgabe === 'praep' || b.aufgabe === 'plural' || b.aufgabe === 'gen' ||
    b.aufgabe === 'dat' || b.aufgabe === 'instr') {
    var taugt = function (v) {
      if (!v || NOMEN[v.ru] || !istNomen(v.art)) return false;
      if (b.aufgabe === 'praep') return !belebt(v.art);
      if (b.aufgabe === 'dat') return belebt(v.art);
      return true;
    };
    var orte = b.beispiele.map(function (ru) { return VOKABEL[ru]; }).filter(taugt);
    var gelernt = orte.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
    return gelernt.length >= 4 ? gelernt : orte;
  }
  var passt = function (v) {
    if (!istNomen(v.art)) return false;
    // Belebte männliche Nomen im Akkusativ bleiben draußen, bis ihr eigener
    // Baustein dran ist — sonst verlangte die Übung eine ungelernte Regel.
    if (b.aufgabe === 'akk' && v.art === 'mb') return false;
    // Im Präpositiv bleibt draußen, was die Regel nicht trägt: flüchtige
    // Vokale, eigene Stämme, der Ortsfall auf -у. Im Satz erklärt «Wissen»
    // solche Formen trotzdem — erklären und abfragen sind zwei Dinge.
    // Erst wenn die Regel sitzt, kommen die Wörter dazu, die sie nicht verrät.
    if (b.aufgabe === 'geschlecht' && stufe < SATZ_STUFE &&
      geschlecht(v.art) !== wortartRegel(v.ru)) return false;
    return true;
  };
  var begonnen = ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) > 0 && passt(v);
  });
  if (begonnen.length >= 6) return begonnen;
  var aus = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
    .filter(function (v) { return v && passt(v); });
  // Beispiele zuerst, damit auch ein leerer Lernstand sofort üben kann.
  var drin = {};
  aus.forEach(function (v) { drin[v.id] = true; });
  begonnen.forEach(function (v) { if (!drin[v.id]) aus.push(v); });
  return aus.length ? aus : ALL_VOCAB.filter(passt).slice(0, 12);
}

// Ablenker für den Akkusativ: dasselbe Wort mit anderen Endungen. Sie sind
// keine erfundenen Wörter, sondern Formen, die es gibt — nur nicht hier.
function gramAblenker(ru, richtig) {
  var stamm = ru.replace(/[аяоеьйы]$/, '');
  var enden = ['а', 'у', 'е', 'и', 'ы', 'о'];
  var aus = [];
  enden.forEach(function (e) {
    var f = stamm + e;
    // «ы» steht nie nach к г х ж ч ш щ — ein Ablenker, den die Rechtschreibung
    // schon ausschließt, wäre kein Ablenker.
    if (e === 'ы' && nachZischlaut(stamm)) return;
    if (f !== richtig && f !== ru && aus.indexOf(f) === -1) aus.push(f);
  });
  if (ru !== richtig && aus.indexOf(ru) === -1) aus.push(ru);
  return shuffle(aus).slice(0, 3);
}

// Ablenker fürs Präsens: dasselbe Verb in anderen Personen. Auch sie sind echte
// Formen — wer sie wählt, hat nicht falsch gebaut, sondern die falsche Person.
// Die Zukunft in den anderen Personen — falsch, aber plausibel gebaut.
function gramAblenkerFutur(ru, richtig) {
  var aus = [];
  PERSONEN.forEach(function (p) {
    var f = futur(ru, p);
    if (f && f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  });
  return shuffle(aus).slice(0, 3);
}

function gramAblenkerPerson(ru, richtig) {
  var formen = verbBau(ru) || [];
  var aus = [];
  shuffle(formen.slice()).forEach(function (f) {
    if (f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  });
  return aus.slice(0, 3);
}

// Ablenker für die Ich-Form. Hier steht ausnahmsweise auch ein Wort dabei, das
// es nicht gibt: der ungewandelte Stamm mit der Endung («любю»). Genau das ist
// der Fehler, um den es geht — ihn nicht zu wählen, ist die Aufgabe.
function gramAblenkerIch(ru, richtig) {
  var stamm = verbStamm(ru);
  var aus = [];
  var dazu = function (f) {
    if (f && f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  };
  dazu(stamm + (nachZischlaut(stamm) ? 'у' : 'ю'));
  dazu(stamm + 'ю');
  gramAblenkerPerson(ru, richtig).forEach(dazu);
  return aus.slice(0, 3);
}

// Ablenker für die Vergangenheit und für die Übereinstimmung: dieselbe Form in
// den anderen drei Geschlechtern. Wer sie wählt, hat nicht falsch gebaut,
// sondern sich nach dem falschen Wort gerichtet.
function gramAblenkerGenus(bauen, richtig) {
  var aus = [];
  shuffle(GENERA.slice()).forEach(function (g) {
    var f = bauen(g);
    if (f && f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  });
  return aus.slice(0, 3);
}

function gramFrageBauen() {
  var b = gramAktuell();
  gramPhase = 'ask';
  aufgabeBeginnt();
  gramPicked = null;
  gramCorrect = null;
  gramEingabe = '';
  meisterMeldung = null;
  if (!b) { gramQ = null; return; }

  var pool = gramWortPool(b);
  if (!pool.length) { gramQ = null; return; }
  var wort = pool[Math.floor(Math.random() * pool.length)];
  if (gramQ && pool.length > 1) {
    var ohne = pool.filter(function (v) { return v.id !== gramQ.wort.id; });
    if (ohne.length) wort = ohne[Math.floor(Math.random() * ohne.length)];
  }

  var tippen = gramBox(b) >= SATZ_STUFE;

  if (b.aufgabe === 'geschlecht') {
    gramQ = {
      baustein: b.id, art: 'geschlecht', wort: wort,
      loesung: geschlecht(wort.art),
      optionen: ['m', 'w', 's']
    };
    return;
  }
  // Ich-Form: gegeben ist die ты-Form, damit der Stamm offen daliegt. Gefragt
  // ist allein, was mit ihm geschieht.
  if (b.aufgabe === 'ichform') {
    var ich = praesens(wort.ru, '1s');
    gramQ = {
      baustein: b.id, art: 'ichform', wort: wort, person: '1s',
      von: praesens(wort.ru, '2s'), loesung: ich, tippen: tippen,
      optionen: shuffle([ich].concat(gramAblenkerIch(wort.ru, ich)))
    };
    return;
  }
  // Zukunft: dieselbe Auslosung wie beim Präsens, nur bleibt die Grundform
  // stehen — gebeugt wird der Helfer.
  if (b.aufgabe === 'fut') {
    var fperson = b.person || PERSONEN[Math.floor(Math.random() * PERSONEN.length)];
    if (gramQ && gramQ.person === fperson && !b.person) {
      fperson = PERSONEN[(PERSONEN.indexOf(fperson) + 1 + Math.floor(Math.random() * 5)) % 6];
    }
    var fform = futur(wort.ru, fperson);
    gramQ = {
      baustein: b.id, art: 'fut', wort: wort, person: fperson,
      von: wort.ru, loesung: fform, tippen: tippen,
      optionen: shuffle([fform].concat(gramAblenkerFutur(wort.ru, fform)))
    };
    return;
  }
  // Präsens: eine Person auslosen, die Form dazu bauen.
  if (b.aufgabe === 'praes') {
    var person = b.person || PERSONEN[Math.floor(Math.random() * PERSONEN.length)];
    if (gramQ && gramQ.person === person && !b.person) {
      person = PERSONEN[(PERSONEN.indexOf(person) + 1 + Math.floor(Math.random() * 5)) % 6];
    }
    var pform = praesens(wort.ru, person);
    gramQ = {
      baustein: b.id, art: 'praes', wort: wort, person: person,
      von: wort.ru, loesung: pform, tippen: tippen,
      optionen: shuffle([pform].concat(gramAblenkerPerson(wort.ru, pform)))
    };
    return;
  }
  // Vergangenheit: ausgelost wird, wer gehandelt hat — davon hängt die Endung
  // ab, nicht von der Person.
  if (b.aufgabe === 'praet') {
    var genus = GENERA[Math.floor(Math.random() * GENERA.length)];
    if (gramQ && gramQ.genus === genus) {
      genus = GENERA[(GENERA.indexOf(genus) + 1 + Math.floor(Math.random() * 3)) % 4];
    }
    var vform = praeteritum(wort.ru, genus);
    gramQ = {
      baustein: b.id, art: 'praet', wort: wort, genus: genus,
      von: wort.ru, loesung: vform, tippen: tippen,
      optionen: shuffle([vform].concat(gramAblenkerGenus(function (g) {
        return praeteritum(wort.ru, g);
      }, vform)))
    };
    return;
  }
  // Übereinstimmung: das Nomen bestimmt, wie das Adjektiv aussieht. Es wird
  // mitgelost — die Mehrzahl steht dabei für sich, sie hat kein Geschlecht.
  if (b.aufgabe === 'adj') {
    var partner = gramNomenPartner(b);
    var agenus = partner ? partner.genus : 'w';
    var aform = adjektiv(wort.ru, agenus);
    gramQ = {
      baustein: b.id, art: 'adj', wort: wort, genus: agenus,
      partner: partner, von: wort.ru, loesung: aform, tippen: tippen,
      optionen: shuffle([aform].concat(gramAblenkerGenus(function (g) {
        return adjektiv(wort.ru, g);
      }, aform)))
    };
    return;
  }
  // Fälle: unter der Endstufe die Form wählen, darüber selbst schreiben.
  var form = grammForm(wort.ru, wort.art, b.aufgabe);
  gramQ = {
    baustein: b.id, art: b.aufgabe, wort: wort, loesung: form,
    tippen: tippen,
    optionen: shuffle([form].concat(gramAblenker(wort.ru, form)))
  };
}

// Das Nomen, nach dem sich das Adjektiv richtet — aus der Liste des Bausteins,
// nicht aus dem ganzen Wortschatz. Grammatisch ginge jedes: «тёмный папа» ist
// tadellos gebeugt und trotzdem Unsinn. Wo eine Aufgabe etwas über die Welt
// voraussetzt und nicht nur über die Sprache, nennt der Baustein seine Wörter
// selbst — dieselbe Regel wie beim Präpositiv.
// Bekanntes zuerst: Ein Nomen, das man schon kennt, macht die Aufgabe zu einer
// über die Endung statt zu zweien auf einmal.
function gramNomenPartner(b) {
  var alleP = b.partner.map(function (ru) { return VOKABEL[ru]; })
    .filter(function (v) { return v && istNomen(v.art); });
  var pool = alleP.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
  if (pool.length < 3) pool = alleP;
  if (!pool.length) return null;
  var v = pool[Math.floor(Math.random() * pool.length)];
  var mehrzahl = Math.random() < 0.25;
  return {
    wort: v,
    genus: mehrzahl ? 'p' : geschlecht(v.art),
    text: mehrzahl ? plural(v.ru, v.art) : v.ru,
    mehrzahl: mehrzahl
  };
}

function gramAbgabeBereit() {
  if (!gramQ) return false;
  if (gramQ.tippen) return normalize(gramEingabe) !== '';
  return gramPicked !== null;
}

function gramPruefen() {
  var q = gramQ;
  var b = gramFinde(q.baustein);
  gramCorrect = q.tippen
    ? normalize(gramEingabe) === normalize(q.loesung)
    : gramPicked === q.loesung;
  kommentarSetzen({
    ok: gramCorrect, loesung: q.loesung, eingabe: q.tippen ? gramEingabe : '',
    getippt: !!q.tippen,
    daneben: q.tippen ? danebenZeichen(gramEingabe, q.loesung) : (gramCorrect ? 0 : 99)
  });
  var vorher = gramBox(b);
  gramUpdate(b, gramCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, gramBox(b), 'Regel', b.name,
    gramMeisterschaft() + ' von ' + GRAMMATIK.length + ' Regeln', false);
  if (vorher < BOX_MAX && gramBox(b) >= BOX_MAX &&
    gramMeisterschaft() === GRAMMATIK.length) {
    jubelEinmal('regel', 'regel', { m: GRAMMATIK.length });
  }
  rekoVerlangen(q.loesung, !!q.tippen, gramCorrect, false);
  meisterTon(gramCorrect);
  zuletztGeuebt('grammatik');
  gramPhase = 'feedback';
  renderGrammatik();
}

// ── Entdecken ───────────────────────────────────────────────
// Erst sehen, dann benennen, dann die Regel: Was man selbst gefunden hat,
// behält man. Freie Eingabe wäre nicht bewertbar — die Wahl unter drei
// Deutungen ist die bewertbare Form desselben Gedankens.
// Die Beispiele müssen **kontrastieren**, sonst gibt es nichts zu entdecken:
// Vier weibliche Wörter zeigen kein Muster, sie zeigen vier Mal dasselbe. Für
// das Geschlecht also je eines pro Geschlecht; für den Akkusativ zwei, die sich
// ändern, und eines, das bleibt — erst der Unterschied ist die Regel.
function gramEntdeckenWoerter(b) {
  var pool = gramWortPool(b);
  // Bei Verben gibt es kein Geschlecht zu mischen — den Gegensatz stellt
  // gramPaare() über Personen und Reihen her.
  if (b.aufgabe === 'praes' || b.aufgabe === 'ichform' || b.aufgabe === 'fut' ||
    b.aufgabe === 'praet' || b.aufgabe === 'adj') return pool.slice(0, 4);
  var nach = function (g) {
    return pool.filter(function (v) { return geschlecht(v.art) === g; });
  };
  var aus = [];
  var nimm = function (liste, wieviele) {
    liste.forEach(function (v) {
      if (aus.length < 4 && wieviele > 0 && aus.indexOf(v) === -1) { aus.push(v); wieviele--; }
    });
  };
  // Präpositiv wie Geschlecht: je eines pro Geschlecht. Der Gegensatz ist hier
  // gerade, dass es *keinen* gibt — dreimal dieselbe Endung, und genau das soll
  // auffallen, weil der Akkusativ es anders macht.
  if (b.aufgabe === 'geschlecht' || b.aufgabe === 'praep' ||
    b.aufgabe === 'plural' || b.aufgabe === 'gen' || b.aufgabe === 'dat' ||
    b.aufgabe === 'instr') {
    nimm(nach('w'), 1); nimm(nach('m'), 1); nimm(nach('s'), 1); nimm(pool, 1);
  } else {
    nimm(nach('w'), 2); nimm(nach('s'), 1); nimm(nach('m'), 1);
  }
  if (aus.length < 3) nimm(pool, 4 - aus.length);
  return aus;
}

// Die Gegenüberstellung, aus der die Regel hervorgehen soll. Was links und was
// rechts steht, hängt an der Aufgabe — der Unterschied dazwischen ist die Regel.
//   Präsens: ein Verb in drei Personen — die Endung sagt, wer.
//   i-Reihe: dieselbe Person bei Verben beider Reihen — der Infinitiv entscheidet.
//   Ich-Form: die ты-Form neben der я-Form, darunter eines ohne Wandel.
function gramPaare(b) {
  var aus = [];
  if (b.aufgabe === 'ichform') {
    gramEntdeckenWoerter(b).slice(0, 3).forEach(function (v) {
      aus.push({ links: praesens(v.ru, '2s'), rechts: praesens(v.ru, '1s'), kyr: true });
    });
    var glatt = gramGlattesVerb(b);
    if (glatt) {
      aus.push({ links: praesens(glatt.ru, '2s'), rechts: praesens(glatt.ru, '1s'), kyr: true });
    }
    return aus;
  }
  // Vergangenheit: ein Verb, vier Handelnde — nicht die Person entscheidet,
  // sondern wer handelt. Das ist der Gegensatz zum Präsens, und genau er soll
  // auffallen.
  if (b.aufgabe === 'praet') {
    var eines = gramEntdeckenWoerter(b)[0];
    if (!eines) return aus;
    GENERA.forEach(function (g) {
      aus.push({
        links: eines.ru + ' · ' + (g === 'p' ? 'они' : { m: 'он', w: 'она', s: 'оно' }[g]),
        rechts: praeteritum(eines.ru, g), kyr: true
      });
    });
    return aus;
  }
  // Übereinstimmung: dasselbe Adjektiv neben Nomen dreier Geschlechter.
  if (b.aufgabe === 'adj') {
    var adjektive = gramEntdeckenWoerter(b);
    var eins2 = adjektive[0];
    if (!eins2) return aus;
    var muster = b.partner.map(function (ru) { return VOKABEL[ru]; })
      .filter(function (v) { return v && istNomen(v.art) && !NOMEN[v.ru]; });
    ['m', 'w', 's'].forEach(function (g) {
      var n = muster.filter(function (v) { return geschlecht(v.art) === g; })[0];
      if (n) aus.push({ links: eins2.ru + ' · ' + n.ru, rechts: adjektiv(eins2.ru, g), kyr: true });
    });
    var mz = muster[0];
    if (mz) {
      aus.push({
        links: eins2.ru + ' · ' + plural(mz.ru, mz.art), rechts: adjektiv(eins2.ru, 'p'), kyr: true
      });
    }
    return aus;
  }
  // Zukunft: ein Verb in vier Personen — gebeugt wird der Helfer, die
  // Grundform bleibt stehen. Genau das soll auffallen.
  if (b.aufgabe === 'fut') {
    var einsF = gramEntdeckenWoerter(b)[0];
    if (!einsF) return aus;
    ['1s', '2s', '3s', '3p'].forEach(function (p) {
      aus.push({
        links: einsF.ru + ' · ' + PERSON_NAME[p], rechts: futur(einsF.ru, p), kyr: true
      });
    });
    return aus;
  }
  if (b.aufgabe === 'praes') {
    var pool = gramEntdeckenWoerter(b);
    if (b.klasse === 'i') {
      // Der Gegensatz sitzt zwischen den Reihen, nicht zwischen den Personen.
      var andere = gramVerbe({ aufgabe: 'praes', klasse: 'e' });
      pool.slice(0, 3).forEach(function (v) {
        aus.push({ links: v.ru + ' · он', rechts: praesens(v.ru, '3s'), kyr: true });
      });
      if (andere.length) {
        aus.push({ links: andere[0].ru + ' · он', rechts: praesens(andere[0].ru, '3s'), kyr: true });
      }
      return aus;
    }
    var eins = pool[0];
    if (!eins) return aus;
    ['1s', '2s', '3s', '3p'].forEach(function (p) {
      aus.push({
        links: eins.ru + ' · ' + PERSON_NAME[p], rechts: praesens(eins.ru, p), kyr: true
      });
    });
    return aus;
  }
  gramEntdeckenWoerter(b).forEach(function (v) {
    aus.push({
      links: v.ru,
      rechts: b.aufgabe === 'geschlecht'
        ? GESCHLECHT_NAME[geschlecht(v.art)]
        : (b.aufgabe === 'praep' ? 'в ' : b.aufgabe === 'gen' ? 'нет '
          : b.aufgabe === 'dat' ? 'к ' : b.aufgabe === 'instr' ? 'с ' : '') +
          grammForm(v.ru, v.art, b.aufgabe),
      kyr: b.aufgabe !== 'geschlecht'
    });
  });
  return aus;
}

// Ein Verb derselben Reihe, dessen Stamm sich *nicht* wandelt — es ist die
// Gegenprobe: Ohne ein Beispiel ohne Wandel sähe es aus, als wandle sich immer
// etwas.
function gramGlattesVerb(b) {
  void b;
  var glatt = gramVerbe({ aufgabe: 'praes', klasse: 'i' }).filter(function (v) {
    return !verbIchWandel(v.ru);
  });
  return glatt.length ? glatt[0] : null;
}

// Alle Verben des Lehrplans, an denen dieser Baustein etwas zeigen kann.
function gramVerbe(b) {
  return ALL_VOCAB.filter(function (v) { return gramVerbPasst(b, v); });
}

// Was die Aufgabe außer dem Wort noch vorgibt — die Bedeutung und, wenn es
// eine gibt, die verlangte Person oder das Geschlecht. Das stand als graue
// Nebenbemerkung da und wurde überlesen; jetzt ist es ein eigenes Feld, und
// der verlangte Teil trägt die Goldfarbe.
function gramVorgabe(bedeutung, verlangt) {
  return '<p class="gram-vorgabe"><span class="gv-bedeutung">' + esc(bedeutung) + '</span>' +
    (verlangt ? '<span class="gv-trenner" aria-hidden="true"></span>' +
      '<strong class="gv-verlangt">' + verlangt + '</strong>' : '') + '</p>';
}

// Die Begründung *zu dieser Antwort* — nicht die Regel im Allgemeinen. Sie
// steht nach der Auflösung da, wo man sie braucht.
function gramWarumHtml(b, q) {
  var v = q.wort;
  var g = geschlecht(v.art);
  if (q.art === 'geschlecht') {
    // Ausnahme heißt: ein anderes Geschlecht als die Endung sagt. Dass ein Wort
    // zusätzlich belebt ist, macht es nicht zur Ausnahme.
    var ausRegel = geschlecht(v.art) === wortartRegel(v.ru);
    return '<p class="hint">' + (ausRegel
      ? '«' + esc(v.ru) + '» endet auf <strong class="cyr">' +
        esc(v.ru.slice(-1)) + '</strong> — also ' + GESCHLECHT_NAME[g] + '.'
      : '«' + esc(v.ru) + '» ist eine Ausnahme: Die Endung sagt etwas anderes, ' +
        'das Wort ist ' + GESCHLECHT_NAME[g] + '.') + '</p>';
  }
  if (q.art === 'praes' || q.art === 'ichform') {
    return '<p class="hint">' + gramVerbWarum(v.ru, q.person, q.loesung) + '</p>';
  }
  if (q.art === 'fut') {
    return '<p class="hint"><strong class="cyr">' + esc(v.ru) + '</strong> bleibt, wie es ' +
      'ist — gebeugt wird nur der Helfer: für <span class="cyr">' +
      esc(PERSON_NAME[q.person]) + '</span> heißt er <strong class="cyr">' +
      esc(q.loesung.split(' ')[0]) + '</strong>.</p>';
  }
  if (q.art === 'praep') {
    return '<p class="hint">' + gramNomenWarum(v.ru, v.art, q.loesung) + '</p>';
  }
  if (q.art === 'praet') {
    return '<p class="hint"><strong class="cyr">' + esc(v.ru) + '</strong> ohne ' +
      '<span class="cyr">-ть</span> ist <strong class="cyr">' + esc(v.ru.slice(0, -2)) +
      '</strong>; ' + (q.genus === 'p' ? 'in der Mehrzahl' : 'für ' + GENUS_NAME[q.genus]) +
      ' kommt <strong class="cyr">-' + esc(PRAET_ENDE[q.genus]) +
      '</strong> daran. Die Person spielt keine Rolle.</p>';
  }
  if (q.art === 'adj') {
    var t = adjTeile(v.ru) || { stamm: v.ru, zisch: false, velar: false, weich: false };
    var warum = t.weich
      ? 'Der Stamm ist weich (<span class="cyr">' + esc(t.stamm) + '</span> + ' +
        '<span class="cyr">-ий</span>), darum die weiche Reihe.'
      : (t.zisch || t.velar
        ? 'Nach <span class="cyr">' + esc(t.stamm.slice(-1)) + '</span> steht nie ' +
          '<span class="cyr">-ы</span> — in der Mehrzahl also <span class="cyr">-ие</span>.'
        : 'Harter Stamm, harte Endungen.');
    return '<p class="hint">' + (q.partner
      ? '<strong class="cyr">' + esc(q.partner.text) + '</strong> ist ' +
        (q.genus === 'p' ? 'Mehrzahl' : GENUS_NAME[q.genus]) + ' — darum ' +
        '<strong class="cyr">' + esc(q.loesung) + '</strong>. '
      : '') + warum + '</p>';
  }
  if (q.art === 'gen' || q.art === 'dat' || q.art === 'instr' || q.art === 'plural') {
    var letzt = v.ru.slice(-1);
    var neuLetzt = q.loesung.slice(v.ru.length - 1);
    return '<p class="hint">' + esc(v.ru) + ' ist ' + GESCHLECHT_NAME[g] + ' und endet auf ' +
      '<strong class="cyr">' + esc(letzt) + '</strong>' +
      (q.art === 'plural' && nachZischlaut(v.ru.replace(/[аяоеьйы]$/, ''))
        ? ' — und nach <span class="cyr">' + esc(v.ru.replace(/[аяоеьйы]$/, '').slice(-1)) +
          '</span> steht nie <span class="cyr">-ы</span>'
        : '') +
      ', darum <strong class="cyr">' + esc(q.loesung) + '</strong>' +
      (neuLetzt ? ' auf <strong class="cyr">' + esc(q.loesung.slice(-1)) + '</strong>' : '') +
      '.</p>';
  }
  var gleich = q.loesung === v.ru;
  void b;
  return '<p class="hint">' + esc(v.ru) + ' ist ' + GESCHLECHT_NAME[g] + ' — ' +
    (gleich ? 'und bleibt im Akkusativ unverändert.'
      : 'darum wird <strong class="cyr">' + esc(v.ru.slice(-1)) + '</strong> zu <strong class="cyr">' +
        esc(q.loesung.slice(-1)) + '</strong>.') + '</p>';
}

// Warum diese Präpositivform — in Worten. Auch sie braucht «Wissen» im Satz.
function gramNomenWarum(ru, art, form) {
  var eigen = NOMEN[ru] || null;
  if (eigen && eigen.starr) {
    return '<strong class="cyr">' + esc(ru) + '</strong> ist ein Lehnwort und ' +
      'ändert sich nie — in keinem Fall.';
  }
  if (eigen && eigen.praep) {
    if (/у$/.test(form)) {
      return 'Eine Handvoll männlicher Wörter nimmt nach в und на ein ' +
        '<strong class="cyr">-у</strong> statt <strong class="cyr">-е</strong>: ' +
        '<strong class="cyr">' + esc(ru) + ' → ' + esc(form) + '</strong>. Das muss man ' +
        'wissen, herleiten kann man es nicht.';
    }
    return '<strong class="cyr">' + esc(ru) + '</strong> verliert vor der Endung einen ' +
      'Laut: <strong class="cyr">' + esc(form) + '</strong>. Auch das gehört gewusst.';
  }
  if (form === ru) {
    return '<strong class="cyr">' + esc(ru) + '</strong> endet schon auf ' +
      '<strong class="cyr">-е</strong> — da bleibt nichts zu ändern.';
  }
  if (/(ия|ий|ие)$/.test(ru)) {
    return 'Wörter auf <strong class="cyr">-ия</strong>, <strong class="cyr">-ий</strong> ' +
      'und <strong class="cyr">-ие</strong> gehen auf <strong class="cyr">-ии</strong> ' +
      'statt auf -е: <strong class="cyr">' + esc(ru) + ' → ' + esc(form) + '</strong>.';
  }
  if (/ь$/.test(ru) && art === 'w') {
    return 'Weibliche Wörter auf <strong class="cyr">-ь</strong> nehmen ' +
      '<strong class="cyr">-и</strong>: <strong class="cyr">' + esc(ru) + ' → ' +
      esc(form) + '</strong>.';
  }
  var alt = /[аяоьй]$/.test(ru) ? ru.slice(-1) : '';
  return '<strong class="cyr">' + esc(ru) + '</strong> ist ' +
    GESCHLECHT_NAME[geschlecht(art)] + ' und folgt der Hauptregel: ' +
    (alt ? '<strong class="cyr">' + esc(alt) + '</strong> wird zu '
      : 'es kommt ein ') + '<strong class="cyr">-е</strong> → ' +
    '<strong class="cyr">' + esc(form) + '</strong>.';
}

// Stamm plus Endung, in Worten — und wo der Stamm sich wandelt, auch das.
// Dieselbe Erklärung braucht «Wissen» im Satz, darum steht sie hier für beide.
function gramVerbWarum(ru, person, form) {
  var stamm = verbStamm(ru);
  var klasse = verbKlasse(ru);
  if (!stamm || !form) {
    return '«' + esc(ru) + '» folgt keiner der beiden Reihen — diese Formen ' +
      'muss man einzeln kennen.';
  }
  var gewandelt = person === '1s' && klasse === 'i' ? stammIch(stamm) : stamm;
  var endung = form.indexOf(gewandelt) === 0 ? form.slice(gewandelt.length) : '';
  var text = '<strong class="cyr">' + esc(ru) + '</strong> hat den Stamm ' +
    '<strong class="cyr">' + esc(stamm) + '-</strong>';
  if (gewandelt !== stamm) {
    text += ', der in der Ich-Form zu <strong class="cyr">' + esc(gewandelt) +
      '-</strong> wird';
  }
  text += '. Dazu die Endung der ' + (klasse === 'i' ? 'i' : 'e') + '-Reihe für ' +
    esc(PERSON_NAME[person]) + ': <strong class="cyr">-' + esc(endung) +
    '</strong> → <strong class="cyr">' + esc(form) + '</strong>.';
  return text;
}

// Kopf über der Aufgabe: ein Punkt je Baustein, wie das Paket in «Lernsets».
function gramKopfHtml(b) {

}

function renderGrammatik() { leisteRahmen(grammInhaltZeichnen); }

  });
}

// ── SCHREIBUNG ──────────────────────────────────────────────
// Russisch schreibt nach dem Wortstamm, nicht nach dem Klang: молоко klingt
// «malakó» und steht doch mit zwei о da. Wer nach Gehör schreibt, schreibt
// falsch — und merkt es nie, weil er es richtig *hört*.
//
// Wie in «Grammatik» ist die Karteikarte darum die **Regel**, nicht das Wort.
// Anders als dort zählt sie aber mit: Die Übung steht in der Gruppe «Wörter»,
// nicht unter «Freiwillig». Sie prüft eine andere Fähigkeit als «Tippen» —
// dort ruft man ein Wort ab, hier entscheidet man eine Schreibung.
//
// **Eine Aufgabe ist ein Paar.** In den Daten stehen die richtige Schreibweise
// und die nach Gehör; wo sie sich unterscheiden, ist die Lücke. Die Stelle
// steht nirgends als Zahl — eine Zahl kann danebenliegen, ohne dass es jemand
// merkt, ein Paar nicht (ADR 0055).
var orthoRegel = null;      // Kennung der laufenden Regel
var orthoQ = null;          // die laufende Aufgabe
var orthoPhase = 'ask';     // 'ask' · 'feedback'
var orthoPicked = null;
var orthoCorrect = null;
var orthoEingabe = '';
var orthoKb = null;
var orthoRegelOffen = false;
var orthoWahl = null;       // ausdrücklich gewählte Regel; null heißt: der Reihe nach
var orthoRegelNeu = false;  // frisch entdeckt: die Regel steht ganzseitig da

function orthoBox(r) { return state.orthoBox[r.id] || 0; }
function orthoEntdeckt(r) { return state.orthoSeen[r.id] !== undefined; }
function orthoGemeistert(r) { return orthoBox(r) >= BOX_MAX; }
function orthoFaellig(r, jetzt) {
  var seit = state.orthoSeen[r.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(orthoBox(r));
}
function orthoMeisterschaft() { return ORTHO.filter(orthoGemeistert).length; }

function orthoFinde(id) {
  return ORTHO.filter(function (r) { return r.id === id; })[0] || null;
}

function orthoPool() {
  var jetzt = Date.now();
  var offen = ORTHO.filter(function (r) { return !orthoGemeistert(r); });
  var frisch = ORTHO.filter(function (r) { return orthoGemeistert(r) && orthoFaellig(r, jetzt); });
  return offen.concat(frisch);
}

// Der Reihe nach wie bei den Bausteinen: Аканье trägt am meisten und steht
// darum zuerst — ein Zufallsgriff verschenkte diese Ordnung.
function orthoWaehlen() {
  var pool = orthoPool();
  return pool.length ? pool[0] : null;
}

function orthoAktuell() {
  if (orthoWahl) {
    var gewaehlt = orthoFinde(orthoWahl);
    if (gewaehlt) { orthoRegel = gewaehlt.id; return gewaehlt; }
    orthoWahl = null;
  }
  var r = orthoRegel ? orthoFinde(orthoRegel) : null;
  if (!r) { r = orthoWaehlen(); orthoRegel = r ? r.id : null; }
  return r;
}

// **Zählt mit.** «Buchstaben» und «Grammatik» bleiben aus Serie und Antworten
// heraus, weil sie freiwillig sind; die Schreibung ist es nicht — sie steht bei
// den Wörtern. Eine Übung, die auf Home unter «Wörter» steht und trotzdem die
// Serie reißen lässt, widerspräche sich.
function orthoUpdate(r, richtig) {
  tempoNotieren();
  var cur = orthoBox(r);
  state.orthoBox[r.id] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.orthoSeen[r.id] = Date.now();
  state.streak = richtig ? state.streak + 1 : 0;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.answered++;
  updateKopf();
  save();
}

// Die Lücke: gemeinsamer Anfang, gemeinsames Ende, dazwischen die eine Stelle.
// Sie kann leer sein — «ь oder nichts» ist genauso eine Entscheidung wie
// «о oder а». Der Build stellt sicher, dass es nie mehr als eine ist.
function orthoStelle(a) {
  var ist = a.ist, klingt = a.klingt;
  var p = 0;
  while (p < ist.length && p < klingt.length && ist.charAt(p) === klingt.charAt(p)) p++;
  var s = 0;
  while (s < ist.length - p && s < klingt.length - p &&
    ist.charAt(ist.length - 1 - s) === klingt.charAt(klingt.length - 1 - s)) s++;
  return {
    vor: ist.slice(0, p),
    nach: ist.slice(ist.length - s),
    richtig: ist.slice(p, ist.length - s),
    falsch: klingt.slice(p, klingt.length - s)
  };
}

function orthoFrageBauen() {
  var r = orthoAktuell();
  orthoPhase = 'ask';
  aufgabeBeginnt();
  orthoPicked = null;
  orthoCorrect = null;
  orthoEingabe = '';
  meisterMeldung = null;
  if (!r) { orthoQ = null; return; }

  var pool = r.aufgaben;
  if (orthoQ && orthoQ.regel === r.id && pool.length > 1) {
    pool = pool.filter(function (a) { return a.ist !== orthoQ.aufgabe.ist; });
  }
  var a = pool[Math.floor(Math.random() * pool.length)];
  var st = orthoStelle(a);
  // Unter der Satzstufe wählen, darüber selbst schreiben — dieselbe Schwelle
  // wie in «Grammatik». Zwei Möglichkeiten sind eine Münze; ab der Hälfte der
  // Leiter darf eine Regel nicht mehr geraten werden können.
  orthoQ = {
    regel: r.id, aufgabe: a, stelle: st,
    tippen: orthoBox(r) >= SATZ_STUFE,
    optionen: shuffle([st.richtig, st.falsch])
  };
}

function orthoAbgabeBereit() {
  if (!orthoQ) return false;
  if (orthoQ.tippen) return normalize(orthoEingabe) !== '';
  return orthoPicked !== null;
}

function orthoPruefen() {
  var q = orthoQ;
  var r = orthoFinde(q.regel);
  orthoCorrect = q.tippen
    ? normalize(orthoEingabe) === normalize(q.aufgabe.ist)
    : orthoPicked === q.stelle.richtig;
  kommentarSetzen({
    ok: orthoCorrect, loesung: q.aufgabe.ist, eingabe: q.tippen ? orthoEingabe : '',
    getippt: !!q.tippen,
    daneben: q.tippen ? danebenZeichen(orthoEingabe, q.aufgabe.ist) : (orthoCorrect ? 0 : 99)
  });
  var vorher = orthoBox(r);
  orthoUpdate(r, orthoCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, orthoBox(r), 'Schreibregel', r.name,
    orthoMeisterschaft() + ' von ' + ORTHO.length + ' Regeln', false);
  if (vorher < BOX_MAX && orthoBox(r) >= BOX_MAX &&
    orthoMeisterschaft() === ORTHO.length) {
    jubelEinmal('schreibung', 'schreibung', { m: ORTHO.length });
  }
  rekoVerlangen(q.aufgabe.ist, !!q.tippen, orthoCorrect, false);
  meisterTon(orthoCorrect);
  zuletztGeuebt('schreibung');
  orthoPhase = 'feedback';
  renderSchreibung();
}

// ── Entdecken ───────────────────────────────────────────────
// Dieselbe Gegenüberstellung wie in «Grammatik» — und dieselben Klassen dafür,
// die Anordnung ist die gleiche.
//
// **Was links steht, hängt daran, ob die Regel eine über den Klang ist.** Bei
// Аканье steht links die Lautung: «малако → молоко». Bei -тся/-ться klingen
// beide Schreibweisen gleich; links stünde dann eine Lüge. Dort steht die
// Bedeutung — und genau sie entscheidet ja auch.
function orthoPaare(r) {
  return r.aufgaben.slice(0, 4).map(function (a) {
    return {
      links: r.hoerbar === false ? a.de : a.klingt,
      rechts: a.ist,
      kyrLinks: r.hoerbar !== false
    };
  });
}

function orthoEntdeckenHtml(r) {
  var hoerbar = r.hoerbar !== false;
  var html = '<p class="task-label">' + esc(r.name) + ' · entdecken</p>' +
    '<div class="card"><p class="hint">' + esc(r.frage) + '</p><div class="gram-paare">' +
    '<div class="gram-paar"><span class="gram-deutung">' +
    (hoerbar ? 'gehört' : 'gemeint') + '</span>' +
    '<span class="gram-pfeil" aria-hidden="true"></span>' +
    '<span class="gram-deutung">geschrieben</span></div>';
  orthoPaare(r).forEach(function (p) {
    html += '<div class="gram-paar"><span class="' + (p.kyrLinks ? 'cyr' : 'gram-deutung') + '">' +
      esc(p.links) + '</span>' +
      '<span class="gram-pfeil" aria-hidden="true">→</span>' +
      '<span class="cyr">' + esc(p.rechts) + '</span></div>';
  });
  html += '</div><div class="options">';
  r.deutungen.forEach(function (d, i) {
    var klasse = 'option';
    if (orthoPhase === 'feedback') {
      if (i === r.richtig) klasse += ' right';
      else if (orthoPicked === i) klasse += ' wrong';
      else klasse += ' muted';
    } else if (orthoPicked === i) klasse += ' picked';
    html += '<button class="' + klasse + '" data-orthodeutung="' + i + '"' +
      (orthoPhase !== 'ask' ? ' disabled' : '') + '>' + esc(d) + '</button>';
  });
  html += '</div>';
  if (orthoPhase === 'feedback') {
    html += '<div class="feedback ' + (orthoCorrect ? 'good' : 'bad') + '"><p>' +
      (orthoCorrect ? ICON.haken + 'Genau das ist es.' : ICON.kreuz + 'Nicht ganz — so ist es:') +
      '</p></div>';
  }
  html += '</div><div class="btn-row">';
  html += orthoPhase === 'ask'
    ? '<button class="btn primary" id="orthoDeutungAb"' + (orthoPicked === null ? ' disabled' : '') +
      '>Bestätigen</button>'
    : '<button class="btn primary" id="orthoZurRegel">Die Regel →</button>';
  return html + '</div>';
}

// ── Die Regelkarte ──────────────────────────────────────────
// Die Tabelle bauen hier die Aufgaben selbst: Beispiele sind bei einer
// Schreibregel dasselbe wie eine Tabelle, nur ehrlicher.
function orthoRegelHtml(r, mitKnopf) {
  var hoerbar = r.hoerbar !== false;
  var html = '<div class="card gram-regel">' + merkSternHtml('o', r.id) +
    '<p class="task-label">' + esc(r.name) +
    ' · ' + esc(r.kurz) + '</p>' +
    '<p class="fact-text">' + esc(r.regel) + '</p><div class="gram-tabelle">';
  r.aufgaben.slice(0, 5).forEach(function (a) {
    html += '<div class="gram-zeile"><span class="gram-fall cyr">' + esc(a.ist) + '</span>' +
      '<span class="gram-was">' + esc(a.de) + '</span>' +
      '<span class="gram-bsp' + (hoerbar ? ' cyr' : '') + '">' +
      (hoerbar ? esc(a.klingt) : '') + '</span></div>';
  });
  html += '</div><p class="gram-merk">' + esc(r.merksatz) + '</p></div>';
  if (mitKnopf) {
    html += '<div class="btn-row"><button class="btn primary" id="orthoZurUebung">' +
      'Jetzt anwenden →</button></div>';
  }
  return html;
}

// ── Anwenden ────────────────────────────────────────────────
function orthoUebenHtml(r) {
  if (!orthoQ || orthoQ.regel !== r.id) orthoFrageBauen();
  var q = orthoQ;
  var st = q.stelle;
  var a = q.aufgabe;
  var stufe = orthoBox(r);
  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) {
    dots += '<span class="' + (i <= stufe && stufe > 0 ? 'on' : '') + '"></span>';
  }
  var html = orthoKopfHtml(r) + '<p class="kachel-ort">' + esc(r.name) + '</p>' +
    '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="mitte">' + (q.tippen ? 'selbst schreiben' : 'wählen') + '</span>' +
    '<span></span></div>';

  html += '<p class="task-label">' +
    (q.tippen ? 'Wie schreibt man das Wort?' : 'Was steht in der Lücke?') + '</p>' +
    '<p class="word cyr">' + esc(st.vor) +
    '<span class="ortho-luecke" aria-label="Lücke"> </span>' + esc(st.nach) + '</p>';
  // Was die Aufgabe außer dem Wort vorgibt — dieselbe Zeile wie in «Grammatik».
  // Die Lautung steht nur da, wo es eine gibt: Bei -тся/-ться klingen beide
  // Schreibweisen gleich, dort entscheidet allein die Bedeutung.
  html += gramVorgabe(a.de, r.hoerbar === false ? ''
    : '<span class="cyr">' + esc(a.klingt) + '</span>');

  if (q.tippen) {
    html += orthoPhase === 'feedback'
      ? pruefzeileHtml(orthoEingabe, a.ist, true, 'form')
      : '<textarea id="orthoInput" rows="1" class="fliess cyr"' +
        ' lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
        kbFeldAttr(orthoKb) + ' enterkeyhint="go" placeholder="Das ganze Wort schreiben …">' +
        esc(orthoEingabe) + '</textarea>';
  } else {
    html += '<div class="options abc-optionen">';
    q.optionen.forEach(function (o) {
      var klasse = 'option' + (o ? ' cyr' : '');
      if (orthoPhase === 'feedback') {
        if (o === st.richtig) klasse += ' right';
        else if (orthoPicked === o) klasse += ' wrong';
        else klasse += ' muted';
      } else if (orthoPicked === o) klasse += ' picked';
      html += '<button class="' + klasse + '" data-orthoopt="' + esc(o) + '"' +
        (orthoPhase !== 'ask' ? ' disabled' : '') + '>' +
        (o ? esc(o) : 'nichts') + '</button>';
    });
    html += '</div>';
  }

  if (orthoPhase === 'feedback') {
    html += '<div class="feedback ' + (orthoCorrect ? 'good' : 'bad') + '"><p>' +
      (orthoCorrect ? ICON.haken + 'Richtig!'
        : ICON.kreuz + 'So steht es: <strong class="cyr">' + esc(a.ist) + '</strong>') +
      hoerknopf(a.ist, 'ru') + '</p></div>' +
      orthoWarumHtml(r, a) + meisterHtml();
  }

  html += '</div>' + rekoHtml() + '<div class="btn-row">';
  if (orthoPhase === 'ask') {
    html += '<button class="btn ghost" id="orthoWarum" aria-expanded="' +
      (orthoRegelOffen ? 'true' : 'false') + '" aria-controls="orthoRegelKlapp">Mehr …</button>' +
      '<button class="btn primary" id="orthoConfirm"' + (orthoAbgabeBereit() ? '' : ' disabled') +
      '>' + (q.tippen ? 'Prüfen' : 'Bestätigen') + '</button>';
  } else {
    html += '<button class="btn primary" id="orthoNext"' + (rekoFertig() ? '' : ' disabled') +
      '>Weiter →</button>';
  }
  html += '</div>';
  html += '<div class="regelklapp' + (orthoRegelOffen ? ' auf' : '') + '" id="orthoRegelKlapp"' +
    ' aria-hidden="' + (orthoRegelOffen ? 'false' : 'true') + '"><div class="klappwrap">' +
    orthoRegelHtml(r, false) + '</div></div>';
  if (q.tippen && orthoPhase === 'ask') {
    if (orthoKb === null) orthoKb = tastaturVorgabe(true);
    html += '<button class="kb-toggle" id="orthoKbToggle">' +
      (orthoKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (orthoKb) html += tastaturHtml('orthokey');
  }
  html += '<p class="session-info">' + orthoPool().length + ' offen · ' +
    orthoMeisterschaft() + ' von ' + ORTHO.length + ' Regeln sitzen</p>';
  return html;
}

// Die Begründung *zu diesem Wort*. Wo es ein Prüfwort gibt, ist es die Antwort:
// Man muss nichts auswendig wissen, man muss die Stelle nur betont hören.
function orthoWarumHtml(r, a) {
  if (a.pruef) {
    return '<p class="hint">Die Probe: <strong class="cyr">' + esc(a.pruef) +
      '</strong> — dort trägt die Stelle die Betonung und ist zu hören. ' +
      'Darum <strong class="cyr">' + esc(a.ist) + '</strong>.</p>';
  }
  return '<p class="hint">' + esc(r.merksatz) + '</p>';
}

// Kopf über der Aufgabe: ein Punkt je Regel, wie das Paket in «Lernsets».
function orthoKopfHtml(r) {
  var html = '<p class="task-label">Schreibregeln</p><div class="paket">' +
    '<div class="paket-punkte" aria-hidden="true">';
  ORTHO.forEach(function (x) { html += ppHtml(orthoBox(x)); });
  html += '</div><p class="paket-text">' + orthoMeisterschaft() + ' von ' +
    ORTHO.length + ' sitzen · gerade: ' + esc(r.name) + '</p></div>';
  return html;
}

function renderSchreibung() { leisteRahmen(schreibInhaltZeichnen); }

function schreibInhaltZeichnen() {
  if (faktKarte) {
    main.innerHTML = faktKarteHtml();
    faktKarteBinden(function () { renderSchreibung(); });
    chiliAktualisieren();
    return;
  }
  var r = orthoAktuell();
  if (!r) {
    var jetzt = Date.now();
    var ruhend = ORTHO.filter(function (x) {
      return orthoGemeistert(x) && !orthoFaellig(x, jetzt);
    }).length;
    main.innerHTML = '<section><div class="leer">' + maskottchen('gross') +
      '<h3>Alle Schreibregeln sitzen</h3><p>Alle ' + ORTHO.length +
      ' Regeln sind ' + BOX_MAX + '× richtig angewandt. ' + ruhend +
      ' ruhen bis zur nächsten Auffrischung.</p>' +
      '<p class="naechste">Wiederholen kannst du trotzdem jederzeit: ' +
      'Über die Auswahl oben lässt sich jede Regel einzeln vornehmen.</p>' +
      '</div></section>';
    return;
  }

  var html = '<section>';
  if (!orthoEntdeckt(r)) html += orthoEntdeckenHtml(r);
  else if (orthoRegelNeu) html += orthoKopfHtml(r) + orthoRegelHtml(r, true);
  else html += orthoUebenHtml(r);
  main.innerHTML = html + '</section>';

  main.querySelectorAll('[data-orthodeutung]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (orthoPhase !== 'ask') return;
      orthoPicked = parseInt(el.dataset.orthodeutung, 10);
      renderSchreibung();
    });
  });
  var ab = document.getElementById('orthoDeutungAb');
  if (ab) ab.addEventListener('click', function () {
    if (orthoPicked === null) return;
    orthoCorrect = orthoPicked === r.richtig;
    ton(orthoCorrect);
    orthoPhase = 'feedback';
    renderSchreibung();
  });
  var zurRegel = document.getElementById('orthoZurRegel');
  if (zurRegel) zurRegel.addEventListener('click', function () {
    // Entdeckt ist entdeckt — die Stufe steigt erst beim Anwenden.
    state.orthoSeen[r.id] = Date.now();
    save();
    orthoRegelNeu = true;
    orthoPhase = 'ask';
    orthoPicked = null;
    renderSchreibung();
  });
  var zurUebung = document.getElementById('orthoZurUebung');
  if (zurUebung) zurUebung.addEventListener('click', function () {
    orthoRegelNeu = false;
    orthoFrageBauen();
    renderSchreibung();
  });

  main.querySelectorAll('[data-orthoopt]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (orthoPhase !== 'ask') return;
      orthoPicked = el.dataset.orthoopt;
      if (state.settings.confirmUeben) renderSchreibung();
      else orthoPruefen();
    });
  });
  var feld = document.getElementById('orthoInput');
  enterGibtAb(feld, 'orthoConfirm');
  if (feld) feld.addEventListener('input', function () {
    orthoEingabe = feld.value;
    var k = document.getElementById('orthoConfirm');
    if (k) k.disabled = !orthoAbgabeBereit();
  });
  var kb = document.getElementById('orthoKbToggle');
  if (kb) kb.addEventListener('click', function () { orthoKb = !orthoKb; renderSchreibung(); });
  main.querySelectorAll('[data-orthokey]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (orthoPhase !== 'ask') return;
      var k = el.dataset.orthokey;
      orthoEingabe = k === 'BS' ? orthoEingabe.slice(0, -1) : orthoEingabe + k;
      var f = document.getElementById('orthoInput');
      feldSchreiben('orthoInput', orthoEingabe);
      var c = document.getElementById('orthoConfirm');
      if (c) c.disabled = !orthoAbgabeBereit();
    });
  });
  merkBinden(null);
  var warum = document.getElementById('orthoWarum');
  if (warum) warum.addEventListener('click', function () {
    // Nicht neu zeichnen — dieselbe Bewegung wie in «Grammatik»: Die Karte
    // liegt schon da, nur zugeklappt.
    orthoRegelOffen = !orthoRegelOffen;
    var klapp = document.getElementById('orthoRegelKlapp');
    if (klapp) {
      klapp.classList.toggle('auf', orthoRegelOffen);
      klapp.setAttribute('aria-hidden', orthoRegelOffen ? 'false' : 'true');
    }
    warum.setAttribute('aria-expanded', orthoRegelOffen ? 'true' : 'false');
    if (orthoRegelOffen && klapp) {
      setTimeout(function () {
        try { klapp.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
        catch (e) { klapp.scrollIntoView(false); }
      }, 380);
    }
  });
  var conf = document.getElementById('orthoConfirm');
  if (conf) conf.addEventListener('click', function () {
    if (orthoAbgabeBereit()) orthoPruefen();
  });
  rekoBinden(renderSchreibung);
  var next = document.getElementById('orthoNext');
  if (next) next.addEventListener('click', function () {
    if (!rekoFertig()) return;
    reko = null;
    orthoRegel = null;    // gemeisterte Regel abgeben, sonst dieselbe weiter
    orthoFrageBauen();
    faktFaellig();        // der Fakt liegt beim Weitergehen, nicht in der Auflösung
    renderSchreibung();
  });
}

// ── POWER-TRAINING ──────────────────────────────────────────
// Wer ein Wort dreimal hintereinander verschreibt, verliert es (ADR 0033) —
// und findet es danach irgendwann im großen Stapel wieder. Das ist richtig,
// aber langsam. Hier kommen genau diese Wörter noch einmal geballt: **drei
// Stück, jedes fünfmal**, mit steigender Schwierigkeit.
//
// Warum drei und nicht alle: Ein Stapel aus zwölf gefallenen Wörtern ist
// dasselbe wie der große Stapel, nur kürzer. Drei Wörter fünfmal hintereinander
// sind eine Einheit, die man zu Ende bringt — und genau darum wirkt sie.
var PT_MINDEST = 3;      // ab so vielen gefallenen Wörtern öffnet die Übung
var PT_WOERTER = 3;      // so viele kommen in eine Runde
var PT_RUNDEN = 5;       // so oft muss jedes richtig sein

// Ansichtszustand — gehört nach ADR 0017 in ansichtenZuruecksetzen().
var ptSatz = null;       // die laufende Runde: [{ v, treffer }]
var ptQ = null;          // die laufende Frage
var ptPhase = 'ask';     // 'ask' · 'feedback' · 'fertig'
var ptEingabe = '';
var ptBuilt = [];
var ptKb = null;

// Der Vorrat: gefallene Wörter, die noch unter der Satzschwelle stehen. Wer
// wieder oben ist, hat es geschafft und fliegt aus der Liste — das Aufräumen
// geschieht hier, damit es nicht an einer Schreibstelle vergessen wird.
function ptPool() {
  var aus = [];
  Object.keys(state.patzer).forEach(function (id) {
    var v = VOKABEL[id];
    if (!v) { delete state.patzer[id]; return; }
    if ((state.boxes[id] || 0) >= SATZ_STUFE) { delete state.patzer[id]; return; }
    aus.push(v);
  });
  // Das zuletzt Gefallene zuerst: Es sitzt am wenigsten.
  aus.sort(function (a, b) { return (state.patzer[b.id] || 0) - (state.patzer[a.id] || 0); });
  return aus;
}

function ptOffen() {
  return ptPool().length >= PT_MINDEST;
}

// Eine Runde aufsetzen: die drei zuletzt gefallenen Wörter, jedes mit einem
// eigenen Zähler.
function ptRundeStarten() {
  ptSatz = ptPool().slice(0, PT_WOERTER).map(function (v) {
    return { v: v, treffer: 0 };
  });
  ptPhase = 'ask';
  ptQ = null;
  ptFrageBauen();
}

// Welches Wort ist dran? Das mit den wenigsten Treffern, aber nie zweimal
// hintereinander dasselbe, solange es eine Alternative gibt.
function ptNaechstes() {
  var offen = ptSatz.filter(function (e) { return e.treffer < PT_RUNDEN; });
  if (!offen.length) return null;
  var wenigste = offen.slice().sort(function (a, b) { return a.treffer - b.treffer; });
  if (ptQ && wenigste.length > 1 && wenigste[0].v.id === ptQ.wort.id) {
    return wenigste[1];
  }
  return wenigste[0];
}

// Die Schwierigkeit steigt mit dem Zähler — dieselbe Leiter wie überall, nur
// im Zeitraffer: erst zusammensetzen, dann schreiben mit Umschrift, dann ohne.
function ptStufe(treffer) {
  if (treffer < 2) return 'kacheln';
  if (treffer < 4) return 'tippen-hilfe';
  return 'tippen';
}

function ptFrageBauen() {
  var eintrag = ptNaechstes();
  ptPhase = 'ask';
  aufgabeBeginnt();
  ptEingabe = '';
  ptBuilt = [];
  meisterMeldung = null;
  if (!eintrag) { ptQ = null; ptPhase = 'fertig'; return; }
  var stufe = ptStufe(eintrag.treffer);
  var q = { wort: eintrag.v, eintrag: eintrag, stufe: stufe };
  if (stufe === 'kacheln') {
