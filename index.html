  var r = raster.getBoundingClientRect();
  if (!vorher) {
    var oben = Math.max(0, reihe.top - r.top - 3), unten = Math.max(0, r.bottom - reihe.bottom - 3);
    // Ein Tropfen: Aus der Zeile quillt erst eine runde Perle, sie wird bauchig
    // und läuft nach oben und unten aus, die Ecken zuletzt glatt (ADR 0025).
    bewegt(raster, [{ clipPath: 'inset(' + px(oben) + ' 22% ' + px(unten) + ' 22% round 999px)' },
      { clipPath: 'inset(' + px(oben * 0.45) + ' 5% ' + px(unten * 0.45) + ' 5% round 56px)', offset: 0.45 },
      { clipPath: 'inset(0px 0px 0px 0px round 0px)' }], KAL_TAKT);
    return;
  }
  var g = vorher.geist, a = vorher.rect, alt = vorher.reihe;
  bewegt(raster, [{ opacity: 0 }, { opacity: 1 }], { dauer: KAL_TAKT.dauer * 0.5, warten: KAL_TAKT.dauer * 0.4,
    kurve: 'ease-out', fill: 'backwards' });
  if (!g || !alt) return;
  g.style.cssText = 'position: fixed; margin: 0; left: ' + px(a.left) + '; top: ' + px(a.top) + '; width: ' +
    px(a.width) + '; z-index: 2;';
  document.body.appendChild(g);
  var o = Math.max(0, alt.top - a.top - 3), u = Math.max(0, a.bottom - alt.bottom - 3), dy = reihe.top - alt.top;
  bewegt(g, [{ clipPath: 'inset(0px 0px 0px 0px round 0px)', transform: 'none', opacity: 1 },
    { clipPath: 'inset(' + px(o * 0.55) + ' 5% ' + px(u * 0.55) + ' 5% round 56px)', transform: 'translateY(' + px(dy * 0.5) + ')',
      opacity: 1, offset: 0.55 },
    { clipPath: 'inset(' + px(o) + ' 22% ' + px(u) + ' 22% round 999px)', transform: 'translateY(' + px(dy) + ')', opacity: 0 }],
    { dauer: KAL_TAKT.dauer, kurve: KAL_TAKT.kurve, fill: 'forwards' }, function () { weg(g); });
}

// Woche vor oder zurück: Die alte Woche zieht sich zur Perle zusammen und
// tropft zur Seite ab, die neue quillt von der anderen Seite als Perle herein
// und streckt sich zur Zeile — vor nach links, zurück nach rechts (ADR 0028).
// `vorher`: Geist und Lage der alten Woche, vor dem Neuzeichnen genommen.
function kalSeitlich(richtung, vorher) {
  var raster = $('kalRaster');
  if (!raster || !vorher || bewegungAus()) return;
  var ab = richtung > 0 ? -1 : 1, her = -ab, r = raster.getBoundingClientRect(), a = vorher.rect, g = vorher.geist;
  // Eine Perle am Rand der Seite `seite` (-1 links, 1 rechts), so hoch wie die Zeile erlaubt.
  function perle(w, h, seite) {
    var d = Math.min(h, 44), rand = px((h - d) / 2);
    return 'inset(' + rand + ' ' + (seite < 0 ? px(w - d) + ' ' + rand + ' 0px' : '0px ' + rand + ' ' + px(w - d)) +
      ' round ' + px(d / 2) + ')';
  }
  function bauch(seite) { return 'inset(4px ' + (seite < 0 ? '38% 4px 0px' : '0px 4px 38%') + ' round 40px)'; }
  function schub(w, seite, t) { return 'translateX(' + px(seite * Math.min(48, w * 0.12) * t) + ')'; }
  var voll = 'inset(0px 0px 0px 0px round 0px)';
  if (g) {
    g.style.cssText = 'position: fixed; margin: 0; left: ' + px(a.left) + '; top: ' + px(a.top) + '; width: ' +
      px(a.width) + '; z-index: 2;';
    document.body.appendChild(g);
    bewegt(g, [{ clipPath: voll, transform: 'none', opacity: 1 },
      { clipPath: bauch(ab), transform: schub(a.width, ab, 0.4), opacity: 1, offset: 0.5 },
      { clipPath: perle(a.width, a.height, ab), transform: schub(a.width, ab, 1), opacity: 0 }],
      { dauer: KAL_TAKT.dauer, kurve: KAL_TAKT.kurve, fill: 'forwards' }, function () { weg(g); });
  }
  // Die neue Woche rückt nicht von außen herein, sie quillt nur aus der Perle
  // am Rand: Was über den Rand ragt, macht die Seite breiter, und iOS
  // verkleinert dann die ganze Ansicht (ADR 0029). Der Geist darf wandern — er
  // steht fest und zählt nicht zur Breite.
  bewegt(raster, [{ clipPath: perle(r.width, r.height, her), opacity: 0 },
    { clipPath: bauch(her), opacity: 1, offset: 0.5 },
    { clipPath: voll, opacity: 1 }],
    { dauer: KAL_TAKT.dauer, warten: Math.round(KAL_TAKT.dauer * 0.3), kurve: KAL_TAKT.kurve, fill: 'backwards' });
}

// Vor, zurück oder zu «diese Woche»: In der Woche tropft es zur Seite, der
// Monat blendet wie bisher ein.
function kalBlaettern(ziel) {
  var richtung = ziel > kalVersatz ? 1 : ziel < kalVersatz ? -1 : 0, alt = $('kalRaster');
  var vorher = richtung && state.kalender === 'woche' && alt ? { geist: geist(alt), rect: alt.getBoundingClientRect() } : null;
  kalVersatz = ziel;
  kalTag = null;
  kalGewechselt = !vorher;
  render();
  kalGewechselt = false;
  if (vorher) kalSeitlich(richtung, vorher);
}

// Die Tagesliste springt nicht an ihren neuen Platz, sie gleitet im selben
// Takt wie Raster und Karte dorthin.
function leisteGleiten(obenVorher) {
  var l = $('kalLeiste');
  if (obenVorher === null || !l || bewegungAus()) return;
  var dy = obenVorher - l.getBoundingClientRect().top;
  if (Math.abs(dy) < 1) return;
  bewegt(l, [{ transform: 'translateY(' + px(dy) + ')' }, { transform: 'none' }], KAL_TAKT);
}

function zeichneKalender(heute) {
  var b = kalBereich(heute), woche = b.monat === null;
  var html = '<div class="kal-kopf">' +
      '<button type="button" class="rund" id="kalZurueck" aria-label="' + (woche ? 'Woche' : 'Monat') +
        ' davor">' + ICON.zurueck + '</button>' +
      (kalVersatz
        ? '<button type="button" class="kal-titel" id="kalHeute" aria-label="' + esc(b.titel) +
          ', zurück zu heute">' + esc(b.titel) + '</button>'
        : '<div class="kal-titel" id="kalTitel">' + esc(b.titel) + '</div>') +
      '<button type="button" class="rund" id="kalVor" aria-label="' + (woche ? 'Woche' : 'Monat') +
        ' danach">' + ICON.weiter + '</button>' +
    '</div>' +
    // Die Wochentage stehen über dem Raster, nicht in ihm: Wenn der Monat aus
    // der Woche quillt, bleiben sie stehen.
    '<div class="kal-wtage" aria-hidden="true">' +
      WOCHE.map(function (t) { return '<span class="kal-wt">' + WT_KURZ[t] + '</span>'; }).join('') + '</div>' +
    '<div class="kal-raster ' + (woche ? 'woche' : 'monat') + (kalGewechselt ? ' neu' : '') + '" id="kalRaster">';
  for (var k = b.von; k <= b.bis; k = tagPlus(k, 1)) {
    var d = ausSchluessel(k);
    // Im Monat läuft über jeder Woche ein Strich durch den Kalender, vorn auf
    // ihm ihre Kalenderwoche (ADR 0025). Die Woche nennt sie im Titel.
    if (!woche && d.getDay() === 1) {
      html += '<div class="kal-kw-zeile" aria-hidden="true"><span>KW ' + kalenderwoche(k) + '</span></div>';
    }
    if (!woche && d.getMonth() !== b.monat) { html += '<span class="kal-tag fremd"></span>'; continue; }
    var t = tagesStand(k), stufe = kalStufe(t, k, heute), zaehlt = t.von && k <= heute;
    var tn = termineAm(k).length;
    html += '<button type="button" class="kal-tag ' + stufe + (k === heute ? ' heute' : '') +
      (k === kalTag ? ' gewaehlt' : '') + '" data-kaltag="' + k + '" aria-pressed="' +
      (k === kalTag ? 'true' : 'false') + '" aria-label="' + esc(datumLang(d)) +
      (tn ? ', ' + tn + (tn === 1 ? ' Termin' : ' Termine') : '') +
      (zaehlt ? ', ' + t.fertig + ' von ' + t.von + ' erledigt' : '') + '">' +
      '<span class="kal-zahl">' + d.getDate() + '</span>' +
      '<span class="kal-punkte" aria-hidden="true">' + (tn ? ['termin'] : []).concat(kalPunkte(k, heute)).map(function (art) {
        return '<span class="kp ' + art + '"></span>';
      }).join('') + '</span>' +
      '</button>';
  }
  html += '</div>';
  if (kalTag && kalTag >= b.von && kalTag <= b.bis) html += zeichneTagesleiste(kalTag, heute);
  return html;
}

// Der angetippte Tag: oben seine Termine, darunter seine Gewohnheiten, abhakbar,
// solange er nah genug ist. Zuletzt «Hinzufügen»: Es fragt erst, was — ein
// Termin an diesem Tag, eine Gewohnheit oder etwas zum Abgewöhnen (ADR 0023).
function zeichneTagesleiste(k, heute) {
  var html = '<div class="kal-leiste" id="kalLeiste" aria-live="polite">' +
    '<div class="kal-leiste-kopf">' + esc(datumLang(ausSchluessel(k))) + '</div>';
  var termine = termineAm(k);
  if (termine.length) {
    html += '<div class="tm-liste flach">' + termine.map(function (t) { return zeichneTerminZeile(t, k); }).join('') +
      '</div>';
  }
  return html + zeichneTagesGewohnheiten(k, heute) +
    '<button type="button" class="kal-neu" id="kalNeu" data-tag="' + k + '" aria-haspopup="dialog">' +
      ICON.plus + '<span>Hinzufügen</span></button></div>';
}

// Wer keine Gewohnheit hat, liest hier auch nichts darüber. Ein Tag, der noch
// kommt, sagt schon, was an ihm dran ist — abhaken läßt er sich nicht.
function zeichneTagesGewohnheiten(k, heute) {
  var liste = aktiveGewohnheiten().filter(function (g) { return g.angelegt <= k; });
  if (!aktiveGewohnheiten().length) return '';
  if (k > heute) return zeichneTagVoraus(liste, k);
  if (!liste.length) return '<p class="klein">Da gab es noch keine Gewohnheit.</p>';
  var html = '', zuAlt = false;
  liste.forEach(function (g) {
    var erl = g.erledigt.indexOf(k) !== -1;
    // «x-mal pro Woche» verpaßt keinen Tag — gewertet wird die Woche.
    var n = erl && g.zaehler ? zaehlStand(g, k) : 0;
    var wie = erl ? (n && (n !== 1 || g.zaehler.einheit) ? mengeText(g, n) + ' erledigt' : 'erledigt')
      : g.rhythmus.art === 'proWoche' ? 'frei'
      : !faelligAm(g, k) ? 'nicht dran' : k === heute ? 'offen' : 'verpasst';
    var innen = '<span class="kal-haken">' + ICON.haken + '</span>' +
      '<span class="kal-name">' + esc(g.name) + '</span><span class="kal-status">' + wie + '</span>';
    if (aenderbarAm(g, k)) {
      html += '<button type="button" class="kal-zeile' + (erl ? ' erledigt' : '') + '" data-nachtrag="' +
        esc(g.id) + '" aria-pressed="' + (erl ? 'true' : 'false') + '">' + innen + '</button>';
    } else {
      zuAlt = true;
      html += '<div class="kal-zeile' + (erl ? ' erledigt' : '') + '">' + innen + '</div>';
    }
  });
  if (zuAlt) html += '<p class="klein">Nachtragen geht bis ' + NACHTRAG_TAGE + ' Tage zurück.</p>';
  return html;
}

// Was an einem kommenden Tag dran ist: das Fällige vorn, «x-mal pro Woche»
// dahinter, was nicht dran ist, zuletzt und blaß.
function zeichneTagVoraus(liste, k) {
  function wie(g) { return g.rhythmus.art === 'proWoche' ? 'frei' : faelligAm(g, k) ? 'fällig' : 'nicht dran'; }
  var rang = { 'fällig': 0, frei: 1, 'nicht dran': 2 };
  var sortiert = liste.slice().sort(function (a, b) { return rang[wie(a)] - rang[wie(b)]; });
  var faellig = sortiert.filter(function (g) { return wie(g) === 'fällig'; }).length;
  return '<p class="klein kal-voraus">' + (faellig ? (faellig === 1 ? 'Eine Gewohnheit ist' : faellig +
      ' Gewohnheiten sind') + ' an diesem Tag dran.' : 'An diesem Tag ist keine Gewohnheit fällig.') + '</p>' +
    sortiert.map(function (g) {
      var w = wie(g);
      return '<div class="kal-zeile kommt' + (w === 'nicht dran' ? ' still' : '') + '">' +
        '<span class="kal-haken">' + ICON.haken + '</span>' +
        '<span class="kal-name">' + esc(g.name) + '</span><span class="kal-status">' + w + '</span></div>';
    }).join('');
}

// ── Rückblick: Heatmap ─────────────────────────────────────────
// Die letzten HM_WOCHEN Wochen einer Gewohnheit oder eines Lasters: Spalten
// sind Wochen (Mo–So), die laufende steht rechts. Ein Tag ist dort rund 11 px
// breit — zu klein für einen Finger. Das Raster ist darum Überblick: Ein Tipp
// wählt die Woche, darunter stehen ihre sieben Tage groß, erst dort den Tag.
// Geändert wird nichts, nachgetragen wird im Kalender (ADR 0015).
var HM_WOCHEN = 26;

var HM_TEXT = {
  erledigt: 'erledigt', verpasst: 'verpasst', offen: 'offen', frei: 'nicht dran',
  vorher: 'noch nicht angelegt', sauber: 'frei', rueckfall: 'Rückfall', start: 'vor dem Start'
};

// Was gerade gewählt ist. `fuer` ist die Gewohnheit oder das Laster; wer eine
// andere öffnet, beginnt wieder bei der laufenden Woche.
var hm = { fuer: null, woche: HM_WOCHEN - 1, tag: null, wie: null, erster: null, summe: '' };

// Der Zustand eines Tages, wie in der Tagesliste des Kalenders: «x-mal pro
// Woche» verpaßt keinen Tag, heute offen ist kein Aussetzer.
function hmGewohnheit(g, heute) {
  var erl = {};
  g.erledigt.forEach(function (k) { erl[k] = true; });
  return function (k) {
    if (k > heute) return 'zukunft';
    if (k < g.angelegt) return 'vorher';
    if (erl[k]) return 'erledigt';
    if (g.rhythmus.art === 'proWoche' || !faelligAm(g, k)) return 'frei';
    return k === heute ? 'offen' : 'verpasst';
  };
}

// Abgewöhnen: Jeder Tag ab dem Start ist frei, außer er trägt einen Rückfall.
function hmLaster(a, nun) {
  var heute = tagSchluessel(new Date(nun)), erster = tagSchluessel(new Date(a.start)), rueck = {};
  a.rueckfaelle.forEach(function (r) {
    if (r.zeit <= nun) rueck[tagSchluessel(new Date(r.zeit))] = true;
  });
  return function (k) {
    if (k > heute) return 'zukunft';
    if (k < erster) return 'start';
    return rueck[k] ? 'rueckfall' : 'sauber';
  };
}

// Was die Zeile zeigt, solange kein Tag gewählt ist.
function hmSumme(zahl, g) {
  if (!g) {
    return zahl.sauber + (zahl.sauber === 1 ? ' Tag' : ' Tage') + ' frei' +
      (zahl.rueckfall ? ', ' + zahl.rueckfall + ' mit Rückfall' : '') + '.';
  }
  // Eine frische Gewohnheit hat noch nichts hinter sich — «0 von 0» sagt das
  // schlechter als ein Satz.
  if (g.rhythmus.art === 'proWoche') return zahl.erledigt ? zahl.erledigt + '-mal erledigt.' : 'Noch nichts erledigt.';
  var faellig = zahl.erledigt - zahl.extra + zahl.verpasst;
  if (!faellig) return zahl.extra ? zahl.extra + '-mal erledigt, an freien Tagen.' : 'Noch kein fälliger Tag vorbei.';
  return (zahl.erledigt - zahl.extra) + ' von ' + faellig + ' fälligen Tagen erledigt.';
}

// `g` ist die Gewohnheit, ohne sie ist es das Laster `l`.
function zeichneHeatmap(g, l) {
  var heute = heuteSchluessel(), wie = g ? hmGewohnheit(g, heute) : hmLaster(l, zeitJetzt());
  var erster = tagPlus(wochenAnfang(heute), -7 * (HM_WOCHEN - 1)), id = (g || l).id;
  if (hm.fuer !== id) { hm.fuer = id; hm.woche = HM_WOCHEN - 1; hm.tag = null; }
  var zahl = { erledigt: 0, extra: 0, verpasst: 0, sauber: 0, rueckfall: 0 };
  var zellen = '<span></span>';
  for (var r = 0; r < 7; r++) zellen += '<span class="hm-wt">' + (r % 2 ? '' : WT_KURZ[WOCHE[r]]) + '</span>';
  // Ein Monat steht über der Woche, in der sein Erster liegt. Die erste Spalte
  // nennt ihren eigenen, wenn der nächste nicht gleich folgt.
  var monate = [];
  for (var w = 0; w < HM_WOCHEN; w++) {
    monate[w] = '';
    for (var i = 0; i < 7; i++) {
      var d = ausSchluessel(tagPlus(erster, 7 * w + i));
      if (d.getDate() === 1) monate[w] = MON_KURZ[d.getMonth()];
    }
  }
  if (!monate[0] && !monate[1] && !monate[2]) monate[0] = MON_KURZ[ausSchluessel(erster).getMonth()];
  for (w = 0; w < HM_WOCHEN; w++) {
    zellen += '<span class="hm-monat">' + monate[w] + '</span>';
    for (i = 0; i < 7; i++) {
      var k = tagPlus(erster, 7 * w + i), z = wie(k);
      if (zahl[z] !== undefined) zahl[z]++;
      if (z === 'erledigt' && g && g.rhythmus.art !== 'proWoche' && !faelligAm(g, k)) zahl.extra++;
      zellen += '<span class="hm-z ' + z + (k === heute ? ' heute' : '') + (k === hm.tag ? ' gewaehlt' : '') +
        '" data-hm-tag="' + k + '" data-hm="' + z + '"' + (i ? '' : ' data-hm-mo="' + w + '"') + '></span>';
    }
  }
  hm.wie = wie;
  hm.erster = erster;
  hm.summe = hmSumme(zahl, g);
  var legende = g
    ? [['erledigt', 'erledigt'], ['verpasst', 'verpasst'], ['frei', 'nicht dran']]
    : [['sauber', 'frei'], ['rueckfall', 'Rückfall']];
  return '<section class="abschnitt"><h2>Rückblick</h2><div class="kachel hm">' +
    '<div class="hm-raster" id="hmRaster" role="img" aria-label="' + esc('Die letzten sechs Monate: ' + hm.summe) +
      '">' + zellen + '<span class="hm-rahmen" id="hmRahmen"></span></div>' +
    '<div class="hm-legende" aria-hidden="true">' + legende.map(function (e) {
      return '<span><span class="hm-z ' + e[0] + '"></span>' + e[1] + '</span>';
    }).join('') + '</div>' +
    '<div id="hmWoche">' + zeichneHmWoche() + '</div>' +
    '<p class="hm-zeile" id="hmZeile">' + esc(hmZeile()) + '</p>' +
    '</div></section>';
}

// Die gewählte Woche, Tag für Tag groß genug für einen Finger.
function zeichneHmWoche() {
  var mo = tagPlus(hm.erster, 7 * hm.woche), heute = heuteSchluessel();
  var html = '<div class="kal-kopf hm-kopf">' +
    '<button type="button" class="rund" data-hm-schritt="-1" aria-label="Woche davor"' +
      (hm.woche > 0 ? '' : ' disabled') + '>' + ICON.zurueck + '</button>' +
    '<div class="kal-titel" id="hmTitel">' + esc('KW ' + kalenderwoche(mo) + ' · ' + spanne(mo, tagPlus(mo, 6))) + '</div>' +
    '<button type="button" class="rund" data-hm-schritt="1" aria-label="Woche danach"' +
      (hm.woche < HM_WOCHEN - 1 ? '' : ' disabled') + '>' + ICON.weiter + '</button>' +
    '</div><div class="hm-tage">';
  for (var i = 0; i < 7; i++) {
    var k = tagPlus(mo, i), z = hm.wie(k), d = ausSchluessel(k);
    html += '<button type="button" class="hm-tag' + (k === heute ? ' heute' : '') + (k === hm.tag ? ' gewaehlt' : '') +
      '" data-hm-wahl="' + k + '" aria-pressed="' + (k === hm.tag ? 'true' : 'false') + '"' +
      (z === 'zukunft' ? ' disabled' : '') + '>' +
      '<span class="hm-tag-wt">' + WT_KURZ[d.getDay()] + '</span>' +
      '<span class="hm-tag-zahl">' + d.getDate() + '</span>' +
      '<span class="hm-z ' + z + '"></span></button>';
  }
  return html + '</div>';
}

// Ohne gewählten Tag die Summe, sonst «Di, 13. Okt. · erledigt», heute
// «Heute, 14. Okt. · offen».
function hmZeile() {
  if (!hm.tag) return hm.summe;
  var d = ausSchluessel(hm.tag);
  return (hm.tag === heuteSchluessel() ? 'Heute' : WT_KURZ[d.getDay()]) + ', ' + d.getDate() + '. ' +
    MON_KURZ[d.getMonth()] + ' · ' + HM_TEXT[hm.wie(hm.tag)];
}

// Der Rahmen um die gewählte Spalte. Er sitzt im Raster und fährt hinüber,
// wenn die Woche wechselt.
function hmRahmenSetzen(weich) {
  var rahmen = $('hmRahmen'), mo = document.querySelector('#hmRaster [data-hm-mo="' + hm.woche + '"]');
  if (!rahmen || !mo) return;
  var so = document.querySelector('#hmRaster [data-hm-tag="' + tagPlus(mo.getAttribute('data-hm-tag'), 6) + '"]');
  rahmen.style.transition = weich && !bewegungAus() ? '' : 'none';
  rahmen.style.top = (mo.offsetTop - 2) + 'px';
  rahmen.style.width = (mo.offsetWidth + 4) + 'px';
  rahmen.style.height = (so.offsetTop + so.offsetHeight - mo.offsetTop + 4) + 'px';
  rahmen.style.transform = 'translateX(' + (mo.offsetLeft - 2) + 'px)';
}

// Die Woche wechselt an Ort und Stelle — das Formular darunter bleibt, wie es
// ist. Ein gewählter Tag wandert als derselbe Wochentag mit.
// `aus`: die Fläche, aus der die Tage tropfen — der Punkt im Raster, den der
// Finger traf (ADR 0032). Blättern mit den Pfeilen wechselt ohne Tropfen.
function hmWocheWaehlen(w, aus) {
  w = Math.max(0, Math.min(HM_WOCHEN - 1, w));
  if (w === hm.woche) return;
  if (hm.tag) {
    var t = tagPlus(hm.tag, 7 * (w - hm.woche));
    hm.tag = hm.wie(t) === 'zukunft' ? null : t;
  }
  hm.woche = w;
  $('hmWoche').innerHTML = zeichneHmWoche();
  bindeHmWoche();
  if (aus && !bewegungAus()) tropfenAuf($('hmWoche'), aus, { grund: grundUnter($('hmWoche').parentNode), rund: '14px' });
  hmTagZeigen();
  hmRahmenSetzen(true);
}

function hmTagZeigen() {
  alleIn('#hmRaster .gewaehlt').forEach(function (z) { z.classList.remove('gewaehlt'); });
  if (hm.tag) document.querySelector('#hmRaster [data-hm-tag="' + hm.tag + '"]').classList.add('gewaehlt');
  alleIn('#hmWoche [data-hm-wahl]').forEach(function (b) {
    var an = b.getAttribute('data-hm-wahl') === hm.tag;
    b.classList.toggle('gewaehlt', an);
    b.setAttribute('aria-pressed', an ? 'true' : 'false');
  });
  $('hmZeile').textContent = hmZeile();
}

function bindeHmWoche() {
  alleIn('#hmWoche [data-hm-schritt]').forEach(function (b) {
    b.addEventListener('click', function () { hmWocheWaehlen(hm.woche + Number(this.getAttribute('data-hm-schritt'))); });
  });
  // Nochmal getippt, und die Zeile zeigt wieder die Summe.
  alleIn('#hmWoche [data-hm-wahl]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = this.getAttribute('data-hm-wahl');
      hm.tag = hm.tag === k ? null : k;
      hmTagZeigen();
    });
  });
}

// Ein Tipp ins Raster trifft die Spalte, deren Mitte am nächsten liegt —
// auch zwischen zwei Feldern, auch über der Monatszeile.
function hmSpalteBei(x) {
  var beste = null, abstand = Infinity;
  alleIn('#hmRaster [data-hm-mo]').forEach(function (z) {
    var r = z.getBoundingClientRect(), a = Math.abs(r.left + r.width / 2 - x);
    if (a < abstand) { abstand = a; beste = Number(z.getAttribute('data-hm-mo')); }
  });
  return beste;
}

function bindeHeatmap() {
  $('hmRaster').addEventListener('click', function (e) {
    var w = hmSpalteBei(e.clientX);
    if (w !== null) hmWocheWaehlen(w, punktFlaeche(e.clientX, e.clientY));
  });
  bindeHmWoche();
  hmRahmenSetzen(false);
}

// ── Neue Gewohnheit · Gewohnheit ────────────────────────────────
//
// Ein Formular für beides. Was getippt und gewählt ist, steht im `entwurf`;
// gespeichert wird erst mit dem Knopf. Das Formular zeichnet sich beim
// Wählen nicht neu — sonst ginge die Tastatur zu.
var entwurf = null;

// Ein Entwurf für beide Richtungen. `richtung` ist 'an' (angewöhnen) oder
// 'ab' (abgewöhnen); ein neuer Entwurf darf sie wechseln, ein bestehender nicht.
// «Frei seit» steht als Tag und Uhrzeit darin, wie die Felder sie liefern.
function entwurfAus(g) {
  var r = g ? g.rhythmus : { art: 'taeglich' }, nun = jetzt();
  return {
    id: g ? g.id : null,
    richtung: 'an',
    name: g ? g.name : '',
    art: r.art,
    tage: r.tage ? r.tage.slice() : [1, 2, 3, 4, 5],
    anzahl: r.anzahl || 3,
    weise: g && g.timer ? 'timer' : g && g.zaehler ? 'zaehler' : 'tipp',
    minuten: g && g.timer ? String(g.timer.minuten) : '10',
    schritt: g && g.zaehler ? zahlText(g.zaehler.schritt) : '1',
    einheit: g && g.zaehler ? g.zaehler.einheit : '',
    ton: !(g && g.timer && g.timer.stumm),
    erinnern: !!(g && g.erinnerung),
    erinnerung: g && g.erinnerung ? g.erinnerung : '08:00',
    beginn: g ? g.angelegt : tagSchluessel(nun),
    startTag: tagSchluessel(nun),
    startUhr: zwei(nun.getHours()) + ':' + zwei(nun.getMinutes()),
    startGeaendert: false,
  };
}

// Ein neuer Entwurf aus dem Kalender: `wahl` ist { richtung, tag }. Abgewöhnen
// von einem vergangenen Tag aus heißt «frei seit diesem Tag» — die Uhrzeit
// bleibt die von jetzt. Eine Gewohnheit von einem vergangenen Tag aus heißt
// «begonnen an diesem Tag» (ADR 0033).
function entwurfNeu(wahl) {
  var e = entwurfAus(null);
  if (!wahl || typeof wahl !== 'object') return e;
  if (wahl.richtung !== 'ab' && istSchluessel(wahl.tag) && wahl.tag < tagSchluessel(jetzt())) e.beginn = wahl.tag;
  if (wahl.richtung === 'ab') {
    e.richtung = 'ab';
    if (istSchluessel(wahl.tag) && wahl.tag < tagSchluessel(jetzt())) {
      e.startTag = wahl.tag;
      e.startGeaendert = true;
    }
  }
  return e;
}

function entwurfAusLaster(a) {
  var e = entwurfAus(null), d = new Date(a.start);
  e.id = a.id;
  e.richtung = 'ab';
  e.name = a.name;
  e.startTag = tagSchluessel(d);
  e.startUhr = zwei(d.getHours()) + ':' + zwei(d.getMinutes());
  return e;
}

var RHYTHMEN = [['taeglich', 'Täglich'], ['wochentage', 'Wochentage'], ['proWoche', 'Pro Woche']];
var RICHTUNGEN = [['an', 'Angewöhnen'], ['ab', 'Abgewöhnen']];
var WEISEN = [['tipp', 'Antippen'], ['timer', 'Timer'], ['zaehler', 'Zähler']];
var BEISPIEL = { an: 'Zum Beispiel: Zehn Minuten lesen', ab: 'Zum Beispiel: Rauchen' };

function zeichneFormular() {
  var heute = heuteSchluessel(), ab = entwurf.richtung === 'ab';
  var g = !ab && entwurf.id ? gewohnheitNach(entwurf.id) : null;
  var l = ab && entwurf.id ? lasterNach(entwurf.id) : null;
  var html = '';
  if (g) {
    var a = auswerten(g, heute), woche = g.rhythmus.art === 'proWoche';
    html += zeichneHeatmap(g, null);
    html += '<section class="abschnitt"><h2>Stand</h2><div class="kachel">' +
      '<div class="zeile"><span>Stärke</span><span class="wert">' + prozent(a.staerke) + ' %</span></div>' +
      '<div class="zeile"><span>Serie</span><span class="wert">' + a.serie + ' ' +
        (woche ? (a.serie === 1 ? 'Woche' : 'Wochen') : (a.serie === 1 ? 'Tag' : 'Tage')) + '</span></div>' +
      '<div class="zeile"><span>Seit</span><span class="wert">' +
        esc(datumLang(ausSchluessel(g.angelegt))) + '</span></div>' +
      '</div></section>';
  } else if (l) {
    html += zeichneHeatmap(null, l) + zeichneLasterStand(l);
  } else {
    if (state.schwachHinweis && schwacheZahl(heute) >= HINWEIS_AB) {
      html += '<p class="hinweis" id="gwHinweis">' + ICON.hinweis + '<span>Du baust gerade an ' +
        schwacheZahl(heute) + ' Gewohnheiten, die noch nicht sitzen. Mehr auf einmal macht alle ' +
        'schwächer — vielleicht erst eine festigen?</span></p>';
    }
    html += '<section class="abschnitt"><div class="wahl" role="group" aria-label="Richtung">' +
      RICHTUNGEN.map(function (r) {
        return '<button type="button" data-richtung="' + r[0] + '" aria-pressed="' +
          (entwurf.richtung === r[0] ? 'true' : 'false') + '">' + esc(r[1]) + '</button>';
      }).join('') + '</div></section>';
  }
  html += '<section class="abschnitt"><h2><label for="gwName">Name</label></h2>' +
      '<input id="gwName" class="eingabe" type="text" maxlength="' + NAME_MAX + '" autocomplete="off" ' +
        'enterkeyhint="done" placeholder="' + esc(BEISPIEL[entwurf.richtung]) + '" value="' + esc(entwurf.name) + '">' +
    '</section>' +
    '<section class="abschnitt" id="rhAbschnitt"' + (ab ? ' hidden' : '') + '><h2>Rhythmus</h2>' +
      '<div class="wahl" role="group" aria-label="Rhythmus">' + RHYTHMEN.map(function (r) {
        return '<button type="button" data-art="' + r[0] + '" aria-pressed="' +
          (entwurf.art === r[0] ? 'true' : 'false') + '">' + esc(r[1]) + '</button>';
      }).join('') + '</div>' +
      '<div class="rh-teil tage" id="rhTage" role="group" aria-label="Wochentage"' +
        (entwurf.art === 'wochentage' ? '' : ' hidden') + '>' + WOCHE.map(function (t) {
          return '<button type="button" data-tag="' + t + '" aria-label="' + WOCHENTAGE[t] + '" aria-pressed="' +
            (entwurf.tage.indexOf(t) !== -1 ? 'true' : 'false') + '">' + WT_KURZ[t] + '</button>';
        }).join('') + '</div>' +
      '<div class="rh-teil zaehler" id="rhAnzahl"' + (entwurf.art === 'proWoche' ? '' : ' hidden') + '>' +
        '<button type="button" class="rund" id="anzWeniger" aria-label="Seltener">' + ICON.minus + '</button>' +
        '<span class="wert" id="anzWert" aria-live="polite">' + entwurf.anzahl + '× pro Woche</span>' +
        '<button type="button" class="rund" id="anzMehr" aria-label="Öfter">' + ICON.plus + '</button>' +
      '</div>' +
      '<p class="klein" id="rhText">' + esc(rhythmusErklaerung(entwurf.art)) + '</p>' +
    '</section>' +
    // Wie sie abgehakt wird: angetippt, mit einem Timer oder gezählt (ADR 0038).
    '<section class="abschnitt" id="gwWeise"' + (ab ? ' hidden' : '') + '><h2>Abhaken</h2>' +
      '<div class="wahl" role="group" aria-label="Abhaken">' + WEISEN.map(function (w) {
        return '<button type="button" data-weise="' + w[0] + '" aria-pressed="' +
          (entwurf.weise === w[0] ? 'true' : 'false') + '">' + esc(w[1]) + '</button>';
      }).join('') + '</div>' +
      '<div class="rh-teil" id="gwTimerTeil"' + (entwurf.weise === 'timer' ? '' : ' hidden') + '>' +
        '<label class="tm-etikett" for="gwMinuten">Minuten</label>' +
        '<input id="gwMinuten" class="eingabe" type="number" inputmode="numeric" min="1" max="' + TIMER_MAX +
          '" step="1" value="' + esc(entwurf.minuten) + '">' +
        '<div class="tm-schalterzeile"><span id="gwTonName">Ton am Ende</span>' +
          '<button type="button" class="schalter" id="gwTon" role="switch" aria-labelledby="gwTonName" ' +
            'aria-checked="' + (entwurf.ton ? 'true' : 'false') + '"><span class="schalter-spur">' +
            '<span class="schalter-knauf"></span></span></button></div>' +
      '</div>' +
      '<div class="rh-teil zaehl-felder" id="gwZaehlerTeil"' + (entwurf.weise === 'zaehler' ? '' : ' hidden') + '>' +
        '<div><label class="tm-etikett" for="gwSchritt">Je Tipp</label>' +
          '<input id="gwSchritt" class="eingabe" type="text" inputmode="decimal" autocomplete="off" value="' +
            esc(entwurf.schritt) + '"></div>' +
        '<div><label class="tm-etikett" for="gwEinheit">Einheit</label>' +
          '<input id="gwEinheit" class="eingabe" type="text" maxlength="' + EINHEIT_MAX + '" autocomplete="off" ' +
            'placeholder="z. B. L" value="' + esc(entwurf.einheit) + '"></div>' +
      '</div>' +
      '<p class="klein" id="gwWeiseText">' + esc(weiseErklaerung(entwurf.weise)) + '</p>' +
    '</section>' +
    // Schon länger dabei, nur nicht eingetragen: Der Beginn darf zurück, nie
    // vor — sonst ginge Gespeichertes verloren (ADR 0033).
    '<section class="abschnitt" id="gwBeginnAbschnitt"' + (ab ? ' hidden' : '') + '><h2><label for="gwBeginn">' +
        'Begonnen am</label></h2>' +
      '<input id="gwBeginn" class="eingabe" type="date" max="' + esc(g ? g.angelegt : heute) + '" value="' +
        esc(entwurf.beginn) + '">' +
      '<p class="klein">' + (g ? 'Früher angefangen? Stell den Tag zurück — jeder fällige Tag davor zählt als erledigt.'
        : 'Schon länger dabei? Stell den Tag zurück — jeder fällige Tag seitdem zählt als erledigt.') + '</p>' +
    '</section>' +
    '<section class="abschnitt" id="gwErinnerung"' + (ab ? ' hidden' : '') + '><h2>Erinnerung</h2>' +
      '<div class="tm-schalterzeile"><span id="gwErinnernName">Im Kalender erinnern</span>' +
        '<button type="button" class="schalter" id="gwErinnern" role="switch" aria-labelledby="gwErinnernName" ' +
          'aria-checked="' + (entwurf.erinnern ? 'true' : 'false') + '"><span class="schalter-spur">' +
          '<span class="schalter-knauf"></span></span></button></div>' +
      '<div class="rh-teil" id="gwUhrTeil"' + (entwurf.erinnern ? '' : ' hidden') + '>' +
        '<input id="gwUhr" class="eingabe" type="time" aria-label="Uhrzeit der Erinnerung" value="' +
          esc(entwurf.erinnerung) + '">' +
      '</div>' +
      '<p class="klein" id="gwErText">' + esc(erinnerungErklaerung(entwurf)) + '</p>' +
    '</section>' +
    '<section class="abschnitt" id="abStart"' + (ab ? '' : ' hidden') + '><h2>Frei seit</h2>' +
      '<div class="start-felder">' +
        '<input id="abTag" class="eingabe" type="date" aria-label="Tag" max="' + heute + '" value="' +
          esc(entwurf.startTag) + '">' +
        '<input id="abUhr" class="eingabe" type="time" aria-label="Uhrzeit" value="' + esc(entwurf.startUhr) + '">' +
      '</div>' +
      '<p class="klein">' + (l ? 'Rückfälle bleiben, wo sie sind.' : 'Schon früher aufgehört? Dann stell den Tag zurück.') +
      '</p></section>' +
    (l ? zeichneRueckfallListe(l) : '') +
    '<div class="knopfreihe">' +
      '<button type="button" class="knopf" id="gwSpeichern">' + (g || l ? 'Speichern' : 'Anlegen') + '</button>' +
      (g || l ? '<button type="button" class="knopf zart" id="gwArchivieren">Archivieren</button>' : '') +
    '</div>';
  return html;
}

function zeichneLasterStand(l) {
  var e = lasterAuswerten(l, zeitJetzt());
  function zeile(was, wert) {
    return '<div class="zeile"><span>' + was + '</span><span class="wert">' + wert + '</span></div>';
  }
  return '<section class="abschnitt"><h2>Stand</h2><div class="kachel">' +
    zeile('Frei seit', '<span class="ab-zahl" data-frei="' + esc(l.id) + '">' + esc(dauer(e.frei)) + '</span>') +
    zeile('Rekord', e.rekordLaeuft ? 'läuft gerade' : esc(dauer(e.rekord))) +
    zeile('Stärke', prozent(e.staerke) + ' %') +
    zeile('Dränge besiegt', e.draenge) +
    zeile('Rückfälle', e.rueckfaelle) +
    '</div></section>';
}

// «Mo, 5. Okt., 14:32»
function zeitpunktText(t) {
  var d = new Date(t);
  return WT_KURZ[d.getDay()] + ', ' + d.getDate() + '. ' + MON_KURZ[d.getMonth()] + ', ' +
    zwei(d.getHours()) + ':' + zwei(d.getMinutes());
}

// Die Rückfälle, neuester zuerst. Einer, der aus Versehen eingetragen wurde,
// geht mit zwei Tipps wieder weg.
function zeichneRueckfallListe(l) {
  var html = '<section class="abschnitt"><h2>Rückfälle</h2><div class="kachel rf-liste">';
  if (!l.rueckfaelle.length) return html + '<p class="klein rf-leer">Noch keiner.</p></div></section>';
  for (var i = l.rueckfaelle.length - 1; i >= 0; i--) {
    var r = l.rueckfaelle[i];
    html += '<div class="rf-zeile"><span class="rf-text"><span class="rf-wann">' + esc(zeitpunktText(r.zeit)) +
      '</span>' + (r.notiz ? '<span class="rf-notiz">' + esc(r.notiz) + '</span>' : '') + '</span>' +
      '<button type="button" class="rf-loeschen" data-rf-loeschen="' + i + '">Löschen</button></div>';
  }
  return html + '</div></section>';
}

// Erinnert wird nur über den Kalender-Export (ADR 0009). Wer x-mal pro Woche
// will, wählt die Tage selbst — der Kalender erinnert darum jeden Tag.
function erinnerungErklaerung(e) {
  if (!e.erinnern) return 'Der Kalender erinnert dich, sobald du eine Uhrzeit wählst und exportierst.';
  if (e.art === 'proWoche') return 'Jeden Tag zu dieser Zeit — welche Tage es werden, entscheidest du.';
  return 'An jedem fälligen Tag zu dieser Zeit. Erinnert wird über den Kalender-Export.';
}

function weiseErklaerung(w) {
  if (w === 'timer') return 'Ein Tipp startet den Timer; abgehakt ist sie, wenn er durch ist oder du «Fertig» tippst. ' +
    'Den Ton hörst du nur bei offener App.';
  if (w === 'zaehler') return 'Jeder Tipp zählt so viel dazu, ab dem ersten ist sie erledigt. Vertippt? «−» auf der Kachel.';
  return 'Ein Tipp hakt sie ab.';
}

function rhythmusErklaerung(art) {
  if (art === 'wochentage') return 'Nur an den Tagen, die du wählst.';
  if (art === 'proWoche') return 'An Tagen deiner Wahl. Gezählt wird die Woche, Montag bis Sonntag.';
  return 'Jeden Tag einmal.';
}

function bindeFormular() {
  var name = $('gwName');
  name.addEventListener('input', function () { entwurf.name = this.value; });
  name.addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });

  alleIn('[data-richtung]').forEach(function (b) {
    b.addEventListener('click', function () {
      entwurf.richtung = this.getAttribute('data-richtung');
      alleIn('[data-richtung]').forEach(function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      teilZeigen($('rhAbschnitt'), entwurf.richtung !== 'ab', b);
      teilZeigen($('gwWeise'), entwurf.richtung !== 'ab', b);
      teilZeigen($('gwBeginnAbschnitt'), entwurf.richtung !== 'ab', b);
      teilZeigen($('gwErinnerung'), entwurf.richtung !== 'ab', b);
      teilZeigen($('abStart'), entwurf.richtung === 'ab', b);
      wahlenSetzen();
      $('gwName').setAttribute('placeholder', BEISPIEL[entwurf.richtung]);
    });
  });
  alleIn('[data-art]').forEach(function (b) {
    b.addEventListener('click', function () {
      entwurf.art = this.getAttribute('data-art');
      alleIn('[data-art]').forEach(function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      teilZeigen($('rhTage'), entwurf.art === 'wochentage', b);
      teilZeigen($('rhAnzahl'), entwurf.art === 'proWoche', b);
      wahlenSetzen();
      $('rhText').textContent = rhythmusErklaerung(entwurf.art);
      $('gwErText').textContent = erinnerungErklaerung(entwurf);
    });
  });
  alleIn('[data-tag]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = +this.getAttribute('data-tag'), i = entwurf.tage.indexOf(t);
      if (i === -1) entwurf.tage.push(t); else entwurf.tage.splice(i, 1);
      this.setAttribute('aria-pressed', i === -1 ? 'true' : 'false');
    });
  });
  function anzahl(d) {
    entwurf.anzahl = Math.max(1, Math.min(PRO_WOCHE_MAX, entwurf.anzahl + d));
    $('anzWert').textContent = entwurf.anzahl + '× pro Woche';
  }
  $('gwErinnern').addEventListener('click', function () {
    entwurf.erinnern = !entwurf.erinnern;
    this.setAttribute('aria-checked', entwurf.erinnern ? 'true' : 'false');
    teilZeigen($('gwUhrTeil'), entwurf.erinnern, this);
    $('gwErText').textContent = erinnerungErklaerung(entwurf);
  });
  $('gwUhr').addEventListener('input', function () { entwurf.erinnerung = this.value; });
  alleIn('[data-weise]').forEach(function (b) {
    b.addEventListener('click', function () {
      entwurf.weise = this.getAttribute('data-weise');
      alleIn('[data-weise]').forEach(function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      teilZeigen($('gwTimerTeil'), entwurf.weise === 'timer', b);
      teilZeigen($('gwZaehlerTeil'), entwurf.weise === 'zaehler', b);
      wahlenSetzen();
      $('gwWeiseText').textContent = weiseErklaerung(entwurf.weise);
    });
  });
  $('gwMinuten').addEventListener('input', function () { entwurf.minuten = this.value; });
  $('gwSchritt').addEventListener('input', function () { entwurf.schritt = this.value; });
  $('gwEinheit').addEventListener('input', function () { entwurf.einheit = this.value; });
  $('gwTon').addEventListener('click', function () {
    entwurf.ton = !entwurf.ton;
    this.setAttribute('aria-checked', entwurf.ton ? 'true' : 'false');
  });
  $('anzWeniger').addEventListener('click', function () { anzahl(-1); });
  $('anzMehr').addEventListener('click', function () { anzahl(1); });

  $('gwBeginn').addEventListener('input', function () { entwurf.beginn = this.value; });
  $('abTag').addEventListener('input', function () { entwurf.startTag = this.value; entwurf.startGeaendert = true; });
  $('abUhr').addEventListener('input', function () { entwurf.startUhr = this.value; entwurf.startGeaendert = true; });
  alleIn('[data-rf-loeschen]').forEach(function (b) {
    b.addEventListener('click', rueckfallLoeschenTippen);
  });

  $('gwSpeichern').addEventListener('click', entwurfSpeichern);
  if ($('gwArchivieren')) $('gwArchivieren').addEventListener('click', archivierenTippen);
}

function entwurfSpeichern() {
  var name = entwurf.name.trim();
  if (!name) {
    melden('Gib ihr noch einen Namen.');
    $('gwName').focus();
    return;
  }
  if (entwurf.richtung === 'ab') { lasterSpeichern(name); return; }
  if (entwurf.art === 'wochentage' && !entwurf.tage.length) {
    melden('Wähle mindestens einen Tag.');
    return;
  }
  if (entwurf.erinnern && !istUhr(entwurf.erinnerung)) {
    melden('Wähle eine Uhrzeit für die Erinnerung.');
    $('gwUhr').focus();
    return;
  }
  var minuten = Number(entwurf.minuten);
  if (entwurf.weise === 'timer' && !(minuten === Math.floor(minuten) && minuten >= 1 && minuten <= TIMER_MAX)) {
    melden('Gib die Minuten an, von 1 bis ' + TIMER_MAX + '.');
    $('gwMinuten').focus();
    return;
  }
  var timer = entwurf.weise === 'timer' ? { minuten: minuten, stumm: !entwurf.ton } : null;
  // «0,3» wie «0.3»; höchstens zwei Stellen hinter dem Komma.
  var schritt = Number(String(entwurf.schritt).trim().replace(',', '.'));
  if (entwurf.weise === 'zaehler' && !(schritt > 0 && schritt <= SCHRITT_MAX && Math.abs(schritt * 100 - Math.round(schritt * 100)) < 1e-6)) {
    melden('Gib an, wie viel ein Tipp zählt — etwa 1 oder 0,3.');
    $('gwSchritt').focus();
    return;
  }
  var zaehler = entwurf.weise === 'zaehler' ? { schritt: Math.round(schritt * 100) / 100,
    einheit: String(entwurf.einheit).trim().slice(0, EINHEIT_MAX) } : null;
  var r = entwurf.art === 'wochentage' ? { art: 'wochentage', tage: entwurf.tage.slice() }
    : entwurf.art === 'proWoche' ? { art: 'proWoche', anzahl: entwurf.anzahl } : { art: 'taeglich' };
  var g = entwurf.id ? gewohnheitNach(entwurf.id) : null, uhr = entwurf.erinnern ? entwurf.erinnerung : null;
  var bisher = g ? g.angelegt : heuteSchluessel();
  if (!istSchluessel(entwurf.beginn) || entwurf.beginn > bisher) {
    melden(g ? 'Der Beginn kann nur früher liegen.' : 'Der Beginn liegt höchstens heute.');
    $('gwBeginn').focus();
    return;
  }
  if (g) {
    g.name = name.slice(0, NAME_MAX);
    g.rhythmus = rhythmusLesen(r);
    g.erinnerung = uhr;
    // Ohne Timer endet ein laufender; ohne Zähler bleiben nur die Haken.
    if (!timer && state.timer && state.timer.id === g.id) state.timer = null;
    if (entwurf.weise !== 'zaehler') g.zaehlung = {};
    g.timer = timer;
    g.zaehler = zaehler;
  } else {
    g = { id: neueId('g'), name: name.slice(0, NAME_MAX), rhythmus: rhythmusLesen(r),
      angelegt: bisher, erledigt: [], archiviert: null, erinnerung: uhr, imKalender: null,
      timer: timer, zaehler: zaehler, zaehlung: {} };
    state.gewohnheiten.push(g);
    g = null;
  }
  beginnVorziehen(g || state.gewohnheiten[state.gewohnheiten.length - 1], entwurf.beginn);
  var id = g ? g.id : state.gewohnheiten[state.gewohnheiten.length - 1].id;
  if (speichern()) {
    bestaetigenUndGehen(g ? 'Gespeichert' : 'Angelegt', g ? '' : entwurf.weise === 'timer' ? 'Antippen startet den Timer, lange drücken öffnet sie.'
      : entwurf.weise === 'zaehler' ? 'Antippen zählt eins, lange drücken öffnet sie.' : 'Antippen heißt erledigt, lange drücken öffnet sie.',
      '[data-haken="' + id + '"]' + SCHEIBE);
  }
  zeige('home');
}

// Tag und Uhrzeit aus den Feldern, als Zeitpunkt — oder null, wenn eins fehlt.
function startAusEntwurf() {
  if (!istSchluessel(entwurf.startTag) || !/^\d{2}:\d{2}$/.test(entwurf.startUhr)) return null;
  var d = ausSchluessel(entwurf.startTag), u = entwurf.startUhr.split(':');
  d.setHours(+u[0], +u[1], 0, 0);
  return d.getTime();
}

// Unberührte Felder lassen den Start, wie er ist: neu heißt «jetzt», auf die
// Sekunde, bestehend heißt der gespeicherte Zeitpunkt. Die Felder kennen nur
// Minuten — sonst verschöbe jedes Speichern den Start um ein paar Sekunden.
function lasterSpeichern(name) {
  var l = entwurf.id ? lasterNach(entwurf.id) : null, nun = zeitJetzt();
  var start = !entwurf.startGeaendert ? (l ? l.start : nun) : startAusEntwurf();
  if (!start) { melden('Gib an, seit wann du frei bist.'); return; }
  if (start > nun) { melden('Der Start liegt in der Zukunft.'); return; }
  if (l && l.rueckfaelle.length && start > l.rueckfaelle[0].zeit) {
    melden('Der Start liegt nach deinem ersten Rückfall.');
    return;
  }
  if (l) {
    l.name = name.slice(0, NAME_MAX);
    l.start = start;
  } else {
    state.abgewoehnen.push({ id: neueId('a'), name: name.slice(0, NAME_MAX), start: start, rueckfaelle: [],
      draenge: [], archiviert: null });
  }
  var id = l ? l.id : state.abgewoehnen[state.abgewoehnen.length - 1].id;
  if (speichern()) {
    bestaetigenUndGehen(l ? 'Gespeichert' : 'Angelegt', l ? '' : 'Kommt ein Drang, tipp auf «Drang».',
      '[data-ab="' + id + '"]' + SCHEIBE);
  }
  zeige('home');
}

// Archivieren fragt im Glas: Die Kachel verschwindet vom Dashboard. Ihre
// Einträge bleiben im Speicher. Eine laufende Welle endet mit ihr.
function archivierenTippen() {
  loeschenFragen(this, 'Archivieren?', 'Die Kachel verschwindet, deine Einträge bleiben.', 'Archivieren', archivieren);
}

function archivieren() {
  var g = entwurf.richtung === 'ab' ? lasterNach(entwurf.id) : gewohnheitNach(entwurf.id);
  if (g) g.archiviert = heuteSchluessel();
  if (state.welle && state.welle.id === entwurf.id) state.welle = null;
  if (state.timer && state.timer.id === entwurf.id) state.timer = null;
  if (speichern()) meldenUndGehen('Archiviert. Deine Einträge bleiben erhalten.', 'haken');
  zeige('home');
}

// Ein Rückfall geht erst nach der Frage im Glas weg.
function rueckfallLoeschenTippen() {
  var i = +this.getAttribute('data-rf-loeschen'), knopf = this;
  loeschenFragen(this, 'Rückfall löschen?', 'Er zählt dann nicht mehr.', 'Löschen', function () {
    var l = lasterNach(entwurf && entwurf.id);
    if (!l || !l.rueckfaelle[i]) return;
    l.rueckfaelle.splice(i, 1);
    var geht = document.contains(knopf) ? zeileGeht(knopf.closest('.rf-zeile'), '.rf-liste') : function () {};
    if (speichern()) melden('Gelöscht.', 'haken');
    render();
    geht();
  });
}

// ── Drang: die 10-Minuten-Welle ─────────────────────────────────
//
// Ein großer Ring, der in zehn Minuten abläuft, und ein Satz zum Aussitzen.
// «Nachgegeben» geht jederzeit und führt zum Rückfall, «Gewonnen» erst, wenn
// die Welle durch ist. Die Welle steht im Zustand: Sie läuft weiter, auch wenn
// die App zu ist, und wartet danach auf das Urteil.
var WELLE_SAETZE = [
  'Ein Drang ist wie eine Welle: Er steigt, bricht und flaut ab. Du mußt nur oben bleiben.',
  'Atme länger aus als ein. Der Drang wird nicht stärker, nur lauter.',
  'Du mußt jetzt nichts entscheiden. Nur diese paar Minuten abwarten.',
  'Trink ein Glas Wasser, geh ein paar Schritte. Die Welle zieht auch ohne dich vorbei.'
];

function zeichneWelle() {
  var w = state.welle, a = lasterNach(w.id), rest = welleRest(zeitJetzt()), durch = rest === 0;
  var u = 2 * Math.PI * 15.5;
  return '<section class="welle' + (durch ? ' durch' : '') + '" id="welle">' +
    '<div class="etikett">' + esc(a ? a.name : '') + '</div>' +
    '<div class="welle-bild">' +
      '<svg class="ring welle-ring" viewBox="0 0 36 36" aria-hidden="true">' +
        '<circle class="ring-spur" cx="18" cy="18" r="15.5"/>' +
        '<circle class="ring-fuell welle-fuell" id="welleFuell" cx="18" cy="18" r="15.5" stroke-dasharray="' +
          u.toFixed(2) + '" stroke-dashoffset="' + (u * (1 - rest / WELLE_MS)).toFixed(2) + '"/>' +
      '</svg>' +
      '<img id="chiliFigur"' + (chiliFlammt ? ' class="' + chiliFlammt + '"' : '') + ' src="' + CHILI_BILD + '" alt="">' +
    '</div>' +
    '<div class="welle-zeit" id="welleZeit" role="timer">' + esc(restText(rest)) + '</div>' +
    '<p class="welle-satz">' + esc(durch ? 'Die Welle ist durch. Wie ist es ausgegangen?'
      : WELLE_SAETZE[Math.floor(w.start / 1000) % WELLE_SAETZE.length]) + '</p>' +
    '<div class="knopfreihe">' +
      (durch ? '<div id="welleUrteil"><button type="button" class="knopf" id="welleGewonnen">Gewonnen</button></div>' : '') +
      '<button type="button" class="knopf zart" id="welleNachgegeben">Nachgegeben</button>' +
    '</div>' +
    (durch ? '' : '<p class="klein">Die Welle läuft weiter, auch wenn du die App schließt.</p>') +
    '<button type="button" class="welle-ab" id="welleAbbrechen">Abbrechen, zählt nicht</button>' +
    '</section>';
}

function bindeWelle() {
  if ($('welleGewonnen')) {
    $('welleGewonnen').addEventListener('click', function () {
      if (!welleGewonnen()) return;
      meldenUndGehen('Gewonnen. Die Welle ist durch.', 'haken');
      chiliFlammt = 'flammt';
      zeige('home');
      chiliFlammt = false;
    });
  }
  $('welleNachgegeben').addEventListener('click', function () {
    if (state.welle) zeige('rueckfall', state.welle.id);
  });
  $('welleAbbrechen').addEventListener('click', function () {
    if (!welleAbbrechen()) return;
    meldenUndGehen('Abgebrochen. Die Welle zählt nicht.');
    zeige('home');
  });
}

// ── Rückfall ────────────────────────────────────────────────────
//
// Eine eigene Ansicht statt eines Blatts: Ein festes Blatt mit einem Textfeld
// schiebt die Tastatur auf iOS aus dem Bild. Erst der Knopf trägt ein.
var rueckfallFuer = null;   // { id, notiz, ausWelle }

function zeichneRueckfall() {
  var a = lasterNach(rueckfallFuer.id), e = lasterAuswerten(a, zeitJetzt());
  return '<section class="abschnitt"><div class="kachel">' +
      '<div class="etikett">' + esc(a.name) + '</div>' +
      '<p class="rf-satz">Passiert. Dein Rekord von ' + esc(dauer(e.rekord)) +
        ' bleibt stehen — ab jetzt zählt es neu.</p>' +
    '</div></section>' +
    '<section class="abschnitt"><h2><label for="rfNotiz">Notiz</label></h2>' +
      '<textarea id="rfNotiz" class="eingabe notiz" rows="3" maxlength="' + NOTIZ_MAX + '" ' +
        'placeholder="Was war los? Freiwillig.">' + esc(rueckfallFuer.notiz) + '</textarea>' +
    '</section>' +
    '<div class="knopfreihe">' +
      '<button type="button" class="knopf" id="rfEintragen">Rückfall eintragen</button>' +
      '<button type="button" class="knopf zart" id="rfAbbrechen">' +
        (rueckfallFuer.ausWelle ? 'Zurück zur Welle' : 'Abbrechen') + '</button>' +
    '</div>';
}

function bindeRueckfall() {
  $('rfNotiz').addEventListener('input', function () { rueckfallFuer.notiz = this.value; });
  $('rfEintragen').addEventListener('click', function () {
    if (rueckfallEintragen(rueckfallFuer.id, rueckfallFuer.notiz)) meldenUndGehen('Eingetragen. Ab jetzt zählt es neu.', 'haken');
    zeige('home');
  });
  $('rfAbbrechen').addEventListener('click', function () {
    zeige(rueckfallFuer.ausWelle && state.welle ? 'welle' : 'home');
  });
}

// ── Journal: die Wochenreflexion ────────────────────────────────
//
// Sonntags fragt das Dashboard zwei Dinge: Was lief gut? Was hat gestört?
// Gespeichert wird eine Reflexion je Woche, unter ihrem Montag; im Journal
// stehen sie untereinander. Ein Tipp öffnet sie zum Lesen, «Bearbeiten» zum
// Ändern oder Löschen (ADR 0017, 0018). Geschrieben werden kann jede Woche bis
// zur laufenden, auch nachträglich — die Zukunft nicht.
// Wie beim Rückfall eine eigene Ansicht, kein Blatt: Die Tastatur schiebt ein
// festes Blatt auf iOS aus dem Bild.
var reflexionEntwurf = null;   // { woche, gut, stoerte, neu }

function reflexionNach(woche) {
  for (var i = 0; i < state.journal.length; i++) if (state.journal[i].woche === woche) return state.journal[i];
  return null;
}

function reflexionMoeglich(woche) {
  return istSchluessel(woche) && wochenAnfang(woche) === woche && woche <= wochenAnfang(heuteSchluessel());
}

function reflexionEntwurfAus(woche) {
  var r = reflexionNach(woche);
  return { woche: woche, gut: r ? r.gut : '', stoerte: r ? r.stoerte : '', neu: !r };
}

// Die jüngste Woche ohne Reflexion, von der laufenden zurück — dort beginnt,
// wer schreiben will. Die Grenze hält nur die Schleife endlich.
function offeneWoche() {
  var mo = wochenAnfang(heuteSchluessel());
  for (var i = 0; i < 520 && reflexionNach(mo); i++) mo = tagPlus(mo, -7);
  return mo;
}

function reflexionLoeschen(woche) {
  var vorher = state.journal.length;
  state.journal = state.journal.filter(function (x) { return x.woche !== woche; });
  return state.journal.length < vorher && speichern();
}

// Trägt ein, ändert oder entfernt — zwei leere Antworten sind keine Reflexion.
// Antwortet mit dem, was geschah: 'gespeichert', 'entfernt', 'nichts' oder
// false, wenn die Woche nicht in Frage kommt.
function reflexionSpeichern(woche, gut, stoerte) {
  if (!reflexionMoeglich(woche)) return false;
  var r = reflexionLesen({ woche: woche, gut: gut, stoerte: stoerte, zeit: zeitJetzt() });
  var alt = reflexionNach(woche);
  state.journal = state.journal.filter(function (x) { return x.woche !== woche; });
  if (r) {
    state.journal.push(r);
    state.journal.sort(function (x, y) { return x.woche < y.woche ? -1 : 1; });
  }
  speichern();
  return r ? 'gespeichert' : alt ? 'entfernt' : 'nichts';
}

function wochenTitel(mo) {
  return 'KW ' + kalenderwoche(mo) + ' · ' + spanne(mo, tagPlus(mo, 6));
}

// Die Woche in Zahlen, als Anstoß zum Nachdenken: Haken gesetzt von fälligen.
// Heute zählt erst, wenn es erledigt ist — wie bei der Stärke.
function wochenZahlen(mo, heute) {
  var von = 0, fertig = 0;
  for (var k = mo; k <= tagPlus(mo, 6) && k <= heute; k = tagPlus(k, 1)) {
    var t = tagesStand(k);
    fertig += t.fertig;
    von += k === heute ? t.fertig : t.von;
  }
  if (!von) return '';
  return (mo === wochenAnfang(heute) ? 'Diese Woche bisher: ' : 'In dieser Woche: ') +
    fertig + ' von ' + von + ' Haken gesetzt.';
}

// Die Kachel auf dem Dashboard, nur sonntags. Gebaut wie die der Gewohnheit;
// steht die Reflexion schon, trägt sie den Haken.
function zeichneReflexionKachel(heute) {
  var mo = wochenAnfang(heute), r = reflexionNach(mo);
  return '<section class="abschnitt"><h2>Journal</h2><div class="gw-liste">' +
    '<div class="gw-kachel jr-kachel' + (r ? ' erledigt' : '') + '">' +
      '<button type="button" class="gw-haken" ' + (r ? 'data-lesen' : 'data-reflexion') + '="' + esc(mo) + '">' +
        '<span class="gw-ring"><span class="gw-scheibe jr-scheibe">' + (r ? ICON.haken : ICON.journal) + '</span></span>' +
        '<span class="gw-text"><span class="gw-name">Wochenreflexion</span>' +
          '<span class="gw-info">' + (r ? 'Geschrieben · antippen zum Nachlesen' : 'Zwei Fragen zu deiner Woche') +
          '</span></span>' +
      '</button>' +
    '</div></div></section>';
}

// Oben steht immer ein Weg zum Schreiben: die laufende Woche, solange sie
// offen ist, sonst die jüngste, die fehlt — welche, läßt sich im Formular
// wählen (ADR 0018).
function zeichneJournal() {
  var heute = heuteSchluessel(), mo = wochenAnfang(heute), sonntag = ausSchluessel(heute).getDay() === 0;
  var liste = state.journal.slice().reverse(), offen = offeneWoche(), diese = offen === mo;
  return '<section class="abschnitt"><div class="kachel">' +
      '<div class="etikett">' + (diese ? 'Diese Woche' : 'Nachholen') + '</div>' +
      '<p class="jr-zahlen">' + esc(wochenTitel(offen)) + '</p>' +
      '<p class="jr-satz">' + (!diese ? 'Diese Woche steht schon. Hast du eine frühere vergessen? Die Woche wählst du beim Schreiben.'
        : sonntag ? 'Heute ist Sonntag — Zeit für zwei Fragen.'
        : 'Sonntags fragt dich das Dashboard. Du kannst auch jetzt schon schreiben.') + '</p>' +
      '<div class="knopfreihe"><button type="button" class="knopf' + (diese ? '' : ' zart') + '" data-reflexion="' +
        esc(offen) + '" id="jrNeu">' + ICON.journal + '<span>' + (diese ? 'Woche reflektieren' : 'Woche nachholen') +
        '</span></button></div>' +
    '</div></section>' +
    '<section class="abschnitt"><h2>Bisher</h2>' +
    (liste.length ? '<div class="jr-liste">' + liste.map(function (r) {
      return '<button type="button" class="jr-eintrag" data-lesen="' + esc(r.woche) + '">' +
        '<span class="jr-woche">' + esc(wochenTitel(r.woche)) + '</span>' +
        zeichneAntwort('Was lief gut?', r.gut) + zeichneAntwort('Was hat gestört?', r.stoerte) +
        '</button>';
    }).join('') + '</div>'
      : '<div class="kachel"><p class="jr-leer">Noch keine Reflexion. Deine erste steht dann hier.</p></div>') +
    '</section>';
}

function zeichneAntwort(frage, text) {
  return '<span class="jr-frage">' + esc(frage) + '</span>' +
    '<span class="jr-antwort' + (text ? '' : ' leer') + '">' + esc(text || 'Nichts notiert.') + '</span>';
}

// Lesen: die Woche, ihre Zahlen, beide Antworten — und «Bearbeiten».
function zeichneLesen() {

      '<div class="etikett">' + esc(wochenTitel(r.woche)) + '</div>' +

    '</div>' +

    '<div class="knopfreihe"><button type="button" class="knopf" data-reflexion="' + esc(r.woche) + '" id="jrBearbeiten">' +
      'Bearbeiten</button></div>';
}

// Schreiben: Eine neue Reflexion wählt ihre Woche mit den Pfeilen — zurück
// beliebig weit, vor bis zur laufenden. Die Wahl ändert das Formular an Ort
// und Stelle, sonst ginge die Tastatur zu (ADR 0018).
function zeichneReflexion() {

  return '<section class="abschnitt"><div class="kachel">' +

      '<div class="jr-vergeben" id="jrVergeben"' + (e.neu && reflexionNach(e.woche) ? '' : ' hidden') + '>' +

// Die Woche wechseln, ohne neu zu zeichnen. Was schon geschrieben ist, bleibt
// im Entwurf; steht für die neue Woche schon eine Reflexion, sperrt
// «Speichern» und «Ansehen» führt hin.
function reflexionWocheWaehlen(schritt) {
  var e = reflexionEntwurf, ziel = tagPlus(e.woche, 7 * schritt), jetzt = wochenAnfang(heuteSchluessel());
  if (!e.neu || ziel > jetzt) return;
  e.woche = ziel;
  var zahlen = wochenZahlen(ziel, heuteSchluessel()), vergeben = !!reflexionNach(ziel);
  $('jrWoche').textContent = wochenTitel(ziel);
  $('jrZahlen').textContent = zahlen;
  teilZeigen($('jrZahlen'), !!zahlen);
  teilZeigen($('jrVergeben'), vergeben);
  $('jrSpeichern').disabled = vergeben;
  $('jrSpaeter').disabled = ziel >= jetzt;
}

function bindeReflexion() {
  $('jrGut').addEventListener('input', function () { reflexionEntwurf.gut = this.value; });
  $('jrStoerte').addEventListener('input', function () { reflexionEntwurf.stoerte = this.value; });
  if ($('jrFrueher')) {
    $('jrFrueher').addEventListener('click', function () { reflexionWocheWaehlen(-1); });
    $('jrSpaeter').addEventListener('click', function () { reflexionWocheWaehlen(1); });
  }
  $('jrAnsehen').addEventListener('click', function () { zeige('lesen', reflexionEntwurf.woche); });
  $('jrSpeichern').addEventListener('click', function () {
    var e = reflexionEntwurf, was = reflexionSpeichern(e.woche, e.gut, e.stoerte);
    if (was === 'gespeichert') bestaetigenUndGehen('Gespeichert', 'Nachzulesen im Journal.', '[data-lesen="' + e.woche + '"]');
    else if (was === 'entfernt') bestaetigenUndGehen('Gelöscht', 'Die Reflexion ist entfernt.');
    else if (was === 'nichts') bestaetigenUndGehen('Nichts gespeichert', 'Du hast nichts geschrieben.', null, 'hinweis');
    // Eine Woche angesehen und aufgeschrieben: Geht es aufs Dashboard, flammt
    // die Chili — wie beim Haken.
    if (was === 'gespeichert' && !rueckZiel) chiliFlammt = 'flammt';
    zeige('home');
    chiliFlammt = false;
  });
  $('jrAbbrechen').addEventListener('click', function () { zeige('home'); });
  // Löschen fragt im Glas, wie beim Termin.
  if ($('jrLoeschen')) $('jrLoeschen').addEventListener('click', function () {
    var e = reflexionEntwurf;
    loeschenFragen(this, 'Löschen?', 'Die Reflexion dieser Woche ist danach weg.', 'Löschen', function () {
      if (reflexionLoeschen(e.woche)) bestaetigenUndGehen('Gelöscht', 'Die Reflexion ist entfernt.');
      zeige('journal');
    });
  });
}

// Was live läuft, jede Sekunde: «frei seit», die Restzeit auf dem Drang-Knopf
// und der Ring der Welle. Nur Text und Ring ändern sich — neu gezeichnet wird
// erst, wenn die Welle durch ist und das Urteil braucht, oder wenn «frei seit»
// eben den alten Rekord überholt hat.
function takt() {
  var nun = zeitJetzt(), rest = welleRest(nun);
  if (state.timer) {
    var tr = timerRest(nun);
    // Durch: Ton nur, wenn es eben geschah und die App zu sehen ist — wer sie
    // Stunden später öffnet, braucht keinen Gong mehr.
    if (tr === 0) { timerFertig(nun - state.timer.start - state.timer.ms < 5000 && !document.hidden); return; }
    timerAnzeigen(tr);
  }
  alleIn('[data-frei]').forEach(function (el) {
    var a = lasterNach(el.getAttribute('data-frei'));
    if (a) el.textContent = dauer(lasterAuswerten(a, nun).frei);
  });
  alleIn('[data-wellerest]').forEach(function (el) { el.textContent = welleKnopfText(rest); });
  if (ansicht === 'home' && rekordFaellig(nun).length) { render(); return; }
  var welle = ansicht === 'welle' && $('welle');
  if (!welle) return;
  if ((rest === 0) !== welle.classList.contains('durch')) {
    // Durch: Die Chili flammt, «Gewonnen» tropft herein, statt dazustehen.
    if (rest === 0) chiliFlammt = 'flammt';
    render();
    chiliFlammt = false;
    var urteil = $('welleUrteil');
    if (urteil && !bewegungAus()) { urteil.hidden = true; teilTropfen(urteil, true); }
    return;
  }
  $('welleZeit').textContent = restText(rest);
  var u = 2 * Math.PI * 15.5;
  $('welleFuell').setAttribute('stroke-dashoffset', (u * (1 - rest / WELLE_MS)).toFixed(2));
}

// ── Timer und Zähler ────────────────────────────────────────────
//
// Eine Gewohnheit wird entweder angetippt, mit einem Timer gemacht oder
// gezählt (ADR 0038). Der Timer merkt sich seinen Start und läuft darum weiter,
// auch wenn die App zu ist; abgehakt wird, wenn er durch ist oder «Fertig»
// kommt. Hörbar enden kann er nur bei offener App: Ohne Server darf eine
// Web-App auf iOS im Hintergrund weder klingen noch melden. Der Zähler hakt
// beim ersten Tipp ab und zählt danach weiter mit; «−» nimmt einen zurück.
var timerQuelle = null;   // die Gewohnheit, aus deren Kachel das Fenster tropfte
var tonKontext = null;

// Pausiert steht die Restzeit still: gerechnet wird bis zum Augenblick der Pause.
function timerRest(nun) {
  var t = state.timer;
  return t ? Math.max(0, t.start + t.ms - (t.pausiert || nun)) : 0;
}

// Pause und weiter (ADR 0040): Weiter schiebt den Start um die Pause nach hinten.
function timerPause() {
  var t = state.timer, nun = zeitJetzt();
  if (!t) return;
  if (t.pausiert) { t.start += nun - t.pausiert; t.pausiert = null; } else t.pausiert = nun;
  speichern();
  render();
  timerOeffnen(t.id);
}

function zaehlStand(g, k) {
  if (g.erledigt.indexOf(k) === -1) return 0;
  return g.zaehlung[k] !== undefined ? g.zaehlung[k] : g.zaehler ? g.zaehler.schritt : 1;
}

// Mengen auf Tausendstel: 0,1 + 0,2 soll 0,3 bleiben.
function menge(x) { return Math.round(x * 1000) / 1000; }
function zahlText(x) { return String(Math.round(x * 100) / 100).replace('.', ','); }
// «1,2 L», ohne Einheit in Einern «3×», sonst nur die Zahl.
function mengeText(g, x) {
  var z = g.zaehler;
  return zahlText(x) + (z.einheit ? ' ' + z.einheit : z.schritt === 1 ? '×' : '');
}

// Ein Schritt dazu (`richtung` 1) oder zurück (-1). Von null auf den ersten
// Schritt und zurück ist ein Haken — mit allem Jubel, der dazugehört.
function zaehlen(id, richtung) {
  var g = gewohnheitNach(id), k = heuteSchluessel();
  if (!g || !g.zaehler) return;
  var n = zaehlStand(g, k), neu = Math.min(ZAEHLER_MAX, menge(n + richtung * g.zaehler.schritt));
  if (neu < g.zaehler.schritt / 2) neu = 0;
  if (neu === n) return;
  geradeAbgehakt = neu ? id : null;
  if (!n) { g.zaehlung[k] = neu; umschaltenUndZeichnen(id, k); }
  else if (!neu) umschaltenUndZeichnen(id, k);
  else {
    g.zaehlung[k] = neu;
    speichern();
    render();
  }
  geradeAbgehakt = null;
}

// Der Klang braucht einen Tipp, bevor er darf (iOS): Beim Start des Timers
// wird er geweckt.
function tonBereit() {
  try {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!tonKontext && A) tonKontext = new A();
    if (tonKontext && tonKontext.state === 'suspended') tonKontext.resume();
  } catch (e) { tonKontext = null; }
}

// Ein sanfter Gong, in der App erzeugt: drei Teiltöne, die weich einsetzen und
// langsam verklingen.
function gong() {
  if (!tonKontext) return;
  try {
    var c = tonKontext, t = c.currentTime;
    [[392, 0.32], [784, 0.12], [1176, 0.05]].forEach(function (teil) {
      var o = c.createOscillator(), v = c.createGain();
      o.type = 'sine';
      o.frequency.value = teil[0];
      v.gain.setValueAtTime(0.0001, t);
      v.gain.exponentialRampToValueAtTime(teil[1], t + 0.03);
      v.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
      o.connect(v);
      v.connect(c.destination);
      o.start(t);
      o.stop(t + 3.3);
    });
  } catch (e) { /* dann eben still */ }
}

function kachelVon(id) { return document.querySelector('[data-haken="' + id + '"]'); }
// Jedes Glas, das an einer Gewohnheit hängt, beginnt und endet in ihrer runden
// Scheibe — nicht in der ganzen Kachel: Der Tropfen nimmt die Größe seiner
// Quelle, und eine Kachel ist schon fast so breit wie das Fenster (ADR 0040).
var SCHEIBE = ' .gw-scheibe';
function scheibeVon(el) { return el && el.querySelector('.gw-scheibe, .kal-haken') || el; }

// Ein Tipp auf die Kachel: Läuft schon ein anderer Timer, fragt das Glas;
// läuft dieser, tropft sein Fenster wieder auf.
function timerStarten(id) {
  var g = gewohnheitNach(id), k = kachelVon(id);
  if (!g || !g.timer) return;
  tonBereit();
  if (state.timer && state.timer.id !== id) {
    var alt = gewohnheitNach(state.timer.id);
    hinweisZeigen('Es läuft schon ein Timer', '«' + (alt ? alt.name : '') + '» ist noch nicht durch.',
      k ? scheibeVon(k).getBoundingClientRect() : null, '[data-haken="' + id + '"]' + SCHEIBE,
      { frage: { ja: 'Abbrechen, diesen starten', nein: 'Weiterlaufen lassen', beiJa: function () { state.timer = null; timerStarten(id); } } });
    return;
  }
  if (!state.timer) {
    state.timer = { id: id, tag: heuteSchluessel(), start: zeitJetzt(), ms: g.timer.minuten * 60000,
      stumm: g.timer.stumm, pausiert: null };
    speichern();
    render();
  }
  timerOeffnen(id);
}

function timerRing(anteil, id) {
  var u = 2 * Math.PI * 15.5;
  return '<svg class="ring" viewBox="0 0 36 36" aria-hidden="true">' +
    '<circle class="ring-spur" cx="18" cy="18" r="15.5"/>' +
    '<circle class="ring-fuell"' + (id ? ' id="' + id + '"' : '') + ' cx="18" cy="18" r="15.5" stroke-dasharray="' +
      u.toFixed(2) + '" stroke-dashoffset="' + (u * (1 - anteil)).toFixed(2) + '"/></svg>';
}

function zeichneTimerKarte(g, t) {
  var rest = timerRest(zeitJetzt());
  return '<h2 id="timerName">' + esc(g.name) + '</h2>' +
    '<button type="button" class="rund timer-ton" id="timerTon" aria-label="Ton am Ende" aria-pressed="' +
      (t.stumm ? 'false' : 'true') + '">' + (t.stumm ? ICON.stumm : ICON.ton) + '</button>' +
    '<div class="timer-bild">' + timerRing(rest / t.ms, 'timerFuell') +
      '<div class="timer-mitte"><div class="timer-zeit" role="timer" data-timerrest>' + esc(restText(rest)) + '</div>' +
      '<button type="button" class="rund timer-pause" id="timerPause" aria-label="' +
        (t.pausiert ? 'Weiter' : 'Pause') + '">' + (t.pausiert ? ICON.spielen : ICON.pause) + '</button></div></div>' +
    '<p class="klein">' + (t.pausiert ? 'Pausiert.' : 'Läuft weiter, auch wenn du das Fenster schließt.') + '</p>' +
    '<div class="hinweis-knoepfe">' +
      '<button type="button" class="knopf zart" id="timerAbbrechen">Abbrechen</button>' +
      '<button type="button" class="knopf" id="timerFertig">Fertig</button>' +
    '</div>';
}

function bindeTimerKarte() {
  $('timerTon').addEventListener('click', function () {
    var t = state.timer;
    if (!t) return;
    tonBereit();
    t.stumm = !t.stumm;
    speichern();
    this.setAttribute('aria-pressed', t.stumm ? 'false' : 'true');
    this.innerHTML = t.stumm ? ICON.stumm : ICON.ton;
  });
  $('timerFertig').addEventListener('click', function () { timerFertig(false); });
  $('timerPause').addEventListener('click', timerPause);
  // Abbrechen fragt im Glas: Ein halber Lauf geht sonst mit einer Handbewegung verloren.
  $('timerAbbrechen').addEventListener('click', function () {
    loeschenFragen(this, 'Timer abbrechen?', 'Die Zeit bis hier zählt nicht.', 'Ja', function () {
      state.timer = null;
      speichern();
      timerSchliessen();
      render();
    });
  });
}

function timerOffen() { return !$('timerBlatt').hidden && $('timerBlatt').classList.contains('offen'); }

function timerOeffnen(id) {
  var blatt = $('timerBlatt'), karte = $('timerKarte'), t = state.timer, g = t && gewohnheitNach(t.id);
  if (!g) return;
  timerQuelle = id;
  karte.classList.toggle('pausiert', !!t.pausiert);
  karte.innerHTML = zeichneTimerKarte(g, t);
  bindeTimerKarte();
  if (timerOffen()) return;
  blatt.hidden = false;
  void blatt.offsetWidth;
  blatt.classList.add('offen');
  var k = scheibeVon(kachelVon(id));
  if (zuSehen(k)) tropfenAuf(karte, k.getBoundingClientRect(), { rund: '18px', glas: true });
}

// Zu: in die Kachel zurück. Der Timer läuft weiter, wenn er noch läuft.
function timerSchliessen() {
  var blatt = $('timerBlatt'), karte = $('timerKarte');
  if (!timerOffen()) return;
  blatt.classList.remove('offen');
  var ziel = scheibeVon(kachelVon(timerQuelle)), g = zuSehen(ziel) ? geist(karte) : null;
  if (!g) { blatt.hidden = true; return; }
  var r = karte.getBoundingClientRect();
  karte.style.opacity = '0';
  tropfenZu(g, r, ziel, { rund: '18px', frueh: true, glas: true, fertig: function () {
    karte.style.opacity = '';
    if (!timerOffen()) blatt.hidden = true;
  } });
}

// Durch oder «Fertig»: abgehakt für den Tag, an dem er begann.
function timerFertig(ton) {
  var t = state.timer;
  if (!t) return;
  state.timer = null;
  speichern();
  if (ton && !t.stumm) gong();
  timerSchliessen();
  if (!erledigtAm(t.id, t.tag)) {
    geradeAbgehakt = t.id;
    umschaltenUndZeichnen(t.id, t.tag);
    geradeAbgehakt = null;
  } else render();
}

function timerAnzeigen(rest) {
  var t = state.timer, u = 2 * Math.PI * 15.5, versatz = (u * (1 - rest / t.ms)).toFixed(2);
  alleIn('[data-timerrest]').forEach(function (el) { el.textContent = restText(rest); });
  alleIn('#timerFuell, [data-timerkachel] .ring-fuell').forEach(function (el) {
    el.setAttribute('stroke-dashoffset', versatz);
  });
}

// ── Termin: neu und bearbeiten ──────────────────────────────────
//
// Wie bei der Gewohnheit steht alles Getippte im Entwurf und das Formular
// zeichnet sich beim Wählen nicht neu. Gespeichert wird mit dem Knopf; danach
// zeigt der Kalender den Tag des Termins.
var terminEntwurf = null;

var WDH_WAHL = [['keine', 'Einmal'], ['taeglich', 'Täglich'], ['woechentlich', 'Wöchentlich'],
  ['monatlich', 'Monatlich']];
var VORLAUF_TEXT = {
  '0': 'Zur Zeit des Termins', '5': '5 Minuten vorher', '15': '15 Minuten vorher',
  '30': '30 Minuten vorher', '60': '1 Stunde vorher', '120': '2 Stunden vorher', '1440': '1 Tag vorher',
  '-540': 'Am Tag um 9 Uhr', '900': '1 Tag vorher um 9 Uhr', '2340': '2 Tage vorher um 9 Uhr',
  '9540': '1 Woche vorher um 9 Uhr'
};

// Ein neuer Termin beginnt zur nächsten vollen Stunde und erinnert eine
// Viertelstunde vorher — beides ist mit einem Tipp geändert.
function terminEntwurfAus(t, tag) {
  if (t) {
    return { id: t.id, titel: t.titel, tag: t.tag, ganztags: t.ganztags, von: t.von || '09:00',
      bis: t.bis || '', wiederholung: t.wiederholung, wiederholungBis: t.wiederholungBis || '',
      vorlauf: t.vorlauf, ort: t.ort, notiz: t.notiz };
  }
  return { id: null, titel: '', tag: tag || heuteSchluessel(), ganztags: false,
    von: zwei(Math.min(jetzt().getHours() + 1, 23)) + ':00', bis: '', wiederholung: 'keine',
    wiederholungBis: '', vorlauf: 15, ort: '', notiz: '' };
}

function vorlaufOptionen(e) {
  return [null].concat(e.ganztags ? VORLAUF_GANZ : VORLAUF_ZEIT).map(function (v) {
    return '<option value="' + (v === null ? '' : v) + '"' + (v === e.vorlauf ? ' selected' : '') + '>' +
      esc(v === null ? 'Keine Erinnerung' : VORLAUF_TEXT[v]) + '</option>';
  }).join('');
}

function wiederholungErklaerung(e) {
  if (!istSchluessel(e.tag)) return '';
  var d = ausSchluessel(e.tag);
  if (e.wiederholung === 'taeglich') return 'Jeden Tag.';
  if (e.wiederholung === 'woechentlich') return 'Jeden ' + WOCHENTAGE[d.getDay()] + '.';
  if (e.wiederholung === 'monatlich') {
    return 'Jeden Monat am ' + d.getDate() + '.' +
      (d.getDate() > 28 ? ' In Monaten ohne diesen Tag fällt er aus.' : '');
  }
  return 'Nur an diesem Tag.';
}

function zeichneTerminFormular() {
  var e = terminEntwurf, wdh = e.wiederholung !== 'keine';
  return '<section class="abschnitt"><h2><label for="tmTitel">Titel</label></h2>' +
      '<input id="tmTitel" class="eingabe" type="text" maxlength="' + TITEL_MAX + '" autocomplete="off" ' +
        'enterkeyhint="done" placeholder="Zum Beispiel: Zahnarzt" value="' + esc(e.titel) + '">' +
    '</section>' +
    '<section class="abschnitt"><h2><label for="tmTag">Wann</label></h2>' +
      '<input id="tmTag" class="eingabe" type="date" value="' + esc(e.tag) + '">' +
      '<div class="tm-schalterzeile"><span id="tmGanzName">Ganztägig</span>' +
        '<button type="button" class="schalter" id="tmGanz" role="switch" aria-labelledby="tmGanzName" ' +
          'aria-checked="' + (e.ganztags ? 'true' : 'false') + '"><span class="schalter-spur">' +
          '<span class="schalter-knauf"></span></span></button></div>' +
      '<div class="start-felder tm-zeiten" id="tmZeiten"' + (e.ganztags ? ' hidden' : '') + '>' +
        '<input id="tmVon" class="eingabe" type="time" aria-label="Beginn" value="' + esc(e.von) + '">' +
        '<span class="tm-strich" aria-hidden="true">bis</span>' +
        '<input id="tmBis" class="eingabe" type="time" aria-label="Ende" value="' + esc(e.bis) + '">' +
      '</div>' +
      '<p class="klein" id="tmZeitText"' + (e.ganztags ? ' hidden' : '') + '>Das Ende darfst du frei lassen.</p>' +
    '</section>' +
    '<section class="abschnitt"><h2>Wiederholung</h2>' +

function bindeTerminFormular() {
  var e = terminEntwurf;
  function feld(id, schluessel) {

  }
  feld('tmTitel', 'titel');
  feld('tmVon', 'von');

  feld('tmWdhBis', 'wiederholungBis');
  feld('tmOrt', 'ort');
  feld('tmNotiz', 'notiz');

  $('tmGanz').addEventListener('click', function () {

    this.setAttribute('aria-checked', e.ganztags ? 'true' : 'false');

  alleIn('[data-wdh]').forEach(function (b) {
