// Was nicht stimmt, sagt eine Meldung; gespeichert wird erst, wenn alles paßt.
function terminFehler(e) {
  if (!e.titel.trim()) return ['Gib dem Termin noch einen Titel.', 'tmTitel'];
  if (!istSchluessel(e.tag)) return ['Wähle einen Tag.', 'tmTag'];
  if (!e.ganztags && !istUhr(e.von)) return ['Gib an, wann er beginnt.', 'tmVon'];
  if (!e.ganztags && e.bis && (!istUhr(e.bis) || e.bis <= e.von)) return ['Das Ende liegt vor dem Beginn.', 'tmBis'];
  if (e.wiederholung !== 'keine' && e.wiederholungBis &&
    (!istSchluessel(e.wiederholungBis) || e.wiederholungBis < e.tag)) {
    return ['Die Reihe endet vor ihrem ersten Termin.', 'tmWdhBis'];
  }
  return null;
}

function terminSpeichern() {
  var e = terminEntwurf, fehler = terminFehler(e);
  if (fehler) {
    melden(fehler[0]);
    if ($(fehler[1])) $(fehler[1]).focus();
    return;
  }
  var t = terminLesen({ id: e.id || neueId('t'), titel: e.titel, tag: e.tag, ganztags: e.ganztags,
    von: e.ganztags ? null : e.von, bis: e.ganztags ? null : e.bis, wiederholung: e.wiederholung,
    wiederholungBis: e.wiederholungBis, vorlauf: e.vorlauf, ort: e.ort, notiz: e.notiz,
    imKalender: e.id && terminNach(e.id) ? terminNach(e.id).imKalender : null });
  var alt = e.id ? terminNach(e.id) : null;
  if (alt) t.erledigt = alt.erledigt.filter(function (k) { return terminAm(t, k); });
  if (alt) state.termine[state.termine.indexOf(alt)] = t;
  else state.termine.push(t);
  if (speichern()) bestaetigenUndGehen(alt ? 'Gespeichert' : 'Angelegt', alt ? '' : 'Für ' + tagKurz(t.tag),
    '[data-termin="' + t.id + '"]');
  kalZeige(t.tag);
  zeige('home');
}

// Ein Termin abgehakt oder zurück — für den einen Tag, nie für die ganze Reihe.
// Kein Jubel: Ein Termin ist keine Gewohnheit, er zählt nicht zur Stärke.
function terminAbhaken(id, k) {
  var t = terminNach(id);
  if (!t || !istSchluessel(k) || k > heuteSchluessel()) return;
  var i = t.erledigt.indexOf(k);
  if (i === -1) { t.erledigt.push(k); t.erledigt.sort(); } else t.erledigt.splice(i, 1);
  speichern();
  geradeAbgehakt = i === -1 ? 't:' + id : null;
  render();
  geradeAbgehakt = null;
}

// Löschen fragt im Glas. Eine Reihe geht als Ganzes — die Frage sagt es.
function terminLoeschenTippen() {
  var e = terminEntwurf, reihe = e.wiederholung !== 'keine';
  loeschenFragen(this, reihe ? 'Ganze Reihe löschen?' : 'Löschen?',
    reihe ? 'Alle Termine dieser Reihe sind danach weg.' : '«' + e.titel + '» ist danach weg.', 'Löschen', function () {
      var t = terminNach(e.id);
      if (t) state.termine.splice(state.termine.indexOf(t), 1);
      if (speichern()) meldenUndGehen('Gelöscht.', 'haken');
      zeige('home');
    });
}

// ── Kalender-Export ─────────────────────────────────────────────
//
// Zeigt, was hinausgeht, und lädt es als Datei — Teilen kam am Gerät nicht im
// Kalender an und ist gegangen (ADR 0013). Was schon im Kalender steht, ist abgedunkelt und geht
// nicht noch einmal mit — außer es wird unter «Bearbeiten» dazugeholt. Neues
// geht immer mit (ADR 0011). Eine Gewohnheit ohne Erinnerung steht mit da und
// führt mit einem Tipp dorthin, wo man ihr eine Uhrzeit gibt.
function exStatusText(status, e, gewaehlt) {
  if (status === 'neu') return gewaehlt ? (exBearbeiten ? 'neu, geht mit' : '') : 'neu, bleibt draußen';
  if (exBearbeiten && gewaehlt) return 'geht noch einmal mit';
  if (status === 'geaendert') return 'geändert seit dem Export';
  return 'im Kalender seit ' + tagKurz(tagSchluessel(new Date(e.imKalender.am)));
}

// Der Kopf eines Abschnitts; unter «Bearbeiten» mit dem Schalter «alle»: an,
// solange etwas daraus mitgeht (ADR 0034).
function exKopf(art, titel, liste) {
  if (!exBearbeiten) return '<h2>' + titel + '</h2>';
  var an = liste.some(function (e) { return exMit(art, e); });
  return '<div class="ex-kopf"><h2 id="exKopf' + art + '">' + titel + '</h2><span class="ex-alle-text">alle</span>' +
    '<button type="button" class="schalter" data-exalle="' + art + '" role="switch" aria-labelledby="exKopf' + art + '" ' +
      'aria-checked="' + (an ? 'true' : 'false') + '"><span class="schalter-spur"><span class="schalter-knauf"></span></span>' +
    '</button></div>';
}

function zeichneExZeile(art, e, zeit, ganz, mehr) {
  var status = exStatus(art, e), schluessel = art + ':' + e.id, gewaehlt = exMit(art, e);
  var notiz = exStatusText(status, e, gewaehlt);
  var unter = [mehr, notiz].filter(function (x) { return !!x; }).join(' · ');
  var klassen = 'tm-zeile ex-zeile' + (art === 'g' ? ' ex-gw' : '') + (gewaehlt ? '' : ' ex-alt') +
    (status === 'geaendert' ? ' ex-geaendert' : '') + (exBearbeiten ? ' ex-wahl' : '');
  var ziel = !exBearbeiten ? (art === 't' ? ' data-termin="' : ' data-exgw="') + esc(e.id) + '"'
    : ' data-exwahl="' + esc(schluessel) + '" aria-pressed="' + (gewaehlt ? 'true' : 'false') + '"';
  return '<button type="button" class="' + klassen + '"' + ziel + ' aria-label="' +
      esc((art === 't' ? e.titel : e.name) + ', ' + zeit + (unter ? ', ' + unter : '')) + '">' +
    '<span class="tm-zeit' + (ganz ? ' ganz' : '') + '">' + esc(zeit) + '</span>' +
    '<span class="tm-text"><span class="tm-titel">' + esc(art === 't' ? e.titel : e.name) + '</span>' +
      (unter ? '<span class="tm-mehr">' + esc(unter) + '</span>' : '') + '</span>' +
    (exBearbeiten ? '<span class="ex-haken' + (gewaehlt ? ' an' : '') + '" aria-hidden="true">' +
      (gewaehlt ? ICON.haken : '') + '</span>' : '') +
  '</button>';
}

function zeichneExport() {
  var heute = heuteSchluessel(), termine = exportTermine(heute);
  var gewohnheiten = state.gewohnheiten.filter(function (g) { return !g.archiviert; });
  var mitUhr = exportGewohnheiten(), mit = mitUhr.length, html = '';
  var draussen = termine.filter(function (t) { return !!t.imKalender; }).length +
    mitUhr.filter(function (g) { return !!g.imKalender; }).length;
  var ohne = termine.filter(function (t) { return exStatus('t', t) === 'neu' && !exMit('t', t); }).length +
    mitUhr.filter(function (g) { return exStatus('g', g) === 'neu' && !exMit('g', g); }).length;
  var wahl = termine.length + mitUhr.length;
  if (!wahl) exBearbeiten = false;
  if (wahl) {
    var satz = [draussen ? draussen + (draussen === 1 ? ' Eintrag steht' : ' Einträge stehen') + ' schon im Kalender' : '',
      ohne ? ohne + (ohne === 1 ? ' bleibt' : ' bleiben') + ' draußen' : ''].filter(function (x) { return !!x; }).join(', ');
    html += '<div class="ex-leiste"><span>' + esc(exBearbeiten ? 'Tipp an, was mit soll.'
        : satz ? satz + '.' : 'Alles Neue geht mit.') + '</span>' +
      '<button type="button" class="ex-bearbeiten" id="exBearbeiten" aria-pressed="' + (exBearbeiten ? 'true' : 'false') +
        '">' + (exBearbeiten ? 'Fertig' : 'Bearbeiten') + '</button></div>';
  }
  if (termine.length) {
    html += '<section class="abschnitt">' + exKopf('t', 'Termine', termine) + '<div class="tm-liste">' +
      termine.map(function (t) {
        return zeichneExZeile('t', t, t.ganztags ? 'ganztägig' : t.von + (t.bis ? '–' + t.bis : ''), t.ganztags,
          [t.ort, wiederholungText(t)].filter(function (x) { return !!x; }).join(' · '));
      }).join('') + '</div></section>';
  }
  if (gewohnheiten.length) {
    html += '<section class="abschnitt">' + exKopf('g', 'Gewohnheiten', mitUhr) + '<div class="tm-liste">' +
      gewohnheiten.map(function (g) {
        if (g.erinnerung) return zeichneExZeile('g', g, g.erinnerung, false, rhythmusText(g.rhythmus));
        var text = 'ohne Erinnerung, bleibt draußen';
        return '<button type="button" class="tm-zeile ex-gw aus"' + (exBearbeiten ? ' aria-disabled="true"'
            : ' data-exgw="' + esc(g.id) + '"') + ' aria-label="' + esc(g.name + ', ' + text) + '">' +
          '<span class="tm-zeit">' + ICON.minus + '</span>' +
          '<span class="tm-text"><span class="tm-titel">' + esc(g.name) + '</span>' +
            '<span class="tm-mehr">' + esc(text) + '</span></span>' +
        '</button>';
      }).join('') + '</div>' +
      (mit < gewohnheiten.length && !exBearbeiten ? '<p class="klein">Tipp eine an, um ihr eine Uhrzeit zu geben.</p>' : '') +
      '</section>';
  }
  // Leer: Der Satz sagt, was fehlt, die Knöpfe führen hin — und nach dem
  // Speichern hierher zurück (`rueckZiel`).
  if (!termine.length && !mit) {
    return html + '<section class="abschnitt"><p class="hinweis" id="exLeer">' + ICON.hinweis + '<span>Noch ' +
      'nichts für den Kalender. ' + (gewohnheiten.length ? 'Leg einen Termin an oder gib einer Gewohnheit oben eine Erinnerung.'
        : 'Leg einen Termin an oder eine Gewohnheit mit Erinnerung.') + '</span></p>' +
      '<div class="knopfreihe ex-leer-wege"><button type="button" class="knopf zart" id="exTerminNeu">' + ICON.termin +
        '<span>Neuer Termin</span></button>' +
      (gewohnheiten.length ? '' : '<button type="button" class="knopf zart" id="exGewohnheitNeu">' + ICON.plus +
        '<span>Neue Gewohnheit</span></button>') +
      '</div></section>';
  }
  var auswahl = exportAuswahl(heute);
  var zahl = auswahl.termine.length + auswahl.gewohnheiten.length;
  // Aufheben nur, wenn allein Dazugeholtes gewählt ist — Neues hat keine Marke.
  var aufheben = exBearbeiten && zahl > 0 && auswahl.termine.concat(auswahl.gewohnheiten).every(function (e) {
    return !!e.imKalender;
  });
  // Die Wege und der Satz stehen immer da, nur verborgen: So tropfen sie auf
  // und zu, statt zu schnappen (exTeileNachziehen).
  return html + '<section class="abschnitt"><h2>Exportieren</h2><div class="kachel">' +
      '<div class="zeile"><span>Einträge</span><span class="wert" id="exZahl">' + zahl + '</span></div>' +
      '<div class="zeile"><span>Zuletzt</span><span class="wert" id="exZuletzt">' +
        esc(state.exportiert ? zeitpunktText(state.exportiert) : 'noch nie') + '</span></div>' +
      '<div class="ex-wege" id="exWege"' + (zahl ? '' : ' hidden') + '><div class="knopfreihe">' +
        '<button type="button" class="knopf" id="exLaden">Als Datei laden</button>' +
      '</div><div class="ex-aufheben" id="exAufhebenTeil"' + (aufheben ? '' : ' hidden') + '>' +
        '<button type="button" class="knopf zart" id="exAufheben">Markierung aufheben</button></div></div>' +
      '<p class="klein" id="exNichts"' + (zahl ? ' hidden' : '') + '>' + (ohne ? 'Nichts ist gewählt. Unter «Bearbeiten» ' +
        'wählst du, was mitgeht.' : 'Alles steht schon im Kalender. Unter «Bearbeiten» holst du etwas noch einmal dazu.') + '</p>' +
    '</div>' +
    '<p class="klein">Hinaus geht, was neu ist — außer du wählst es unter «Bearbeiten» ab. Was schon im Kalender steht, ' +
      'ist abgedunkelt. Änderst du etwas ' +
      'davon, löschst du es im Kalender von Hand und holst es unter «Bearbeiten» noch einmal dazu. ' +
      'Vergangene Termine bleiben draußen.</p>' +
    '</section>';
}

// Kleine Teile — Häkchen, Schalter — tropfen als Perlen aus einem Knopf: Sie
// beginnen klein auf ihm und rollen an ihren Platz, eins nach dem andern.
// Zurück fließen ihre Geister in den Knopf (ADR 0032).
function perlenAus(els, knopf) {
  if (!zuSehen(knopf) || bewegungAus()) return;
  var k = knopf.getBoundingClientRect(), kx = k.left + k.width / 2, ky = k.top + k.height / 2;
  els.forEach(function (el, i) {
    var r = el.getBoundingClientRect();
    var bahn = 'translate(' + px(kx - (r.left + r.width / 2)) + ', ' + px(ky - (r.top + r.height / 2)) + ') scale(.3)';
    bewegt(el, [{ transform: bahn, opacity: 0 }, { transform: bahn, opacity: 1, offset: 0.1 }, { transform: 'none', opacity: 1 }],
      { dauer: TROPFEN_DAUER + 120, warten: Math.min(i, 8) * 45, kurve: TROPFEN_KURVE, fill: 'backwards' });
  });
}

function exPerlen() {
  if (bewegungAus()) return null;
  return alleIn('#ansicht .ex-haken, #ansicht [data-exalle]').map(function (el) {
    return { geist: geist(el), rect: el.getBoundingClientRect() };
  }).filter(function (p) { return !!p.geist; });
}

function perlenZu(perlen, knopf) {
  if (!perlen || !zuSehen(knopf)) return;
  var k = knopf.getBoundingClientRect(), kx = k.left + k.width / 2, ky = k.top + k.height / 2;
  perlen.forEach(function (p, i) {
    var g = p.geist, r = p.rect;
    g.style.cssText = 'position: fixed; margin: 0; z-index: 25; left: ' + px(r.left) + '; top: ' + px(r.top) + '; width: ' +
      px(r.width) + '; height: ' + px(r.height) + ';';
    document.body.appendChild(g);
    var bahn = 'translate(' + px(kx - (r.left + r.width / 2)) + ', ' + px(ky - (r.top + r.height / 2)) + ') scale(.3)';
    bewegt(g, [{ transform: 'none', opacity: 1 }, { transform: bahn, opacity: 1, offset: 0.88 }, { transform: bahn, opacity: 0 }],
      { dauer: TROPFEN_DAUER, warten: Math.min(i, 8) * 30, kurve: TROPFEN_KURVE, fill: 'both' }, function () { weg(g); });
  });
}

// Nach jedem Zeichnen der Exportansicht: Was in der Kachel auf- oder zuging,
// steht für einen Augenblick wieder wie zuvor und tropft dann in den neuen
// Stand. Ein Teil in einem anderen, das selbst geht, geht mit ihm.
var exTeileZuvor = null;   // { wege, auf, nichts } → offen?

function exTeileNachziehen() {
  var wege = $('exWege'), auf = $('exAufhebenTeil'), nichts = $('exNichts');
  var jetzt = wege ? { wege: !wege.hidden, auf: !auf.hidden, nichts: !nichts.hidden } : null;
  var zuvor = exTeileZuvor;
  exTeileZuvor = jetzt;
  if (!zuvor || !jetzt) return;
  if (zuvor.wege !== jetzt.wege) {
    wege.hidden = !zuvor.wege;
    auf.hidden = !(jetzt.wege ? jetzt.auf : zuvor.auf);
    teilTropfen(wege, jetzt.wege);
    auf.hidden = !jetzt.auf;
  } else if (zuvor.auf !== jetzt.auf) {
    auf.hidden = !zuvor.auf;
    teilTropfen(auf, jetzt.auf);
  }
  if (zuvor.nichts !== jetzt.nichts) {
    nichts.hidden = !zuvor.nichts;
    teilTropfen(nichts, jetzt.nichts);
  }
}

function bindeExport() {
  exTeileNachziehen();
  if ($('exLaden')) $('exLaden').addEventListener('click', icsLaden);
  if ($('exTerminNeu')) $('exTerminNeu').addEventListener('click', function () { zeige('terminNeu'); });
  if ($('exGewohnheitNeu')) $('exGewohnheitNeu').addEventListener('click', function () { zeige('neu'); });
  if ($('exAufheben')) $('exAufheben').addEventListener('click', exAufheben);
  // Häkchen und Schalter tropfen aus «Bearbeiten» und mit «Fertig» zurück
  // hinein (ADR 0032, 0034).
  if ($('exBearbeiten')) $('exBearbeiten').addEventListener('click', function () {
    var zu = exBearbeiten ? exPerlen() : null;
    exBearbeiten = !exBearbeiten;
    var y = window.scrollY;
    render();
    try { window.scrollTo(0, y); } catch (e) { /* egal */ }
    if (exBearbeiten) perlenAus(alleIn('#ansicht .ex-haken, #ansicht [data-exalle]'), $('exBearbeiten'));
    else perlenZu(zu, $('exBearbeiten'));
  });
  // «alle»: Was sich im Abschnitt ändert, tropft als Perle aus dem Schalter
  // (ADR 0036); Knauf und Spur gleiten hinüber, statt mit dem Zeichnen zu
  // springen.
  alleIn('[data-exalle]').forEach(function (b) {
    b.addEventListener('click', function () {
      var art = this.getAttribute('data-exalle'), heute = heuteSchluessel();
      var vorher = {}, warAn = this.getAttribute('aria-checked') === 'true';
      var spurFarbe = getComputedStyle(this.querySelector('.schalter-spur')).backgroundColor;
      alleIn('#ansicht [data-exwahl^="' + art + ':"]').forEach(function (z) {
        vorher[z.getAttribute('data-exwahl')] = z.getAttribute('aria-pressed');
      });
      exAlle(art, art === 't' ? exportTermine(heute) : exportGewohnheiten());
      speichern();
      var y = window.scrollY;
      render();
      try { window.scrollTo(0, y); } catch (e) { /* egal */ }
      var schalter = document.querySelector('#ansicht [data-exalle="' + art + '"]');
      if (!schalter) return;
      var knauf = schalter.querySelector('.schalter-knauf'), spur = schalter.querySelector('.schalter-spur');
      bewegt(knauf, [{ transform: warAn ? 'translateX(20px)' : 'none' }, { transform: getComputedStyle(knauf).transform }],
        { dauer: 500 });
      bewegt(spur, [{ backgroundColor: spurFarbe }, { backgroundColor: getComputedStyle(spur).backgroundColor }],
        { dauer: 300, kurve: 'ease' });
      perlenAus(alleIn('#ansicht [data-exwahl^="' + art + ':"]').filter(function (z) {
        return vorher[z.getAttribute('data-exwahl')] !== z.getAttribute('aria-pressed');
      }).map(function (z) { return z.querySelector('.ex-haken'); }), schalter);
    });
  });
  alleIn('[data-exgw]').forEach(function (b) {
    b.addEventListener('click', function () { zeige('bearbeiten', this.getAttribute('data-exgw')); });
  });
  // Bearbeiten: an Ort und Stelle umschalten, die Liste springt nicht.
  alleIn('[data-exwahl]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = this.getAttribute('data-exwahl'), art = k.charAt(0), id = k.slice(2);
      var e = art === 't' ? terminNach(id) : gewohnheitNach(id);
      if (e) exUmschalten(art, e, !exMit(art, e));
      speichern();
      var y = window.scrollY;
      render();
      try { window.scrollTo(0, y); } catch (e) { /* egal */ }
    });
  });
}

// ── Kopieren ────────────────────────────────────────────────────
// In die Zwischenablage, und `fertig(ok)` sagt, ob es ging. Erst über die
// Zwischenablage des Browsers, sonst über ein verborgenes Feld — scheitert
// beides, zeigt die Ansicht den Text zum Kopieren von Hand.
function kopieren(text, fertig) {
  function vonHand() {
    var f = document.createElement('textarea'), ok = false;
    f.value = text;
    f.setAttribute('readonly', '');
    f.style.cssText = 'position: fixed; top: 0; left: 0; opacity: 0; font-size: 16px;';
    document.body.appendChild(f);
    try {
      f.select();
      f.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    weg(f);
    fertig(!!ok);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { fertig(true); }, vonHand);
      return;
    }
  } catch (e) { /* weiter von Hand */ }
  vonHand();
}

// ════════════════════════════════════════════════════════════════
//  Sicherung: der Sicherungscode
// ════════════════════════════════════════════════════════════════
//
// Die Daten liegen nur auf dem Gerät. Der Code nimmt sie als Text mit — zum
// Kopieren in eine Notiz, zum Einlesen auf einem neuen Gerät (Pflichtenheft:
// «nur Sicherungscode, wie Chillingo»). Er trägt alles außer den Tickets und
// der laufenden Welle: Tickets sind Werkstattzettel des Geräts (ADR 0020).
//
// Aufbau: «CHJ1~<Prüfsumme>~<Base64 von JSON>». Die Prüfsumme fängt einen
// abgeschnittenen oder verstümmelten Code ab, bevor er etwas ersetzt. Die Tage
// einer Gewohnheit stehen verdichtet als Lücken und Läufe — ein Jahr lang
// täglich ist dann eine Handvoll Zeichen statt viereinhalbtausend.
var CODE_KOPF = 'CHJ1';
var SICHERUNG_FRIST = 30;    // Tage, nach denen die Kachel ans Sichern erinnert
var SICHERUNG_AB = 30;       // so viele Einträge, dann gibt es etwas zu verlieren
var TAG_MS = 24 * 60 * 60 * 1000;
var rueckgaengig = null;     // der Stand vor dem letzten Einlesen oder Löschen, bis die Seite neu lädt
var scZeigen = '';           // der Code zum Kopieren von Hand, wenn die Zwischenablage nicht wollte

// «2026-01-01.1*a1.3.1*5»: der erste Tag, dann Lücke (in Tagen) und wie oft
// sie hintereinander vorkommt, beides zur Basis 36. Gegangen wird mit tagPlus,
// nie mit Millisekunden. Was sich nicht verdichten läßt, bleibt null.
function tageVerdichten(tage) {
  if (!tage.length) return '';
  var teile = [tage[0]], k = tage[0], luecke = 0, lauf = 0;
  function abschliessen() {
    if (lauf) teile.push(luecke.toString(36) + (lauf > 1 ? '*' + lauf.toString(36) : ''));
  }
  for (var i = 1; i < tage.length; i++) {
    var n = 0;
    while (k < tage[i] && n <= 4000) { k = tagPlus(k, 1); n++; }
    if (k !== tage[i]) return null;
    if (n === luecke) lauf++;
    else { abschliessen(); luecke = n; lauf = 1; }
  }
  abschliessen();
  return teile.join('.');
}

function tageEntfalten(z) {
  if (typeof z !== 'string' || !z) return [];
  var teile = z.split('.'), k = teile[0], raus = [k];
  if (!istSchluessel(k)) return [];
  for (var i = 1; i < teile.length; i++) {
    var m = /^([0-9a-z]+)(?:\*([0-9a-z]+))?$/.exec(teile[i]);
    if (!m) return [];
    var l = parseInt(m[1], 36), n = m[2] ? parseInt(m[2], 36) : 1;
    if (!(l >= 1) || !(n >= 1) || raus.length + n > 40000) return [];
    for (var j = 0; j < n; j++) { k = tagPlus(k, l); raus.push(k); }
  }
  return raus;
}

function pruefsumme(text) {
  var h = 2166136261;
  for (var i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}

function zuBase64(text) {
  var b = new TextEncoder().encode(text), s = '';
  for (var i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}

function ausBase64(b64) {
  var s = atob(b64), b = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}

function sicherungsCode(nun) {
  var d = JSON.parse(JSON.stringify(state));
  delete d.tickets;
  delete d.welle;
  delete d.timer;
  d.gesichert = nun;
  d.gewohnheiten.forEach(function (g) {
    var z = tageVerdichten(g.erledigt);
    if (z !== null) { g.e = z; delete g.erledigt; }
  });
  var json = JSON.stringify(d);
  return CODE_KOPF + '~' + pruefsumme(json) + '~' + zuBase64(json);
}

// Ein Code als Rohstand für `stand()`, oder null. Leerraum zählt nicht — eine
// Notiz bricht lange Zeilen gern um.
function codeLesen(text) {
  var m = /^CHJ1~([0-9a-z]+)~([A-Za-z0-9+\/]+=*)$/.exec(String(text || '').replace(/\s+/g, ''));
  if (!m) return null;
  try {
    var json = ausBase64(m[2]);
    if (pruefsumme(json) !== m[1]) return null;
    var roh = JSON.parse(json);
    if (!roh || typeof roh !== 'object') return null;
    if (Array.isArray(roh.gewohnheiten)) {
      roh.gewohnheiten.forEach(function (g) {
        if (g && typeof g === 'object' && typeof g.e === 'string') { g.erledigt = tageEntfalten(g.e); delete g.e; }
      });
    }
    return roh;
  } catch (e) { return null; }
}

function anzahl(n, eins, viele) { return n + ' ' + (n === 1 ? eins : viele); }

// Was ein Stand enthält, in einem Satz — für die Frage vor dem Einlesen.
function standText(s) {
  var teile = [anzahl(s.gewohnheiten.length, 'Gewohnheit', 'Gewohnheiten'),
    anzahl(s.abgewoehnen.length, 'Abgewöhnen', 'Abgewöhnen'),
    anzahl(s.termine.length, 'Termin', 'Termine'),
    anzahl(s.journal.length, 'Reflexion', 'Reflexionen')];
  return teile.join(', ');
}

// Was es zu verlieren gibt: jeder Haken, Rückfall, Drang, Termin, jede Reflexion.
function eintragZahl() {
  var n = state.termine.length + state.journal.length;
  state.gewohnheiten.forEach(function (g) { n += 1 + g.erledigt.length; });
  state.abgewoehnen.forEach(function (a) { n += 1 + a.rueckfaelle.length + a.draenge.length; });
  return n;
}

// Tage seit der letzten Sicherung, -1 für noch nie. Eine Dauer, darum in
// Millisekunden über zeitJetzt() — wie «frei seit».
function sicherungAlter() {
  if (!state.gesichert) return -1;
  return Math.max(0, Math.floor((zeitJetzt() - state.gesichert) / TAG_MS));
}

// Erinnert wird erst, wenn es etwas zu verlieren gibt, und dann alle 30 Tage.
function sicherungFaellig() {
  if (eintragZahl() < SICHERUNG_AB) return false;
  var alter = sicherungAlter();
  return alter === -1 || alter >= SICHERUNG_FRIST;
}

function sicherungAlterText() {
  var alter = sicherungAlter();
  return alter === -1 ? 'noch nie' : alter === 0 ? 'heute' : alter === 1 ? 'gestern' : 'vor ' + alter + ' Tagen';
}

function zeichneSicherungKachel() {
  var alter = sicherungAlter();
  return '<section class="abschnitt"><h2>Sicherung</h2><div class="gw-liste">' +
    '<div class="gw-kachel">' +
      '<button type="button" class="gw-haken" data-sicherung="ja">' +
        '<span class="gw-ring"><span class="gw-scheibe sc-scheibe">' + ICON.sicherung + '</span></span>' +
        '<span class="gw-text"><span class="gw-name">Zeit für eine Sicherung</span>' +
          '<span class="gw-info">' + (alter === -1 ? 'Deine Daten liegen nur auf diesem Gerät.'
            : 'Zuletzt ' + esc(sicherungAlterText()) + ' gesichert.') + '</span></span>' +
      '</button>' +
    '</div></div></section>';
}

function zeichneSicherung() {
  return '<section class="abschnitt"><h2>Sichern</h2><div class="kachel">' +
      '<p>Deine Daten liegen nur auf diesem Gerät. Der Sicherungscode nimmt alles mit — Gewohnheiten, ' +
        'Abgewöhnen, Termine, Journal und Einstellungen. Leg ihn in eine Notiz oder schick ihn dir selbst.</p>' +
      '<div class="zeile"><span>Zuletzt gesichert</span><span class="wert" id="scAlter">' +
        esc(sicherungAlterText()) + '</span></div>' +
      '<div class="knopfreihe"><button type="button" class="knopf" id="scKopieren">Code kopieren</button></div>' +
      (scZeigen ? '<p class="klein">Kopieren ging nicht. Markier den Code und kopier ihn von Hand.</p>' +
        '<textarea id="scCode" class="eingabe code" readonly rows="4">' + esc(scZeigen) + '</textarea>' : '') +
      '<p class="klein">Tickets fahren nicht mit — sie gehören zum Gerät.</p>' +
    '</div></section>' +
    '<section class="abschnitt"><h2><label for="scEingabe">Einlesen</label></h2>' +
      '<textarea id="scEingabe" class="eingabe code" rows="4" autocomplete="off" autocapitalize="off" ' +
        'spellcheck="false" placeholder="Sicherungscode hier einfügen"></textarea>' +
      '<div class="knopfreihe"><button type="button" class="knopf zart" id="scEinlesen">Einlesen</button>' +
        (rueckgaengig ? '<button type="button" class="knopf zart" id="scRueck">Rückgängig machen</button>' : '') +
      '</div>' +
      '<p class="klein">Einlesen ersetzt, was jetzt auf dem Gerät steht. Bis die App neu lädt, kannst du ' +
        'es rückgängig machen.</p>' +
    '</section>';
}

// Den Stand ersetzen — beim Einlesen wie beim Löschen. Der alte bleibt für
// «Rückgängig», bis die Seite neu lädt; die Tickets bleiben, sie gehören zum Gerät.
function standErsetzen(neu) {
  rueckgaengig = JSON.stringify(state);
  neu.tickets = state.tickets;
  state = neu;
  entwurf = null;
  terminEntwurf = null;
  reflexionEntwurf = null;
  kalTag = null;
  kalVersatz = 0;
  themaAnwenden();
  return speichern();
}

function sicherungKopieren() {
  var nun = zeitJetzt(), code = sicherungsCode(nun), knopf = this;
  kopieren(code, function (ok) {
    scZeigen = ok ? '' : code;
    if (ok) {
      state.gesichert = nun;
      if (speichern()) bestaetigen('Kopiert', 'Leg den Code an einen sicheren Ort.', knopf, '#scAlter', 'kopie');
    }
    if (ansicht === 'sicherung') render();
    if (!ok && $('scCode')) { try { $('scCode').focus(); $('scCode').select(); } catch (e) { /* egal */ } }
  });
}

function sicherungEinlesen() {
  var roh = codeLesen($('scEingabe').value);
  if (!roh) {
    melden('Das ist kein gültiger Sicherungscode. Kopier ihn noch einmal ganz.');
    return;
  }
  var neu = stand(roh), wann = istZeit(roh.gesichert) ? datumLang(new Date(roh.gesichert)) : '';
  hinweisZeigen('Diesen Stand einlesen?', standText(neu) + (wann ? ', gesichert am ' + wann : '') +
    '. Was jetzt auf dem Gerät steht, wird ersetzt.', this.getBoundingClientRect(), null,
    { frage: { ja: 'Ersetzen', beiJa: function () {
      var ok = standErsetzen(neu);
      render();
      if (ok) melden('Eingelesen. Bis die App neu lädt, kannst du es rückgängig machen.', 'haken');
    } } });
}

function sicherungZurueck() {
  if (!rueckgaengig) return;
  var alt = stand(JSON.parse(rueckgaengig));
  alt.tickets = state.tickets;
  state = alt;
  rueckgaengig = null;
  themaAnwenden();
  render();
  if (speichern()) melden('Rückgängig gemacht. Der vorige Stand ist zurück.', 'haken');
}

function bindeSicherung() {
  $('scKopieren').addEventListener('click', sicherungKopieren);
  $('scEinlesen').addEventListener('click', sicherungEinlesen);
  if ($('scRueck')) $('scRueck').addEventListener('click', sicherungZurueck);
}

// ════════════════════════════════════════════════════════════════
//  Tickets: Fehler und Wünsche
// ════════════════════════════════════════════════════════════════
//
// Gesammelt auf dem Gerät, gebündelt als Text «# Chillinal · N Tickets» zum
// Kopieren und Vorlegen. Nichts wird verschickt. Geschrieben wird im
// Ticketblatt, das sich über die Ansicht legt — aus dem schwebenden Knopf
// unten rechts oder aus der Ticketliste (ADR 0020).
var ticketEntwurf = null;   // { id, art, titel, text, ort, grund } — überlebt das Zuklappen
var ticketHoehe = 0;       // so hoch war das Ticket, als «Alle Tickets» kam (ADR 0028)
var ticketQuelle = null;    // das Element, aus dem das Blatt quoll — dorthin fließt es zurück
var ticketListe = false;    // das Blatt zeigt alle Tickets statt des Formulars (ADR 0025)
var tkAusgabe = '';         // der gebündelte Text zum Kopieren von Hand

// Woher ein neues Ticket kommt: die Ansicht, über der man steht.
var ORT_VON = { home: 'uebersicht', neu: 'gewohnheit', bearbeiten: 'gewohnheit', abgewoehnen: 'abgewoehnen',
  welle: 'abgewoehnen', rueckfall: 'abgewoehnen', terminNeu: 'termin', termin: 'termin', journal: 'journal',
  reflexion: 'journal', lesen: 'journal', export: 'export', einstellungen: 'einstellungen',
  sicherung: 'sicherung', tickets: 'tickets' };

function ortHier() {
  if (ansicht === 'home' && kalTag) return 'kalender';
  return ORT_VON[ansicht] || 'anderswo';
}

function ticketNach(id) {
  for (var i = 0; i < state.tickets.length; i++) if (state.tickets[i].id === id) return state.tickets[i];
  return null;
}

function ticketStand() { return APP_VERSION + ' · ' + APP_STAND; }

function ticketEntwurfDa() {
  return !!ticketEntwurf && !ticketEntwurf.id && !!(ticketEntwurf.titel.trim() || ticketEntwurf.text.trim());
}

function ticketKnopfZeigen() {
  var k = $('ticketKnopf'), da = ticketEntwurfDa();
  k.classList.toggle('hat-entwurf', da);
  k.setAttribute('aria-label', da ? 'Angefangenes Ticket weiterschreiben' : 'Ticket schreiben');
}

// Ein Ticket als Abschnitt. Der App-Stand steht einmal am Ende; nur wenn sich
// zwischendurch etwas geändert hat, an jedem Ticket — dann sagt er, gegen welche
// Fassung sich die Meldung richtet.
function ticketAbschnitt(t, nr, standZeigen) {
  return '## ' + nr + ' · ' + (t.art === 'wunsch' ? 'Wunsch' : 'Fehler') + ': ' + t.titel + '\n\n' +
    (t.text ? t.text + '\n\n' : '') +
    '- Ort: ' + wahlName(TICKET_ORTE, t.ort) + '\n' +
    (t.grund ? '- Art: ' + wahlName(TICKET_GRUENDE[t.art], t.grund) + '\n' : '') +
    (standZeigen ? '- App-Stand: ' + t.stand + '\n' : '');
}

function ticketsAlsText(liste) {
  if (!liste.length) return '';
  var reihe = liste.slice().sort(function (a, b) { return a.erstellt - b.erstellt; }), staende = [];
  reihe.forEach(function (t) { if (staende.indexOf(t.stand) === -1) staende.push(t.stand); });
  var jeTicket = staende.length > 1;
  return '# Chillinal · ' + anzahl(reihe.length, 'Ticket', 'Tickets') + '\n\n' +
    reihe.map(function (t, i) { return ticketAbschnitt(t, i + 1, jeTicket); }).join('\n') +
    '\n---\n' + (jeTicket ? '' : 'App-Stand: ' + staende[0] + '\n');
}

function offeneTickets() { return state.tickets.filter(function (t) { return !t.abgegeben; }); }

// ── Das Ticketblatt ─────────────────────────────────────────────
function ticketBlattOffen() { return !$('ticketBlatt').hidden && $('ticketBlatt').classList.contains('offen'); }

// Ein Textfeld so hoch wie sein Text, höchstens `zeilen` Zeilen; darüber rollt
// es in sich (ADR 0025).
function textWachsen(el, zeilen) {
  if (!el) return;
  var cs = getComputedStyle(el), zeile = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.55;
  var rand = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0) +
    (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
  var hoechst = Math.ceil(zeile * (zeilen || 3) + rand);
  el.style.height = 'auto';
  var noetig = el.scrollHeight + (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
  el.style.height = px(Math.min(noetig, hoechst));
  el.style.overflowY = noetig > hoechst ? 'auto' : 'hidden';
}

function grundOptionen(e) {
  return '<option value="">Ohne Angabe</option>' + TICKET_GRUENDE[e.art].map(function (g) {
    return '<option value="' + g[0] + '"' + (e.grund === g[0] ? ' selected' : '') + '>' + esc(g[1]) + '</option>';
  }).join('');
}

// Alle Tickets im Blatt: Kopf mit Zurück, darunter die offenen, dann die
// abgegebenen gedimmt. Eine Zeile öffnet ihr Ticket im selben Blatt.
function zeichneTicketListe() {
  var offen = offeneTickets(), ab = state.tickets.filter(function (t) { return !!t.abgegeben; }).reverse();
  return '<div class="tk-kopf tk-kopf-liste"><button type="button" class="rund" id="tkListeZurueck" aria-label="Zurück">' +
      ICON.zurueck + '</button><h2 id="tkKopf">Alle Tickets</h2>' +
      '<button type="button" class="tk-alle" id="tkZurSeite">Ticketseite</button></div>' +
    '<div class="tk-rolle">' + (offen.length ? '<div class="tk-liste-blatt">' + offen.map(zeichneTicketZeile).join('') + '</div>' +
      '<div class="knopfreihe"><button type="button" class="knopf zart" id="tkListeKopieren">' +
        (offen.length === 1 ? 'Ticket kopieren' : 'Alle ' + offen.length + ' kopieren') + '</button></div>'
      : '<p class="klein tk-leer">Nichts offen.</p>') +
    (ab.length ? '<p class="tk-etikett">Abgegeben</p><div class="tk-liste-blatt gedimmt">' +
      ab.map(zeichneTicketZeile).join('') + '</div>' : '') + '</div>';
}

// Wechselt der Inhalt des Blatts, wächst oder schrumpft es weich in die neue
// Höhe; erst danach tropfen die Zeilen der Liste nacheinander auf (ADR 0027).
// Die Liste ist genau so hoch wie das Ticket, aus dem sie kam; reicht das
// nicht, rollt sie darin (ADR 0028). Kommt sie über «Alle Tickets» (`aus`,
// die Fläche des Knopfs), tropft jede Zeile aus ihm: als Perle unter dem Knopf,
// die an ihren Platz rollt und dort breit wird (ADR 0032).
var TK_WECHSEL = 380, TK_ZEILE = 820, TK_STAFFEL = 160;
function ticketBlattWechseln(liste, aus) {
  var karte = $('ticketKarte'), h0 = karte.offsetHeight;
  if (liste && !ticketListe) ticketHoehe = h0;
  ticketListe = liste;
  karte.style.height = liste && ticketHoehe ? px(ticketHoehe) : '';
  karte.innerHTML = zeichneTicketBlatt();
  bindeTicketBlatt();
  wahlenSetzen();
  karte.querySelector('.tk-rolle').scrollTop = 0;
  var h1 = karte.offsetHeight;
  var wechselt = Math.abs(h1 - h0) > 1;
  if (wechselt) bewegt(karte, [{ height: px(h0) }, { height: px(h1) }], { dauer: TK_WECHSEL, kurve: TROPFEN_KURVE });
  var rolle = karte.querySelector('.tk-rolle').getBoundingClientRect();
  if (liste) alleIn('#ticketKarte .tk-zeile').forEach(function (z, i) {
    var w = z.offsetWidth, h = z.offsetHeight;
    if (!w || !h) return;
    var d = Math.min(h, 44), perle = 'inset(' + px((h - d) / 2) + ' ' + px(w - d - 8) + ' ' + px((h - d) / 2) + ' 8px round ' + px(d / 2) + ')';
    var zr = z.getBoundingClientRect(), weg = 'none';
    if (aus && aus.width) {
      // Die Perle beginnt unter dem Knopf, nie über dem Rand dessen, was rollt.
      var x = Math.min(aus.left + aus.width / 2, rolle.right - d / 2 - 4), y = rolle.top + d / 2 + 2;
      weg = 'translate(' + px(x - (zr.left + 8 + d / 2)) + ', ' + px(Math.min(0, y - (zr.top + h / 2))) + ')';
    }
    bewegt(z, aus && aus.width ? [
      { clipPath: perle, opacity: 0, transform: weg },
      { clipPath: perle, opacity: 1, transform: weg, offset: 0.12 },
      { clipPath: perle, opacity: 1, transform: 'none', offset: 0.5 },
      { clipPath: 'inset(0px 0px 0px 0px round 14px)', opacity: 1, transform: 'none' }
    ] : [
      { clipPath: perle, opacity: 0 },
      { clipPath: perle, opacity: 1, offset: 0.15 },
      { clipPath: 'inset(0px 0px 0px 0px round 14px)', opacity: 1 }
    ], { dauer: TK_ZEILE, warten: (wechselt ? TK_WECHSEL : 0) + TK_STAFFEL * i, kurve: TROPFEN_KURVE, fill: 'backwards' });
  });
}

function zeichneTicketBlatt() {
  if (ticketListe) return zeichneTicketListe();
  var e = ticketEntwurf;
  return '<div class="tk-kopf"><h2 id="tkKopf">' + (e.id ? 'Ticket' : 'Neues Ticket') + '</h2>' +
      '<button type="button" class="tk-alle" id="tkAlle">Alle Tickets</button></div>' +
    '<div class="tk-rolle"><div class="wahl" role="group" aria-label="Ticketart">' + [['fehler', 'Fehler'], ['wunsch', 'Wunsch']].map(function (a) {
      return '<button type="button" data-tkart="' + a[0] + '" aria-pressed="' + (e.art === a[0] ? 'true' : 'false') +
        '">' + a[1] + '</button>';
    }).join('') + '</div>' +
    '<input id="tkTitel" class="eingabe" type="text" maxlength="' + TICKET_TITEL_MAX + '" autocomplete="off" ' +
      'aria-label="Titel" placeholder="Worum geht es? Kurz und knapp." value="' + esc(e.titel) + '">' +
    '<textarea id="tkText" class="eingabe tk-wachsend" rows="1" maxlength="' + TICKET_TEXT_MAX + '" aria-label="Beschreibung" ' +
      'placeholder="Was ist passiert, was hast du erwartet?">' + esc(e.text) + '</textarea>' +
    '<div class="tk-wahlen">' +
      '<div><label class="tm-etikett" for="tkOrt">Wo</label><div class="auswahl"><select id="tkOrt" class="eingabe">' +
        TICKET_ORTE.map(function (o) {
          return '<option value="' + o[0] + '"' + (e.ort === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
        }).join('') + '</select>' + ICON.weiter + '</div></div>' +
      '<div><label class="tm-etikett" for="tkGrund">Was</label><div class="auswahl"><select id="tkGrund" class="eingabe">' +
        grundOptionen(e) + '</select>' + ICON.weiter + '</div></div>' +
    '</div>' +
    '<div class="tk-knoepfe">' +
      '<button type="button" class="knopf zart" id="tkAbbrechen">' + (e.id ? 'Zurück' : 'Verwerfen') + '</button>' +
      '<button type="button" class="knopf" id="tkSichern">Sichern</button>' +
    '</div>' +
    (e.id ? '<div class="knopfreihe"><button type="button" class="knopf zart" id="tkLoeschen">Ticket löschen</button></div>' : '') +
    '</div>';
}

function bindeTicketListe() {
  // Zur Seite «Tickets» (ADR 0027): Sie öffnet sich unter dem Blatt, das Blatt
  // fließt in den Knopf zurück; ein Entwurf bleibt liegen.
  $('tkZurSeite').addEventListener('click', function () {
    ticketQuelle = null;
    zeige('tickets');
    ticketBlattSchliessen();
  });
  $('tkListeZurueck').addEventListener('click', function () {
    if (!ticketEntwurf) ticketEntwurf = { id: null, art: 'fehler', titel: '', text: '', ort: ortHier(), grund: '' };
    ticketBlattWechseln(false);
  });
  alleIn('#ticketKarte [data-ticket]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = ticketNach(this.getAttribute('data-ticket'));
      if (!t) return;
      ticketEntwurf = { id: t.id, art: t.art, titel: t.titel, text: t.text, ort: t.ort, grund: t.grund };
      ticketBlattWechseln(false);
    });
  });
  if ($('tkListeKopieren')) $('tkListeKopieren').addEventListener('click', function () {
    var offen = offeneTickets(), text = ticketsAlsText(offen);
    kopieren(text, function (ok) {
      if (ok) {
        var nun = zeitJetzt();
        offen.forEach(function (t) { t.abgegeben = nun; });
        if (speichern()) melden('Kopiert. ' + anzahl(offen.length, 'Ticket liegt', 'Tickets liegen') + ' in der Zwischenablage.', 'kopie');
        if (ticketListe) ticketBlattWechseln(true);
        if (ansicht === 'tickets') render();
      } else {
        melden('Kopieren ging nicht. Unter Tickets im Menü kannst du den Text von Hand kopieren.');
      }
    });
  });
}

function bindeTicketBlatt() {
  if (ticketListe) { bindeTicketListe(); return; }
  var e = ticketEntwurf;
  alleIn('[data-tkart]').forEach(function (b) {
    b.addEventListener('click', function () {
      var art = this.getAttribute('data-tkart');
      if (art === e.art) return;
      e.art = art;
      e.grund = '';
      alleIn('[data-tkart]').forEach(function (x) {
        x.setAttribute('aria-pressed', x.getAttribute('data-tkart') === art ? 'true' : 'false');
      });
      $('tkGrund').innerHTML = grundOptionen(e);
      wahlenSetzen();
    });
  });
  $('tkTitel').addEventListener('input', function () { e.titel = this.value; ticketKnopfZeigen(); });
  $('tkText').addEventListener('input', function () { e.text = this.value; ticketKnopfZeigen(); textWachsen(this); });
  textWachsen($('tkText'));
  $('tkOrt').addEventListener('change', function () { e.ort = this.value; });
  $('tkGrund').addEventListener('change', function () { e.grund = this.value; });
  $('tkSichern').addEventListener('click', ticketSichern);
  // Zu allen Tickets — im selben Blatt, mit Zurück; der Entwurf bleibt liegen
  // (ADR 0025, ändert 0021).
  $('tkAlle').addEventListener('click', function () { ticketBlattWechseln(true, this.getBoundingClientRect()); });
  // Der einzige Weg, einen Entwurf loszuwerden. Danebentippen klappt nur zu —
  // ein halb geschriebenes Ticket durch eine Handbewegung zu verlieren wäre
  // der schlechtere Tausch.
  $('tkAbbrechen').addEventListener('click', function () {
    ticketEntwurf = null;
    ticketBlattSchliessen();
  });
  if ($('tkLoeschen')) $('tkLoeschen').addEventListener('click', function () {
    loeschenFragen(this, 'Löschen?', 'Das Ticket ist danach weg.', 'Löschen', function () { ticketLoeschen(e); });
  });
}

// Gelöscht wird erst nach der Frage im Glas (ADR 0041).
function ticketLoeschen(e) {
  var t = ticketNach(e.id), zeile = document.querySelector('#app [data-ticket="' + e.id + '"]');
  if (t) state.tickets.splice(state.tickets.indexOf(t), 1);
  ticketEntwurf = null;
  var gut = speichern();
  // Das Blatt fließt in seine Zeile; erst wenn es dort ist, geht sie.
  var geht = ansicht === 'tickets' && zeile ? zeileGeht(zeile, '#' + zeile.closest('section').id + ' .tm-liste',
    '#' + zeile.closest('section').id + ' .klein') : null;
  ticketBlattSchliessen();
  if (ansicht === 'tickets') render();
  if (geht) geht(TROPFEN_DAUER);
  if (gut) melden('Gelöscht.', 'haken');
}

// Das Blatt steht unten. Geht die Tastatur auf, schiebt iOS sie über das
// Fixierte, statt den Rahmen zu verkleinern; `visualViewport` sagt, wie viel
// davon verdeckt ist — um so viel rückt das Blatt hoch.
function ticketTastatur() {
  var v = window.visualViewport, blatt = $('ticketBlatt');
  if (!blatt) return;
  var verdeckt = v ? Math.max(0, Math.round(window.innerHeight - v.height - v.offsetTop)) : 0;
  blatt.style.setProperty('--tastatur', verdeckt + 'px');
}

// Auf: als Tropfen aus `quelle` (dem Knopf oder der getippten Zeile). `id`
// öffnet ein vorhandenes Ticket; ohne sie geht ein angefangener Entwurf weiter.
function ticketBlattOeffnen(quelle, id, flaeche) {
  var t = id ? ticketNach(id) : null;
  if (t) ticketEntwurf = { id: t.id, art: t.art, titel: t.titel, text: t.text, ort: t.ort, grund: t.grund };
  else if (!ticketEntwurf || ticketEntwurf.id) {
    ticketEntwurf = { id: null, art: 'fehler', titel: '', text: '', ort: ortHier(), grund: '' };
  }
  menueSchliessen(true);
  ticketQuelle = quelle || null;
  ticketListe = false;
  var blatt = $('ticketBlatt'), karte = $('ticketKarte');
  karte.style.height = '';
  karte.innerHTML = zeichneTicketBlatt();
  bindeTicketBlatt();
  blatt.hidden = false;
  void blatt.offsetWidth;
  blatt.classList.add('offen');
  karte.querySelector('.tk-rolle').scrollTop = 0;
  // Verborgen hat das Feld keine Höhe zu messen; also erst jetzt (ADR 0027).
  textWachsen($('tkText'));
  $('ticketKnopf').setAttribute('aria-expanded', 'true');
  wahlenSetzen();
  var r = flaeche || (quelle && zuSehen(quelle) ? quelle.getBoundingClientRect() : null);
  if (r && r.width) tropfenAuf(karte, r, { rund: '18px', glas: true });
}

// Zu: in die Quelle zurück, ist sie fort, in den Knopf. `fertig` kommt, wenn
// der Tropfen angekommen ist. Mit `meldung` ({ titel, text, ziel }) fließt das
// Blatt nirgends hin, es wird selbst zur Meldung (ADR 0041).
function ticketBlattSchliessen(fertig, meldung) {
  var blatt = $('ticketBlatt'), karte = $('ticketKarte');
  ticketKnopfZeigen();
  $('ticketKnopf').setAttribute('aria-expanded', 'false');
  if (blatt.hidden || !blatt.classList.contains('offen')) { if (fertig) fertig(); return; }
  blatt.classList.remove('offen');
  var ziel = zuSehen(ticketQuelle) ? ticketQuelle : $('ticketKnopf');
  ticketQuelle = null;
  try { if (document.activeElement && karte.contains(document.activeElement)) document.activeElement.blur(); } catch (e) { /* egal */ }
  var g = bewegungAus() ? null : geist(karte);
  function zu() {
    karte.style.opacity = '';
    if (!blatt.classList.contains('offen')) blatt.hidden = true;
    if (fertig) fertig();
  }
  var r = karte.getBoundingClientRect();
  if (meldung) {
    zu();
    fensterWirdMeldung(g, r, true, meldung.titel, meldung.text, meldung.ziel);
    return;
  }
  if (!g) { zu(); return; }
  karte.style.opacity = '0';
  tropfenZu(g, r, ziel, { rund: '18px', glas: true, fertig: zu });
}

function ticketSichern() {
  var e = ticketEntwurf;
  e.titel = $('tkTitel').value.trim().slice(0, TICKET_TITEL_MAX);
  e.text = $('tkText').value.replace(/\s+$/, '').slice(0, TICKET_TEXT_MAX);
  if (!e.titel) {
    $('tkTitel').focus();
    melden('Gib dem Ticket einen Titel.');
    return;
  }
  var t = e.id ? ticketNach(e.id) : null;
  if (t) {
    // Ein geändertes Ticket ist wieder offen: Was abgegeben war, stimmt so nicht mehr.
    t.art = e.art; t.titel = e.titel; t.text = e.text; t.ort = e.ort; t.grund = e.grund;
    t.abgegeben = null;
  } else {
    // Streng steigend, damit die Reihenfolge eindeutig bleibt.
    var nun = zeitJetzt();
    state.tickets.forEach(function (x) { if (x.erstellt >= nun) nun = x.erstellt + 1; });
    t = { id: neueId('k'), art: e.art, titel: e.titel, text: e.text, ort: e.ort, grund: e.grund,
      erstellt: nun, stand: ticketStand(), abgegeben: null };
    state.tickets.push(t);
  }
  ticketEntwurf = null;
  var gut = speichern(), neu = !e.id;
  if (ansicht === 'tickets') render();
  // Das Blatt wird selbst zur Bestätigung, die danach ins Gespeicherte fließt
  // (ADR 0041) — nicht erst zurück und dann aus dem Knopf.
  ticketBlattSchliessen(null, gut ? { titel: neu ? 'Ticket gesichert' : 'Gespeichert',
    text: neu ? 'Es bleibt auf dem Gerät, bis du es kopierst.' : '',
    ziel: ansicht === 'tickets' ? '[data-ticket="' + t.id + '"]' : $('ticketKnopf') } : null);
}

// ── Die Ticketliste ─────────────────────────────────────────────
function zeichneTicketZeile(t) {
  var mehr = [wahlName(TICKET_ORTE, t.ort), t.grund ? wahlName(TICKET_GRUENDE[t.art], t.grund) : '',
    tagKurz(tagSchluessel(new Date(t.erstellt)))].filter(function (x) { return !!x; }).join(' · ');
  return '<button type="button" class="tk-zeile" data-ticket="' + esc(t.id) + '">' +
    '<span class="tk-art">' + (t.art === 'wunsch' ? 'Wunsch' : 'Fehler') + '</span>' +
    '<span class="tk-titel">' + esc(t.titel) + '</span>' +
    '<span class="tk-mehr">' + esc(mehr) + '</span></button>';
}

function zeichneTickets() {

        (tkAusgabe ? '<p class="klein">Kopieren ging nicht. Markier den Text und kopier ihn von Hand.</p>' +
          '<textarea id="tkAusgabe" class="eingabe code" readonly rows="6">' + esc(tkAusgabe) + '</textarea>' : '') +
        '<p class="klein">Kopiert gelten sie als abgegeben. Leg den Text Claude Code vor.</p>'
      : '<p class="klein">Nichts offen. Stört dich etwas oder fehlt dir etwas, tipp unten rechts auf den Knopf.</p>') +

function ticketsKopieren() {
  var offen = offeneTickets(), text = ticketsAlsText(offen);
  kopieren(text, function (ok) {
    tkAusgabe = ok ? '' : text;
    if (ok) {
      var nun = zeitJetzt();
      offen.forEach(function (t) { t.abgegeben = nun; });
      var gut = speichern();
      if (gut) melden('Kopiert. ' + anzahl(offen.length, 'Ticket liegt', 'Tickets liegen') + ' in der Zwischenablage.', 'kopie');
    }
    if (ansicht === 'tickets') render();
    if (!ok && $('tkAusgabe')) { try { $('tkAusgabe').focus(); $('tkAusgabe').select(); } catch (e) { /* egal */ } }
  });
}

function bindeTickets() {
  $('tkNeu').addEventListener('click', function () {
    if (ticketEntwurf && ticketEntwurf.id) ticketEntwurf = null;
    ticketBlattOeffnen(this);
  });
  alleIn('[data-ticket]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = letzterTipp && letzterTipp.el === this && letzterTipp.x ? punktFlaeche(letzterTipp.x, letzterTipp.y) : null;
      ticketBlattOeffnen(this, this.getAttribute('data-ticket'), p);
    });
  });
  if ($('tkKopieren')) $('tkKopieren').addEventListener('click', ticketsKopieren);
  if ($('tkAufraeumen')) $('tkAufraeumen').addEventListener('click', function () {
    loeschenFragen(this, 'Abgegebene löschen?', 'Offene Tickets bleiben.', 'Löschen', function () {
      state.tickets = offeneTickets();
      var gut = speichern();
      render();
      if (gut) melden('Gelöscht.', 'haken');
    });

}

// Alles löschen fragt im Glas; der alte Stand bleibt für «Rückgängig» in der
// Sicherung, bis die App neu lädt. Chillingos Speicher bleibt unberührt — es
// wird nur der eigene Schlüssel neu geschrieben.
function allesLoeschenTippen() {
  var nie = sicherungAlter() === -1;
  hinweisZeigen('Alle Daten löschen?', 'Gewohnheiten, Abgewöhnen, Termine und Journal sind danach weg. ' +
    (nie ? 'Du hast noch nie gesichert.' : 'Zuletzt gesichert: ' + sicherungAlterText() + '.'),
    this.getBoundingClientRect(), null, { frage: { ja: 'Löschen', beiJa: function () {
      var neu = grundStand();
      neu.thema = state.thema;
      neu.bewegung = state.bewegung;
      var ok = standErsetzen(neu);
      render();
      if (ok) melden('Gelöscht. Unter Sicherung kannst du es rückgängig machen, bis die App neu lädt.', 'haken');
    } } });
}

// Ereignisse erst nach dem Setzen von innerHTML, nie als Attribut.
function bindeAnsicht() {
  var erste = $('ersteGewohnheit') || $('gwAnlegen');
  if (erste) erste.addEventListener('click', function () { zeige('neu'); });

  alleIn('[data-haken]').forEach(function (b) {
    var id = b.getAttribute('data-haken');
    b.addEventListener('click', function () {
      if (langGedrueckt && Date.now() - langGedrueckt < 1000) return;
      var g = gewohnheitNach(id), heute = heuteSchluessel();
      // Zähler zählen, ein Timer startet oder zeigt sich (ADR 0038).
      if (g && g.zaehler) { zaehlen(id, 1); return; }
      if (state.timer && state.timer.id === id) { timerOeffnen(id); return; }
      if (g && g.timer && !erledigtAm(id, heute)) { timerStarten(id); return; }
      geradeAbgehakt = id;
      umschaltenUndZeichnen(id, heute);
      geradeAbgehakt = null;
    });
    langDruecken(b, function () { zeige('bearbeiten', id); });
  });
  alleIn('[data-minus]').forEach(function (b) {
    b.addEventListener('click', function () { zaehlen(this.getAttribute('data-minus'), -1); });
  });
  alleIn('[data-ab]').forEach(function (b) {
    var id = b.getAttribute('data-ab');
    b.addEventListener('click', function () {
      if (langGedrueckt && Date.now() - langGedrueckt < 1000) return;
      zeige('abgewoehnen', id);
    });
    langDruecken(b, function () { zeige('abgewoehnen', id); });
  });
  // Eine Welle zur Zeit: Läuft schon eine, führt jeder Drang-Knopf zu ihr.
  alleIn('[data-drang]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = this.getAttribute('data-drang');
      if (state.welle && state.welle.id !== id) melden('Es läuft schon eine Welle.');
      else welleBeginnen(id);
      zeige('welle');
    });
  });
  alleIn('[data-rueckfall]').forEach(function (b) {
    b.addEventListener('click', function () { zeige('rueckfall', this.getAttribute('data-rueckfall')); });
  });
  // Ein Termin, der da war, ist wie eine Kachel: Antippen hakt ab, lange
  // drücken öffnet (ADR 0042). Ein kommender öffnet schon beim Antippen.
  alleIn('[data-termin]').forEach(function (b) {
    var id = b.getAttribute('data-termin');
    b.addEventListener('click', function () {
      if (langGedrueckt && Date.now() - langGedrueckt < 1000) return;
      if (this.hasAttribute('data-terminhaken')) terminAbhaken(id, this.getAttribute('data-tag'));
      else zeige('termin', id);
    });
    langDruecken(b, function () { zeige('termin', id); });
  });
  // «Hinzufügen» fragt erst, was — in einem Fenster aus Glas, das wie der
  // Timer klein aus dem Plus tropft und in dessen Tempo, nicht aus dem ganzen,
  // fast kartenbreiten Knopf (ADR 0025, 0041).
  if ($('kalNeu')) $('kalNeu').addEventListener('click', function () {
    var k = this.getAttribute('data-tag'), plus = this.querySelector('svg') || this;
    hinweisWahlHerkunft = '#kalNeu';
    hinweisZeigen('Hinzufügen', 'Was möchtest du an diesem Tag hinzufügen?', plus.getBoundingClientRect(), plus, { dauer: TROPFEN_DAUER, wahl: {
      knoepfe: [
        { text: 'Termin', attr: { 'data-neutermin': k }, tun: function () { zeige('terminNeu', k); } },
        { text: 'Gewohnheit', attr: { 'data-neugw': 'an' }, tun: function () { zeige('neu', { richtung: 'an', tag: k }); } },
        { text: 'Abgewöhnen', attr: { 'data-neugw': 'ab' }, tun: function () { zeige('neu', { richtung: 'ab', tag: k }); } }
      ] } });
  });
  alleIn('#ansicht [data-neugw]').forEach(function (b) {
    b.addEventListener('click', function () {
      zeige('neu', { richtung: this.getAttribute('data-neugw'), tag: this.getAttribute('data-tag') });
    });
  });
  alleIn('#ansicht [data-neutermin]').forEach(function (b) {

  alleIn('[data-reflexion]').forEach(function (b) {

  });
  alleIn('[data-lesen]').forEach(function (b) {

  if ($('jrGut')) bindeReflexion();

  if ($('esLoeschen')) bindeEinstellungen();
  if ($('tmTitel')) bindeTerminFormular();

  var knoepfe = document.querySelectorAll('.wahl [data-thema]');

}

// Lange drücken öffnet, kurz tippen hakt ab. Der Klick, der dem langen Druck
// folgt, darf nicht auch noch abhaken. Wer beim Halten den Finger bewegt,
// blättert — dann bleibt es beim Blättern. Ein Rechtsklick (oder Androids
// eigener langer Druck) tut dasselbe.
var LANG_MS = 500;
var langGedrueckt = 0;   // wann der letzte lange Druck auslöste
var langPunkt = null;    // wo: { x, y } — dort quillt die Ansicht heraus

// Der Finger liegt nach dem langen Druck noch auf, die neue Ansicht steht
// schon unter ihm — iOS markierte dort das Wort unter dem Finger. Bis er sich
// hebt, ist nichts auswählbar, und was doch markiert wurde, geht (ADR 0043).
function langHalten() {
  var wurzel = document.documentElement;
  function los() {
    wurzel.classList.remove('lang-haelt');
    try { window.getSelection().removeAllRanges(); } catch (e) { /* egal */ }
    ['pointerup', 'pointercancel', 'touchend', 'touchcancel'].forEach(function (n) {
      document.removeEventListener(n, los, true);
    });
  }
  wurzel.classList.add('lang-haelt');
  try { window.getSelection().removeAllRanges(); } catch (e) { /* egal */ }
  ['pointerup', 'pointercancel', 'touchend', 'touchcancel'].forEach(function (n) {
    document.addEventListener(n, los, true);
  });
  // Kommt das Heben nie an (ein Rechtsklick, ein verschlucktes Ereignis),
  // bleibt die Seite trotzdem nicht für immer unauswählbar.
  setTimeout(los, 8000);
}

function langDruecken(el, beiLang) {
  var uhr = null, x = 0, y = 0;
  function aus() {
    if (uhr) { clearTimeout(uhr); uhr = null; }
    el.classList.remove('halten');
  }
  function los() {
    aus();
    langGedrueckt = Date.now();
    langPunkt = { x: x, y: y };
    langHalten();
    beiLang();
  }
  el.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    x = e.clientX; y = e.clientY;
    el.classList.add('halten');
    uhr = setTimeout(los, LANG_MS);
  });
  el.addEventListener('pointermove', function (e) {
    if (uhr && Math.abs(e.clientX - x) + Math.abs(e.clientY - y) > 10) aus();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { el.addEventListener(n, aus); });
  el.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (Date.now() - langGedrueckt > LANG_MS) { x = e.clientX; y = e.clientY; los(); }
  });
}

// «Heute» neben der Chili führt den Kalender nach Hause: zurückblättern, den
// heutigen Tag wählen, seine Liste öffnen — im selben Takt wie Woche | Monat.
function zuHeute() {
  var heute = heuteSchluessel();
  if (kalVersatz === 0 && kalTag === heute) return;
  var leiste = $('kalLeiste'), oben = leiste ? leiste.getBoundingClientRect().top : null;
  var blaettern = kalVersatz !== 0, richtung = kalVersatz > 0 ? -1 : 1, alt = $('kalRaster');
  var vorher = blaettern && state.kalender === 'woche' && alt ? { geist: geist(alt), rect: alt.getBoundingClientRect() } : null;
  kalVersatz = 0;
  kalTag = heute;
  heldTakt = KAL_TAKT;
  kalGewechselt = blaettern && !vorher;
  render();
  kalGewechselt = false;
  if (vorher) kalSeitlich(richtung, vorher);
  var tag = document.querySelector('[data-kaltag="' + heute + '"]');
  if (!leiste && tag) tropfenFallen(tag.getBoundingClientRect(), $('kalLeiste'));
  else leisteGleiten(oben);
}

function bindeKalender() {
  if (!$('kalRaster')) return;
  if ($('heuteKnopf')) $('heuteKnopf').addEventListener('click', zuHeute);
  // Woche | Monat: Der gewählte Tag bleibt, und mit ihm seine Liste. Der Monat
  // quillt aus der Woche, die Woche zieht sich aus dem Monat zusammen (ADR 0008).
  // Ein Schalter, kein Wahlfeld: Wer das Gewählte trifft, will trotzdem
  // wechseln — am Gerät traf man es ständig (ADR 0031).
  alleIn('[data-kalender]').forEach(function (b) {
    b.addEventListener('click', function () {
      var wahl = state.kalender === 'woche' ? 'monat' : 'woche';
      var heute = heuteSchluessel(), anker = kalAnker(heute), alt = $('kalRaster');
      var vorher = wahl === 'woche' ? { geist: geist(alt), rect: alt.getBoundingClientRect(), reihe: reiheVon(anker) } : null;
      var leiste = $('kalLeiste'), leisteOben = leiste ? leiste.getBoundingClientRect().top : null;
      state.kalender = wahl;
      kalVersatz = versatzFuer(anker, heute);
      speichern();
      heldTakt = KAL_TAKT;
      render();
      kalFliessen(anker, vorher);
      leisteGleiten(leisteOben);
    });
  });
  $('kalZurueck').addEventListener('click', function () { kalBlaettern(kalVersatz - 1); });
  $('kalVor').addEventListener('click', function () { kalBlaettern(kalVersatz + 1); });
  if ($('kalHeute')) $('kalHeute').addEventListener('click', function () { kalBlaettern(0); });
  // Auf: ein Tropfen fällt vom Tag in die Liste. Zu: die Liste fließt zurück.
  alleIn('[data-kaltag]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = this.getAttribute('data-kaltag'), tag = this.getBoundingClientRect(), alt = $('kalLeiste');
      var zu = kalTag === k && alt, g = zu ? geist(alt) : null, r = zu ? alt.getBoundingClientRect() : null;
      kalTag = zu ? null : k;
      render();
      if (kalTag) tropfenFallen(tag, $('kalLeiste'));
      else leisteZurueck(g, r, tag);
    });
  });
  alleIn('[data-nachtrag]').forEach(function (b) {
    b.addEventListener('click', function () {
      umschaltenUndZeichnen(this.getAttribute('data-nachtrag'), kalTag);
    });
  });
}
