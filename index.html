/* == SCHRIFTEN:ENDE == */

/* ── Farben ────────────────────────────────────────────────────
   Die Palette aus dem Pflichtenheft. Hell steht im :root. Dunkel greift auf
   zwei Wegen: von selbst, wenn das Gerät dunkel ist und niemand «Hell» gewählt
   hat — und ausdrücklich über data-thema="dunkel". So stimmt die Farbe schon
   beim ersten Bild, bevor das Skript gelaufen ist. */
:root {
  --grund: #FAF9F5;
  --text: #141413;
  --text-2: #5E5D59;
  --flaeche: #F0EEE6;
  --flaeche-2: #E8E6DC;
  --linie: #B0AEA5;
  --akzent: #D97757;
  /* Schrift auf dem Akzent: dunkel in beiden Darstellungen — Weiß hätte 3,1 : 1. */
  --auf-akzent: #141413;
  --erledigt: #788C5D;
  --termin: #6A9BCC;
  --knopf: #141413;
  --knopf-text: #FAF9F5;
  --schatten: 0 1px 2px rgba(20, 20, 19, .06), 0 6px 20px rgba(20, 20, 19, .06);
  /* Glas (ADR 0014): eine Tönung, durch die der Grund verschwommen scheint,
     eine Kante und ein Lichtsaum oben. */
  --glas: rgba(250, 249, 245, .42);
  --glas-kante: rgba(255, 255, 255, .75);
  --glas-licht: rgba(255, 255, 255, .95);
  --glas-schleier: rgba(20, 20, 19, .10);
  /* Im Tropfen ist das Glas dichter und gefaßt, sonst sieht man es auf dem
     kurzen Weg nicht (ADR 0032). */
  --glas-tropfen: rgba(250, 249, 245, .86);
  --glas-rand: rgba(20, 20, 19, .16);
  --rund: 20px;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Poppins', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-thema="hell"]) {
    --grund: #141413;
    --text: #FAF9F5;
    --text-2: #B0AEA5;
    --flaeche: #1F1F1D;
    --flaeche-2: #2B2B28;
    --linie: #4A4945;
    --erledigt: #9DB283;
    --termin: #8FB6DD;
    --knopf: #FAF9F5;
    --knopf-text: #141413;
    --auf-akzent: #141413;
    --schatten: 0 1px 2px rgba(0, 0, 0, .3);
    --glas: rgba(43, 43, 40, .40);
    --glas-kante: rgba(255, 255, 255, .22);
    --glas-licht: rgba(255, 255, 255, .38);
    --glas-schleier: rgba(0, 0, 0, .38);
    --glas-tropfen: rgba(43, 43, 40, .9);
    --glas-rand: rgba(255, 255, 255, .2);
    color-scheme: dark;
  }
}
:root[data-thema="dunkel"] {
  --grund: #141413;
  --text: #FAF9F5;
  --text-2: #B0AEA5;
  --flaeche: #1F1F1D;
  --flaeche-2: #2B2B28;
  --linie: #4A4945;
  --erledigt: #9DB283;
  --termin: #8FB6DD;
  --knopf: #FAF9F5;
  --knopf-text: #141413;
  --auf-akzent: #141413;
  --schatten: 0 1px 2px rgba(0, 0, 0, .3);
  --glas: rgba(43, 43, 40, .40);
  --glas-kante: rgba(255, 255, 255, .22);
  --glas-licht: rgba(255, 255, 255, .38);
  --glas-schleier: rgba(0, 0, 0, .38);
  --glas-tropfen: rgba(43, 43, 40, .9);
  --glas-rand: rgba(255, 255, 255, .2);
  color-scheme: dark;
}

/* ── Grundlage ─────────────────────────────────────────────── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--text);
  font: 17px/1.55 var(--serif);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  transition: background-color .45s ease, color .45s ease;
}
/* Hell ↔ Dunkel tropft aus dem Schalter (ADR 0025, 0036): Die neue Darstellung ist
   eine runde Scheibe, die von dort über den Bildschirm wächst. Ihr Kontrast
   steigt dabei langsam — sie blendet in der Scheibe von durchsichtig auf voll,
   statt hart gegen die alte zu stehen (ADR 0027). Währenddessen ruhen alle
   Übergänge, sonst blendete es doppelt. */
html.thema-tropft *, html.thema-tropft *::before, html.thema-tropft *::after { transition: none !important; }
html.thema-tropft::view-transition-old(root),
html.thema-tropft::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.thema-tropft::view-transition-new(root) {
  animation: thema-tropfen var(--thema-dauer, 1300ms) cubic-bezier(.35, 0, .25, 1) both;
}
@keyframes thema-tropfen {
  from { clip-path: circle(0px at var(--thema-x, 100%) var(--thema-y, 0px)); opacity: 0; }
  to { clip-path: circle(var(--thema-r, 150vmax) at var(--thema-x, 100%) var(--thema-y, 0px)); opacity: 1; }
}
/* Der Tropfen folgt seinem Träger (ADR 0037): dem Knauf im Kopf, der Markierung in
   den Einstellungen. Der Träger ist eine eigene Ebene über beiden Bildern und
   gleitet im ersten Drittel hinüber; hinter ihm färbt sich, was er überstreicht
   (eine Spur, so breit wie er, `--spur-1`). Danach läuft die Spur nach allen
   Seiten über den Bildschirm aus (`--spur-2`). Die Spur ist die Fläche um den Weg
   des Trägers, darum bleibt sie rund, während sie wächst. */
html.thema-tropft.thema-folgt::view-transition-new(root) {
  animation: thema-spur var(--thema-dauer, 1560ms) linear both;
}
@keyframes thema-spur {
  0% { clip-path: var(--spur-0); opacity: 0; animation-timing-function: cubic-bezier(.45, 0, .25, 1); }
  33.333% { clip-path: var(--spur-1); opacity: .5; animation-timing-function: cubic-bezier(.35, 0, .25, 1); }
  100% { clip-path: var(--spur-2); opacity: 1; }
}
html.thema-folgt::view-transition-group(thema-traeger),
html.thema-folgt::view-transition-group(thema-oben-0),
html.thema-folgt::view-transition-group(thema-oben-1),
html.thema-folgt::view-transition-group(thema-oben-2) {
  animation-duration: calc(var(--thema-dauer, 1560ms) / 3);
  animation-timing-function: cubic-bezier(.45, 0, .25, 1);
}
h1, h2, h3, button, .etikett { font-family: var(--sans); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
button {
  font: inherit;
  font-family: var(--sans);
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
svg { display: block; }

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
    calc(env(safe-area-inset-bottom) + 88px) calc(env(safe-area-inset-left) + 16px);
}

/* ── Kopf ──────────────────────────────────────────────────── */
#kopf {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 56px;
  margin-bottom: 16px;
}
.kopf-titel { flex: 1; min-width: 0; }
.kopf-titel h1 { font-size: 28px; line-height: 1.15; }
/* «Chilli» ist die Marke und steht vorn; «Journal» sagt nur, welche App (ADR 0010). */
.kopf-heim {
  display: inline-flex;
  align-items: flex-end;
  min-height: 44px;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  transition: transform .2s var(--feder, ease), opacity .2s ease;
}
.kopf-heim:active { transform: scale(.97); opacity: .75; }
.kopf-unter .kopf-heim { align-items: center; }
/* Der Auftritt beim Kaltstart (ADR 0029): Solange er läuft, steht nur der
   Schriftzug da; der Rest wartet unsichtbar und nimmt keinen Tipp an — ein Tipp
   irgendwohin überspringt ihn. */
html.auftritt #ansicht, html.auftritt .kopf-titel .datum, html.auftritt #themaKnopf,
html.auftritt #menuKnopf, html.auftritt #ticketKnopf { opacity: 0; }
html.auftritt body { pointer-events: none; }
html.auftritt #markeKnopf svg.wm { position: relative; z-index: 5; }
/* Der Schriftzug (ADR 0010). Abgelaufen wird nur mit .wm-los, einmal; die Flammen lodern immer. */
svg.wm { display: block; flex: none; color: var(--text); overflow: visible; }
.wm * { transform-box: fill-box; transform-origin: center; }
/* Gruppen, die nur verschieben und verkleinern, rechnen vom Nullpunkt aus. */
.wm .wm-ort { transform-box: view-box; transform-origin: 0 0; }
/* Breit gezogen: senkrechte Striche 4,2, waagrechte etwas feiner — wie mit der Feder. */
.wm-zug { fill: none; stroke: currentColor; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
.wm-glut { fill: var(--akzent); }
.wm-linie { fill: none; stroke: var(--akzent); stroke-width: 2.6; stroke-linecap: round; }
.wm-journal { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 17px; fill: var(--text-2); }
.wm-lodern { transform-origin: 50% 100%; animation: wmLodern 2.6s ease-in-out infinite; }
.wm-lodern.wm-l2 { animation-duration: 3.1s; animation-delay: -1.2s; }
.wm-schein { opacity: .18; animation: wmSchein 2.6s ease-in-out infinite; }
.wm-l2 .wm-schein { animation-duration: 3.1s; animation-delay: -1.2s; }
.wm-los .wm-schreiben { stroke-dasharray: 1; animation: wmSchreiben 1.2s cubic-bezier(.45, 0, .25, 1) both; }
.wm-los .wm-auf { animation: wmAuf .6s cubic-bezier(.2, .8, .3, 1) both; }
.wm-los .wm-aufflammen { transform-origin: 50% 100%; animation: wmAufflammen .9s cubic-bezier(.2, .8, .3, 1) both; }
.wm-los .wm-a1 { animation-delay: var(--wm-v); }
.wm-los .wm-a2 { animation-delay: calc(var(--wm-v) + .25s); }
.wm-los .wm-j1 { animation-delay: .7s; }
.wm-los .wm-j2 { animation-delay: 1.35s; }
@keyframes wmAufflammen {
  0% { opacity: 0; transform: translateY(5px) scale(.3, 0); }
  45% { opacity: 1; transform: translateY(-1px) scale(.85, 1.35); }
  70% { transform: scale(1.05, .9); }
  100% { opacity: 1; transform: none; }
}
@keyframes wmLodern {
  0%, 100% { transform: none; }
  22% { transform: scale(.94, 1.08) skewX(-3deg); }
  48% { transform: scale(1.04, .95) skewX(2deg); }
  74% { transform: scale(.97, 1.05) skewX(-1.5deg); }
}
@keyframes wmSchein { 0%, 100% { opacity: .1; } 45% { opacity: .26; } }
@keyframes wmSchreiben { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes wmAuf { from { opacity: 0; transform: translateY(-5px) scale(.6); } to { opacity: 1; transform: none; } }

.kopf-titel .datum { font-style: italic; color: var(--text-2); font-size: 15px; }
.kopf-unter h1 { font-size: 22px; }
.kopf-unter .kopf-heim { font-size: 22px; font-weight: 600; }
.rund {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--flaeche);
  transition: transform .15s ease, background-color .3s ease;
}
.rund:active { transform: scale(.92); }
.rund svg { width: 22px; height: 22px; }
/* Der Sonne/Mond-Schalter: ein Schieber wie in den iOS-Einstellungen. Beide
   Symbole stehen immer da, der Knauf liegt unter dem, was gilt — so sieht man
   die Lage und den anderen Weg zugleich. Gleiche Machart wie `.wahl`. */
.thema-schalter {
  position: relative;
  flex: none;
  width: 84px;
  height: 44px;
  padding: 0 4px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--flaeche-2);
}
.thema-schalter .knauf {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grund);
  box-shadow: var(--schatten);
  transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), background-color .3s ease;
}
.thema-schalter[aria-checked="true"] .knauf { transform: translateX(40px); }
.thema-schalter .seite {
  position: relative;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  color: var(--text-2);
  transition: color .3s ease;
}
.thema-schalter .seite svg { width: 20px; height: 20px; }
.thema-schalter[aria-checked="false"] .hell,
.thema-schalter[aria-checked="true"] .dunkel { color: var(--akzent); }

/* ── Hinweis: neue Fassung ─────────────────────────────────── */
#swNeu {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 16px;
  padding: 10px 10px 10px 16px;
  border-radius: 14px;
  background: var(--flaeche-2);
  font-family: var(--sans);
  font-size: 15px;
}
#swNeu[hidden] { display: none; }
#swNeu .text { flex: 1; }
#swNeu button { min-height: 44px; padding: 0 14px; border-radius: 22px; font-weight: 600; }
#swLaden { background: var(--knopf); color: var(--knopf-text); }

/* ── Kacheln, Knöpfe ───────────────────────────────────────── */
.kachel {
  background: var(--flaeche);
  border-radius: var(--rund);
  padding: 20px;
  box-shadow: var(--schatten);
  transition: background-color .3s ease;
}
.knopf {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 24px;
  font-weight: 600;
  font-size: 16px;
  background: var(--knopf);
  color: var(--knopf-text);
  transition: transform .15s ease, opacity .15s ease;
}
.knopf:active { transform: scale(.96); }
.knopf svg { width: 20px; height: 20px; }
.knopf.zart { background: var(--flaeche-2); color: var(--text); }

/* ── Dashboard, leer ───────────────────────────────────────── */
.willkommen { text-align: center; padding: 32px 24px 28px; }
#chiliFigur {
  width: 148px;
  height: 148px;
  margin: 0 auto 8px;
  display: block;
  animation: wippen 3.2s ease-in-out infinite;
  transform-origin: 50% 90%;
}
@keyframes wippen {
  0%, 100% { transform: rotate(-3deg) translateY(0); }
  50% { transform: rotate(3deg) translateY(-6px); }
}
.willkommen h2 { font-size: 22px; margin-bottom: 8px; }
.willkommen p { margin: 0 auto 22px; max-width: 30ch; color: var(--text-2); }
/* Ein Abschnitt ohne Inhalt: ein Satz, darunter der erste Schritt. */
.kachel.leer p { margin: 0 0 14px; color: var(--text-2); }
.kachel.leer .knopf { width: 100%; }

/* ── Ringe ─────────────────────────────────────────────────────
   Eine Spur und eine Füllung im Akzent. Die Füllung beginnt oben und läuft
   im Uhrzeigersinn; ringeFuellen() läßt sie vom alten Wert herüberlaufen. */
.ring { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.2; }
.ring-spur { stroke: var(--flaeche-2); }
.ring-fuell { stroke: var(--akzent); transition: stroke-dashoffset .7s cubic-bezier(.3, .8, .3, 1); }

/* ── Dashboard: Tagesring ──────────────────────────────────── */
.held { position: relative; z-index: 0; padding: 16px 14px 14px; margin-bottom: 22px; }
.held-kopf { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.held-kopf .wahl { flex: none; }
.held-kopf .wahl button { flex: none; padding: 0 12px; font-size: 14px; }
.tagesring { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; }
.tr-bild { position: relative; width: 88px; height: 88px; flex: none; }
.tagesring #chiliFigur {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 56px;
  height: 56px;
  margin: -30px 0 0 -28px;
}
/* Abgehakt: Die Chili flammt kurz auf — sie reckt sich, glüht im Akzent und
   flackert aus. Danach wippt sie weiter wie zuvor; das Wippen wartet, bis das
   Flammen vorbei ist, sonst stritten beide um transform. */
#chiliFigur.flammt { animation: flammen .9s ease-out, wippen 3.2s ease-in-out .9s infinite; }
/* Der letzte Haken des Tages: Sie lodert — zweimal, höher und heißer. */
#chiliFigur.lodert { animation: lodern 1.5s ease-out, wippen 3.2s ease-in-out 1.5s infinite; }
@keyframes flammen {
  0%, 100% { transform: none; filter: drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent) saturate(1); }
  18% { transform: scale(1.22) translateY(-6px) rotate(-5deg); filter: drop-shadow(0 0 4px var(--akzent)) drop-shadow(0 -4px 16px var(--akzent)) saturate(1.4); }
  38% { transform: scale(1.08) translateY(-2px) rotate(4deg); filter: drop-shadow(0 0 2px var(--akzent)) drop-shadow(0 -6px 22px var(--akzent)) saturate(1.3); }
  58% { transform: scale(1.15) translateY(-4px) rotate(-2deg); filter: drop-shadow(0 0 3px var(--akzent)) drop-shadow(0 -3px 14px var(--akzent)) saturate(1.35); }
}
@keyframes lodern {
  0%, 100% { transform: none; filter: drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent) saturate(1); }
  12% { transform: scale(1.32) translateY(-9px) rotate(-7deg); filter: drop-shadow(0 0 6px var(--akzent)) drop-shadow(0 -6px 24px var(--akzent)) saturate(1.5); }
  26% { transform: scale(1.12) translateY(-3px) rotate(5deg); filter: drop-shadow(0 0 3px var(--akzent)) drop-shadow(0 -8px 30px var(--akzent)) saturate(1.35); }
  42% { transform: scale(1.36) translateY(-11px) rotate(-4deg); filter: drop-shadow(0 0 7px var(--akzent)) drop-shadow(0 -10px 34px var(--akzent)) saturate(1.55); }
  60% { transform: scale(1.14) translateY(-4px) rotate(3deg); filter: drop-shadow(0 0 4px var(--akzent)) drop-shadow(0 -5px 20px var(--akzent)) saturate(1.4); }
  78% { transform: scale(1.06) translateY(-1px) rotate(-1deg); filter: drop-shadow(0 0 2px var(--akzent)) drop-shadow(0 -2px 10px var(--akzent)) saturate(1.2); }
}
.tr-text {
  min-width: 0;
  display: block;
  padding: 6px 10px 6px 6px;
  margin: -6px -10px -6px -6px;
  border-radius: 14px;
  text-align: left;
  transition: transform .15s ease, background-color .2s ease;
}
/* «Heute» führt den Kalender nach Hause — ein Tipp, kein eigener Knopf. */
.tr-text:active { transform: scale(.97); background: var(--flaeche-2); }
.tr-text > span { display: block; }
/* «Heute» ist eine Pille: Man sieht ihr an, daß sie sich tippen läßt. Orange
   auf Wunsch des Nutzers (ADR 0023) — getönt, nicht gefüllt. */
.tr-text > .heute-pille {
  display: inline-block;
  margin-bottom: 4px;
  padding: 3px 11px 2px;
  border-radius: 999px;
  color: var(--akzent);
  background: color-mix(in srgb, var(--akzent) 16%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--akzent) 45%, transparent);
}
.etikett {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-2);
}
.tr-zahl {
  font-family: var(--sans);
  font-size: 26px;
  font-weight: 600;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.tr-satz { margin: 2px 0 0; font-size: 15px; color: var(--text-2); font-family: var(--serif, inherit); }

/* ── Dashboard: Gewohnheiten ───────────────────────────────── */
.gw-liste { display: flex; flex-direction: column; gap: 10px; }
.gw-kachel {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 6px 6px 4px;
  border-radius: var(--rund);
  background: var(--flaeche);
  box-shadow: var(--schatten);
  transition: background-color .3s ease, box-shadow .3s ease;
}
/* Nie zweimal: Gestern verpaßt, heute noch offen — die Kachel trägt einen Rand. */
.gw-kachel.warnen { box-shadow: inset 0 0 0 2px var(--akzent), var(--schatten); }
.gw-liste.gedimmt .gw-kachel { opacity: .6; }
.gw-haken {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 76px;
  padding: 6px 8px;
  border-radius: 16px;
  text-align: left;
  transition: transform .15s ease;
  /* Lange drücken öffnet die Gewohnheit — dabei soll iOS weder Text markieren
     noch sein eigenes Menü aufziehen. */
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.gw-haken:active { transform: scale(.98); }
/* Wer hält, sieht die Kachel langsam einsinken. Erst nach einer kurzen Frist,
   sonst zuckt jede Kachel, über die der Daumen beim Blättern streicht. */
.gw-haken.halten { transform: scale(.95); transition: transform .35s ease .15s; }
.gw-ring { position: relative; width: 54px; height: 54px; flex: none; }
.gw-scheibe {
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--flaeche-2);
  color: var(--linie);
  transition: background-color .25s ease, color .25s ease;
}
.gw-scheibe svg { width: 20px; height: 20px; }
/* Zähler: die Zahl von heute in der Scheibe, «−» daneben (ADR 0038). */
.gw-zahl { font-family: var(--sans); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gw-zahl.lang { font-size: 12px; letter-spacing: -.02em; }
.zaehl-felder { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gw-minus { flex: none; margin-right: 6px; background: var(--flaeche-2); color: var(--text); }
.gw-kachel.zaehlt.gerade .gw-scheibe { animation: abgehakt .5s cubic-bezier(.3, 1.6, .5, 1); }
/* Timer: Das Fenster ist Glas wie der Hinweis; groß der Ring mit der Restzeit. */
.timer-karte h2 { margin: 4px 44px 0; font-family: var(--sans); font-size: 18px; font-weight: 600; }
.timer-ton { position: absolute; top: 8px; right: 8px; background: transparent; }
.timer-ton[aria-pressed="false"] { color: var(--text-2); }
.timer-bild { position: relative; width: min(56vw, 210px); aspect-ratio: 1; margin: 12px auto 4px; }
.timer-bild .ring { width: 100%; height: 100%; }
.timer-bild .ring circle { stroke-width: 2.2; }
/* Im Ring stehen die Zahlen und darunter der Pausenknopf (ADR 0041). */
.timer-mitte { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; padding-top: 50px; }
.timer-zeit { font-family: var(--sans); font-size: 40px; font-weight: 600; line-height: 1.1;
  font-variant-numeric: tabular-nums; }
.timer-karte .klein { margin: 0 0 12px; }
.timer-pause { width: 44px; height: 44px; background: var(--flaeche-2); color: var(--text); }
.timer-pause svg { width: 20px; height: 20px; }
.timer-karte.pausiert .timer-zeit { opacity: .5; }
.gw-kachel.erledigt .gw-scheibe { background: var(--erledigt); color: var(--grund); }
.gw-kachel.gerade.erledigt .gw-scheibe { animation: abgehakt .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes abgehakt {
  0% { transform: scale(.55); }
  100% { transform: scale(1); }
}
.gw-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.gw-name { font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.gw-info { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.gw-warnung { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 600; }
.gw-warnung::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--akzent); }
.gw-punkte { display: flex; gap: 6px; margin-top: 5px; }
.punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--linie); opacity: .35; }
.punkt.erledigt { background: var(--erledigt); opacity: 1; }
.punkt.verpasst { background: transparent; box-shadow: inset 0 0 0 1.5px var(--linie); opacity: 1; }
.punkt.heute { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-2); opacity: 1; }

/* ── Dashboard: Abgewöhnen ─────────────────────────────────────
   Dieselbe Kachel, eine Zeile Knöpfe darunter. Die Zahl läuft live und
   springt dank gleich breiter Ziffern nicht. */
.ab-kachel { flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; }
.ab-kachel.welle { box-shadow: inset 0 0 0 2px var(--akzent), var(--schatten); }
.ab-scheibe { color: var(--akzent); }
.ab-frei { font-size: 15px; color: var(--text-2); }
.ab-zahl { font-family: var(--sans); font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.ab-knoepfe { display: flex; gap: 8px; padding: 0 2px 2px; }
.ab-knopf {
  flex: 1;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 14px;
  background: var(--flaeche-2);
  font-size: 15px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  transition: transform .15s ease;
}
.ab-knopf:active { transform: scale(.96); }
.ab-knopf svg { width: 18px; height: 18px; color: var(--akzent); }

/* ── Drang: die Welle ──────────────────────────────────────────
   Der Ring läuft in zehn Minuten leer, Sekunde für Sekunde, linear. */
.welle { text-align: center; padding-top: 4px; }
.welle-bild { position: relative; width: min(72vw, 300px); aspect-ratio: 1; margin: 10px auto 8px; }
.welle-ring circle { stroke-width: 2.2; }
.welle-fuell { transition: stroke-dashoffset 1s linear; }
.welle #chiliFigur { position: absolute; left: 28%; top: 26%; width: 44%; height: 44%; margin: 0; }
.welle-zeit { font-family: var(--sans); font-size: 44px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.welle-satz { max-width: 32ch; margin: 8px auto 20px; color: var(--text-2); font-style: italic; }
.welle .knopfreihe { max-width: 380px; margin: 0 auto; }
/* Abbrechen ist kein dritter Ausgang neben Gewonnen und Nachgegeben — es
   steht leise darunter, für den Tipp aus Versehen. */
.welle-ab {
  min-height: 44px;
  margin: 10px auto 0;
  padding: 0 16px;
  border-radius: 22px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-2);
}
.welle-ab:active { background: var(--flaeche-2); }

/* ── Rückfall ──────────────────────────────────────────────── */
.rf-satz { margin: 4px 0 0; }
.rf-zeile { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 0; }
.rf-zeile + .rf-zeile { border-top: 1px solid var(--flaeche-2); }

/* ── Journal ───────────────────────────────────────────────────
   Sonntags eine Kachel auf dem Dashboard, gebaut wie die der Gewohnheit; im
   Journal die Wochen untereinander, die neueste oben. Antworten behalten ihre
   Absätze. */
.jr-scheibe { inset: 7px; color: var(--akzent); }
.jr-kachel.erledigt .jr-scheibe { background: var(--erledigt); color: var(--grund); }
.jr-liste { display: flex; flex-direction: column; gap: 10px; }
.jr-eintrag {
  display: block;
  width: 100%;
  text-align: left;
  padding: 16px 18px;
  border-radius: var(--rund);
  background: var(--flaeche);
  box-shadow: var(--schatten);
  transition: transform .15s ease;
}
.jr-eintrag:active { transform: scale(.98); }
.jr-woche { font-family: var(--sans); font-size: 15px; font-weight: 600; }
.jr-frage { display: block; margin: 10px 0 2px; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text-2); }
.jr-antwort { display: block; margin: 0; font: 17px/1.45 var(--serif); white-space: pre-line; overflow-wrap: anywhere; }
.jr-antwort.leer { color: var(--text-2); font-style: italic; }
.jr-zahlen, .jr-satz { margin: 4px 0 0; color: var(--text-2); font-size: 15px; }
.jr-leer { margin: 0; color: var(--text-2); }
.jr-lesen .jr-frage:first-child { margin-top: 0; }
.kal-kopf.jr-wahl { margin: -8px -8px 4px; }
.jr-wahl .rund:disabled { opacity: .3; }
.jr-vergeben { margin-top: 8px; }
#jrSpeichern:disabled { opacity: .4; }
.rf-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rf-wann { font-family: var(--sans); font-size: 15px; font-variant-numeric: tabular-nums; }
.rf-notiz { font-size: 14px; font-style: italic; color: var(--text-2); overflow-wrap: anywhere; }
.rf-loeschen {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 14px;
  background: var(--flaeche-2);
  font-size: 14px;
  font-weight: 500;
}
.rf-leer { margin: 0; }

/* ── Dashboard: Kalender ───────────────────────────────────── */
.kal-kopf { display: flex; align-items: center; gap: 4px; margin: 10px 0 6px; }
.kal-kopf .rund { background: transparent; }
.kal-titel {
  flex: 1;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', system-ui, sans-serif;
  font-weight: 500;
  font-size: 15px;
  text-align: center;
  border-radius: 12px;
}
button.kal-titel { background: var(--flaeche-2); margin: 0 6px; }
.kal-raster, .kal-wtage { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
/* Im Monat steht über jeder Woche ein Strich quer durch den Kalender, vorn auf
   ihm klein die Kalenderwoche (ADR 0025). */
.kal-raster { position: relative; }
.kal-kw-zeile {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 14px;
  /* Bis an den Rand der Karte, die KW ganz außen, der Strich entsprechend
     länger (ADR 0026). */
  margin: 2px -8px 0 -10px;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.kal-kw-zeile::after { content: ''; flex: 1; height: 1px; background: var(--linie); opacity: .6; }
.kal-wtage { margin-bottom: 3px; }
.kal-raster.neu { animation: kalNeu .3s ease; }
@keyframes kalNeu { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.kal-wt {
  text-align: center;
  font-family: 'Poppins', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  padding: 2px 0 4px;
}
.kal-tag {
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border-radius: 12px;
  font-variant-numeric: tabular-nums;
  transition: background-color .25s ease, box-shadow .2s ease;
}
.kal-tag { gap: 4px; }
.kal-raster.woche .kal-tag { min-height: 60px; }
.kal-zahl {
  min-width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-family: 'Poppins', system-ui, sans-serif;
  font-size: 15px;
  font-weight: 500;
}
/* Ein Punkt je Gewohnheit, wie im Monat beim iPhone: gefüllt = erledigt,
   Ring = offen oder verpaßt, blasser Ring = kommt noch. Grün heißt erledigt. */
.kal-punkte {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 3px;
  max-width: 42px;
  min-height: 6px;
}
.kp { width: 6px; height: 6px; border-radius: 50%; }
.kal-raster.woche .kp { width: 8px; height: 8px; }
.kp.erledigt { background: var(--erledigt); }
.kp.offen { box-shadow: inset 0 0 0 1.5px var(--text-2); }
.kp.verpasst { box-shadow: inset 0 0 0 1.5px var(--linie); }
.kp.kommt { box-shadow: inset 0 0 0 1.5px var(--linie); opacity: .45; }
/* Ein Tag, an dem alles erledigt ist, trägt seine Zahl in Grün. */
.kal-tag.voll .kal-zahl { color: var(--erledigt); font-weight: 600; }
.kal-tag.zukunft { color: var(--text-2); }
/* Heute trägt seine Zahl in einem Kreis aus dem Akzent, wie beim iPhone. */
.kal-tag.heute .kal-zahl { background: var(--akzent); color: var(--auf-akzent); font-weight: 600; }
/* Der Kreis 30 % kleiner als die Zahl Platz hat (ADR 0025): Er liegt dahinter,
   die Zahl wird nicht kleiner, und nichts in der Zeile springt. */
.kal-tag.heute .kal-zahl { background: none; position: relative; }
.kal-tag.heute .kal-zahl::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  border-radius: 50%;
  background: var(--akzent);
  transform: scale(.7);
  z-index: -1;
}
.kal-tag.heute .kal-zahl { z-index: 0; isolation: isolate; }
.kal-tag.gewaehlt { box-shadow: inset 0 0 0 2px var(--akzent); }
/* Im Monat steht der Rahmen nicht knapp unter den Punkten (ADR 0026). */
.kal-raster.monat .kal-tag { padding: 5px 0 9px; }
.kal-tag.fremd { visibility: hidden; }
.kal-leiste { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--flaeche-2); }
.kal-leiste-kopf { font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; font-size: 15px; margin: 0 4px 6px; }
.kal-zeile {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px;
  border-radius: 12px;
  text-align: left;
}
.kal-haken {
  width: 28px;
  height: 28px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--linie);
  color: transparent;
  transition: background-color .2s ease, color .2s ease;
}
.kal-haken svg { width: 16px; height: 16px; }
.kal-zeile.erledigt .kal-haken { background: var(--erledigt); color: var(--grund); box-shadow: none; }
.kal-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.kal-status { font-size: 13px; color: var(--text-2); }
.kal-leiste .klein { margin: 6px 4px 0; }
.kal-leiste .kal-voraus { margin: 0 4px 4px; }
/* Ein kommender Tag zeigt, was dran ist, ohne Haken zum Tippen. */
.kal-zeile.kommt .kal-haken { box-shadow: inset 0 0 0 1.5px var(--linie); opacity: .5; }
.kal-zeile.still { opacity: .55; }

/* ── Termine ───────────────────────────────────────────────────
   Eine Zeile je Termin: links die Zeit, rechts Titel und Ort. Blau heißt
   Termin — als Strich und als Punkt, nie als Schriftgrund. */
.tm-liste {
  display: flex;
  flex-direction: column;
  padding: 4px 6px;
  border-radius: var(--rund);
  background: var(--flaeche);
  box-shadow: var(--schatten);
}
.tm-liste.flach { padding: 0; background: none; box-shadow: none; margin-bottom: 4px; }
.tm-zeile {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 8px;
  border-radius: 14px;
  text-align: left;
  transition: transform .15s ease;
}
.tm-zeile:active { transform: scale(.98); }
/* Lange drücken öffnet den Termin, wie bei der Kachel: kein markierter Text,
   kein Menü von iOS, und wer hält, sieht die Zeile einsinken (ADR 0043). */
.tm-zeile { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.tm-zeile.halten { transform: scale(.97); transition: transform .35s ease .15s; }
/* Nach dem langen Druck liegt der Finger noch auf der neuen Ansicht — bis er
   sich hebt, markiert iOS dort nichts (ADR 0043). */
.lang-haelt, .lang-haelt * { -webkit-touch-callout: none !important; -webkit-user-select: none !important;
  user-select: none !important; }
.tm-zeile + .tm-zeile, .tm-reihe + .tm-reihe { border-top: 1px solid var(--flaeche-2); border-radius: 0; }
/* Ein Termin, der da war, läßt sich abhaken wie eine Kachel: rechts in der
   Zeile der Haken, grün wie alles Erledigte; erledigt tritt die Zeile zurück,
   der Haken nicht (ADR 0041, 0042). */
.tm-reihe .tm-text { flex: 1; }
.tm-haken { flex: none; width: 36px; height: 36px; margin-left: auto; display: flex; align-items: center; justify-content: center; }
.tm-reihe.erledigt .kal-haken { background: var(--erledigt); color: var(--grund); box-shadow: none; }
.tm-reihe.erledigt .tm-zeit, .tm-reihe.erledigt .tm-text { opacity: .55; }
.tm-reihe.erledigt .tm-titel { text-decoration: line-through; }
.tm-reihe.gerade.erledigt .kal-haken { animation: abgehakt .5s cubic-bezier(.3, 1.6, .5, 1); }
/* Eine Gewohnheit im Export trägt keinen blauen Strich — Blau heißt Termin. */
.ex-gw .tm-zeit { border-left-color: var(--linie); }
.ex-gw.aus .tm-zeit { color: var(--text-2); }
.ex-gw.aus .tm-zeit svg { width: 18px; height: 18px; }
.tm-zeit {
  flex: none;
  width: 60px;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 10px;
  border-left: 3px solid var(--termin);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  box-sizing: content-box;
}
.tm-zeit.ganz { font-size: 12px; font-weight: 500; color: var(--text-2); }
.tm-bis { font-size: 13px; font-weight: 500; color: var(--text-2); }
.tm-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tm-titel { font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.tm-mehr { font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
.kp.termin { background: var(--termin); }
/* Export: Was schon im Kalender steht, tritt zurück (ADR 0011). */
.ex-leiste { display: flex; align-items: center; gap: 12px; margin: 0 4px 14px; font-size: 15px; color: var(--text-2); }
.ex-leiste span { flex: 1; min-width: 0; }
.ex-bearbeiten {
  min-height: 44px;
  padding: 0 18px;
  border: 0;
  border-radius: 22px;
  background: var(--flaeche-2);
  color: var(--text);
  font-weight: 500;
  font-size: 15px;
  flex: none;
}
.ex-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ex-kopf h2 { flex: 1; min-width: 0; margin: 0; }
.ex-alle-text { font-family: var(--sans); font-size: 14px; color: var(--text-2); }
.ex-bearbeiten[aria-pressed="true"] { background: var(--knopf); color: var(--knopf-text); }
.ex-zeile { transition: opacity .25s ease; }
/* Die Wege hinaus kommen und gehen als Tropfen (teilTropfen). flow-root, damit
   die Höhe, die sich aufzieht, den Rand der Knopfreihe mitzählt. */
.ex-wege { display: flow-root; }
.ex-wege[hidden] { display: none; }
.ex-aufheben { margin-top: 10px; }
.ex-aufheben .knopf { width: 100%; }
.ex-zeile.ex-alt { opacity: .5; }
.ex-zeile.ex-alt.ex-geaendert { opacity: .72; }
.ex-zeile[aria-disabled="true"] { cursor: default; }
.ex-haken {
  flex: none;
  align-self: center;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-left: 8px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px var(--linie);
  color: var(--knopf-text);
}
.ex-haken.an { background: var(--knopf); box-shadow: none; }
.ex-haken svg { width: 15px; height: 15px; }
.kal-neu {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  padding: 4px 6px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-2);
}
.kal-neu svg { width: 18px; height: 18px; color: var(--akzent); transition: transform .3s var(--feder, ease); }
/* Offen dreht sich das Plus zum Kreuz: Ein zweiter Tipp klappt die Frage zu. */
.kal-neu[aria-expanded="true"] svg { transform: rotate(45deg); }
.tm-schalterzeile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  margin: 10px 4px 0;
  font-family: var(--sans);
  font-size: 16px;
}
/* Ein Schalter wie in den iOS-Einstellungen; die Trefferfläche ist größer als
   die Spur. */
.schalter { flex: none; width: 64px; height: 44px; display: grid; place-items: center; }
.schalter-spur {
  position: relative;
  width: 51px;
  height: 31px;
  border-radius: 16px;
  background: var(--flaeche-2);
  transition: background-color .2s ease;
}
.schalter-knauf {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: var(--grund);
  box-shadow: var(--schatten);
  transition: transform .25s cubic-bezier(.3, 1.4, .5, 1);
}
.schalter[aria-checked="true"] .schalter-spur { background: var(--knopf); }
.schalter[aria-checked="true"] .schalter-knauf { transform: translateX(20px); }
.tm-zeiten { margin-top: 6px; align-items: center; }
.tm-zeiten[hidden], .klein[hidden] { display: none; }
.tm-strich { flex: none; font-family: var(--sans); font-size: 14px; color: var(--text-2); }
.tm-wdh button { font-size: 14px; min-width: 0; }
.tm-etikett { display: block; font-family: var(--sans); font-size: 14px; color: var(--text-2); margin: 0 4px 6px; }
.auswahl { position: relative; }
.auswahl select { padding-right: 44px; }
.auswahl svg {
  position: absolute;
  right: 16px;
  top: 50%;
  width: 18px;
  height: 18px;
  margin-top: -9px;
  transform: rotate(90deg);
  color: var(--text-2);
  pointer-events: none;
}

/* ── Rückblick: Heatmap ────────────────────────────────────────
   Spalten sind Wochen, Zeilen Mo–So. Grün heißt erledigt (beim Abgewöhnen:
   frei), blasse Chili verpaßt (Rückfall) — wie die Warnung der Kachel.
   Das Raster ist Überblick und wählt nur die Woche; die Tage darunter sind
   die Ziele für den Finger (ADR 0015). */
.kachel.hm { padding: 16px 14px 12px; }
.hm-raster {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: auto repeat(7, auto);
  grid-template-columns: auto repeat(26, minmax(0, 1fr));   /* 26 = HM_WOCHEN */
  gap: 2px;
  position: relative;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.hm-monat, .hm-wt {
  font-family: var(--sans);
  font-size: 10px;
  line-height: 1;
  color: var(--text-2);
  white-space: nowrap;
}
.hm-monat { height: 14px; overflow: visible; }
.hm-wt { padding-right: 4px; align-self: center; }
.hm-z { display: block; aspect-ratio: 1; border-radius: 2px; background: var(--flaeche-2); }
.hm-z.erledigt, .hm-z.sauber { background: var(--erledigt); }
.hm-z.verpasst, .hm-z.rueckfall { background: var(--akzent); opacity: .45; }
.hm-z.vorher, .hm-z.start { opacity: .4; }
.hm-z.zukunft { visibility: hidden; }
.hm-z.offen { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-2); }
.hm-z.gewaehlt { outline: 2px solid var(--akzent); outline-offset: 1px; opacity: 1; }
.hm-rahmen {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 4px;
  box-shadow: 0 0 0 1.5px var(--text-2);
  pointer-events: none;
  transition: transform .3s var(--feder, ease);
}
.hm-legende {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 12px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--text-2);
}
.hm-legende > span { display: inline-flex; align-items: center; gap: 6px; }
.hm-legende .hm-z { width: 10px; }
.hm-kopf { margin: 14px 0 8px; }
.hm-kopf .rund:disabled { opacity: .3; }
.hm-tage { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.hm-tag {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 64px;
  border-radius: 12px;
  background: var(--grund);
  font-family: var(--sans);
  transition: box-shadow .2s ease;
}
.hm-tag-wt { font-size: 11px; color: var(--text-2); }
.hm-tag-zahl { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.hm-tag .hm-z { width: 12px; }
.hm-tag.heute .hm-tag-zahl { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.hm-tag.gewaehlt { box-shadow: inset 0 0 0 2px var(--akzent); }
.hm-tag:disabled { color: var(--text-2); opacity: .5; }
.hm-zeile { margin: 10px 0 0; font-size: 15px; min-height: 1.4em; font-variant-numeric: tabular-nums; }

/* ── Formular ──────────────────────────────────────────────── */
/* 17 px: Unter 16 px zoomt Safari beim Antippen ins Feld. */
.eingabe {
  width: 100%;
  min-height: 50px;
  padding: 10px 16px;
  border: 1.5px solid var(--flaeche-2);
  border-radius: 14px;
  background: var(--flaeche);
  color: var(--text);
  font: 17px/1.4 var(--serif);
  -webkit-appearance: none;
  appearance: none;
}
.eingabe:focus { outline: none; border-color: var(--akzent); }
.eingabe::placeholder { color: var(--text-2); opacity: .75; }
.abschnitt h2 label { cursor: pointer; }
textarea.eingabe { display: block; min-height: 96px; resize: vertical; }
.start-felder { display: flex; gap: 8px; }
.start-felder .eingabe { flex: 1; min-width: 0; }
.rh-teil { margin-top: 10px; }
.rh-teil[hidden] { display: none; }
.tage { display: flex; gap: 4px; }
.tage button {
  flex: 1;
  min-width: 0;
  min-height: 46px;
  border-radius: 14px;
  background: var(--flaeche-2);
  color: var(--text-2);
  font-size: 15px;
  font-weight: 500;
  transition: background-color .2s ease, color .2s ease;
}
.tage button[aria-pressed="true"] { background: var(--knopf); color: var(--knopf-text); }
.zaehler {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px;
  border-radius: 16px;
  background: var(--flaeche-2);
}
.zaehler .rund { background: var(--grund); box-shadow: var(--schatten); }
.zaehler .wert { font-family: var(--sans); font-weight: 600; font-variant-numeric: tabular-nums; }
.hinweis {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 0 0 22px;
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--flaeche);
  font-size: 15px;
}
.hinweis svg { width: 22px; height: 22px; flex: none; color: var(--akzent); margin-top: 1px; }

/* ── Menü ──────────────────────────────────────────────────── */
/* Das Menü klappt unter seinem Knopf auf, wie bei Chillingo — als Tropfen,
   der aus dem Knopf quillt (ADR 0008). Der Schleier dunkelt leicht ab; ein Tipp
   darauf schließt. Lage und Bewegung setzt `menueOeffnen()`. */
#menue {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(20, 20, 19, .18);
  opacity: 0;
  transition: opacity .22s ease;
}
#menue[hidden] { display: none; }
#menue.offen { opacity: 1; }
.blatt {
  position: absolute;
  top: 72px;
  right: 16px;
  width: max-content;
  min-width: 220px;
  max-width: calc(100vw - 32px);
  background: var(--grund);
  border-radius: 18px;
  padding: 6px;
  box-shadow: 0 2px 6px rgba(20, 20, 19, .10), 0 16px 40px rgba(20, 20, 19, .18);
  transform-origin: 100% 0;
  overflow: hidden;
}
.menue-liste { list-style: none; margin: 0; padding: 0; }
/* Der Gast des Menüknopfs, wenn der hinausgerollt ist (ADR 0041); solange er
   da ist, ist der Knopf es nicht (ADR 0043). */
.menue-gast-da #menuKnopf { visibility: hidden; }
.menue-gast { position: absolute; top: calc(env(safe-area-inset-top) + 12px); background: var(--grund);
  box-shadow: 0 2px 6px rgba(20, 20, 19, .10), 0 8px 20px rgba(20, 20, 19, .14); }
.menue-eintrag {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 48px;
  padding: 0 14px 0 10px;
  border-radius: 12px;
  text-align: left;
  font-size: 16px;
  font-weight: 500;
}
.menue-eintrag:active { background: var(--flaeche); }
.menue-eintrag svg { width: 22px; height: 22px; color: var(--akzent); }
.menue-eintrag .name { flex: 1; }
.bald {
  font-size: 12px;
  font-weight: 500;
  padding: 2px 10px;
  border-radius: 10px;
  background: var(--flaeche-2);
  color: var(--text-2);
}

/* ── Einstellungen ─────────────────────────────────────────── */
.abschnitt { margin-bottom: 22px; }
.abschnitt h2 {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-2);
  margin: 0 4px 8px;
}
.wahl {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 16px;
  background: var(--flaeche-2);
}
.wahl button {
  flex: 1;
  min-height: 44px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-2);
  transition: background-color .2s ease, color .2s ease;
}
.wahl button[aria-pressed="true"] { background: var(--grund); color: var(--text); box-shadow: var(--schatten); }
.zeile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
}
.zeile + .zeile { border-top: 1px solid var(--flaeche-2); }
.zeile .wert { font-family: var(--sans); font-size: 15px; color: var(--text-2); text-align: right; }
#swBereit.bereit { color: var(--erledigt); }
.knopfreihe { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.knopfreihe .knopf { width: 100%; }
.ex-leer-wege { margin-top: -8px; }
.klein { font-size: 14px; color: var(--text-2); margin: 10px 4px 0; }

/* ── Meldung ───────────────────────────────────────────────── */
/* Gezeigt wird jede Meldung im Glas (ADR 0019). #meldung hält nur den letzten
   Wortlaut fest, unsichtbar; vorgelesen wird die Karte (role="status"). */
#meldung { display: none; }

/* ── Hinweis ───────────────────────────────────────────────── */
/* Was man lesen muß, bevor es weitergeht: mittig, wartet auf «OK». Quillt als
   Tropfen aus dem Getippten (hinweisZeigen); der Schleier wie beim Menü. */
#hinweisBlatt, #timerBlatt {
  position: fixed;
  inset: 0;
  z-index: 22;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
/* Der Schleier blendet als eigene Schicht, nie das Blatt: Ein Vorfahr mit
   Deckkraft unter 1 wäre die Grenze des Glases — die Karte sähe dann nur den
   Schleier hinter sich, nicht die Seite, und bliebe matt (ADR 0014). */
#hinweisBlatt::before, #timerBlatt::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--glas-schleier);
  opacity: 0;
  transition: opacity .22s ease;
}
#hinweisBlatt[hidden], #timerBlatt[hidden] { display: none; }
#hinweisBlatt.offen::before, #timerBlatt.offen::before { opacity: 1; }
#hinweisBlatt:not(.offen), #timerBlatt:not(.offen) { pointer-events: none; }
.hinweis-karte { position: relative; }
.hinweis-karte {
  width: 100%;
  max-width: 340px;
  padding: 22px 20px 18px;
  border-radius: 18px;
  text-align: center;
}
/* Glas: Was dahinter liegt, scheint verschwommen und satter durch; die Kante
   faßt es, der Lichtsaum oben gibt die Wölbung. Die Karte trägt es, solange
   sie steht, die Hülle, solange sie tropft — der Geist darin ist dann klar,
   sonst läge Glas auf Glas (ADR 0014). */
.glas, .tropfen-huelle.glas {
  background: var(--glas);
  -webkit-backdrop-filter: blur(3px) saturate(190%);
  backdrop-filter: blur(3px) saturate(190%);
  box-shadow: inset 0 1px 0 var(--glas-licht), inset 0 0 0 1px var(--glas-kante),
    0 2px 6px rgba(20, 20, 19, .08), 0 18px 44px rgba(20, 20, 19, .20);
}
/* Unterwegs dichter, mit Rand und tieferem Schatten: Ein Glastropfen von 166 ms
   war am Gerät nicht als Tropfen zu sehen, nur als etwas, das wegging. Am Ziel
   blendet die Hülle zur Tönung der Karte über (`glasFarben`, ADR 0032). */
.tropfen-huelle.glas {
  background: var(--glas-tropfen);
  box-shadow: inset 0 1px 0 var(--glas-licht), inset 0 0 0 1.5px var(--glas-kante), 0 0 0 1px var(--glas-rand),
    0 4px 10px rgba(20, 20, 19, .14), 0 14px 32px rgba(20, 20, 19, .28);
}
.glas.im-tropfen { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
.hinweis-karte h2 { margin: 0 0 6px; font-family: var(--sans); font-size: 18px; font-weight: 600; }
.hinweis-karte p { margin: 0 0 18px; font-size: 16px; color: var(--text-2); }
.hinweis-karte .knopf { width: 100%; }
/* Den Fokus trägt die Karte, für Vorleser — ein Ring um «OK» sähe aus wie eine Wahl. */
.hinweis-karte:focus { outline: none; }
/* Die Bestätigung: dasselbe Glas, ein grüner Haken statt «OK» (ADR 0018). */
.hinweis-haken {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin: 0 auto 10px;
  border-radius: 50%;
  background: var(--erledigt);
  color: var(--grund);
}
.hinweis-haken[hidden] { display: none; }
.hinweis-haken.neutral { background: var(--flaeche-2); color: var(--text-2); }
.hinweis-haken svg { width: 24px; height: 24px; }
/* Die Zeichen bewegen sich einmal, wenn sie erscheinen (ADR 0035): Der Haken
   zeichnet sich, beim Hinweis fällt der Punkt als Tropfen und der Strich wächst,
   der Pfeil fällt in die Schale, das zweite Blatt schiebt sich aus dem ersten.
   Weich, ohne Ruck (ADR 0036), ein Viertel flotter als dort (ADR 0037) — fertig,
   bevor die Bestätigung geht. */
.zeichnet .z-strich, .gw-kachel.gerade.erledigt .gw-scheibe .z-strich, .tm-reihe.gerade.erledigt .z-strich {
  stroke-dasharray: 1;
  animation: z-zeichnen .53s .15s cubic-bezier(.45, 0, .25, 1) both;
}
.zeichnet .z-punkt { animation: z-fallen .41s cubic-bezier(.35, 0, .3, 1) both; }
.zeichnet[data-zeichen="hinweis"] .z-strich { animation-delay: .34s; }
.z-punkt { transform-box: fill-box; transform-origin: center; }
.zeichnet .z-pfeil { animation: z-pfeil .71s .09s cubic-bezier(.4, 0, .25, 1) both; }
.zeichnet .z-blatt { animation: z-blatt .6s .11s cubic-bezier(.35, 0, .25, 1) both; }
@keyframes z-zeichnen { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes z-fallen {
  0% { transform: translateY(-7px) scale(.6); opacity: 0; }
  60% { opacity: 1; }
  100% { transform: none; opacity: 1; }
}
@keyframes z-pfeil {
  0% { transform: translateY(-9px); opacity: 0; }
  40% { opacity: 1; }
  78% { transform: translateY(.8px); }
  100% { transform: none; opacity: 1; }
}
@keyframes z-blatt { from { transform: translate(-5px, -5px); } to { transform: none; } }
.hinweis-karte.bestaetigung p { margin-bottom: 4px; }
/* Eine Bestätigung ist so breit wie ihr Text, nicht wie der Bildschirm (ADR 0025). */
.hinweis-karte.bestaetigung { width: auto; min-width: 180px; padding-left: 28px; padding-right: 28px; }
.hinweis-karte.bestaetigung p:empty { display: none; }
.hinweis-karte .knopf[hidden] { display: none; }

/* ── Bewegung: Tropfen ─────────────────────────────────────────
   Nichts ploppt (ADR 0007). Die Ansicht liegt über dem Geist der alten; der
   Tropfen liegt in der Karte hinter ihrem Inhalt. `--feder` setzt das Skript. */
#ansicht { position: relative; z-index: 1; }
.geist { pointer-events: none; }
.tropfen { position: absolute; z-index: -1; background: var(--flaeche-2); pointer-events: none; }
/* Die Hülle eines Tropfens zwischen Ansicht und rundem Knopf: Sie ändert Lage,
   Größe und Ecken, ihr Inhalt (ein Geist) skaliert gleichmäßig mit. */
.tropfen-huelle {
  position: fixed;
  z-index: 25;
  overflow: hidden;
  background: var(--grund);
  pointer-events: none;
  box-shadow: 0 10px 30px rgba(20, 20, 19, .16);
}
.wahl { position: relative; }
.wahl button { position: relative; }
.wahl-marke {
  position: absolute;
  border-radius: 12px;
  background: var(--grund);
  box-shadow: var(--schatten);
  pointer-events: none;
}
.wahl.mit-marke button[aria-pressed="true"] { background: transparent; box-shadow: none; }
/* Wer einen Schalter drückt, sieht den Knauf sich strecken — wie unter iOS. */
.schalter-knauf { transition: transform .5s var(--feder, ease), width .3s var(--feder, ease); }
.schalter:active .schalter-knauf { width: 33px; }
.schalter[aria-checked="true"]:active .schalter-knauf { transform: translateX(14px); }
.thema-schalter .knauf { transition: transform .75s var(--feder, ease), width .45s var(--feder, ease), background-color .45s ease; }
.thema-schalter:active .knauf { width: 44px; }
.thema-schalter[aria-checked="true"]:active .knauf { transform: translateX(32px); }
.tage button { transition: background-color .2s ease, color .2s ease, transform .45s var(--feder, ease); }
.tage button:active { transform: scale(.9); }

/* Bewegung nur, wo sie erwünscht ist. */
/* ── Ticketknopf und Ticketblatt ───────────────────────────────
   Der Knopf schwebt unten rechts, von überall erreichbar; der Fußabstand von
   #app hält ihm den Platz frei. Das Blatt legt sich über die Ansicht, statt
   sie zu ersetzen — ein halb ausgefülltes Formular darunter bleibt stehen.
   Es quillt als Tropfen aus dem Knopf und fließt dorthin zurück (ADR 0020). */
#ticketKnopf {
  position: fixed;
  z-index: 15;
  right: calc(16px + env(safe-area-inset-right));
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--flaeche);
  color: var(--text-2);
  box-shadow: 0 2px 6px rgba(20, 20, 19, .10), 0 10px 24px rgba(20, 20, 19, .16);
  transition: transform .15s ease, color .2s ease;
}
#ticketKnopf svg { width: 24px; height: 24px; }
#ticketKnopf:active { transform: scale(.92); }
/* Ein angefangenes Ticket zeigt sich am Knopf — sonst wäre es vergessen. */
#ticketKnopf.hat-entwurf { color: var(--akzent); }
#ticketKnopf.hat-entwurf::after {
  content: '';
  position: absolute;
  top: 8px;
  right: 8px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--akzent);
}
#ticketBlatt {
  position: fixed;
  inset: 0;
  z-index: 21;
  display: flex;
  justify-content: center;
  /* Unten, beim Knopf, aus dem es tropft (ADR 0021). Die Tastatur legt iOS über
     Fixiertes; `--tastatur` hebt das Blatt um ihre Höhe (ticketTastatur). */
  align-items: flex-end;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px)
    calc(env(safe-area-inset-bottom) + 12px + var(--tastatur, 0px)) calc(env(safe-area-inset-left) + 12px);
}
#ticketBlatt::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--glas-schleier);
  opacity: 0;
  transition: opacity .22s ease;
}
#ticketBlatt[hidden] { display: none; }
#ticketBlatt.offen::before { opacity: 1; }
#ticketBlatt:not(.offen) { pointer-events: none; }
.ticket-karte {
  position: relative;
  width: 100%;
  max-width: 536px;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 18px;
  /* Glas wie Hinweis und Meldung (ADR 0024): Tönung, Unschärfe und Kante setzt .glas. */
}
/* Die Kante des Glases ist ein innerer Schatten, und der liegt unter allem, was
   in der Karte steht: Rollte die Karte selbst, schöbe sich ihr Inhalt über die
   Kante. Darum steht der Kopf, und nur was darunter liegt, rollt — mit Abstand
   zur Kante und an ihr ausgeblendet (ADR 0031). */
.ticket-karte > .tk-kopf { flex: none; margin: 14px 16px 0 20px; padding-bottom: 8px; }
.ticket-karte > .tk-kopf-liste { margin-left: 10px; }
.tk-rolle {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0 2px 2px;
  padding: 10px 14px 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 0 0 16px 16px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
}
.ticket-karte h2 { margin: 0; font-family: var(--sans); font-size: 18px; font-weight: 600; }
.tk-kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 0 8px 4px; }
.tk-alle {
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 22px;
  background: var(--flaeche-2);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 500;
  flex: none;
}
.ticket-karte .wahl, .ticket-karte .eingabe { margin-bottom: 10px; }
/* Leer ist der Fließtext so hoch wie das Titelfeld darüber, nie dünner (ADR 0026). */
.ticket-karte textarea.eingabe { min-height: 50px; resize: none; overflow-y: hidden; }
.tk-wahlen { display: flex; flex-direction: column; gap: 0; }
.tk-kopf-liste { justify-content: flex-start; gap: 4px; margin-left: -6px; }
.tk-kopf-liste .rund { background: transparent; }
.tk-kopf-liste .tk-alle { margin-left: auto; }
.tk-liste-blatt { display: flex; flex-direction: column; gap: 6px; }
/* Jede Zeile ist eine eigene Fläche — so sieht man sie einzeln auftropfen (ADR 0026). */
.tk-liste-blatt .tk-zeile { background: var(--flaeche); border-radius: 14px; }
.tk-liste-blatt .tk-zeile + .tk-zeile { border-top: 0; border-radius: 14px; }
.tk-liste-blatt.gedimmt { opacity: .6; }
.tk-etikett { margin: 14px 6px 6px; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text-2); }
.tk-leer { margin: 4px 6px 8px; }
.tk-wahlen > div { min-width: 0; }
.tk-wahlen select { font-size: 16px; }
.tk-knoepfe { display: flex; gap: 8px; margin-top: 4px; }
.tk-knoepfe .knopf { flex: 1; padding: 0 12px; }
.ticket-karte .knopfreihe { margin-top: 10px; }

/* ── Tickets und Sicherung ─────────────────────────────────── */
.tk-zeile {
  width: 100%;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 8px 10px;
  border-radius: 14px;
  text-align: left;
  transition: transform .15s ease;
}
.tk-zeile:active { transform: scale(.98); }
.tk-zeile + .tk-zeile { border-top: 1px solid var(--flaeche-2); border-radius: 0; }
.tk-titel { font-family: var(--sans); font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.tk-mehr { font-size: 14px; color: var(--text-2); }
.tk-art { font-family: var(--sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  color: var(--akzent); }
.tm-liste.gedimmt .tk-zeile { opacity: .6; }
.abschnitt > .knopf { width: 100%; }
.kachel > p:first-child { margin-top: 0; }
/* 16 px, nicht kleiner: Darunter zoomt iOS beim Tippen heran (ADR 0028). */
textarea.eingabe.code {
  min-height: 110px;
  font: 16px/1.35 ui-monospace, Menlo, monospace;
  overflow-wrap: anywhere;
}
.sc-scheibe { inset: 7px; color: var(--akzent); }
.hinweis-knoepfe { display: flex; gap: 8px; }
.hinweis-wahl { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.hinweis-wahl[hidden] { display: none; }
.hinweis-wahl .knopf { width: 100%; }
.hinweis-knoepfe .knopf { flex: 1; }
.hinweis-knoepfe .knopf[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
/* Dasselbe, wenn es in den Einstellungen abgeschaltet ist. */
:root[data-bewegung="aus"] *, :root[data-bewegung="aus"] *::before, :root[data-bewegung="aus"] *::after {
  animation: none !important;
  transition: none !important;
}
</style>
</head>
<body>
<div id="app">
  <header id="kopf"></header>
  <div id="swNeu" role="status" aria-live="polite" hidden>
    <span class="text">Eine neue Fassung ist da.</span>
    <button type="button" id="swSpaeter">Später</button>
    <button type="button" id="swLaden">Jetzt laden</button>
  </div>
  <main id="ansicht"></main>
</div>
<div id="menue" hidden>
  <div class="blatt" role="dialog" aria-modal="true" aria-label="Menü">
    <ul class="menue-liste" id="menueListe"></ul>
  </div>
</div>
<div id="meldung" hidden></div>
<div id="timerBlatt" hidden>
  <div class="hinweis-karte glas timer-karte" id="timerKarte" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="timerName"></div>
</div>
<div id="hinweisBlatt" hidden>
  <div class="hinweis-karte glas" id="hinweisKarte" tabindex="-1" role="alertdialog" aria-modal="true" aria-labelledby="hinweisTitel"
    aria-describedby="hinweisText">
    <div id="hinweisInhalt">
      <span class="hinweis-haken" id="hinweisHaken" aria-hidden="true" hidden></span>
      <h2 id="hinweisTitel"></h2>
      <p id="hinweisText"></p>
      <div class="hinweis-wahl" id="hinweisWahl" hidden></div>
      <div class="hinweis-knoepfe">
        <button type="button" class="knopf zart" id="hinweisNein" hidden>Abbrechen</button>
        <button type="button" class="knopf" id="hinweisOk">OK</button>
      </div>
    </div>
  </div>
</div>
<button type="button" id="ticketKnopf" aria-label="Ticket schreiben" aria-haspopup="dialog"></button>
<div id="ticketBlatt" hidden>
  <div class="ticket-karte glas" id="ticketKarte" role="dialog" aria-modal="true" aria-labelledby="tkKopf"></div>
</div>

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function $(id) { return document.getElementById(id); }

    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + innen + '</svg>';
}
