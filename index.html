// ── GRAMMATIK ───────────────────────────────────────────────
// Vokabeln sind Fakten, Regeln sind Funktionen. Darum ist hier die Karteikarte
// die **Regel** und nicht das Wort: Gemeistert ist sie, wenn sie viermal auf
// verschiedene Wörter gewirkt hat. Und darum verlangt die Aufgabe ein bekanntes
// Wort in einer nie gesehenen Form — wer auswendig gelernt hat, scheitert
// daran, wer die Regel hat, nicht (ADR 0030).
//
// Freiwillig wie die Buchstaben: blockiert nichts, zählt nicht in Serie und
// «beantwortet», eigener Topf.
var gramBaustein = null;   // Kennung des laufenden Bausteins
var gramQ = null;          // die laufende Aufgabe
var gramPhase = 'ask';     // 'ask' · 'feedback'
var gramPicked = null;
var gramCorrect = null;
var gramEingabe = '';
var gramKb = null;
var gramRegelOffen = false;   // Regelkarte über «Warum?» aufgeklappt
var gramRegelNeu = false;     // frisch entdeckt: die Regel steht ganzseitig da

function gramBox(b) { return state.gramBox[b.id] || 0; }
function gramEntdeckt(b) { return state.gramSeen[b.id] !== undefined; }
function gramGemeistert(b) { return gramBox(b) >= BOX_MAX; }
function gramFaellig(b, jetzt) {
  var seit = state.gramSeen[b.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(gramBox(b));
}
function gramMeisterschaft() { return GRAMMATIK.filter(gramGemeistert).length; }

function gramFinde(id) {
  return GRAMMATIK.filter(function (b) { return b.id === id; })[0] || null;
}

// Offen ist, was noch nicht gemeistert ist; dazu Fertiges, dessen Frist um ist.
function gramPool() {
  var jetzt = Date.now();
  var offen = GRAMMATIK.filter(function (b) { return !gramGemeistert(b); });
  var frisch = GRAMMATIK.filter(function (b) { return gramGemeistert(b) && gramFaellig(b, jetzt); });
  return offen.concat(frisch);
}

// Der Reihe nach: Bausteine bauen aufeinander auf, ein Zufallsgriff wäre hier
// falsch. Der erste, der noch nicht sitzt, ist dran.
function gramWaehlen() {
  var pool = gramPool();
  return pool.length ? pool[0] : null;
}

function gramAktuell() {
  var b = gramBaustein ? gramFinde(gramBaustein) : null;
  if (!b) { b = gramWaehlen(); gramBaustein = b ? b.id : null; }
  return b;
}

function gramUpdate(b, richtig) {
  var cur = gramBox(b);
  state.gramBox[b.id] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.gramSeen[b.id] = Date.now();
  save();
}

// ── Die Wörter, an denen geübt wird ─────────────────────────
// Aus dem begonnenen Wortschatz: Die Regel soll auf ein Wort wirken, das man
// kennt — sonst prüft die Aufgabe zwei Dinge auf einmal. Ist noch nichts
// begonnen, tun es die Beispiele des Bausteins.
function gramWortPool(b) {
  var stufe = gramBox(b);
  var passt = function (v) {
    if (!istNomen(v.art)) return false;
    // Belebte männliche Nomen im Akkusativ bleiben draußen, bis ihr eigener
    // Baustein dran ist — sonst verlangte die Übung eine ungelernte Regel.
    if (b.aufgabe === 'akk' && v.art === 'mb') return false;
    // Erst wenn die Regel sitzt, kommen die Wörter dazu, die sie nicht verrät.
    if (b.aufgabe === 'geschlecht' && stufe < SATZ_STUFE &&
      v.art !== wortartRegel(v.ru)) return false;
    return true;
  };
  var begonnen = ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) > 0 && passt(v);
  });
  if (begonnen.length >= 6) return begonnen;
  var aus = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
    .filter(function (v) { return v && passt(v); });
  // Beispiele zuerst, damit auch ein leerer Lernstand sofort üben kann.
  var drin = {};
  aus.forEach(function (v) { drin[v.id] = true; });
  begonnen.forEach(function (v) { if (!drin[v.id]) aus.push(v); });
  return aus.length ? aus : ALL_VOCAB.filter(passt).slice(0, 12);
}

// Ablenker für den Akkusativ: dasselbe Wort mit anderen Endungen. Sie sind
// keine erfundenen Wörter, sondern Formen, die es gibt — nur nicht hier.
function gramAblenker(ru, richtig) {
  var stamm = ru.replace(/[аяоеьйы]$/, '');
  var enden = ['а', 'у', 'е', 'и', 'ы', 'о'];
  var aus = [];
  enden.forEach(function (e) {
    var f = stamm + e;
    // «ы» steht nie nach к г х ж ч ш щ — ein Ablenker, den die Rechtschreibung
    // schon ausschließt, wäre kein Ablenker.
    if (e === 'ы' && nachZischlaut(stamm)) return;
    if (f !== richtig && f !== ru && aus.indexOf(f) === -1) aus.push(f);
  });
  if (ru !== richtig && aus.indexOf(ru) === -1) aus.push(ru);
  return shuffle(aus).slice(0, 3);
}

function gramFrageBauen() {
  var b = gramAktuell();
  gramPhase = 'ask';
  gramPicked = null;
  gramCorrect = null;
  gramEingabe = '';
  meisterMeldung = null;
  if (!b) { gramQ = null; return; }

  var pool = gramWortPool(b);
  if (!pool.length) { gramQ = null; return; }
  var wort = pool[Math.floor(Math.random() * pool.length)];
  if (gramQ && pool.length > 1) {
    var ohne = pool.filter(function (v) { return v.id !== gramQ.wort.id; });
    if (ohne.length) wort = ohne[Math.floor(Math.random() * ohne.length)];
  }

  if (b.aufgabe === 'geschlecht') {
    gramQ = {
      baustein: b.id, art: 'geschlecht', wort: wort,
      loesung: geschlecht(wort.art),
      optionen: ['m', 'w', 's']
    };
    return;
  }
  // Akkusativ: unter der Endstufe die Form wählen, darüber selbst schreiben.
  var form = grammForm(wort.ru, wort.art, 'akk');
  gramQ = {
    baustein: b.id, art: 'akk', wort: wort, loesung: form,
    tippen: gramBox(b) >= SATZ_STUFE,
    optionen: shuffle([form].concat(gramAblenker(wort.ru, form)))
  };
}

function gramAbgabeBereit() {
  if (!gramQ) return false;
  if (gramQ.tippen) return normalize(gramEingabe) !== '';
  return gramPicked !== null;
}

function gramPruefen() {
  var q = gramQ;
  var b = gramFinde(q.baustein);
  gramCorrect = q.tippen
    ? normalize(gramEingabe) === normalize(q.loesung)
    : gramPicked === q.loesung;
  var vorher = gramBox(b);
  gramUpdate(b, gramCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, gramBox(b), 'Regel', b.name,
    gramMeisterschaft() + ' von ' + GRAMMATIK.length + ' Regeln', false);
  meisterTon(gramCorrect);
  gramPhase = 'feedback';
  renderGrammatik();
}

// ── Entdecken ───────────────────────────────────────────────
// Erst sehen, dann benennen, dann die Regel: Was man selbst gefunden hat,
// behält man. Freie Eingabe wäre nicht bewertbar — die Wahl unter drei
// Deutungen ist die bewertbare Form desselben Gedankens.
// Die Beispiele müssen **kontrastieren**, sonst gibt es nichts zu entdecken:
// Vier weibliche Wörter zeigen kein Muster, sie zeigen vier Mal dasselbe. Für
// das Geschlecht also je eines pro Geschlecht; für den Akkusativ zwei, die sich
// ändern, und eines, das bleibt — erst der Unterschied ist die Regel.
function gramEntdeckenWoerter(b) {
  var pool = gramWortPool(b);
  var nach = function (g) {
    return pool.filter(function (v) { return geschlecht(v.art) === g; });
  };
  var aus = [];
  var nimm = function (liste, wieviele) {
    liste.forEach(function (v) {
      if (aus.length < 4 && wieviele > 0 && aus.indexOf(v) === -1) { aus.push(v); wieviele--; }
    });
  };
  if (b.aufgabe === 'geschlecht') {
    nimm(nach('w'), 1); nimm(nach('m'), 1); nimm(nach('s'), 1); nimm(pool, 1);
  } else {
    nimm(nach('w'), 2); nimm(nach('s'), 1); nimm(nach('m'), 1);
  }
  if (aus.length < 3) nimm(pool, 4 - aus.length);
  return aus;
}

function gramEntdeckenHtml(b) {
  var pool = gramEntdeckenWoerter(b);
  var html = '<p class="task-label">' + esc(b.name) + ' · entdecken</p>' +
    '<div class="card"><p class="hint">' + esc(b.frage) + '</p><div class="gram-paare">';
  pool.forEach(function (v) {
    var rechts = b.aufgabe === 'geschlecht'
      ? GESCHLECHT_NAME[geschlecht(v.art)]
      : grammForm(v.ru, v.art, 'akk');
    html += '<div class="gram-paar"><span class="cyr">' + esc(v.ru) + '</span>' +
      '<span class="gram-pfeil" aria-hidden="true">→</span>' +
      '<span class="' + (b.aufgabe === 'geschlecht' ? 'gram-deutung' : 'cyr') + '">' +
      esc(rechts) + '</span></div>';
  });
  html += '</div><div class="options">';
  b.deutungen.forEach(function (d, i) {
    var klasse = 'option';
    if (gramPhase === 'feedback') {
      if (i === b.richtig) klasse += ' right';
      else if (gramPicked === i) klasse += ' wrong';
      else klasse += ' muted';
    } else if (gramPicked === i) klasse += ' picked';
    html += '<button class="' + klasse + '" data-gramdeutung="' + i + '"' +
      (gramPhase !== 'ask' ? ' disabled' : '') + '>' + esc(d) + '</button>';
  });
  html += '</div>';
  if (gramPhase === 'feedback') {
    html += '<div class="feedback ' + (gramCorrect ? 'good' : 'bad') + '"><p>' +
      (gramCorrect ? ICON.haken + 'Genau das ist es.' : ICON.kreuz + 'Nicht ganz — so ist es:') +
      '</p></div>';
  }
  html += '</div><div class="btn-row">';
  html += gramPhase === 'ask'
    ? '<button class="btn primary" id="gramDeutungAb"' + (gramPicked === null ? ' disabled' : '') +
      '>Bestätigen</button>'
    : '<button class="btn primary" id="gramZurRegel">Die Regel →</button>';
  return html + '</div>';
}

// ── Die Regelkarte ──────────────────────────────────────────
function gramRegelHtml(b, mitKnopf) {
  var html = '<div class="card gram-regel"><p class="task-label">' + esc(b.name) +
    ' · ' + esc(b.kurz) + '</p>' +
    '<p class="fact-text">' + esc(b.regel) + '</p><div class="gram-tabelle">';
  b.tabelle.forEach(function (z) {
    html += '<div class="gram-zeile"><span class="gram-fall cyr">' + esc(z[0]) + '</span>' +
      '<span class="gram-was">' + esc(z[1]) + '</span>' +
      '<span class="gram-bsp cyr">' + esc(z[2]) + '</span></div>';
  });
  html += '</div><p class="gram-merk">' + esc(b.merksatz) + '</p>';
  if (b.fussnote) html += '<p class="session-info gram-fuss">' + esc(b.fussnote) + '</p>';
  html += '</div>';
  if (mitKnopf) {
    html += '<div class="btn-row"><button class="btn primary" id="gramZurUebung">' +
      'Jetzt anwenden →</button></div>';
  }
  return html;
}

// ── Anwenden ────────────────────────────────────────────────
function gramUebenHtml(b) {
  if (!gramQ || gramQ.baustein !== b.id) gramFrageBauen();
  if (!gramQ) {
    return '<div class="leer">' + maskottchen('gross') +
      '<h3>Nichts zu üben</h3><p>Für diese Regel fehlen noch passende Wörter. ' +
      'Lernen Sie ein paar Vokabeln — dann kommt sie von selbst zurück.</p></div>';
  }
  var q = gramQ;
  var stufe = gramBox(b);
  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) {
    dots += '<span class="' + (i <= stufe && stufe > 0 ? 'on' : '') + '"></span>';
  }
  var html = gramKopfHtml(b) + '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="card-theme">' + esc(b.name) + '</span></div>';

  if (q.art === 'geschlecht') {
    html += '<p class="task-label">Welches Geschlecht?</p>' +
      '<p class="word cyr">' + esc(q.wort.ru) + hoerknopf(q.wort.ru, 'ru') + '</p>' +
      '<p class="hint">' + esc(q.wort.de) + '</p><div class="options abc-optionen">';
    q.optionen.forEach(function (g) {
      var klasse = 'option';
      if (gramPhase === 'feedback') {
        if (g === q.loesung) klasse += ' right';
        else if (gramPicked === g) klasse += ' wrong';
        else klasse += ' muted';
      } else if (gramPicked === g) klasse += ' picked';
      html += '<button class="' + klasse + '" data-gramopt="' + esc(g) + '"' +
        (gramPhase !== 'ask' ? ' disabled' : '') + '>' + GESCHLECHT_NAME[g] + '</button>';
    });
    html += '</div>';
  } else {
    html += '<p class="task-label">Wen? Was? — die Form dazu</p>' +
      '<p class="word cyr">' + esc(q.wort.ru) + '</p>' +
      '<p class="hint">' + esc(q.wort.de) + ' · ' +
      GESCHLECHT_NAME[geschlecht(q.wort.art)] + '</p>';
    if (q.tippen) {
      html += '<textarea id="gramInput" rows="1" class="fliess cyr' +
        (gramPhase === 'feedback' ? (gramCorrect ? ' ok' : ' err') : '') + '"' +
        ' lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
        (gramPhase === 'feedback' ? ' readonly' : '') +
        ' placeholder="Die Form schreiben …">' + esc(gramEingabe) + '</textarea>';
    } else {
      html += '<div class="options abc-optionen">';
      q.optionen.forEach(function (f, i) {
        var klasse = 'option cyr';
        if (gramPhase === 'feedback') {
          if (f === q.loesung) klasse += ' right';
          else if (gramPicked === f) klasse += ' wrong';
          else klasse += ' muted';
        } else if (gramPicked === f) klasse += ' picked';
        html += '<button class="' + klasse + '" data-gramopt="' + esc(f) + '"' +
          (gramPhase !== 'ask' ? ' disabled' : '') + '>' + esc(f) + '</button>';
        void i;
      });
      html += '</div>';
    }
  }

  if (gramPhase === 'feedback') {
    html += '<div class="feedback ' + (gramCorrect ? 'good' : 'bad') + '"><p>';
    if (gramCorrect) html += ICON.haken + 'Richtig!';
    else if (q.art === 'geschlecht') {
      html += ICON.kreuz + '<strong>' + GESCHLECHT_NAME[q.loesung] + '</strong>';
    } else {
      html += ICON.kreuz + 'Richtig wäre <strong class="cyr">' + esc(q.loesung) + '</strong>';
    }
    html += '</p></div>' + gramWarumHtml(b, q) + meisterHtml();
  }

  html += '</div><div class="btn-row">';
  if (gramPhase === 'ask') {
    html += '<button class="btn ghost" id="gramWarum">Warum?</button>' +
      '<button class="btn primary" id="gramConfirm"' + (gramAbgabeBereit() ? '' : ' disabled') +
      '>' + (q.tippen ? 'Prüfen' : 'Bestätigen') + '</button>';
  } else {
    html += '<button class="btn primary" id="gramNext">Weiter →</button>';
  }
  html += '</div>';
  if (gramRegelOffen) html += gramRegelHtml(b, false);
  if (q.tippen && gramPhase === 'ask') {
    html += '<button class="kb-toggle" id="gramKbToggle">' +
      (gramKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (gramKb) html += tastaturHtml('gramkey');
  }
  html += '<p class="session-info">' + gramPool().length + ' offen · ' +
    gramMeisterschaft() + ' von ' + GRAMMATIK.length + ' Regeln sitzen</p>';
  return html;
}

// Die Begründung *zu dieser Antwort* — nicht die Regel im Allgemeinen. Sie
// steht nach der Auflösung da, wo man sie braucht.
function gramWarumHtml(b, q) {
  var v = q.wort;
  var g = geschlecht(v.art);
  if (q.art === 'geschlecht') {
    var ausRegel = v.art === wortartRegel(v.ru);
    return '<p class="hint">' + (ausRegel
      ? '«' + esc(v.ru) + '» endet auf <strong class="cyr">' +
        esc(v.ru.slice(-1)) + '</strong> — also ' + GESCHLECHT_NAME[g] + '.'
      : '«' + esc(v.ru) + '» ist eine Ausnahme: Die Endung sagt etwas anderes, ' +
        'das Wort ist ' + GESCHLECHT_NAME[g] + '.') + '</p>';
  }
  var gleich = q.loesung === v.ru;
  void b;
  return '<p class="hint">' + esc(v.ru) + ' ist ' + GESCHLECHT_NAME[g] + ' — ' +
    (gleich ? 'und bleibt im Akkusativ unverändert.'
      : 'darum wird <strong class="cyr">' + esc(v.ru.slice(-1)) + '</strong> zu <strong class="cyr">' +
        esc(q.loesung.slice(-1)) + '</strong>.') + '</p>';
}

// Kopf über der Aufgabe: ein Punkt je Baustein, wie das Paket in «Lernsets».
function gramKopfHtml(b) {
  var html = '<p class="task-label">Regeln</p><div class="paket">' +
    '<div class="paket-punkte" aria-hidden="true">';
  GRAMMATIK.forEach(function (x) {
    html += '<span class="pp s' + gramBox(x) + '"></span>';
  });
  html += '</div><p class="paket-text">' + gramMeisterschaft() + ' von ' +
    GRAMMATIK.length + ' sitzen · gerade: ' + esc(b.name) + '</p></div>';
  return html;
}

function renderGrammatik() {
  var b = gramAktuell();
  if (!b) {
    var jetzt = Date.now();
    var ruhend = GRAMMATIK.filter(function (x) {
      return gramGemeistert(x) && !gramFaellig(x, jetzt);
    }).length;
    main.innerHTML = '<section><div class="leer">' + maskottchen('gross') +
      '<h3>Alle Regeln sitzen</h3><p>Alle ' + GRAMMATIK.length +
      ' Bausteine sind ' + BOX_MAX + '× richtig angewandt. ' + ruhend +
      ' ruhen bis zur nächsten Auffrischung.</p></div></section>';
    return;
  }

  var html = '<section>';
  if (!gramEntdeckt(b)) html += gramEntdeckenHtml(b);
  else if (gramRegelNeu) html += gramKopfHtml(b) + gramRegelHtml(b, true);
  else html += gramUebenHtml(b);
  main.innerHTML = html + '</section>';

  main.querySelectorAll('[data-gramdeutung]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (gramPhase !== 'ask') return;
      gramPicked = parseInt(el.dataset.gramdeutung, 10);
      renderGrammatik();
    });
  });
  var ab = document.getElementById('gramDeutungAb');
  if (ab) ab.addEventListener('click', function () {
    if (gramPicked === null) return;
    gramCorrect = gramPicked === b.richtig;
    ton(gramCorrect);
    gramPhase = 'feedback';
    renderGrammatik();
  });
  var zurRegel = document.getElementById('gramZurRegel');
  if (zurRegel) zurRegel.addEventListener('click', function () {
    // Entdeckt ist entdeckt — die Stufe steigt erst beim Anwenden.
    state.gramSeen[b.id] = Date.now();
    save();
    gramRegelNeu = true;
    gramPhase = 'ask';
    gramPicked = null;
    renderGrammatik();
  });
  var zurUebung = document.getElementById('gramZurUebung');
  if (zurUebung) zurUebung.addEventListener('click', function () {
    gramRegelNeu = false;
    gramFrageBauen();
    renderGrammatik();
  });

  main.querySelectorAll('[data-gramopt]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (gramPhase !== 'ask') return;
      gramPicked = el.dataset.gramopt;
      if (state.settings.confirmUeben) renderGrammatik();
      else gramPruefen();
    });
  });
  var feld = document.getElementById('gramInput');
  if (feld) feld.addEventListener('input', function () {
    gramEingabe = feld.value;
    var k = document.getElementById('gramConfirm');
    if (k) k.disabled = !gramAbgabeBereit();
  });
  var kb = document.getElementById('gramKbToggle');
  if (kb) kb.addEventListener('click', function () { gramKb = !gramKb; renderGrammatik(); });
  main.querySelectorAll('[data-gramkey]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (gramPhase !== 'ask') return;
      var k = el.dataset.gramkey;
      gramEingabe = k === 'BS' ? gramEingabe.slice(0, -1) : gramEingabe + k;
      var f = document.getElementById('gramInput');
      if (f) f.value = gramEingabe;
      var c = document.getElementById('gramConfirm');
      if (c) c.disabled = !gramAbgabeBereit();
    });
  });
  var warum = document.getElementById('gramWarum');
  if (warum) warum.addEventListener('click', function () {
    gramRegelOffen = !gramRegelOffen;
    renderGrammatik();
  });
  var conf = document.getElementById('gramConfirm');
  if (conf) conf.addEventListener('click', function () {
    if (gramAbgabeBereit()) gramPruefen();
  });
  var next = document.getElementById('gramNext');
  if (next) next.addEventListener('click', function () {
    gramBaustein = null;    // gemeisterte Regel abgeben, sonst dieselbe weiter
    gramFrageBauen();
    renderGrammatik();
  });
}

// ── TIPPEN ──────────────────────────────────────────────────
// Getippt wird, was beim Vokabeltraining angefangen hat zu sitzen — ab
// settings.tippenStufe. Wer ein Wort richtig tippt, macht damit die letzte
// Stufe voll; danach ist es **aus dem Pool**. Nach der Auffrischfrist kommt es
// einmal zur Sicherheit wieder — richtig getippt, und es ist wieder draußen.
var tWord = null, tResult = null, tHint = false, tKb = null;
var tippenModus = 'lernen';   // 'lernen' · 'wiederholung'

// Offen: begonnen, aber noch nicht fertig. Ohne Fälligkeitsfilter — wer üben
// will, soll üben dürfen, nicht auf den nächsten Tag warten.
function tippenLernen() {
  var schwelle = state.settings.tippenStufe;
  return ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b >= schwelle && b < BOX_MAX;
  });
}
// Fertig und die Frist ist um: einmal zur Sicherheit.
function tippenWiederholung() {
  var jetzt = Date.now();
  return ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && faellig(v, jetzt);
  });
}
function tippenPool() {
  return tippenModus === 'wiederholung' ? tippenWiederholung() : tippenLernen();
}
// Fertig, aber noch nicht fällig — das sind die, die gerade ruhen.
function tippenRuhend() {
  var jetzt = Date.now();
  return ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && !faellig(v, jetzt);
  });
}
// Wann wird das nächste ruhende Wort wieder fällig?
function naechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  var beste = null;
  tippenRuhend().forEach(function (v) {
    var wann = (state.lastSeen[v.id] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Leerzustand: drei Fälle, die sich sehr verschieden anfühlen — noch nichts
// freigeschaltet, alles getippt, oder gerade nichts fällig.
function renderTippenLeer() {
  var schwelle = state.settings.tippenStufe;
  var ruhend = tippenRuhend().length;
  var offen = tippenLernen().length;
  var frisch = tippenWiederholung().length;
  var fast = ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b > 0 && b < schwelle;
  }).sort(function (a, b) { return (state.boxes[b.id] || 0) - (state.boxes[a.id] || 0); });

  var html = '<section><div class="leer">' + maskottchen('gross');

  if (tippenModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts fällig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Wort sitzt' : ' Wörter sitzen') + ' und ruhen. Das nächste kommt ' +
          esc(naechsteAuffrischung()) + ' zur Sicherheit noch einmal.'
        : 'Hier erscheinen Wörter, die Sie fertig gelernt haben — nach ' +
          (state.settings.auffrischen || 21) + ' Tagen einmal zur Sicherheit.') + '</p>';
    if (offen) {
      html += '<div class="btn-row"><button class="btn primary" id="tZuLernen">' +
        offen + (offen === 1 ? ' Wort offen' : ' Wörter offen') + '</button></div>';
    }
  } else if (ruhend || frisch) {
    html += '<h3>Alles getippt</h3>' +
      '<p>Auf der Lernstufe wartet kein Wort mehr. ' +
      (ruhend ? ruhend + (ruhend === 1 ? ' Wort sitzt und ruht. ' : ' Wörter sitzen und ruhen. ') : '') +
      (frisch
        ? frisch + (frisch === 1 ? ' ist' : ' sind') + ' zum Auffrischen bereit.'
        : 'Die nächste Auffrischung kommt ' + esc(naechsteAuffrischung()) + '.') +
      '</p>';
    html += '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="tZuFrisch">Wiederholen</button>' : '') +
      '<button class="btn ghost" id="tZuUeben">Neue Wörter lernen</button></div>';
  } else {
    html += '<h3>Noch kein Wort freigeschaltet</h3>' +
      '<p>Hier tippen Sie nur Wörter, die in «Lernsets» oder «Freestyle» angefangen haben zu sitzen — ' +
      'ab Stufe ' + schwelle + ' von ' + BOX_MAX + ', also ' + schwelle +
      '× nacheinander richtig beantwortet.</p>';
    if (fast.length) {
      html += '<p class="naechste">Am nächsten dran: ' + fast.slice(0, 3).map(function (v) {
        return '<span class="cyr">' + esc(v.ru) + '</span> (Stufe ' + (state.boxes[v.id] || 0) + ')';
      }).join(' · ') + '</p>';
    } else {
      html += '<p class="naechste">Noch kein Wort begonnen — fangen Sie mit dem ersten Lernset an.</p>';
    }
    html += '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Lernsets»</button></div>';
  }

  html += '</div><p class="session-info">Schwelle und Auffrischfrist stehen in den Einstellungen.</p></section>';
  main.innerHTML = html;

  var zu = document.getElementById('tZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('tZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    tippenModus = 'wiederholung';
    tWord = null;
    renderTippen();
  });
  var lernBtn = document.getElementById('tZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    tippenModus = 'lernen';
    tWord = null;
    renderTippen();
  });
}

function renderTippen() {
  if (tKb === null) tKb = state.settings.tastaturAn;
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln —
  // sonst stünde man vor einem Leerzustand, obwohl es etwas zu tun gibt.
  if (!tResult && !tippenPool().length) {
    var anderer = tippenModus === 'lernen' ? 'wiederholung' : 'lernen';
    tippenModus = anderer;
    if (!tippenPool().length) tippenModus = 'lernen';
  }
  var pool = tippenPool();
  // Während der Rückmeldung bleibt das Wort stehen, auch wenn es nach einem
  // Fehler unter die Schwelle gerutscht ist — sonst verschwände die Auflösung.
  if (!tResult && (!tWord || pool.indexOf(tWord) === -1)) tWord = waehleWort(pool);
  if (!tWord) { renderTippenLeer(); return; }
  var w = tWord;
  var stats = state.typingStats;
  var total = stats.correct + stats.wrong;

  var html = '<section><div class="card">' +
    '<p class="task-label">' + (tippenModus === 'wiederholung'
      ? 'Zur Sicherheit noch einmal' : 'Schreiben Sie auf Russisch') + '</p>' +
    '<p class="word">' + esc(w.de) + hoerknopf(w.de, 'de') + '</p>' +
    (tHint ? '<p class="translit">[' + esc(w.tr) + ']</p>' : '') +
    '<input type="text" id="tInput" class="cyr' + (tResult === 'right' ? ' ok' : tResult === 'wrong' ? ' err' : '') + '"' +
    ' placeholder="кириллица \u2026" lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
    (tResult ? ' readonly' : '') + '>';

  if (tResult === 'wrong') html += '<p class="feedback bad">' + ICON.kreuz + 'Richtig: <strong class="cyr">' + esc(w.ru) + '</strong></p>';
  if (tResult === 'right') html += '<p class="feedback good">' + ICON.haken + 'Правильно — richtig!</p>';
  // Erst nach der Abgabe zu hören: vorher wäre die Aussprache die halbe Antwort.
  if (tResult) html += hoerzeile(w.ru, w.de) + meisterHtml();
  html += '</div><div class="btn-row">';
  if (!tResult) {
    html += '<button class="btn ghost" id="tHintBtn">Hinweis</button>' +
      '<button class="btn primary" id="tCheck">Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="tNext">Nächstes Wort \u2192</button>';
  }
  html += '</div>';
  html += '<button class="kb-toggle" id="tKbToggle">' + (tKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
  if (tKb) {
    html += '<div>';
    KB_ROWS.forEach(function (row, ri) {
      html += '<div class="kb-row">';
      row.forEach(function (ch) {
        html += '<button class="key cyr" data-key="' + esc(ch) + '">' + esc(ch) + '</button>';
      });
      if (ri === 2) {
        html += '<button class="key wide" data-key=" ">\u2423</button>' +
          '<button class="key wide" data-key="BS" aria-label="Zeichen löschen">' + ICON.ruecktaste + '</button>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<p class="session-info">' + pool.length +
    (tippenModus === 'wiederholung' ? ' zum Auffrischen' : ' offen') + ' · ' +
    stats.correct + ' richtig · ' + stats.wrong + ' falsch' +
    (total > 0 ? ' · Quote ' + Math.round(stats.correct / total * 100) + ' %' : '') + '</p></section>';

  main.innerHTML = html;

  var input = document.getElementById('tInput');

  function check() {
    if (tResult) return;
    var ok = normalize(input.value) === normalize(w.ru);
    tResult = ok ? 'right' : 'wrong';
    var vorher = state.boxes[w.id] || 0;
    updateBox(w.id, ok);
    meisterMeldung = null;
    meisterPruefen(vorher, state.boxes[w.id], 'Wort', w.ru + ' — ' + w.de,
      woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
    meisterTon(ok);
    state.typingStats.correct += ok ? 1 : 0;
    state.typingStats.wrong += ok ? 0 : 1;
    save();
    var v = input.value;
    renderTippen();
    document.getElementById('tInput').value = v;
  }
  function next() {
    tResult = null;
    tHint = false;
    meisterMeldung = null;
    tWord = waehleWort(tippenPool());
    renderTippen();
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { if (tResult) next(); else check(); }
  });
  var hintBtn = document.getElementById('tHintBtn');
  if (hintBtn) hintBtn.addEventListener('click', function () {
    tHint = true;
    var v = input.value;
    renderTippen();
    document.getElementById('tInput').value = v;
  });
  var checkBtn = document.getElementById('tCheck');
  if (checkBtn) checkBtn.addEventListener('click', check);
  var nextBtn = document.getElementById('tNext');
  if (nextBtn) nextBtn.addEventListener('click', next);
  document.getElementById('tKbToggle').addEventListener('click', function () {
    tKb = !tKb;
    var v = document.getElementById('tInput').value;
    renderTippen();
    document.getElementById('tInput').value = v;
  });
  main.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (tResult) return;
      var inp = document.getElementById('tInput');
      var k = b.dataset.key;
      if (k === 'BS') inp.value = inp.value.slice(0, -1);
      else inp.value += k;
    });
  });
}

// ── Melden ──────────────────────────────────────────────────
// Ein Ticket schreibt man dort, wo einem etwas auffällt — nicht erst nach dem
// Weg über das Menü. Der Knopf schwebt darum über jeder Ansicht, und das Blatt
// deckt nur den unteren Teil ab, damit man weiter sieht, worum es geht.
var meldeOffen = false;
var meldeArt = 'bug';
var meldeBezugAn = true;
// Die Kennung des Tickets, das gerade bearbeitet wird — sonst null.
var meldeBearbeitet = null;
var meldeBezugName = '';   // beim Bearbeiten der schon vergebene Bezug

function meldeBezugQuelle() {
  // Die Ansicht, über der man steht — die ist gemeint, nicht «Tickets».
  return currentTab === 'tickets' ? letzterTab : currentTab;
}

function meldeArtHtml() {
  return [['bug', 'Fehler'], ['feature', 'Wunsch']].map(function (a) {
    return '<button class="chip' + (meldeArt === a[0] ? ' active' : '') +
      '" data-melde-art="' + a[0] + '">' + a[1] + '</button>';
  }).join('');
}

function meldeFuellen() {
  document.getElementById('meldeArt').innerHTML = meldeArtHtml();
  document.querySelectorAll('[data-melde-art]').forEach(function (b) {
    b.addEventListener('click', function () {
      meldeArt = b.dataset.meldeArt;
      document.getElementById('meldeText').placeholder = meldeArt === 'bug'
        ? 'Was ist passiert, was hatten Sie erwartet?'
        : 'Was soll die App können?';
      meldeFuellen();
    });
  });
  document.getElementById('meldeBezugName').textContent = meldeBearbeitet
    ? (meldeBezugName || ansichtName(meldeBezugQuelle()))
    : ansichtName(meldeBezugQuelle());
  document.getElementById('meldeBezug').checked = meldeBezugAn;
  document.getElementById('meldeSichern').textContent = meldeBearbeitet ? 'Ändern' : 'Sichern';
  document.getElementById('meldeAbbruch').textContent = meldeBearbeitet ? 'Verwerfen' : 'Abbrechen';
}

// Ein vorhandenes Ticket zum Bearbeiten ins Blatt holen.
function meldeBearbeiten(id) {
  var t = tickets.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  meldeBearbeitet = id;
  meldeArt = t.art;
  meldeBezugAn = !!t.reiter;
  meldeBezugName = t.reiter;
  document.getElementById('meldeTitel').value = t.titel;
  document.getElementById('meldeText').value = t.text;
  meldeSetzen(true);
}

// Ist ein angefangenes Ticket im Blatt? Dann bleibt es dort liegen, auch wenn
// das Blatt zugeht — verworfen wird nur ausdrücklich.
function meldeEntwurfDa() {
  var t = document.getElementById('meldeTitel');
  var x = document.getElementById('meldeText');
  return !!((t && t.value.replace(/^\s+|\s+$/g, '')) || (x && x.value.replace(/^\s+|\s+$/g, '')));
}

function meldeKnopfZeigen() {
  var knopf = document.getElementById('meldeKnopf');
  var entwurf = meldeEntwurfDa();
  knopf.classList.toggle('hat-entwurf', entwurf);
  knopf.setAttribute('aria-label', entwurf
    ? (meldeBearbeitet ? 'Ticket weiter bearbeiten' : 'Angefangenes Ticket weiterschreiben')
    : 'Rückmeldung geben');
}

function meldeSetzen(auf) {
  meldeOffen = auf;
  document.body.classList.toggle('melden-offen', auf);
  var blatt = document.getElementById('meldeBlatt');
  blatt.setAttribute('aria-hidden', auf ? 'false' : 'true');
  document.getElementById('meldeKnopf').setAttribute('aria-expanded', auf ? 'true' : 'false');
  var hof = document.getElementById('meldeHof');
  if (auf) {
    hof.hidden = false;
    meldeFuellen();
  } else {
    blatt.style.transform = '';
    // Der Hof verschwindet erst, wenn er ausgeblendet ist — sonst blitzt er weg.
    setTimeout(function () { if (!meldeOffen) hof.hidden = true; }, 300);
  }
  document.querySelectorAll('#meldeBlatt button, #meldeBlatt input, #meldeBlatt textarea')
    .forEach(function (el) { el.tabIndex = auf ? 0 : -1; });
  meldeKnopfZeigen();
}

function meldeLeeren() {
  document.getElementById('meldeTitel').value = '';
  document.getElementById('meldeText').value = '';
  meldeArt = 'bug';
  meldeBezugAn = true;
  meldeBearbeitet = null;
  meldeBezugName = '';
  meldeKnopfZeigen();
}

// Das Blatt folgt dem Finger — aber nur nach unten, dorthin, wo es ohnehin
// verschwindet. Weit genug gezogen, geht es zu; der Entwurf bleibt dabei
// stehen. Weggeworfen wird ein Ticket ausschließlich über «Verwerfen».
var MELDE_SCHWELLE = 90;   // ab hier gilt das Ziehen als «zu»
function meldeZiehenBinden() {
  var blatt = document.getElementById('meldeBlatt');
  var start = null, weg = 0;

  function daempfen(d) {
    // Je weiter, desto zäher: die Wurzel wächst langsamer als der Weg.
    return Math.pow(d, 0.72) * 1.6;
  }
  function los(e) {
    if (!meldeOffen) return;
    var z = e.target;
    // Auf Eingabefeldern hat das Ziehen nichts zu suchen.
    if (z.closest('input, textarea, button')) return;
    start = { y: e.clientY };
    weg = 0;
    blatt.classList.add('zieht');
    try { blatt.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function bewegt(e) {
    if (!start) return;
    // Nach oben gibt das Blatt nicht nach: dort ist kein Weg hin.
    weg = Math.max(0, e.clientY - start.y);
    blatt.style.transform = 'translateY(' + daempfen(weg).toFixed(1) + 'px)';
  }
  function fertig() {
    if (!start) return;
    start = null;
    blatt.classList.remove('zieht');
    blatt.style.transform = '';   // der Übergang federt zurück
    if (weg >= MELDE_SCHWELLE) meldeSetzen(false);
    weg = 0;
  }

  blatt.addEventListener('pointerdown', los);
  blatt.addEventListener('pointermove', bewegt);
  blatt.addEventListener('pointerup', fertig);
  blatt.addEventListener('pointercancel', fertig);
  // Danebentippen schließt genauso — der Entwurf bleibt auch dann liegen.
  document.getElementById('meldeHof').addEventListener('click', function () {
    meldeSetzen(false);
  });
}

    document.getElementById('tkFertig').addEventListener('click', function () {
      tkAusgabe = '';
      renderTickets();
    });
  } else {
    main.querySelectorAll('[data-tkweg]').forEach(function (b) {
      b.addEventListener('click', function () {
        tickets.splice(parseInt(b.dataset.tkweg, 10), 1);
        ticketsSichern();
        renderTickets();
      });
    });
    main.querySelectorAll('[data-tkedit]').forEach(function (b) {
      b.addEventListener('click', function () { meldeBearbeiten(b.dataset.tkedit); });
    });
    // Bündeln heißt zugleich übergeben — sonst müsste man den Zustand zweimal
    // pflegen und wüsste beim nächsten Mal nicht, was neu ist.
    var kop = document.getElementById('tkKopieren');
    if (kop) kop.addEventListener('click', function () {
      var jetzt = Date.now();
      tkAusgabe = ticketsAlsText(offen);
      offen.forEach(function (t) { t.uebergeben = jetzt; });
      ticketsSichern();
      inZwischenablage(tkAusgabe);
      renderTickets();
    });
    var allesBtn = document.getElementById('tkAlle');
    if (allesBtn) allesBtn.addEventListener('click', function () {
      tkAusgabe = ticketsAlsText(tickets);
      inZwischenablage(tkAusgabe);
      renderTickets();
    });
    var weg = document.getElementById('tkAufraeumen');
    if (weg) weg.addEventListener('click', function () {
      tickets = ticketsOffen();
      ticketsSichern();
      renderTickets();
    });
  }

  document.getElementById('tkBack').addEventListener('click', function () { setTab(letzterTab); });
}

// ── BILANZ ──────────────────────────────────────────────────
var backupOpen = false, backupCode = '', backupMsg = '', confirmReset = false;
var themenOffen = false; // «alle Themen anzeigen» in der Bilanz
var bilanzDetail = null; // null · 'woerter' · 'saetze' · 'antworten' · 'serie'

// ── Ringdiagramme ───────────────────────────────────────────
// Ein Segment ist ein Kreis, dessen Strich nur über einen Teil des Umfangs
// gezeichnet wird (stroke-dasharray) und der um die schon belegte Strecke
// versetzt beginnt (stroke-dashoffset). Keine Bibliothek, kein Pfad-Rechnen.
var DONUT_R = 42;
var DONUT_U = 2 * Math.PI * DONUT_R;

// Die Stufenfarben — dieselben wie bei den Fortschrittspunkten.
var STUFEN_FARBE = ['var(--line)', 'var(--dim)', 'var(--ice);opacity:.6', 'var(--ice)', 'var(--gold)'];

function donut(teile, wert, text, klein) {
  var summe = 0;
  teile.forEach(function (t) { summe += t.wert; });
  var vorher = 0;
  var kreise = '';
  teile.forEach(function (t) {
    if (!t.wert || !summe) return;
    var laenge = t.wert / summe * DONUT_U;
    kreise += '<circle cx="50" cy="50" r="' + DONUT_R + '" style="stroke:' + t.farbe + '" ' +
      'stroke-dasharray="' + laenge.toFixed(2) + ' ' + DONUT_U.toFixed(2) + '" ' +
      'stroke-dashoffset="' + (-vorher).toFixed(2) + '"/>';
    vorher += laenge;
  });
  return '<div class="donut' + (klein ? ' klein' : '') + '">' +
    '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<circle class="donut-grund" cx="50" cy="50" r="' + DONUT_R + '"/>' + kreise + '</svg>' +
    '<div class="donut-mitte"><span class="donut-wert">' + esc(wert) + '</span>' +
    '<span class="donut-text">' + esc(text) + '</span></div></div>';
}

function legende(teile) {
  var html = '<div class="legende">';
  teile.forEach(function (t) {
    html += '<span class="leg"><i style="background:' + t.farbe + '"></i>' +
      '<span class="leg-name">' + esc(t.name) + '</span>' +
      '<span class="leg-wert">' + t.wert + '</span></span>';
  });
  return html + '</div>';
}

function balkenZeile(name, wert, gesamt) {
  return '<div class="theme-row"><span class="theme-name">' + esc(name) + '</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' +
    (gesamt ? wert / gesamt * 100 : 0) + '%"></div></div>' +
    '<span class="theme-count">' + wert + '/' + gesamt + '</span></div>';
}

// ── Sicherungscode ──────────────────────────────────────────
// Der alte Code war der ganze Lernstand als JSON in Base64 — mit 380
// kyrillischen Schlüsseln und Millisekunden-Zeitstempeln ein Klumpen von rund
// zwanzig Kilobyte, den niemand gern von Hand markiert.
//
// Format 2 kodiert stattdessen nur, was sich nicht ausrechnen lässt, und zwar
// in fester Breite:
//
//   CHG2~<Wörter>~<Sätze>~<Fakten>~<Zahlen>~<Einstellungen>~<Prüfsumme>
//
// Ein Wort belegt zehn Zeichen: sechs für eine **stabile Kennung** (Hash des
// russischen Wortes, nicht seine Position — sonst verschöbe eine neue Vokabel
// alle Stände), eines für die Stufe, drei für das Alter in Tagen. Tagesgenau
// genügt, weil alle Fristen in Tagen rechnen. Das ergibt etwa ein Fünftel der
// alten Länge und obendrein eine Prüfsumme, die abgeschnittenes Einfügen
// erkennt, statt still Unsinn zu laden.
var BK_KOPF = 'CHG2';
var BK_BEZUG = Date.UTC(2026, 0, 1);   // Tag 0 der Zeitrechnung im Code
var BK_KENNUNG = 6;                    // Zeichen je Kennung
var BK_TAGE = 3;                       // Zeichen je Alter
var BK_EINTRAG = BK_KENNUNG + 1 + BK_TAGE;

function bkFuellen(text, breite) {
  var t = String(text);
  while (t.length < breite) t = '0' + t;
  return t.slice(-breite);
}
// Dieselbe Streuung wie bei den Fakten, nur auf feste Breite gebracht.
function bkKennung(text) {
  return bkFuellen(faktId(text), BK_KENNUNG);
}
function bkTag(ms) {
  if (!ms) return 0;
  return Math.max(0, Math.min(46655, Math.floor((ms - BK_BEZUG) / TAG)));
}
function bkAusTag(t) {
  return BK_BEZUG + t * TAG;
}
function bkPruefsumme(text) {
  var h = 0;
  for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
  return bkFuellen((h >>> 0).toString(36), 7);
}

// Kennung → Inhalt. Einmal gebaut, danach nachgeschlagen.
var bkTabelle = null;
function bkNachschlagen() {
  if (bkTabelle) return bkTabelle;
  bkTabelle = { woerter: {}, saetze: {}, fakten: {}, buchstaben: {}, regeln: {} };
  ALL_VOCAB.forEach(function (v) { bkTabelle.woerter[bkKennung(v.id)] = v.id; });
  SENTENCES.forEach(function (x) { bkTabelle.saetze[bkKennung(x.ru)] = x.ru; });
  FACTS.forEach(function (f) { bkTabelle.fakten[bkKennung(f)] = faktId(f); });
  ALPHABET.forEach(function (b) { bkTabelle.buchstaben[bkKennung(b[1])] = b[1]; });
  GRAMMATIK.forEach(function (b) { bkTabelle.regeln[bkKennung(b.id)] = b.id; });
  return bkTabelle;
}

function bkStaendeAus(boxen, zeiten, kennungVon) {
  var teile = [];
  Object.keys(boxen).forEach(function (k) {
    var box = boxen[k] || 0;
    if (!box && !zeiten[k]) return;
    teile.push(kennungVon(k) +
      bkFuellen(Math.min(9, box).toString(36), 1) +
      bkFuellen(bkTag(zeiten[k]).toString(36), BK_TAGE));
  });
  return teile.join('');
}

function bkStaendeNach(text, tabelle, boxen, zeiten) {
  for (var i = 0; i + BK_EINTRAG <= text.length; i += BK_EINTRAG) {
    var kennung = text.slice(i, i + BK_KENNUNG);
    var ziel = tabelle[kennung];
    if (!ziel) continue;   // Inhalt gibt es nicht mehr — wie bei migriereIds
    boxen[ziel] = parseInt(text.slice(i + BK_KENNUNG, i + BK_KENNUNG + 1), 36) || 0;
    var tag = parseInt(text.slice(i + BK_KENNUNG + 1, i + BK_EINTRAG), 36) || 0;
    if (tag) zeiten[ziel] = bkAusTag(tag);
  }
}

// Die Einstellungen in fester Reihenfolge — Namen wären hier reine Länge.
var BK_SETTINGS = ['confirmUeben', 'confirmUebersetzen', 'requireComplete', 'ton', 'tastaturAn'];

function encodeBackup() {
  var woerter = bkStaendeAus(state.boxes, state.lastSeen, bkKennung);
  var saetze = bkStaendeAus(state.satzBox, state.satzSeen, bkKennung);

  var fakten = [];
  Object.keys(state.fakten).forEach(function (id) {
    var st = state.fakten[id];
    if (!st || (!st.n && !st.f)) return;
    // Der Fakt ist schon über faktId gespeichert; für den Code wird auf feste
    // Breite gebracht, damit sich alles ohne Trennzeichen lesen lässt.
    fakten.push(bkFuellen(id, BK_KENNUNG) +
      bkFuellen(Math.min(1295, st.n || 0).toString(36), 2) + (st.f ? '1' : '0'));
  });

  var zahlen = [state.streak, state.bestStreak, state.answered, state.factIdx,
    state.typingStats.correct, state.typingStats.wrong,
    state.transStats.correct, state.transStats.wrong]
    .map(function (n) { return Math.max(0, n | 0).toString(36); }).join('.');

  var s = state.settings;
  var einst = BK_SETTINGS.map(function (k) { return s[k] ? '1' : '0'; }).join('') +
    '.' + s.tippenStufe + '.' + s.auffrischen + '.' +
    ['system', 'dunkel', 'hell'].indexOf(s.darstellung);

  var abc = bkStaendeAus(state.abcBox, state.abcSeen, bkKennung);
  // Neuntes Feld: der Grammatikstand. Er führt Regeln, nicht Wörter — darum
  // bleibt er winzig, egal wie viel gelernt wurde.
  var regeln = bkStaendeAus(state.gramBox, state.gramSeen, bkKennung);

  var rumpf = [BK_KOPF, woerter, saetze, fakten.join(''), zahlen, einst, abc, regeln].join('~');
  return rumpf + '~' + bkPruefsumme(rumpf);
}

// Was steckt in einem Stand? Sagt sowohl beim Erzeugen als auch nach dem
// Einlesen, worüber man gerade redet — sonst ist der Code eine Blackbox.
function bkUeberblick(st) {
  var w = 0, sa = 0;
  Object.keys(st.boxes).forEach(function (k) { if (st.boxes[k] > 0) w++; });
  Object.keys(st.satzBox).forEach(function (k) { if (st.satzBox[k] > 0) sa++; });
  var fa = Object.keys(st.fakten).length;
  var ab = 0;
  Object.keys(st.abcBox || {}).forEach(function (k) { if (st.abcBox[k] > 0) ab++; });
  var re = 0;
  Object.keys(st.gramBox || {}).forEach(function (k) { if (st.gramBox[k] > 0) re++; });
  return w + (w === 1 ? ' Wort' : ' Wörter') + ' · ' +
    sa + (sa === 1 ? ' Satz' : ' Sätze') + ' · ' +
    fa + (fa === 1 ? ' Fakt' : ' Fakten') +
    (ab ? ' · ' + ab + (ab === 1 ? ' Buchstabe' : ' Buchstaben') : '') +
    (re ? ' · ' + re + (re === 1 ? ' Regel' : ' Regeln') : '');
}

function decodeBackup(code) {
  var roh = String(code).replace(/\s+/g, '');
  // Ein Code aus Format 1 ist Base64 und trägt weder Kopf noch Trennzeichen.
  if (roh.indexOf(BK_KOPF + '~') !== 0) return JSON.parse(decodeURIComponent(escape(atob(roh))));

  // Ältere Codes tragen sieben Felder, neuere acht (die Buchstaben kamen dazu).
  // Die Prüfsumme steht immer zuletzt und deckt alles davor ab.
  var teile = roh.split('~');
  if (teile.length < 7) throw new Error('unvollständig');
  var letzte = teile.length - 1;
  if (bkPruefsumme(teile.slice(0, letzte).join('~')) !== teile[letzte]) throw new Error('Prüfsumme');

  var t = bkNachschlagen();
  var d = defaultState();
  bkStaendeNach(teile[1], t.woerter, d.boxes, d.lastSeen);
  bkStaendeNach(teile[2], t.saetze, d.satzBox, d.satzSeen);
  if (teile.length > 7) bkStaendeNach(teile[6], t.buchstaben, d.abcBox, d.abcSeen);
  // Ältere Codes haben sieben oder acht Felder; ihr Grammatikstand bleibt leer.
  if (teile.length > 8) bkStaendeNach(teile[7], t.regeln, d.gramBox, d.gramSeen);

  var f = teile[3];
  for (var i = 0; i + BK_KENNUNG + 3 <= f.length; i += BK_KENNUNG + 3) {
    var id = t.fakten[f.slice(i, i + BK_KENNUNG)];
    if (!id) continue;
    d.fakten[id] = {
      n: parseInt(f.slice(i + BK_KENNUNG, i + BK_KENNUNG + 2), 36) || 0,
      f: f.charAt(i + BK_KENNUNG + 2) === '1'
    };
  }

  var z = teile[4].split('.').map(function (x) { return parseInt(x, 36) || 0; });
  d.streak = z[0]; d.bestStreak = z[1]; d.answered = z[2]; d.factIdx = z[3];
  d.typingStats = { correct: z[4] || 0, wrong: z[5] || 0 };
  d.transStats = { correct: z[6] || 0, wrong: z[7] || 0 };

  var e = teile[5].split('.');
  var schalter = e[0] || '';
  BK_SETTINGS.forEach(function (k, n) { d.settings[k] = schalter.charAt(n) === '1'; });
  d.settings.tippenStufe = parseInt(e[1], 10) || 3;
  d.settings.auffrischen = parseInt(e[2], 10) || 21;
  d.settings.darstellung = ['system', 'dunkel', 'hell'][parseInt(e[3], 10)] || 'system';
  return d;
}

// ── Bilanz im Detail ────────────────────────────────────────
// Gezeigt werden nur Zahlen und Themen — nie eine Liste von Wörtern oder
// Sätzen, die man noch nicht kennt. Die Bilanz soll den Stand zeigen, nicht
// den Lehrplan verraten.
function renderBilanzDetail() {
  var html = '<section>';

  if (bilanzDetail === 'woerter') {
    var counts = [];
    for (var i = 0; i <= BOX_MAX; i++) counts.push(0);
    ALL_VOCAB.forEach(function (v) { counts[state.boxes[v.id] || 0]++; });
    var teile = counts.map(function (n, bi) {
      return {
        wert: n, farbe: STUFEN_FARBE[bi],
        name: bi === 0 ? 'Noch nicht begonnen' : (bi === BOX_MAX ? 'Stufe ' + bi + ' · sitzt' : 'Stufe ' + bi)
      };
    });
    html += donut(teile, counts[BOX_MAX], 'von ' + ALL_VOCAB.length + ' gemeistert') +
      legende(teile.slice().reverse());

    var faellig = faelligeAnzahl(ALL_VOCAB);
    html += '<p class="detail-fuss">' +
      (ALL_VOCAB.length - counts[0]) + ' Wörter begonnen, ' + counts[BOX_MAX] + ' sitzen. ' +
      (faellig ? faellig + (faellig === 1 ? ' Wort ist' : ' Wörter sind') + ' zur Wiederholung fällig.'
        : 'Gerade ist nichts fällig.') + '</p>';

    var themen = Object.keys(VOCAB_THEMES).map(function (t) {
      var ids = VOCAB_THEMES[t].map(function (w) { return w[0]; });
      return {
        name: t, gesamt: ids.length,
        gemeistert: ids.filter(function (id) { return (state.boxes[id] || 0) >= BOX_MAX; }).length,
        begonnen: ids.filter(function (id) { return (state.boxes[id] || 0) > 0; }).length
      };
    });
    var angefangen = themen.filter(function (t) { return t.begonnen > 0; });
    html += '<h2>Nach Themen</h2>';
    if (!angefangen.length) {
      html += '<p class="detail-fuss">Hier erscheint jedes Thema, sobald Sie das erste Wort ' +
        'daraus angefangen haben.</p>';
    } else {
      html += '<div class="theme-list">';
      angefangen.sort(function (a, b) { return b.gemeistert - a.gemeistert; }).forEach(function (t) {
        html += balkenZeile(t.name, t.gemeistert, t.gesamt);
      });
      html += '</div><p class="detail-fuss">' + angefangen.length + ' von ' + themen.length +
        ' Themen angefangen · der Balken zeigt, wie viel davon sitzt.</p>';
    }
  }

  if (bilanzDetail === 'saetze') {
    var sitzt = 0, offen = 0, gesperrt = 0;
    // Erst «sitzt», dann «frei»: sonst zählte ein gelernter Satz, dessen Wörter
    // zwischenzeitlich zurückgefallen sind, als gesperrt — und das Detail
    // zeigte eine andere Zahl als die Kachel, die hierher führt.
    SENTENCES.forEach(function (x) {
      if (satzBox(x) >= BOX_MAX) sitzt++;
      else if (satzFrei(x)) offen++;
      else gesperrt++;
    });
    var st = [
      { wert: sitzt, farbe: 'var(--gold)', name: 'Sitzt' },
      { wert: offen, farbe: 'var(--ice)', name: 'Freigeschaltet, noch offen' },
      { wert: gesperrt, farbe: 'var(--line)', name: 'Noch gesperrt' }
    ];
    html += donut(st, sitzt, 'von ' + SENTENCES.length + ' sitzen') + legende(st);

    var stufen = [];
    SENTENCES.forEach(function (x) { if (stufen.indexOf(x.stufe) === -1) stufen.push(x.stufe); });
    stufen.sort(function (a, b) { return a - b; });
    html += '<h2>Nach Stufen</h2><div class="theme-list">';
    stufen.forEach(function (n) {
      var liste = stufenSaetze(n);
      var s2 = liste.filter(function (x) { return satzBox(x) >= BOX_MAX; }).length;
      html += balkenZeile('Stufe ' + n, s2, liste.length);
    });
    html += '</div><p class="detail-fuss">Ein Satz wird frei, sobald jedes seiner Wörter ' +
      'Stufe ' + SATZ_STUFE + ' erreicht hat, und gilt als sitzend nach ' + BOX_MAX +
      ' richtigen Übersetzungen.</p>';
  }

  if (bilanzDetail === 'antworten') {
    var tp = state.typingStats, tr = state.transStats;
    var tpG = tp.correct + tp.wrong, trG = tr.correct + tr.wrong;
    html += '<div class="donut-paar"><div>' +
      donut([{ wert: tp.correct, farbe: 'var(--good)' }, { wert: tp.wrong, farbe: 'var(--bad)' }],
        tpG ? Math.round(tp.correct / tpG * 100) + ' %' : '—', 'Tippen', true) +
      '</div><div>' +
      donut([{ wert: tr.correct, farbe: 'var(--good)' }, { wert: tr.wrong, farbe: 'var(--bad)' }],
        trG ? Math.round(tr.correct / trG * 100) + ' %' : '—', 'Übersetzen', true) +
      '</div></div>';
    html += legende([
      { wert: tp.correct + tr.correct, farbe: 'var(--good)', name: 'Richtig' },
      { wert: tp.wrong + tr.wrong, farbe: 'var(--bad)', name: 'Falsch' }
    ]);
    html += '<p class="detail-fuss">' + state.answered + ' Antworten insgesamt — darin zählen ' +
      'auch «Lernsets» und «Freestyle», die keine Fehlerquote führen. Die beiden Ringe zeigen ' +
      'nur, wo mitgezählt wird.</p>';
  }

  if (bilanzDetail === 'serie') {
    var jetzt = state.streak, best = state.bestStreak;
    html += donut([
      { wert: jetzt, farbe: 'var(--gold)' },
      { wert: Math.max(0, best - jetzt), farbe: 'var(--line)' }
    ], jetzt, best ? 'von ' + best + ' in Folge' : 'in Folge');
    html += '<p class="detail-fuss">Die Serie zählt richtige Antworten hintereinander und ' +
      'fällt bei jedem Fehler auf null. Ab drei erscheint sie oben auf Home.' +
      (best > jetzt ? ' Ihre beste Reihe waren ' + best + '.' : '') +
      (best && jetzt === best ? ' Das ist zugleich Ihre beste Reihe.' : '') + '</p>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="detailBack">Zurück zur Bilanz</button>' +
    '</div></section>';
  main.innerHTML = html;
  document.getElementById('detailBack').addEventListener('click', function () {
    bilanzDetail = null;
    renderBilanz();
    renderKopf();
  });
}

function renderBilanz() {
  if (bilanzDetail) { renderBilanzDetail(); return; }
  var counts = [];
  for (var i = 0; i <= BOX_MAX; i++) counts.push(0);
  ALL_VOCAB.forEach(function (v) { counts[state.boxes[v.id] || 0]++; });
  var mastered = counts[BOX_MAX];
  var started = ALL_VOCAB.length - counts[0];
  var readTotal = 0;
  readTotal = SENTENCES.length;
  var satzSitzt = SENTENCES.filter(function (s) { return satzBox(s) >= BOX_MAX; }).length;
  var readFrei = SENTENCES.filter(satzFrei).length;

  function stat(label, value, ziel, accent) {
    return '<button class="stat' + (accent ? ' accent' : '') + '" data-detail="' + ziel + '">' +
      '<span class="stat-value">' + value + '</span>' +
      '<span class="stat-label">' + label + '</span>' +
      '<span class="stat-mehr">Mehr</span></button>';
  }

  var html = '<section><div class="stats-grid">' +
    stat('Wörter gesamt', ALL_VOCAB.length, 'woerter') +
    stat('Begonnen', started, 'woerter') +
    stat('Gemeistert', mastered, 'woerter', true) +
    stat('Sätze sitzen', satzSitzt + '/' + readFrei, 'saetze') +
    stat('Beantwortet', state.answered, 'antworten') +
    stat('Beste Serie', state.bestStreak, 'serie', true) +
    '</div>';

  var aktuell = aktuellesSet();
  var frei = freigeschalteteWoerter();
  html += '<h2>Lernweg</h2><div class="theme-list">' +
    '<div class="theme-row"><span class="theme-name">Lernset</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + ((aktuell + 1) / LERNSETS.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + (aktuell + 1) + '/' + LERNSETS.length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Im Tippen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (tippenPool().length / ALL_VOCAB.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + tippenPool().length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Sätze offen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (readFrei / readTotal * 100) + '%"></div></div>' +
    '<span class="theme-count">' + readFrei + '/' + readTotal + '</span></div></div>' +
    '<p class="backup-note">Im laufenden Set fehlen noch ' +
    (LERNSETS[aktuell].woerter.length - setReif(aktuell)) + ' Wörter bis zu ' +
    LERNSETS[aktuell].saetze.length + ' weiteren Sätzen · ' + faelligeAnzahl(frei) +
    ' Wiederholungen fällig</p>';

  // Der Balken zeigt, was sitzt; die Zahl daneben, was gemeistert ist — dieselbe
  // Unterscheidung wie beim Wortschatz.
  var abcSitzen = abcGelernt();
  var abcMeister = abcMeisterschaft();
  if (abcSitzen > 0 || abcPool().length < ALPHABET.length) {
    html += '<div class="theme-list"><div class="theme-row">' +
      '<span class="theme-name">Buchstaben</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' +
      (abcSitzen / ALPHABET.length * 100) + '%"></div></div>' +
      '<span class="theme-count">' + abcSitzen + '/' + ALPHABET.length + '</span></div></div>' +
      '<p class="backup-note">' + abcSitzen + ' Buchstaben sitzen · ' + abcMeister +
      ' gemeistert</p>';
  }

  html += '<h2>Leitner-Stufen</h2><div class="boxes">';
  counts.forEach(function (n, bi) {
    var h = Math.max(4, n / ALL_VOCAB.length * 100);
    html += '<div class="boxstat"><div class="boxbar-wrap">' +
      '<div class="boxbar' + (bi === BOX_MAX ? ' gold' : '') + '" style="height:' + h + '%"></div></div>' +
      '<span class="boxnum">' + n + '</span><span class="boxlabel">' + (bi === 0 ? 'neu' : 'St. ' + bi) + '</span></div>';
  });
  html += '</div>';

  // Nur Themen mit Fortschritt; der Rest steht hinter «alle anzeigen».
  var themen = Object.keys(VOCAB_THEMES).map(function (t) {
    var ids = VOCAB_THEMES[t].map(function (w) { return w[0]; });
    return {
      name: t,
      gesamt: ids.length,
      gemeistert: ids.filter(function (id) { return (state.boxes[id] || 0) >= BOX_MAX; }).length,
      begonnen: ids.filter(function (id) { return (state.boxes[id] || 0) > 0; }).length
    };
  });
  var mitFortschritt = themen.filter(function (t) { return t.gemeistert > 0; });
  var zeigen = themenOffen ? themen : mitFortschritt;

  html += '<h2>Nach Themen (gemeistert)</h2>';
  if (!zeigen.length) {
    html += '<p class="backup-note">Noch kein Thema gemeistert — hier erscheint jedes Thema, sobald ' +
      'das erste Wort daraus Stufe ' + BOX_MAX + ' erreicht.</p>';
  }
  html += '<div class="theme-list">';
  zeigen.forEach(function (t) {
    html += '<div class="theme-row"><span class="theme-name">' + esc(t.name) + '</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' + (t.gemeistert / t.gesamt * 100) + '%"></div></div>' +
      '<span class="theme-count">' + t.gemeistert + '/' + t.gesamt + '</span></div>';
  });
  html += '</div>';
  if (themen.length > mitFortschritt.length) {
    html += '<button class="mehr" id="themenMehr">' +
      (themenOffen ? 'Nur Themen mit Fortschritt' : 'Alle ' + themen.length + ' Themen anzeigen') +
      '</button>';
  }

  var gesehen = FACTS.filter(function (f) { return faktStand(f).n > 0; }).length;
  var favoriten = FACTS.filter(function (f) { return faktStand(f).f; }).length;
  html += '<h2>Sprachfakten</h2>' +
    '<p class="backup-note">' + gesehen + ' von ' + FACTS.length + ' gesehen · ' +
    favoriten + ' als Favorit gemerkt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="zuFakten">Fakten durchgehen</button></div>';

  html += '<h2>Sicherung</h2>' +
    '<p class="backup-note">Ihr Fortschritt als kopierbarer Code steht im Men\u00fc unter \u00abSicherung\u00bb \u2014 dort wird er erzeugt und dort auch wieder eingespielt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="zuSicherung">Zur Sicherung</button></div>';

  html += '</section>';

  main.innerHTML = html;

  document.getElementById('zuSicherung').addEventListener('click', function () { setTab('sicherung'); });
  main.querySelectorAll('[data-detail]').forEach(function (b) {
    b.addEventListener('click', function () {
      bilanzDetail = b.dataset.detail;
      window.scrollTo(0, 0);
      renderBilanz();
      renderKopf();
    });
  });
  document.getElementById('zuFakten').addEventListener('click', function () { setTab('fakten'); });
  var mehr = document.getElementById('themenMehr');
  if (mehr) mehr.addEventListener('click', function () { themenOffen = !themenOffen; renderBilanz(); });
}

// ── SICHERUNG ───────────────────────────────────────────────
// Eigene Rubrik im Menü statt eines Anhangs unter der Bilanz: Wer seinen
// Stand sichern oder auf ein anderes Gerät holen will, sucht ihn nicht unter
// Zahlen zum Lernfortschritt. Das Zurücksetzen steht hier mit — es ist die
// Kehrseite derselben Sache und gehört neben den Code, der es auffangen kann.
function renderSicherung() {
  var html = '<section>';
  html += '<p class="backup-note">Ihr Fortschritt als kopierbarer Code \u2014 unabh\u00e4ngig vom automatischen ' +
    'Speichern. Er tr\u00e4gt eine Pr\u00fcfsumme: unvollst\u00e4ndig eingef\u00fcgt wird er abgewiesen statt ' +
    'halb \u00fcbernommen.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="bkMake">Sicherungscode erzeugen</button></div>';
  if (backupOpen) {
    html += '<p class="backup-note">' + esc(bkUeberblick(state)) + ' · ' +
      (backupCode.length / 1024).toFixed(1) + ' KB</p>' +
      '<textarea id="bkOut" readonly rows="3" aria-label="Sicherungscode">' + esc(backupCode) + '</textarea>';
  }
  html += '<textarea id="bkIn" rows="2" placeholder="Sicherungscode hier einf\u00fcgen \u2026" aria-label="Sicherungscode einfügen"></textarea>' +
    '<div class="btn-row"><button class="btn ghost" id="bkImport">Sicherung wiederherstellen</button></div>' +
    (backupMsg ? '<p class="session-info">' + esc(backupMsg) + '</p>' : '');

  html += '<div class="danger-zone">';
  if (!confirmReset) {
    html += '<button class="btn danger" id="rsAsk">Fortschritt zurücksetzen \u2026</button>';
  } else {
    html += '<div class="btn-row"><button class="btn ghost" id="rsNo">Abbrechen</button>' +
      '<button class="btn danger" id="rsYes">Endgültig löschen</button></div>';
  }
  html += '</div></section>';

  main.innerHTML = html;

  document.getElementById('bkMake').addEventListener('click', function () {
    backupCode = encodeBackup();
    backupOpen = true;
    backupMsg = '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupCode).then(function () {
        backupMsg = 'Code in die Zwischenablage kopiert.';
        renderSicherung();
      }, function () {
        backupMsg = 'Bitte Code manuell markieren und kopieren.';
        renderSicherung();
      });
    } else {
      backupMsg = 'Bitte Code manuell markieren und kopieren.';
      renderSicherung();
    }
  });
  var out = document.getElementById('bkOut');
  if (out) out.addEventListener('focus', function () { out.select(); });
  document.getElementById('bkImport').addEventListener('click', function () {
    var code = document.getElementById('bkIn').value;
    if (!code.trim()) { backupMsg = 'Bitte zuerst einen Code einfügen.'; renderSicherung(); return; }
    try {
      var data = decodeBackup(code);
      if (!data || typeof data !== 'object' || !data.boxes) throw new Error('unlesbar');
      state = mergeState(data);
      // Der Lernstand ist ein anderer — jede Übung muss neu aufbauen. Sonst
      // stünde in «Tippen» noch das alte Wort und in «Übersetzen» der alte Satz.
      ansichtenZuruecksetzen();
      backupOpen = false;
      save();
      updateDarstellung();
      updateKopf();
      backupMsg = 'Wiederhergestellt: ' + bkUeberblick(state) + '.';
    } catch (e) {
      backupMsg = e.message === 'Prüfsumme'
        ? 'Der Code ist beschädigt oder unvollständig — bitte noch einmal ganz einfügen.'
        : e.message === 'unvollständig'
          ? 'Der Code bricht mittendrin ab — bitte noch einmal ganz einfügen.'
          : 'Das ist kein Sicherungscode dieser App.';
    }
    renderSicherung();
  });
  var rsAsk = document.getElementById('rsAsk');
  if (rsAsk) rsAsk.addEventListener('click', function () { confirmReset = true; renderSicherung(); });
  var rsNo = document.getElementById('rsNo');
  if (rsNo) rsNo.addEventListener('click', function () { confirmReset = false; renderSicherung(); });
  var rsYes = document.getElementById('rsYes');
  if (rsYes) rsYes.addEventListener('click', function () {
    var behalten = state.settings; // Einstellungen sind kein Fortschritt
    state = defaultState();
    state.settings = behalten;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    ansichtenZuruecksetzen();
    confirmReset = false;
    backupOpen = false;
    backupMsg = '';
    updateKopf();
    save();
    renderSicherung();
  });
}

// ── Start ───────────────────────────────────────────────────
document.querySelectorAll('[data-symbol]').forEach(function (b) {
  b.insertAdjacentHTML('afterbegin', ICON[b.dataset.symbol] || '');
});
document.getElementById('filterKnopf').innerHTML = ICON.filter;
load();
ticketsLaden();
updateDarstellung();

// Jeder Tipp weckt den Klang. Nötig, weil iOS den Kontext beim Wegschalten
// anhält und `resume()` eine Nutzergeste verlangt — die Antwort selbst kommt
// dafür zu spät, sie soll ja schon klingen. Ein Aufwecken, das nichts zu tun
// hat, kostet nichts.
document.addEventListener('pointerdown', function () {
  tonEntsperren();
  tonWecken();
}, true);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) tonWecken();
});

// Ein Zuhörer für alle Hörknöpfe. Weil er am gleichbleibenden #main hängt und
// nicht an den Knöpfen selbst, überlebt er jeden Renderlauf.
main.addEventListener('click', function (e) {
  var k = e.target.closest ? e.target.closest('[data-say]') : null;
  if (k) speak(k.dataset.say, k.dataset.lang);
});

// Jede Ansicht setzt #main neu; der Beobachter merkt das und schickt die Chili
// zur passenden Station, ohne dass jede Renderfunktion daran denken muss.
if (window.MutationObserver) {
  new MutationObserver(function () { chiliAktualisieren(); }).observe(main, { childList: true });
}
// Erst zeichnen, dann die Chili das erste Mal setzen: sonst stünde sie kurz im
// Kopf (main ist noch leer) und spränge danach sichtbar auf ihren Platz in der
// Empfehlung — beim Neuladen sah das aus wie ein Fehler.
render();
menuSetzen(false);
chiliAktualisieren();
meldeKnopfZeigen();
</script>

</html>
