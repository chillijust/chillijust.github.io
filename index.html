    // Die Buchstaben des Wortes, gemischt — plus ein paar fremde, damit es
    // kein Abzählen wird.
    var zeichen = eintrag.v.ru.split('');
    var stoerer = ptStoerer(eintrag.v.ru, Math.min(3, Math.max(1, 8 - zeichen.length)));
    q.tiles = shuffle(zeichen.concat(stoerer)).map(function (ch, i) {
      return { key: i, ch: ch };
    });
    q.laenge = zeichen.length;
  }
  ptQ = q;
}

// Fremde Buchstaben aus dem Alphabet, die im Wort nicht vorkommen.
function ptStoerer(wort, wieviele) {
  var drin = {};
  wort.split('').forEach(function (c) { drin[c] = true; });
  var frei = ALPHABET.map(function (b) { return b[1]; }).filter(function (c) { return !drin[c]; });
  return shuffle(frei).slice(0, wieviele);
}

function ptAbgabeBereit() {
  if (!ptQ) return false;
  if (ptQ.stufe === 'kacheln') return ptBuilt.length === ptQ.laenge;
  return normalize(ptEingabe) !== '';
}

function ptPruefen() {
  var q = ptQ;
  var versuch = q.stufe === 'kacheln'
    ? ptBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('')
    : ptEingabe;
  var richtig = normalize(versuch) === normalize(q.wort.ru);
  ptCorrect = richtig;
  kommentarSetzen({
    ok: richtig, loesung: q.wort.ru, eingabe: versuch,
    getippt: q.stufe !== 'kacheln', daneben: danebenZeichen(versuch, q.wort.ru)
  });
  // Gewertet wird auch hier im Leitner-System: Wer das Wort hier zurückholt,
  // holt es wirklich zurück — sonst wäre das Power-Training ein Spielplatz
  // ohne Folgen.
  var vorher = state.boxes[q.wort.id] || 0;
  updateBox(q.wort.id, richtig);
  meisterMeldung = null;
  meisterPruefen(vorher, state.boxes[q.wort.id], 'Wort', q.wort.ru + ' — ' + q.wort.de,
    woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
  // Auch nach falsch gelegten Kacheln (ADR 0070) — hier zumal: Das
  // Power-Training holt zurückgefallene Wörter zurück, und ein Wort, das man
  // eben noch falsch buchstabiert hat, ist nicht zurückgeholt.
  rekoVerlangen(q.wort.ru, true, richtig, false);
  meisterTon(richtig);
  if (richtig) q.eintrag.treffer++;
  else q.eintrag.treffer = Math.max(0, q.eintrag.treffer - 1);
  zuletztGeuebt('power');
  // Der Topf war eben noch voll und ist es nicht mehr — nur dann.
  if (vorher < SATZ_STUFE && state.boxes[q.wort.id] >= SATZ_STUFE &&
    ptPool().length === 0) jubelZeigen('power');
  save();
  ptPhase = 'feedback';
  renderPower();
}

var ptCorrect = null;

function ptKopfHtml() {
  var html = '<p class="task-label">Power-Training</p><div class="paket">' +
    '<div class="paket-punkte" aria-hidden="true">';
  ptSatz.forEach(function (e) {
    for (var i = 0; i < PT_RUNDEN; i++) {
      html += ppHtml(i < e.treffer ? BOX_MAX : 0);
    }
  });
  var gesamt = ptSatz.reduce(function (n, e) { return n + e.treffer; }, 0);
  html += '</div><p class="paket-text">' + gesamt + ' von ' +
    (ptSatz.length * PT_RUNDEN) + ' · ' + ptSatz.length +
    (ptSatz.length === 1 ? ' Wort zurückholen' : ' Wörter zurückholen') + '</p></div>';
  return html;
}

function renderPower() { leisteRahmen(ptInhaltZeichnen); }

function ptInhaltZeichnen() {
  if (faktKarte) {
    main.innerHTML = faktKarteHtml();
    faktKarteBinden(function () { ptFrageBauen(); renderPower(); });
    chiliAktualisieren();
    return;
  }
  if (!ptOffen() && !ptSatz) { renderPowerLeer(); return; }
  if (!ptSatz) ptRundeStarten();
  if (ptPhase === 'fertig') { renderPowerFertig(); return; }
  if (!ptQ) ptFrageBauen();
  if (!ptQ) { renderPowerFertig(); return; }

  var q = ptQ;
  var html = '<section>' + ptKopfHtml() +
    '<p class="kachel-ort">' + esc(q.wort.theme) + '</p><div class="card">' +
    '<div class="card-meta"><span>' + (q.eintrag.treffer + 1) + ' von ' + PT_RUNDEN + '</span>' +
    '<span class="mitte">' + (q.stufe === 'kacheln' ? 'legen' : 'selbst schreiben') + '</span>' +
    '<span></span></div>' +
    '<p class="task-label">' + (q.stufe === 'kacheln'
      ? 'Setz das Wort zusammen'
      : 'Schreib es auf Russisch') + '</p>' +
    '<p class="word">' + esc(q.wort.de) + hoerknopf(q.wort.de, 'de') + '</p>';

  if (q.stufe === 'tippen-hilfe' && ptPhase === 'ask') {
    html += '<p class="translit">[' + esc(q.wort.tr) + ']</p>';
  }

  if (q.stufe === 'kacheln') {
    html += '<div class="slots">';
    for (var i = 0; i < q.laenge; i++) {
      var gefuellt = i < ptBuilt.length;
      var ch = gefuellt ? q.tiles.filter(function (t) { return t.key === ptBuilt[i]; })[0].ch : '';
      html += '<span class="slot' + (gefuellt ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (ptPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var benutzt = ptBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (benutzt ? ' used' : '') + '" data-pttile="' + t.key + '"' +
          (benutzt ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="ptUndo" aria-label="Letztes Zeichen entfernen">' +
        ICON.ruecktaste + '</button></div>';
    }
  } else {
    html += ptPhase === 'feedback'
      ? pruefzeileHtml(ptEingabe, q.wort.ru, true, 'form')
      : '<textarea id="ptInput" rows="1" class="fliess cyr"' +
        ' lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
        kbFeldAttr(ptKb) + ' enterkeyhint="go" placeholder="кириллица …">' + esc(ptEingabe) + '</textarea>';
  }

  if (ptPhase === 'feedback') {
    html += '<div class="feedback ' + (ptCorrect ? 'good' : 'bad') + '"><p>' +
      (ptCorrect ? ICON.haken + 'Правильно — richtig!'
        : ICON.kreuz + 'Richtig wäre <strong class="cyr">' + betontesWortHtml(q.wort.ru) + '</strong>') +
      '</p></div>' + hoerzeile(q.wort.ru, q.wort.de) + meisterHtml();
  }

  html += '</div>' + rekoHtml() + '<div class="btn-row">';
  if (ptPhase === 'ask') {
    html += '<button class="btn primary" id="ptConfirm"' + (ptAbgabeBereit() ? '' : ' disabled') +
      '>Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="ptNext"' + (rekoFertig() ? '' : ' disabled') +
      '>Weiter →</button>';
  }
  html += '</div>';

  if (q.stufe !== 'kacheln' && ptPhase === 'ask') {
    if (ptKb === null) ptKb = tastaturVorgabe(true);
    html += '<button class="kb-toggle" id="ptKbToggle">' +
      (ptKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (ptKb) html += tastaturHtml('ptkey');
  }
  html += '<p class="session-info">' + ptPool().length + ' gefallene Wörter insgesamt</p></section>';
  main.innerHTML = html;
  ptBinden();
}

function ptBinden() {
  main.querySelectorAll('[data-pttile]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (ptPhase !== 'ask') return;
      var key = parseInt(b.dataset.pttile, 10);
      if (ptBuilt.indexOf(key) !== -1 || ptBuilt.length >= ptQ.laenge) return;
      ptBuilt.push(key);
      if (ptBuilt.length === ptQ.laenge) ptPruefen();
      else renderPower();
    });
  });
  var undo = document.getElementById('ptUndo');
  if (undo) undo.addEventListener('click', function () { ptBuilt.pop(); renderPower(); });

  var feld = document.getElementById('ptInput');
  enterGibtAb(feld, 'ptConfirm');
  if (feld) {
    feld.addEventListener('input', function () {
      ptEingabe = feld.value;
      var knopf = document.getElementById('ptConfirm');
      if (knopf) knopf.disabled = !ptAbgabeBereit();
    });
  }
  main.querySelectorAll('[data-ptkey]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.ptkey;
      ptEingabe = k === 'BS' ? ptEingabe.slice(0, -1) : ptEingabe + k;
      var f = document.getElementById('ptInput');
      feldSchreiben('ptInput', ptEingabe);
      var knopf = document.getElementById('ptConfirm');
      if (knopf) knopf.disabled = !ptAbgabeBereit();
    });
  });
  var kbToggle = document.getElementById('ptKbToggle');
  if (kbToggle) kbToggle.addEventListener('click', function () { ptKb = !ptKb; renderPower(); });

  var confirm = document.getElementById('ptConfirm');
  if (confirm) confirm.addEventListener('click', function () {
    if (ptAbgabeBereit()) ptPruefen();
  });
  rekoBinden(renderPower);
  var next = document.getElementById('ptNext');
  if (next) next.addEventListener('click', function () {
    if (!rekoFertig()) return;
    reko = null;
    if (faktFaellig()) { renderPower(); return; }
    ptFrageBauen(); renderPower();
  });
  var neu = document.getElementById('ptNeu');
  if (neu) neu.addEventListener('click', function () { ptSatz = null; renderPower(); });
  var heim = document.getElementById('ptHeim');
  if (heim) heim.addEventListener('click', function () { setTab('home'); });
}

// Zwei Leerzustände, die sich sehr verschieden anfühlen: noch nichts gefallen
// (schön) und zu wenig für eine Runde (bald).
function renderPowerLeer() {
  var da = ptPool().length;
  main.innerHTML = '<section><div class="leer">' + maskottchen('gross') +
    (da === 0
      ? '<h3>Nichts gefallen</h3><p>Hier sammeln sich die Wörter, die du in ' +
        '«Übersetzen» dreimal hintereinander verschrieben haben. Bisher ist ' +
        'keines dabei — das ist die beste Nachricht, die diese Seite zu bieten hat.</p>'
      : '<h3>Noch zu wenige</h3><p>' + da + ' von ' + PT_MINDEST +
        ' Wörtern sind gefallen. Ab ' + PT_MINDEST + ' lohnt sich eine Runde; ' +
        'für weniger genügt der gewöhnliche Weg über «Lernsets».</p>') +
    '<div class="btn-row"><button class="btn primary" id="ptHeim">Zur Übersicht</button></div>' +
    '</div></section>';
  ptBinden();
}

function renderPowerFertig() {
  var geschafft = ptSatz || [];
  var raus = geschafft.filter(function (e) {
    return (state.boxes[e.v.id] || 0) >= SATZ_STUFE;
  });
  var html = '<section><div class="leer">' + maskottchen('gross') +
    '<h3>Runde geschafft</h3>' +
    '<p>' + geschafft.length + (geschafft.length === 1 ? ' Wort' : ' Wörter') +
    ' je ' + PT_RUNDEN + '× richtig geschrieben.</p>' +
    '<div class="pt-liste">';
  geschafft.forEach(function (e) {
    var frei = (state.boxes[e.v.id] || 0) >= SATZ_STUFE;
    html += '<div class="pt-zeile"><span class="cyr">' + esc(e.v.ru) + '</span>' +
      '<span class="pt-de">' + esc(e.v.de) + '</span>' +
      '<span class="pt-stand' + (frei ? ' frei' : '') + '">' +
      (frei ? 'wieder frei' : 'Stufe ' + (state.boxes[e.v.id] || 0)) + '</span></div>';
  });
  html += '</div>';
  if (raus.length) {
    html += '<p class="naechste">' + raus.length +
      (raus.length === 1 ? ' Wort steht' : ' Wörter stehen') +
      ' wieder auf Satzstufe — die zugehörigen Sätze sind damit offen.</p>';
  }
  html += '<div class="btn-row">';
  if (ptOffen()) html += '<button class="btn ghost" id="ptNeu">Noch eine Runde</button>';
  html += '<button class="btn primary" id="ptHeim">Zur Übersicht</button></div></div></section>';
  main.innerHTML = html;
  ptBinden();
}

// ── TIPPEN ──────────────────────────────────────────────────
// Getippt wird, was beim Vokabeltraining angefangen hat zu sitzen — ab
// settings.tippenStufe. Wer ein Wort richtig tippt, macht damit die letzte
// Stufe voll; danach ist es **aus dem Pool**. Nach der Auffrischfrist kommt es
// einmal zur Sicherheit wieder — richtig getippt, und es ist wieder draußen.
var tWord = null, tResult = null, tHint = false, tKb = null;
// Der getippte Text. Er stand bisher nur im Feld und wurde nach jedem
// Renderlauf von Hand zurückgeschrieben — mit der Prüfzeile gibt es das Feld
// in der Auflösung aber nicht mehr.
var tEingabe = '';
var tippenModus = 'lernen';   // 'lernen' · 'wiederholung' · 'alle'
// Woher die Wörter kommen: der ganze Wortschatz oder ein einzelnes Lernset.
var tippenSet = null;         // null = der Reihe nach, sonst die Set-Nummer

// Der Vorrat einer Wahl. Ein Set, das es nach einer Lehrplanänderung nicht mehr
// gibt, fällt auf den ganzen Wortschatz zurück statt leer zu bleiben.
function tippenVorrat(setNr) {
  return (setNr === null || !LERNSETS[setNr]) ? ALL_VOCAB : LERNSETS[setNr].woerter;
}
// **Ein gewähltes Set sticht die Stufenschwelle** (ADR 0048). Ein Set gilt auf
// SATZ_STUFE als geschafft, «Tippen» beginnt aber erst bei settings.tippenStufe
// — wer sein frisch gelerntes Set nachschreiben will, fände sonst nichts vor.
function tippenSchwelle(setNr) {
  return setNr === null ? state.settings.tippenStufe : 1;
}

// Die drei Stapel an einer Stelle, damit die Auswahl dieselben Zahlen nennt,
// die sie liefert — und damit eine Zählung für ein *anderes* Set möglich ist,
// ohne die laufende Wahl anzufassen.
function tippenWoerter(setNr, modus) {
  var schwelle = tippenSchwelle(setNr);
  var jetzt = Date.now();
  return tippenVorrat(setNr).filter(function (v) {
    var b = state.boxes[v.id] || 0;
    // Fertig und die Frist ist um: einmal zur Sicherheit.
    if (modus === 'wiederholung') return b >= BOX_MAX && faellig(v, jetzt);
    // Alles Begonnene, ohne Rücksicht auf Stufe und Frist — der Stapel zum
    // Festigen. Nie Gesehenes bleibt draußen: «Tippen» ist keine erste
    // Begegnung, sondern eine Behauptung.
    if (modus === 'alle') return b >= 1;
    // Offen: begonnen, aber noch nicht fertig. Ohne Fälligkeitsfilter — wer
    // üben will, soll üben dürfen, nicht auf den nächsten Tag warten.
    return b >= schwelle && b < BOX_MAX;
  });
}
function tippenLernen() { return tippenWoerter(tippenSet, 'lernen'); }
function tippenWiederholung() { return tippenWoerter(tippenSet, 'wiederholung'); }
function tippenAlle() { return tippenWoerter(tippenSet, 'alle'); }
function tippenPool() { return tippenWoerter(tippenSet, tippenModus); }
// Fertig, aber noch nicht fällig — das sind die, die gerade ruhen.
function tippenRuhend() {
  var jetzt = Date.now();
  return tippenVorrat(tippenSet).filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && !faellig(v, jetzt);
  });
}
// Wann wird das nächste ruhende Wort wieder fällig?
function naechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  if (!isFinite(frist)) return '';
  var beste = null;
  tippenRuhend().forEach(function (v) {
    var wann = (state.lastSeen[v.id] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Leerzustand: drei Fälle, die sich sehr verschieden anfühlen — noch nichts
// freigeschaltet, alles getippt, oder gerade nichts fällig.
function renderTippenLeer() {
  var schwelle = tippenSchwelle(tippenSet);
  var ruhend = tippenRuhend().length;
  var offen = tippenLernen().length;
  var frisch = tippenWiederholung().length;
  var fast = tippenVorrat(tippenSet).filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b > 0 && b < schwelle;
  }).sort(function (a, b) { return (state.boxes[b.id] || 0) - (state.boxes[a.id] || 0); });

  var html = '<section><div class="leer">' + maskottchen('gross');

  // Ein gewähltes Set hat seinen eigenen Leerzustand. «Noch kein Wort
  // freigeschaltet» wäre hier gelogen — freigeschaltet ist das Set, angefangen
  // ist es nur nicht.
  if (tippenSet !== null && LERNSETS[tippenSet] && !tippenAlle().length) {
    html += '<h3>Set ' + (tippenSet + 1) + ' ist noch unberührt</h3>' +
      '<p>Getippt wird, was in «Lernsets» schon einmal drankam. Von diesem Set ' +
      'hat noch kein Wort angefangen zu sitzen.</p>' +
      '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Lernsets»</button>' +
      '<button class="btn ghost" id="tAlleSets">Der Reihe nach</button></div>';
  } else if (tippenModus === 'alle') {
    html += '<h3>Nichts zum Festigen</h3>' +
      '<p>Hier steht alles, was schon einmal drankam — ' +
      (tippenSet !== null ? 'aus Set ' + (tippenSet + 1) + ' ' : '') +
      'unabhängig von Stufe und Frist. Noch ist nichts dabei.</p>' +
      '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Lernsets»</button>' +
      (tippenSet !== null ? '<button class="btn ghost" id="tAlleSets">Der Reihe nach</button>' : '') +
      '</div>';
  } else if (tippenModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts fällig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Wort sitzt' : ' Wörter sitzen') + ' und ruhen.' +
          ruhtWeiter(naechsteAuffrischung())
        : 'Hier erscheinen Wörter, die du fertig gelernt hast — ' + auffrischSatz()) + '</p>';
    html += '<div class="btn-row">' +
      (offen ? '<button class="btn primary" id="tZuLernen">' +
        offen + (offen === 1 ? ' Wort offen' : ' Wörter offen') + '</button>' : '') +
      (tippenAlle().length ? '<button class="btn' + (offen ? ' ghost' : ' primary') +
        '" id="tZuAlle">Trotzdem festigen</button>' : '') + '</div>';
  } else if (ruhend || frisch) {
    html += '<h3>Alles getippt</h3>' +
      '<p>Auf der Lernstufe wartet kein Wort mehr. ' +
      (ruhend ? ruhend + (ruhend === 1 ? ' Wort sitzt und ruht. ' : ' Wörter sitzen und ruhen. ') : '') +
      (frisch
        ? frisch + (frisch === 1 ? ' ist' : ' sind') + ' zum Auffrischen bereit.'
        : auffrischKommt(naechsteAuffrischung())) +
      '</p>';
    // Der Ausweg, den es lange nicht gab: Gelerntes noch einmal schreiben,
    // ohne auf die Frist zu warten.
    html += '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="tZuFrisch">Wiederholen</button>' : '') +
      '<button class="btn' + (frisch ? ' ghost' : ' primary') + '" id="tZuAlle">Trotzdem festigen</button>' +
      '<button class="btn ghost" id="tZuUeben">Neue Wörter lernen</button></div>';
  } else {
    html += '<h3>Noch kein Wort freigeschaltet</h3>' +
      '<p>Hier tippst du nur Wörter, die in «Lernsets» oder «Freestyle» angefangen haben zu sitzen — ' +
      'ab Stufe ' + schwelle + ' von ' + BOX_MAX + ', also ' + schwelle +
      '× nacheinander richtig beantwortet.</p>';
    if (fast.length) {
      html += '<p class="naechste">Am nächsten dran: ' + fast.slice(0, 3).map(function (v) {
        return '<span class="cyr">' + esc(v.ru) + '</span> (Stufe ' + (state.boxes[v.id] || 0) + ')';
      }).join(' · ') + '</p>';
    } else {
      html += '<p class="naechste">Noch kein Wort begonnen — fang mit dem ersten Lernset an.</p>';
    }
    html += '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Lernsets»</button></div>';
  }

  html += '</div><p class="session-info">Schwelle und Auffrischfrist stehen in den Einstellungen.</p></section>';
  main.innerHTML = html;

  var zu = document.getElementById('tZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('tZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    tippenModus = 'wiederholung';
    tWord = null;
    renderTippen();
    renderFilter();
  });
  var alleBtn = document.getElementById('tZuAlle');
  if (alleBtn) alleBtn.addEventListener('click', function () {
    tippenModus = 'alle';
    tWord = null;
    renderTippen();
    renderFilter();
  });
  var setBtn = document.getElementById('tAlleSets');
  if (setBtn) setBtn.addEventListener('click', function () {
    tippenSet = null;
    tWord = null;
    renderTippen();
    renderFilter();
  });
  var lernBtn = document.getElementById('tZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    tippenModus = 'lernen';
    tWord = null;
    renderTippen();
    renderFilter();
  });
}

// Das nächste Wort. Steht hier und nicht in `renderTippen()`, weil auch die
// Faktkarte den Weg zurück in die Übung braucht.
function tippenWeiter() {
  tResult = null;
  tHint = false;
  tEingabe = '';
  meisterMeldung = null;
  tWord = waehleWort(tippenPool());
  aufgabeBeginnt();
  renderTippen();
}

function renderTippen() { leisteRahmen(tippenInhaltZeichnen); }

function tippenInhaltZeichnen() {
  if (faktKarte) {
    main.innerHTML = faktKarteHtml();
    faktKarteBinden(function () { tippenWeiter(); });
    chiliAktualisieren();
    return;
  }
  if (tKb === null) tKb = tastaturVorgabe(true);
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln —
  // sonst stünde man vor einem Leerzustand, obwohl es etwas zu tun gibt.
  // «Alle» bleibt davon unberührt: Wer festigen will, hat das ausdrücklich
  // gewählt und soll nicht stillschweigend woandershin geschoben werden.
  if (!tResult && tippenModus !== 'alle' && !tippenPool().length) {
    var anderer = tippenModus === 'lernen' ? 'wiederholung' : 'lernen';
    tippenModus = anderer;
    if (!tippenPool().length) tippenModus = 'lernen';
  }
  var pool = tippenPool();
  // Während der Rückmeldung bleibt das Wort stehen, auch wenn es nach einem
  // Fehler unter die Schwelle gerutscht ist — sonst verschwände die Auflösung.
  if (!tResult && (!tWord || pool.indexOf(tWord) === -1)) { tWord = waehleWort(pool); aufgabeBeginnt(); }
  if (!tWord) { renderTippenLeer(); return; }
  var w = tWord;
  var stats = state.typingStats;
  var total = stats.correct + stats.wrong;

  var html = '<section><div data-leiste></div><div class="card">' +
    '<p class="task-label">' + (tippenModus === 'wiederholung'
      ? 'Zur Sicherheit noch einmal'
      : tippenModus === 'alle' ? 'Noch einmal, zum Festigen'
        : 'Schreib auf Russisch') +
    (tippenSet !== null && LERNSETS[tippenSet] ? ' · Set ' + (tippenSet + 1) : '') + '</p>' +
    '<p class="word">' + esc(w.de) + hoerknopf(w.de, 'de') + '</p>' +
    (tHint ? '<p class="translit">[' + esc(w.tr) + ']</p>' : '') +
    (tResult
      ? pruefzeileHtml(tEingabe, w.ru, true, 'wort')
      : '<input type="text" id="tInput" class="cyr" value="' + esc(tEingabe) + '"' +
        ' placeholder="кириллица \u2026" lang="ru" autocapitalize="off"' +
        ' autocorrect="off" spellcheck="false" enterkeyhint="go"' + kbFeldAttr(tKb) + '>');

  if (tResult === 'wrong') html += '<p class="feedback bad">' + ICON.kreuz + 'Richtig: <strong class="cyr">' + betontesWortHtml(w.ru) + '</strong></p>';
  if (tResult === 'right') html += '<p class="feedback good">' + ICON.haken + 'Правильно — richtig!</p>';
  // Erst nach der Abgabe zu hören: vorher wäre die Aussprache die halbe Antwort.
  if (tResult) html += hoerzeile(w.ru, w.de) + meisterHtml();
  html += '</div>' + rekoHtml() + '<div class="btn-row">';
  if (!tResult) {
    html += '<button class="btn ghost" id="tHintBtn">Hinweis</button>' +
      '<button class="btn primary" id="tCheck">Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="tNext"' + (rekoFertig() ? '' : ' disabled') +
      '>Nächstes Wort \u2192</button>';
  }
  html += '</div>';
  // **Nur solange es ein Feld gibt.** In der Auflösung ist das Eingabefeld weg,
  // und eine Tastatur ohne Feld ist eine Attrappe — seit es die Nachschrift
  // gibt, stünden dazu zwei Tastaturen übereinander.
  if (!tResult) {
    html += '<button class="kb-toggle" id="tKbToggle">' +
      (tKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    // Dieselbe Tastatur wie in den anderen Übungen — sie stand hier
    // gleichlautend ein zweites Mal, und ein Layout an zwei Stellen ist eines zu viel.
    if (tKb) html += tastaturHtml('key');
  }
  html += '<p class="session-info">' + pool.length +
    (tippenModus === 'wiederholung' ? ' zum Auffrischen' : ' offen') + ' · ' +
    stats.correct + ' richtig · ' + stats.wrong + ' falsch' +
    (total > 0 ? ' · Quote ' + Math.round(stats.correct / total * 100) + ' %' : '') + '</p></section>';

  main.innerHTML = html;

  // In der Auflösung steht hier kein Feld mehr, sondern die Prüfzeile.
  var input = document.getElementById('tInput');

  function check() {
    if (tResult) return;
    var ok = normalize(tEingabe) === normalize(w.ru);
    tResult = ok ? 'right' : 'wrong';
    rekoVerlangen(w.ru, true, ok, false);
    kommentarSetzen({
      ok: ok, loesung: w.ru, eingabe: tEingabe, getippt: true,
      daneben: danebenZeichen(tEingabe, w.ru)
    });
    var vorher = state.boxes[w.id] || 0;
    updateBox(w.id, ok);
    meisterMeldung = null;
    meisterPruefen(vorher, state.boxes[w.id], 'Wort', w.ru + ' — ' + w.de,
      woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
    meisterTon(ok);
    state.typingStats.correct += ok ? 1 : 0;
    state.typingStats.wrong += ok ? 0 : 1;
    zuletztGeuebt('tippen');
    save();
    renderTippen();
  }
  enterGibtAb(input, 'tCheck');
  if (input) {
    input.addEventListener('input', function () { tEingabe = input.value; });
  }
  var hintBtn = document.getElementById('tHintBtn');
  if (hintBtn) hintBtn.addEventListener('click', function () {
    tHint = true;
    renderTippen();
  });
  var checkBtn = document.getElementById('tCheck');
  if (checkBtn) checkBtn.addEventListener('click', check);
  rekoBinden(renderTippen);
  var nextBtn = document.getElementById('tNext');
  if (nextBtn) nextBtn.addEventListener('click', function () {
    if (!rekoFertig()) return;
    reko = null;
    // Der Fakt kommt beim Weitergehen, nicht in der Auflösung.
    if (faktFaellig()) { renderTippen(); return; }
    tippenWeiter();
  });
  var tKbKnopf = document.getElementById('tKbToggle');
  if (tKbKnopf) tKbKnopf.addEventListener('click', function () {
    tKb = !tKb;
    renderTippen();
  });
  main.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (tResult) return;
      var k = b.dataset.key;
      tEingabe = k === 'BS' ? tEingabe.slice(0, -1) : tEingabe + k;
      var inp = document.getElementById('tInput');
      feldSchreiben('tInput', tEingabe);
    });
  });
}

// ── EINSTELLUNGEN ───────────────────────────────────────────
// Die Reiter der Einstellungen. Die Reihenfolge ist dieselbe wie zuvor die der
// Überschriften — was zuerst gefragt wird, steht zuerst.
// Die Reihenfolge ist eine Aussage darüber, was man am ehesten sucht: erst
// was die App über sich selbst sagt und wie sie aussieht, dann der Lernweg,
// zuletzt die beiden feinen Schrauben am Antworten und am Tippen. «App» ist
// ein eigener Reiter, keine Zeile bei «Darstellung» — was die App über sich
// weiß, hat mit Farben nichts zu tun (ADR 0059).
var EINST_REITER = [
  { id: 'app', name: 'App' },
  { id: 'darstellung', name: 'Darstellung' },
  { id: 'lernweg', name: 'Lernweg' },
  // Hieß bis 2.4.3 «Abgabe» und «Eingabe» — zwei Wörter, die sich reimen und
  // nichts sagen. Jetzt steht dran, was drin ist.
  { id: 'antworten', name: 'Antworten' },
  { id: 'tastatur', name: 'Tastatur' }
];
// Geöffnet wird beim **ersten** Reiter, nicht bei einem ausgesuchten: «App»
// steht vorn, weil man dort zuerst nachsieht, wenn etwas mit der App selbst
// ist. Bis 2.4.8 stand hier «Lernweg» — das war eine zweite Meinung über die
// Reihenfolge, und zwei Meinungen sind eine zu viel (ADR 0067).
var einstReiter = EINST_REITER[0].id;

// Wischen wechselt den Reiter — dieselbe Geste wie im Kopf, nur waagerecht
// begrenzt aufs Blatt. Der Randwisch für «zurück» hat Vorrang: Er beginnt am
// linken Rand, dieser hier nicht.
// Alle vier Blätter stehen nebeneinander auf einer Bahn; gezeigt wird über
// `translateX`. Erst dadurch kann der Finger sie **mitnehmen** — ein Wechsel
// beim Loslassen wäre ein Sprung, kein Blättern.
function einstIndex() {
  for (var i = 0; i < EINST_REITER.length; i++) {
    if (EINST_REITER[i].id === einstReiter) return i;
  }
  return 0;
}

function einstBahnSetzen(versatz, weich) {
  var bahn = document.getElementById('einstBahn');
  if (!bahn) return;
  bahn.style.transition = weich
    ? 'transform .32s cubic-bezier(.25, .9, .3, 1)' : 'none';
  bahn.style.transform = 'translateX(calc(' + (-einstIndex() * 100) + '% + ' +
    (versatz || 0).toFixed(1) + 'px))';
}

// Der Finger nimmt die Bahn mit. Waagerecht muss deutlich überwiegen, sonst
// war es ein Scrollen — und **welches von beiden es ist, entscheidet sich
// einmal** und bleibt dann für die ganze Geste stehen. Wer das je Bild neu
// entscheidet, bekommt ein Blatt, das beim Scrollen zittert.
function einstWischenBinden() {
  var rahmen = document.getElementById('einstRahmen');
  if (!rahmen) return;
  var x0 = 0, y0 = 0, breite = 1;
  var aktiv = false, entschieden = false, quer = false;

  rahmen.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { aktiv = false; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    // Der linke Rand gehört dem Zurückwischen — dort fassen wir nicht an.
    aktiv = x0 > 28;
    entschieden = false;
    quer = false;
    breite = rahmen.getBoundingClientRect().width || 1;
    einstBahnSetzen(0, false);
  }, { passive: true });

  rahmen.addEventListener('touchmove', function (e) {
    if (!aktiv || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - x0;
    var dy = e.touches[0].clientY - y0;
    if (!entschieden) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      entschieden = true;
      quer = Math.abs(dx) > Math.abs(dy) * 1.2;
      if (!quer) { aktiv = false; einstBahnSetzen(0, true); return; }
    }
    if (!quer) return;
    // Am ersten und letzten Blatt zieht es zäh: Der Widerstand sagt, dass
    // dahinter nichts mehr kommt, ohne dass es dazu einen Satz braucht.
    var i = einstIndex();
    if ((i === 0 && dx > 0) || (i === EINST_REITER.length - 1 && dx < 0)) dx *= 0.32;
    einstBahnSetzen(dx, false);
    // Ein waagerechter Zug ist kein Scrollen — sonst wandert die Seite mit.
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  var loslassen = function (e) {
    if (!aktiv) return;
    aktiv = false;
    if (!quer || !e.changedTouches.length) { einstBahnSetzen(0, true); return; }
    var dx = e.changedTouches[0].clientX - x0;
    // Ein Drittel der Breite genügt — oder ein kurzer, entschiedener Wisch.
    var reicht = Math.abs(dx) > Math.min(breite / 3, 120);
    if (!reicht) { einstBahnSetzen(0, true); return; }
    einstReiterWechseln(dx < 0 ? 1 : -1);
  };
  rahmen.addEventListener('touchend', loslassen, { passive: true });
  rahmen.addEventListener('touchcancel', function () {
    aktiv = false;
    einstBahnSetzen(0, true);
  }, { passive: true });
}

// Beim Wechsel wird die Bahn geschoben, nicht neu gezeichnet: Alle vier Blätter
// stehen ohnehin da, und ein Neuaufbau brächte den Übergang zum Stocken.
function einstReiterWechseln(richtung) {
  var neu = einstIndex() + richtung;
  if (neu < 0 || neu >= EINST_REITER.length) { einstBahnSetzen(0, true); return; }
  einstReiter = EINST_REITER[neu].id;
  einstBahnSetzen(0, true);
  einstReiterKopf();
}

// Nur die Leiste nachziehen — das Blatt schiebt sich von selbst.
function einstReiterKopf() {
  main.querySelectorAll('[data-reiter]').forEach(function (b) {
    var an = b.dataset.reiter === einstReiter;
    b.classList.toggle('active', an);
    b.setAttribute('aria-selected', an ? 'true' : 'false');
  });
  main.querySelectorAll('[data-reiterblatt]').forEach(function (bl) {
    var an = bl.dataset.reiterblatt === einstReiter;
    bl.setAttribute('aria-hidden', an ? 'false' : 'true');
    // Was daneben liegt, ist außerhalb des Fensters — der Fokus soll trotzdem
    // nicht hineinspringen, sonst scrollt die Seite zu einem unsichtbaren
    // Schalter. Dieselbe Regel wie beim zugeklappten Menü.
    bl.querySelectorAll('button').forEach(function (b) { b.tabIndex = an ? 0 : -1; });
  });
}

// ── Der Zähler in den Einstellungen ─────────────────────────
// Zwei Tasten und ein Wert. Gedrückt halten zählt weiter — ohne das wäre der
// Weg von 21 auf 60 Tage vierzig Tipper, und der Zähler wäre schlechter als
// die vier festen Stufen, die er ablöst.
var zaehlerAnlauf = null;   // Wartezeit bis zur Wiederholung
var zaehlerTakt = null;     // die Wiederholung selbst
var zaehlerLief = false;    // hat die Wiederholung schon gezählt?

function zaehlerSchritt(key, schritt) {
  var alt = state.settings[key];
  var neu = zaehlerGrenzen(key, (alt | 0) + schritt);
  if (neu === alt) return false;
  state.settings[key] = neu;
  save();
  return true;
}

// Was im Zähler steht. **Null ist kein Wert, sondern eine Abwesenheit** — «0
// neu/Tag» hieße «gar nichts Neues», gemeint ist aber «keine Grenze». Darum
// tauschen beide Hälften den Text.
function zaehlerAnzeige(key, wert, einheit) {
  if (key === 'tagesmass' && !wert) return { zahl: '\u2014', einheit: 'ohne Grenze' };
  // «0 Tage» hieße «sofort wieder fällig» — das Gegenteil des Gemeinten.
  if (key === 'auffrischen' && !wert) return { zahl: '\u2014', einheit: 'gar nicht' };
  return { zahl: String(wert), einheit: einheit };
}

// Nur die Zahl und die zwei Anschläge, nicht die ganze Ansicht.
function zaehlerFrischen(wo) {
  if (!wo) return;
  var key = wo.querySelector('[data-zaehler]').dataset.zaehler;
  var wert = state.settings[key];
  var a = zaehlerAnzeige(key, wert, wo.dataset.einheit || '');
  var zahl = wo.querySelector('.zaehler-wert');
  zahl.firstChild.nodeValue = a.zahl;
  zahl.querySelector('small').textContent = a.einheit;
  wo.querySelectorAll('[data-zaehler]').forEach(function (t) {
    var s = parseInt(t.dataset.schritt, 10);
    t.disabled = s < 0 ? wert <= +wo.dataset.min : wert >= +wo.dataset.max;
  });
}

function zaehlerHalten(tick) {
  zaehlerLoslassen();
  zaehlerAnlauf = setTimeout(function () {
    zaehlerTakt = setInterval(function () {
      zaehlerLief = true;
      if (!tick()) zaehlerLoslassen();
    }, 90);
  }, 420);
}

function zaehlerLoslassen() {
  if (zaehlerAnlauf) { clearTimeout(zaehlerAnlauf); zaehlerAnlauf = null; }
  if (zaehlerTakt) { clearInterval(zaehlerTakt); zaehlerTakt = null; }
}
// Am Dokument, nicht am Knopf: Wer den Finger neben die Taste zieht und dort
// loslässt, bekäme sonst einen Zähler, der weiterläuft.
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (art) {
  document.addEventListener(art, zaehlerLoslassen);
});

function renderEinstellungen() {
  var s = state.settings;

  function schalter(key, titel, hinweis, gesperrt) {
    var an = s[key];
    return '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<button class="switch' + (an ? ' on' : '') + '" role="switch" aria-checked="' + (an ? 'true' : 'false') +
      '" aria-label="' + esc(titel) + '" data-set="' + key + '"' + (gesperrt ? ' disabled' : '') +
      '><span class="knob"></span></button></div>';
  }

  // **Ein Weg statt einer Schalterreihe** (ADR 0075). Acht Chips konnten nur
  // «zeigen» und «wegräumen»; das Einrichten ist jetzt ein eigenes Fenster,
  // weil es drei Rubriken und eine Reihenfolge kennt.
  function kachelWahl() {
    var oben = state.settings.homeOben;
    var weg = (state.settings.homeAus || []).length;
    var stand = (oben ? oben.length + ' oben' : 'automatisch') +
      (weg ? ' · ' + weg + ' versteckt' : '');
    return '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">Übersicht einrichten</span>' +
      '<span class="setting-note">Welche Übungen die Übersicht zeigt, in welcher ' +
      'Rubrik und in welcher Reihenfolge. Zurzeit: ' + esc(stand) + '.</span></span>' +
      '<button class="btn ghost einst-weiter" id="zuEinrichten">Öffnen</button></div>';
  }

  // Auswahl aus mehreren Werten (Leitner-Stufe) als Chip-Reihe.
  function wahl(key, titel, hinweis, werte) {
    var html = '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahl="' + key +
        '" data-wert="' + w.wert + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

  // Ein Wert zum Hoch- und Runterzählen. Für eine **Frist** ist das die
  // ehrlichere Form als vier Chips: Jede Zahl dazwischen ist eine gültige
  // Antwort, und wer 18 Tage will, soll nicht zwischen 14 und 21 wählen müssen.
  function zaehler(key, titel, hinweis, einheit) {
    var g = ZAEHLER[key];
    var wert = s[key];
    var a = zaehlerAnzeige(key, wert, einheit);
    function taste(schritt, name, symbol, aus) {
      return '<button class="zaehler-taste" data-zaehler="' + key +
        '" data-schritt="' + schritt + '" aria-label="' + esc(name) +
        '"' + (aus ? ' disabled' : '') + '>' + symbol + '</button>';
    }
    return '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="zaehler" role="group" aria-label="' + esc(titel) + '"' +
      ' data-min="' + g.min + '" data-max="' + g.max + '" data-einheit="' + esc(einheit) + '">' +
      taste(-1, 'Einen weniger', ICON.minus, wert <= g.min) +
      '<span class="zaehler-wert" role="status">' + esc(a.zahl) +
      '<small>' + esc(a.einheit) + '</small></span>' +
      taste(1, 'Einen mehr', ICON.plus, wert >= g.max) +
      '</span></div>';
  }

  function wahlText(key, titel, hinweis, werte) {
    // Ab vier Knöpfen bliebe für den Hinweis eine Schlucht von wenigen Wörtern
    // Breite — dann rückt die Wahl unter den Text.
    var html = '<div class="setting' + (werte.length > 3 ? ' breit' : '') +
      '"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahltext="' + key +
        '" data-wert="' + esc(w.wert) + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

  var ohneBestaetigung = !s.confirmUeben && !s.confirmUebersetzen;

  // Gegliedert nach der Frage, die die Einstellung beantwortet: *was* wird
  // wann geübt, *wie* gebe ich ab, *womit* tippe ich, *wie* wirkt die App.
  // Vier Fragen, vier Reiter. Zu allen zugleich gehört Scrollen, und wer
  // scrollt, verliert die Übersicht darüber, was es überhaupt gibt. Die Leiste
  // bleibt oben stehen — man soll jederzeit sehen, wo man ist.
  var teile = {};
  teile.lernweg =
    wahl('tippenStufe', 'Tippen ab Stufe',
      'Ab welcher Leitner-Stufe ein Wort in «Tippen» erscheint. Stufe 3 heißt: drei Mal nacheinander richtig — richtig getippt macht es dann Stufe 4 voll.',
      [{ wert: 2, text: '2' }, { wert: 3, text: '3' }, { wert: 4, text: '4' }]) +
    wahlText('betonung', 'Betonungszeichen',
      'Der betonte Vokal klingt voll, alle anderen fallen zusammen — молоко́ spricht sich «malakó». ' +
      'Beim Lernen hilft das Zeichen; im Druck steht es nicht.',
      [{ wert: 'lernen', text: 'Beim Lernen' }, { wert: 'immer', text: 'Immer' },
       { wert: 'nie', text: 'Nie' }]) +
    zaehler('auffrischen', 'Auffrischen nach',
      'Fertig Gelerntes verschwindet aus «Tippen» und «Übersetzen». Nach dieser Frist kommt es einmal zur Sicherheit zurück — richtig beantwortet, und es ist wieder draußen. Auf null gestellt kommt gar nichts mehr zurück.',
      'Tage') +
    zaehler('tagesmass', 'Neue Wörter am Tag',
      'Wie viele Wörter an einem Tag neu anfangen dürfen. Ohne Grenze lernst du an einem ' +
      'guten Abend vierzig — und bekommst sie drei Wochen später alle am selben Tag zurück. ' +
      'Wiederholen bleibt immer unbegrenzt.',
      'neu/Tag') +
    schalter('fehlerprofil', 'Ablenker aus deinen Fehlern',
      'Die App merkt sich, womit du ein Wort verwechselt hast, und stellt genau diese ' +
      'Wörter wieder nebeneinander. Aus: Die Ablenker kommen aus dem Zufall.') +
    '';
  teile.antworten =
    schalter('confirmUeben', 'Bestätigen beim Vokabeltraining',
      'Antwort erst auswählen, dann mit «Bestätigen» abgeben. Aus: Der erste Tipp zählt sofort.') +
    schalter('confirmUebersetzen', 'Bestätigen in «Übersetzen»',
      'Satz erst zusammenstellen, dann mit «Bestätigen» abgeben. Aus: Der Satz zählt, sobald das letzte Wort liegt.') +
    schalter('requireComplete', 'Erst bei vollständiger Lösung',
      'Bestätigen ist erst möglich, wenn alle Buchstaben beziehungsweise Wörter liegen. Verrät dadurch die Länge der Lösung.',
      ohneBestaetigung) +
    wahlText('rekonstruktion', 'Nach einem Schreibfehler',
      'Die Lösung anzusehen genügt nicht — die Hand lernt beim Schreiben. Wer sich ' +
      'verschreibt, schreibt das Wort einmal richtig nach, bevor es weitergeht. Gewertet ' +
      'wird dabei nichts mehr. «Auch Sätze» nimmt ganze Sätze dazu.',
      [{ wert: 'woerter', text: 'Wörter' }, { wert: 'immer', text: 'Auch Sätze' },
       { wert: 'nie', text: 'Nie' }]) + '';
  teile.tastatur =
    schalter('tastaturAuto', 'Kyrillische Tastatur von selbst',
      'Verlangt eine Aufgabe Kyrillisch, klappt die eingebaute Tastatur gleich auf. ' +
      'Aus: Du holst sie bei Bedarf. Wo Deutsch gefragt ist, kommt sie nie — dort ' +
      'schreibt die Gerätetastatur.') + '';
  teile.darstellung =
    kachelWahl() +
    wahlText('schema', 'Farbschema',
      '«Dark» ist die Vorgabe, «Classic» das helle Cremeweiß. Grün, Blau und Rosa ' +
      'sind helle Cremetöne. Schrift und Signalfarben bleiben in jedem Schema gleich.',
      SCHEMATA) +
    schalter('kommentare', 'Kommentare der Chili',
      'Nach jeder Auflösung ein Satz — mal Lob, mal eine trockene Bemerkung. ' +
      'Aus: Die Zeile bleibt leer, alles Übrige bleibt, wie es ist.') +
    schalter('ton', 'Ton bei richtig und falsch',
      'Ein kurzer Klang nach jeder Antwort. Auf iOS klingt er auch bei gestelltem ' +
      'Stummschalter, sofern das Gerät die Sitzungssteuerung kennt.') +
    '<div class="setting"><span class="setting-text">' +
    '<span class="setting-title">Ton prüfen</span>' +
    '<span class="setting-note">Spielt den Klang für «richtig» und sagt darunter, was ' +
    'gerade eingerichtet ist. Hörst du nichts, steht dort, woran es liegt.</span></span>' +
    '<button class="chip" id="tonTest">Abspielen</button></div>' +
    '<p class="settings-note" id="tonStand">' + esc(tonAuskunft()) + '</p>';

  // **Was die App über sich selbst weiß.** Kein Schalter ist hier — es gibt
  // nichts einzustellen, nur nachzusehen. Der Service Worker ist entweder da
  // oder nicht; erzwingen lässt er sich nicht (ADR 0059).
  teile.app =
    '<div class="setting"><span class="setting-text">' +
    '<span class="setting-title">Offline bereit</span>' +
    '<span class="setting-note">Ist die App auf diesem Gerät abgelegt? Dann läuft sie ' +
    'auch ohne Netz — nicht nur, solange der Browser sie zufällig noch im Zwischenspeicher ' +
    'hat.</span></span>' +
    '<span class="app-wert' + (swStand.bereit ? ' bereit' : '') + '" id="swBereit"' +
    ' aria-label="' + esc(swAuskunftGelesen()) + '">' + esc(swAuskunft()) + '</span></div>' +
    '<div class="setting"><span class="setting-text">' +
    '<span class="setting-title">Nach Aktualisierung suchen</span>' +
    '<span class="setting-note">Sieht nach, ob eine neue Fassung bereitliegt. ' +
    'Findet sich eine, heißt der Knopf «Update» — geladen wird sie erst, wenn du ' +
    'ihn drückst.</span></span>' +
    '<button class="chip sw-knopf" id="swSuchen">Suchen</button></div>' +
    '<div class="setting"><span class="setting-text">' +
    '<span class="setting-title">Speicher der App leeren</span>' +
    '<span class="setting-note">Der Notausgang: meldet den Service Worker ab, wirft den ' +
    'abgelegten Stand weg und lädt neu. Dein Lernstand bleibt — der liegt woanders. ' +
    'Nur nötig, wenn die App nach einer Aktualisierung klemmt.</span></span>' +
    '<button class="chip" id="swLeeren">' +
    (swLeerenSicher ? 'Wirklich leeren?' : 'Leeren') + '</button></div>' +
    '<p class="settings-note">Chillingo ' + esc(APP_VERSION) + ' läuft gerade. ' +
    'Steht oben eine andere Fassung, wartet sie darauf, übernommen zu werden.</p>';

  var reiter = '<div class="reiter" role="tablist">';
  EINST_REITER.forEach(function (r) {
    reiter += '<button class="reiter-knopf' + (r.id === einstReiter ? ' active' : '') +
      '" role="tab" aria-selected="' + (r.id === einstReiter ? 'true' : 'false') +
      '" data-reiter="' + r.id + '">' + esc(r.name) + '</button>';
  });
  reiter += '</div>';

  // Alle Blätter stehen nebeneinander auf einer Bahn — nur so kann der Finger
  // sie mitnehmen. Sichtbar ist das Fenster darüber.
  var bahn = '<div class="reiter-rahmen" id="einstRahmen"><div class="reiter-bahn" id="einstBahn">';
  EINST_REITER.forEach(function (r) {
    bahn += '<div class="reiter-blatt" role="tabpanel" aria-label="' + esc(r.name) +
      '" data-reiterblatt="' + r.id + '" aria-hidden="' +
      (r.id === einstReiter ? 'false' : 'true') + '">' +
      '<div class="blattkarte">' + teile[r.id] + '</div></div>';
  });
  bahn += '</div></div>';

  main.innerHTML = '<section>' + reiter + bahn +
    '<p class="settings-note">Die Einstellungen gelten nur auf diesem Gerät und werden zusammen mit dem ' +
    'Lernstand gespeichert. «Fortschritt zurücksetzen» in der Sicherung lässt sie unberührt.</p>' +
    '<p class="settings-note">Chillingo ' + esc(APP_VERSION) + ' · Stand ' + esc(APP_STAND) + '</p>' +
    '<div class="btn-row"><button class="btn ghost" id="setBack">Zurück</button></div></section>';

  main.querySelectorAll('[data-reiter]').forEach(function (b) {
    b.addEventListener('click', function () {
      einstReiter = b.dataset.reiter;
      einstBahnSetzen(0, true);
      einstReiterKopf();
    });
  });
  einstBahnSetzen(0, false);
  einstReiterKopf();
  einstWischenBinden();

  main.querySelectorAll('[data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      var key = b.dataset.set;
      state.settings[key] = !state.settings[key];
      save();
      renderEinstellungen();
    });
  });
  var zuEinr = document.getElementById('zuEinrichten');
  if (zuEinr) zuEinr.addEventListener('click', function () { setTab('einrichten'); });
  main.querySelectorAll('[data-wahltext]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.settings[b.dataset.wahltext] = b.dataset.wert;
      save();
      updateDarstellung();
      renderEinstellungen();
    });
  });
  main.querySelectorAll('[data-wahl]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.settings[b.dataset.wahl] = parseInt(b.dataset.wert, 10);
      save();
      renderEinstellungen();
    });
  });
  // Der Zähler zeichnet **an Ort und Stelle** nach, nicht über die ganze
  // Ansicht: Wer die Taste hält, hielte sonst einen Knopf, den der Renderlauf
  // gerade weggeworfen hat — und die Wiederholung liefe ins Leere.
  main.querySelectorAll('[data-zaehler]').forEach(function (b) {
    var schritt = parseInt(b.dataset.schritt, 10);
    function tick() {
      if (!zaehlerSchritt(b.dataset.zaehler, schritt)) { zaehlerLoslassen(); return false; }
      zaehlerFrischen(b.parentNode);
      return true;
    }
    b.addEventListener('click', function () {
      // Nach einem Halten hat die Wiederholung schon gezählt; der Klick, der
      // beim Loslassen noch kommt, würde sonst einen Tag draufsetzen.
      if (zaehlerLief) { zaehlerLief = false; return; }
      tick();
    });
    b.addEventListener('pointerdown', function () { zaehlerHalten(tick); });
  });
  // Den App-Reiter gibt es erst, seit es einen Service Worker gibt — und seine
  // Knöpfe nur, wenn er offen ist.
  var suchen = document.getElementById('swSuchen');
  if (suchen) {
    // Zeichnen, nicht nur binden: Wartet schon eine Fassung, steht «Update»
    // darauf, sobald der Reiter aufgeht — auch nach einem Neuzeichnen.
    swKnopfZeichnen();
    suchen.addEventListener('click', swKnopfTippen);
  }
  var leeren = document.getElementById('swLeeren');
  if (leeren) leeren.addEventListener('click', function () {
    if (!swLeerenSicher) {
      swLeerenSicher = true;
      renderEinstellungen();
      return;
    }
    leeren.textContent = 'Räume auf …';
    swAufraeumen(function () { window.location.reload(); });
  });

  // Den Tonknopf gibt es nur auf seinem Reiter.
  var tonKnopf = document.getElementById('tonTest');
  if (tonKnopf) tonKnopf.addEventListener('click', function () {
    // Der Tipp selbst ist die Geste, die iOS verlangt — erst entsperren, dann
    // spielen, dann berichten. Die Auskunft kommt kurz verzögert, weil
    // `resume()` asynchron ist und der Zustand sonst noch der alte wäre.
    tonEntsperren();
    ton(true);
    var zeile = document.getElementById('tonStand');
    setTimeout(function () {
      if (zeile) zeile.textContent = tonAuskunft();
    }, 150);
  });
  document.getElementById('setBack').addEventListener('click', zurueckGehen);
}

// ── SPRACHFAKTEN ────────────────────────────────────────────
var faktenFilter = 'gesehen'; // 'gesehen' · 'favoriten' · 'alle'

// ── Gemerktes ───────────────────────────────────────────────
// Die Regeln, die man sich aufgehoben hat, ganz — nicht als Anriss. Wer eine
// Erklärung noch einmal lesen will, will sie **lesen**, nicht suchen, wo sie
// weitergeht. Ein Tipp auf den Stern nimmt sie wieder heraus.
function renderMerkzettel() {
  var liste = gemerkteRegeln();
  var html = '<section>';
  if (!liste.length) {
    html += '<div class="leer">' + maskottchen('gross') + '<h3>Noch nichts gemerkt</h3>' +
      '<p>In «Grammatik» und «Schreibung» sitzt oben rechts an jeder Regelkarte ein ' +
      'Stern. Was du damit markierst, findest du hier wieder.</p></div>';
  } else {
    liste.forEach(function (e) {
      var b = e.art === 'g' ? gramFinde(e.id) : orthoFinde(e.id);
      if (!b) return;
      html += e.art === 'g' ? gramRegelHtml(b, false) : orthoRegelHtml(b, false);
    });
  }
  html += '<div class="btn-row"><button class="btn ghost" id="merkBack">Zurück</button></div>' +
    '</section>';
  main.innerHTML = html;
  // Der Stern nimmt hier wieder heraus — dann ist die Karte weg, und die Liste
  // muss neu stehen.
  merkBinden(renderMerkzettel);
  document.getElementById('merkBack').addEventListener('click', zurueckGehen);
}

function renderFakten() {
  var gesehen = FACTS.filter(function (f) { return faktStand(f).n > 0; });
  var favoriten = FACTS.filter(function (f) { return faktStand(f).f; });
  var liste = faktenFilter === 'alle' ? FACTS
    : faktenFilter === 'favoriten' ? favoriten
    : gesehen;
  if (faktenFilter === 'gesehen') {
    // am häufigsten Gezeigtes zuerst — das sind die, die man wirklich kennt
    liste = liste.slice().sort(function (a, b) { return faktStand(b).n - faktStand(a).n; });
  }

  var html = '<section><div class="controls">' +
    [['gesehen', 'Gesehen ' + gesehen.length], ['favoriten', 'Favoriten ' + favoriten.length],
      ['alle', 'Alle ' + FACTS.length]].map(function (w) {
      return '<button class="chip' + (faktenFilter === w[0] ? ' active' : '') +
        '" data-filter="' + w[0] + '">' + esc(w[1]) + '</button>';
    }).join('') + '</div>';

  if (!liste.length) {
    html += '<div class="leer">' + maskottchen('gross') + '<h3>' +
      (faktenFilter === 'favoriten' ? 'Noch keine Favoriten' : 'Noch keinen Fakt gesehen') + '</h3>' +
      '<p>' + (faktenFilter === 'favoriten'
        ? 'Tipp auf den Stern, wenn dir einer gefällt — hier findest du ihn wieder.'
        : 'Nach je fünf Antworten erscheint ein Sprachfakt. Sie sammeln sich hier an.') +
      '</p></div>';
  } else {
    html += '<div class="faktenliste">';
    liste.forEach(function (f, i) {
      var stand = faktStand(f);
      html += '<div class="faktzeile' + (stand.n === 0 ? ' neu' : '') + '">' +
        '<span class="fakttext">' + esc(f) +
        '<span class="faktzahl">' + (stand.n === 0 ? 'noch nicht gezeigt'
          : stand.n === 1 ? 'einmal gezeigt' : stand.n + '× gezeigt') + '</span></span>' +
        '<button class="sternbtn' + (stand.f ? ' an' : '') + '" data-fav="' + i +
        '" aria-pressed="' + (stand.f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
        (stand.f ? ICON.sternVoll : ICON.stern) + '</button></div>';
    });
    html += '</div>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="faktenBack">Zurück</button></div></section>';
  main.innerHTML = html;

  main.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () { faktenFilter = b.dataset.filter; renderFakten(); });
  });
  main.querySelectorAll('[data-fav]').forEach(function (b) {
    b.addEventListener('click', function () {
      var nr = b.dataset.fav;
      var an = faktFavorit(liste[parseInt(nr, 10)]);
      renderFakten();
      // Nach dem Neuzeichnen steht an derselben Stelle derselbe Fakt: Die
      // Liste sortiert sich beim Merken nicht um (ADR 0067).
      if (an) sternBlinken('[data-fav="' + nr + '"]');
    });
  });
  document.getElementById('faktenBack').addEventListener('click', zurueckGehen);
}

// ── Melden ──────────────────────────────────────────────────
// Ein Ticket schreibt man dort, wo einem etwas auffällt — nicht erst nach dem
// Weg über das Menü. Der Knopf schwebt darum über jeder Ansicht, und das Blatt
// deckt nur den unteren Teil ab, damit man weiter sieht, worum es geht.
var meldeOffen = false;
var meldeArt = 'bug';
// **Der dritte Reiter ist eine Tätigkeit, kein Ticket-Typ** (ADR 0078). Er
// steht trotzdem in derselben Reihe: Der Nutzer sieht dort «was jetzt», und
// «ein vorhandenes ändern» ist für ihn die dritte Antwort darauf. Im Zustand
// bleiben beide getrennt — `meldeArt` sagt, was für ein Ticket es wird,
// `meldeModus`, was das Blatt gerade zeigt.
var meldeModus = 'neu';   // 'neu' · 'liste'
// Die Art des Fehlers. Sechs Gründe, absichtlich grob: Feiner geschnitten
// müsste man raten, welche Schublade gemeint ist, und das ist mehr Arbeit als
// ein Satz im Text.
// **Dieselbe Gestalt, eigene Liste** (ADR 0081). Der Wunsch sah anders aus als
// der Fehler, weil ihm das Feld fehlte — «ein Wunsch hat keinen Grund, er hat
// einen Zweck» war richtig gedacht und in der Oberfläche trotzdem ein Bruch.
// Jetzt steht das Feld bei beiden, nur mit passenden Einträgen: «Stürzt ab oder
// hängt» wäre bei einem Wunsch Unsinn.
var MELDE_GRUENDE = {
  bug: [
    { id: 'anzeige', name: 'Anzeige oder Darstellung' },
    { id: 'bedienung', name: 'Bedienung' },
    { id: 'inhalt', name: 'Falscher Inhalt' },
    { id: 'haengt', name: 'Stürzt ab oder hängt' },
    { id: 'ton', name: 'Ton oder Vorlesen' },
    { id: 'sonst', name: 'Sonstiges' }
  ],
  feature: [
    { id: 'neu', name: 'Neue Funktion' },
    { id: 'besser', name: 'Verbesserung' },
    { id: 'lernstoff', name: 'Inhalt: Wörter, Sätze, Regeln' },
    { id: 'bedienung', name: 'Bedienung' },
    { id: 'anzeige', name: 'Darstellung' },
    { id: 'sonst', name: 'Sonstiges' }
  ]
};
function meldeGruende() { return MELDE_GRUENDE[meldeArt] || MELDE_GRUENDE.bug; }
var meldeGrundWahl = '';
var meldeGrundOffen = false;
// Stehen die Optionen offen? Zugeklappt reicht Überschrift und Text (ADR 0082).
var meldeOptOffen = false;
// **Die gewählte Seite** (ADR 0069) — leer heißt «keine». Vorbelegt wird sie
// beim Öffnen des Blattes mit der Ansicht, über der man steht; ab dann gilt,
// was der Nutzer gewählt hat.
var meldeBezugWahl = '';
// Die Kennung des Tickets, das gerade bearbeitet wird — sonst null.
var meldeBearbeitet = null;

function meldeBezugQuelle() {
  // Die Ansicht, über der man steht — die ist gemeint, nicht «Tickets».
  return currentTab === 'tickets' ? letzterTab : currentTab;
}

// **Alle Seiten, die man meinen kann** (ADR 0069) — Übersicht, die acht
// Übungen, die Menüansichten. In derselben Reihenfolge wie in der App, damit
// die Liste sich wie die App liest und nicht wie ein Datenmodell.
function meldeSeiten() {
  var raus = [{ id: 'home', name: ansichtName('home') }];
  UEBUNG_GRUPPEN.forEach(function (g) {
    g.ids.forEach(function (id) {
      if (UEBUNG_NAME[id]) raus.push({ id: id, name: UEBUNG_NAME[id] });
    });
  });
  Object.keys(ANSICHT_NAME).forEach(function (id) {
    raus.push({ id: id, name: ANSICHT_NAME[id] });
  });
  return raus;
}

// Was im Ticket landet: der **Name** der Seite, nicht ihre Kennung — er steht
// im gebündelten Text und soll dort lesbar sein.
function meldeBezugText() {
  return meldeBezugWahl ? ansichtName(meldeBezugWahl) : '';
}

// **Ein Klappfeld mit einer Liste darin** (ADR 0074). Vierzehn Seiten als
// offene Chip-Reihe füllten das halbe Blatt; eingeklappt zeigt der Knopf die
// Wahl, aufgeklappt die Liste. Ein natives Auswahlfeld bleibt draußen — auf
// iOS ist das ein Rad über der halben Seite, und die Suite liest den Quelltext
// danach ab. Gebaut ist es darum aus Knöpfen, wie alles hier.
var meldeBezugOffen = false;

function meldeBezugHtml() {
  var html = bezugZeile('', 'Keine');
  meldeSeiten().forEach(function (s) { html += bezugZeile(s.id, s.name); });
  return html;
}
function bezugZeile(id, name) {
  var an = id === meldeBezugWahl;
  return '<button class="bezug-zeile' + (an ? ' an' : '') + '" type="button" role="radio"' +
    ' aria-checked="' + (an ? 'true' : 'false') + '" data-bezug="' + esc(id) + '">' +
    '<span>' + esc(name) + '</span>' + (an ? ICON.haken : '') + '</button>';
}
// Was auf dem Knopf steht, wenn die Liste zu ist.
function meldeBezugName() {
  return meldeBezugWahl ? ansichtName(meldeBezugWahl) : 'Keine';
}
// Knopf und Liste in einem Zug — beide hängen an derselben Wahl, und sie
// getrennt nachzuziehen wäre eine Quelle für zwei Wahrheiten.
function meldeBezugZeichnen() {
  var knopf = document.getElementById('meldeBezugKnopf');
  var liste = document.getElementById('meldeBezug');
  if (!knopf || !liste) return;
  document.getElementById('meldeBezugName').textContent = meldeBezugName();
  knopf.setAttribute('aria-expanded', meldeBezugOffen ? 'true' : 'false');
  liste.hidden = !meldeBezugOffen;
  liste.innerHTML = meldeBezugHtml();
}

function meldeArtHtml() {
  var html = [['bug', 'Fehler'], ['feature', 'Wunsch']].map(function (a) {
    var an = meldeModus === 'neu' && meldeArt === a[0];
    return '<button class="chip' + (an ? ' active' : '') +
      '" aria-pressed="' + (an ? 'true' : 'false') +
      '" data-melde-art="' + a[0] + '">' + a[1] + '</button>';
  }).join('');
  var liste = meldeModus === 'liste';
  return html + '<button class="chip' + (liste ? ' active' : '') +
    '" aria-pressed="' + (liste ? 'true' : 'false') +
    '" data-melde-art="liste">Bearbeiten</button>';
}

// Die Art des Fehlers — dasselbe Klappfeld wie beim Ort, nur mit anderer Liste.
function meldeGrundName() {
  var t = '';
  meldeGruende().forEach(function (g) { if (g.id === meldeGrundWahl) t = g.name; });
  return t || 'Keine Angabe';
}
function meldeGrundZeichnen() {
  var zeile = document.getElementById('meldeGrundZeile');
  var knopf = document.getElementById('meldeGrundKnopf');
  var liste = document.getElementById('meldeGrund');
  if (!zeile || !knopf || !liste) return;
  zeile.hidden = false;
  document.getElementById('meldeGrundName').textContent = meldeGrundName();
  knopf.setAttribute('aria-expanded', meldeGrundOffen ? 'true' : 'false');
  liste.hidden = !meldeGrundOffen;
  var html = grundZeile('', 'Keine Angabe');
  meldeGruende().forEach(function (g) { html += grundZeile(g.id, g.name); });
  liste.innerHTML = html;
}
function grundZeile(id, name) {
  var an = id === meldeGrundWahl;
  return '<button class="bezug-zeile' + (an ? ' an' : '') + '" type="button" role="radio"' +
    ' aria-checked="' + (an ? 'true' : 'false') + '" data-grund="' + esc(id) + '">' +
    '<span>' + esc(name) + '</span>' + (an ? ICON.haken : '') + '</button>';
}
// Was im Ticket landet: der Name, nicht die Kennung — wie beim Ort.
function meldeGrundText() {
  return meldeGrundWahl ? meldeGrundName() : '';
}

// **Die Liste im Blatt** (ADR 0078). Dieselbe Auskunft wie in der Ticketansicht,
// nur knapper: Titel, Ort und wann. Ein Tipp holt das Ticket ins Blatt — von
// dort ist der Weg derselbe wie aus der Liste im Menü.
function meldeListeHtml() {
  if (!tickets.length) {
    return '<p class="einr-leer">Noch keine Tickets. Was du hier schreibst, ' +
      'bleibt auf dem Gerät.</p>';
  }
  // **Dieselbe Liste wie im Menü**, übergebene eingeschlossen — nur ohne die
  // Kopierknöpfe darunter: Das Bündeln gehört in die Ticketansicht, hier wird
  // geändert (ADR 0081).
  return '<div class="tkliste">' + tickets.map(tkZeileHtml).join('') + '</div>';
}

function meldeFuellen() {
  document.getElementById('meldeArt').innerHTML = meldeArtHtml();
  document.querySelectorAll('[data-melde-art]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.meldeArt === 'liste') {
        meldeModus = 'liste';
      } else {
        meldeModus = 'neu';
        if (meldeArt !== b.dataset.meldeArt) {
          // Die Listen sind verschieden: «Stürzt ab oder hängt» gibt es beim
          // Wunsch nicht, und eine Wahl, die in der neuen Liste fehlt, stünde
          // als «Keine Angabe» da und wanderte trotzdem ins Ticket.
          meldeArt = b.dataset.meldeArt;
          if (!meldeGruende().filter(function (g) { return g.id === meldeGrundWahl; }).length) {
            meldeGrundWahl = '';
          }
        }
        document.getElementById('meldeText').placeholder = meldeArt === 'bug'
          ? 'Was ist passiert, was hattest du erwartet?'
          : 'Was soll die App können?';
      }
      meldeFuellen();
    });
  });

  // **Nur verbergen, nicht ausräumen** (ADR 0025): Der Entwurf steht in den
  // Feldern und soll den Blick in die Liste überleben.
  var liste = meldeModus === 'liste';
  document.getElementById('meldeNeu').hidden = liste;
  document.getElementById('meldeAktionen').hidden = liste;
  var kasten = document.getElementById('meldeListe');
  kasten.hidden = !liste;
  if (liste) {
    kasten.innerHTML = meldeListeHtml();
    kasten.querySelectorAll('[data-tkedit]').forEach(function (b) {
      b.addEventListener('click', function () { meldeBearbeiten(b.dataset.tkedit); });
    });
    kasten.querySelectorAll('[data-tkweg]').forEach(function (b) {
      b.addEventListener('click', function () {
        tickets.splice(parseInt(b.dataset.tkweg, 10), 1);
        ticketsSichern();
        meldeFuellen();
        if (currentTab === 'tickets') renderTickets();
      });
    });
  }

  meldeBezugZeichnen();
  meldeGrundZeichnen();
  meldeOptZeichnen();
  meldeTextWachsen();
  document.getElementById('meldeSichern').textContent = meldeBearbeitet ? 'Ändern' : 'Sichern';
  document.getElementById('meldeAbbruch').textContent = meldeBearbeitet ? 'Verwerfen' : 'Abbrechen';
  // In der Liste selbst führt der Weg nirgendwohin — und beim Bearbeiten käme
  // man aus der Liste, in der man ohnehin schon steht.
  document.getElementById('meldeAlle').hidden = currentTab === 'tickets';
}

// Knopf und Klappfeld hängen an derselben Frage; getrennt nachgezogen wären
// sie zwei Wahrheiten über einen Zustand.
function meldeOptZeichnen() {
  var knopf = document.getElementById('meldeOptKnopf');
  var feld = document.getElementById('meldeOpt');
  if (!knopf || !feld) return;
  knopf.setAttribute('aria-expanded', meldeOptOffen ? 'true' : 'false');
  feld.classList.toggle('auf', meldeOptOffen);
  // Gefüllt, sobald eine Option gesetzt ist — auch zugeklappt soll man sehen,
  // dass da etwas steht. «Betrifft» ist vorbelegt und zählt darum nur, wenn
  // der Nutzer etwas anderes gewählt hat als die Seite, über der er steht.
  var gesetzt = !!meldeGrundWahl ||
    (meldeBezugWahl !== meldeBezugQuelle() && meldeBezugWahl !== '');
  knopf.classList.toggle('gesetzt', gesetzt);
}

// **Das Textfeld wächst mit, aber nicht endlos** (ADR 0082): drei Zeilen als
// Grundmaß, höchstens drei dazu. Was länger wird, rollt — sonst schöbe ein
// langer Text die Knöpfe aus dem Bild.
var MELDE_ZEILEN = 3;
var MELDE_ZEILEN_MAX = 6;
function meldeTextWachsen() {
  var feld = document.getElementById('meldeText');
  if (!feld) return;
  var zeile = parseFloat(getComputedStyle(feld).lineHeight) || 21;
  var rand = feld.offsetHeight - feld.clientHeight +
    parseFloat(getComputedStyle(feld).paddingTop) +
    parseFloat(getComputedStyle(feld).paddingBottom);
  feld.style.height = 'auto';
  var hoehe = Math.min(feld.scrollHeight, Math.round(zeile * MELDE_ZEILEN_MAX + rand));
  feld.style.height = Math.max(hoehe, Math.round(zeile * MELDE_ZEILEN + rand)) + 'px';
}

// Ein vorhandenes Ticket zum Bearbeiten ins Blatt holen.
function meldeBearbeiten(id) {
  var t = tickets.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  meldeBearbeitet = id;
  meldeArt = t.art;
  // Im Ticket steht der **Name** der Seite; für die Auswahl wird die Kennung
  // dazu gesucht. Eine Seite, die es nicht mehr gibt, fällt auf «keine» —
  // besser als eine Auswahl, die auf etwas zeigt, das fehlt.
  meldeBezugWahl = '';
  meldeSeiten().forEach(function (x) { if (x.name === t.reiter) meldeBezugWahl = x.id; });
  meldeGrundWahl = '';
  meldeGruende().forEach(function (g) { if (g.name === t.grund) meldeGrundWahl = g.id; });
  // Aus der Liste heraus gewählt: zurück in den Schreibteil, sonst stünde man
  // vor der Liste, aus der man gerade etwas geholt hat.
  meldeModus = 'neu';
  // Wer ein vorhandenes Ticket öffnet, sieht seine Angaben — sonst müsste er
  // raten, was schon dasteht.
  meldeOptOffen = !!(meldeBezugWahl || meldeGrundWahl);
  document.getElementById('meldeTitel').value = t.titel;
  document.getElementById('meldeText').value = t.text;
  if (meldeOffen) meldeFuellen(); else meldeSetzen(true);
}

// Ist ein angefangenes Ticket im Blatt? Dann bleibt es dort liegen, auch wenn
// das Blatt zugeht — verworfen wird nur ausdrücklich.
function meldeEntwurfDa() {
  var t = document.getElementById('meldeTitel');
  var x = document.getElementById('meldeText');
  return !!((t && t.value.replace(/^\s+|\s+$/g, '')) || (x && x.value.replace(/^\s+|\s+$/g, '')));
}

function meldeKnopfZeigen() {
  var knopf = document.getElementById('meldeKnopf');
  var entwurf = meldeEntwurfDa();
  knopf.classList.toggle('hat-entwurf', entwurf);
  knopf.setAttribute('aria-label', entwurf
    ? (meldeBearbeitet ? 'Ticket weiter bearbeiten' : 'Angefangenes Ticket weiterschreiben')
    : 'Rückmeldung geben');
}

function meldeSetzen(auf) {
  meldeOffen = auf;
  document.body.classList.toggle('melden-offen', auf);
  var blatt = document.getElementById('meldeBlatt');
  blatt.setAttribute('aria-hidden', auf ? 'false' : 'true');
  document.getElementById('meldeKnopf').setAttribute('aria-expanded', auf ? 'true' : 'false');
  var hof = document.getElementById('meldeHof');
  if (auf) {
    hof.hidden = false;
    // **Vorgewählt ist die Seite, über der man steht** (ADR 0069) — aber nur
    // bei einem frischen Entwurf. Ein angefangenes Ticket behält seine Wahl,
    // sonst spränge sie beim Zuklappen und Wiederöffnen zurück.
    if (!meldeBearbeitet && !meldeBezugWahl) meldeBezugWahl = meldeBezugQuelle();
    // Das Blatt öffnet immer bereit zum Schreiben — die Liste ist ein Abstecher,
    // kein Zustand, in dem man es verlässt (ADR 0072, derselbe Gedanke).
    meldeModus = 'neu';
    meldeGrundOffen = false;
    meldeFuellen();
  } else {
    blatt.style.transform = '';
    // Der Hof verschwindet erst, wenn er ausgeblendet ist — sonst blitzt er weg.
    setTimeout(function () { if (!meldeOffen) hof.hidden = true; }, 300);
  }
  document.querySelectorAll('#meldeBlatt button, #meldeBlatt input, #meldeBlatt textarea')
    .forEach(function (el) { el.tabIndex = auf ? 0 : -1; });
  meldeKnopfZeigen();
}

function meldeLeeren() {
  document.getElementById('meldeTitel').value = '';
  document.getElementById('meldeText').value = '';
  meldeArt = 'bug';
  meldeModus = 'neu';
  meldeGrundWahl = '';
  meldeGrundOffen = false;
  meldeOptOffen = false;
  // Zurück auf die Seite, über der man steht — die ist beim nächsten Ticket
  // wieder die wahrscheinlichste.
  meldeBezugWahl = meldeBezugQuelle();
  meldeBearbeitet = null;
  meldeKnopfZeigen();
}

// Das Blatt folgt dem Finger — aber nur nach unten, dorthin, wo es ohnehin
// verschwindet. Weit genug gezogen, geht es zu; der Entwurf bleibt dabei
// stehen. Weggeworfen wird ein Ticket ausschließlich über «Verwerfen».
var MELDE_SCHWELLE = 90;   // ab hier gilt das Ziehen als «zu»
function meldeZiehenBinden() {
  var blatt = document.getElementById('meldeBlatt');
  var start = null, weg = 0;

  function daempfen(d) {
    // Je weiter, desto zäher: die Wurzel wächst langsamer als der Weg.
    return Math.pow(d, 0.72) * 1.6;
  }
  function los(e) {
    if (!meldeOffen) return;
    var z = e.target;
    // Auf Eingabefeldern hat das Ziehen nichts zu suchen.
    if (z.closest('input, textarea, button')) return;
    start = { y: e.clientY };
    weg = 0;
    blatt.classList.add('zieht');
    try { blatt.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function bewegt(e) {
    if (!start) return;
    // Nach oben gibt das Blatt nicht nach: dort ist kein Weg hin.
    weg = Math.max(0, e.clientY - start.y);
    blatt.style.transform = 'translateY(' + daempfen(weg).toFixed(1) + 'px)';
  }
  function fertig() {
    if (!start) return;
    start = null;
    blatt.classList.remove('zieht');
    blatt.style.transform = '';   // der Übergang federt zurück
    if (weg >= MELDE_SCHWELLE) meldeSetzen(false);
    weg = 0;
  }

  blatt.addEventListener('pointerdown', los);
  blatt.addEventListener('pointermove', bewegt);
  blatt.addEventListener('pointerup', fertig);
  blatt.addEventListener('pointercancel', fertig);
  // Danebentippen schließt genauso — der Entwurf bleibt auch dann liegen.
  document.getElementById('meldeHof').addEventListener('click', function () {
    meldeSetzen(false);
  });
}

// ── TICKETS ─────────────────────────────────────────────────
var tkAusgabe = '';     // gebündelter Text, sichtbar bis «Fertig»
// **Der Rückweg** (ADR 0069): ein Feld, in das ein gebündelter Text eingefügt
// wird. Ansichtszustand — nach ADR 0017 gehört beides in
// `ansichtenZuruecksetzen()`.
var tkImportOffen = false;
var tkImportMeldung = '';

// Das Feld zum Einfügen. Zugeklappt ist es eine Zeile, offen ein Feld mit
// einem Knopf — dieselbe Gestalt wie «Alle Übungen» auf der Übersicht.
function tkImportHtml() {
  var html = '<button class="alle-knopf" id="tkImportKnopf" aria-expanded="' +
    (tkImportOffen ? 'true' : 'false') + '" aria-controls="tkImportBlatt">' +
    '<span>Tickets einfügen</span>' + ICON.winkelRunter + '</button>' +
    '<div class="alle-klapp" id="tkImportBlatt"' + (tkImportOffen ? '' : ' hidden') + '>' +
    '<p class="backup-note">Einen kopierten Ticket-Text hier einfügen. Was schon in der ' +
    'Liste steht, bleibt unberührt — dasselbe zweimal einzufügen verdoppelt nichts.</p>' +
    '<textarea class="fliess" id="tkImportFeld" rows="6" ' +
    'placeholder="# Chillingo · 3 Tickets …" spellcheck="false"></textarea>';
  if (tkImportMeldung) {
    html += '<p class="backup-note">' + esc(tkImportMeldung) + '</p>';
  }
  html += '<div class="btn-row"><button class="btn primary" id="tkImportLesen">' +
    'Einlesen</button></div></div>';
  return html;
}

// **Eine Ticketzeile, zwei Orte** (ADR 0081): die Liste im Menü und der Reiter
// «Bearbeiten» im Meldeblatt. Dieselbe Gestalt heißt dieselbe Auskunft — Art,
// Titel, Datum, Ort und ob es schon übergeben wurde. Zwei Fassungen davon wären
// zwei Wahrheiten über denselben Bestand.
function tkZeileHtml(t, i) {
  return '<div class="tkzeile' + (t.uebergeben ? ' gesendet' : '') + '">' +
    '<button class="tktext" data-tkedit="' + esc(t.id) + '">' +
    '<span class="tkart ' + t.art + '">' +
    (t.art === 'bug' ? 'Fehler' : 'Wunsch') + '</span>' + esc(t.titel) +
    '<span class="tkmeta">' + esc(datumKurz(t.erstellt)) +
    (t.reiter ? ' · ' + esc(t.reiter) : '') + ' · ' +
    (t.uebergeben ? 'übergeben ' + esc(datumKurz(t.uebergeben)) : 'offen') +
    (t.geaendert ? ' · geändert' : '') + '</span></button>' +
    '<button class="sternbtn" data-tkweg="' + i + '" aria-label="Ticket löschen">' +
    ICON.kreuz + '</button></div>';
}

function renderTickets() {
  var offen = ticketsOffen();
  var uebergeben = tickets.length - offen.length;
  var html = '<section>';

  if (tkAusgabe) {
    html += '<div class="card">' +
      '<p class="task-label">Kopierfertig</p>' +
      '<p class="backup-note">Alles markiert und in der Zwischenablage. Klappt das Kopieren ' +
      'nicht, markier den Text hier von Hand.</p>' +
      '<textarea class="fliess" id="tkAusgabe" rows="10" readonly></textarea>' +
      '</div><div class="btn-row">' +
      '<button class="btn ghost" id="tkNochmal">Nochmal kopieren</button>' +
      '<button class="btn primary" id="tkFertig">Fertig</button></div>';
  } else {
    if (!tickets.length) {
      html += '<div class="leer">' + maskottchen('gross') +
        '<h3>Noch kein Ticket</h3>' +
        '<p>Der Knopf unten rechts ist von überall erreichbar — halt fest, was hakt ' +
        'oder fehlt, gleich dort, wo es dir auffällt. Später bündelt ein Knopf alles zu ' +
        'einem Text zum Weitergeben.</p></div>';
    } else {
      html += '<div class="tkliste">' +
        tickets.map(tkZeileHtml).join('') + '</div><div class="btn-row">';
      if (offen.length) {
        html += '<button class="btn primary" id="tkKopieren">' + offen.length +
          (offen.length === 1 ? ' offenes kopieren' : ' offene kopieren') + '</button>';
      }
      if (uebergeben) {
        html += '<button class="btn ghost" id="tkAlle">Alle ' + tickets.length + ' kopieren</button>';
      }
      html += '</div>';
      if (uebergeben) {
        html += '<div class="btn-row"><button class="btn ghost" id="tkAufraeumen">' +
          'Übergebene löschen (' + uebergeben + ')</button></div>';
      }
    }
    html += tkImportHtml();

    html += '<p class="settings-note">Neue Tickets schreibst du über den Knopf unten rechts — ' +
      'von jeder Ansicht aus. Ein Tipp auf eine Zeile holt das Ticket zum Ändern zurück; ' +
      'geändert gilt es wieder als offen. Sie liegen nur auf diesem Gerät und verlassen es nie ' +
      'von selbst. «Kopieren» legt alles als einen Text in die Zwischenablage; was kopiert ' +
      'wurde, gilt als übergeben.</p>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="tkBack">Zurück</button></div></section>';
  main.innerHTML = html;

  if (tkAusgabe) {
    var feld = document.getElementById('tkAusgabe');
    feld.value = tkAusgabe;
    try { feld.setSelectionRange(0, tkAusgabe.length); } catch (e) {}
    document.getElementById('tkNochmal').addEventListener('click', function () {
      inZwischenablage(tkAusgabe);
      feld.select();
    });
    document.getElementById('tkFertig').addEventListener('click', function () {
      tkAusgabe = '';
      renderTickets();
    });
  } else {
    main.querySelectorAll('[data-tkweg]').forEach(function (b) {
      b.addEventListener('click', function () {
        tickets.splice(parseInt(b.dataset.tkweg, 10), 1);
        ticketsSichern();
        renderTickets();
      });
    });
    main.querySelectorAll('[data-tkedit]').forEach(function (b) {
      b.addEventListener('click', function () { meldeBearbeiten(b.dataset.tkedit); });
    });
    // Bündeln heißt zugleich übergeben — sonst müsste man den Zustand zweimal
    // pflegen und wüsste beim nächsten Mal nicht, was neu ist.
    var kop = document.getElementById('tkKopieren');
    if (kop) kop.addEventListener('click', function () {
      var jetzt = Date.now();
      tkAusgabe = ticketsAlsText(offen);
      offen.forEach(function (t) { t.uebergeben = jetzt; });
      ticketsSichern();
      inZwischenablage(tkAusgabe);
      renderTickets();
    });
    var allesBtn = document.getElementById('tkAlle');
    if (allesBtn) allesBtn.addEventListener('click', function () {
      tkAusgabe = ticketsAlsText(tickets);
      inZwischenablage(tkAusgabe);
      renderTickets();
    });
    var weg = document.getElementById('tkAufraeumen');
    if (weg) weg.addEventListener('click', function () {
      tickets = ticketsOffen();
      ticketsSichern();
      renderTickets();
    });
  }

  var impKnopf = document.getElementById('tkImportKnopf');
  if (impKnopf) impKnopf.addEventListener('click', function () {
    tkImportOffen = !tkImportOffen;
    tkImportMeldung = '';
    renderTickets();
  });
  var impLesen = document.getElementById('tkImportLesen');
  if (impLesen) impLesen.addEventListener('click', function () {
    var feld = document.getElementById('tkImportFeld');
    var neue = ticketsLesen(feld ? feld.value : '');
    if (!neue.length) {
      // **Nichts verstanden heißt nichts getan.** Ein halb geratenes Ticket
      // wäre schlimmer als keines.
      tkImportMeldung = 'Darin steht kein Ticket, das ich lesen kann. Erwartet wird der ' +
        'Text, den «kopieren» erzeugt.';
      renderTickets();
      return;
    }
    var e = ticketsUebernehmen(neue);
    tkImportMeldung = e.dazu
      ? e.dazu + (e.dazu === 1 ? ' Ticket übernommen' : ' Tickets übernommen') +
        (e.schon ? ', ' + e.schon + ' war' + (e.schon === 1 ? '' : 'en') + ' schon da' : '') + '.'
      : 'Alles davon steht schon in der Liste.';
    tkImportOffen = false;
    renderTickets();
  });

  document.getElementById('tkBack').addEventListener('click', zurueckGehen);
}

// ── BILANZ ──────────────────────────────────────────────────
var backupOpen = false, backupCode = '', backupMsg = '', confirmReset = false;
var themenOffen = false; // «alle Themen anzeigen» in der Bilanz
var bilanzDetail = null; // null · 'woerter' · 'saetze' · 'antworten' · 'serie'

// ── Ringdiagramme ───────────────────────────────────────────
// Ein Segment ist ein Kreis, dessen Strich nur über einen Teil des Umfangs
// gezeichnet wird (stroke-dasharray) und der um die schon belegte Strecke
// versetzt beginnt (stroke-dashoffset). Keine Bibliothek, kein Pfad-Rechnen.
var DONUT_R = 42;
var DONUT_U = 2 * Math.PI * DONUT_R;

// Die Stufenfarben — dieselben wie bei den Fortschrittspunkten.
var STUFEN_FARBE = ['var(--line)', 'var(--dim)', 'var(--ice);opacity:.6', 'var(--ice)', 'var(--akzent)'];

function donut(teile, wert, text, klein) {
  var summe = 0;
  teile.forEach(function (t) { summe += t.wert; });
  var vorher = 0;
  var kreise = '';
  teile.forEach(function (t) {
    if (!t.wert || !summe) return;
    var laenge = t.wert / summe * DONUT_U;
    kreise += '<circle cx="50" cy="50" r="' + DONUT_R + '" style="stroke:' + t.farbe + '" ' +
      'stroke-dasharray="' + laenge.toFixed(2) + ' ' + DONUT_U.toFixed(2) + '" ' +
      'stroke-dashoffset="' + (-vorher).toFixed(2) + '"/>';
    vorher += laenge;
  });
  return '<div class="donut' + (klein ? ' klein' : '') + '">' +
    '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<circle class="donut-grund" cx="50" cy="50" r="' + DONUT_R + '"/>' + kreise + '</svg>' +
    '<div class="donut-mitte"><span class="donut-wert">' + esc(wert) + '</span>' +
    '<span class="donut-text">' + esc(text) + '</span></div></div>';
}

function legende(teile) {
  var html = '<div class="legende">';
  teile.forEach(function (t) {
    html += '<span class="leg"><i style="background:' + t.farbe + '"></i>' +
      '<span class="leg-name">' + esc(t.name) + '</span>' +
      '<span class="leg-wert">' + t.wert + '</span></span>';
  });
  return html + '</div>';
}

function balkenZeile(name, wert, gesamt) {
  return '<div class="theme-row"><span class="theme-name">' + esc(name) + '</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' +
    (gesamt ? wert / gesamt * 100 : 0) + '%"></div></div>' +
