<style>
/* «Dark». Wie in den hellen Schemata liegt die Kachel über dem Grund — nur
   ist der Schritt dorthin größer als früher (1,21 : 1 statt 1,08): Der Grund
   ist beinahe schwarz, die Kachel deutlich davon abgesetzt. Der Ton ist
   warmneutral, nicht blau; er trägt die warme Schrift und das Gold besser
   (ADR 0041). Der Kopf nimmt den Grund, wie überall. */
:root {
  --bg: #1A1A18;
  --card: #2A2926;
  --card-2: #31302C;
  --line: #3B3934;
  /* Ein aufgeklapptes Blatt liegt über der Seite, nicht darin. In «Dark» trägt
     es darum den Grund: Auf dem Kachelton stünde es Fläche auf Fläche und
     hübe sich nur durch seinen Schatten ab. In den hellen Schemata ist es
     umgekehrt — dort ist die Kachel das Papier. */
  --blatt: var(--bg);
  --text: #E7E4DD;
  /* Etwas heller als früher: Die Kachel ist mitgestiegen, und auf ihr stünde
     das alte #8B93A1 mit 4,7 : 1 — auf den Chips darüber nur noch mit 4,3. */
  --dim: #939AA7;
  --ice: #8FB4EA;
  --akzent: #D2A24E;
  --akzent-ink: #14110A;
  --good: #5FBF8F;
  --bad: #E07A6E;
  --glow: #1F1E1B;
  --lip: rgba(255, 255, 255, .035);
  --shade: rgba(0, 0, 0, .28);
  /* Der Atem des Scheinwerfers (ADR 0083): eine Aufhellung **auf** dem Ziel.
     Wie stark sie sein darf, hängt davon ab, wie hell die Fläche darunter
     schon ist — auf dem fast schwarzen Grund genügt ein Zehntel, auf einer
     hellen Kachel wäre davon nichts zu sehen. Darum steht der Wert zweimal. */
  --tut-atem: rgba(255, 255, 255, .12);
  /* Die Figur wirft keinen Schatten mehr (ADR 0071). Der Wert stand hier zwei
     Fassungen lang, erst kräftig, dann kurz — der viereckige Rand blieb in
     Safari beides Mal sichtbar. Ein Weichzeichner, den der Browser in eine
     eigene Ebene rastert und am Elementkasten beschneidet, hinterlässt genau
     eine gerade Kante. Kein Filter, keine Kante. */
}
/* Ein Farbschema ist eine Palette, nicht zwei Achsen. «Dark» ist das :root
   darüber — es trägt kein Attribut, wie zuvor die Vorgabe keines trug. Die vier
   hellen Schemata setzen `data-schema`.

   Warum nur eine Achse: «cremig» und «pastellig» sind helle Begriffe. Ein Ton
   in einer dunklen Fassung wäre keiner mehr, und die Frage «hell oder dunkel?»
   mit der Frage «welche Farbe?» zu kreuzen ergab acht Paletten, von denen die
   Hälfte niemand wollte (ADR 0039).

   `prefers-color-scheme` wertet die App darum nicht mehr aus: Es gibt keine
   Achse mehr, auf der das System etwas beitragen könnte. */

/* Die hellen Schemata teilen sich alles außer den Flächen. Schrift, Gold und
   die Signalfarben stehen darum einmal — die Regel aus ADR 0038 gilt weiter. */
:root[data-schema="classic"],
:root[data-schema="gruen"],
:root[data-schema="blau"],
:root[data-schema="rosa"] {
  --text: #23272E;
  /* Eine Stufe tiefer als zuvor: Die Flächen sind gesunken (siehe unten), und
     die alten Werte fielen damit unter die Lesbarkeitsgrenze — «dim» auf einem
     Chip lag bei 2,8 : 1. Gemessen an jeder der vier Paletten steht jetzt
     alles besser da als vor der Abdunklung (ADR 0042).

     **Und noch eine Stufe tiefer seit 2.4.4** (ADR 0063): Die Gründe sind von
     87,5 auf 77 Prozent Helligkeit gesunken und deutlich satter geworden. Der
     Maßstab ist derselbe geblieben — «dim» hält überall AA (4,5), die
     Signalfarben die Grenze für große Schrift. Gerechnet gegen **jede** der
     vier Paletten, nicht gegen die freundlichste. */
  --dim: #434851;
  --ice: #2D5AA0;
  /* Der Akzent selbst steht **je Schema** (ADR 0064): ein tiefer Ton derselben
     Farbe wie der Grund. Was darauf steht, ist überall Weiß — jeder der vier
     hält dafür über 6,5. */
  --akzent-ink: #FFFFFF;
  --good: #266749;
  --bad: #9D3B34;
  --lip: rgba(255, 255, 255, .7);
  /* Etwas kräftiger als im dunklen Schema: Die Kachel soll sich abheben, und
     dazu trägt der Schatten bei, nicht nur die Helligkeit. */
  --shade: rgba(35, 39, 46, .10);
  --blatt: var(--card);
  /* Die hellen Kacheln liegen bei 89 % Helligkeit — ein Zehntel Weiß darauf
     wäre kein Atmen, sondern nichts. Mehr als ein Drittel wäre dagegen zu
     viel: Der Schein liegt **über** der Schrift und nimmt ihr den Kontrast. */
  --tut-atem: rgba(255, 255, 255, .35);
}

/* Die Flächen. Gerechnet von tools/palette.py: eine Staffelung der Helligkeit
   für alle Schemata, nur Farbton und Sättigung wandern. Der Abstand zwischen
   Grund und Kachel ist bewusst reichlich — die Kachel ist eine eigene Fläche,
   kein heller Hauch auf dem Grund. */
:root[data-schema="classic"] {
  --bg: #DDCFAC;
  --card: #EEE8D8;
  --card-2: #E4D9BE;
  --line: #CEBC8D;
  --glow: #EEE8D8;
  --akzent: #6E561B;
}
:root[data-schema="gruen"] {
  --bg: #A6E3C6;
  --card: #D6F0E4;
  --card-2: #B9E9D3;
  --line: #85D6B0;
  --glow: #D6F0E4;
  --akzent: #1B6A45;
}
:root[data-schema="blau"] {
  --bg: #A7C9E2;
  --card: #D6E5F0;
  --card-2: #BAD5E8;
  --line: #87B4D4;
  --glow: #D6E5F0;
  --akzent: #1F567D;
}
:root[data-schema="rosa"] {
  --bg: #E2A7D0;
  --card: #F0D6E8;
  --card-2: #E8BADA;
  --line: #D487BD;
  --glow: #F0D6E8;
  --akzent: #832165;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Doppeltipp vergrößert nicht mehr; Aufziehen mit zwei Fingern bleibt möglich. */
html { touch-action: manipulation; }
html, body { margin: 0; padding: 0; }
body {
  --pad-oben: calc(14px + env(safe-area-inset-top));
  --pad-links: calc(16px + env(safe-area-inset-left));
  --pad-rechts: calc(16px + env(safe-area-inset-right));
  background: var(--bg);
  /* flacher Schein hinter dem Kopf, damit die Fläche nicht tot wirkt */
  background-image: radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 70%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Der Fußabstand hält dem schwebenden Meldeknopf Platz frei. */
  padding: var(--pad-oben) var(--pad-rechts) calc(96px + env(safe-area-inset-bottom)) var(--pad-links);
  max-width: 560px;
  margin: 0 auto;
  -webkit-text-size-adjust: 100%;
}
.cyr { font-family: Georgia, "Times New Roman", serif; }
/* **Die Betonung wird gezeichnet, nicht geschrieben** (ADR 0065). Der Strich
   sitzt mittig über dem Vokal und gehört keinem Zeichen an — im Text steht nur
   das Wort. Alle Maße in `em`: Dieselbe Regel trägt die Frage in 32 px und die
   Antwortkachel in 16 px. */
.bet { position: relative; }
.bet::after {
  content: ''; position: absolute; left: 50%; bottom: .76em;
  width: .26em; height: .075em; border-radius: .04em;
  background: currentColor; opacity: .85;
  transform: translateX(-50%) rotate(-22deg);
  pointer-events: none;
}
button { font-family: inherit; }

.masthead { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* Zwei Gruppen, jede für sich dicht. Der Menüknopf steht am rechten Rand — er
   ist die Grundposition, alles andere rückt an ihn heran. Die Figur schließt
   die Gruppe nach links ab, direkt neben dem äußersten Knopf. */
/* Die Reihenfolge steht in der Anordnung, nicht im Markup: Auf Home liegt der
   Titel zwischen den Gruppen, unterwegs rückt er darunter. Ohne diese Angabe
   stünde «Chillingo» rechts vom Menüknopf — er kommt im Dokument vor ihm. */
.kopf-links, .kopf-rechts { display: flex; align-items: center; gap: 6px; }
.kopf-links { order: 1; }
.kopf-rechts { order: 3; }
/* Der Bezug für die Blätter: Sie hängen unter den **Knöpfen**, nicht unter dem
   ganzen Kopf — der ist seit der zweiten Zeile viel höher. */
.kopf-rechts { position: relative; }
.titelblock { order: 2; flex: 1; min-width: 0; }
/* Der Platz im Kopf steht im Fluss, zwischen Titel und Menüknopf. Mittig über
   der Zeile wäre er nur auf Home sichtbar — dort hat aber die Empfehlung immer
   Vorrang —, und unterwegs liefe ein langer Name wie «Einstellungen» darunter
   hindurch. Also einer statt zwei Fälle. */
#chiliPlatz { width: 34px; height: 34px; margin-right: 2px; }
.chili-platz { flex: none; position: relative; }
.eyebrow { display: block; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; font-family: Georgia, serif; }
/* Auf Home steht dort nichts mehr — der Name trägt sich selbst. Der Platz
   bleibt trotzdem stehen: Ein leeres Element hätte keine Zeilenbox, und
   «Chillingo» rückte um zehn Pixel nach oben an den Bildschirmrand. Das
   Zeichen ohne Breite baut die Zeile auf, ohne etwas zu zeigen oder
   vorzulesen. */
.eyebrow:empty::before { content: '\200B'; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; margin: 0; font-weight: 600; line-height: 1.1; }
/* Der Name und die Lampe stehen in einer Zeile: Der Punkt gehört optisch zum
   Wort, sitzt aber außerhalb der Überschrift — so bleibt `#kopfTitel` genau
   der Name und sonst nichts. */
.titelzeile { display: flex; align-items: baseline; min-width: 0; }
/* Grün, solange ein Netz da ist, rot im Funkloch (ADR 0061). Golden war er,
   solange er nichts sagte. Die Farbe steht **einmal** an der Hülle: Punkt und
   Wort sind eine Aussage, nicht zwei — sie erben sie beide. */
.netz-stand {
  flex: none; display: inline-flex; align-items: baseline;
  font-family: Georgia, "Times New Roman", serif; font-size: 28px; line-height: 1.1;
  color: var(--good);
}
.netz-stand.aus { color: var(--bad); }
.title-dot { color: inherit; }
/* Das Wort daneben in der Schrift der Kopfzeilen — dieselbe, in der bis 2.4.1
   «Offline» unter dem Fortschritt stand. Es rückt dicht an den Punkt: Beides
   zusammen ist eine Angabe. */
.netz-wort {
  margin-left: 4px; color: inherit;
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  white-space: nowrap;
  /* Es klappt nach ein paar Sekunden zum Punkt hin ein: Der Zustand ist nach
     dem Lesen gesagt, der Punkt trägt ihn danach allein. Eingeklappt wird über
     `max-width` statt `width` — so muss die Breite nirgends gerechnet werden,
     und der Punkt ist die Grenze, weil das Wort rechts von ihm steht und
     rechts abgeschnitten wird. */
  display: inline-block; overflow: hidden; max-width: 8em; opacity: 1;
  transition: max-width 2s ease, opacity 1.6s ease, margin-left 2s ease;
}
.netz-stand.eingeklappt .netz-wort { max-width: 0; opacity: 0; margin-left: 0; }
/* Unterwegs steht das Wort nicht da — aber es wird **eingeklappt**, nicht
   ausgeblendet. `display: none` lässt sich nicht überblenden: Beim Wechsel
   zurück auf Home fiel das Wort in einem Bild auf volle Breite, während es
   umgekehrt gemächlich zuging. Auf- und Zuklappen sind jetzt derselbe Weg,
   einmal vorwärts und einmal rückwärts (ADR 0071). */
.netz-stand.nur-punkt .netz-wort { max-width: 0; opacity: 0; margin-left: 0; }
@media (prefers-reduced-motion: reduce) {
  .netz-wort { transition: opacity 1.6s ease; }
  .netz-stand.eingeklappt .netz-wort { max-width: 0; margin-left: 0; }
  .netz-stand.nur-punkt .netz-wort { max-width: 0; margin-left: 0; }
}

.iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--card-2); color: var(--dim); cursor: pointer;
  box-shadow: inset 0 1px 0 var(--lip);
}
.iconbtn:active { transform: scale(.94); }
.gearbtn .icon { transition: opacity .2s; }

.kopf-rail {
  height: 3px; border-radius: 999px; background: var(--line);
  margin: 14px 0 7px; overflow: hidden;
}
.kopf-fill { height: 100%; background: var(--akzent); border-radius: 999px; transition: width .35s; }
.kopf-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 13px; }
.kopf-label {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kopf-serie { color: var(--akzent); }
/* **Die Meldung schiebt nichts** (ADR 0071). Sie stand als vollwertiges Feld
   in der Zeile: Sobald «gespeichert» erschien, nahm es Breite, und das Etikett
   links davon rückte zusammen — die Kopfzeile zuckte bei jeder Antwort. Jetzt
   klappt sie auf wie der Online-Status, nur andersherum: Sie sitzt am rechten
   Rand und wächst von dort nach links. `max-width` statt `width`, damit
   nirgends eine Breite gerechnet werden muss — und der Inhalt hängt am
   **linken** Rand des wachsenden Kastens, nicht am rechten: Sonst käme das
   Wort von hinten herein und stünde zwei Sekunden lang als «PEICHERT» da. */
#saveNote {
  flex: none; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); display: inline-flex; align-items: center;
  justify-content: flex-start; gap: 4px; white-space: nowrap;
  overflow: hidden; max-width: 0; opacity: 0;
  transition: max-width 2s ease, opacity 1.6s ease;
}
#saveNote.show { max-width: 14em; opacity: 1; }
/* Der Haken kommt aus `ICON` und ist damit 20 px groß — in einer Zeile aus
   10-px-Versalien machte er sie um neun Pixel höher, und genau das war das
   zweite Schieben. Er nimmt hier die Höhe der Schrift. */
#saveNote .icon { width: 11px; height: 11px; }
#saveNote.ok { color: var(--good); }
#saveNote.err {
  color: var(--bad); text-transform: none; letter-spacing: 0;
  max-width: 14em; opacity: 1; text-align: right; white-space: normal;
}
@media (prefers-reduced-motion: reduce) {
  #saveNote { transition: opacity 1.6s ease; }
}

.icon { width: 20px; height: 20px; display: block; pointer-events: none; flex: none; }

/* Der Kopf wechselt seinen Inhalt: auf «Home» Titel und Fortschritt, in einer
   Übung ein Zurück-Pfeil und ihr Name. Außerhalb von Home klebt er oben, damit
   der Rückweg immer erreichbar bleibt. */
header {
  position: relative; z-index: 6;
  margin: 0 calc(-1 * var(--pad-rechts)) 18px calc(-1 * var(--pad-links));
  padding: 0 var(--pad-rechts) 14px var(--pad-links);
  /* Auf Home bewusst ohne eigenen Grund: sonst deckt der Kopf den radialen
     Schein des Hintergrunds ab und über «Chillingo.» steht eine sichtbare
     Kante. Unterwegs deckt er, weil er dann klebt. */
  background: transparent;
}
body.unterwegs header {
  position: sticky; top: 0;
  background: var(--bg);
  padding-top: var(--pad-oben);
  margin-top: calc(-1 * var(--pad-oben));
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
/* Aufgaben sitzen tiefer. Karte und Knöpfe rücken in die Mitte des freien
   Raums, statt oben zu kleben — so liegen «Prüfen» und «Weiter» dort, wo der
   Daumen ohnehin ist, und die eingeblendete Tastatur schiebt sie nicht weg.
   `margin: auto` statt `justify-content: center`: Wird der Inhalt höher als
   der Platz (Regelkarte, Tastatur), fallen die Automargen auf null und nichts
   wird oben abgeschnitten. Nur Übungen — Listen wie Bilanz gehören nach oben. */
body.aufgabe { display: flex; flex-direction: column; min-height: 100vh; }
/* `100vh` rechnet auf iOS die Adressleiste mit, die gar nicht da ist — die
   Seite ist damit zu hoch und wackelt beim Scrollen. `svh` ist die kleinste
   Höhe (Leiste sichtbar), `dvh` die aktuelle; die eine Zeile bleibt als
   Rückfall für alte Browser stehen, die keines von beiden kennen. */
@supports (min-height: 100svh) { body.aufgabe { min-height: 100svh; } }
@supports (min-height: 100dvh) { body.aufgabe { min-height: 100dvh; } }
body.aufgabe #main { flex: 1 0 auto; display: flex; flex-direction: column; }
/* Zwei Streben teilen den freien Raum 2:1 — der Block sitzt damit auf zwei
   Dritteln der Höhe, tiefer als die Mitte, aber nicht am Boden geklebt.
   Basis 0 und kein Schrumpfen: Ist der Inhalt höher als der Platz, fallen
   beide auf null und nichts wird oben abgeschnitten. */
body.aufgabe #main::before { content: ''; flex: 2 0 0; }
body.aufgabe #main::after { content: ''; flex: 1 0 0; }
body.aufgabe #main > section { flex: 0 0 auto; width: 100%; }

body.unterwegs .titelblock { min-width: 0; }
/* Unterwegs stehen oben nur Knöpfe, der Name rückt in eine eigene Zeile
   darunter. Zwei runde Knöpfe links und drei rechts lassen für einen Namen wie
   «Power-Training» keinen Platz — und ein Name, der abgeschnitten wird, sagt
   weniger als einer, der eine Zeile kostet. */
body.unterwegs .titelblock {
  order: 4; flex: 1 0 100%; min-width: 100%;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
  /* Nebeneinander statt untereinander: «MENÜ · Tickets» ist eine Angabe, keine
     zwei. Auf der Grundlinie ausgerichtet, damit die kleine Schrift unter der
     großen sitzt und nicht daneben schwebt. */
  display: flex; align-items: baseline; gap: 9px; flex-wrap: nowrap;
}
body.unterwegs .masthead { flex-wrap: wrap; row-gap: 0; }
body.unterwegs h1 { font-size: 21px; letter-spacing: .01em; white-space: nowrap; }
body.unterwegs .eyebrow { margin-bottom: 0; flex: none; }
/* Unterwegs schrumpft der Name — die Lampe muss mit, sonst stünde hinter
   «Tippen» ein Punkt aus der Home-Zeile. */
body.unterwegs .netz-stand { font-size: 21px; }

.rundbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center; position: relative;
  border: 1px solid var(--line); background: var(--card-2); color: var(--dim);
  cursor: pointer; box-shadow: inset 0 1px 0 var(--lip);
  overflow: hidden;   /* die Striche dürfen den Kreis nie verlassen */
}
.rundbtn:active { transform: scale(.94); }
/* **Kleiner sehen, gleich gut treffen** (ADR 0081). Der sichtbare Kreis
   schrumpft auf 36 px, das Zeichen darin bleibt 20 px — die antippbare Fläche
   bleibt über `::after` bei 44 × 44 px. Touch-Ziele ≥ 44 px sind eine harte
   Regel; ein Knopf, der nur halb so groß aussieht, muss deshalb nicht halb so
   groß sein. **`overflow: visible` gehört dazu**, sonst beschneidet `.rundbtn`
   die Fläche und sie ist eine Behauptung. Die Regeln dafür stehen bei der
   Leiste — nur dort gilt die kleine Gestalt. */
/* **Zu Hause ist die Leiste durchsichtig** (ADR 0082): `display: contents`
   reicht ihre Knöpfe an die Kopfzeile durch, als stünden sie selbst dort.
   Erst bei der Kachel wird sie ein eigener Kasten. */
/* **Auch die Heimat ist durchsichtig.** Ein leerer Behälter ist zwar null
   Pixel breit, zählt aber als Flex-Kind — und bekam damit seinen eigenen
   Abstand: Zwischen zwei Knöpfen standen plötzlich zwölf statt sechs Pixel. */
#leisteHeim, #uebLeiste { display: contents; }
#uebLeiste.bei-kachel {
  display: flex; justify-content: flex-end; align-items: center; gap: 8px;
  /* Etwas Abstand zur Kachel darunter — sie soll darüberstehen, nicht darauf. */
  margin: 0 0 10px; overflow: visible;
}
/* **`display` sticht `[hidden]`.** Beide Fassungen setzen eines — die
   durchsichtige zu Hause wie der Kasten bei der Kachel —, also braucht das
   Attribut hier seine eigene Regel. Ohne sie stünde die Leiste auf der
   Faktkarte weiter im Kopf, obwohl sie als verborgen gilt. */
#uebLeiste[hidden] { display: none; }
/* Nur dort sind die Knöpfe kleiner. Im Kopf behalten sie ihre alte Größe. */
#uebLeiste.bei-kachel .rundbtn { width: 36px; height: 36px; overflow: visible; }
#uebLeiste.bei-kachel .rundbtn::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 44px; height: 44px; transform: translate(-50%, -50%);
}
.rundbtn[hidden] { display: none; }
#zurueck::before {
  content: ''; width: 11px; height: 11px; margin-left: 4px;
  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(45deg); border-radius: 1px;
}

/* Der Menüknopf: drei Striche, die beim Öffnen nacheinander nach unten aus dem
   Kreis wandern. Gestaffelt, damit es fließt statt zu ruckeln.
   Geblendet wird in einer eigenen Hülle, nicht am Knopf: der Knopf selbst muss
   überstehen lassen, sonst wäre die einfliegende Chili bis zur Landung
   unsichtbar. */
.burger { overflow: visible; z-index: 40; }
.burger .striche {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.burger .strich {
  width: 18px; height: 2px; border-radius: 2px; background: currentColor;
  transition: transform .34s cubic-bezier(.4, 0, .2, 1), opacity .28s;
}
.burger[aria-expanded="true"], body.im-menu .burger { color: var(--akzent); border-color: var(--akzent); }
/* Einmal im Menü angekommen, bleiben die Striche unten — der Knopf zeigt dann
   die Chili oder, wenn die anderswo gebraucht wird, einen ruhenden Punkt. */
.burger[aria-expanded="true"] .strich, body.im-menu .burger .strich {
  transform: translateY(26px); opacity: 0;
}
/* Die Flamme steht ein, wo die Chili gerade woanders gebraucht wird. Sie
   flackert — zwei Zungen mit verschobenem Takt, damit es lebt statt zu pulsen.
   Ihr Ursprung liegt unten: Eine Flamme wächst nach oben, sie dehnt sich nicht
   um ihre Mitte. */
.punkt {
  position: absolute; width: 20px; height: 20px;
  opacity: 0; transition: opacity .3s .2s;
  display: flex; align-items: center; justify-content: center;
}
.punkt .flamme { width: 20px; height: 20px; color: var(--akzent); display: block; }
.flamme-aussen, .flamme-innen { transform-origin: 50% 88%; }
.flamme-innen { color: var(--akzent-ink); opacity: .55; }
/* Geflackert wird nur, wo Gold steht: im Knopf und auf der letzten Stufe. Die
   kleineren Flammen der Zwischenstufen stehen still — sonst zappelt eine ganze
   Reihe, und die goldene fiele nicht mehr auf. */
.punkt .flamme-aussen, .pp.s4 .flamme-aussen { animation: flackern 1.7s ease-in-out infinite; }
.punkt .flamme-innen, .pp.s4 .flamme-innen { animation: flackern 1.1s ease-in-out infinite .2s; }
@keyframes flackern {
  0%, 100% { transform: scale(1, 1) translateX(0); }
  22% { transform: scale(.94, 1.06) translateX(-.4px); }
  45% { transform: scale(1.05, .95) translateX(.3px); }
  70% { transform: scale(.97, 1.04) translateX(.2px); }
}
/* Wer keine Bewegung will, bekommt eine ruhige Flamme — kein Punkt zurück,
   nur kein Flackern. */
@media (prefers-reduced-motion: reduce) {
  .flamme-aussen, .flamme-innen { animation: none; }
}
body.im-menu #menuKnopf .punkt { opacity: .8; }
body.im-menu #menuKnopf.mit-chili .punkt { opacity: 0; transition-delay: 0s; }
#chiliKnopf { position: absolute; inset: 6px; }
.burger[aria-expanded="true"] .strich:nth-child(1) { transition-delay: 0s; }
.burger[aria-expanded="true"] .strich:nth-child(2) { transition-delay: .05s; }
.burger[aria-expanded="true"] .strich:nth-child(3) { transition-delay: .1s; }
/* Beim Schließen laufen sie in umgekehrter Reihenfolge zurück. */
.burger[aria-expanded="false"] .strich:nth-child(1) { transition-delay: .1s; }
.burger[aria-expanded="false"] .strich:nth-child(2) { transition-delay: .05s; }
.burger[aria-expanded="false"] .strich:nth-child(3) { transition-delay: 0s; }

/* Das Panel wächst von oben nach unten heraus — über die Zeilenhöhe eines
   Rasters, damit keine feste Höhe geraten werden muss. */
/* Das Panel liegt *über* der Seite, nicht darin: es hängt unter dem Knopf und
   ist nur so breit wie nötig. Läge es im Fluss, schöbe es beim Aufklappen den
   ganzen Inhalt nach unten. */
.menupanel {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
  width: 232px; max-width: 78vw;
  /* Die Auswahl- und Wissensblätter behalten die feste Breite: Sie tragen
     Chip-Reihen, und die dürfen umbrechen statt die Karte zu dehnen. */
  display: grid; grid-template-rows: 0fr; overflow: hidden;
  transition: grid-template-rows .36s cubic-bezier(.3, .8, .3, 1), opacity .2s;
  opacity: 0; pointer-events: none;
}

/* **Das Menü ist so breit wie sein längster Eintrag** (ADR 0076). Die festen
   232 px stammten aus einer Zeit mit anderen Wörtern: Gemessen endet der
   längste Eintrag bei 143 px, es standen also 89 px leer. Aufgefallen ist das
   erst, als «Einstellungen» in die erste Zeile rückte — das Auge nimmt die
   oberste Zeile als Maß, und eine Karte, deren erste Zeile weit vor dem Rand
   endet, sieht zu breit aus. Sie war es die ganze Zeit.
   `max-content` statt einer neuen festen Zahl: Ein Eintrag, der später
   dazukommt, dehnt die Karte, statt abgeschnitten zu werden. */
#menuPanel { width: max-content; min-width: 176px; }

/* Die Rasterzeile ist der Behälter, nicht die Karte: Ränder und Innenabstände
   der Karte zählten sonst zur Zeilenhöhe, und zugeklappt bliebe ein Streifen. */
.menupanel > .menuwrap { min-height: 0; overflow: hidden; }
body.menu-offen #menuPanel,
body.filter-offen #filterPanel { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
body.wissen-offen #wissenPanel { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
.menuinhalt {
  display: flex; flex-direction: column; gap: 2px; padding: 6px;
  background: var(--blatt); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: inset 0 1px 0 var(--lip), 0 12px 26px var(--shade);
}
.menueintrag {
  display: flex; align-items: center; gap: 12px;
  min-height: 48px; padding: 0 14px; width: 100%;
  background: none; border: none; border-radius: 12px; cursor: pointer;
  color: var(--text); font-size: 15px; text-align: left;
}
.menueintrag .icon { color: var(--dim); }
.menueintrag.active { color: var(--akzent); background: var(--card-2); }
.menueintrag.active .icon { color: var(--akzent); }

/* Der Auswahlknopf steht neben dem Menü und öffnet dasselbe Aufklapp-Panel.
   Weicht die Auswahl vom Regelfall ab, färbt er sich wie ein gesetzter Chip. */
#filterKnopf.aktiv { border-color: var(--akzent); color: var(--akzent); }
/* Der Tafelknopf zeigt nicht «abweichend», sondern «hier stehen Sie». */
#tafelKnopf.aktiv { border-color: var(--ice); color: var(--ice); }
#filterKnopf[aria-expanded="true"] { border-color: var(--akzent); color: var(--akzent); }
/* Aufgeklappt weicht das Symbol nach unten und die Chili nimmt seinen Platz —
   dieselbe Bewegung wie beim Menü, nur mit einem Zeichen statt drei Strichen.
   Trägt die Figur gerade eine Ansicht, bleibt ein ruhender Punkt zurück, damit
   der Knopf kein leerer Kreis ist.

   Wie beim Menüknopf wird **in einer eigenen Hülle** geblendet, nicht am Knopf:
   Der Knopf muss überstehen lassen, sonst wäre die einfliegende Chili bis zur
   Landung abgeschnitten und der Flug sähe aus wie ein Aufploppen. Und er muss
   über dem Panel liegen, sonst verschwindet sie dahinter. */
#filterKnopf { overflow: visible; z-index: 40; }
.knopfzeichen {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  transition: transform .36s cubic-bezier(.3, .8, .3, 1), opacity .24s;
}
#filterKnopf[aria-expanded="true"] .knopfzeichen { transform: translateY(26px); opacity: 0; }
#filterKnopf[aria-expanded="true"] .punkt { opacity: .8; }
#filterKnopf[aria-expanded="true"].mit-chili .punkt { opacity: 0; transition-delay: 0s; }
#chiliFilter { position: absolute; inset: 6px; }
/* Der Wissensknopf trägt dieselben zwei Regeln wie die anderen runden Knöpfe:
   überstehen lassen (sonst wäre die einfliegende Chili abgeschnitten) und über
   dem Blatt liegen. Seine Hülle ist der Anker für das Blatt — im Kopf wie in
   der Kachel. */
#wissenHuelle { position: relative; display: flex; }
#wissenKnopf { overflow: visible; z-index: 40; }
#wissenKnopf[aria-expanded="true"] { border-color: var(--akzent); color: var(--akzent); }
#wissenKnopf[aria-expanded="true"] .knopfzeichen { transform: translateY(26px); opacity: 0; }
#wissenKnopf[aria-expanded="true"] .punkt { opacity: .8; }
#wissenKnopf[aria-expanded="true"].mit-chili .punkt { opacity: 0; transition-delay: 0s; }
#chiliWissen { position: absolute; inset: 6px; }
/* In der Kachel sitzt er oben rechts und schiebt nichts weg: Die Kachel ist
   der Bezug, das Blatt hängt darunter. */
.card { position: relative; }
.kachel-knopf {
  position: absolute; top: 10px; right: 10px; z-index: 40;
  transition: opacity .18s;
}
/* Ist ein anderes Blatt offen, hat der Knopf in der Kachel dort nichts zu
   suchen: Er liegt über dem Blatt (z-index 40 gegen 30) und stach hindurch. */
body.menu-offen .kachel-knopf,
body.filter-offen .kachel-knopf { opacity: 0; pointer-events: none; }
.filterpanel { width: 284px; max-width: 86vw; }
.filterpanel .menuinhalt { max-height: 62vh; overflow-y: auto; padding: 12px; gap: 0; }
.filtergruppe + .filtergruppe { margin-top: 14px; }
.filter-titel {
  display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 8px;
}
.filter-reihe { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-reihe .chip { font-size: 12px; padding: 8px 11px; min-height: 38px; }
.filter-reihe .chip[disabled] { opacity: .4; }

/* ── Buchstaben ────────────────────────────────────────────── */
.abc-tafel {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 8px; margin-bottom: 18px;
}
.abc-kachel {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 62px; padding: 8px 4px; cursor: pointer;
  background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px;
  box-shadow: inset 0 1px 0 var(--lip);
}
.abc-kachel:active { transform: scale(.96); }
.abc-kachel.offen { border-color: var(--ice); }
/* Die sechs falschen Freunde stechen hervor — sie kosten die meiste Mühe. */
.abc-kachel.tueckisch .abc-zeichen { color: var(--bad); }
.abc-zeichen { font-family: Georgia, serif; font-size: 17px; }
.abc-laut { font-size: 11px; color: var(--dim); }
/* Ein Balken am Fuß zeigt die Stufe — dieselben Farben wie überall. */
.abc-kachel { position: relative; overflow: hidden; }
.abc-kachel::after {
  content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
  background: var(--line); transform: scaleX(0); transform-origin: left;
}
.abc-kachel.s1::after { transform: scaleX(.25); background: var(--dim); }
.abc-kachel.s2::after { transform: scaleX(.5); background: var(--ice); opacity: .6; }
.abc-kachel.s3::after { transform: scaleX(.75); background: var(--ice); }
.abc-kachel.s4::after { transform: scaleX(1); background: var(--akzent); }
/* Zwei Klassen, damit die Regel die allgemeine .options-Regel schlägt — die
   steht weiter unten im Stylesheet und gewönne sonst bei gleicher Stärke. */
.options.abc-optionen { grid-template-columns: 1fr 1fr; }
.options.abc-optionen .option { min-height: 58px; font-size: 17px; }
.abc-hilfe { text-align: center; }
.abc-hilfe .word { font-size: 34px; margin-bottom: 2px; }
.abc-hilfe .fact-text { text-align: center; margin-top: 10px; }

/* ── Home ─────────────────────────────────────────────────── */
.empfehlung {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; margin-bottom: 18px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: inset 0 1px 0 var(--lip), 0 10px 22px var(--shade);
  width: 100%; text-align: left; cursor: pointer; color: inherit;
}
.empfehlung:active { transform: scale(.99); }
.empf-text { flex: 1; min-width: 0; }
.empf-label { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--akzent); margin-bottom: 5px; }
.empf-titel { display: block; font-family: Georgia, serif; font-size: 19px; line-height: 1.25; }
.empf-note { display: block; font-size: 13px; color: var(--dim); margin-top: 5px; line-height: 1.4; }

/* Zwei Spalten, außer wo eine Gruppe nur eine Übung hat — «Übersetzen» steht
   allein und darf die ganze Breite nehmen: Es ist das Ziel des ganzen Wegs. */
.kachelfeld { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kachelfeld.breit { grid-template-columns: 1fr; }
/* Eine ungerade letzte Kachel nimmt beide Spalten, statt eine Lücke zu lassen —
   die Lücke war genau das «Wilde» am alten Feld. */
.kachelfeld .kachel:last-child:nth-child(odd) { grid-column: 1 / -1; }
.kachelfeld.breit .kachel,
.kachelfeld .kachel:last-child:nth-child(odd) { min-height: 96px; }
.kachelfeld + .gruppe-titel { margin-top: 22px; }
.gruppe-titel {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 8px 2px;
}
.kachel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  min-height: 116px; padding: 15px; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: inset 0 1px 0 var(--lip), 0 8px 18px var(--shade); color: var(--text);
}
.kachel:active { transform: scale(.98); }
.kachel.gesperrt { opacity: .55; }
.kachel-name { font-family: Georgia, serif; font-size: 17px; }
.kachel-note { font-size: 12px; color: var(--dim); line-height: 1.4; }
/* Das Nomen neben dem Adjektiv: kleiner und gedämpft, aber groß genug, um
   gelesen zu werden — nach ihm richtet sich die Antwort. */
.wort-partner { color: var(--dim); font-size: .72em; }
.kachel-stand { margin-top: auto; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.kachel-stand.faellig { color: var(--akzent); }
.kachel .icon { width: 22px; height: 22px; color: var(--ice); }

.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--dim); font-size: 13px; cursor: pointer;
}
.chip.active { border-color: var(--akzent); color: var(--akzent); }

.paket { margin: -4px 0 14px; }
/* Der Fortschritt einer Sammlung: ein Zeichen je Wort. Was noch nicht
   angefangen ist, bleibt ein Strich; ab der ersten Stufe brennt eine Flamme,
   die mit jeder Stufe wächst. Alle stehen auf einer Linie — eine Flamme wächst
   nach oben, also richtet sich die Reihe unten aus. */
/* Ein Raster, keine umbrechende Reihe: In einer Flexbox verteilt die letzte
   Zeile den ganzen Restplatz unter ihre paar Zeichen, und die Flammen stünden
   dort weiter auseinander als darüber. Ein Raster legt die Spalten einmal für
   alle Zeilen fest — 33 Buchstaben in zwei Zeilen haben denselben Abstand.
   `auto-fit` lässt eine Reihe, die in eine Zeile passt, die Breite ausfüllen. */
.paket-punkte {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(15px, 1fr));
  gap: 4px; align-items: end; justify-items: center; margin-bottom: 7px;
}
.pp {
  width: 100%; max-width: 22px; height: 15px;
  display: flex; align-items: flex-end; justify-content: center;
}
.pp.s0 { height: 4px; border-radius: 999px; background: var(--line); }
.pp svg { display: block; color: var(--ice); }
.pp.s1 svg { width: 6px;   height: 8px;  color: var(--dim); }
.pp.s2 svg { width: 7.5px; height: 10px; opacity: .6; }
.pp.s3 svg { width: 9px;   height: 12px; }
.pp.s4 svg { width: 11px;  height: 15px; color: var(--akzent); }
/* Vier Takte, damit eine Reihe goldener Flammen lebt statt im Gleichschritt zu
   pulsen. Negative Verzögerung: Sie brennen von Anfang an, nur versetzt. */
.pp:nth-child(4n+1) .flamme-aussen { animation-delay: -.4s; }
.pp:nth-child(4n+2) .flamme-aussen { animation-delay: -.9s; }
.pp:nth-child(4n+3) .flamme-aussen { animation-delay: -1.3s; }
.pp:nth-child(4n+1) .flamme-innen { animation-delay: -.5s; }
.pp:nth-child(4n+2) .flamme-innen { animation-delay: -.8s; }
.pp:nth-child(4n+3) .flamme-innen { animation-delay: -.1s; }
.paket-text { font-size: 11px; color: var(--dim); margin: 0; }
.paket-frei { color: var(--akzent); }

/* Der Lesemodus im Freestyle: über dem Thema, volle Breite, damit er auffällt
   ohne zu drängen. Eingeschaltet trägt er Gold — dieselbe Sprache wie ein
   gesetzter Chip. */
.lese-schalter {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 46px; padding: 0 14px; margin: 0 0 14px;
  background: var(--card-2); color: var(--dim);
  border: 1px solid var(--line); border-radius: 14px;
  font: inherit; font-size: 13px; text-align: left; cursor: pointer;
}
.lese-schalter .icon { width: 18px; height: 18px; flex: none; }
.ls-text { flex: 1; }
.ls-zahl {
  flex: none; min-width: 26px; padding: 3px 8px; border-radius: 999px;
  background: var(--card); color: var(--dim); font-size: 11px; text-align: center;
}
.lese-schalter.an {
  border-color: var(--akzent); color: var(--akzent); background: var(--card);
}
.lese-schalter.an .ls-zahl { background: var(--akzent); color: var(--akzent-ink); }

.leer {
  border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center;
}
.leer h3 { font-family: Georgia, serif; font-size: 17px; margin: 0 0 8px; font-weight: 600; }
.leer p { font-size: 13px; color: var(--dim); line-height: 1.55; margin: 0 0 6px; }
.leer .naechste { margin-top: 14px; font-size: 13px; }
.leer .naechste span { color: var(--text); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 24px 18px; text-align: center;
  box-shadow: inset 0 1px 0 var(--lip), 0 6px 18px -12px var(--shade);
}
/* Der Ort im Lernweg steht **über** der Kachel, nicht darin: Er sagt, wo man
   gerade ist, und das ist keine Randnotiz. Etwas größer als die Etiketten in
   der Kachel — er ist die Überschrift, nicht die Fußnote. */
.kachel-ort {
  font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 8px 2px;
}
.kachel-ort .cyr { text-transform: none; letter-spacing: normal; }
/* Drei Plätze: links der Stand oder die Richtung, mittig die Spielart, rechts
   bleibt für den Knopf frei. Ohne Mitte rückt links an seinen Platz. */
.card-meta {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 8px; margin-bottom: 16px; font-size: 10px; color: var(--dim);
  min-height: 14px;
}
.card-meta > :first-child { justify-self: start; }
.card-meta > :last-child { justify-self: end; }
.card-meta .mitte { justify-self: center; text-transform: uppercase; letter-spacing: .12em; }
/* Trägt die Kachel einen Knopf, bleibt rechts Platz für ihn. */
.card.mit-knopf .card-meta { padding-right: 44px; }
.boxdots { display: flex; gap: 4px; }
.boxdots span { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--line); }
.boxdots span.on { background: var(--akzent); border-color: var(--akzent); }
.card-theme { text-transform: uppercase; letter-spacing: .12em; }

.task-label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); margin: 0 0 6px; }
/* Kyrillisch in Versalien liest sich lateinisch: «в на» wird zu «B HA». */
.task-label .cyr, .wissen-regel .cyr { text-transform: none; letter-spacing: normal; }
.word { font-size: 30px; margin: 4px 0 6px; font-weight: 600; }
.sentence { font-size: 22px; line-height: 1.45; margin: 4px 0 12px; }
.answer { font-size: 17px; color: var(--ice); margin: 12px 0 0; }
.translit { font-size: 13px; color: var(--dim); font-style: italic; margin: 4px 0 0; }
.hint { font-size: 13px; color: var(--dim); margin-top: 12px; }
/* Die Vorgabe der Grammatikaufgabe: kein Kleingedrucktes, sondern Teil der
   Frage. «он / она» sagt, welche Form verlangt ist — wer das überliest,
   beantwortet die falsche Aufgabe. */
.gram-vorgabe {
  display: inline-flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 10px;
  margin: 14px auto 0; padding: 9px 16px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card-2);
  font-size: 15px; color: var(--dim);
}
.gv-trenner { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
.gv-verlangt { font-size: 17px; color: var(--akzent); font-weight: 600; }
.gv-verlangt .cyr { font-size: 19px; }

/* Abschluss einer Power-Runde: was aus jedem Wort geworden ist. */
.pt-liste { display: flex; flex-direction: column; gap: 8px; margin: 18px 0 4px; text-align: left; }
.pt-zeile {
  display: flex; align-items: baseline; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card-2);
}
.pt-zeile .cyr { font-size: 17px; }
.pt-de { flex: 1; font-size: 13px; color: var(--dim); }
.pt-stand { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.pt-stand.frei { color: var(--good); }

.speak {
  background: none; border: none; color: var(--ice);
  cursor: pointer; margin-left: 6px; vertical-align: middle; opacity: .85;
  min-width: 44px; min-height: 44px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.speak:active { transform: scale(.92); }
/* Nach der Auflösung beides zum Anhören — die Sprache steht am Knopf. */
.hoerzeile { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.hoerzeile .chip { display: inline-flex; align-items: center; gap: 7px; color: var(--ice); }
.hoerzeile .chip .icon { width: 17px; height: 17px; }
.tile.fn, .wordtile.fn, .key.wide { display: inline-flex; align-items: center; justify-content: center; }
.tile.fn .icon, .wordtile.fn .icon, .key.wide .icon { width: 18px; height: 18px; }

.slots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 14px 0 16px; min-height: 42px; }
.slot {
  width: 32px; height: 42px; border-bottom: 2px solid var(--line);
  font-size: 24px; display: flex; align-items: center; justify-content: center;
}
.slot.filled { border-bottom-color: var(--akzent); }

.tiles { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.tile {
  min-width: 44px; min-height: 44px; padding: 10px 8px; border-radius: 10px; font-size: 20px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer;
}
.tile:active { transform: scale(.94); }
.tile.used { opacity: .18; }
.tile.fn { color: var(--dim); font-size: 16px; }

.built {
  min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  align-items: center; padding: 8px 6px; margin: 6px 0 14px; border-bottom: 1px solid var(--line);
}
.built-placeholder { font-size: 12px; color: var(--dim); }
.built-word {
  font-size: 17px; min-height: 44px; padding: 8px 12px; border-radius: 8px;
  background: var(--card-2); border: 1px solid var(--akzent); color: var(--text);
}
button.built-word { cursor: pointer; }
button.built-word:active { transform: scale(.95); }
.wordtile {
  padding: 11px 13px; min-height: 44px; border-radius: 10px; font-size: 16px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer;
}
.wordtile:active { transform: scale(.95); }
.wordtile.used { opacity: .18; }
.wordtile.fn { color: var(--dim); }

.options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
.option {
  padding: 13px 14px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--text); font-size: 16px; cursor: pointer;
}
.option.picked { border-color: var(--akzent); color: var(--akzent); background: var(--card); }
.option.right { border-color: var(--good); color: var(--good); }
.option.wrong { border-color: var(--bad); color: var(--bad); }
.option.muted { opacity: .35; }

.feedback { margin-top: 14px; font-size: 15px; }
.feedback p, p.feedback { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.feedback .icon { width: 17px; height: 17px; }
.feedback.good { color: var(--good); }
.feedback.bad strong { color: var(--bad); font-size: 18px; }

/* Ein Wort im Satz ist ein Knopf — ohne so auszusehen. Der Satz soll ein Satz
   bleiben; erst der zarte Unterstrich verrät, dass dahinter etwas steckt. */
.satzwort {
  border: 0; background: none; padding: 0 1px; font: inherit; color: inherit;
  cursor: pointer; border-bottom: 1px dashed var(--line);
}
.satzwort:active { color: var(--ice); }

#wissenPanel { width: 300px; }
.wissen-karte {
  padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left;
}
.wissen-karte:last-child { border-bottom: 0; }
.wissen-wort { margin: 0 0 4px; font-size: 21px; display: flex; align-items: center; gap: 4px; }
.wissen-zeile { margin: 0 0 6px; font-size: 13px; color: var(--dim); }
.wissen-regel {
  margin: 0; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--akzent);
}
.wissen-regel.offen { color: var(--dim); letter-spacing: 0; text-transform: none; font-size: 12px; }
.wissen-warum { margin: 6px 0 0; font-size: 13px; line-height: 1.5; }
.wissen-alle { margin-bottom: 4px; }

/* ── Grammatik ─────────────────────────────────────────────
   Das Entdecken zeigt Paare: links die Grundform, rechts, was daraus wird.
   Der Pfeil dazwischen trägt die ganze Aussage — er bekommt darum Luft. */
.gram-paare { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
.gram-paar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px; background: var(--card-2);
  border: 1px solid var(--line); font-size: 17px;
}
.gram-paar > :first-child { text-align: right; }
.gram-pfeil { color: var(--dim); font-size: 14px; }
.gram-deutung { font-size: 14px; color: var(--ice); }

/* Die Regelkarte: erst der Satz, dann die Tabelle, dann der Merksatz. */
.gram-regel { text-align: left; position: relative; }
/* Der Stern an einer Regelkarte sitzt oben rechts — er soll die Zeile darunter
   nicht anschieben, und die Kopfzeile der Karte ist kurz genug, dass er nie
   darauf steht. */
.regelstern {
  position: absolute; top: 8px; right: 8px; z-index: 1;
  width: 44px; height: 44px; display: grid; place-items: center;
}
.gram-regel .task-label { padding-right: 44px; }

/* «Mehr …» klappt die Karte auf — dieselbe Art wie beim Menü: über die
   Zeilenhöhe eines Rasters, damit keine feste Höhe geraten werden muss. Die
   Karte klebte vorher unmittelbar an den Knöpfen; der Abstand wächst darum
   mit, statt fest dazustehen. */
.regelklapp {
  display: grid; grid-template-rows: 0fr; overflow: hidden;
  opacity: 0; margin-top: 0;
  transition: grid-template-rows .36s cubic-bezier(.3, .8, .3, 1),
              margin-top .36s cubic-bezier(.3, .8, .3, 1), opacity .2s;
}
/* Die Rasterzeile ist der Behälter, nicht die Karte: Ränder und Innenabstände
   der Karte zählten sonst zur Zeilenhöhe, und zugeklappt bliebe ein Streifen. */
.regelklapp > .klappwrap { min-height: 0; overflow: hidden; }
.regelklapp.auf { grid-template-rows: 1fr; opacity: 1; margin-top: 20px; }
.regelklapp .gram-regel { box-shadow: inset 0 1px 0 var(--lip), 0 12px 26px var(--shade); }
.gram-tabelle {
  display: flex; flex-direction: column; gap: 1px; margin: 16px 0 14px;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.gram-zeile {
  display: grid; grid-template-columns: minmax(74px, auto) minmax(64px, auto) 1fr;
  gap: 10px; align-items: baseline; padding: 10px 12px;
  background: var(--card-2); font-size: 13px;
}
.gram-fall { color: var(--text); }
.gram-was { color: var(--akzent); font-size: 12px; }
.gram-bsp { color: var(--dim); }
.gram-merk {
  margin: 0; padding: 11px 13px; border-radius: 10px;
  border-left: 3px solid var(--akzent); background: var(--card-2);
  font-family: Georgia, serif; font-size: 15px; line-height: 1.5;
}
.gram-fuss { text-align: left; margin-top: 12px; }

/* Was die App über sich weiß, steht rechts wie ein Schalter — nur ist es
   keiner, sondern eine Auskunft. */
.app-wert {
  flex: none; font-size: 14px; color: var(--dim);
  font-family: Georgia, serif; text-align: right;
}
/* Liegt die App wirklich auf dem Gerät, trägt die Zahl das Signal — sie steht
   dann für «ja» (ADR 0067). Das Wort dazu hört, wer vorlesen lässt. */
.app-wert.bereit { color: var(--good); }

/* Der Knopf für die Aktualisierung wechselt vier Mal, was er zeigt: «Suchen»,
   einen Ring, «Update», einen Balken. **Seine Größe wechselt nie** — ein Knopf,
   der unter dem Daumen die Breite ändert, verschiebt alles daneben und trifft
   beim zweiten Tippen ins Leere. Die Breite ist die der längsten Beschriftung,
   die Höhe die eines Touch-Ziels. */
.sw-knopf {
  flex: none; min-width: 132px; display: inline-flex;
  align-items: center; justify-content: center;
}
/* Wartet eine Fassung, ist der Knopf kein Angebot mehr, sondern die Handlung —
   also trägt er Gold. Beim Laden behält er es: Es ist derselbe Vorgang. */
.sw-knopf.sw-bereit, .sw-knopf.sw-laedt {
  background: var(--akzent); border-color: var(--akzent); color: var(--akzent-ink);
}
/* **Eine Anzeige, zwei Farben.** Erst waren es zwei Gestalten — Ring beim
   Suchen, Balken beim Laden. Das war ein Unterschied zu viel: Beide Male
   wartet man auf dieselbe Sache, und der Knopf sagt über seine Farbe schon,
   worauf. Der Ring nimmt darum auf Gold die Farbe der Schrift darauf. */
.sw-ring {
  /* `flex: none` ist keine Zierde: Der Ring steht in einem Flex-Knopf, und wo
     eine Regel Kindern Wachstum gibt, wird aus dem Kreis eine Ellipse. */
  flex: none; width: 17px; height: 17px; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--akzent);
  animation: swDreht .8s linear infinite;
}
.sw-laedt .sw-ring {
  border-color: rgba(255, 255, 255, .35); border-top-color: var(--akzent-ink);
}
@keyframes swDreht { to { transform: rotate(360deg); } }
/* Wer keine Bewegung will, bekommt trotzdem eine Anzeige — sie steht dann
   still. Nichts zu zeigen wäre schlimmer als sich nicht zu drehen. */
@media (prefers-reduced-motion: reduce) {
  .sw-ring { animation: none; }
}

/* Die Leiste «neue Fassung bereit». Sie sitzt unter dem Kopf, nicht darüber:
   Sie unterbricht nichts, sie steht nur da. */
/* **display: flex sticht [hidden].** Ohne diese Zeile stünde die Leiste immer
   da — sie war im Bildschirmfoto sofort zu sehen, obwohl das Attribut gesetzt
   war. Wer einer verborgenen Hülle ein display gibt, nimmt ihr das Verbergen. */
#swNeu[hidden] { display: none; }
#swNeu {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px calc(9px + env(safe-area-inset-bottom, 0px) * 0);
  padding-left: max(14px, env(safe-area-inset-left));
  padding-right: max(14px, env(safe-area-inset-right));
  background: var(--card); border-bottom: 1px solid var(--line);
  font-size: 14px; color: var(--text);
}
/* **Nur der Meldungstext, nicht jedes span** (ADR 0072). Ohne den Kindwähler
   traf die Regel auch den Ladering — der ist ein span, steckt im Knopf
   daneben, und `flex: 1` dehnte den 17-px-Kreis auf Knopfbreite. Sichtbar war
   davon ein riesiger dünner Bogen quer über den Kopf. */
#swNeu > span { flex: 1; }
#swNeu .btn {
  /* Die Größe wechselt nie (ADR 0062): Ein Knopf, der beim Tippen schmaler
     wird, sieht aus wie ein Fehlgriff. Darum `flex: none` — mit `flex: 1` hätte
     die festgehaltene Breite ohnehin nichts genützt. */
  flex: none; min-width: 132px;
  padding: 8px 14px; font-size: 14px; min-height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
}
/* Und beim Laden sieht die Zeile aus wie der Knopf in den Einstellungen: Beide
   tun dasselbe, also warten sie auch gleich — bis 2.4.13 stand hier ein hohler
   Knopf mit goldenem Bogen, dort ein goldener mit hellem Ring. */
#swNeu .btn.sw-laedt {
  background: var(--akzent); border-color: var(--akzent); color: var(--akzent-ink);
}
.sw-zu {
  flex: none; width: 36px; height: 36px; padding: 0;
  display: grid; place-items: center;
  background: none; border: 0; color: var(--dim); cursor: pointer;
}
.sw-zu .icon { width: 16px; height: 16px; }

/* Die Frage über der Auswahl in den schärfenden Buchstaben-Aufgaben — die
   Merkhilfe beim Minimalpaar, die Bedeutung beim Betonungswort. */
.abc-frage {
  margin: 0 0 14px; font-family: Georgia, serif; font-size: 16px;
  line-height: 1.5; color: var(--ice); text-align: center;
}

/* Die Nachschrift nach einem Schreibfehler. Sie steht **außerhalb** der
   Aufgabenkarte: Sie gehört nicht mehr zur Frage, sie ist der Weg weiter. */
.reko {
  margin: 12px 0 0; padding: 13px 15px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--line);
  border-left: 3px solid var(--bad);
}
.reko.sitzt { border-left-color: var(--good); }
.reko .task-label { margin: 0 0 6px; }
.reko-vorlage {
  margin: 0 0 10px; font-family: Georgia, serif; font-size: 22px;
  color: var(--akzent); letter-spacing: .01em;
}
.reko textarea { margin: 0; }

/* Die Lücke in «Schreibung». Sie muss auch dann sichtbar breit sein, wenn gar
   kein Zeichen hineingehört — «ь oder nichts» ist eine echte Frage. */
.ortho-luecke {
  display: inline-block; min-width: .62em; margin: 0 .05em;
  border-bottom: 2px solid var(--akzent);
}

/* Gemeistert — eine Zeile, kein Zwischenbildschirm. Sie soll auffallen, ohne
   den Weg zur nächsten Frage zu verstellen. */
.meister {
  display: flex; align-items: center; gap: 10px; margin-top: 14px;
  padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--akzent); background: var(--card-2);
  animation: meisterAuf .42s cubic-bezier(.2, .9, .3, 1);
}
.meister .icon { width: 19px; height: 19px; color: var(--akzent); flex: none; }
.meister strong { display: block; font-size: 14px; color: var(--akzent); }
.meister-wort { display: block; font-size: 15px; margin-top: 2px; }
.meister-note {
  display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); margin-top: 4px;
}
@keyframes meisterAuf {
  from { opacity: 0; transform: translateY(8px) scale(.97); }
  to { opacity: 1; transform: none; }
}

/* Gegenstück zur Meisterschaft: derselbe Bau, anderer Ton. Der leichte Patzer
   bleibt grau, das Zurückstufen trägt die Warnfarbe — man soll es sehen. */
.patzer {
  margin-top: 14px; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card-2);
  animation: meisterAuf .42s cubic-bezier(.2, .9, .3, 1);
}
.patzer strong { display: block; font-size: 14px; color: var(--text); }
.patzer.hart { border-color: var(--bad); }
.patzer.hart strong { color: var(--bad); }
.patzer-worte { display: block; font-size: 16px; margin-top: 4px; }
.patzer-note { display: block; font-size: 12px; color: var(--dim); margin-top: 5px; }
.patzer-los { margin-top: 12px; width: 100%; }

/* Der Wink am Fuß von «Buchstaben»: kein Tadel, sondern ein Lohn — darum Gold
   statt der grauen Linie. */
.lese-wink {
  position: relative; margin-top: 16px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--akzent); background: var(--card-2); text-align: left;
}
/* Der Schließknopf sitzt in der Ecke und greift über den Rand hinaus, damit
   die Trefferfläche 44 px erreicht, ohne den Text zu verdrängen. */
.lw-zu {
  position: absolute; top: 0; right: 0; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; color: var(--dim); cursor: pointer;
}
.lw-zu .icon { width: 15px; height: 15px; }
.lw-zu:active { color: var(--akzent); }
.lese-wink strong { padding-right: 32px; }
.lese-wink strong { display: block; font-size: 14px; color: var(--akzent); }
.lw-note { display: block; font-size: 12px; color: var(--dim); margin-top: 5px; }
.lw-los { margin-top: 12px; width: 100%; }

/* Ein Buchstabe ist zurückgefallen — dieselbe Form wie ein Patzer, dieselbe
   Bedeutung. */
.lese-fall { margin-top: 14px; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--bad); background: var(--card-2); text-align: left;
  animation: meisterAuf .42s cubic-bezier(.2, .9, .3, 1);
}
.lese-fall strong { display: block; font-size: 14px; color: var(--bad); }
.lf-zeichen { display: block; font-size: 20px; margin-top: 4px; }
.lf-note { display: block; font-size: 12px; color: var(--dim); margin-top: 5px; }

.chili { display: block; }
.chili.gross { width: 104px; height: 104px; margin: 0 auto 16px; }
.chili.klein { width: 76px; height: 76px; flex: none; margin: 0; }
.chili.winzig { width: 30px; height: 30px; flex: none; }

/* Die Figur steht im Fluss — im Platzhalter der jeweiligen Ansicht. Damit
   scrollt sie starr mit dem Inhalt; nichts wird je Bild nachgerechnet. */
/* Vor dem ersten Renderlauf steht die Figur noch im Kopf, weil das Markup sie
   dort hält. Sichtbar wird sie erst, wenn das Skript sie gesetzt hat — sonst
   blitzt sie beim Neuladen kurz neben dem Menüknopf auf. */
#chiliBuehne { position: absolute; inset: 0; pointer-events: none; visibility: hidden; }
body.chili-steht #chiliBuehne { visibility: visible; }
#chiliFigur {
  width: 100%; height: 100%; display: block;
}
/* Der Sprung: ducken, Bogen, federn — kurz und schnell. */
#chiliFigur.springt { animation: chiliSprung .23s cubic-bezier(.3, .85, .4, 1); }
@keyframes chiliSprung {
  0%   { transform: translateY(0) rotate(0deg) scaleY(1); }
  14%  { transform: translateY(6px) rotate(-4deg) scaleY(.86); }
  46%  { transform: translateY(-42px) rotate(7deg) scaleY(1.08); }
  74%  { transform: translateY(3px) rotate(-3deg) scaleY(.92); }
  88%  { transform: translateY(-4px) rotate(1deg) scaleY(1.02); }
  100% { transform: translateY(0) rotate(0deg) scaleY(1); }
}
/* Die Blase kommt kurz nach der Landung — sie wächst herein, als spräche die
   Chili, statt aufzuploppen. */
.sprechblase { animation: blaseAuf .6s .26s both cubic-bezier(.2, .8, .3, 1); }
@keyframes blaseAuf {
  from { opacity: 0; transform: translateY(10px) scale(.94); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  #chiliFigur.springt, .sprechblase, .meister { animation: none; }
  .burger .strich, .menupanel { transition: none; }
}

/* Die Chili spricht: Blase oben, Figur darunter links, Zipfel dazwischen. */
.sprechblase {
  position: relative; background: var(--card); border: 1px solid var(--akzent);
  border-radius: 20px; padding: 18px 18px 16px; text-align: left;
  box-shadow: inset 0 1px 0 var(--lip), 0 8px 20px -14px var(--shade);
}
.sprechblase::after {
  content: ''; position: absolute; left: 34px; bottom: -8px; width: 15px; height: 15px;
  background: var(--card); border-right: 1px solid var(--akzent); border-bottom: 1px solid var(--akzent);
  transform: rotate(45deg);
}
.sprechblase .fact-label { text-align: left; margin: 0 0 8px; }
.sprechblase .fact-text { font-size: 16px; }
/* Der Streifen unter der Auflösung: dieselbe Blase, aber ohne Zipfel und ohne
   Auftritt — die Chili steht hier nicht daneben, sie ist mitten in der Übung. */
/* Das Tutorial. Der Schatten des Lochs verdunkelt alles ringsum — 9999px
   Streuung reichen für jeden Bildschirm, und das Loch selbst bleibt frei.
   Zeiger fängt der Hof ab: Während der Erklärung ist nur «Verstanden»
   bedienbar, sonst tippt man aus Versehen in die App hinein. */
#tutHof {
  position: fixed; inset: 0; z-index: 80;
  background: transparent;
}
/* Der Rand des Lochs ist weich, nicht gezogen: Ein zweiter, **innen**
   liegender Schatten läuft von der Kante nach innen aus und trifft dort auf
   die Dunkelheit ringsum. So gibt es keine Linie mehr, nur einen Übergang —
   eine harte goldene Umrandung sah ausgeschnitten aus. */
/* **Angeleuchtet wird das Ziel, sonst nichts** (ADR 0067). Bis 2.4.8 stand das
   Loch 22 px weiter außen und lief nach innen weich aus. Auf dem fast schwarzen
   Grund war das ein Hauch; auf einer satten Farbe wurde daraus ein heller
   Rahmen, und der zog den Blick stärker an als das, was er zeigen sollte.
   2.4.9T ließ noch vier Pixel stehen — auch die waren zu sehen.

   Jetzt liegt das Loch **genau** auf dem Ziel. Der Radius wird **gemessen**,
   nicht gesetzt: Eine Kachel hat 18 px, ein runder Knopf die Hälfte seiner
   Breite. Ein fester Wert schnitte an einem von beiden die Ecken auf. */
#tutLoch {
  position: absolute;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, .82);
  transition: top .28s ease, left .28s ease, width .28s ease, height .28s ease;
}
/* Beim **ersten** Erscheinen darf nichts gleiten: Das Loch stünde sonst noch
   außerhalb des Bildes und flöge sichtbar aus der Ecke heran. Von Schritt zu
   Schritt wandert es dagegen — dort ist die Bewegung die Erklärung. */
#tutLoch.springt { transition: none; }
/* **Ein ruhiges Atmen** (ADR 0083, löst den Puls aus ADR 0081 ab).
   Der Ring von damals stand **außerhalb** des Lochs und lag in derselben
   Eigenschaft wie die Verdunklung. `box-shadow` ist aber eine **Liste**, und
   eine Liste mit zwei Einträgen läßt sich nicht gegen eine mit einem
   interpolieren: Der Browser schaltet hart um, und für einen Augenblick war
   gar kein Schatten da — der ganze Bildschirm blitzte auf. Genau so wurde es
   gemeldet.

   Jetzt atmet eine Fläche **innerhalb** des Lochs, langsam ein und aus. Sie
   liegt in einem eigenen Kind, denn eine Deckung auf dem Loch selbst nähme den
   Schatten mit — das wäre dasselbe Blitzen mit anderer Ursache. Den Radius
   erbt sie vom Loch, und das mißt ihn am Ziel: Was leuchtet, endet an der
   Kante der Kachel und nicht einen Pixel weiter (ADR 0067). */
#tutLoch::after {
  content: ''; position: absolute; inset: 0;
  border-radius: inherit; background: var(--tut-atem);
  opacity: 0; animation: tutAtem 5.6s ease-in-out infinite;
}
@keyframes tutAtem {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}
/* Ohne Ziel — die Eingangsfrage — deckt der Hof selbst ab, und das Loch geht
   weg. Es außerhalb des Bildes zu parken reicht **nicht**: Der Schatten wächst
   nur 9999 px weit, und genau so weit draußen stünde das Loch — der Rand des
   Schattens fiele auf den Rand des Bildschirms, und die Seite bliebe hell. */
#tutHof.ohne-ziel { background: rgba(0, 0, 0, .82); }
#tutHof.ohne-ziel #tutLoch { display: none; }

/* Das Gespann: die Chili und ihre Sprechblase, sonst nichts. Kein Grund, kein
   Rahmen — sie steht frei auf dem verdunkelten Bild neben dem, wovon sie
   spricht. Der Behälter wird je Schritt **einmal** gesetzt; die Figur steht
   darin im Fluss wie überall (ADR 0012). */
#tutGespann {
  position: fixed; z-index: 85; left: 14px; right: 14px;
  /* Der Spalt ist nicht Zierde: Der Zipfel ragt 8 px aus der Blase, und ohne
     ihn stünde die Figur darauf. */
  display: flex; flex-direction: column; align-items: flex-start; gap: 9px;
  pointer-events: none;   /* der leere Raum daneben fängt keine Zeiger ab */
}
#tutGespann > * { pointer-events: auto; }
#tutGespann[aria-hidden="true"] { display: none; }
/* Steht das Gespann **unter** dem Ziel, kommt die Chili nach oben und die
   Blase darunter — der Zipfel dreht sich mit. */
#tutGespann.chili-oben { flex-direction: column-reverse; }
/* Die Ausrückung setzt tutChiliRuecken() je Schritt — sie steht unter der
   Mitte dessen, wovon die Rede ist. */
#tutChili { flex: none; width: 76px; height: 76px; margin-left: 16px; }
/* Die Sprechblase. Sie ist in **jedem** Schema dunkel, auch in den hellen —
   und das ist keine Nachlässigkeit gegenüber ADR 0039: Sie liegt auf einem
   abgedunkelten Bild. Eine helle Blase wäre dort der zweite Scheinwerfer und
   nähme dem ersten die Aussage. Die vier Werte stehen darum fest. */
#tutSprech {
  --tut-grund: #17161C;
  --tut-linie: rgba(255, 255, 255, .13);
  --tut-schrift: #F2F0EC;
  --tut-leise: rgba(242, 240, 236, .62);
  position: relative; width: 100%;
  background: var(--tut-grund); border: 1px solid var(--tut-linie); border-radius: 18px;
  padding: 15px 16px 13px; color: var(--tut-schrift);
  box-shadow: 0 14px 38px rgba(0, 0, 0, .5);
}
#tutSprech .tut-text {
  margin: 0; font-size: 15px; line-height: 1.5; color: var(--tut-schrift);
}
#tutSprech .btn-row { margin-top: 14px; }
#tutSprech .btn-row[hidden] { display: none; }
/* Jeder Schritt klappt die Blase neu auf — sonst wäre der Wechsel bloß ein
   ausgetauschter Text, und der Sprung der Chili käme aus dem Nichts. */
@keyframes tutAuf {
  from { opacity: 0; transform: scale(.94); }
  to { opacity: 1; transform: scale(1); }
}
#tutSprech.klappt { animation: tutAuf .3s .16s both cubic-bezier(.2, .8, .3, 1); }
/* Der Zipfel zeigt auf die Chili — sie spricht, nicht die Blase. Ein gedrehtes
   Quadrat mit demselben Grund; nur die zwei Kanten, die nach außen weisen,
   tragen die Linie, die anderen beiden verschwinden unter der Blase. */
#tutZipfel {
  position: absolute; left: 36px; width: 15px; height: 15px;
  background: var(--tut-grund); transform: rotate(45deg); border-radius: 2px;
  bottom: -8px;
  border-right: 1px solid var(--tut-linie); border-bottom: 1px solid var(--tut-linie);
}
#tutGespann.chili-oben #tutZipfel {
  bottom: auto; top: -8px;
  border-right: none; border-bottom: none;
  border-left: 1px solid var(--tut-linie); border-top: 1px solid var(--tut-linie);
}
/* Der Zipfel bleibt immer: Er zeigt auf die Figur, und die steht auch dann
   da, wenn gerade nichts angeleuchtet wird. */
/* Der Fuß: links die Punktreihe, rechts der Pfeil. Kein Wort — was er tut,
   sagt die Reihe daneben. */
.tut-fuss { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.tut-fuss[hidden] { display: none; }
.tut-punkte { display: flex; align-items: center; gap: 5px; flex: 1; flex-wrap: wrap; }
.tut-punkte i {
  display: block; width: 5px; height: 5px; border-radius: 999px;
  background: rgba(255, 255, 255, .26);
  transition: width .26s ease, background-color .26s ease;
}
.tut-punkte i.hier { width: 16px; background: var(--tut-schrift); }
.tut-punkte i.war { background: rgba(255, 255, 255, .48); }
/* Nur für Vorleser: Die Punktreihe sagt einem Auge alles, einem Ohr nichts. */
.tut-zaehler {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
.tut-vor {
  flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; background: var(--tut-schrift); color: var(--tut-grund);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.tut-vor svg { width: 20px; height: 20px; }
/* Der Ausgang sitzt in der Blase, nicht am Bildrand. Am Rand läge er über dem
   Menüknopf und sähe aus wie ein zweiter davon — die Kopfzeile ist besetzt. */
#tutZu {
  position: absolute; top: 3px; right: 3px;
  width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; color: var(--tut-leise); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#tutZu[hidden] { display: none; }
#tutZu svg { width: 17px; height: 17px; }
/* Nur wo er wirklich steht, macht ihm die erste Zeile Platz. */
#tutZu:not([hidden]) ~ .tut-text { padding-right: 26px; }
body.tut-offen { overflow: hidden; }
@media (prefers-reduced-motion: reduce) {
  #tutLoch, .tut-punkte i { transition: none; }
  /* Wer keine Bewegung will, bekommt den Schein **stehend** statt atmend —
     ganz wegzulassen nähme ihm die Auskunft, die er trägt. Ein stehender
     **Rand** wäre etwas anderes und bleibt verboten (ADR 0067); das hier ist
     eine Fläche innerhalb des Ziels. */
  #tutLoch::after { animation: none; opacity: .6; }
  #tutSprech.klappt { animation: none; }
}

/* **Alle Übungen** — der eine Tipp zwischen dem Weg und dem ganzen Angebot.
   Er sieht aus wie eine Gruppenüberschrift mit Knopfcharakter: eine Zeile über
   die volle Breite, ruhig, aber offensichtlich anzutippen. Der Winkel dreht
   sich beim Öffnen; das Blatt darunter ist nicht animiert, sonst spränge die
   Seitenlänge bei jedem Tipp. */
.alle-knopf {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; margin: 22px 0 0; padding: 13px 16px; min-height: 44px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  color: var(--text); font: inherit; font-size: 15px; cursor: pointer;
  box-shadow: inset 0 1px 0 var(--lip), 0 6px 18px -12px var(--shade);
}
.alle-knopf .icon { color: var(--akzent); transition: transform .2s; }
.alle-knopf[aria-expanded="true"] .icon { transform: rotate(180deg); }
.alle-klapp[hidden] { display: none; }
/* Die erste Überschrift im aufgeklappten Bereich rückt nicht so weit ab wie
   sonst — sie steht schon unter einer Trennlinie. */
.alle-klapp > .gruppe-titel:first-child { margin-top: 14px; }
@media (prefers-reduced-motion: reduce) {
  .alle-knopf .icon { transition: none; }
}

/* Der Knopf am Ende der Übersicht. Er nimmt zwei Fünftel der Breite und steht
   rechts: Ein Angebot, das man annehmen kann, muss nicht die ganze Zeile
   beanspruchen — und rechts liegt es unter dem Daumen. Er trägt den Akzent,
   aber keine Fläche: Wer die App kennt, soll ihn übersehen dürfen, ohne ihn
   suchen zu müssen. **Durchgezogen** seit ADR 0071 — gestrichelt las sich wie
   ein Platzhalter, nicht wie ein Angebot; zurückhaltend ist er schon dadurch,
   dass er hohl ist. */
.tut-knopf {
  display: block; width: 40%; margin: 22px 0 4px auto; padding: 13px 10px;
  background: none; border: 1px solid var(--akzent); border-radius: 14px;
  color: var(--akzent); font: inherit; font-size: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* Oben ist er ein Angebot, unten eine Auskunft. Dieselbe Farbe, aber
   durchgezogen und auf einer Fläche: Wer die App zum ersten Mal öffnet, soll
   ihn nicht überlesen. */
.tut-knopf.oben {
  margin: 0 0 16px auto;
  background: var(--akzent); color: var(--akzent-ink);
}

/* Was die Chili nach einer Auflösung sagt — jetzt sagt sie es selbst (ADR
   0060). Die Blase hängt unter ihr, endet rechts am Inhaltsrand und wächst
   nach links, so weit der Satz sie braucht. Sie liegt über der Titelzeile:
   Der Kopf ist unterwegs das ruhigste Stück der Seite, und ein Nebensatz darf
   dort kurz stehen, ohne die Aufgabe zu verdecken. */
#chiliBlase {
  position: absolute; top: calc(100% + 9px); right: 0; z-index: 3;
  width: max-content;
  max-width: calc(100vw - var(--pad-links) - var(--pad-rechts));
  /* Sie reicht immer bis unter die Figur — sonst stünde der Zipfel bei einem
     kurzen Satz neben der Blase statt an ihr. */
  min-width: calc(var(--zipfel, 100px) + 46px);
  /* **Der Rand trägt die Akzentfarbe** (ADR 0067): Die Blase steht über der
     Titelzeile des Kopfes, und mit der Linie des Schemas verschwamm sie dort
     mit allem anderen. **Ein Pixel wie an jedem Knopf** — zwei sahen aus, als
     wollte sie etwas sein, was sie nicht ist. Die Farbe trägt die Sichtbarkeit,
     nicht die Dicke. */
  background: var(--card-2); border: 1px solid var(--akzent); border-radius: 14px;
  padding: 9px 13px;
  box-shadow: 0 8px 20px var(--shade);
  animation: blaseAuf .34s .06s both ease-out;
}
#chiliBlase[hidden] { display: none; }
#chiliBlase p {
  margin: 0; font-size: 14px; line-height: 1.45; color: var(--fg);
  font-style: italic;
}
/* Der Zipfel zeigt auf **sie**, nicht auf das Gesagte — dieselbe Regel wie im
   Tutorial (ADR 0051). Zwei Dreiecke übereinander: das untere trägt die
   Kante, das obere die Fläche. Wo die Figur steht, wird gemessen, nicht
   geraten — in «Buchstaben» und «Übersetzen» schiebt ein weiterer Knopf sie
   nach links. */
#chiliBlase::before, #chiliBlase::after {
  content: ''; position: absolute; bottom: 100%;
  right: var(--zipfel, 100px);
  border: 8px solid transparent; border-top: 0;
}
#chiliBlase::before { border-bottom-color: var(--akzent); }
/* Ein Pixel schmaler und einen tiefer: So bleibt vom unteren Dreieck genau die
   Randstärke der Blase stehen — sonst hätte der Zipfel keinen Rand oder einen
   doppelt so dicken. */
#chiliBlase::after {
  border-bottom-color: var(--card-2); margin-bottom: -1px;
  border-width: 0 7px 7px; right: calc(var(--zipfel, 100px) + 1px);
}
@keyframes blaseAuf {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) { #chiliBlase { animation: none; } }
.fakt-fuss { display: flex; align-items: center; gap: 12px; margin: 12px 0 0 16px; }
.fakt-fuss .sternbtn { margin-left: auto; }

.jubel { border-color: var(--akzent); }
.jubel .word { color: var(--akzent); }
.jubel .hint { margin-top: 10px; }
.fact-kopf { display: flex; align-items: center; gap: 10px; }
.fact-kopf .fact-label { flex: 1; text-align: left; margin-bottom: 0; }
.sternbtn {
  flex: none; min-width: 44px; min-height: 44px; padding: 0; margin: -10px -6px -10px 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: none; border: none; color: var(--dim); cursor: pointer;
}
.sternbtn.an { color: var(--akzent); }
.sternbtn:active { transform: scale(.92); }
/* **Der Stern meldet sich selbst** (ADR 0071). Bis 2.4.12 sprang die Chili,
   wenn man einen Fakt oder eine Regel merkte — sie sprang bei *jedem*
   Renderlauf, und Merken ist einer. Die Rückmeldung gehört aber dorthin, wo
   getippt wurde. Nur beim Setzen, nicht beim Wegnehmen: Etwas wegzunehmen
   braucht keine Feier. */
.sternbtn.blinkt { animation: sternBlink .5s ease-out; }
@keyframes sternBlink {
  0%   { transform: scale(1);    filter: none; }
  35%  { transform: scale(1.35); filter: brightness(1.7); }
  100% { transform: scale(1);    filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  .sternbtn.blinkt { animation: none; }
}

.faktenliste { display: flex; flex-direction: column; gap: 10px; }
.faktzeile {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: inset 0 1px 0 var(--lip);
}
.faktzeile.neu { border-style: dashed; opacity: .7; }
.fakttext { flex: 1; font-size: 14px; line-height: 1.5; }
.faktzahl { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
.fact-label { display: block; font-family: Georgia, serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--akzent); margin-bottom: 10px; }
.fact-text { font-size: 17px; line-height: 1.55; margin: 0; text-align: left; }

input[type="text"] {
  width: 100%; margin-top: 16px; padding: 13px; min-height: 48px; font-size: 22px; text-align: center;
  border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input[type="text"]:focus { outline: none; border-color: var(--ice); }
input.ok, textarea.ok { border-color: var(--good); }
input.err, textarea.err { border-color: var(--bad); }

/* Der getippte Satz in «Übersetzen»: größer als ein Formularfeld — er ist die
   Antwort, nicht eine Nebenangabe. Linksbündig wie im Meldeblatt: Ein Satz
   wächst beim Schreiben, und mittig zentriert rutscht er dabei unter dem
   Finger hin und her. */
#trInput {
  margin-top: 16px; font-size: 19px; text-align: left; line-height: 1.5;
  background: var(--bg); border-radius: 12px;
}
#trInput:focus { outline: none; border-color: var(--ice); }

/* Die Prüfzeile tritt nach der Abgabe an die Stelle des Feldes. Sie sieht aus
   wie das Feld — gleiche Größe, gleicher Grund —, damit der Blick nicht
   springt, nur ihr Rand bleibt weg: Hier wird nichts mehr geschrieben. */
.pruefzeile {
  white-space: pre-wrap; word-break: break-word; line-height: 1.5;
}
/* Drei Gestalten, weil das Feld, an dessen Stelle sie tritt, in jeder Übung
   anders aussieht — der Blick soll beim Wechsel nicht springen. */
.pruefzeile.satz {
  margin: 16px 0 0; padding: 12px 14px; border-radius: 12px;
  background: var(--bg); font-size: 19px; text-align: left;
}
.pruefzeile.wort {
  margin: 16px 0 0; padding: 12px; border-radius: 12px; min-height: 48px;
  background: var(--bg); font-size: 22px; text-align: center;
}
.pruefzeile.form {
  margin: 10px 0 0; padding: 10px; border-radius: 10px;
  background: var(--card-2); font-size: 16px; text-align: left;
}
.z-ok { color: var(--good); }
/* Nicht nur Farbe: Wer Rot und Grün nicht unterscheidet, sieht den Strich. */
.z-weg {
  color: var(--bad); text-decoration: underline;
  text-decoration-thickness: 2px; text-underline-offset: 3px;
}
/* Was fehlt, hat kein Zeichen — also steht dort ein schmaler Balken. */
.z-fehlt {
  display: inline-block; width: 3px; height: 0.9em; margin: 0 1px;
  vertical-align: -0.1em; border-radius: 2px; background: var(--bad);
}
.pruef-note { margin: 8px 0 0; font-size: 12px; color: var(--dim); text-align: left; }

.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 13px; min-height: 48px; border-radius: 12px; font-size: 15px;
  cursor: pointer; font-weight: 600; border: 1px solid transparent;
}
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--akzent); color: var(--akzent-ink); }
.btn.ghost { background: none; border-color: var(--line); color: var(--dim); }
.btn.danger { background: none; border-color: var(--bad); color: var(--bad); }

.gearbtn {
  background: none; border: none; color: var(--dim); padding: 0; cursor: pointer;
  min-width: 44px; min-height: 44px; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.gearbtn.active { color: var(--akzent); }

.setting {
  display: flex; align-items: center; gap: 14px; padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.setting-text { flex: 1; }
.setting-title { display: block; font-size: 15px; }
.setting-note { display: block; font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
.switch {
  flex: none; width: 52px; height: 32px; padding: 3px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card-2); position: relative;
}
.switch::before {
  content: ''; position: absolute; inset: -6px; /* Trefferfläche auf 44 px vergrößern */
}
.switch .knob {
  display: block; width: 24px; height: 24px; border-radius: 50%;
  background: var(--dim); transition: transform .15s, background .15s;
}
.switch:disabled { opacity: .35; cursor: default; }
.switch.on { border-color: var(--akzent); background: rgba(210, 162, 78, .18); }
.switch.on .knob { transform: translateX(20px); background: var(--akzent); }
/* Die Reiterleiste klebt oben unter dem Kopf: Sie sagt, wo man ist, und das
   soll sie auch nach dem Scrollen noch tun. Die Knöpfe sind dieselbe Gestalt
   wie Menü- und Auswahlknopf — runder Rand, gedämpfte Fläche, aktiv in Gold. */
.reiter {
  position: sticky; top: 0; z-index: 5;
  display: flex; gap: 6px; margin: 0 0 12px;
  padding: 6px 0 10px; background: var(--bg);
  overflow-x: auto; scrollbar-width: none;
}
.reiter::-webkit-scrollbar { display: none; }
body.unterwegs .reiter { top: 62px; }
/* Seit dem fünften Reiter («App») wird es eng: Bei 430 px stand «Darstellung»
   noch, «App» ragte hinaus. Die Leiste ließ sich zwar schieben, aber ein Reiter,
   den man erst suchen muss, ist keiner. Also enger und eine Spur kleiner —
   scrollen bleibt als Rückfall. */
.reiter-knopf {
  flex: 1 0 auto; min-height: 44px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card-2); color: var(--dim);
  box-shadow: inset 0 1px 0 var(--lip);
  font-size: 12.5px; cursor: pointer; white-space: nowrap;
  transition: color .18s, border-color .18s, background .18s;
}
.reiter-knopf.active { border-color: var(--akzent); color: var(--akzent); background: var(--card); }
.reiter-knopf:active { transform: scale(.96); }

/* Das Fenster über der Bahn. Es schneidet ab, was links und rechts steht —
   sichtbar wird beim Ziehen trotzdem beides, weil die Bahn breiter ist als das
   Fenster und mitwandert. */
.reiter-rahmen { overflow: hidden; margin: 0 calc(-1 * var(--pad-rechts)) 0 calc(-1 * var(--pad-links)); }
.reiter-bahn {
  display: flex; align-items: flex-start;
  will-change: transform;
}
.reiter-blatt {
  flex: 0 0 100%; min-width: 100%;
  padding: 0 var(--pad-rechts) 0 var(--pad-links);
}
/* Die Einstellungen sitzen auf demselben Blatt wie das Menü: gerundete Karte,
   Goldrand, eigene Fläche über dem Grund. */
.blattkarte {
  background: var(--blatt); border: 1px solid var(--akzent); border-radius: 18px;
  padding: 4px 16px 8px; min-height: 34vh;
  box-shadow: inset 0 1px 0 var(--lip), 0 12px 26px var(--shade);
}
.blattkarte .setting:last-child { border-bottom: none; }
.blattkarte .settings-note { margin-bottom: 12px; }
.settings-note { font-size: 12px; color: var(--dim); line-height: 1.5; margin: 16px 0 0; }
/* Die Defizite in der Bilanz: je eine Karte, Zahl rechts, darunter der Grund
   und ein Weg dorthin (ADR 0075). */
/* Das Einrichte-Fenster: drei Kästen, in die man Zeilen zieht (ADR 0075). */
