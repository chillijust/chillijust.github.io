// Erfolgsmeldungen verschwinden von selbst, Fehler bleiben stehen.
var statusTimer = null;

// ── Netz und Speicher ───────────────────────────────────────
// Die App ist offline gedacht — also soll sie auch sagen, woran sie gerade ist.
// Das ist keine Fehlermeldung: Wer im Zug übt, soll sehen, dass alles
// weiterläuft, statt sich zu fragen, ob etwas fehlt.
//
// Die Anzeige ist der Punkt hinter dem Namen (ADR 0061) — grün mit Wort auf
// Home, unterwegs der Punkt allein. Gefragt wird `navigator.onLine`, und das
// ist eine Auskunft des Geräts, keine Messung: Es sagt «hier ist ein Netz»,
// nicht «das Internet ist erreichbar». Nachmessen ginge nur mit einer
// Verbindung, und die baut diese Datei bewusst nie auf. Rot stimmt darum
// immer, grün steht unter Vorbehalt.
function netzWeg() {
  return typeof navigator.onLine === 'boolean' && !navigator.onLine;

// Sekunden da und klappt dann zum Punkt hin ein — der trägt die Auskunft
// danach allein. Aufgeklappt wird nur, wenn es etwas Neues zu sagen gibt: bei
// einem Wechsel des Netzes und bei der Rückkehr auf Home. Ein Renderlauf
// allein ist kein Anlass, sonst stünde das Wort nach jedem Blattwechsel wieder
// da und die Frist liefe nie ab.
// **Die Frist und die Bewegung sind zwei Dinge** (ADR 0071). 2.4.11 hat beide
// verdoppelt und damit das Falsche getroffen: Das Wort stand doppelt so lange,
// verschwand aber immer noch zügig. Gemeint war nur das Zweite. Die Frist steht
// darum wieder bei gut vier Sekunden, und das Zuklappen dauert zwei — halb so
// schnell wie zuvor, und genauso langsam kommt es auch wieder.
var NETZ_FRIST = 4200;
var netzZuletzt = '';
var netzWarDaheim = false;
var netzUhr = null;

function netzAufklappen() {
  var n = document.getElementById('netzStand');
  if (!n) return;
  n.classList.remove('eingeklappt');
  if (netzUhr) clearTimeout(netzUhr);
  netzUhr = setTimeout(function () {
    netzUhr = null;
    var s = document.getElementById('netzStand');
    if (s) s.classList.add('eingeklappt');
  }, NETZ_FRIST);
}

function netzZeigen() {
  var n = document.getElementById('netzStand');
  if (!n) return;
  var weg = netzWeg();
  var wort = weg ? 'Offline' : 'Online';
  var daheim = currentTab === 'home';
  n.classList.toggle('aus', weg);
  // Unterwegs trägt der Kopf den Namen der Übung — dort bleibt der Punkt
  // allein, das Wort daneben wäre eine zweite Angabe in einer knappen Zeile.
  n.classList.toggle('nur-punkt', !daheim);

  var text = document.getElementById('netzWort');

// Safari räumt Website-Daten nach etwa einer Woche ohne Nutzung weg. Eine zum

// nur solange sie so benutzt wird. Der Antrag hier kostet nichts und kann alles
// retten; abgelehnt wird er still, denn erzwingen lässt er sich nicht.
function speicherFesthalten() {
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { /* ohne Zusage lebt die App weiter, nur riskanter */ }

// **Alles hier läuft in try/catch und darf fehlschlagen.** Ohne Worker ist die

// Kein Ablauf setzt ihn voraus — und im Prüfstand, der über `file://` lädt,
// gibt es ihn gar nicht.

// Der Hinweis erscheint einmal je Sitzung. Wer ihn wegtippt, hat entschieden;
// beim nächsten Start steht er wieder da, solange die Fassung wartet.
function swHinweisZeigen() {
  var leiste = document.getElementById('swNeu');
  if (!leiste || swStand.gemeldet) return;
  swStand.gemeldet = true;
  leiste.hidden = false;
}
function swHinweisBinden() {
  var zu = document.getElementById('swSpaeter');
  if (zu) {
    zu.innerHTML = ICON.kreuz;
    zu.addEventListener('click', function () {
      document.getElementById('swNeu').hidden = true;
    });
  }
  var laden = document.getElementById('swLaden');
  if (laden) laden.addEventListener('click', function () {
    // Derselbe Ring wie in den Einstellungen: Beide Knöpfe tun dasselbe, also
    // warten sie auch gleich (ADR 0063). Die Breite wird vorher festgehalten —
    // ein Knopf, der beim Tippen schmaler wird, sähe aus wie ein Fehler.
    if (laden.dataset.laedt) return;
    laden.style.width = laden.offsetWidth + 'px';
    laden.dataset.laedt = '1';
    // Dieselbe Gestalt **und** dieselbe Farbe wie in den Einstellungen
    // (ADR 0072): goldener Knopf, heller Ring darauf.
    laden.classList.add('sw-laedt');
    laden.innerHTML = '<span class="sw-ring" aria-hidden="true"></span>';

// «ja» war die Antwort auf die Überschrift daneben, also stand die Antwort
// zweimal da. Jetzt steht die abgelegte Fassung allein, und dass sie abgelegt
// **ist**, sagt ihre Farbe.

function swAuskunft() {

  if (!swStand.bereit) return 'noch nicht';

// Und was ein Vorleser hört: Die Farbe gibt es dort nicht, also steht der Satz
// aus. Ohne das trüge Grün die Aussage allein.
function swAuskunftGelesen() {
  if (!navigator.serviceWorker) return 'Offline bereit: nicht unterstützt';
  if (!swStand.bereit) return 'Offline bereit: noch nicht';

// Der Notausgang fragt einmal nach. Ein Fehlgriff wäre kein Drama — der
// Lernstand liegt im localStorage —, aber ein Neuladen ohne Netz schon.
var swLeerenSicher = false;

// Er hatte bis 2.4.2 einen Konstruktionsfehler: Er **meldete** nur. Stand nach

var swKnopfLage = 'ruhe';

var swKnopfUhr = null;

function swKnopfMelden(text) {

  swKnopfUhr = setTimeout(function () {
    swKnopfUhr = null;
    swKnopfMeldung = '';
    swKnopfZeichnen();
  }, 2200);
}

function swKnopfZeichnen() {
  var k = document.getElementById('swSuchen');
  if (!k) return;
  var arbeitet = swKnopfLage === 'sucht' || swKnopfLage === 'laedt';
  var bereit = !arbeitet && !!swStand.wartet;

    k.innerHTML = '<span class="sw-ring" aria-hidden="true"></span>';
    k.setAttribute('aria-label', 'Lädt die neue Fassung');

function swKnopfTippen() {
  if (swKnopfLage !== 'ruhe') return;   // während er arbeitet, tut er nichts

  if (swStand.wartet) {
    swKnopfLage = 'laedt';
    swKnopfZeichnen();
    swUebernehmen();
    return;

  if (swKnopfUhr) { clearTimeout(swKnopfUhr); swKnopfUhr = null; }
  swKnopfLage = 'sucht';
  swKnopfZeichnen();

      swBereitZeichnen();

      // Meldung daneben.
      if (!swStand.wartet) {

// darum der alte Stand, bis man den Knopf noch einmal drückte.

// Welche Fassung liegt gespeichert? Der Worker weiß es, die Seite nicht: Sie

function swVersionHolen(fertig) {

      if (fertig) fertig();

// Nachsehen, ob es etwas Neues gibt — der Knopf in den Einstellungen.

function swNachsehen(fertig) {

      reg.update().then(function () {
        swWartendPruefen(reg);
        if (swStand.wartet) { ende('ok'); return; }
        // **`update()` ist fertig, bevor die neue Fassung wartet.** Es meldet
        // das Ende der Anfrage, nicht das Ende der Einrichtung — der neue
        // Worker steckt danach oft noch in `installing`. Wer hier sofort
        // urteilt, sagt «Aktuell» und sieht die neue Fassung eine Sekunde
        // später von selbst auftauchen. Also auf ihn warten, wenn es ihn gibt.
        var neu = reg.installing;
        if (!neu) { ende('ok'); return; }
        neu.addEventListener('statechange', function () {
          if (neu.state === 'installing') return;
          swWartendPruefen(reg);
          ende('ok');
        });
        // Und nicht ewig: Ein Worker, der nicht fertig wird, darf den Knopf
        // nicht für immer drehen lassen.
        setTimeout(function () { swWartendPruefen(reg); ende('ok'); }, 8000);
      }).catch(function () { ende('kein netz'); });
    }).catch(function () { ende('kein netz'); });
  } catch (e) { ende('unmoeglich'); }
}

// Übernehmen: den wartenden Worker vorlassen und danach einmal neu laden.
//
// **Das Neuladen ist unvermeidlich** (ADR 0068). Eine neue Fassung ist neuer
// Programmtext; solange die alte Seite läuft, läuft die alte Fassung. Was sich
// vermeiden lässt, ist der *Eindruck*, dass dabei etwas verlorengeht: Der
// Nutzer soll sehen, dass geladen wird, und danach dort stehen, wo er war.
//
// Zwei Dinge also. Erstens die Frist: Der Tausch dauert oft nur Millisekunden,
// und ein Ring, der aufblitzt und weg ist, sieht aus wie ein Fehlgriff. Der
// Neustart wartet darum, bis `SW_LADEN_MIN` um ist.
var SW_LADEN_MIN = 2000;
// Zweitens der Ort. Er überlebt den Neustart in einem eigenen Schlüssel — kurz
// gültig, denn er meint **diesen** Neustart und keinen späteren.
var SW_ORT_KEY = 'chillingo_nach_update';
var SW_ORT_FRIST = 60000;

function swOrtMerken() {
  try {
    localStorage.setItem(SW_ORT_KEY, JSON.stringify({
      tab: currentTab, reiter: einstReiter, zeit: Date.now()
    }));
  } catch (e) { /* ohne Merker landet man auf Home — kein Beinbruch */ }
}
// Nach dem Neustart: dorthin zurück, wo getippt wurde. Der Schlüssel wird
// **immer** weggeräumt, auch wenn er nicht mehr gilt — sonst führte er beim
// übernächsten Start noch einmal irgendwohin.
function swOrtHolen() {
  var roh = null;
  try {
    roh = localStorage.getItem(SW_ORT_KEY);
    localStorage.removeItem(SW_ORT_KEY);
  } catch (e) { return null; }
  if (!roh) return null;
  try {
    var o = JSON.parse(roh);
    if (!o || Date.now() - o.zeit > SW_ORT_FRIST) return null;
    if (!UEBUNG_NAME[o.tab] && !ANSICHT_NAME[o.tab]) return null;
    return o;
  } catch (e) { return null; }
}

function swUebernehmen() {
  swStand.ladenSeit = Date.now();
  swOrtMerken();
  try {
    if (!swStand.wartet) { swNeustart(); return; }
    swStand.neuladen = true;
    swStand.wartet.postMessage({ art: 'uebernehmen' });
  } catch (e) { swNeustart(); }
}

// Neu laden — aber nicht, bevor man den Ring gesehen hat.
function swNeustart() {
  var offen = Date.now() - (swStand.ladenSeit || 0);
  var rest = Math.max(0, SW_LADEN_MIN - offen);
  setTimeout(function () { window.location.reload(); }, rest);
}

// **Der Notausgang.** Ein Worker, der sich verschluckt, ist auf einem Telefon
// kaum loszuwerden — es gibt keine Entwicklerwerkzeuge und keinen harten
// Neuladen-Knopf. Also gehört der Ausgang in die App: abmelden, Speicher
// leeren, neu laden. Der Lernstand liegt im localStorage und bleibt unberührt.
function swAufraeumen(fertig) {
  var schritte = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      schritte.push(navigator.serviceWorker.getRegistrations().then(function (alle) {
        return Promise.all(alle.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      schritte.push(caches.keys().then(function (namen) {
        return Promise.all(namen.map(function (n) { return caches.delete(n); }));
      }));
    }
  } catch (e) { /* was nicht geht, geht nicht */ }
  Promise.all(schritte).catch(function () { return null; }).then(function () {
    if (fertig) fertig();
  });
}

// Wie viele Tage seit der letzten Sicherung? -1 heißt: noch nie gesichert.
function sicherungAlter() {
  if (!state.gesichertAm) return -1;
  return Math.floor((Date.now() - state.gesichertAm) / TAG);
}
// Erinnert wird erst, wenn es etwas zu verlieren gibt — wer zehn Antworten
// gegeben hat, braucht noch keinen Sicherungscode.
var SICHERUNG_FRIST = 30;
function sicherungFaellig() {
  if (state.answered < 60) return false;
  var alter = sicherungAlter();
  return alter === -1 || alter >= SICHERUNG_FRIST;
}

// Die Farbschemata. Eine Liste, keine zwei Achsen: «Dark» ist eines davon, und
// die drei Farben sind Cremetöne — die gibt es nur hell (ADR 0039). Die
// Flächenwerte stehen im Stylesheet; hier steht je Schema nur der Grund, weil
// die Statusleiste ihn als Zahl braucht und keine Medienabfrage kennt.
var SCHEMATA = [
  { wert: 'dark', text: 'Dark', grund: '#1A1A18' },
  { wert: 'classic', text: 'Classic', grund: '#DDCFAC' },
  { wert: 'gruen', text: 'Grün', grund: '#A6E3C6' },
  { wert: 'blau', text: 'Blau', grund: '#A7C9E2' },
  { wert: 'rosa', text: 'Rosa', grund: '#E2A7D0' }
];

function schemaVon(wert) {
  for (var i = 0; i < SCHEMATA.length; i++) {
    if (SCHEMATA[i].wert === wert) return SCHEMATA[i];
  }
  return SCHEMATA[0];
}

// Bis ADR 0039 standen Darstellung (system/dunkel/hell) und Farbton
// (nacht/grün/blau/rosa) als zwei Achsen nebeneinander. Ein Gerät oder ein
// Sicherungscode von damals wird hierüber übersetzt: Der Farbton wiegt
// schwerer, weil ihn jemand ausdrücklich gewählt hat; ohne Farbton entscheidet
// hell gegen dunkel.
var FARBTOENE_ALT = ['nacht', 'gruen', 'blau', 'rosa'];
var DARSTELLUNG_ALT = ['system', 'dunkel', 'hell'];
function schemaAusAchsen(darstellung, farbe) {
  if (['gruen', 'blau', 'rosa'].indexOf(farbe) !== -1) return farbe;
  return darstellung === 'hell' ? 'classic' : 'dark';
}

// Ein Schema, ein Attribut. «Dark» ist die Vorgabe und trägt keines — es steht
// im `:root` selbst, wie zuvor die dunkle Palette.
function updateDarstellung() {
  var schema = schemaVon(state.settings.schema);
  var wurzel = document.documentElement;
  if (schema.wert === 'dark') wurzel.removeAttribute('data-schema');
  else wurzel.setAttribute('data-schema', schema.wert);
  // Safari färbt die Statusleiste nach diesem Wert.
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', schema.grund);
}


function woerterGemeistert() {
  var n = 0;
  ALL_VOCAB.forEach(function (v) { if ((state.boxes[v.id] || 0) >= BOX_MAX) n++; });
  return n;
}

// Kopfzeile: Anteil gemeisterter Wörter und laufende Serie.
function updateKopf() {
  var gemeistert = woerterGemeistert();
  var anteil = ALL_VOCAB.length ? gemeistert / ALL_VOCAB.length * 100 : 0;
  document.getElementById('kopfFill').style.width = anteil + '%';
  var text = prozentText(anteil, gemeistert, ALL_VOCAB.length) + ' gemeistert';
  // **«Serie 3» sagt nicht, was es zählt** (ADR 0074). Die Zahl allein ist
  // eine Behauptung ohne Gegenstand; erst «richtig in Folge» macht sie zu
  // einer Auskunft. Weggelassen wird sie nicht — sie ist das Einzige an
  // dieser Zeile, das sich von Antwort zu Antwort bewegt.
  if (state.streak >= 3) {
    text += ' · <span class="kopf-serie">' + state.streak + ' richtig in Folge</span>';
  }
  document.getElementById('kopfLabel').innerHTML = text;
}
// **Ein Anteil darf nicht runden, bis er lügt** (ADR 0074). Bei 395 Wörtern
// ist eines 0,25 % — «0 % gemeistert» wäre für den, der gerade eines
// geschafft hat, entmutigend und falsch. Und 100 % gehört dem, der wirklich
// alle hat, nicht dem bei 394 von 395.
function prozentText(anteil, teil, ganzes) {
  if (!ganzes) return '0 %';
  if (teil >= ganzes) return '100 %';
  if (teil > 0 && anteil < 1) return 'unter 1 %';
  var p = Math.round(anteil);
  if (p >= 100) p = 99;
  return p + ' %';
}
// Wurde mit dieser Antwort die Endstufe **erreicht**? Nur der Übergang zählt:
// Wer ein schon gemeistertes Wort auffrischt, hat es nicht noch einmal
// gemeistert — eine Meldung dafür wäre schnell nichts mehr wert (ADR 0026).
var meisterMeldung = null;   // { was: 'Wort'|'Satz'|'Buchstabe', text, hinweis }

function meisterPruefen(vorher, nachher, was, text, hinweis, kyrillisch) {
  if (vorher >= BOX_MAX || nachher < BOX_MAX) return false;
  meisterMeldung = {
    was: was, text: text, hinweis: hinweis || '', kyrillisch: kyrillisch !== false
  };
  return true;
}

// Die Meldung selbst: eine Zeile unter der Auflösung. Ein eigener Bildschirm
// wäre im Weg — gemeistert wird oft, und jedes Mal wegtippen zu müssen macht
// aus der Belohnung eine Hürde. Für ein ganzes Lernset gibt es weiter die
// Jubelkarte; die ist der seltenere, größere Anlass.
function meisterHtml() {
  var m = meisterMeldung;
  if (!m) return '';
  return '<div class="meister">' + ICON.sternVoll +
    '<span><strong>' + esc(m.was) + ' gemeistert</strong>' +
    '<span class="meister-wort' + (m.kyrillisch ? ' cyr' : '') + '">' + esc(m.text) + '</span>' +
    (m.hinweis ? '<span class="meister-note">' + esc(m.hinweis) + '</span>' : '') +
    '</span></div>';
}

// ── Fakten überall ──────────────────────────────────────────
// Ein Sprachfakt gehört zu jeder Übung, nicht nur zu den Lernsets. Dort hat er
// einen eigenen Schritt, weil die Runde kurz ist und der Fakt die Pause
// **ist**; überall sonst steht er als Streifen unter der Auflösung. Ein eigener
// Bildschirm wäre dort im Weg — man ist mitten in einer Aufgabe.
// «Buchstaben» und «Grammatik» bleiben draußen: Sie zählen nicht in
// `state.answered`, und ein Fakt zwischen zwei Regeln wäre ein zweiter Gedanke
// zu viel.
// ── Kommentare ──────────────────────────────────────────────
// Nach jeder Auflösung sagt die Chili einen Satz (ADR 0049). Sie steht in der
// Zeile, in der früher der Faktstreifen stand — und sie nimmt die Sprüche auf,
// die vorher verstreut in den Übungen hingen («Ein einziger Buchstabe. Aber wer
// schreibt, der bleibt.»).
//
// Die Töpfe stehen in `data/kommentare.json`, das Mischungsverhältnis ist
// damit eine Eigenschaft der Inhalte und keine Zahl im Code: Wer mehr Trockenes
// will, schreibt mehr Trockenes.
var KOMMENTAR_TOPF = (function () {
  var t = {};
  KOMMENTARE.forEach(function (k) { (t[k[0]] = t[k[0]] || []).push(k[1]); });
  return t;
})();

var kommentar = '';          // was gerade in der Zeile steht
var kommentarZuletzt = [];   // die letzten Sätze, damit sich nichts sofort wiederholt

// Welcher Topf passt? Eine Besonderheit sticht, aber nicht jedes Mal — sonst
// hörte man bei jedem ё denselben Satz und wüsste nach drei Wörtern, was kommt.
function kommentarTopf(e) {
  if (e.aufgedeckt) return 'auf';
  // Ein fester Satz darf keine Zahl behaupten, die er nicht kennt: «Zwei
  // Zeichen» unter einer Prüfzeile, die «1 Zeichen steht falsch» sagt, ist ein
  // Widerspruch. Darum hat der eine Buchstabe seinen eigenen Topf.
  if (!e.ok) {
    if (e.daneben === 1) return 'eins';
    return (e.daneben > 0 && e.daneben <= 3) ? 'knapp' : 'daneben';
  }
  var wuerfel = Math.random();
  if (e.serie >= 5 && wuerfel < 0.45) return 'serie';
  if (e.jo && wuerfel < 0.6) return 'jo';
  if (e.weich && wuerfel < 0.5) return 'weich';
  if (e.lang && wuerfel < 0.45) return 'lang';
  // Trocken ist Würze, nicht Grundton: etwa jeder dritte Treffer.
  return wuerfel < 0.33 ? 'trocken' : 'richtig';
}

// Ein Satz aus dem Topf, der zuletzt nicht dran war. Der Vorrat ist groß genug,
// dass ein Blick zurück über sechs Sätze niemanden in die Enge treibt.
function kommentarWaehlen(topf, werte) {
  var liste = KOMMENTAR_TOPF[topf] || [];
  if (!liste.length) return '';
  var frisch = liste.filter(function (t) { return kommentarZuletzt.indexOf(t) === -1; });
  if (!frisch.length) frisch = liste;
  var text = frisch[Math.floor(Math.random() * frisch.length)];
  kommentarZuletzt.push(text);
  if (kommentarZuletzt.length > 6) kommentarZuletzt.shift();
  return jubelFuellen(text, werte || {});
}

// `erg` beschreibt die Antwort: ok, daneben (Zeichen), aufgedeckt, loesung,
// eingabe. Alles Weitere leitet sich daraus ab.
function kommentarSetzen(erg) {
  kommentar = '';
  if (!state.settings.kommentare) return;
  var loesung = erg.loesung || '';
  var eingabe = erg.eingabe || '';
  var zeichen = loesung.replace(/[^\wа-яёА-ЯЁ]/gi, '').length;
  var e = {
    ok: !!erg.ok,
    aufgedeckt: !!erg.aufgedeckt,
    daneben: erg.daneben || 0,
    serie: state.streak,
    // Besonderheiten zählen nur, wenn der Nutzer sie selbst geschrieben hat —
    // eine gelegte Kachel ist keine Behauptung über die Schreibweise.
    jo: !!erg.getippt && loesung.indexOf('ё') !== -1 && eingabe.indexOf('ё') !== -1,
    weich: !!erg.getippt && /[ьъ]/.test(loesung) && /[ьъ]/.test(eingabe),
    lang: zeichen >= 9
  };
  kommentar = kommentarWaehlen(kommentarTopf(e),
    { n: zeichen, f: e.daneben, s: state.streak });
}

// **Die Chili sagt es selbst** (ADR 0060). Bis 2.4.0 stand der Kommentar als
// Zeile unter der Auflösung; jetzt hängt er als Sprechblase an der Figur im
// Kopf. Zwei Dinge muss die Blase können, die eine Zeile nicht musste:
//
//   · **Verschwinden, sobald die Figur den Kopf verlässt** — im Menü, im
//     Filter, im Wissensblatt, im Jubel, im Tutorial und auf der Faktkarte
//     steht sie woanders, und eine Blase an einem leeren Platz wäre ein
//     Zipfel ins Nichts.
//   · **Ihren Zipfel messen.** Die Figur ist das erste Stück der rechten
//     Gruppe, aber nicht immer gleich weit vom Rand: In «Buchstaben» steht
//     der Tafelknopf neben ihr, in «Übersetzen» der Wissensknopf.
//
// Aufgerufen wird sie aus `chiliAktualisieren()` — dort und nur dort ist
// bekannt, wo die Figur gerade steht.
function blaseAktualisieren(platz) {
  var blase = document.getElementById('chiliBlase');
  if (!blase) return;
  var daheim = document.getElementById('chiliPlatz');
  if (!kommentar || platz !== daheim) { blase.hidden = true; return; }
  var rechts = daheim.parentNode;
  if (rechts && rechts.offsetWidth) {
    var mitte = daheim.offsetLeft + daheim.offsetWidth / 2;
    var zipfel = Math.max(20, Math.round(rechts.offsetWidth - mitte - 8));
    blase.style.setProperty('--zipfel', zipfel + 'px');
  }
  // Erst der Text, dann sichtbar: Das Umschalten von `display: none` startet
  // die Animation neu, und die soll den fertigen Satz zeigen.
  document.getElementById('chiliBlaseText').textContent = kommentar;
  blase.hidden = false;
}

// Wie viele Zeichen standen daneben? Dieselbe Rechnung wie in der Prüfzeile —
// was `normalize()` übersieht, übersieht auch der Kommentar (ADR 0037).
function danebenZeichen(eingabe, loesung) {
  var n = 0;
  zeichenMarken(eingabe || '', loesung || '').forEach(function (mk) {
    if (mk.art === 'fehlt' || mk.art === 'weg') n++;
  });
  return n;
}

// Ein Fakt bekommt **überall denselben Auftritt** (ADR 0049): Sprechblase,
// Chili darunter, ein Stern zum Merken, zwei Wege hinaus. Vorher stand er in
// «Lernsets» als eigener Bildschirm und in den drei anderen Übungen als
// Streifen unter der Auflösung — zwei Gestalten für dieselbe Sache, und der
// Streifen belegte die Zeile, die jetzt den Kommentar trägt.
var faktKarte = '';   // Text des Fakts, solange er die Ansicht belegt

// Ist ein Fakt fällig? Jede fünfte beantwortete Aufgabe. Gefragt wird beim
// **Weitergehen**, nicht in der Auflösung — mitten in einer Antwort wäre er im
// Weg. «Buchstaben» und «Grammatik» bleiben draußen: Sie zählen nicht in
// `state.answered`.
function faktFaellig() {
  if (state.answered <= 0 || state.answered % 5 !== 0) return false;
  faktKarte = naechsterFakt();
  if (!faktKarte) return false;
  faktGezeigt(faktKarte);
  state.factIdx++;
  save();
  return true;
}

function faktKarteHtml() {
  var st = faktStand(faktKarte);
  // «Ohne Leiste» steht am Inhalt, nicht in einer Abfrage nebenan: Die Karte
  // weiß selbst, dass hier nichts zu erklären ist (ADR 0084).
  return '<section data-ohne-leiste>' +
    '<div class="sprechblase">' +
    '<span class="fact-label">Wusstest du?</span>' +
    '<p class="fact-text">' + esc(faktKarte) + '</p></div>' +
    '<div class="fakt-fuss">' + maskottchen('klein') +
    '<button class="sternbtn' + (st.f ? ' an' : '') + '" id="factFav" ' +
    'aria-pressed="' + (st.f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
    (st.f ? ICON.sternVoll : ICON.stern) + '</button></div>' +
    '<div class="btn-row"><button class="btn ghost" id="factAlle">Alle Fakten</button>' +
    '<button class="btn primary" id="factNext">Weiter üben</button></div>' +
    '</section>';
}

// `weiter` räumt die Karte weg und setzt die Übung fort, `neu` zeichnet die
// Karte selbst noch einmal (der Stern soll sofort umschlagen).
function faktKarteBinden(weiter) {
  document.getElementById('factNext').addEventListener('click', function () {
    faktKarte = '';
    weiter();
  });
  document.getElementById('factAlle').addEventListener('click', function () {
    faktKarte = '';
    setTab('fakten');
  });
  document.getElementById('factFav').addEventListener('click', function () {
    var an = faktFavorit(faktKarte);
    // **Kein `neu()`**: Der Stern ist das Einzige, was sich ändert (ADR 0077).
    sternSetzen(document.getElementById('factFav'), an);
    if (an) sternBlinken('#factFav');
  });
}

// ── Tutorial ────────────────────────────────────────────────
// Ein Scheinwerfer über der Oberfläche: Alles ist dunkel, nur das erklärte
// Feld bleibt hell. Das Loch ist ein durchsichtiges Rechteck, dessen riesiger
// Schatten den Rest deckt — ein Element statt einer Maske (ADR 0051).
//
// Schritt -1 ist die Frage «Tutorial abspielen?». Sie gehört zum selben
// Overlay: ein Mechanismus statt zweier, und der Weg hinein ist derselbe wie
// der Weg weiter.
var tutSchritt = -1;      // -1 = die Frage · 0..n = die Schritte
var tutOffen = false;
var tutHeimTab = 'home';  // wohin nach dem Ende zurück
var tutLochStand = false; // lag zuletzt ein Ziel unter dem Loch?
// **Welche Spur läuft** (ADR 0079). «home» erklärt den Weg durch die App, die
// anderen je eine Übung. Ein Mechanismus für alle: derselbe Scheinwerfer,
// dieselbe Frage davor, dieselbe Fußzeile.
var tutSpur = 'home';
function tutSchritte() { return TUTORIALS[tutSpur] || TUTORIALS.home; }

// Was vor dem ersten Schritt gefragt wird. Je Spur ein eigener Satz — «wie
// diese App funktioniert» wäre in «Tippen» eine Lüge über den Umfang.
var TUT_FRAGE = {
  home: 'Ich zeige dir in einer Minute, wie diese App funktioniert — wo du anfängst, ' +
    'was die Übungen voneinander wollen und wo was zu finden ist.',
  lernsets: 'Soll ich dir kurz zeigen, wie Lernsets funktionieren? Fünf Schritte, ' +
    'dann weißt du, was die Punkte bedeuten und woher die Wörter kommen.',
  tippen: 'Soll ich dir kurz zeigen, wie «Tippen» funktioniert? Fünf Schritte, ' +
    'dann weißt du, wozu die eingebaute Tastatur da ist und was die Farben sagen.',
  uebersetzen: 'Soll ich dir kurz zeigen, wie «Übersetzen» funktioniert? Fünf ' +
    'Schritte, dann weißt du, warum ein Satz erst spät aufgeht und was sich mit der Stufe ändert.'
};

// «ruhig» heißt: ohne Flug der Chili. Beim allerersten Start liegt das Tutorial
// schon über dem ersten Bild — sie flöge dann im Augenblick des Ladens quer
// über den Schirm, und das sähe nach Fehler aus, nicht nach Auftritt.
function tutStarten(spur, ruhig) {
  tutSpur = TUTORIALS[spur] ? spur : 'home';
  tutHeimTab = tutSpur === 'home' ? 'home' : tutSpur;
  tutSchritt = -1;
  tutOffen = true;
  tutLochStand = false;
  document.body.classList.add('tut-offen');
  // Gefragt ist gefragt: Das automatische Angebot beim allerersten Start kommt
  // nicht wieder. Über den **Platz** des Knopfes sagt das nichts — dafür ist
  // «fertig» zuständig, und das fällt erst am Ende.
  if (tutSpur === 'home') state.tutorialGesehen = true;
  else state.tutUebung[tutSpur] = 1;
  save();
  tutZeichnen();
  chiliAktualisieren(ruhig);
}

// **Der Scheinwerfer braucht eine Bühne** (ADR 0079). Angeboten wird die Spur
// einer Übung beim ersten Betreten — aber nur, wenn dort auch etwas steht:
// Wer «Tippen» öffnet, bevor ein Wort freigeschaltet ist, sieht einen
// Leerzustand, und ein Scheinwerfer auf nichts erklärt nichts. Dann wartet das
// Angebot bis zum nächsten Mal.
function tutUebungAnbieten(id) {
  // **Die Heimspur nicht.** Sie hat ihre eigenen zwei Merker (ADR 0051), und
  // `tutUebung` führt sie nicht — ohne diese Zeile fragte die Übersicht bei
  // *jedem* Betreten, weil nie etwas gesetzt wurde, das sie zum Schweigen
  // gebracht hätte.
  if (id === 'home' || tutOffen || !TUTORIALS[id]) return;
  if (state.tutUebung[id]) return;
  // Das große Tutorial zuerst: Zwei Angebote übereinander sind eines zu viel.
  if (!state.tutorialGesehen) return;
  var erstes = TUTORIALS[id][0][1];
  var el = erstes ? document.querySelector(erstes) : null;
  if (!el || !el.getClientRects().length) return;
  tutStarten(id);
}

function tutEnde() {
  tutOffen = false;
  document.body.classList.remove('tut-offen');
  // Die Blase bleibt noch stehen: Die Figur zieht **aus ihr heraus** zurück in
  // die Ansicht, und ihre alte Lage lässt sich nur messen, solange sie da ist.
  // Ein Klick ist eine Bewegung — der Ansichtswechsel und der Umzug sind einer.
  // Neu gezeichnet wird in jedem Fall: Der Knopf hat seinen Platz gewechselt,
  // und eine Übersicht, die ihn noch oben zeigt, ist eine Lüge über den Stand.
  chiliZusammen(function () {
    if (currentTab !== tutHeimTab) setTab(tutHeimTab);
    else render();
  });
  document.getElementById('tutHof').hidden = true;
  document.getElementById('tutGespann').setAttribute('aria-hidden', 'true');
}

function tutWeiter() {
  tutSchritt++;
  if (tutSchritt >= tutSchritte().length) {
    // **Erst hier.** Wer abbricht — an der Frage oder mitten drin —, hat das
    // Tutorial nicht gesehen; sein Knopf bleibt oben stehen und bietet es
    // weiter an. Ein Angebot, das schon eine Absage beendet, wäre keins.
    if (tutSpur === 'home') state.tutorialFertig = true;
    save();
    tutEnde();
    return;
  }
  tutZeichnen();
}

// Der Ort eines Schritts. Führt er woandershin, wird dort hingewechselt —
// das Overlay liegt fest über allem und übersteht den Renderlauf.
function tutOrtSetzen(ort) {
  if (!ort || currentTab === ort) return;
  setTab(ort);
}

// Das Loch über das Ziel legen. Ohne Ziel bleibt es außerhalb des Bildes:
// Der Schatten deckt dann alles, und nichts leuchtet grundlos.
function tutLochSetzen(ziel) {
  var hof = document.getElementById('tutHof');
  var loch = document.getElementById('tutLoch');
  var el = ziel ? document.querySelector(ziel) : null;
  // Kam das Loch gerade von nirgendwo, wird gesprungen statt geglitten.
  loch.classList.toggle('springt', !tutLochStand || !el);
  tutLochStand = !!el;
  if (!el) {
    hof.classList.add('ohne-ziel');
    loch.style.top = '-9999px';
    loch.style.left = '-9999px';
    loch.style.width = '0px';
    loch.style.height = '0px';
    return null;
  }
  hof.classList.remove('ohne-ziel');
  var r = el.getBoundingClientRect();
  // **Keine Luft.** Das Loch liegt auf dem Ziel, nicht darum herum: Jeder
  // Streifen unverdunkelten Grundes daneben ist ein leuchtender Rahmen, und
  // der zieht den Blick stärker an als das Angeleuchtete selbst (ADR 0067).
  //
  // Der Radius kommt vom Ziel, nicht aus dem Stil des Lochs — eine Kachel hat
  // 18 px, ein runder Knopf die Hälfte seiner Breite. Ein fester Wert schnitte
  // an einem von beiden die Ecken auf.
  loch.style.top = r.top + 'px';
  loch.style.left = r.left + 'px';
  loch.style.width = r.width + 'px';
  loch.style.height = r.height + 'px';
  loch.style.borderRadius = getComputedStyle(el).borderRadius || '0';
  // Zurück kommt das **Loch**, nicht das Ziel: Danach richtet sich das Gespann
  // aus, und es soll die angeleuchtete Fläche freihalten — nicht bloß das
  // Element darin. Sonst schneidet es genau um die Luft hinein.
  return {
    top: r.top, left: r.left,
    width: r.width, height: r.height,
    bottom: r.bottom, right: r.right
  };
}

// Das Gespann neben den Scheinwerfer stellen — und zwar so, dass die **Chili**
// daneben zu stehen kommt, nicht die Blase: Liegt das Ziel unten, steht sie
// darüber und die Blase über ihr; liegt es oben, ist es umgekehrt. Ohne Ziel
// steht das Gespann mittig und die Figur schweigt nicht, sondern erzählt bloß
// ohne hinzuzeigen.
//
// Der Behälter wird hier **einmal je Schritt** gesetzt, nicht je Bild
// nachgerechnet — die Figur steht darin im Fluss (ADR 0012). Während des
// Tutorials liegt die Seite fest (`body.tut-offen`).
function tutGespannSetzen(r) {
  var g = document.getElementById('tutGespann');
  g.setAttribute('aria-hidden', 'false');
  var schirm = window.innerHeight;
  var rand = 16;
  var spalt = 12;
  if (!r) {
    // Die Eingangsfrage leuchtet nichts an: Gespann in die Mitte, die Figur an
    // ihren gewohnten Platz links unter der Blase.
    g.classList.remove('chili-oben');
    var m = g.getBoundingClientRect();
    document.getElementById('tutChili').style.marginLeft = '16px';
    document.getElementById('tutZipfel').style.left = '46px';
    g.style.top = Math.max(rand, (schirm - m.height) / 2) + 'px';
    return;
  }
  // **Die großzügigere Seite gewinnt**, nicht die Bildschirmhälfte. Ein Ziel
  // knapp über der Mitte hat oben womöglich weniger Platz als darunter — und
  // ein Gespann, das nicht passt, legt sich auf das, wovon es spricht.
  var platzOben = r.top - spalt - rand;
  var platzUnten = schirm - r.bottom - spalt - rand;
  var darunter = platzUnten >= platzOben;
  // Erst die Richtung, dann messen: Die Höhe hängt nicht davon ab, die
  // Reihenfolge der Kinder schon — und der Zipfel sitzt danach anders.
  g.classList.toggle('chili-oben', darunter);
  var masse = g.getBoundingClientRect();
  var hoehe = masse.height || 220;
  g.style.top = (darunter
    ? Math.min(schirm - hoehe - rand, r.bottom + spalt)
    : Math.max(rand, r.top - hoehe - spalt)) + 'px';
  tutChiliRuecken(r, masse);
}

// Waagerecht rückt die Figur unter die Mitte des Angeleuchteten — sonst stünde
// sie links, während rechts oben der Trichter leuchtet, und niemand brächte
// beides zusammen. Der Zipfel geht mit ihr, bleibt aber von den runden Ecken
// der Blase weg.
function tutChiliRuecken(r, masse) {
  var chili = document.getElementById('tutChili');
  var zipfel = document.getElementById('tutZipfel');
  var breite = 76;
  var mitte = r.left + r.width / 2 - masse.left;
  var links = Math.max(0, Math.min(masse.width - breite, mitte - breite / 2));
  chili.style.marginLeft = links + 'px';
  var ecke = 26;
  zipfel.style.left =
    Math.max(ecke, Math.min(masse.width - ecke, links + breite / 2)) - 7.5 + 'px';
}

function tutZeichnen() {
  var hof = document.getElementById('tutHof');
  hof.hidden = false;

  if (tutSchritt < 0) {
    tutLochSetzen('');
    document.getElementById('tutText').textContent =
      TUT_FRAGE[tutSpur] || TUT_FRAGE.home;
    tutKnoepfe([['Abbrechen', 'ghost', tutEnde], ['Loslegen', 'primary', tutWeiter]]);
    tutFussSetzen(false);
    tutGespannSetzen(null);
    return;
  }

  var sch = tutSchritte()[tutSchritt];
  // Wo stand die Figur, bevor sich etwas rührt? In **Bildkoordinaten**: Der
  // Behälter liegt fest, und zwischen zwei Schritten wird gescrollt — in
  // Dokumentkoordinaten flöge sie um die Scrollstrecke daneben.
  var vorher = tutChiliLage();
  tutOrtSetzen(sch[0]);
  document.getElementById('tutText').textContent = sch[2];
  tutKnoepfe(null);
  tutFussSetzen(true);

  // **Ein zugeklapptes Ziel klappt sich auf** (ADR 0065). Acht der dreizehn
  // Schritte zeigen auf je eine Kachel, und die meisten liegen seit 2.4.7
  // hinter «Alle Übungen». Der Scheinwerfer öffnet den Bereich, statt ins Leere
  // zu zeigen — nebenbei sieht man dabei, dass es dort etwas aufzuklappen gibt.
  // Gefragt ist, ob das Ziel **zu sehen** ist, nicht ob es im Baum steht: Ein
  // zugeklapptes `[hidden]` findet `querySelector` sehr wohl — der Scheinwerfer
  // leuchtete dann auf ein Rechteck der Breite null.
  if (!homeOffen && currentTab === 'home') {
    var ziel = document.querySelector(sch[1]);
    if (!ziel || !ziel.getClientRects().length) {
      homeOffen = true;
      renderHome();
    }
  }
  // Erst ins Bild holen, dann messen: Ein Ziel, das unter dem Rand liegt,
  // bekäme sonst ein Loch, das niemand sieht.
  var el = document.querySelector(sch[1]);
  if (el && el.scrollIntoView) {
    try { el.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (e) {
      el.scrollIntoView();
    }
  }
  tutGespannSetzen(tutLochSetzen(sch[1]));
  // Zuletzt die Bewegung: Erst rechnen, dann springen — sonst flöge sie zu
  // einem Platz, den die Blase noch gar nicht eingenommen hat.
  tutSprung(vorher);
  tutKlappen();
}

// Die Lage der Figur im **Bild**, nicht im Dokument. Für alles außerhalb des
// Tutorials gilt weiter chiliLage(): Dort steht sie im Fluss der Seite und
// scrollt mit, hier liegt sie in einem festen Behälter über allem.
function tutChiliLage() {
  var el = document.getElementById('tutChili');
  if (!el) return null;
  var r = el.getBoundingClientRect();
  if (!r.width) return null;
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, b: r.width };
}

// Der Sprung von Schritt zu Schritt. Ihr Platzhalter bleibt derselbe — es
// bewegt sich der Behälter darum herum —, also gibt es keinen Umzug, den
// chiliAktualisieren() bemerken könnte. Der Bogen wird darum hier ausgelöst.
function tutSprung(vorher) {
  chiliFlug(vorher, tutChiliLage());
  chiliHuepfen();
}

// Der Auftritt der Blase. Die Klasse muss weg und neu gesetzt werden, sonst
// startet die Animation beim zweiten Schritt nicht wieder.
function tutKlappen() {
  var blase = document.getElementById('tutSprech');
  blase.classList.remove('klappt');
  void blase.offsetWidth;
  blase.classList.add('klappt');
}

// Der Fuß der Blase: die Punktreihe und der Pfeil. Er löst die zwei
// beschrifteten Knöpfe ab, sobald es losgeht — ab hier gibt es nur noch
// «weiter», und der Ausgang sitzt oben rechts am Rand.
function tutFussSetzen(an) {
  var fuss = document.getElementById('tutFuss');
  var zu = document.getElementById('tutZu');
  fuss.hidden = !an;
  zu.hidden = !an;
  if (!an) return;
  var punkte = '';
  for (var i = 0; i < tutSchritte().length; i++) {
    punkte += '<i class="' + (i === tutSchritt ? 'hier' : (i < tutSchritt ? 'war' : '')) + '"></i>';
  }
  document.getElementById('tutPunkte').innerHTML = punkte;
  document.getElementById('tutZaehler').textContent =
    'Schritt ' + (tutSchritt + 1) + ' von ' + tutSchritte().length;
  var vor = document.getElementById('tutVor');
  var letzter = tutSchritt === tutSchritte().length - 1;
  vor.innerHTML = letzter ? ICON.haken : ICON.pfeilRechts;
  vor.setAttribute('aria-label', letzter ? 'Fertig' : 'Weiter');
}

function tutKnoepfe(liste) {
  var wo = document.getElementById('tutKnoepfe');
  wo.hidden = !liste;
  if (!liste) { wo.innerHTML = ''; return; }
  wo.innerHTML = liste.map(function (b, i) {
    return '<button class="btn ' + b[1] + '" data-tut="' + i + '">' + esc(b[0]) + '</button>';
  }).join('');
  wo.querySelectorAll('[data-tut]').forEach(function (b) {
    b.addEventListener('click', liste[parseInt(b.dataset.tut, 10)][2]);
  });
}
document.getElementById('tutVor').addEventListener('click', tutWeiter);
document.getElementById('tutZu').addEventListener('click', tutEnde);
document.getElementById('tutZu').innerHTML = ICON.kreuz;
document.getElementById('tutZu').setAttribute('aria-label', 'Tutorial beenden');

// Dreht jemand das Gerät oder scrollt die Seite nach, stimmt das Rechteck
// nicht mehr. Neu messen, nicht neu zeichnen.
function tutNachmessen() {
  if (!tutOffen || tutSchritt < 0) return;
  tutGespannSetzen(tutLochSetzen(tutSchritte()[tutSchritt][1]));
}
window.addEventListener('resize', tutNachmessen);
window.addEventListener('orientationchange', tutNachmessen);

// ── Jubel ───────────────────────────────────────────────────
// Für die seltenen großen Augenblicke ein Fenster. Der Ton wechselt: mal
// trocken, mal überdreht, mal irgendwo dazwischen — dreimal dasselbe
// «Glückwunsch!» wäre nach dem zweiten Set kein Glückwunsch mehr, sondern eine
// Quittung. Ausgelost wird bei jedem Anlass neu.
var JUBEL = {
  set: [
    ['Set {n}. Erledigt.', 'Die Wörter wissen jetzt, wer hier lernt. {m} {s} freigeschaltet.'],
    ['SET {n} GEMEISTERT!!', 'Ich habe vor Freude eine Paprika geküsst. {m} neue {s} warten, ' +
      'ich habe sie schon angeschrien.'],
    ['Set {n} sitzt.', 'Sauber gemacht. {m} {s} stehen jetzt offen — kein Grund zur Eile.']
  ],
  thema: [
    ['«{n}». Durch.', 'Jedes Wort auf der letzten Stufe. Das war nicht wenig.'],
    ['«{n}» IST GEFALLEN!', 'Alle Wörter gemeistert. Ich lege mich kurz hin.'],
    ['«{n}» sitzt komplett.', 'Alle Wörter auf der Endstufe — dieses Thema kann dir nichts mehr.']
  ],
  abc: [
    ['33 von 33.', 'Das Alphabet ist durch. Du liest jetzt Kyrillisch, ohne zu stocken.'],
    ['DAS GANZE ALPHABET!', 'Alle 33. Ich habe mitgezählt, mehrmals, ich konnte nicht anders.'],
    ['Das Alphabet steht.', 'Alle 33 Buchstaben gemeistert. Der Anfang ist damit vorbei.']
  ],
  regel: [
    ['Alle {m} Regeln.', 'Keine Endung überrascht dich mehr. Das ist selten.'],
    ['{m} VON {m} REGELN!', 'Du beugst besser als mein Onkel, und der ist Russe.'],
    ['{m} von {m} Regeln.', 'Die ganze Grammatik dieser App sitzt. Ordentlich.']
  ],
  schreibung: [
    ['Alle {m} Schreibregeln.', 'Du schreibst nicht mehr, was du hörst. Genau darum geht es.'],
    ['ACHT VON ACHT!', 'Kein малако mehr. Ich habe das gefürchtet, jetzt ist es vorbei.'],
    ['{m} von {m} Regeln.', 'Die Rechtschreibung sitzt. Das ist der unsichtbare Teil.']
  ],
  power: [
    ['Topf leer.', 'Alle gefallenen Wörter wieder oben. Als wäre nichts gewesen.'],
    ['ALLE ZURÜCKGEHOLT!', 'Kein einziges liegt mehr unten. Ich bin den Tränen nahe.'],
    ['Nichts mehr gefallen.', 'Alle Wörter zurück auf ihrer Stufe. Gut aufgeräumt.']
  ]
};

var jubelOffen = false;
var jubelWege = [];   // was die Knöpfe tun sollen

// Einsetzen statt Zusammenkleben: die Vorlagen führen {n}, {m} und {s}, damit
// alle drei Tonlagen dieselben Zahlen bekommen und keine vergisst.
function jubelFuellen(text, werte) {
  return text.replace(/\{(\w+)\}/g, function (_, k) {
    return werte[k] === undefined ? '' : String(werte[k]);
  });
}

// anlass: Schlüssel in JUBEL · werte: {n, m, s} · wege: [{text, tun}]
function jubelZeigen(anlass, werte, wege) {
  var reihe = JUBEL[anlass];
  if (!reihe) return;
  var gewaehlt = reihe[Math.floor(Math.random() * reihe.length)];
  document.getElementById('jubelAnlass').textContent = JUBEL_ANLASS[anlass] || '';
  document.getElementById('jubelTitel').textContent = jubelFuellen(gewaehlt[0], werte || {});
  document.getElementById('jubelText').textContent = jubelFuellen(gewaehlt[1], werte || {});
  jubelWege = wege && wege.length ? wege : [{ text: 'Weiter', tun: null }];
  var knoepfe = document.getElementById('jubelKnoepfe');
  knoepfe.innerHTML = jubelWege.map(function (w, i) {
    return '<button class="btn ' + (i === jubelWege.length - 1 ? 'primary' : 'ghost') +
      '" data-jubel="' + i + '">' + esc(w.text) + '</button>';
  }).join('');
  knoepfe.querySelectorAll('[data-jubel]').forEach(function (b) {
    b.addEventListener('click', function () {
      var weg = jubelWege[parseInt(b.dataset.jubel, 10)];
      jubelSchliessen();
      if (weg && weg.tun) weg.tun();
    });
  });
  jubelSetzen(true);
  try { tonMeister(); } catch (e) { /* ohne Ton geht es auch */ }
}

function jubelSetzen(auf) {
  var vorher = jubelOffen;
  jubelOffen = auf;
  document.body.classList.toggle('jubel-offen', auf);
  document.getElementById('jubelHof').hidden = !auf;
  document.getElementById('jubelBlatt').setAttribute('aria-hidden', auf ? 'false' : 'true');
  if (jubelOffen !== vorher) chiliAktualisieren();
}

function jubelSchliessen() { jubelSetzen(false); }

// Ein Jubel gehört dem ersten Mal (ADR 0047). Wer ein zurückgefallenes Wort
// wieder hochholt, hat sein Set nicht noch einmal geschafft — er hat es
// repariert, und dafür gibt es kein Fenster.
function jubelSchon(marke) { return !!state.gefeiert[marke]; }
function jubelEinmal(marke, anlass, werte, wege) {
  if (jubelSchon(marke)) return;
  state.gefeiert[marke] = 1;
  save();
  jubelZeigen(anlass, werte, wege);
}

// **Wenn die Sets neu geschnitten werden, meint «set:7» etwas anderes als
// vorher.** Kommen Sätze dazu, entstehen aus zwölf Päckchen dreiunddreißig —
// und eine Marke aus der alten Rechnung hielte dann einen Jubel zurück, der
// jemandem zusteht, oder verschluckte einen, der ihm nie zustand. Darum trägt
// der Stand die Zahl der Sets mit, unter der seine Marken entstanden sind:
// Stimmt sie nicht mehr, fallen alle Set-Marken weg und werden von
// `jubelNachtragen()` neu bestimmt. Themen, Alphabet und Regeln bleiben — die
// hängen nicht am Schnitt.
function setSchnittPruefen() {
  if (state.setSchnitt === LERNSETS.length) return;
  Object.keys(state.gefeiert).forEach(function (k) {
    if (k.indexOf('set:') === 0) delete state.gefeiert[k];
  });
  state.setSchnitt = LERNSETS.length;
}

// Was beim Laden schon geschafft ist, gilt als gefeiert: Ein Stand von vor
// dieser Liste — oder eine eingespielte Sicherung, die sie nicht mitführt —
// bekäme sonst beim nächsten Auffrischen ein Fenster für etwas, das längst
// vorbei ist.
function jubelNachtragen() {
  for (var i = 0; i < LERNSETS.length; i++) if (setGeschafft(i)) state.gefeiert['set:' + i] = 1;
  Object.keys(VOCAB_THEMES).forEach(function (t) {
    if (themaGemeistert(t)) state.gefeiert['thema:' + t] = 1;
  });
  if (abcMeisterschaft() === ALPHABET.length) state.gefeiert.abc = 1;
  if (gramMeisterschaft() === GRAMMATIK.length) state.gefeiert.regel = 1;
  if (orthoMeisterschaft() === ORTHO.length) state.gefeiert.schreibung = 1;
}

var JUBEL_ANLASS = {
  set: 'Lernset', thema: 'Thema', abc: 'Alphabet', regel: 'Grammatik',
  schreibung: 'Schreibung', power: 'Power-Training'
};

// Ein Klang für den Augenblick statt des gewöhnlichen «richtig».
function meisterTon(richtig) {
  if (meisterMeldung) tonMeister();
  else ton(richtig);
}

// ── Tempo ───────────────────────────────────────────────────
// Wie lange eine Antwort braucht, ist eine eigene Auskunft: Ein Wort, das vier
// Sekunden kostet, ist gewusst, aber nicht abrufbar — und Lesen besteht aus
// Abruf, nicht aus Wissen. Gemessen wird von der fertigen Aufgabe bis zur
// Abgabe, je Übung gemittelt.
//
// **Die Uhr steht in den Aufgabenbauern, nicht im Renderlauf.** Eine Ansicht
// wird auch neu gezeichnet, wenn nur die Tastatur aufklappt; die Uhr dort zu
// stellen hieße, jede Nachdenkpause zu verschenken.
var aufgabeSeit = 0;
// **Eine neue Aufgabe steht.** Drei Dinge gehören dazu, und alle drei gehören
// hierher, weil sie denselben Augenblick meinen: Die Uhr läuft (sie misst das
// Denken, nicht das Tippen — darum nicht im Renderlauf), was die Chili zur
// vorigen Aufgabe gesagt hat, ist gesagt, und die Nachschrift der vorigen
// Aufgabe ist erledigt. Bis 2.4.3 fehlte das Zweite: Der Kommentar wurde nur
// beim Antworten neu gesetzt und nie gelöscht, also stand er nach «Weiter»
// weiter über der nächsten Aufgabe (ADR 0063). Das Dritte kam mit ADR 0070
// dazu: Bis dahin setzte jedes `rekoPruefen` seine Nachschrift selbst zurück —
// das trägt nur, solange **jeder** Weg in die Auflösung über eine Prüfung
// führt. «Aufdecken» tut das nicht.
function aufgabeBeginnt() {
  aufgabeSeit = Date.now();
  kommentar = '';
  reko = null;
}

function tempoNotieren() {
  if (!aufgabeSeit) return;
  var ms = Date.now() - aufgabeSeit;
  aufgabeSeit = 0;
  // Über zwei Minuten war es keine Antwort, sondern eine Pause. Solche Werte
  // würden den Schnitt für immer verderben.
  if (ms < 200 || ms > 120000) return;
  var topf = state.tempo[currentTab] || (state.tempo[currentTab] = { n: 0, ms: 0 });
  topf.n++;
  topf.ms += ms;
}

// Der Schnitt in Sekunden, oder null, wenn zu wenig gemessen wurde.
function tempoSchnitt(tab) {
  var t = state.tempo[tab];
  return (t && t.n >= 5) ? t.ms / t.n / 1000 : null;
}

// ── Tagesmaß ────────────────────────────────────────────────
// Ohne Grenze lernt man an einem guten Abend vierzig neue Wörter — und bekommt
// sie drei Wochen später alle am selben Tag zurück. Die Lawine steht dann nicht
// im Kalender, sie steht im Lernstand, und sie kommt bestimmt.
//
// **Gebremst wird nur Neues.** Wiederholungen, die «Alle»-Stapel und alles,
// womit schon einmal gearbeitet wurde, bleiben unbegrenzt — eine Grenze darauf
// wäre eine Grenze aufs Üben und widerspräche ADR 0048.
//
// Der Tag kommt aus dem Kalender des Geräts, nicht aus einer Millisekundenzahl:
// Wer um 23:50 anfängt, hat um 00:10 einen neuen Tag, und das ist richtig so.
function heuteNr() {
  var d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function neuHeute() {
  var h = state.neuHeute;
  return (h && h.tag === heuteNr()) ? (h.n || 0) : 0;
}
function neuGezaehlt() {
  var heute = heuteNr();
  if (!state.neuHeute || state.neuHeute.tag !== heute) state.neuHeute = { tag: heute, n: 0 };
  state.neuHeute.n++;
}
function tagesmassVoll() {
  var grenze = state.settings.tagesmass;
  return !!grenze && neuHeute() >= grenze;
}
// Was aus einem Vorrat trotz voller Bremse noch drankommen darf: alles, womit
// schon einmal gearbeitet wurde.
function uebVorrat(pool) {
  if (!tagesmassVoll()) return pool;
  return pool.filter(function (v) { return state.lastSeen[v.id]; });
}

// ── Fehlerprofil ────────────────────────────────────────────
// Der Bestand merkte sich, *dass* etwas falsch war. Womit es verwechselt wurde,
// ging verloren — und genau das ist die Auskunft, aus der eine Übung besser
// wird als ein Kartenstapel: Wer «сестра» für «сестру» hält, soll die beiden
// wiedersehen, nicht «автобус».
var VERWECHSELT_MAX = 20;   // mehr sagt nichts mehr, macht den Stand aber größer
function verwechseltNotieren(gefragt, gewaehlt) {
  if (!state.settings.fehlerprofil) return;
  if (!gefragt || !gewaehlt || gefragt === gewaehlt) return;
  if (!VOKABEL[gefragt] || !VOKABEL[gewaehlt]) return;
  var topf = state.verwechselt[gefragt] || (state.verwechselt[gefragt] = {});
  topf[gewaehlt] = Math.min(VERWECHSELT_MAX, (topf[gewaehlt] || 0) + 1);
}
// Die eigenen Verwechslungen zu einem Wort, die häufigste zuerst.
function verwechseltMit(id) {
  if (!state.settings.fehlerprofil) return [];
  var topf = state.verwechselt[id];
  if (!topf) return [];
  return Object.keys(topf).sort(function (a, b) { return topf[b] - topf[a]; })
    .map(function (k) { return VOKABEL[k]; })
    .filter(function (v) { return !!v; });
}

function updateBox(id, correct) {
  tempoNotieren();
  var cur = state.boxes[id] || 0;
  // **Neu ist, was noch nie dran war.** Der Zeitstempel fehlt genau dann, und
  // gleich darauf steht er da — also zählt es hier, davor.
  if (!state.lastSeen[id]) neuGezaehlt();
  state.boxes[id] = correct ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.lastSeen[id] = Date.now();
  state.streak = correct ? state.streak + 1 : 0;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.answered++;
  updateKopf();
  save();
}

// ── Lernsets und Fälligkeit ─────────────────────────────────
// Ein Lernset bündelt die Wörter, die die nächsten Sätze brauchen. Wer ein Set
// schafft, schaltet damit genau diese Sätze in «Übersetzen» frei — das ist der
// kurze Weg vom Vokabeltraining zum ganzen Satz.
var SET_MAX = 12;
var TAG = 86400000;
// Wiedervorlage je Leitner-Stufe: neu · 1 Tag · 3 · 7 · 21
var INTERVALL = [0, TAG, 3 * TAG, 7 * TAG, 21 * TAG];

var LERNSETS = (function () {
  // Sätze in der Reihenfolge, in der sie erreichbar werden: nach dem im Lehrplan
  // spätesten Wort, das sie voraussetzen.
  var reife = function (satz) {
    return Math.max.apply(null, satz.benoetigt.map(function (w) {
      return VOKABEL[w] ? VOKABEL[w].nr : 0;
    }));
  };
  var sortiert = SENTENCES.slice().sort(function (a, b) { return reife(a) - reife(b); });
  var gesehen = {};
  var sets = [];
  var offen = { woerter: [], saetze: [] };
  sortiert.forEach(function (satz) {
    var neue = satz.benoetigt.filter(function (w) { return !gesehen[w] && VOKABEL[w]; });
    if (offen.woerter.length && offen.woerter.length + neue.length > SET_MAX) {
      sets.push(offen);
      offen = { woerter: [], saetze: [] };
    }
    neue.forEach(function (w) { gesehen[w] = true; offen.woerter.push(VOKABEL[w]); });
    offen.saetze.push(satz);
  });
  if (offen.woerter.length || offen.saetze.length) sets.push(offen);
  return sets.map(function (set, i) {
    return { nr: i, woerter: set.woerter, saetze: set.saetze };
  });
})();

function setReif(nr) {
  return LERNSETS[nr].woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= SATZ_STUFE; }).length;
}
function setGeschafft(nr) {
  return setReif(nr) === LERNSETS[nr].woerter.length;
}
// Nummer des ersten nicht geschafften Sets — dort wird gelernt.
function aktuellesSet() {
  for (var i = 0; i < LERNSETS.length; i++) if (!setGeschafft(i)) return i;
  return LERNSETS.length - 1;
}
function setFrei(nr) {
  return nr <= aktuellesSet();
}
// Alle Wörter bis einschließlich des laufenden Sets.
function freigeschalteteWoerter() {
  var liste = [];
  for (var i = 0; i <= aktuellesSet(); i++) liste = liste.concat(LERNSETS[i].woerter);
  return liste;
}
// Wörter, mit denen schon gearbeitet wurde — Quelle für Ablenker.
function verwechslungsPool() {
  var begonnen = ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
  return begonnen.length >= 8 ? begonnen : ALL_VOCAB;
}
// Auf der Endstufe entscheidet die Einstellung, sonst die Leitner-Leiter.
function intervallFuer(box) {
  if (box >= BOX_MAX) {
    var tage = state.settings.auffrischen;
    // **Null heißt: gar nicht mehr** (ADR 0074). `|| 21` stand hier und an
    // drei weiteren Stellen — und hätte die Null still in die Vorgabe
    // verwandelt, weil sie in JavaScript falsch ist. Eine Frist, die nie
    // abläuft, ist unendlich, nicht null: `jetzt - seit >= Infinity` ist
    // immer falsch, und damit wird nichts je wieder fällig.
    if (tage === 0) return Infinity;
    return (tage || 21) * TAG;
  }
  return INTERVALL[Math.min(box, INTERVALL.length - 1)];
}
// Was die Leerzustände über die Auffrischung sagen — an **einer** Stelle, denn
// bei abgeschalteter Frist wäre «nach 0 Tagen einmal zur Sicherheit» Unsinn.
// **Vier Stellen versprechen ein Wiedersehen** — zwei in «Tippen», zwei in
// «Übersetzen». Alle vier fragen jetzt hier nach, denn bei abgeschalteter
// Frist gibt es keins, und ein leerer Zeitpunkt hinterließe «Die nächste
// Auffrischung kommt .» (ADR 0074).
function auffrischKommt(wann) {
  if (!wann) return 'Das Auffrischen ist abgeschaltet.';
  return 'Die n\u00e4chste Auffrischung kommt ' + esc(wann) + '.';
}

// Der Nachsatz hinter «… sitzt und ruht»: Ohne Frist gibt es kein Wiedersehen,
// und ein Versprechen darauf wäre falsch.
function ruhtWeiter(wann) {
  if (!wann) return ' Das Auffrischen ist abgeschaltet — hier bleibt es leer.';
  return ' Das N\u00e4chste kommt ' + esc(wann) + ' zur Sicherheit noch einmal.';
}

function auffrischSatz() {
  var tage = state.settings.auffrischen;
  if (!tage) return 'du hast das Auffrischen abgeschaltet, hier bleibt es darum leer.';
  return 'nach ' + tage + ' Tagen einmal zur Sicherheit.';
}

function faellig(v, jetzt) {
  var seit = state.lastSeen[v.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(state.boxes[v.id] || 0);
}

// ── Stand eines Satzes ──────────────────────────────────────
// Sätze führen dieselbe Leiter wie Wörter: BOX_MAX Mal richtig heißt «sitzt».
// Kennung ist der russische Satz, wie bei Wörtern das russische Wort.
function satzBox(s) { return state.satzBox[s.ru] || 0; }
function satzFaellig(s, jetzt) {
  var seit = state.satzSeen[s.ru];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(satzBox(s));
}
function satzUpdate(s, richtig) {
  tempoNotieren();
  var cur = satzBox(s);
  state.satzBox[s.ru] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.satzSeen[s.ru] = Date.now();
}
function faelligeAnzahl(liste) {
  var jetzt = Date.now();
  return liste.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); }).length;
}

// ── Auswahl (Filter) ────────────────────────────────────────
// Statt Klappmenüs und langer Chip-Reihen in jeder Übung: ein Knopf im Kopf,
// dahinter dasselbe Aufklapp-Panel wie beim Menü. Weicht die Auswahl vom
// Regelfall ab, färbt sich der Knopf wie ein gesetzter Chip.
var filterOffen = false;

function filterSetzen(auf) {
  var vorher = filterOffen;
  filterOffen = auf && filterHatWahl();
  document.body.classList.toggle('filter-offen', filterOffen);
  var knopf = document.getElementById('filterKnopf');
  knopf.setAttribute('aria-expanded', filterOffen ? 'true' : 'false');
  document.getElementById('filterPanel').setAttribute('aria-hidden', filterOffen ? 'false' : 'true');
  // Nur beim echten Umschalten. `renderFilter()` ruft diese Funktion bei jedem
  // Zeichnen mit `false` — beim Aufbau noch, bevor `#main` gefüllt ist. Die
  // Figur bekäme dann eine Station im Kopf und flöge sichtbar auf ihren Platz,
  // sobald die Ansicht dasteht.
  if (filterOffen !== vorher) chiliAktualisieren();
}

function filterHatWahl() {
  return currentTab === 'lernsets' || currentTab === 'freestyle' ||
    currentTab === 'tippen' || currentTab === 'uebersetzen' ||
    currentTab === 'buchstaben' || currentTab === 'grammatik' ||
    currentTab === 'schreibung';
}

// Weicht etwas vom Regelfall ab? Nur dann ist der Knopf farbig.
function filterAktiv() {
  if (currentTab === 'lernsets') return uebAuswahl !== 'aktuell';
  if (currentTab === 'freestyle') return uebThema !== 'Alle';
  if (currentTab === 'tippen') return tippenModus !== 'lernen' || tippenSet !== null;
  if (currentTab === 'uebersetzen') {
    return trLevel !== 1 || trDir !== 'gemischt' || trModus !== 'lernen';
  }
  if (currentTab === 'buchstaben') return abcRichtung !== 'gemischt' || abcStapel !== 'reihe';
  if (currentTab === 'grammatik') return gramWahl !== null;
  if (currentTab === 'schreibung') return orthoWahl !== null;
  return false;
}

function filterGruppe(titel, chips) {
  return '<div class="filtergruppe"><span class="filter-titel">' + esc(titel) +
    '</span><div class="filter-reihe">' + chips + '</div></div>';
}
function filterChip(gruppe, wert, text, gesetzt, gesperrt) {
  return '<button class="chip' + (gesetzt ? ' active' : '') + '" data-fw="' + gruppe +
    '" data-fv="' + esc(String(wert)) + '"' + (gesperrt ? ' disabled' : '') + '>' +
    esc(text) + '</button>';
}

function filterInhaltHtml() {
  if (currentTab === 'lernsets') {

    var einzeln = '';
    LERNSETS.forEach(function (set, i) {

    GRAMMATIK.forEach(function (b) {

    ORTHO.forEach(function (r) {

      filterChip('tmodus', 'alle', 'Alle · ' + tippenAlle().length, tippenModus === 'alle');
    // Die Set-Reihe zählt im **gewählten Stapel** — sonst verspräche eine Zahl

// Eine Auswahl wirkt sofort: Panel zu, Übung neu aufsetzen, Knopf nachziehen.
function filterWaehlen(gruppe, wert) {
  filterSetzen(false);
  if (gruppe === 'set') {
    uebAuswahl = (wert === 'aktuell' || wert === 'alle') ? wert : parseInt(wert, 10);
    uebNext(true);
  } else if (gruppe === 'thema') {
    uebThema = wert;
    uebNext(true);
  } else if (gruppe === 'tmodus') {
    if (tippenModus !== wert) {
      tippenModus = wert;
      tWord = null; tResult = null; tHint = false;
    }
    renderTippen();
  } else if (gruppe === 'tset') {
    var neuesSet = wert === '' ? null : parseInt(wert, 10);
    if (tippenSet !== neuesSet) {
      tippenSet = neuesSet;
      // Das laufende Wort gehört zum alten Vorrat — mit ihm auch die
      // angefangene Eingabe und eine offene Auflösung.
      tWord = null; tResult = null; tHint = false; tEingabe = '';
    }
    renderTippen();
  } else if (gruppe === 'gramwahl') {
    gramWahl = wert || null;
    gramBaustein = gramWahl;
    gramQ = null;
    gramRegelNeu = false;
    gramRegelOffen = false;
    renderGrammatik();
    renderKopf();
  } else if (gruppe === 'orthowahl') {
    orthoWahl = wert || null;
    orthoRegel = orthoWahl;
    orthoQ = null;
    orthoRegelNeu = false;
    orthoRegelOffen = false;
    renderSchreibung();
    renderKopf();
  } else if (gruppe === 'abcstapel') {
    if (abcStapel !== wert) {
      abcStapel = wert;
      abcQ = null;   // die laufende Frage kommt aus dem alten Stapel
    }
    abcOffen = null;
    renderBuchstaben();
    renderKopf();
  } else if (gruppe === 'abcrichtung') {
    if (abcRichtung !== wert) {
      abcRichtung = wert;
      abcQ = null;   // die laufende Frage passt zur alten Richtung
    }
    abcOffen = null;
    renderBuchstaben();
    renderKopf();
  } else {
    if (gruppe === 'stufe') trLevel = parseInt(wert, 10);
    if (gruppe === 'richtung') trDir = wert;
    if (gruppe === 'trmodus') trModus = wert;
    trTask = null; trBuilt = []; trPhase = 'ask'; trCorrect = null; trRevealed = false;
    buildTransTask();
    renderUebersetzen();
  }
  renderFilter();
}

function renderFilter() {
  var knopf = document.getElementById('filterKnopf');
  var hat = filterHatWahl();
  knopf.hidden = !hat;
  if (!hat) { filterSetzen(false); return; }
  knopf.classList.toggle('aktiv', filterAktiv());
  var panel = document.getElementById('filterInhalt');
  // Angehängt statt in jedem Zweig eingebaut: Es gilt für jede Übung mit
  // eigener Spur, und in acht Zweigen dieselbe Zeile wäre sieben zu viel.
  panel.innerHTML = filterInhaltHtml();
  panel.querySelectorAll('[data-fw]').forEach(function (b) {
    b.addEventListener('click', function () { filterWaehlen(b.dataset.fw, b.dataset.fv); });
    b.tabIndex = filterOffen ? 0 : -1;
  });
}

// ── Wissen: warum steht dieses Wort so da? ──────────────────
// Die Frage entsteht mitten im Satz — also wird sie dort beantwortet. Zwei Wege
// hinein: ein Wort antippen oder der Knopf für den ganzen Satz. Er heißt
// «Wissen» und nicht «Tipp»: Ein Tipp ist etwas, das man sich versagt, Wissen
// soll man sich holen (ADR 0030).
var wissenOffen = false;
var wissenWort = null;   // angetipptes Wort, sonst alle

function wissenSetzen(auf) {
  var vorher = wissenOffen;
  wissenOffen = auf && wissenHatWas();
  document.body.classList.toggle('wissen-offen', wissenOffen);
  var knopf = document.getElementById('wissenKnopf');
  knopf.setAttribute('aria-expanded', wissenOffen ? 'true' : 'false');
  document.getElementById('wissenPanel').setAttribute('aria-hidden', wissenOffen ? 'false' : 'true');
  if (!wissenOffen) wissenWort = null;
  // Nur beim echten Umschalten — sonst flöge die Figur bei jedem Zeichnen.
  if (wissenOffen !== vorher) chiliAktualisieren();
}

// Erklärt wird nur die russische Seite — und nur dann, wenn sie ohnehin
// dasteht. In der Richtung DE → RU wäre jede Erklärung die halbe Lösung.
function wissenHatWas() {
  return currentTab === 'uebersetzen' && !!trTask &&
    (trTask.dir === 'ru-de' || trPhase === 'feedback');
}

// Ein Wort des Satzes nachschlagen: erst als gebeugte Form, dann als Grundform.
function wissenZuWort(wort) {
  var rein = String(wort).replace(/[.,!?;:«»]/g, '');
  var klein = rein.toLowerCase();
  var formen = (trTask && trTask.satz && trTask.satz.formen) || {};
  var schluessel = null;
  Object.keys(formen).forEach(function (f) {
    if (f.toLowerCase() === klein) schluessel = f;
  });
  if (schluessel) {
    var grundform = formen[schluessel][0];
    var rolle = formen[schluessel][1];
    var v = VOKABEL[grundform];
    return {
      wort: rein, art: 'form', grundform: grundform, rolle: rolle,
      vokabel: v, geschlecht: v ? geschlecht(v.art) : ''
    };
  }
  var direkt = VOKABEL[klein] || VOKABEL[rein];
  if (direkt) return { wort: rein, art: 'grundform', vokabel: direkt };
  return { wort: rein, art: 'offen' };
}

var ROLLE_NAME = {
  akk: 'Akkusativ — wen? was?',
  praep: 'Präpositiv — wo?'
};
PERSONEN.forEach(function (p) {
  ROLLE_NAME['praes' + p] = 'Präsens · ' + PERSON_NAME[p] + ' — ' + PERSON_DE[p];
});

function wissenKarteHtml(e) {
  if (e.art === 'grundform') {
    var v = e.vokabel;
    return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(v.ru) +
      hoerknopf(v.ru, 'ru') + '</p>' +
      '<p class="wissen-zeile">' + esc(v.de) + ' · <span class="translit">[' +
      esc(v.tr) + ']</span></p>' +
      (istNomen(v.art)
        ? '<p class="wissen-regel">Grundform · ' + GESCHLECHT_NAME[geschlecht(v.art)] + '</p>'
        : '<p class="wissen-regel">Grundform</p>') + '</div>';
  }
  if (e.art === 'offen') {
    return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(e.wort) + '</p>' +
      '<p class="wissen-regel offen">Diese Form ist noch nicht erklärt — sie kommt mit ' +
      'einem späteren Baustein in «Grammatik».</p></div>';
  }
  var g = e.geschlecht;
  var grund = e.grundform;
  var gleich = e.wort.toLowerCase() === grund.toLowerCase();
  var verb = e.rolle.indexOf('praes') === 0;
  // Am Satzanfang steht die Form groß. Kleinschreiben darf man sie nur, wenn
  // auch die Grundform klein ist — «Россия» bleibt sonst «россии».
  var form = grund.charAt(0) === grund.charAt(0).toLowerCase()
    ? e.wort.toLowerCase() : e.wort;
  var warum;
  if (verb) warum = gramVerbWarum(grund, e.rolle.slice(5), form);
  else if (e.rolle === 'praep' && e.vokabel) {
    warum = gramNomenWarum(grund, e.vokabel.art, form);
  } else if (gleich) {
    warum = 'Hier ändert sich nichts — die Form ist dieselbe wie die Grundform.';
  } else {
    warum = '<span class="cyr">' + esc(grund.slice(-1)) + '</span> wird zu <span class="cyr">' +
      esc(e.wort.slice(-1).toLowerCase()) + '</span>.';
  }
  return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(e.wort) +
    hoerknopf(e.wort, 'ru') + '</p>' +
    '<p class="wissen-zeile"><span class="cyr">' + esc(grund) + '</span>' +
    (e.vokabel ? ' · ' + esc(e.vokabel.de) : '') +
    (g && !verb ? ' · ' + GESCHLECHT_NAME[g] : '') + '</p>' +
    '<p class="wissen-regel">' + esc(ROLLE_NAME[e.rolle] || e.rolle) + '</p>' +
    '<p class="wissen-warum">' + warum + '</p></div>';
}

function wissenInhaltHtml() {
  if (!trTask) return '';
  var text = trTask.dir === 'ru-de' ? trTask.prompt : trTask.solution;
  var worte = text.split(/\s+/).filter(Boolean);
  var eintraege = wissenWort ? [wissenZuWort(wissenWort)] : worte.map(wissenZuWort);
  var html = '';
  if (wissenWort) {
    html += '<button class="chip wissen-alle" id="wissenAlle">Ganzer Satz</button>';
  }
  eintraege.forEach(function (e) { html += wissenKarteHtml(e); });
  return html;
}

// Knopf und Blatt ziehen um: in die Kachel, sobald eine einen Platz aufstellt,
// sonst zurück in den Kopf. Umhängen statt neu bauen — sonst verlöre der Knopf
// seinen Zuhörer, und die Chili stünde in einem Element, das es nicht mehr gibt.
// Umgehängt wird erst, wenn die Ansicht steht: `renderKopf()` läuft **vor**
// dem Zeichnen, und ein Platzhalter der alten Ansicht wäre gleich darauf mit
// samt der Hülle fort.
// **Die Leiste zieht zur Kachel und wieder zurück** (ADR 0082). Dasselbe
// Verfahren, das den Wissensknopf schon bewegt hat, nur für den ganzen Kasten:
// Vor einem Renderlauf kommt sie nach Hause — `main.innerHTML` würde sie sonst
// mitsamt Blatt und Zuhörern wegwerfen —, danach zieht sie wieder hinaus.
function leisteHeimschicken() {
  var leiste = document.getElementById('uebLeiste');
  var heim = document.getElementById('leisteHeim');
  if (!leiste || !heim) return;
  if (leiste.parentElement !== heim) heim.appendChild(leiste);
  // **Zu Hause ist sie durchsichtig, sofort.** Die Klasse erst beim Umhängen
  // abzunehmen hieß: Bleibt der Rückweg einmal aus, steht in der Kopfzeile ein
  // Flex-Kasten mit eigenem Abstand — genau das sah man, als die Knöpfe nach
  // dem Prüfen nach oben sprangen.
  leiste.classList.remove('bei-kachel');
}

// **Eine Übung zeichnet sich oft ohne den Umweg über `render()`** — beim
// Prüfen, beim Weitergehen, beim Umschalten der Tastatur. Jeder dieser Läufe
// schickt die Leiste heim und muss sie zurückholen, und zwar an **jedem**
// Ausgang: Fakt, Leerzustand, Tagesmaß, fertige Kachel. An jeden einzeln zu
// denken war genau die Disziplin, die schon zweimal versagt hat (ADR 0082).
// Darum eine Hülle: Der Kern zeichnet, die Hülle bewegt.
//
// **Alle sieben Übungen fahren hindurch**, auch die ohne Leiste bei der
// Kachel: «Schreibung» und «Power-Training» zeigen ebenfalls Faktkarten, und
// dort muss die Leiste genauso verschwinden. Eine Regel für alle ist eine, die
// man sich merken kann — drei Ausnahmen sind drei Gelegenheiten zum Vergessen.
function leisteRahmen(zeichnen) {
  leisteHeimschicken();
  try { zeichnen(); } finally { leisteUmhaengen(); }
}

function leisteUmhaengen() {
  var leiste = document.getElementById('uebLeiste');
  var platz = main.querySelector('[data-leiste]');
  var ziel = platz || document.getElementById('leisteHeim');
  if (ziel && leiste.parentElement !== ziel) ziel.appendChild(leiste);
  leiste.classList.toggle('bei-kachel', !!platz);
  leisteZeigen();
}

function renderWissen() {
  var knopf = document.getElementById('wissenKnopf');
  var da = wissenHatWas();
  knopf.hidden = !da;
  // Auch die Hülle im Kopf verschwindet: Ein leerer Platzhalter zählt sonst
  // als Element und rückt die Knöpfe daneben auseinander.
  document.getElementById('wissenHeim').hidden = !da;
  leisteZeigen();
  if (!da) {
    if (wissenOffen) wissenSetzen(false);
    return;
  }
  document.getElementById('wissenZeichen').innerHTML = ICON.wissen;
  var panel = document.getElementById('wissenInhalt');
  panel.innerHTML = wissenInhaltHtml();
  panel.querySelectorAll('button').forEach(function (b) { b.tabIndex = wissenOffen ? 0 : -1; });
  var alleKnopf = document.getElementById('wissenAlle');
  if (alleKnopf) alleKnopf.addEventListener('click', function () {
    wissenWort = null;
    renderWissen();
  });
}

// ── Kopfzeile ───────────────────────────────────────────────
// Auf «Home» trägt sie Titel und Fortschritt, sonst den Namen der Ansicht und
// den Rückweg. Sie klebt nur unterwegs; auf Home darf sie wegscrollen.
function renderKopf() {
  var daheim = currentTab === 'home';
  document.body.classList.toggle('unterwegs', !daheim);
  document.body.classList.toggle('im-menu', imMenu(currentTab));
  // Nur die Übungen rücken in die Mitte; Listen und Menüansichten nicht.
  document.body.classList.toggle('aufgabe', !!UEBUNG_NAME[currentTab] && !daheim);
  document.getElementById('zurueck').hidden = daheim;
  // Zurück geht einen Schritt, Home räumt den ganzen Stapel — zwei
  // verschiedene Dinge, darum zwei Knöpfe. Auf Home selbst wäre beides
  // sinnlos, dort steht keiner von beiden.
  document.getElementById('heimKnopf').hidden = daheim;
  document.getElementById('kopfFortschritt').hidden = !daheim;
  // In einer Detailansicht der Bilanz trägt der Kopf deren Namen und nennt
  // darüber, wo man ist — der Pfeil führt dann auch dorthin zurück.
  var detail = currentTab === 'bilanz' && bilanzDetail;
  // Auf Home bleibt die Augenbraue leer: «Русский · Тренажёр» sagte nichts,
  // was der Name darunter nicht schon sagt. Ihr Platz bleibt trotzdem stehen
  // (siehe `.eyebrow:empty`), damit der Titel nicht nach oben rutscht.
  document.getElementById('kopfEyebrow').textContent = daheim
    ? ''
    : (detail ? 'Bilanz' : (UEBUNG_NAME[currentTab] ? 'Übung' : 'Menü'));
  document.getElementById('kopfTitel').textContent = daheim
    ? 'Chillingo'
    : (detail ? (DETAIL_NAME[bilanzDetail] || 'Bilanz') : ansichtName(currentTab));
  // Die Lampe hängt an der Ansicht: Ob das Wort daneben steht, entscheidet
  // sich hier — die Farbe entscheidet das Netz.
  netzZeigen();
  document.querySelectorAll('.menueintrag').forEach(function (b) {
    b.classList.toggle('active', b.dataset.ziel === currentTab);
  });
  renderTafelKnopf();
  renderTutRund();
  renderWissen();
  renderFilter();
}

// **Wo der kleine Tutorial-Knopf steht** (ADR 0080): überall, wo es eine Spur
// gibt — außer auf der Übersicht, solange das große Tutorial noch nie ganz
// gelaufen ist. Dort trägt das goldene Angebot im Inhalt die Einladung, und die
// soll man nicht übersehen können.
function renderTutRund() {
  var knopf = document.getElementById('tutRund');
  if (!knopf) return;
  var da = !!TUTORIALS[currentTab] &&
    !(currentTab === 'home' && !state.tutorialFertig);
  knopf.hidden = !da;
  if (da) knopf.innerHTML = ICON.frage;
  leisteZeigen();
}

// **Eine leere Leiste ist ein Streifen Luft** (ADR 0081). Sie steht nur da,
// wenn einer ihrer beiden Knöpfe etwas zu sagen hat — und der Wissensknopf zieht
// obendrein in die Kachel um, sobald es dort einen Platz gibt.
function leisteZeigen() {
  var leiste = document.getElementById('uebLeiste');
  if (!leiste) return;
  var tut = document.getElementById('tutRund');
  var wissen = document.getElementById('wissenKnopf');
  // **Wo nichts zu erklären ist, steht auch keine Leiste.** Eine Faktkarte hat
  // weder eine Aufgabe noch ein Wissen dazu; in die Kopfzeile zu rutschen wäre
  // keine Antwort, sondern das Zucken, das gemeldet wurde. Die Ansicht sagt es
  // selbst — über ein Merkmal im Inhalt, nicht über eine Liste im Code.
  if (main.querySelector('[data-ohne-leiste]')) { leiste.hidden = true; return; }
  // Zu Hause ist sie durchsichtig und darf immer stehen — die Knöpfe verbergen
  // sich selbst. Bei der Kachel wäre sie sonst ein Streifen Luft über der
  // Aufgabe.
  leiste.hidden = leiste.classList.contains('bei-kachel') &&
    (!tut || tut.hidden) && (!wissen || wissen.hidden);
}

// Der Tafelknopf gehört nur zu «Buchstaben» und zeigt, wo man gerade steht:
// gedrückt heißt Tafel, sonst führt er dorthin.
function renderTafelKnopf() {
  var knopf = document.getElementById('tafelKnopf');
  var da = currentTab === 'buchstaben';
  knopf.hidden = !da;
  if (!da) return;
  var aufTafel = abcAnsicht === 'tafel';
  knopf.innerHTML = ICON.tafel;
  knopf.classList.toggle('aktiv', aufTafel);
  knopf.setAttribute('aria-pressed', aufTafel ? 'true' : 'false');
  knopf.setAttribute('aria-label', aufTafel ? 'Zurück zum Üben' : 'Alphabet-Tafel');
}

// ── Der Rückweg ─────────────────────────────────────────────
// Zurück heißt: dorthin, wo man herkam — nicht stur nach Home. Wer aus der
// Bilanz zu den Fakten abbiegt, will von dort in die Bilanz zurück, nicht an
// den Anfang. Der Stapel merkt sich die Ansichten davor.
//
// Er kann nicht wachsen: Home räumt ihn leer — dort endet jeder Weg —, und wer
// dorthin zurücksteuert, wo er gerade herkam, nimmt den Schritt zurück, statt
// einen zweiten daraufzusetzen. Ein Hin und Her zwischen zwei Ansichten
// hinterlässt also keinen Rest. Die Obergrenze ist nur die Reißleine.
var STAPEL_MAX = 12;
var ansichtStapel = [];

function stapelMerken(neu) {
  if (neu === currentTab) return;
  if (neu === 'home') { ansichtStapel.length = 0; return; }
  if (ansichtStapel[ansichtStapel.length - 1] === neu) { ansichtStapel.pop(); return; }
  ansichtStapel.push(currentTab);
  if (ansichtStapel.length > STAPEL_MAX) ansichtStapel.shift();
}

function setTab(name, zurueck) {
  if (UEBUNG_NAME[name] || name === 'home') letzterTab = name;
  if (!zurueck) stapelMerken(name);
  currentTab = name;
  window.scrollTo(0, 0);
  render();
  // Erst zeichnen, dann schließen: die Platzwahl der Chili liefe sonst noch
  // über den Inhalt der alten Ansicht.
  chiliZusammen(function () {
    filterSetzen(false);
    wissenSetzen(false);
    menuSetzen(false);
  });
  // **Zuletzt, und nur beim ersten Mal** (ADR 0079): Die Übung steht dann
  // schon da, und der Scheinwerfer findet, worauf er zeigen soll.
  tutUebungAnbieten(name);
}

// **Der Weg durchs Menü ist der Vordereingang** (ADR 0072). Zwei Ansichten
// merken sich, wo man zuletzt war — die Bilanz ihre Detailseite, die
// Einstellungen ihren Reiter. Für den **Rückweg** ist das richtig: Wer aus
// «Wörter» heraus etwas nachschlägt und umkehrt, will nach «Wörter» zurück.
// Für den Weg durchs Menü ist es falsch: Dort fängt man an, nicht weiter. Bis
// 2.4.13 steckte man nach einem Abstecher in «Wörter» fest, bis man den
// Rückpfeil fand — und die Einstellungen öffneten beim zuletzt gelesenen
// Reiter statt bei «App».
//
// Deshalb hier und **nicht** in `setTab()`: Ein gezielter Sprung
// («Maß ändern» führt auf den Lernweg) ist kein Anfang, sondern ein Ziel.
function ansichtAnfang(name) {
  if (name === 'bilanz') { bilanzDetail = null; themenOffen = false; }
  if (name === 'einstellungen') einstReiter = EINST_REITER[0].id;
}

function zurueckGehen() {
  if (currentTab === 'home') return;
  // Aus einer Detailansicht der Bilanz führt der Weg zunächst dorthin zurück.
  if (currentTab === 'bilanz' && bilanzDetail) {
    bilanzDetail = null;
    renderBilanz();
    renderKopf();
    return;
  }
  setTab(ansichtStapel.pop() || 'home', true);
}

document.getElementById('zurueck').addEventListener('click', zurueckGehen);

// ── Vom Rand wischen ────────────────────────────────────────
// Im Vollbild der Home-Bildschirm-Verknüpfung gibt es die Zurück-Geste des
// Browsers nicht; der Pfeil oben links ist der einzige Weg. Eine Wischgeste
// vom linken Rand nimmt ihm die Arbeit ab.
//
// Sie startet nur am äußersten Rand — dort liegt kein Bedienelement — und
// wirkt erst am Ende der Berührung. Ein Tippen bewegt nichts und löst darum
// nichts aus. Ist ein Blatt offen, schweigt sie: Menü, Auswahl und Meldeblatt
// haben ihre eigene Art, sich zu schließen.
var WISCH_RAND = 26;          // px vom linken Rand, in denen die Geste beginnen darf
var WISCH_WEG = 70;           // px, die der Finger mindestens zurücklegen muss
var wischVonX = 0, wischVonY = 0, wischBereit = false;

function blattOffen() {
  return menuOffen || filterOffen || wissenOffen || meldeOffen;
}

document.addEventListener('touchstart', function (e) {
  wischBereit = false;
  if (e.touches.length !== 1 || currentTab === 'home' || blattOffen()) return;
  var t = e.touches[0];
  if (t.clientX > WISCH_RAND) return;
  wischBereit = true;
  wischVonX = t.clientX;
  wischVonY = t.clientY;
}, { passive: true });

document.addEventListener('touchend', function (e) {
  if (!wischBereit) return;
  wischBereit = false;
  if (blattOffen()) return;
  var t = e.changedTouches[0];
  var quer = t.clientX - wischVonX;
  var hoch = Math.abs(t.clientY - wischVonY);
  // Waagerecht muss deutlich überwiegen, sonst war es ein Scrollen.
  if (quer >= WISCH_WEG && hoch <= quer * 0.7) zurueckGehen();
}, { passive: true });

document.addEventListener('touchcancel', function () { wischBereit = false; }, { passive: true });

  var grund = meldeGrundText();
