<title>Chillingo · Russisch lernen</title>
<style>
:root {
  --bg: #101418;
  --card: #171C23;
  --card-2: #1D232C;
  --line: #262E39;
  --text: #E7E4DD;
  --dim: #8B93A1;
  --ice: #8FB4EA;
  --gold: #D2A24E;
  --gold-ink: #14110A;
  --good: #5FBF8F;
  --bad: #E07A6E;
  --glow: #1C242F;
  --lip: rgba(255, 255, 255, .035);
  --shade: rgba(0, 0, 0, .28);
}
/* Helle Palette: greift automatisch nach der Systemvorgabe — oder ausdrücklich
   über data-theme, wenn in den Einstellungen gewählt. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #F4F2ED;
    --card: #FFFFFF;
    --card-2: #EDEAE2;
    --line: #D8D4C9;
    --text: #23272E;
    --dim: #6E7683;
    --ice: #2F5FA8;
    --gold: #A87B2A;
    --gold-ink: #FFFFFF;
    --good: #2E7D5B;
    --bad: #B4443C;
    --glow: #FFFFFF;
    --lip: rgba(255, 255, 255, .6);
    --shade: rgba(35, 39, 46, .07);
  }
}
:root[data-theme="hell"] {
  --bg: #F4F2ED;
  --card: #FFFFFF;
  --card-2: #EDEAE2;
  --line: #D8D4C9;
  --text: #23272E;
  --dim: #6E7683;
  --ice: #2F5FA8;
  --gold: #A87B2A;
  --gold-ink: #FFFFFF;
  --good: #2E7D5B;
  --bad: #B4443C;
  --glow: #FFFFFF;
  --lip: rgba(255, 255, 255, .6);
  --shade: rgba(35, 39, 46, .07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Doppeltipp vergrößert nicht mehr; Aufziehen mit zwei Fingern bleibt möglich. */
html { touch-action: manipulation; }
html, body { margin: 0; padding: 0; }
body {
  --pad-oben: calc(14px + env(safe-area-inset-top));
  --pad-links: calc(16px + env(safe-area-inset-left));
  --pad-rechts: calc(16px + env(safe-area-inset-right));
  background: var(--bg);
  /* flacher Schein hinter dem Kopf, damit die Fläche nicht tot wirkt */
  background-image: radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 70%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Der Fußabstand hält dem schwebenden Meldeknopf Platz frei. */
  padding: var(--pad-oben) var(--pad-rechts) calc(96px + env(safe-area-inset-bottom)) var(--pad-links);
  max-width: 560px;
  margin: 0 auto;
  -webkit-text-size-adjust: 100%;
}
.cyr { font-family: Georgia, "Times New Roman", serif; }
button { font-family: inherit; }

.masthead { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.titelblock { flex: 1; min-width: 0; }
/* Der Platz im Kopf steht im Fluss, zwischen Titel und Menüknopf. Mittig über
   der Zeile wäre er nur auf Home sichtbar — dort hat aber die Empfehlung immer
   Vorrang —, und unterwegs liefe ein langer Name wie «Einstellungen» darunter
   hindurch. Also einer statt zwei Fälle. */
#chiliPlatz { width: 34px; height: 34px; margin-right: 2px; }
.chili-platz { flex: none; position: relative; }
.eyebrow { display: block; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; font-family: Georgia, serif; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; margin: 0; font-weight: 600; line-height: 1.1; }
.title-dot { color: var(--gold); }

.iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--card-2); color: var(--dim); cursor: pointer;
  box-shadow: inset 0 1px 0 var(--lip);
}
.iconbtn:active { transform: scale(.94); }
.gearbtn .icon { transition: opacity .2s; }

.kopf-rail {
  height: 3px; border-radius: 999px; background: var(--line);
  margin: 14px 0 7px; overflow: hidden;
}
.kopf-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width .35s; }
.kopf-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 13px; }
.kopf-label {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kopf-serie { color: var(--gold); }
#saveNote {
  flex: none; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); display: inline-flex; align-items: center; gap: 4px;
  opacity: 0; transition: opacity .35s;
}
#saveNote.show { opacity: 1; }
#saveNote.ok { color: var(--good); }
#saveNote.err { color: var(--bad); text-transform: none; letter-spacing: 0; opacity: 1; text-align: right; white-space: normal; }

.icon { width: 20px; height: 20px; display: block; pointer-events: none; flex: none; }

/* Der Kopf wechselt seinen Inhalt: auf «Home» Titel und Fortschritt, in einer
   Übung ein Zurück-Pfeil und ihr Name. Außerhalb von Home klebt er oben, damit
   der Rückweg immer erreichbar bleibt. */
header {
  position: relative; z-index: 6;
  margin: 0 calc(-1 * var(--pad-rechts)) 18px calc(-1 * var(--pad-links));
  padding: 0 var(--pad-rechts) 14px var(--pad-links);
  /* Auf Home bewusst ohne eigenen Grund: sonst deckt der Kopf den radialen
     Schein des Hintergrunds ab und über «Chillingo.» steht eine sichtbare
     Kante. Unterwegs deckt er, weil er dann klebt. */
  background: transparent;
}
body.unterwegs header {
  position: sticky; top: 0;
  background: var(--bg);
  padding-top: var(--pad-oben);
  margin-top: calc(-1 * var(--pad-oben));
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
body.unterwegs .titelblock { min-width: 0; }
body.unterwegs h1 { font-size: 19px; letter-spacing: .01em; }
body.unterwegs .eyebrow { margin-bottom: 2px; }

.rundbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center; position: relative;
  border: 1px solid var(--line); background: var(--card-2); color: var(--dim);
  cursor: pointer; box-shadow: inset 0 1px 0 var(--lip);
  overflow: hidden;   /* die Striche dürfen den Kreis nie verlassen */
}
.rundbtn:active { transform: scale(.94); }
.rundbtn[hidden] { display: none; }
#zurueck::before {
  content: ''; width: 11px; height: 11px; margin-left: 4px;
  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(45deg); border-radius: 1px;
}

/* Der Menüknopf: drei Striche, die beim Öffnen nacheinander nach unten aus dem
   Kreis wandern. Gestaffelt, damit es fließt statt zu ruckeln.
   Geblendet wird in einer eigenen Hülle, nicht am Knopf: der Knopf selbst muss
   überstehen lassen, sonst wäre die einfliegende Chili bis zur Landung
   unsichtbar. */
.burger { overflow: visible; z-index: 40; }
.burger .striche {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.burger .strich {
  width: 18px; height: 2px; border-radius: 2px; background: currentColor;
  transition: transform .34s cubic-bezier(.4, 0, .2, 1), opacity .28s;
}
.burger[aria-expanded="true"], body.im-menu .burger { color: var(--gold); border-color: var(--gold); }
/* Einmal im Menü angekommen, bleiben die Striche unten — der Knopf zeigt dann
   die Chili oder, wenn die anderswo gebraucht wird, einen ruhenden Punkt. */
.burger[aria-expanded="true"] .strich, body.im-menu .burger .strich {
  transform: translateY(26px); opacity: 0;
}
#menuKnopf .punkt {
  position: absolute; width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold); opacity: 0; transition: opacity .3s .2s;
}
body.im-menu #menuKnopf .punkt { opacity: .8; }
body.im-menu #menuKnopf.mit-chili .punkt { opacity: 0; transition-delay: 0s; }
#chiliKnopf { position: absolute; inset: 6px; }
.burger[aria-expanded="true"] .strich:nth-child(1) { transition-delay: 0s; }
.burger[aria-expanded="true"] .strich:nth-child(2) { transition-delay: .05s; }
.burger[aria-expanded="true"] .strich:nth-child(3) { transition-delay: .1s; }
/* Beim Schließen laufen sie in umgekehrter Reihenfolge zurück. */
.burger[aria-expanded="false"] .strich:nth-child(1) { transition-delay: .1s; }
.burger[aria-expanded="false"] .strich:nth-child(2) { transition-delay: .05s; }
.burger[aria-expanded="false"] .strich:nth-child(3) { transition-delay: 0s; }

/* Das Panel wächst von oben nach unten heraus — über die Zeilenhöhe eines
   Rasters, damit keine feste Höhe geraten werden muss. */
/* Das Panel liegt *über* der Seite, nicht darin: es hängt unter dem Knopf und
   ist nur so breit wie nötig. Läge es im Fluss, schöbe es beim Aufklappen den
   ganzen Inhalt nach unten. */
.menupanel {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
  width: 232px; max-width: 78vw;
  display: grid; grid-template-rows: 0fr; overflow: hidden;
  transition: grid-template-rows .36s cubic-bezier(.3, .8, .3, 1), opacity .2s;
  opacity: 0; pointer-events: none;
}

/* Die Rasterzeile ist der Behälter, nicht die Karte: Ränder und Innenabstände
   der Karte zählten sonst zur Zeilenhöhe, und zugeklappt bliebe ein Streifen. */
.menupanel > .menuwrap { min-height: 0; overflow: hidden; }
body.menu-offen #menuPanel,
body.filter-offen #filterPanel { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
body.wissen-offen #wissenPanel { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
.menuinhalt {
  display: flex; flex-direction: column; gap: 2px; padding: 6px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: inset 0 1px 0 var(--lip), 0 12px 26px var(--shade);
}
.menueintrag {
  display: flex; align-items: center; gap: 12px;
  min-height: 48px; padding: 0 14px; width: 100%;
  background: none; border: none; border-radius: 12px; cursor: pointer;
  color: var(--text); font-size: 15px; text-align: left;
}
.menueintrag .icon { color: var(--dim); }
.menueintrag.active { color: var(--gold); background: var(--card-2); }
.menueintrag.active .icon { color: var(--gold); }

/* Der Auswahlknopf steht neben dem Menü und öffnet dasselbe Aufklapp-Panel.
   Weicht die Auswahl vom Regelfall ab, färbt er sich wie ein gesetzter Chip. */
#filterKnopf.aktiv { border-color: var(--gold); color: var(--gold); }
/* Der Tafelknopf zeigt nicht «abweichend», sondern «hier stehen Sie». */
#tafelKnopf.aktiv { border-color: var(--ice); color: var(--ice); }
#filterKnopf[aria-expanded="true"] { border-color: var(--gold); color: var(--gold); }
.filterpanel { width: 284px; max-width: 86vw; }
.filterpanel .menuinhalt { max-height: 62vh; overflow-y: auto; padding: 12px; gap: 0; }
.filtergruppe + .filtergruppe { margin-top: 14px; }
.filter-titel {
  display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 8px;
}
.filter-reihe { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-reihe .chip { font-size: 12px; padding: 8px 11px; min-height: 38px; }
.filter-reihe .chip[disabled] { opacity: .4; }

/* ── Buchstaben ────────────────────────────────────────────── */
.abc-tafel {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 8px; margin-bottom: 18px;
}
.abc-kachel {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 62px; padding: 8px 4px; cursor: pointer;
  background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px;
  box-shadow: inset 0 1px 0 var(--lip);
}
.abc-kachel:active { transform: scale(.96); }
.abc-kachel.offen { border-color: var(--ice); }
/* Die sechs falschen Freunde stechen hervor — sie kosten die meiste Mühe. */
.abc-kachel.tueckisch .abc-zeichen { color: var(--bad); }
.abc-zeichen { font-family: Georgia, serif; font-size: 17px; }
.abc-laut { font-size: 11px; color: var(--dim); }
/* Ein Balken am Fuß zeigt die Stufe — dieselben Farben wie überall. */
.abc-kachel { position: relative; overflow: hidden; }
.abc-kachel::after {
  content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
  background: var(--line); transform: scaleX(0); transform-origin: left;
}
.abc-kachel.s1::after { transform: scaleX(.25); background: var(--dim); }
.abc-kachel.s2::after { transform: scaleX(.5); background: var(--ice); opacity: .6; }
.abc-kachel.s3::after { transform: scaleX(.75); background: var(--ice); }
.abc-kachel.s4::after { transform: scaleX(1); background: var(--gold); }
/* Zwei Klassen, damit die Regel die allgemeine .options-Regel schlägt — die
   steht weiter unten im Stylesheet und gewönne sonst bei gleicher Stärke. */
.options.abc-optionen { grid-template-columns: 1fr 1fr; }
.options.abc-optionen .option { min-height: 58px; font-size: 17px; }
.abc-hilfe { text-align: center; }
.abc-hilfe .word { font-size: 34px; margin-bottom: 2px; }
.abc-hilfe .fact-text { text-align: center; margin-top: 10px; }

/* ── Home ─────────────────────────────────────────────────── */
.empfehlung {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; margin-bottom: 18px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: inset 0 1px 0 var(--lip), 0 10px 22px var(--shade);
  width: 100%; text-align: left; cursor: pointer; color: inherit;
}
.empfehlung:active { transform: scale(.99); }
.empf-text { flex: 1; min-width: 0; }
.empf-label { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 5px; }
.empf-titel { display: block; font-family: Georgia, serif; font-size: 19px; line-height: 1.25; }
.empf-note { display: block; font-size: 13px; color: var(--dim); margin-top: 5px; line-height: 1.4; }

.kachelfeld { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kachel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  min-height: 116px; padding: 15px; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: inset 0 1px 0 var(--lip), 0 8px 18px var(--shade); color: var(--text);
}
.kachel:active { transform: scale(.98); }
.kachel.gesperrt { opacity: .55; }
.kachel-name { font-family: Georgia, serif; font-size: 17px; }
.kachel-note { font-size: 12px; color: var(--dim); line-height: 1.4; }
.kachel-stand { margin-top: auto; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.kachel-stand.faellig { color: var(--gold); }
.kachel .icon { width: 22px; height: 22px; color: var(--ice); }

.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
select {
  flex: 1; min-width: 140px; min-height: 44px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 14px;
}
.chip {
  padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--dim); font-size: 13px; cursor: pointer;
}
.chip.active { border-color: var(--gold); color: var(--gold); }

.paket { margin: -4px 0 14px; }
.paket-punkte { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
.pp { width: 100%; max-width: 22px; flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
.pp.s1 { background: var(--dim); }
.pp.s2 { background: var(--ice); opacity: .6; }
.pp.s3 { background: var(--ice); }
.pp.s4 { background: var(--gold); }
.paket-text { font-size: 11px; color: var(--dim); margin: 0; }
.paket-frei { color: var(--gold); }

.leer {
  border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center;
}
.leer h3 { font-family: Georgia, serif; font-size: 17px; margin: 0 0 8px; font-weight: 600; }
.leer p { font-size: 13px; color: var(--dim); line-height: 1.55; margin: 0 0 6px; }
.leer .naechste { margin-top: 14px; font-size: 13px; }
.leer .naechste span { color: var(--text); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 24px 18px; text-align: center;
  box-shadow: inset 0 1px 0 var(--lip), 0 6px 18px -12px var(--shade);
}
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 10px; color: var(--dim); }
.boxdots { display: flex; gap: 4px; }
.boxdots span { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--line); }
.boxdots span.on { background: var(--gold); border-color: var(--gold); }
.card-theme { text-transform: uppercase; letter-spacing: .12em; }

.task-label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); margin: 0 0 6px; }
.word { font-size: 30px; margin: 4px 0 6px; font-weight: 600; }
.sentence { font-size: 22px; line-height: 1.45; margin: 4px 0 12px; }
.answer { font-size: 17px; color: var(--ice); margin: 12px 0 0; }
.translit { font-size: 13px; color: var(--dim); font-style: italic; margin: 4px 0 0; }
.hint { font-size: 13px; color: var(--dim); margin-top: 12px; }

.speak {
  background: none; border: none; color: var(--ice);
  cursor: pointer; margin-left: 6px; vertical-align: middle; opacity: .85;
  min-width: 44px; min-height: 44px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.speak:active { transform: scale(.92); }
/* Nach der Auflösung beides zum Anhören — die Sprache steht am Knopf. */
.hoerzeile { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.hoerzeile .chip { display: inline-flex; align-items: center; gap: 7px; color: var(--ice); }
.hoerzeile .chip .icon { width: 17px; height: 17px; }
.tile.fn, .wordtile.fn, .key.wide { display: inline-flex; align-items: center; justify-content: center; }
.tile.fn .icon, .wordtile.fn .icon, .key.wide .icon { width: 18px; height: 18px; }

.slots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 14px 0 16px; min-height: 42px; }
.slot {
  width: 32px; height: 42px; border-bottom: 2px solid var(--line);
  font-size: 24px; display: flex; align-items: center; justify-content: center;
}
.slot.filled { border-bottom-color: var(--gold); }

.tiles { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.tile {
  min-width: 44px; min-height: 44px; padding: 10px 8px; border-radius: 10px; font-size: 20px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer;
}
.tile:active { transform: scale(.94); }
.tile.used { opacity: .18; }
.tile.fn { color: var(--dim); font-size: 16px; }

.built {
  min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  align-items: center; padding: 8px 6px; margin: 6px 0 14px; border-bottom: 1px solid var(--line);
}
.built-placeholder { font-size: 12px; color: var(--dim); }
.built-word {
  font-size: 17px; min-height: 44px; padding: 8px 12px; border-radius: 8px;
  background: var(--card-2); border: 1px solid var(--gold); color: var(--text);
}
button.built-word { cursor: pointer; }
button.built-word:active { transform: scale(.95); }
.wordtile {
  padding: 11px 13px; min-height: 44px; border-radius: 10px; font-size: 16px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer;
}
.wordtile:active { transform: scale(.95); }
.wordtile.used { opacity: .18; }
.wordtile.fn { color: var(--dim); }

.options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
.option {
  padding: 13px 14px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--text); font-size: 16px; cursor: pointer;
}
.option.picked { border-color: var(--gold); color: var(--gold); background: var(--card); }
.option.right { border-color: var(--good); color: var(--good); }
.option.wrong { border-color: var(--bad); color: var(--bad); }
.option.muted { opacity: .35; }

.feedback { margin-top: 14px; font-size: 15px; }
.feedback p, p.feedback { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.feedback .icon { width: 17px; height: 17px; }
.feedback.good { color: var(--good); }
.feedback.bad strong { color: var(--bad); font-size: 18px; }

/* Ein Wort im Satz ist ein Knopf — ohne so auszusehen. Der Satz soll ein Satz
   bleiben; erst der zarte Unterstrich verrät, dass dahinter etwas steckt. */
.satzwort {
  border: 0; background: none; padding: 0 1px; font: inherit; color: inherit;
  cursor: pointer; border-bottom: 1px dashed var(--line);
}
.satzwort:active { color: var(--ice); }

#wissenPanel { width: 300px; }
.wissen-karte {
  padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left;
}
.wissen-karte:last-child { border-bottom: 0; }
.wissen-wort { margin: 0 0 4px; font-size: 21px; display: flex; align-items: center; gap: 4px; }
.wissen-zeile { margin: 0 0 6px; font-size: 13px; color: var(--dim); }
.wissen-regel {
  margin: 0; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--gold);
}
.wissen-regel.offen { color: var(--dim); letter-spacing: 0; text-transform: none; font-size: 12px; }
.wissen-warum { margin: 6px 0 0; font-size: 13px; line-height: 1.5; }
.wissen-alle { margin-bottom: 4px; }

/* ── Grammatik ─────────────────────────────────────────────
   Das Entdecken zeigt Paare: links die Grundform, rechts, was daraus wird.
   Der Pfeil dazwischen trägt die ganze Aussage — er bekommt darum Luft. */
.gram-paare { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
.gram-paar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px; background: var(--card-2);
  border: 1px solid var(--line); font-size: 17px;
}
.gram-paar > :first-child { text-align: right; }
.gram-pfeil { color: var(--dim); font-size: 14px; }
.gram-deutung { font-size: 14px; color: var(--ice); }

/* Die Regelkarte: erst der Satz, dann die Tabelle, dann der Merksatz. */
.gram-regel { text-align: left; }
.gram-tabelle {
  display: flex; flex-direction: column; gap: 1px; margin: 16px 0 14px;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.gram-zeile {
  display: grid; grid-template-columns: minmax(74px, auto) minmax(64px, auto) 1fr;
  gap: 10px; align-items: baseline; padding: 10px 12px;
  background: var(--card-2); font-size: 13px;
}
.gram-fall { color: var(--text); }
.gram-was { color: var(--gold); font-size: 12px; }
.gram-bsp { color: var(--dim); }
.gram-merk {
  margin: 0; padding: 11px 13px; border-radius: 10px;
  border-left: 3px solid var(--gold); background: var(--card-2);
  font-family: Georgia, serif; font-size: 15px; line-height: 1.5;
}
.gram-fuss { text-align: left; margin-top: 12px; }

/* Gemeistert — eine Zeile, kein Zwischenbildschirm. Sie soll auffallen, ohne
   den Weg zur nächsten Frage zu verstellen. */
.meister {
  display: flex; align-items: center; gap: 10px; margin-top: 14px;
  padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--gold); background: var(--card-2);
  animation: meisterAuf .42s cubic-bezier(.2, .9, .3, 1);
}
.meister .icon { width: 19px; height: 19px; color: var(--gold); flex: none; }
.meister strong { display: block; font-size: 14px; color: var(--gold); }
.meister-wort { display: block; font-size: 15px; margin-top: 2px; }
.meister-note {
  display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); margin-top: 4px;
}
@keyframes meisterAuf {
  from { opacity: 0; transform: translateY(8px) scale(.97); }
  to { opacity: 1; transform: none; }
}

.chili { display: block; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); }
.chili.gross { width: 104px; height: 104px; margin: 0 auto 16px; }
.chili.klein { width: 76px; height: 76px; flex: none; margin: 0; }
.chili.winzig { width: 30px; height: 30px; flex: none; }

/* Die Figur steht im Fluss — im Platzhalter der jeweiligen Ansicht. Damit
   scrollt sie starr mit dem Inhalt; nichts wird je Bild nachgerechnet. */
/* Vor dem ersten Renderlauf steht die Figur noch im Kopf, weil das Markup sie
   dort hält. Sichtbar wird sie erst, wenn das Skript sie gesetzt hat — sonst
   blitzt sie beim Neuladen kurz neben dem Menüknopf auf. */
#chiliBuehne { position: absolute; inset: 0; pointer-events: none; visibility: hidden; }
body.chili-steht #chiliBuehne { visibility: visible; }
#chiliFigur {
  width: 100%; height: 100%; display: block;
  filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .4));
}
/* Der Sprung: ducken, Bogen, federn — kurz und schnell. */
#chiliFigur.springt { animation: chiliSprung .23s cubic-bezier(.3, .85, .4, 1); }
@keyframes chiliSprung {
  0%   { transform: translateY(0) rotate(0deg) scaleY(1); }
  14%  { transform: translateY(6px) rotate(-4deg) scaleY(.86); }
  46%  { transform: translateY(-42px) rotate(7deg) scaleY(1.08); }
  74%  { transform: translateY(3px) rotate(-3deg) scaleY(.92); }
  88%  { transform: translateY(-4px) rotate(1deg) scaleY(1.02); }
  100% { transform: translateY(0) rotate(0deg) scaleY(1); }
}
/* Die Blase kommt kurz nach der Landung — sie wächst herein, als spräche die
   Chili, statt aufzuploppen. */
.sprechblase { animation: blaseAuf .6s .26s both cubic-bezier(.2, .8, .3, 1); }
@keyframes blaseAuf {
  from { opacity: 0; transform: translateY(10px) scale(.94); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  #chiliFigur.springt, .sprechblase, .meister { animation: none; }
  .burger .strich, .menupanel { transition: none; }
}

/* Die Chili spricht: Blase oben, Figur darunter links, Zipfel dazwischen. */
.sprechblase {
  position: relative; background: var(--card); border: 1px solid var(--gold);
  border-radius: 20px; padding: 18px 18px 16px; text-align: left;
  box-shadow: inset 0 1px 0 var(--lip), 0 8px 20px -14px var(--shade);
}
.sprechblase::after {
  content: ''; position: absolute; left: 34px; bottom: -8px; width: 15px; height: 15px;
  background: var(--card); border-right: 1px solid var(--gold); border-bottom: 1px solid var(--gold);
  transform: rotate(45deg);
}
.sprechblase .fact-label { text-align: left; margin: 0 0 8px; }
.sprechblase .fact-text { font-size: 16px; }
.fakt-fuss { display: flex; align-items: center; gap: 12px; margin: 12px 0 0 16px; }
.fakt-fuss .sternbtn { margin-left: auto; }

.jubel { border-color: var(--gold); }
.jubel .word { color: var(--gold); }
.jubel .hint { margin-top: 10px; }
.fact-kopf { display: flex; align-items: center; gap: 10px; }
.fact-kopf .fact-label { flex: 1; text-align: left; margin-bottom: 0; }
.sternbtn {
  flex: none; min-width: 44px; min-height: 44px; padding: 0; margin: -10px -6px -10px 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: none; border: none; color: var(--dim); cursor: pointer;
}
.sternbtn.an { color: var(--gold); }
.sternbtn:active { transform: scale(.92); }

.faktenliste { display: flex; flex-direction: column; gap: 10px; }
.faktzeile {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: inset 0 1px 0 var(--lip);
}
.faktzeile.neu { border-style: dashed; opacity: .7; }
.fakttext { flex: 1; font-size: 14px; line-height: 1.5; }
.faktzahl { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
.fact-label { display: block; font-family: Georgia, serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.fact-text { font-size: 17px; line-height: 1.55; margin: 0; text-align: left; }

input[type="text"] {
  width: 100%; margin-top: 16px; padding: 13px; min-height: 48px; font-size: 22px; text-align: center;
  border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input[type="text"]:focus { outline: none; border-color: var(--ice); }
input.ok, textarea.ok { border-color: var(--good); }
input.err, textarea.err { border-color: var(--bad); }

/* Der getippte Satz in «Übersetzen»: größer als ein Formularfeld — er ist die
   Antwort, nicht eine Nebenangabe. Linksbündig wie im Meldeblatt: Ein Satz
   wächst beim Schreiben, und mittig zentriert rutscht er dabei unter dem
   Finger hin und her. */
#trInput {
  margin-top: 16px; font-size: 19px; text-align: left; line-height: 1.5;
  background: var(--bg); border-radius: 12px;
}
#trInput:focus { outline: none; border-color: var(--ice); }

.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 13px; min-height: 48px; border-radius: 12px; font-size: 15px;
  cursor: pointer; font-weight: 600; border: 1px solid transparent;
}
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: none; border-color: var(--line); color: var(--dim); }
.btn.danger { background: none; border-color: var(--bad); color: var(--bad); }

.gearbtn {
  background: none; border: none; color: var(--dim); padding: 0; cursor: pointer;
  min-width: 44px; min-height: 44px; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.gearbtn.active { color: var(--gold); }

.setting {
  display: flex; align-items: center; gap: 14px; padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.setting-text { flex: 1; }
.setting-title { display: block; font-size: 15px; }
.setting-note { display: block; font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
.switch {
  flex: none; width: 52px; height: 32px; padding: 3px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card-2); position: relative;
}
.switch::before {
  content: ''; position: absolute; inset: -6px; /* Trefferfläche auf 44 px vergrößern */
}
.switch .knob {
  display: block; width: 24px; height: 24px; border-radius: 50%;
  background: var(--dim); transition: transform .15s, background .15s;
}
.switch:disabled { opacity: .35; cursor: default; }
.switch.on { border-color: var(--gold); background: rgba(210, 162, 78, .18); }
.switch.on .knob { transform: translateX(20px); background: var(--gold); }
.settings-note { font-size: 12px; color: var(--dim); line-height: 1.5; margin: 16px 0 0; }
.mehr {
  display: block; margin: 12px auto 0; background: none; border: none; color: var(--ice);
  font-size: 12px; min-height: 44px; cursor: pointer; text-decoration: underline;
}
.seg { flex: none; display: flex; gap: 4px; }
.seg .chip { min-width: 44px; padding: 10px 0; text-align: center; }

.session-info { text-align: center; font-size: 12px; color: var(--dim); margin-top: 16px; }

.kb-toggle {
  display: block; margin: 16px auto 0; background: none; border: none;
  color: var(--dim); font-size: 12px; min-height: 44px; cursor: pointer; text-decoration: underline;
}
.kb-row { display: flex; gap: 4px; justify-content: center; margin-bottom: 4px; flex-wrap: wrap; }
.key {
  min-width: 27px; min-height: 44px; padding: 9px 3px; border-radius: 8px; font-size: 17px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
}
.key:active { background: var(--gold); color: var(--gold-ink); }
.key.wide { min-width: 46px; font-size: 14px; }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: center;
  box-shadow: inset 0 1px 0 var(--lip), 0 6px 18px -12px var(--shade);
}
.stat.accent { border-color: var(--gold); }
.stat-value { display: block; font-size: 25px; font-weight: 600; font-family: Georgia, serif; }
.stat.accent .stat-value { color: var(--gold); }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }

h2 { font-family: Georgia, serif; font-size: 16px; margin: 24px 0 12px; font-weight: 600; }
.boxes { display: flex; gap: 10px; align-items: flex-end; }
/* Die Kacheln der Bilanz führen in eine Detailansicht — deshalb Knöpfe. */
.stat { width: 100%; cursor: pointer; color: inherit; font: inherit; }
.stat:active { transform: scale(.98); }
.stat-mehr { display: block; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); opacity: .6; margin-top: 5px; }

/* Ringdiagramm aus Inline-SVG: je Segment ein Kreis mit eigener Strichlücke.
   Die Farben sind dieselben wie bei den Fortschrittspunkten (.pp), damit
   Stufe 3 überall gleich aussieht. */
.donut { position: relative; width: 178px; margin: 0 auto 16px; }
.donut.klein { width: 132px; margin-bottom: 10px; }
.donut svg { width: 100%; height: auto; display: block; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 13; }
.donut.klein circle { stroke-width: 15; }
.donut-grund { stroke: var(--line); opacity: .45; }
.donut-mitte {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.donut-wert { font-family: Georgia, serif; font-size: 29px; line-height: 1; }
.donut.klein .donut-wert { font-size: 22px; }
.donut-text {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
  margin-top: 5px; text-align: center; padding: 0 10px;
}
.donut-paar { display: flex; gap: 12px; justify-content: center; margin-bottom: 8px; }
.donut-paar > div { flex: 1; max-width: 160px; }

.legende { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }
.leg { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.leg i { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.leg .leg-name { flex: 1; color: var(--dim); }
.leg .leg-wert { font-variant-numeric: tabular-nums; }

.detail-fuss { font-size: 13px; color: var(--dim); line-height: 1.55; margin: 0 0 18px; }

.boxstat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.boxbar-wrap { height: 90px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.boxbar { width: 55%; background: var(--ice); border-radius: 5px 5px 0 0; min-height: 4px; opacity: .85; }
.boxbar.gold { background: var(--gold); opacity: 1; }
.boxnum { font-size: 13px; font-weight: 600; }
.boxlabel { font-size: 10px; color: var(--dim); }

.theme-list { display: flex; flex-direction: column; gap: 8px; }
.theme-row { display: grid; grid-template-columns: 112px 1fr 46px; gap: 8px; align-items: center; font-size: 12px; }
.theme-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.theme-bar { height: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.theme-fill { height: 100%; background: var(--gold); }
.theme-count { text-align: right; color: var(--dim); }

.backup-note { font-size: 12px; color: var(--dim); margin: 0 0 4px; }
textarea {
  width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  /* 16 px ist die Grenze, unter der iOS beim Antippen heranzoomt. */
  font-size: 16px; font-family: monospace; resize: vertical; word-break: break-all;
}
textarea:focus { outline: none; border-color: var(--ice); }
.danger-zone { margin-top: 34px; }

/* Tickets: Eingabefelder für Fließtext statt für Kennungen und Codes. */
input.zeile {
  font-size: 16px; text-align: left; margin-top: 12px; padding: 12px; min-height: 44px;
  background: var(--card-2);
}
textarea.fliess { font-family: inherit; word-break: normal; line-height: 1.5; background: var(--card-2); }
.tkliste { display: flex; flex-direction: column; gap: 10px; }
.tkzeile {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: inset 0 1px 0 var(--lip);
}
.tkzeile.gesendet { opacity: .6; }
/* Die Zeile ist ein Knopf: Antippen holt das Ticket zum Bearbeiten zurück. */
.tktext {
  flex: 1; font-size: 14px; line-height: 1.45; min-width: 0; min-height: 44px;
  border: 0; background: none; color: var(--text); font-family: inherit;
  text-align: left; padding: 0; cursor: pointer;
}
.tktext:active { opacity: .6; }
.tkmeta { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
.tkart {
  display: inline-block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; margin-right: 8px; color: var(--dim);
}
.tkart.bug { border-color: var(--bad); color: var(--bad); }
.tkart.feature { border-color: var(--ice); color: var(--ice); }
.tksenden {
  flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--gold); background: var(--gold); color: var(--gold-ink);
  font-size: 13px; text-decoration: none;
}
.tkzeile.gesendet .tksenden { background: none; color: var(--dim); border-color: var(--line); }

/* ── Melden ────────────────────────────────────────────────
   Der Knopf schwebt unten rechts; der Fußabstand des Körpers hält ihm den
   Platz frei, damit er nie über einer Knopfzeile liegt. */
#meldeKnopf {
  position: fixed; z-index: 50;
  right: calc(16px + env(safe-area-inset-right));
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 52px; height: 52px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--card-2); color: var(--dim);
  cursor: pointer; box-shadow: 0 8px 22px var(--shade), inset 0 1px 0 var(--lip);
  transition: transform .2s, opacity .2s;
}
#meldeKnopf .icon { width: 23px; height: 23px; }
#meldeKnopf:active { transform: scale(.93); }
body.melden-offen #meldeKnopf { opacity: 0; pointer-events: none; transform: scale(.8); }
/* Ein liegen gebliebener Entwurf zeigt sich am Knopf — sonst wäre er vergessen. */
#meldeKnopf.hat-entwurf { border-color: var(--gold); color: var(--gold); }
#meldeKnopf.hat-entwurf::after {
  content: ''; position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
}

#meldeHof {
  position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, .38);
  opacity: 0; transition: opacity .28s;
}
#meldeHof[hidden] { display: none; }
body.melden-offen #meldeHof { opacity: 1; }

#meldeBlatt {
  position: fixed; z-index: 60; left: 0; right: 0; bottom: 0;
  margin: 0 auto; max-width: 560px;
  padding: 8px var(--pad-rechts) calc(16px + env(safe-area-inset-bottom)) var(--pad-links);
  background: var(--card); border: 1px solid var(--line); border-bottom: none;
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -14px 40px var(--shade), inset 0 1px 0 var(--lip);
  transform: translateY(110%);
  transition: transform .34s cubic-bezier(.25, .9, .3, 1);
  touch-action: none;   /* das Blatt zieht selbst, es soll nicht mitscrollen */
}
body.melden-offen #meldeBlatt { transform: translateY(0); }
/* Während der Finger zieht, folgt das Blatt sofort — erst beim Loslassen
   federt es mit Übergang zurück. */
#meldeBlatt.zieht { transition: none; }
.blatt-griff {
  width: 42px; height: 5px; border-radius: 999px; background: var(--line);
  margin: 4px auto 12px;
}
.blatt-inhalt { display: block; }
#meldeBlatt .btn-row { margin-top: 14px; }

.bezug {
  display: flex; align-items: center; gap: 12px;
  margin-top: 14px; min-height: 44px; cursor: pointer;
}
.bezug input { position: absolute; opacity: 0; width: 0; height: 0; }
.bezug-kasten {
  flex: none; width: 24px; height: 24px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.bezug-kasten::after {
  content: ''; width: 11px; height: 6px; margin-top: -3px;
  border-left: 2px solid var(--gold-ink); border-bottom: 2px solid var(--gold-ink);
  transform: rotate(-45deg) scale(.6); opacity: 0; transition: opacity .15s, transform .15s;
}
.bezug input:checked + .bezug-kasten { background: var(--gold); border-color: var(--gold); }
.bezug input:checked + .bezug-kasten::after { opacity: 1; transform: rotate(-45deg) scale(1); }
.bezug-text { font-size: 14px; color: var(--dim); }
.bezug input:checked ~ .bezug-text strong { color: var(--gold); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

// ── FORMENMASCHINE ──────────────────────────────────────────
// Der Kern des Grammatikteils: Aus Grundform und Rolle die Form rechnen.
// «книга» + Akkusativ → «книгу». Regeln, keine Tabelle — nur so lässt sich eine
// Regel auf ein Wort anwenden, das nie in dieser Form dastand.
//
// `tools/build.mjs` lässt diese Maschine jede in den Sätzen vermerkte Form
// nachbauen und bricht ab, wenn eine abweicht. Die Grammatik ist damit nicht
// behauptet, sondern nachgewiesen (ADR 0030).

// Wortart und Geschlecht aus der Endung. Dieselbe Regel wie im Build — sie
// steht zweimal, weil der Build ohne die App laufen können muss; genau dafür
// prüft er beide gegeneinander.
//   m männlich · mb männlich belebt · w weiblich · s sächlich
//   pl nur Mehrzahl · v Verb · a Adjektiv · - keine Formenlehre
function wortartRegel(ru) {
  if (/(ться|ть)$/.test(ru)) return 'v';
  if (/(ый|ий|ой|ая|яя|ое|ее)$/.test(ru)) return 'a';
  if (/[ая]$/.test(ru)) return 'w';
  if (/[оеё]$/.test(ru)) return 's';
  if (/[бвгджзйклмнпрстфхцчшщй]$/.test(ru)) return 'm';
  return '';
}

// Ist das ein Nomen, dessen Formen die Maschine bilden kann?
function istNomen(art) { return art === 'm' || art === 'mb' || art === 'w' || art === 's'; }

// Das Geschlecht ohne die Belebtheit — für Anzeige und Abfrage.
function geschlecht(art) { return art === 'mb' ? 'm' : art; }

var GESCHLECHT_NAME = { m: 'männlich', w: 'weiblich', s: 'sächlich' };

// Nach к г х ж ч ш щ steht nie ы — dort schreibt man и. Die Regel greift in
// mehreren Fällen; sie steht hier einmal und wird von dort benutzt.
function nachZischlaut(stamm) { return /[кгхжчшщ]$/.test(stamm); }

// Akkusativ Einzahl: das Ziel der Handlung.
//   weiblich -а → -у, -я → -ю
//   sächlich und unbelebt männlich bleiben, wie sie sind
//   belebt männlich nimmt -а (eigener Baustein, hier schon richtig gerechnet)
function akkusativ(ru, art) {
  if (art === 'w') {
    if (/а$/.test(ru)) return ru.slice(0, -1) + 'у';
    if (/я$/.test(ru)) return ru.slice(0, -1) + 'ю';
    return ru;                       // auf -ь: дверь bleibt дверь
  }
  if (art === 'mb') {
    if (/[йь]$/.test(ru)) return ru.slice(0, -1) + 'я';
    return ru + 'а';
  }
  return ru;                         // m unbelebt, s
}

// Die eine Tür nach draußen. Rollen kommen einzeln dazu, je Baustein.
function grammForm(ru, art, rolle) {
  if (rolle === 'akk') return akkusativ(ru, art);
  return null;
}

// aus VOCAB_THEMES abgeleitet, kein Inhalt
var ALL_VOCAB = [];
var VOKABEL = {};
Object.keys(VOCAB_THEMES).forEach(function (theme) {
  VOCAB_THEMES[theme].forEach(function (w) {
    // Kennung ist das russische Wort selbst — unabhängig vom Themennamen,
    // damit ein Umbenennen den Lernstand nicht löscht.
    // Das vierte Feld steht nur da, wo die Endung die Wortart nicht verrät
    // oder falsch verrät; sonst rechnet sie `wortart()` aus (ADR 0030).
    var v = {
      id: w[0], theme: theme, ru: w[0], de: w[1], tr: w[2],
      art: w[3] || wortartRegel(w[0]), nr: ALL_VOCAB.length
    };
    ALL_VOCAB.push(v);
    VOKABEL[v.id] = v;
  });
});

var BOX_MAX = 4;
// Ab dieser Leitner-Stufe gilt ein Wort als sitzend: Sätze werden damit
// freigeschaltet, Lernsets damit abgeschlossen.
var SATZ_STUFE = 2;
var STORAGE_KEY = 'russisch_trainer_v1';
// Stand der ausgelieferten Datei. Wird von tools/build.mjs gesetzt und geht in
// jedes Ticket ein, damit ein Bericht sagt, welcher Stand gemeint war.
var APP_STAND = '2026-08-05'; /* == STAND == */

// ── Maskottchen ─────────────────────────────────────────────
// Die freigestellte Chili gibt es genau einmal: als #chiliFigur (geschnitten
// mit tools/freistellen.py aus dem Icon). Eine Ansicht sagt mit einem
// Platzhalter nur, wo die Figur stehen soll — dorthin wird sie umgehängt.
function maskottchen(klasse) {
  var groesse = klasse === 'gross' ? 104 : klasse === 'klein' ? 76 : 30;
  return '<div class="chili-platz" data-chili style="width:' + groesse + 'px;height:' + groesse + 'px' +
    (klasse === 'gross' ? ';margin:0 auto 16px' : '') + '"></div>';
}

// ── Die wandernde Chili ─────────────────────────────────────
// Es gibt genau eine Figur. Sie steht *im Fluss* — in dem Platzhalter, den die
// aktuelle Ansicht für sie aufstellt. Beim Wechsel wird sie umgehängt und
// springt einmal. Nichts wird je Bild nachgerechnet: damit scrollt sie starr
// mit dem Inhalt statt hinterherzuhinken.
var chiliBuehne = document.getElementById('chiliBuehne');
var chiliFigur = document.getElementById('chiliFigur');
var chiliStation = null; // Platzhalter, in dem die Figur gerade steckt
var chiliZeitgeber = null;
var chiliSpur = null;    // letzte bekannte Lage, in Dokumentkoordinaten

// Dokumentkoordinaten statt Viewport: die Figur steht im Fluss und scrollt mit,
// ihre Lage im Dokument bleibt also gültig, auch wenn zwischendurch gescrollt
// wurde. Ist der Platz unsichtbar (Breite 0), gibt es keine Lage.
function chiliLage(el) {
  var r = el.getBoundingClientRect();
  if (!r.width) return null;
  // Der Mittelpunkt, nicht die Ecke: «scale» wirkt um die Mitte, und bei
  // wechselnder Größe lägen die Ecken sonst um die halbe Differenz daneben.
  return {
    x: r.left + r.width / 2 + (window.pageXOffset || document.documentElement.scrollLeft || 0),
    y: r.top + r.height / 2 + (window.pageYOffset || document.documentElement.scrollTop || 0),
    b: r.width
  };
}

// Der eigentliche Sprung: die Figur startet dort, wo sie stand, und fliegt in
// einem Bogen zum neuen Platz. Waagerecht gleichförmig, senkrecht eine Parabel
// darüber — das ist ein Wurf. Das Ducken und Federn steuert weiterhin die
// Keyframe-Animation auf der Figur; hier bewegt sich nur die Hülle.
function chiliFlug(vorher, jetzt) {
  if (!vorher || !jetzt || !chiliBuehne.animate) return;
  try {
    // Ein noch laufender Flug würde sich mit dem neuen überlagern — und weil
    // beide «backwards» füllen, stünde die Figur irgendwo dazwischen.
    chiliBuehne.getAnimations().forEach(function (a) { a.cancel(); });
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var dx = vorher.x - jetzt.x;
    var dy = vorher.y - jetzt.y;
    var ds = vorher.b / jetzt.b;
    var weite = Math.sqrt(dx * dx + dy * dy);
    // Zu kurz lohnt nicht, zu weit heißt: die alte Lage ist veraltet.
    if (weite < 8 || weite > 900) return;
    var bogen = Math.min(46, 14 + weite * 0.12);
    var bilder = [];
    for (var i = 0; i <= 8; i++) {
      var t = i / 8;
      var x = dx * (1 - t);
      var y = dy * (1 - t) - bogen * 4 * t * (1 - t);
      var g = ds + (1 - ds) * t;
      bilder.push({
        transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + g.toFixed(3) + ')'
      });
    }
    // Verzögerung und Dauer greifen in die Figur-Animation: erst ducken
    // (bis 14 % von 0,23 s), dann fliegen, am Ende federn.
    chiliBuehne.animate(bilder, {
      duration: 190, delay: 30, easing: 'linear', fill: 'backwards'
    });
  } catch (e) { /* ohne Flug bleibt der Hüpfer */ }
}

// Wo steht die Figur? Drei Regeln, in dieser Reihenfolge:
//  1. Ist das Menü aufgeklappt, gehört sie in den Knopf — die Striche stehen
//     dann unten, er wäre sonst ein leerer Kreis.
//  2. Stellt die Ansicht einen Platz auf (Karte, Empfehlung, Leerzustand),
//     gehört sie dorthin.
//  3. Sonst: im Menübereich in den Knopf, überall sonst in den Kopf.
function chiliPlatzhalter() {
  var knopf = document.getElementById('chiliKnopf');
  if (menuOffen) return knopf;
  var inhalt = main.querySelector('[data-chili]');
  if (inhalt) return inhalt;
  return imMenu(currentTab) ? knopf : document.getElementById('chiliPlatz');
}

function chiliAktualisieren(ohneSprung) {
  if (!chiliBuehne) return;
  var platz = chiliPlatzhalter();
  if (!platz) return;
  // Der Knopf zeigt seinen ruhenden Punkt nur, solange er die Figur nicht
  // trägt — das gilt auch, wenn sich sonst nichts geändert hat.
  document.getElementById('menuKnopf')
    .classList.toggle('mit-chili', platz.id === 'chiliKnopf');
  if (platz === chiliStation) return;
  var ersterAuftritt = chiliStation === null;
  // Die alte Station lässt sich nur messen, solange sie im Dokument hängt —
  // nach einem Ansichtswechsel ist sie fort, dann trägt die gemerkte Lage.
  var vorher = chiliStation && document.contains(chiliStation)
    ? chiliLage(chiliStation) : chiliSpur;
  chiliStation = platz;
  platz.appendChild(chiliBuehne);
  document.body.classList.add('chili-steht');
  var jetzt = chiliLage(platz);
  if (jetzt) chiliSpur = jetzt;
  if (ersterAuftritt || ohneSprung) return;

  chiliFlug(vorher, jetzt);

  chiliFigur.classList.remove('springt');
  void chiliFigur.offsetWidth; // Neustart der Sprunganimation erzwingen
  chiliFigur.classList.add('springt');
  if (chiliZeitgeber) clearTimeout(chiliZeitgeber);
  chiliZeitgeber = setTimeout(function () {
    chiliFigur.classList.remove('springt');
  }, 300);
}

// ── Töne ────────────────────────────────────────────────────
// Zwei kurze Rückmeldungen nach Gehör: aufsteigende Terz für richtig, ein
// tiefer, fallender Ton für falsch. Erzeugt wird der Klang im Browser —
// Klangdateien verbieten sich in einer einzelnen Datei ohne externe Ressourcen.
// iOS gibt Ton erst nach einer Nutzergeste frei und schweigt im
// Stummschalter-Modus; beides ist unkritisch, weil der Ton nur begleitet.
var tonWerk = null;

// Der Kontext schläft ein — und zwar auf zwei Arten. `suspended` kennt jeder
// Browser; Safari kennt zusätzlich `interrupted` (Anruf, Siri, Sperrbildschirm,
// Wechsel des Stummschalters). Wer nur auf `suspended` prüft, hat nach dem
// ersten Anruf für immer Ruhe — genau dieser Fehler war da (ADR 0026).
function tonSchlaeft(werk) {
  return werk.state === 'suspended' || werk.state === 'interrupted';
}

// **Der Stummschalter.** Ohne Zutun läuft Webton auf iOS in der Sitzungsart
// «ambient» — und die schweigt, sobald der seitliche Schalter auf stumm steht.
// In der Home-Bildschirm-App fällt das doppelt auf, weil man sie oft aufmacht,
// ohne vorher etwas zu hören. `navigator.audioSession` (Safari ab 16.4) hebt
// das auf: «transient» ist genau für kurze Rückmeldungen gedacht — sie klingen
// trotz Stummschalter und drängen laufende Musik nur für den Augenblick weg,
// statt sie anzuhalten (ADR 0027).
var tonSitzungGesetzt = false;
function tonSitzung() {
  if (tonSitzungGesetzt) return;
  try {
    if (!navigator.audioSession) return;
    navigator.audioSession.type = 'transient';
    // Kennt die Fassung «transient» nicht, bleibt der alte Wert stehen; dann
    // ist «playback» die nächstbeste Wahl.
    if (navigator.audioSession.type !== 'transient') {
      navigator.audioSession.type = 'playback';
    }
    tonSitzungGesetzt = true;
  } catch (e) {}
}

// Aufwecken darf jeder Tipp, nicht erst eine Antwort: `resume()` braucht auf
// iOS eine Nutzergeste, und die Antwort selbst kommt dafür zu spät — sie soll
// ja schon klingen.
function tonWecken() {
  if (!tonWerk) return;
  tonSitzung();
  try { if (tonSchlaeft(tonWerk)) tonWerk.resume(); } catch (e) {}
}

// Der erste Tipp irgendwo in der App richtet den Klang ein: Sitzungsart setzen,
// Kontext anlegen, wecken und einen unhörbaren Puffer abspielen. Erst dieses
// Abspielen **innerhalb einer Geste** gibt iOS den Ton wirklich frei; ohne das
// bleibt der Kontext zwar «running», liefert aber nichts.
var tonEntsperrt = false;
function tonEntsperren() {
  if (tonEntsperrt || !state.settings.ton) return;
  tonSitzung();
  var werk = tonBereit();
  if (!werk) return;
  tonEntsperrt = true;
  try {
    if (tonSchlaeft(werk)) werk.resume();
    var puffer = werk.createBuffer(1, 1, werk.sampleRate || 22050);
    var quelle = werk.createBufferSource();
    quelle.buffer = puffer;
    quelle.connect(werk.destination);
    quelle.start(0);
  } catch (e) { /* auch ohne Freigabe läuft die App weiter */ }
}

// Was der Klang gerade macht — für die Selbstauskunft in den Einstellungen.
// Ohne sie bliebe bei «kein Ton» nur Raten: Schalter aus, Kontext schlafend,
// Stummschalter oder gar keine Unterstützung sehen von außen gleich aus.
function tonAuskunft() {
  var teile = [];
  teile.push(state.settings.ton ? 'Einstellung an' : 'Einstellung aus');
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return teile.concat(['kein Web-Audio']).join(' · ');
  teile.push(tonWerk ? 'Kontext ' + tonWerk.state : 'Kontext noch nicht angelegt');
  teile.push(tonEntsperrt ? 'freigegeben' : 'noch nicht freigegeben');
  try {
    teile.push(navigator.audioSession
      ? 'Sitzung ' + navigator.audioSession.type
      : 'ohne Sitzungssteuerung — Stummschalter hat Vorrang');
  } catch (e) { teile.push('Sitzung unbekannt'); }
  return teile.join(' · ');
}

function tonBereit() {
  if (!state.settings.ton) return null;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!tonWerk) tonWerk = new AC();
    return tonWerk;
  } catch (e) { return null; }
}

// Eine Note: ein Oszillator, eine Hüllkurve. Schlicht und gewollt so — der
// glasige Glockenklang aus mehreren Teiltönen wurde erprobt und wieder
// verworfen; der einfache Zweiklang trifft besser (ADR 0028).
function tonNote(werk, start, freq, typ, laut, dauer) {
  var o = werk.createOscillator();
  var g = werk.createGain();
  o.type = typ;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(laut, start + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dauer);
  o.connect(g);
  g.connect(werk.destination);
  o.start(start);
  o.stop(start + dauer + 0.05);
}

function tonSpielen(werk, richtig) {
  // Immer mit Vorlauf planen. Genau auf `currentTime` liegt der Anfang der
  // Hüllkurve schon in der Vergangenheit, wenn der Kontext gerade erst
  // aufgewacht ist — dann steht der Pegel sofort am Endwert und man hört nichts.
  var jetzt = werk.currentTime + 0.02;
  // je Note: Frequenz in Hz, Einsatz in Sekunden
  var noten = richtig ? [[880, 0], [1318.5, 0.09]] : [[196, 0], [155.6, 0.11]];
  var typ = richtig ? 'sine' : 'triangle';
  var laut = richtig ? 0.16 : 0.11;
  var dauer = richtig ? 0.17 : 0.22;
  noten.forEach(function (note) {
    tonNote(werk, jetzt + note[1], note[0], typ, laut, dauer);
  });
}

function ton(richtig) {
  var werk = tonBereit();
  if (!werk) return;
  try {
    if (tonSchlaeft(werk)) {
      // Erst wecken, dann spielen — nicht beides gleichzeitig. `resume()` ist
      // asynchron; wer sofort danach plant, plant in eine stehende Zeit.
      var p = werk.resume();
      if (p && p.then) {
        p.then(function () { try { tonSpielen(werk, richtig); } catch (e) {} }, function () {});
      }
      return;
    }
    tonSpielen(werk, richtig);
  } catch (e) { /* Ton ist Beiwerk, nie Voraussetzung */ }
}

// Ein besonderer Klang für den Augenblick, in dem etwas fertig gelernt ist:
// derselbe Sinus wie bei «richtig», nur als aufsteigender Vierklang. Er soll
// als Verwandter des gewöhnlichen «richtig» hörbar sein, nicht als Fremdkörper.
function tonMeister() {
  var werk = tonBereit();
  if (!werk) return;
  try {
    var spiel = function () {
      var jetzt = werk.currentTime + 0.02;
      [[880, 0], [1108.7, 0.075], [1318.5, 0.15], [1760, 0.225]].forEach(function (n) {
        tonNote(werk, jetzt + n[1], n[0], 'sine', 0.15, 0.2);
      });
    };
    if (tonSchlaeft(werk)) {
      var p = werk.resume();
      if (p && p.then) p.then(function () { try { spiel(); } catch (e) {} }, function () {});
      return;
    }
    spiel();
  } catch (e) {}
}

// ── Tickets ─────────────────────────────────────────────────
// Fehler und Wünsche werden hier gesammelt und bleiben auf dem Gerät. Ein
// Knopf bündelt sie zu einem Text, den man kopiert und Claude Code vorlegt.
// Nichts wird verschickt, nichts geladen — die App braucht dafür weder Netz
// noch einen Zugangsschlüssel, und fremde Besucher der öffentlichen Seite
// sehen ihren eigenen, leeren Speicher.
// Eigener Speicherschlüssel, damit der Sicherungscode schlank bleibt.
var TICKET_KEY = 'chillingo_tickets_v1';
var tickets = [];

function ticketsLaden() {
  try {
    var roh = localStorage.getItem(TICKET_KEY);
    var d = roh ? JSON.parse(roh) : null;
    tickets = (d && Object.prototype.toString.call(d.tickets) === '[object Array]') ? d.tickets : [];
  } catch (e) {
    tickets = [];
  }
  // Frühere Stände kannten «gesendet» (an GitHub). Jetzt heißt der Zustand
  // «übergeben» — an Claude Code weitergereicht.
  tickets.forEach(function (t) {
    if (t.uebergeben === undefined) t.uebergeben = t.gesendet || null;
    delete t.gesendet;
  });
}

function ticketsSichern() {
  try {
    localStorage.setItem(TICKET_KEY, JSON.stringify({ tickets: tickets }));
    zeigeStatus('ok', 'gespeichert');
  } catch (e) {
    zeigeStatus('err', 'Ticket nicht gespeichert — Speicher voll oder privater Modus.');
  }
}

function datumKurz(ms) {
  try { return new Date(ms).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }); }
  catch (e) { return ''; }
}
function datumLang(ms) {
  try { return new Date(ms).toISOString().slice(0, 16).replace('T', ' ') + ' UTC'; }
  catch (e) { return ''; }
}

// Ein Ticket als Textabschnitt. Markdown, weil das gebündelt gut lesbar ist —
// für mich beim Überfliegen wie für Claude Code beim Abarbeiten.
function ticketAbschnitt(t, nr) {
  return '## ' + nr + ' · ' + (t.art === 'bug' ? 'Fehler' : 'Wunsch') + ': ' + t.titel + '\n\n' +
    (t.text ? t.text + '\n\n' : '') +
    (t.reiter ? '- Übung: ' + t.reiter + '\n' : '') +
    '- App-Stand: ' + t.stand + '\n' +
    '- Erstellt: ' + datumLang(t.erstellt) + '\n' +
    (t.geaendert ? '- Geändert: ' + datumLang(t.geaendert) + '\n' : '');
}

// Alles in einem Rutsch: älteste zuerst, damit die Nummern der Reihenfolge
// folgen, in der die Dinge aufgefallen sind. Das Gerät steht einmal am Ende
// statt bei jedem Ticket — es ist ohnehin immer dasselbe.
function ticketsAlsText(liste) {
  if (!liste.length) return '';
  var reihe = liste.slice().sort(function (a, b) { return a.erstellt - b.erstellt; });
  var kopf = '# Chillingo · ' + reihe.length + (reihe.length === 1 ? ' Ticket' : ' Tickets') + '\n\n';
  var koerper = reihe.map(function (t, i) { return ticketAbschnitt(t, i + 1); }).join('\n');
  return kopf + koerper + '\n---\nGerät: ' + reihe[reihe.length - 1].geraet + '\n';
}

function ticketsOffen() {
  return tickets.filter(function (t) { return !t.uebergeben; });
}

// Ein vorhandenes Ticket ändern. Erstellt bleibt erstellt — die Reihenfolge
// soll sich beim Nachbessern nicht verschieben.
function ticketAendern(id, art, titel, text, reiter) {
  var t = tickets.filter(function (x) { return x.id === id; })[0];
  if (!t) return null;
  t.art = art === 'bug' ? 'bug' : 'feature';
  t.titel = String(titel).replace(/^\s+|\s+$/g, '').slice(0, 120);
  t.text = String(text).replace(/\s+$/, '').slice(0, 4000);
  t.reiter = reiter || '';
  t.geaendert = Date.now();
  // Ein geändertes Ticket ist wieder offen: Was übergeben wurde, stimmt so
  // nicht mehr, und die neue Fassung soll beim nächsten Bündeln mitgehen.
  t.uebergeben = null;
  ticketsSichern();
  return t;
}

function ticketAnlegen(art, titel, text, reiter) {
  var geraet = '';
  try { geraet = String(navigator.userAgent).slice(0, 180); } catch (e) {}
  // Zwei Tickets in derselben Millisekunde wären in der Reihenfolge nicht mehr
  // zu unterscheiden. Der Zeitstempel rückt darum notfalls um eins vor — damit
  // ist er streng steigend und jede Sortierung danach eindeutig.
  var jetzt = Date.now();
  tickets.forEach(function (x) { if (x.erstellt >= jetzt) jetzt = x.erstellt + 1; });
  var t = {
    id: Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36),
    art: art === 'bug' ? 'bug' : 'feature',
    // Getrimmt wird hier, nicht erst im Formular: sonst hinge der Rand
    // ungewollt in der Überschrift des gebündelten Textes.
    titel: String(titel).replace(/^\s+|\s+$/g, '').slice(0, 120),
    text: String(text).replace(/\s+$/, '').slice(0, 4000),
    // Ohne Bezug bleibt das Feld leer — der gebündelte Text lässt die Zeile
    // dann weg, statt «null» zu behaupten.
    reiter: reiter ? ansichtName(reiter) : '',
    stand: APP_STAND,
    geraet: geraet,
    erstellt: jetzt,
    uebergeben: null
  };
  tickets.unshift(t);
  ticketsSichern();
  return t;
}

// In die Zwischenablage legen. Klappt das nicht (kein sicherer Kontext, keine
// Berechtigung), bleibt der Text sichtbar zum Markieren von Hand — deshalb ist
// das Ergebnis nur eine Meldung, nie eine Voraussetzung.
function inZwischenablage(text) {
  try {
    navigator.clipboard.writeText(text).then(function () {
      zeigeStatus('ok', 'kopiert');
    }, function () {
      zeigeStatus('err', 'Kopieren nicht erlaubt — bitte den Text unten markieren.');
    });
  } catch (e) {
    zeigeStatus('err', 'Kopieren nicht möglich — bitte den Text unten markieren.');
  }
}

// ── Symbole ─────────────────────────────────────────────────
// Inline-SVG statt Unicode-Glyphen: iOS rendert Zeichen aus dem Emoji-Bereich
// (etwa das Zahnrad U+2699) als farbige Grafik, die sich nicht einfügt.
// Alles einfarbig über currentColor, damit es jede Umgebung mitnimmt.
function svg(inhalt) {
  return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ' +
    'aria-hidden="true" focusable="false">' + inhalt + '</svg>';
}
var ICON = {
  // Schieberegler statt Zahnrad: als Umriss eindeutiger — ein kleines Zahnrad
  // zerfällt bei 20 px zu einem Stern.
  regler: svg('<path d="M3.5 8h8M15.5 8h5M3.5 16h4M11.5 16h9"/>' +
    '<circle cx="13.5" cy="8" r="2.4"/><circle cx="9.5" cy="16" r="2.4"/>'),
  lautsprecher: svg('<path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path d="M15.4 9.2a4 4 0 0 1 0 5.6"/>' +
    '<path d="M17.9 6.7a7.5 7.5 0 0 1 0 10.6"/>'),
  ruecktaste: svg('<path d="M8.4 5.5h11a1.6 1.6 0 0 1 1.6 1.6v9.8a1.6 1.6 0 0 1-1.6 1.6h-11L2.8 12z"/>' +
    '<path d="M14.6 9.6l-4.4 4.8M10.2 9.6l4.4 4.8"/>'),
  haken: svg('<path d="M4.5 12.8l4.6 4.6L19.5 7"/>'),
  stern: svg('<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>'),

// ── Sprachfakten ────────────────────────────────────────────
// Kurze, stabile Kennung je Fakt (Hash über den Text) — überlebt Umsortieren
// und hält den Sicherungscode klein.
function faktId(text) {
  var h = 0;
  for (var i = 0; i < text.length; i++) {
    h = (h * 31 + text.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(36);
}
function faktStand(text) {
  return state.fakten[faktId(text)] || { n: 0, f: false };
}
function faktGezeigt(text) {
  var id = faktId(text);
  var e = state.fakten[id] || { n: 0, f: false };
  e.n++;
  state.fakten[id] = e;
}
function faktFavorit(text) {
  var id = faktId(text);
  var e = state.fakten[id] || { n: 0, f: false };
  e.f = !e.f;
  state.fakten[id] = e;
  save();
  return e.f;
}
// Zeigt zuerst Ungesehenes, dann das am seltensten Gezeigte.
function naechsterFakt() {
  var sortiert = FACTS.slice().sort(function (a, b) {
    return faktStand(a).n - faktStand(b).n;
  });
  var wenigsten = faktStand(sortiert[0]).n;
  var kandidaten = sortiert.filter(function (f) { return faktStand(f).n === wenigsten; });
  return kandidaten[Math.floor(Math.random() * kandidaten.length)];
}

// ── Hilfsfunktionen ─────────────────────────────────────────
function normalize(s) {
  return (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function tokenize(sentence) {
  return sentence.replace(/[.,!?;:]/g, '').split(/\s+/).filter(Boolean);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// Vorlesen — russisch, wenn nichts anderes gesagt wird. iOS braucht dafür eine
// Nutzergeste, liefert Stimmen verzögert und schweigt im Stummschalter-Modus;
// kein Ablauf darf davon abhängen, darum alles in try/catch und ohne Rückgabe.
function speak(text, sprache) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = sprache === 'de' ? 'de-DE' : 'ru-RU';
    // Deutsch liest man mit, Russisch buchstabiert man mit — darum langsamer.
    u.rate = sprache === 'de' ? 0.95 : 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

// Ein Hörknopf, überall derselbe: Der Text hängt am Knopf, ein einziger
// Zuhörer auf #main fängt jeden Tipp ab — so muss keine Ansicht daran denken,
// ihre Knöpfe zu verdrahten.
function hoerknopf(text, sprache) {
  if (!text) return '';
  return '<button class="speak" data-say="' + esc(text) + '" data-lang="' +
    (sprache === 'de' ? 'de' : 'ru') + '" aria-label="Anhören' +
    (sprache === 'de' ? ', deutsch' : ', russisch') + '">' + ICON.lautsprecher + '</button>';
}

// Nach der Auflösung beide Seiten zum Anhören. Beschriftet, weil zwei gleiche
// Lautsprecher nebeneinander nicht sagen, welcher welche Sprache spricht.
function hoerzeile(ru, de) {
  var chip = function (text, sprache, name) {
    return '<button class="chip" data-say="' + esc(text) + '" data-lang="' + sprache + '">' +
      ICON.lautsprecher + name + '</button>';
  };
  return '<div class="hoerzeile">' + (ru ? chip(ru, 'ru', 'Russisch') : '') +
    (de ? chip(de, 'de', 'Deutsch') : '') + '</div>';
}

// ── Zustand & Speichern (localStorage) ──────────────────────
function defaultSettings() {
  return {
    confirmUeben: true,        // beim Vokabeltraining erst auswählen, dann bestätigen
    confirmUebersetzen: true,  // in «Übersetzen» erst legen, dann bestätigen
    requireComplete: false,    // Bestätigen erst bei vollständiger Lösung
    tippenStufe: 3,            // ab welcher Leitner-Stufe ein Wort im Tippen erscheint
    auffrischen: 21,           // Tage, bis Fertiges zur Sicherheit noch einmal drankommt
    tastaturAn: false,         // eingebaute Tastatur in «Tippen» beim Start zeigen
    darstellung: 'system',     // 'system' · 'dunkel' · 'hell'
    ton: true                  // kurzer Klang bei richtig und falsch
  };
}
function defaultState() {
  return {
    boxes: {},
    lastSeen: {},              // Zeitstempel je Wort, Grundlage der Fälligkeit
    typingStats: { correct: 0, wrong: 0 },
    transStats: { correct: 0, wrong: 0 },
    satzBox: {},               // Leitner-Stufe je Satz, Kennung ist der russische Satz
    satzSeen: {},              // Zeitstempel je Satz, Grundlage der Fälligkeit
    abcBox: {},                // Leitner-Stufe je Buchstabe — freiwillig, eigener Topf
    abcSeen: {},               // Zeitstempel je Buchstabe
    // Grammatik: die Karteikarte ist die **Regel**, nicht das Wort. Gemeistert
    // ist eine Regel, wenn sie viermal auf verschiedene Wörter gewirkt hat.
    gramBox: {},               // Leitner-Stufe je Baustein
    gramSeen: {},              // Zeitstempel je Baustein; fehlt er, ist er noch unentdeckt
    streak: 0,
    bestStreak: 0,
    answered: 0,
    factIdx: 0,
    fakten: {},                // je Fakt: { n: wie oft gezeigt, f: Favorit }
    settings: defaultSettings()
  };
}
// Gespeicherten Stand mit den Vorgaben verschmelzen: fehlende Felder behalten
// ihren Standardwert, neu hinzugekommene Einstellungen ebenso.
function mergeState(parsed) {
  var d = defaultState();
  Object.keys(d).forEach(function (k) { if (parsed[k] !== undefined) d[k] = parsed[k]; });
  d.boxes = migriereIds(d.boxes);
  d.lastSeen = migriereIds(d.lastSeen);
  d.satzBox = migriereSaetze(d.satzBox);
  d.satzSeen = migriereSaetze(d.satzSeen);
  d.abcBox = nurBuchstaben(d.abcBox);
  d.abcSeen = nurBuchstaben(d.abcSeen);
  d.gramBox = nurBausteine(d.gramBox);
  d.gramSeen = nurBausteine(d.gramSeen);
  // Ältere Stände kannten nur «gesehen», keine Stufe. Ein gesehener Satz
  // startet auf Stufe 1 und gilt als sofort fällig — nichts geht verloren,
  // aber als sitzend wird auch nichts verbucht, was nie geprüft wurde.
  if (parsed.readSeen && typeof parsed.readSeen === 'object' && !parsed.satzBox) {
    Object.keys(migriereSaetze(parsed.readSeen)).forEach(function (ru) {
      d.satzBox[ru] = 1;
      d.satzSeen[ru] = 0;
    });
  }
  d.fakten = saubereFakten(d.fakten);
  d.settings = defaultSettings();
  if (parsed.settings && typeof parsed.settings === 'object') {
    Object.keys(d.settings).forEach(function (k) {
      var wert = parsed.settings[k];
      if (typeof wert === typeof d.settings[k]) d.settings[k] = wert;
    });
    var stufe = d.settings.tippenStufe;
    if (!(stufe >= 1 && stufe <= BOX_MAX)) d.settings.tippenStufe = 3;
    if ([7, 14, 21, 30].indexOf(d.settings.auffrischen) === -1) d.settings.auffrischen = 21;
    if (['system', 'dunkel', 'hell'].indexOf(d.settings.darstellung) === -1) d.settings.darstellung = 'system';
  }
  return d;
}
// Fakten werden über eine kurze Kennung gemerkt, nicht über ihren ganzen Text —
// sonst bläht der Sicherungscode auf. Einträge zu unbekannten Fakten fallen weg.
function saubereFakten(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  FACTS.forEach(function (f) { bekannt[faktId(f)] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) {
    if (!bekannt[k] || !obj[k] || typeof obj[k] !== 'object') return;
    neu[k] = { n: obj[k].n > 0 ? obj[k].n : 0, f: obj[k].f === true };
  });
  return neu;
}

// Bis Version 3 waren Sätze über «Stufe-Nummer» vermerkt. Die Nummer hing an der
// Reihenfolge in der Datei; jetzt zählt der Satz selbst. Unbekannte Schlüssel fallen weg.
// Einträge zu Zeichen, die nicht im Alphabet stehen, fallen weg.
function nurBuchstaben(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  ALPHABET.forEach(function (b) { bekannt[b[1]] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) { if (bekannt[k]) neu[k] = obj[k]; });
  return neu;
}

// Einträge zu Bausteinen, die es nicht mehr gibt, fallen weg — sonst trüge der
// Sicherungscode Stände zu Regeln mit, die niemand mehr lernen kann.
function nurBausteine(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  GRAMMATIK.forEach(function (b) { bekannt[b.id] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) { if (bekannt[k]) neu[k] = obj[k]; });
  return neu;
}

function migriereSaetze(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  SENTENCES.forEach(function (s) { bekannt[s.ru] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) { if (bekannt[k]) neu[k] = obj[k]; });
  return neu;
}

// Bis Version 3 lautete die Wort-Kennung «Thema::wort». Sie hing damit am
// Themennamen; eine Umbenennung hätte den Lernstand gelöscht. Jetzt zählt nur
// das russische Wort — alte Stände werden beim Laden umgeschrieben.
function migriereIds(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var neu = {};
  Object.keys(obj).forEach(function (k) {
    var pos = k.indexOf('::');
    var id = pos === -1 ? k : k.slice(pos + 2);
    if (neu[id] === undefined || obj[k] > neu[id]) neu[id] = obj[k];
  });
  return neu;
}
var state = defaultState();
var saveTimer = null;

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = mergeState(JSON.parse(raw));
  } catch (e) {
    zeigeStatus('err', 'Speicher nicht verfügbar — der Fortschritt geht beim Schließen verloren.');
  }
}
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      zeigeStatus('ok', 'gespeichert');
    } catch (e) {
      zeigeStatus('err', 'Speichern fehlgeschlagen — Sicherungscode im Menü erzeugen.');
    }
  }, 400);
}
// Erfolgsmeldungen verschwinden von selbst, Fehler bleiben stehen.
var statusTimer = null;
function zeigeStatus(art, text) {
  var n = document.getElementById('saveNote');
  if (!n) return;
  if (statusTimer) clearTimeout(statusTimer);
  n.className = art + ' show';
  n.innerHTML = (art === 'ok' ? ICON.haken : '') + '<span>' + esc(text) + '</span>';
  if (art === 'ok') {
    statusTimer = setTimeout(function () {
      n.className = art;
      statusTimer = setTimeout(function () { n.innerHTML = ''; }, 400);
    }, 2000);
  }
}

// Dunkel oder hell: «system» folgt der Vorgabe des Geräts, sonst gilt die Wahl.
function updateDarstellung() {
  var wahl = state.settings.darstellung;
  var wurzel = document.documentElement;
  if (wahl === 'system') wurzel.removeAttribute('data-theme');
  else wurzel.setAttribute('data-theme', wahl);
  // Safari färbt die Statusleiste nach diesem Wert.
  var dunkel = wahl === 'dunkel' ||
    (wahl === 'system' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dunkel ? '#101418' : '#F4F2ED');
}

function woerterGemeistert() {
  var n = 0;
  ALL_VOCAB.forEach(function (v) { if ((state.boxes[v.id] || 0) >= BOX_MAX) n++; });
  return n;
}

// Kopfzeile: Anteil gemeisterter Wörter und laufende Serie.
function updateKopf() {
  var gemeistert = woerterGemeistert();
  var anteil = ALL_VOCAB.length ? gemeistert / ALL_VOCAB.length * 100 : 0;
  document.getElementById('kopfFill').style.width = anteil + '%';
  var text = gemeistert + ' von ' + ALL_VOCAB.length + ' gemeistert';
  if (state.streak >= 3) text += ' · <span class="kopf-serie">Serie ' + state.streak + '</span>';
  document.getElementById('kopfLabel').innerHTML = text;
}
// Wurde mit dieser Antwort die Endstufe **erreicht**? Nur der Übergang zählt:
// Wer ein schon gemeistertes Wort auffrischt, hat es nicht noch einmal
// gemeistert — eine Meldung dafür wäre schnell nichts mehr wert (ADR 0026).
var meisterMeldung = null;   // { was: 'Wort'|'Satz'|'Buchstabe', text, hinweis }

function meisterPruefen(vorher, nachher, was, text, hinweis, kyrillisch) {
  if (vorher >= BOX_MAX || nachher < BOX_MAX) return false;
  meisterMeldung = {
    was: was, text: text, hinweis: hinweis || '', kyrillisch: kyrillisch !== false
  };
  return true;
}

// Die Meldung selbst: eine Zeile unter der Auflösung. Ein eigener Bildschirm
// wäre im Weg — gemeistert wird oft, und jedes Mal wegtippen zu müssen macht
// aus der Belohnung eine Hürde. Für ein ganzes Lernset gibt es weiter die
// Jubelkarte; die ist der seltenere, größere Anlass.
function meisterHtml() {
  var m = meisterMeldung;
  if (!m) return '';
  return '<div class="meister">' + ICON.sternVoll +
    '<span><strong>' + esc(m.was) + ' gemeistert</strong>' +
    '<span class="meister-wort' + (m.kyrillisch ? ' cyr' : '') + '">' + esc(m.text) + '</span>' +
    (m.hinweis ? '<span class="meister-note">' + esc(m.hinweis) + '</span>' : '') +
    '</span></div>';
}

// Ein Klang für den Augenblick statt des gewöhnlichen «richtig».
function meisterTon(richtig) {
  if (meisterMeldung) tonMeister();
  else ton(richtig);
}

function updateBox(id, correct) {
  var cur = state.boxes[id] || 0;
  state.boxes[id] = correct ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.lastSeen[id] = Date.now();
  state.streak = correct ? state.streak + 1 : 0;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.answered++;
  updateKopf();
  save();
}

// ── Lernsets und Fälligkeit ─────────────────────────────────
// Ein Lernset bündelt die Wörter, die die nächsten Sätze brauchen. Wer ein Set
// schafft, schaltet damit genau diese Sätze in «Übersetzen» frei — das ist der
// kurze Weg vom Vokabeltraining zum ganzen Satz.
var SET_MAX = 12;
var TAG = 86400000;
// Wiedervorlage je Leitner-Stufe: neu · 1 Tag · 3 · 7 · 21
var INTERVALL = [0, TAG, 3 * TAG, 7 * TAG, 21 * TAG];

var LERNSETS = (function () {
  // Sätze in der Reihenfolge, in der sie erreichbar werden: nach dem im Lehrplan
  // spätesten Wort, das sie voraussetzen.
  var reife = function (satz) {
    return Math.max.apply(null, satz.benoetigt.map(function (w) {
      return VOKABEL[w] ? VOKABEL[w].nr : 0;
    }));
  };
  var sortiert = SENTENCES.slice().sort(function (a, b) { return reife(a) - reife(b); });
  var gesehen = {};
  var sets = [];
  var offen = { woerter: [], saetze: [] };
  sortiert.forEach(function (satz) {
    var neue = satz.benoetigt.filter(function (w) { return !gesehen[w] && VOKABEL[w]; });
    if (offen.woerter.length && offen.woerter.length + neue.length > SET_MAX) {
      sets.push(offen);
      offen = { woerter: [], saetze: [] };
    }
    neue.forEach(function (w) { gesehen[w] = true; offen.woerter.push(VOKABEL[w]); });
    offen.saetze.push(satz);
  });
  if (offen.woerter.length || offen.saetze.length) sets.push(offen);
  return sets.map(function (set, i) {
    return { nr: i, woerter: set.woerter, saetze: set.saetze };
  });
})();

function setReif(nr) {
  return LERNSETS[nr].woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= SATZ_STUFE; }).length;
}
function setGeschafft(nr) {
  return setReif(nr) === LERNSETS[nr].woerter.length;
}
// Nummer des ersten nicht geschafften Sets — dort wird gelernt.
function aktuellesSet() {
  for (var i = 0; i < LERNSETS.length; i++) if (!setGeschafft(i)) return i;
  return LERNSETS.length - 1;
}
function setFrei(nr) {
  return nr <= aktuellesSet();
}
// Alle Wörter bis einschließlich des laufenden Sets.
function freigeschalteteWoerter() {
  var liste = [];
  for (var i = 0; i <= aktuellesSet(); i++) liste = liste.concat(LERNSETS[i].woerter);
  return liste;
}
// Wörter, mit denen schon gearbeitet wurde — Quelle für Ablenker.
function verwechslungsPool() {
  var begonnen = ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
  return begonnen.length >= 8 ? begonnen : ALL_VOCAB;
}
// Auf der Endstufe entscheidet die Einstellung, sonst die Leitner-Leiter.
function intervallFuer(box) {
  if (box >= BOX_MAX) return (state.settings.auffrischen || 21) * TAG;
  return INTERVALL[Math.min(box, INTERVALL.length - 1)];
}
function faellig(v, jetzt) {
  var seit = state.lastSeen[v.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(state.boxes[v.id] || 0);
}

// ── Stand eines Satzes ──────────────────────────────────────
// Sätze führen dieselbe Leiter wie Wörter: BOX_MAX Mal richtig heißt «sitzt».
// Kennung ist der russische Satz, wie bei Wörtern das russische Wort.
function satzBox(s) { return state.satzBox[s.ru] || 0; }
function satzFaellig(s, jetzt) {
  var seit = state.satzSeen[s.ru];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(satzBox(s));
}
function satzUpdate(s, richtig) {
  var cur = satzBox(s);
  state.satzBox[s.ru] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.satzSeen[s.ru] = Date.now();
}
function faelligeAnzahl(liste) {
  var jetzt = Date.now();
  return liste.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); }).length;
}

function menuSetzen(auf) {
