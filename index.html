  melden: svg('<path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-5 4v-4H5A1.5 1.5 0 0 1 ' +
    '3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/><path d="M12 8v3.5M12 14v.01"/>')
};

var WOCHENTAGE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
var MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September',
  'Oktober', 'November', 'Dezember'];

// Kurz, in der Reihenfolge der Woche: Montag zuerst.
var WT_KURZ = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
var WOCHE = [1, 2, 3, 4, 5, 6, 0];

function datumLang(d) {
  return WOCHENTAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MONATE[d.getMonth()];
}

// ── Tage ────────────────────────────────────────────────────────
//
// Ein Tag ist ein Schlüssel «JJJJ-MM-TT» in lokaler Zeit, die Grenze lokale
// Mitternacht. Schlüssel lassen sich als Text vergleichen. Gerechnet wird über
// setDate, nie über Millisekunden — sonst verrutscht die Zeitumstellung einen Tag.
// `jetzt()` ist die einzige Uhr; der Prüfstand stellt sie.
function jetzt() { return new Date(); }

function zwei(n) { return (n < 10 ? '0' : '') + n; }
function tagSchluessel(d) {
  return d.getFullYear() + '-' + zwei(d.getMonth() + 1) + '-' + zwei(d.getDate());
}
function ausSchluessel(k) {
  var t = k.split('-');
  return new Date(+t[0], +t[1] - 1, +t[2]);
}
function heuteSchluessel() { return tagSchluessel(jetzt()); }
function tagPlus(k, n) {
  var d = ausSchluessel(k);
  d.setDate(d.getDate() + n);
  return tagSchluessel(d);
}
function istSchluessel(k) {
  return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && tagSchluessel(ausSchluessel(k)) === k;
}
// Die Woche beginnt am Montag.
function wochenAnfang(k) {
  return tagPlus(k, -((ausSchluessel(k).getDay() + 6) % 7));
}

// Eine Meldung. Eine zur Zeit; die nächste ersetzt die vorige.
function melden(text, zeichen) {
  var feld = $('meldung');
  if (feld) feld.textContent = text;
  // Jede Meldung erscheint im Glas, wie die Bestätigung (ADR 0019): der erste
  // Satz als Titel, der Rest darunter; sie quillt aus dem, was gerade getippt
  // wurde. `zeichen` 'haken' nur für Gelungenes, sonst das neutrale.
  // Gequollen wird aus dem zuletzt getippten Knopf: iOS gibt einem getippten
  // Knopf keinen Fokus, und nach dem Kopieren liegt er ohnehin nicht mehr
  // dort — «Kopiert» tropfte darum gar nicht (ADR 0041).
  var m = meldungTeilen(text), tipp = letzterTipp && Date.now() - letzterTipp.zeit < 3000 ? letzterTipp.el : null;
  var knopf = zuSehen(tipp) ? tipp
    : document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
  bestaetigen(m.titel, m.rest, knopf, null, zeichen === 'haken' || zeichen === 'kopie' ? zeichen : 'hinweis');
}

// Der erste Satz als Titel, ohne Punkt; der Rest darunter.
function meldungTeilen(text) {
  var teil = String(text).match(/^(.*?[.!?])\s+(.+)$/);
  return { titel: (teil ? teil[1] : String(text)).replace(/\.$/, ''), rest: teil ? teil[2] : '' };
}

// ════════════════════════════════════════════════════════════════
//  Zustand und Speicher
// ════════════════════════════════════════════════════════════════
//
// **Ein Schlüssel, nur dieser.** Chillingos Schlüssel kommt in dieser Datei
// nicht vor — kein Lesen, kein Schreiben, kein `clear()`. Der alte Lernstand
// bleibt so auf dem Gerät liegen (ADR 0001, pruefen.mjs wacht darüber).
var SPEICHER = 'chillinal_v1';

// Was nicht im Speicher steht, kommt von hier. Neue Felder bekommen hier ihren
// Vorgabewert; ein älterer Stand wird damit beim Laden aufgefüllt, ohne dass
// der Schlüssel wechseln muss.
function grundStand() {
  return {
    schema: 1,
    thema: 'auto',   // 'auto' folgt dem Gerät, sonst 'hell' oder 'dunkel'
    kalender: 'woche',   // was der Kalender zuletzt zeigte: 'woche' oder 'monat'
    gewohnheiten: [],
    abgewoehnen: [],
    termine: [],
    journal: [],         // Wochenreflexionen, nach Woche sortiert
    welle: null,         // die laufende 10-Minuten-Welle: { id, start } oder null
    timer: null,         // der laufende Timer einer Gewohnheit: { id, tag, start, ms, stumm, pausiert } oder null
    exportiert: null,    // wann zuletzt eine .ics hinausging, als Zeitpunkt
    tickets: [],         // Fehler und Wünsche, bis sie kopiert sind — nicht im Sicherungscode
    gesichert: null,     // wann zuletzt ein Sicherungscode kopiert wurde, als Zeitpunkt
    gefeiert: {},        // Abgewöhnen: id → der Rückfall, nach dem der neue Rekord schon gefeiert ist
    exportOhne: {},      // Export: 't:id' / 'g:id' → true — Neues, das bewußt draußen bleibt (ADR 0034)
    schwachHinweis: true,   // der sanfte Hinweis ab drei ungefestigten Gewohnheiten
    bewegung: 'auto'     // 'auto' folgt dem Gerät, 'aus' stellt alles still
  };
}

function stand(roh) {
  var s = grundStand();
  if (!roh || typeof roh !== 'object') return s;
  if (roh.thema === 'hell' || roh.thema === 'dunkel' || roh.thema === 'auto') s.thema = roh.thema;
  if (roh.kalender === 'woche' || roh.kalender === 'monat') s.kalender = roh.kalender;
  if (Array.isArray(roh.gewohnheiten)) {
    var ids = {};
    roh.gewohnheiten.forEach(function (g) {
      var gut = gewohnheitLesen(g);
      if (gut && !ids[gut.id]) { ids[gut.id] = true; s.gewohnheiten.push(gut); }
    });
  }
  if (Array.isArray(roh.abgewoehnen)) {
    var aids = {};
    roh.abgewoehnen.forEach(function (a) {
      var gut = lasterLesen(a);
      if (gut && !aids[gut.id]) { aids[gut.id] = true; s.abgewoehnen.push(gut); }
    });
  }
  if (Array.isArray(roh.termine)) {
    var tids = {};
    roh.termine.forEach(function (t) {
      var gut = terminLesen(t);
      if (gut && !tids[gut.id]) { tids[gut.id] = true; s.termine.push(gut); }
    });
  }
  if (Array.isArray(roh.journal)) {
    var wochen = {};
    roh.journal.forEach(function (r) {
      var gut = reflexionLesen(r);
      if (gut && !wochen[gut.woche]) { wochen[gut.woche] = true; s.journal.push(gut); }
    });
    s.journal.sort(function (x, y) { return x.woche < y.woche ? -1 : 1; });
  }
  if (istZeit(roh.exportiert)) s.exportiert = roh.exportiert;
  if (istZeit(roh.gesichert)) s.gesichert = roh.gesichert;
  if (roh.gefeiert && typeof roh.gefeiert === 'object') {
    s.abgewoehnen.forEach(function (a) { if (istZeit(roh.gefeiert[a.id])) s.gefeiert[a.id] = roh.gefeiert[a.id]; });
  }
  // Nur für Einträge, die es gibt — ein gelöschter nimmt seine Wahl mit.
  if (roh.exportOhne && typeof roh.exportOhne === 'object') {
    s.termine.forEach(function (t) { if (roh.exportOhne['t:' + t.id] === true) s.exportOhne['t:' + t.id] = true; });
    s.gewohnheiten.forEach(function (g) { if (roh.exportOhne['g:' + g.id] === true) s.exportOhne['g:' + g.id] = true; });
  }
  if (roh.schwachHinweis === false) s.schwachHinweis = false;
  if (roh.bewegung === 'aus') s.bewegung = 'aus';
  if (Array.isArray(roh.tickets)) {
    var tkids = {};
    roh.tickets.forEach(function (t) {
      var gut = ticketLesen(t);
      if (gut && !tkids[gut.id]) { tkids[gut.id] = true; s.tickets.push(gut); }
    });
    s.tickets.sort(function (x, y) { return x.erstellt - y.erstellt; });
  }
  // Ein Timer gilt nur für eine Gewohnheit, die es gibt, die nicht archiviert
  // ist und noch einen Timer hat (ADR 0038).
  var tm = roh.timer;
  if (tm && typeof tm === 'object' && istZeit(tm.start) && istSchluessel(tm.tag) && typeof tm.ms === 'number' &&
    tm.ms >= 60000 && tm.ms <= TIMER_MAX * 60000) {
    s.gewohnheiten.forEach(function (g) {
      if (g.id === tm.id && !g.archiviert && g.timer) {
        s.timer = { id: g.id, tag: tm.tag, start: tm.start, ms: tm.ms, stumm: tm.stumm === true,
          pausiert: istZeit(tm.pausiert) ? tm.pausiert : null };
      }
    });
  }
  // Eine Welle gilt nur für etwas, das es noch gibt und das nicht archiviert ist.
  var w = roh.welle;
  if (w && typeof w === 'object' && istZeit(w.start)) {
    s.abgewoehnen.forEach(function (a) {
      if (a.id === w.id && !a.archiviert) s.welle = { id: a.id, start: w.start };
    });
  }
  return s;
}

// Eine Gewohnheit, wie sie gespeichert wird:
//   { id, name, rhythmus, angelegt: Tag, erledigt: [Tag, …], archiviert: Tag | null,
//     erinnerung: 'HH:MM' | null, timer: { minuten, stumm } | null,
//     zaehler: { schritt, einheit } | null, zaehlung: { Tag: Menge } }
// Die Erinnerung ist nur für den Kalender-Export da (ADR 0009). Timer und Zähler
// schließen sich aus (ADR 0038). Ein Zähler zählt in Schritten mit Einheit
// (0,3 L); `zaehlung` hält die Menge des Tages. Ein erledigter Tag ohne Eintrag
// steht für einen Schritt — so bleibt jeder Haken, auch ein nachgetragener, eine
// gültige Zählung (ADR 0040). Ein älterer Stand mit `zaehler: true` zählt in Einern.
// Was nicht paßt, fällt weg — lieber eine Gewohnheit weniger als eine kaputte.
// Beide Grenzen stehen hier oben: `laden()` läuft, bevor das Skript weiter unten
// ankommt, und eine spätere `var` wäre dann noch undefined.
var NAME_MAX = 40;
var PRO_WOCHE_MAX = 6;
var TIMER_MAX = 240;      // Minuten
var ZAEHLER_MAX = 9999;   // Menge an einem Tag
var SCHRITT_MAX = 1000;
var EINHEIT_MAX = 8;

function gewohnheitLesen(g) {
  if (!g || typeof g !== 'object' || typeof g.id !== 'string' || !g.id) return null;
  var name = typeof g.name === 'string' ? g.name.trim().slice(0, NAME_MAX) : '';
  var rhythmus = rhythmusLesen(g.rhythmus);
  if (!name || !rhythmus || !istSchluessel(g.angelegt)) return null;
  var erledigt = [];
  if (Array.isArray(g.erledigt)) {
    g.erledigt.forEach(function (k) {
      if (istSchluessel(k) && erledigt.indexOf(k) === -1) erledigt.push(k);
    });
  }
  erledigt.sort();
  var t = g.timer, timer = t && typeof t === 'object' && t.minuten === Math.floor(t.minuten) &&
    t.minuten >= 1 && t.minuten <= TIMER_MAX ? { minuten: t.minuten, stumm: t.stumm === true } : null;
  var z = g.zaehler, zaehler = null, zaehlung = {};
  if (!timer && z === true) zaehler = { schritt: 1, einheit: '' };
  else if (!timer && z && typeof z === 'object' && typeof z.schritt === 'number' && z.schritt > 0 &&
    z.schritt <= SCHRITT_MAX && Math.round(z.schritt * 100) > 0) {
    zaehler = { schritt: Math.round(z.schritt * 100) / 100,
      einheit: typeof z.einheit === 'string' ? z.einheit.trim().slice(0, EINHEIT_MAX) : '' };
  }
  if (zaehler && g.zaehlung && typeof g.zaehlung === 'object') {
    erledigt.forEach(function (k) {
      var n = g.zaehlung[k];
      if (typeof n === 'number' && n > 0 && n <= ZAEHLER_MAX) zaehlung[k] = Math.round(n * 1000) / 1000;
    });
  }
  return {
    id: g.id,
    name: name,
    rhythmus: rhythmus,
    angelegt: g.angelegt,
    erledigt: erledigt,
    archiviert: istSchluessel(g.archiviert) ? g.archiviert : null,
    erinnerung: istUhr(g.erinnerung) ? g.erinnerung : null,
    imKalender: imKalenderLesen(g.imKalender),
    timer: timer,
    zaehler: zaehler,
    zaehlung: zaehlung
  };
}

// Wann ein Eintrag zuletzt in den Kalender ging, und wie er da aussah — als
// Abdruck seines Ereignisses. Weicht der heutige Abdruck ab, ist er seitdem
// geändert (ADR 0011). Ohne Marke ist er neu.
function imKalenderLesen(k) {
  if (!k || typeof k !== 'object' || !istZeit(k.am) || typeof k.abdruck !== 'string' ||
    !/^[0-9a-z]{1,8}$/.test(k.abdruck)) return null;
  return { am: k.am, abdruck: k.abdruck };
}

// Etwas zum Abgewöhnen, wie es gespeichert wird:
//   { id, name, start: Zeit, rueckfaelle: [{ zeit, notiz }, …], draenge: [Zeit, …],
//     archiviert: Tag | null }
// Zeiten sind Millisekunden seit 1970 — «frei seit» ist eine Dauer, kein Tag.
// Ein Rückfall vor dem Start kann es nicht geben; er fällt weg.
var NOTIZ_MAX = 200;
// Eine Wochenreflexion, wie sie gespeichert wird:
//   { woche: Montag als Tag, gut: '', stoerte: '', zeit: Zeit }
// Eine je Woche; zwei leere Antworten sind keine Reflexion und fallen weg.
var JOURNAL_MAX = 1000;

function istZeit(t) { return typeof t === 'number' && isFinite(t) && t > 0; }

function lasterLesen(a) {
  if (!a || typeof a !== 'object' || typeof a.id !== 'string' || !a.id) return null;
  var name = typeof a.name === 'string' ? a.name.trim().slice(0, NAME_MAX) : '';
  if (!name || !istZeit(a.start)) return null;
  var rueckfaelle = [];
  if (Array.isArray(a.rueckfaelle)) {
    a.rueckfaelle.forEach(function (r) {
      if (!r || !istZeit(r.zeit) || r.zeit < a.start) return;
      rueckfaelle.push({ zeit: r.zeit, notiz: typeof r.notiz === 'string' ? r.notiz.trim().slice(0, NOTIZ_MAX) : '' });
    });
  }
  rueckfaelle.sort(function (x, y) { return x.zeit - y.zeit; });
  var draenge = Array.isArray(a.draenge) ? a.draenge.filter(istZeit).sort(function (x, y) { return x - y; }) : [];
  return {
    id: a.id,
    name: name,
    start: a.start,
    rueckfaelle: rueckfaelle,
    draenge: draenge,
    archiviert: istSchluessel(a.archiviert) ? a.archiviert : null
  };
}

function reflexionLesen(r) {
  if (!r || typeof r !== 'object' || !istSchluessel(r.woche) || wochenAnfang(r.woche) !== r.woche) return null;
  var gut = textFeld(r.gut, JOURNAL_MAX), stoerte = textFeld(r.stoerte, JOURNAL_MAX);
  if (!gut && !stoerte) return null;
  return { woche: r.woche, gut: gut, stoerte: stoerte, zeit: istZeit(r.zeit) ? r.zeit : null };
}

// Ein Termin, wie er gespeichert wird:
//   { id, titel, tag: Tag, ganztags, von: 'HH:MM' | null, bis: 'HH:MM' | null,
//     wiederholung: 'keine' | 'taeglich' | 'woechentlich' | 'monatlich',
//     wiederholungBis: Tag | null, vorlauf: Minuten | null, ort, notiz }
// `tag` ist der erste Termin einer Reihe. Ganztags gibt es keine Uhrzeit; das
// Ende ist frei, liegt aber nach dem Beginn. `vorlauf` zählt Minuten vor dem
// Beginn — ganztags vor Mitternacht, darum ist «am Tag um 9» negativ (ADR 0006).
var TITEL_MAX = 60;
var ORT_MAX = 80;
var WIEDERHOLUNGEN = ['keine', 'taeglich', 'woechentlich', 'monatlich'];
var VORLAUF_ZEIT = [0, 5, 15, 30, 60, 120, 1440];
var VORLAUF_GANZ = [-540, 900, 2340, 9540];

function istUhr(u) { return typeof u === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(u); }
function textFeld(t, max) { return typeof t === 'string' ? t.trim().slice(0, max) : ''; }

function terminLesen(t) {
  if (!t || typeof t !== 'object' || typeof t.id !== 'string' || !t.id) return null;
  var titel = textFeld(t.titel, TITEL_MAX);
  if (!titel || !istSchluessel(t.tag)) return null;
  var ganztags = t.ganztags === true;
  var von = !ganztags && istUhr(t.von) ? t.von : null;
  if (!ganztags && !von) return null;
  var wdh = WIEDERHOLUNGEN.indexOf(t.wiederholung) !== -1 ? t.wiederholung : 'keine';
  var vorlauf = (ganztags ? VORLAUF_GANZ : VORLAUF_ZEIT).indexOf(t.vorlauf) !== -1 ? t.vorlauf : null;
  return {
    id: t.id,
    titel: titel,
    tag: t.tag,
    ganztags: ganztags,
    von: von,
    bis: von && istUhr(t.bis) && t.bis > von ? t.bis : null,
    wiederholung: wdh,
    wiederholungBis: wdh !== 'keine' && istSchluessel(t.wiederholungBis) && t.wiederholungBis >= t.tag
      ? t.wiederholungBis : null,
    vorlauf: vorlauf,
    ort: textFeld(t.ort, ORT_MAX),
    notiz: textFeld(t.notiz, NOTIZ_MAX),
    imKalender: imKalenderLesen(t.imKalender),
    // Die Tage, an denen er abgehakt ist — bei einer Reihe je Tag (ADR 0041).
    erledigt: Array.isArray(t.erledigt) ? t.erledigt.filter(function (k, i, a) {
      return istSchluessel(k) && a.indexOf(k) === i;
    }).sort() : []
  };
}

// täglich · bestimmte Wochentage (0 = Sonntag) · x-mal pro Woche (1–6)
// Ein Ticket, wie es gespeichert wird:
//   { id, art: 'fehler' | 'wunsch', titel, text, ort, grund, erstellt: Zeitpunkt,
//     stand: 'Version · Stand', abgegeben: Zeitpunkt | null }
// Ort und Grund sind Kennungen aus TICKET_ORTE und TICKET_GRUENDE; eine
// unbekannte fällt auf «anderswo» bzw. «ohne Angabe» zurück.
var TICKET_TITEL_MAX = 120;
var TICKET_TEXT_MAX = 4000;
// «Allgemein» steht vorn: für alles, was an keiner Stelle der App hängt.
var TICKET_ORTE = [['allgemein', 'Allgemein'], ['uebersicht', 'Übersicht'], ['kalender', 'Kalender'], ['gewohnheit', 'Gewohnheit'],
  ['abgewoehnen', 'Abgewöhnen und Drang'], ['termin', 'Termin'], ['journal', 'Journal'],
  ['export', 'Kalender-Export'], ['einstellungen', 'Einstellungen'], ['sicherung', 'Sicherung'],
  ['tickets', 'Tickets'], ['menue', 'Menü'], ['anderswo', 'Anderswo']];
// «Wo» und «was» sind zwei Fragen (wie Chillingo, ADR 0078 dort): zusammen-
// gelegt könnte man nur eines von beidem sagen. Ein Wunsch hat andere Gründe
// als ein Fehler — «Stürzt ab» wäre bei ihm Unsinn.
var TICKET_GRUENDE = {
  fehler: [['anzeige', 'Anzeige oder Darstellung'], ['bedienung', 'Bedienung'],
    ['rechnung', 'Falsch gerechnet oder gespeichert'], ['bewegung', 'Bewegung'],
    ['haengt', 'Stürzt ab oder hängt'], ['sonst', 'Sonstiges']],
  wunsch: [['neu', 'Neue Funktion'], ['besser', 'Verbesserung'], ['bedienung', 'Bedienung'],
    ['anzeige', 'Darstellung'], ['sonst', 'Sonstiges']]
};

function wahlName(liste, id) {
  for (var i = 0; i < liste.length; i++) if (liste[i][0] === id) return liste[i][1];
  return '';
}

function ticketLesen(t) {
  if (!t || typeof t !== 'object' || typeof t.id !== 'string' || !t.id) return null;
  var art = t.art === 'wunsch' ? 'wunsch' : 'fehler', titel = textFeld(t.titel, TICKET_TITEL_MAX);
  if (!titel || !istZeit(t.erstellt)) return null;
  return { id: t.id, art: art, titel: titel,
    text: typeof t.text === 'string' ? t.text.replace(/\s+$/, '').slice(0, TICKET_TEXT_MAX) : '',
    ort: wahlName(TICKET_ORTE, t.ort) ? t.ort : 'anderswo',
    grund: wahlName(TICKET_GRUENDE[art], t.grund) ? t.grund : '',
    erstellt: t.erstellt, stand: textFeld(t.stand, 60), abgegeben: istZeit(t.abgegeben) ? t.abgegeben : null };
}

function rhythmusLesen(r) {
  if (!r || typeof r !== 'object') return null;
  if (r.art === 'taeglich') return { art: 'taeglich' };
  if (r.art === 'wochentage' && Array.isArray(r.tage)) {
    var tage = [0, 1, 2, 3, 4, 5, 6].filter(function (t) { return r.tage.indexOf(t) !== -1; });
    return tage.length ? { art: 'wochentage', tage: tage } : null;
  }
  if (r.art === 'proWoche' && r.anzahl === Math.floor(r.anzahl) && r.anzahl >= 1 && r.anzahl <= PRO_WOCHE_MAX) {
    return { art: 'proWoche', anzahl: r.anzahl };
  }
  return null;
}

function laden() {
  var roh = null;
  try {
    roh = localStorage.getItem(SPEICHER);
  } catch (e) { roh = null; }
  if (!roh) return grundStand();
  try {
    return stand(JSON.parse(roh));
  } catch (e) {
    return grundStand();
  }
}

// Schlägt das Schreiben fehl (privater Modus, voller Speicher), läuft die App
// weiter — sie sagt es aber, statt still zu verlieren.
function speichern() {
  try {
    localStorage.setItem(SPEICHER, JSON.stringify(state));
    return true;
  } catch (e) {
    melden('Speichern ging nicht — der Speicher ist voll oder gesperrt.');
    return false;
  }
}

// ── Schriftzug ─────────────────────────────────────────────────
//
// «Chilli» in einem Zug geschrieben, breit gezogen und in der Höhe gestaucht;
// die i-Punkte sind Flammen, die beim Ablauf von unten aufsteigen und danach
// leise weiterlodern. Darunter «Journal» an einer Linie in Chili (ADR 0010).
// Abgelaufen wird nur mit der Klasse `wm-los`, einmal; das Lodern läuft immer.

// Schließen: Der Schleier blendet aus, die Karte geht als Geist in den
// Tropfen; das Blatt verschwindet, wenn er angekommen ist.
function hinweisSchliessen() {
  var blatt = $('hinweisBlatt'), karte = $('hinweisKarte');

  blatt.classList.remove('offen');
  if (typeof hinweisZiel === 'string') hinweisZiel = document.querySelector(hinweisZiel);
  // Die Quelle ist nur eine Fläche: Sie nickt nicht, sie nimmt nur auf.

    : q && q.width ? { getBoundingClientRect: function () { return q; } } : null;

// ── Bestätigung: Gespeichertes meldet sich im Glas ───────────────
// Wie der Hinweis nach dem Laden, nur ohne «OK» (ADR 0018): Wer speichert,
// sieht einen Haken, der aus dem getippten Knopf quillt und nach kurzer Zeit
// in das fließt, was gespeichert wurde. Der Knopf wird gemessen, bevor die
// Ansicht wechselt — danach gibt es ihn nicht mehr.
var BESTAETIGUNG_MS = 1400;

function bestaetigungDauer(titel, text) {
  return Math.min(4000, BESTAETIGUNG_MS + 45 * ((titel || '').length + (text || '').length));
}

function bestaetigen(titel, text, knopf, ziel, zeichen) {
  var quelle = zuSehen(knopf) ? knopf.getBoundingClientRect() : null;
  hinweisZeigen(titel, text, quelle, ziel, { bestaetigung: true, zeichen: zeichen });
}

// Was löscht oder sonst nicht zurückgeht, fragt im Glas, das aus dem Knopf
// tropft — nicht mehr mit einem zweiten Tipp auf denselben Knopf (ADR 0041).
// «Abbrechen» fließt in den Knopf zurück; meldet `beiJa` etwas, wird die Frage
// an Ort und Stelle zur Antwort.
function loeschenFragen(knopf, titel, text, ja, beiJa) {
  hinweisZeigen(titel, text || '', zuSehen(knopf) ? knopf.getBoundingClientRect() : null, knopf,
    { frage: { ja: ja, beiJa: beiJa } });
}

// ── Ein Fenster wird zur Meldung (ADR 0041) ──────────────────────
// Wer in einem Fenster speichert, das dabei geht — eine Ansicht, das
// Ticketblatt —, sieht nicht erst das Fenster zurückfließen und dann die
// Meldung aus einem Knopf quellen: Das Fenster zieht sich in der Mitte des
// Bilds zum Tropfen zusammen, und aus diesem Tropfen quillt die Meldung. Es
// sind die beiden bekannten Hälften, `tropfenZu` und `tropfenAuf`, mit einem
// gemeinsamen Punkt — keine zweite Mechanik (ADR 0013).
var MELDE_ZU = TROPFEN_DAUER;
var fensterIstMeldung = false;   // die nächste Ansicht wechselt ohne eigenen Rückfluß

function meldePunkt() {
  var b = document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
  return { left: b / 2 - 22, top: h / 2 - 22, width: 44, height: 44 };
}

// `g` ist der Geist des Fensters, `r` seine Fläche, `glas` ob es Glas war.
// Ohne Geist (Bewegung aus) erscheint die Meldung einfach.
function fensterWirdMeldung(g, r, glas, titel, text, ziel, zeichen) {
  var p = meldePunkt(), opt = { bestaetigung: true, zeichen: zeichen };
  if (g) {
    tropfenZu(g, r, { getBoundingClientRect: function () { return p; } },
      { rund: glas ? '18px' : '20px', glas: glas, frueh: true, dauer: MELDE_ZU });
    // Die Meldung quillt, wenn das Fenster Tropfen geworden ist — beide
    // blenden sich dort ineinander.
    opt.warten = Math.round(MELDE_ZU * TROPFEN_ZU_FRUEH[2]);
  }

}

// Für eine Ansicht, die nach der Meldung geht: Ihr Geist wird jetzt genommen,
// `zeige()` danach fließt nicht noch einmal zurück. Danach `zeige(…)` rufen.
function bestaetigenUndGehen(titel, text, ziel, zeichen) {
  var alt = $('ansicht'), g = geist(alt), r = alt.getBoundingClientRect();
  if (g) fensterIstMeldung = true;
  fensterWirdMeldung(g, r, false, titel, text, ziel, zeichen);

// Wie `melden()`, für eine Ansicht, die danach geht.
function meldenUndGehen(text, zeichen) {
  var m = meldungTeilen(text);
  if ($('meldung')) $('meldung').textContent = text;
  bestaetigenUndGehen(m.titel, m.rest, null, zeichen === 'haken' || zeichen === 'kopie' ? zeichen : 'hinweis');
}

// ── Umschalter: die Markierung fließt hinüber ───────────────────
// Jede `.wahl` trägt eine Marke unter dem gewählten Knopf. Wechselt die Wahl,
// streckt sich die Marke wie ein Tropfen bis zum neuen Knopf und zieht dann
// nach. Gemerkt wird je Gruppe (`aria-label`), was zuletzt gewählt war — auch
// über ein Neuzeichnen hinweg, wie bei den Ringen.
var wahlZuletzt = {};

function wahlenSetzen() {
  alleIn('#app .wahl, #ticketKarte .wahl').forEach(function (w) {
    var knoepfe = Array.prototype.filter.call(w.children, function (c) { return c.tagName === 'BUTTON'; });
    var i = -1;
    knoepfe.forEach(function (b, j) { if (b.getAttribute('aria-pressed') === 'true') i = j; });
    if (i < 0 || !knoepfe[i].offsetWidth) return;

    m.style.top = px(b.offsetTop);
    m.style.width = px(b.offsetWidth);
    m.style.height = px(b.offsetHeight);
    var alt = knoepfe[wahlZuletzt[schluessel]];
    // Folgt ihr gerade der Hell/Dunkel-Tropfen, gleitet sie als eigene Ebene
    // des Ansichtsübergangs — eine zweite Bewegung darin liefe doppelt (ADR 0037).
    if (alt && alt !== b && alt.offsetWidth && !document.documentElement.classList.contains('thema-folgt')) {
      var l = Math.min(alt.offsetLeft, b.offsetLeft);
      var r = Math.max(alt.offsetLeft + alt.offsetWidth, b.offsetLeft + b.offsetWidth);
      bewegt(m, [
        { left: px(alt.offsetLeft), width: px(alt.offsetWidth), transform: 'scaleY(1)' },
        { left: px(l), width: px(r - l), transform: 'scaleY(.84)', offset: 0.4 },
        { left: px(b.offsetLeft), width: px(b.offsetWidth), transform: 'scaleY(1)' }

// ════════════════════════════════════════════════════════════════
//  Gewohnheiten: Stärke, Serie, nie zweimal
// ════════════════════════════════════════════════════════════════
//
// Alles wird aus `erledigt` und dem Rhythmus abgeleitet, nichts davon
// gespeichert — ein geänderter Rhythmus rechnet die Geschichte neu.
// Die Regeln im Einzelnen: ADR 0002 und .claude/rules/logik.md.
//
// Stärke: gleitender Mittelwert über die fälligen Gelegenheiten,
// s ← s·(1−α) + α·x. α so, daß 66 erfüllte Gelegenheiten in Folge von 0 auf
// 90 % führen (Lally 2010: im Mittel 66 Tage bis zur Automatik).
var ALPHA = 1 - Math.pow(0.1, 1 / 66);
var SCHWACH = 0.5;      // darunter sitzt eine Gewohnheit noch nicht
var HINWEIS_AB = 3;     // so viele schwache, dann der sanfte Hinweis

function aktiveGewohnheiten() {
  return state.gewohnheiten.filter(function (g) { return !g.archiviert; });
}

function gewohnheitNach(id) {
  for (var i = 0; i < state.gewohnheiten.length; i++) {
    if (state.gewohnheiten[i].id === id) return state.gewohnheiten[i];
  }
  return null;
}

// Der Beginn rückt vor: Wer eine Gewohnheit schon geübt hat, bevor er sie
// eintrug, bekommt jeden fälligen Tag zwischen dem neuen Beginn und dem alten
// (höchstens bis gestern) als erledigt. Bei x-mal pro Woche sind es je Woche x
// Tage, gleichmäßig über die verfügbaren verteilt (ADR 0033). Heute bleibt
// offen — heute zählt erst, wenn es erledigt ist.
function beginnVorziehen(g, beginn) {
  if (!g || !istSchluessel(beginn) || beginn >= g.angelegt) return;
  var bis = tagPlus(g.angelegt, -1), gestern = tagPlus(heuteSchluessel(), -1);
  if (bis > gestern) bis = gestern;
  var neu = [];
  if (g.rhythmus.art === 'proWoche') {
    for (var mo = wochenAnfang(beginn); mo <= bis; mo = tagPlus(mo, 7)) {
      var frei = [];
      for (var i = 0; i < 7; i++) {
        var k = tagPlus(mo, i);
        if (k >= beginn && k <= bis) frei.push(k);
      }
      var x = Math.min(g.rhythmus.anzahl, frei.length);
      for (var j = 0; j < x; j++) neu.push(frei[Math.floor((j + 0.5) * frei.length / x)]);
    }
  } else {
    for (var t = beginn; t <= bis; t = tagPlus(t, 1)) if (faelligAm(g, t)) neu.push(t);
  }
  neu.forEach(function (k) { if (g.erledigt.indexOf(k) === -1) g.erledigt.push(k); });
  g.erledigt.sort();
  g.angelegt = beginn;
}

function faelligAm(g, k) {
  if (g.rhythmus.art === 'taeglich') return true;
  if (g.rhythmus.art === 'wochentage') return g.rhythmus.tage.indexOf(ausSchluessel(k).getDay()) !== -1;
  return false;   // x-mal pro Woche: gewertet wird die Woche, nicht der Tag
}

// Was die Kachel braucht: staerke (0–1), serie, warnen, faelligHeute,
// erledigtHeute, punkte (die letzten 7 Tage) und, je Woche, treffer/ziel.
function auswerten(g, heute) {
  var erl = {};
  g.erledigt.forEach(function (k) { erl[k] = true; });
  var a = g.rhythmus.art === 'proWoche' ? wochenRechnung(g, heute, erl) : tagesRechnung(g, heute, erl);
  a.erledigtHeute = !!erl[heute];
  a.punkte = punkte(g, heute, erl);
  return a;
}

// Täglich und Wochentage: jeder fällige Tag ist eine Gelegenheit. Heute zählt
// erst, wenn es erledigt ist — ein offener Tag ist kein Aussetzer.
// Die Serie zählt erledigte Gelegenheiten und bricht erst beim zweiten
// Aussetzer in Folge.
function tagesRechnung(g, heute, erl) {
  var s = 0, serie = 0, fehl = 0, vorige = null;
  for (var k = g.angelegt; k <= heute; k = tagPlus(k, 1)) {
    if (!faelligAm(g, k)) continue;
    var x = erl[k] ? 1 : 0;
    if (k === heute && !x) break;
    s = s * (1 - ALPHA) + ALPHA * x;
    if (x) { serie++; fehl = 0; } else if (++fehl >= 2) serie = 0;
    if (k < heute) vorige = x;
  }
  var faellig = faelligAm(g, heute);
  return {
    staerke: s,
    serie: serie,
    faelligHeute: faellig,
    // Nie zweimal: Die letzte fällige Gelegenheit vor heute ist verpaßt.
    warnen: faellig && !erl[heute] && vorige === 0
  };
}

// x-mal pro Woche: gewertet am Wochenende (Montag bis Sonntag), erreicht = 1,
// sonst anteilig. Eine Woche wiegt so viel wie ihre x Gelegenheiten. Die erste,
// angebrochene Woche verlangt nur so viele, wie Tage übrig waren.
function wochenRechnung(g, heute, erl) {
  var n = g.rhythmus.anzahl, s = 0, serie = 0, fehl = 0, vorige = null;
  var diese = wochenAnfang(heute), faellig = false, warnen = false, treffer = 0, ziel = n;
  for (var mo = wochenAnfang(g.angelegt); mo <= diese; mo = tagPlus(mo, 7)) {
    var tage = 0, vorher = 0;
    treffer = 0;
    for (var i = 0; i < 7; i++) {
      var k = tagPlus(mo, i);
      if (k < g.angelegt) continue;
      tage++;
      if (erl[k]) { treffer++; if (k < heute) vorher++; }
    }
    ziel = Math.min(n, tage);
    if (mo === diese) {
      faellig = vorher < ziel;
      warnen = treffer < ziel && !erl[heute] && vorige === 0;
      if (treffer < ziel) break;   // die Woche läuft noch
    }
    var r = Math.min(1, treffer / ziel), f = Math.pow(1 - ALPHA, ziel);
    s = s * f + (1 - f) * r;
    if (r >= 1) { serie++; fehl = 0; } else if (++fehl >= 2) serie = 0;
    if (mo < diese) vorige = r >= 1 ? 1 : 0;
  }
  return { staerke: s, serie: serie, faelligHeute: faellig, warnen: warnen, treffer: treffer, ziel: ziel };
}

// Die letzten sieben Tage, ältester zuerst.
function punkte(g, heute, erl) {
  var p = [];
  for (var i = 6; i >= 0; i--) {
    var k = tagPlus(heute, -i), art;
    var faellig = g.rhythmus.art === 'proWoche' || faelligAm(g, k);
    if (erl[k]) art = 'erledigt';
    else if (k < g.angelegt || !faellig) art = 'frei';
    else if (k === heute) art = 'heute';
    else art = g.rhythmus.art === 'proWoche' ? 'frei' : 'verpasst';
    p.push({ tag: k, art: art });
  }
  return p;
}

function prozent(s) { return Math.round(s * 100); }

function schwacheZahl(heute) {
  return aktiveGewohnheiten().filter(function (g) {
    return auswerten(g, heute).staerke < SCHWACH;
  }).length;
}

function rhythmusText(r) {
  if (r.art === 'taeglich') return 'Täglich';
  if (r.art === 'proWoche') return r.anzahl + '× pro Woche';
  if (r.tage.length === 7) return 'Jeden Tag';
  return WOCHE.filter(function (t) { return r.tage.indexOf(t) !== -1; })
    .map(function (t) { return WT_KURZ[t]; }).join(', ');
}

// Antippen = erledigt, nochmal = zurück — heute auf der Kachel, im Kalender
// bis zu NACHTRAG_TAGE zurück. Nie in der Zukunft und nie vor dem Anlegen:
// Ein Haken dort verschöbe die Stärke um Tage, die es nicht gab.
var NACHTRAG_TAGE = 7;

function aenderbarAm(g, k) {
  var heute = heuteSchluessel();
  return !!g && k <= heute && k >= g.angelegt && k >= tagPlus(heute, -NACHTRAG_TAGE);
}

function umschalten(id, k) {
  var g = gewohnheitNach(id);
  if (!aenderbarAm(g, k)) return false;
  var i = g.erledigt.indexOf(k);
  if (i === -1) { g.erledigt.push(k); g.erledigt.sort(); } else { g.erledigt.splice(i, 1); delete g.zaehlung[k]; }
  speichern();
  return true;
}

function erledigtAm(id, k) {
  var g = gewohnheitNach(id);
  return !!g && g.erledigt.indexOf(k) !== -1;
}

// Heute ist etwas dran, und alles davon ist erledigt.
function tagVoll() {
  var heute = heuteSchluessel();
  var dran = aktiveGewohnheiten().map(function (g) { return auswerten(g, heute); })
    .filter(function (a) { return a.faelligHeute; });
  return dran.length > 0 && dran.every(function (a) { return a.erledigtHeute; });
}

// Hakt ab oder zurück und zeichnet neu. Nur wer einen Haken setzt, läßt die
// Chili aufflammen — wer ihn zurücknimmt, bekommt keinen Jubel. Macht der
// Haken den Tag voll, lodert sie; ein Haken neben einem schon vollen Tag
// (Gedimmtes, Nachgetragenes) flammt nur. Hebt der Haken die Stärke über
// eine Stufe, lodert sie auch, und das Glas sagt, warum (`hakenJubel`).
function umschaltenUndZeichnen(id, k) {
  var vollVorher = tagVoll(), g = gewohnheitNach(id), heute = heuteSchluessel();
  var vorher = g ? auswerten(g, heute) : null, jubel = null;
  if (!umschalten(id, k)) return;
  if (erledigtAm(id, k)) {
    jubel = hakenJubel(g, vorher, auswerten(g, heute), k === heute);
    chiliFlammt = (!vollVorher && tagVoll()) || (jubel && jubel.lodert) ? 'lodert' : 'flammt';
  }
  render();
  chiliFlammt = false;
  if (jubel) jubeln(jubel.titel, jubel.text, id);
}

// Jubel über den Haken hinaus: Die Stärke erreicht die Hälfte oder 90 %
// (nach etwa 20 und 65 lückenlosen Gelegenheiten; gezählt wird, was die
// Kachel zeigt), oder ein Aussetzer bleibt einer («nie zweimal»). Jeder Anlaß
// einmal je Sitzung, der Aussetzer je Tag: Wer zurücknimmt und wieder setzt,
// hört ihn nicht zweimal. Gemerkt wird nichts — es ist nur ein Gruß, die
// Zahl steht in der Gewohnheit.
var STUFEN = [[90, 'Gefestigt', ' hat 90 % Stärke. Ab hier trägt sie sich fast von selbst.'],
  [50, 'Halb gefestigt', ' hat 50 % Stärke. Weiter so.']];
var jubelGehabt = {};

function hakenJubel(g, vorher, nachher, heute) {
  for (var i = 0; i < STUFEN.length; i++) {
    var st = STUFEN[i], schluessel = g.id + ':' + st[0];
    if (prozent(vorher.staerke) < st[0] && prozent(nachher.staerke) >= st[0] && !jubelGehabt[schluessel]) {
      jubelGehabt[schluessel] = true;
      return { lodert: true, titel: st[1], text: '«' + g.name + '»' + st[2] };
    }
  }
  if (heute && vorher.warnen && !nachher.warnen && !jubelGehabt[g.id + ':' + heuteSchluessel()]) {
    jubelGehabt[g.id + ':' + heuteSchluessel()] = true;
    return { lodert: false, titel: 'Nicht zweimal', text: 'Der Aussetzer bleibt einer.' };
  }
  return null;
}

// Das Glas mit Haken, aus dem, was den Jubel ausgelöst hat, und dorthin zurück:
// die runde Marke der Tageszeile, sonst die Scheibe der Kachel (ADR 0040).
function jubeln(titel, text, id) {
  var el = ['[data-nachtrag="' + id + '"]', '[data-haken="' + id + '"]', '[data-ab="' + id + '"]']
    .map(function (s) { return document.querySelector(s); }).filter(zuSehen)[0] || null;
  el = scheibeVon(el);
  bestaetigen(titel, text, el, el, 'haken');
}

function neueId(art) {
  return (art || 'g') + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}

// ════════════════════════════════════════════════════════════════
//  Abgewöhnen: frei seit, Rekord, Stärke, die 10-Minuten-Welle
// ════════════════════════════════════════════════════════════════
//
// Gespeichert sind Start, Rückfälle und gewonnene Dränge — alles Übrige rechnet
// `lasterAuswerten(a, nun)` bei jedem Zeichnen neu (ADR 0004).
//
// «frei seit» und der Rekord sind Dauern und werden in Millisekunden gerechnet.
// Die Stärke zählt Tage und nimmt dafür die Tagesschlüssel wie die Gewohnheiten.
var STAERKE_TAGE = 66;           // Stärke = Anteil freier Tage der letzten 66
var WELLE_MS = 10 * 60 * 1000;   // ein Drang flaut nach Minuten ab

function aktivesLaster() {
  return state.abgewoehnen.filter(function (a) { return !a.archiviert; });
}

function lasterNach(id) {
  for (var i = 0; i < state.abgewoehnen.length; i++) {
    if (state.abgewoehnen[i].id === id) return state.abgewoehnen[i];
  }
  return null;
}

function zeitJetzt() { return jetzt().getTime(); }

// frei (ms seit dem letzten Rückfall oder dem Start), rekord (die längste
// freie Strecke, die laufende eingeschlossen), rekordLaeuft (die laufende ist
// die längste), staerke (0–1), rueckfaelle, draenge (gewonnene), vorher (die
// längste Strecke vor der laufenden) und seit (wo die laufende begann).
// Was nach `nun` liegt, gibt es noch nicht — die Uhr des Geräts kann springen.
function lasterAuswerten(a, nun) {
  var zuletzt = a.start, rekord = 0, rueckTage = {}, zahl = 0;
  a.rueckfaelle.forEach(function (r) {
    if (r.zeit > nun) return;
    rekord = Math.max(rekord, r.zeit - zuletzt);
    zuletzt = r.zeit;
    rueckTage[tagSchluessel(new Date(r.zeit))] = true;
    zahl++;
  });
  var frei = Math.max(0, nun - zuletzt);
  var heute = tagSchluessel(new Date(nun)), erster = tagSchluessel(new Date(a.start)), freiTage = 0;
  for (var k = tagPlus(heute, 1 - STAERKE_TAGE); k <= heute; k = tagPlus(k, 1)) {
    if (k >= erster && !rueckTage[k]) freiTage++;
  }
  return {
    frei: frei,
    rekord: Math.max(rekord, frei),
    rekordLaeuft: frei >= rekord,
    vorher: rekord,
    seit: zuletzt,
    staerke: freiTage / STAERKE_TAGE,
    rueckfaelle: zahl,
    draenge: a.draenge.length
  };
}

// «12 T 4 h», «4 h 12 min», «12 min 05 s» — je kürzer, desto feiner.
function dauer(ms) {
  var s = Math.floor(Math.max(0, ms) / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), t = Math.floor(h / 24);
  if (t) return t + ' T ' + (h % 24) + ' h';
  if (h) return h + ' h ' + (m % 60) + ' min';
  return m + ' min ' + zwei(s % 60) + ' s';
}

// «9:42» — was von der Welle übrig ist.
function restText(ms) {
  var s = Math.ceil(Math.max(0, ms) / 1000);
  return Math.floor(s / 60) + ':' + zwei(s % 60);
}

function welleRest(nun) {
  return state.welle ? Math.max(0, state.welle.start + WELLE_MS - nun) : 0;
}

// Ein Rückfall: Er setzt «frei seit» zurück, der Rekord bleibt stehen. Kam er
// aus einer Welle, ist die Welle damit vorbei.
function rueckfallEintragen(id, notiz) {
  var a = lasterNach(id), nun = zeitJetzt();
  if (!a || nun < a.start) return false;
  a.rueckfaelle.push({ zeit: nun, notiz: String(notiz || '').trim().slice(0, NOTIZ_MAX) });
  if (state.welle && state.welle.id === id) state.welle = null;
  return speichern();
}

// Ein neuer Rekord: Die laufende Strecke ist eben länger geworden als jede
// davor. Gefeiert wird einmal je Strecke — `gefeiert` merkt sich den Rückfall,
// nach dem sie begann. Ohne Rückfall gibt es keinen alten Rekord, und eine
// Strecke unter einer Stunde ist noch keiner, den man feiert.
var REKORD_AB = 60 * 60 * 1000;

function rekordFaellig(nun) {
  return aktivesLaster().filter(function (a) {
    var e = lasterAuswerten(a, nun);
    return e.rueckfaelle > 0 && e.vorher >= REKORD_AB && e.frei > e.vorher && state.gefeiert[a.id] !== e.seit;
  });
}

// Merkt die fälligen Rekorde als gefeiert und gibt den ersten zurück, oder null.
function rekordFeiern(nun) {
  var neu = rekordFaellig(nun);
  if (!neu.length) return null;
  neu.forEach(function (a) { state.gefeiert[a.id] = lasterAuswerten(a, nun).seit; });
  speichern();
  return neu[0];
}

// Gewonnen zählt erst, wenn die zehn Minuten herum sind.
function welleGewonnen() {
  var w = state.welle, a = w && lasterNach(w.id), nun = zeitJetzt();
  if (!a || welleRest(nun) > 0) return false;
  a.draenge.push(nun);
  state.welle = null;
  return speichern();
}

// Aus Versehen begonnen: Die Welle endet, ohne daß etwas zählt — weder ein
// gewonnener Drang noch ein Rückfall.
function welleAbbrechen() {
  if (!state.welle) return false;
  state.welle = null;
  return speichern();
}

function welleBeginnen(id) {
  var a = lasterNach(id);
  if (!a || a.archiviert) return false;
  if (!state.welle) {
    state.welle = { id: id, start: zeitJetzt() };
    speichern();
  }
  return true;
}

// ════════════════════════════════════════════════════════════════
//  Termine
// ════════════════════════════════════════════════════════════════
//
// Einmal oder wiederkehrend: täglich, jede Woche am selben Wochentag, jeden
// Monat am selben Tag. Gibt es den Tag in einem Monat nicht (31.), fällt der
// Termin dort aus — so liest es auch der Kalender des iPhones aus der .ics.
// Eine Reihe wird nur als Ganzes geändert oder gelöscht (ADR 0006).

function terminNach(id) {
  for (var i = 0; i < state.termine.length; i++) if (state.termine[i].id === id) return state.termine[i];
  return null;
}

function terminAm(t, k) {
  if (k < t.tag || (t.wiederholungBis && k > t.wiederholungBis)) return false;
  if (t.wiederholung === 'taeglich') return true;
  if (t.wiederholung === 'woechentlich') return ausSchluessel(k).getDay() === ausSchluessel(t.tag).getDay();
  if (t.wiederholung === 'monatlich') return ausSchluessel(k).getDate() === ausSchluessel(t.tag).getDate();
  return k === t.tag;
}

// Ganztägiges zuerst, dann nach Uhrzeit, dann nach Titel.
function termineAm(k) {
  return state.termine.filter(function (t) { return terminAm(t, k); }).sort(function (a, b) {
    if (a.ganztags !== b.ganztags) return a.ganztags ? -1 : 1;
    if (a.von !== b.von) return a.von < b.von ? -1 : 1;
    return a.titel < b.titel ? -1 : a.titel > b.titel ? 1 : 0;
  });
}

function terminZeitText(t) {
  return t.ganztags ? 'ganztägig' : t.bis ? t.von + '–' + t.bis : t.von;
}

// «Fr, 16. Okt.»
function tagKurz(k) {
  var d = ausSchluessel(k);
  return WT_KURZ[d.getDay()] + ', ' + d.getDate() + '. ' + MON_KURZ[d.getMonth()];
}

function wiederholungText(t) {
  var w = { taeglich: 'täglich', woechentlich: 'jede Woche', monatlich: 'jeden Monat' }[t.wiederholung];
  if (!w) return '';
  return w + (t.wiederholungBis ? ' bis ' + tagKurz(t.wiederholungBis) : '');
}

// ════════════════════════════════════════════════════════════════
//  Kalender-Export
// ════════════════════════════════════════════════════════════════
//
// Eine `.ics` nach RFC 5545: ein VEVENT je Termin und je Gewohnheit mit
// Erinnerung, Wiederholung als RRULE, Erinnerung als VALARM, die UID stabil
// je Eintrag (ADR 0009). Zeiten sind «schwebend» — ohne Zeitzone, so wie die
// App rechnet: in der Zeit des Geräts. iOS importiert eine Kopie; ein Abo, das
// sich selbst nachführt, bräuchte einen Server.
var ICS_DATEI = 'chillinal.ics';
var ICS_TAG = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
var ICS_FREQ = { taeglich: 'DAILY', woechentlich: 'WEEKLY', monatlich: 'MONTHLY' };
// Eine Gewohnheit steht eine Viertelstunde im Kalender, ein Termin ohne Ende
// eine Stunde.
var ICS_GEWOHNHEIT_MIN = 15;
var ICS_TERMIN_MIN = 60;

// Text in einem Feld: Rückstrich, Semikolon, Komma und Zeilenumbruch werden
// maskiert.
function icsText(t) {
  return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
    .replace(/\r\n|\r|\n/g, '\\n');
}

// Zeilen über 75 Byte werden gefaltet; die Fortsetzung beginnt mit einem
// Leerzeichen. Gezählt wird in UTF-8 — ein «ü» sind zwei Byte, und kein
// Zeichen wird mitten durchgeschnitten.
function icsFalten(zeile) {
  var aus = '', n = 0, grenze = 75;
  for (var i = 0; i < zeile.length; i++) {
    var c = zeile.charCodeAt(i), z = zeile.charAt(i);
    if (c >= 0xD800 && c <= 0xDBFF && i + 1 < zeile.length) z += zeile.charAt(++i);
    var b = c < 0x80 ? 1 : c < 0x800 ? 2 : z.length > 1 ? 4 : 3;
    if (n + b > grenze) { aus += '\r\n '; n = 1; grenze = 75; }
    aus += z;
    n += b;
  }
  return aus;
}

function icsDatum(k) { return k.replace(/-/g, ''); }
function icsZeitpunkt(d) {
  return d.getFullYear() + zwei(d.getMonth() + 1) + zwei(d.getDate()) + 'T' +
    zwei(d.getHours()) + zwei(d.getMinutes()) + '00';
}
// Tag und Uhrzeit, um `plus` Minuten verschoben — über Date, damit ein Ende
// nach Mitternacht auf den nächsten Tag fällt.
function icsUhr(k, uhr, plus) {
  var d = ausSchluessel(k), u = uhr.split(':');
  d.setHours(+u[0], +u[1] + (plus || 0), 0, 0);
  return icsZeitpunkt(d);
}
// DTSTAMP in UTC.
function icsStempel(ms) {
  var d = new Date(ms);
  return d.getUTCFullYear() + zwei(d.getUTCMonth() + 1) + zwei(d.getUTCDate()) + 'T' +
    zwei(d.getUTCHours()) + zwei(d.getUTCMinutes()) + zwei(d.getUTCSeconds()) + 'Z';
}
// Minuten vor dem Beginn als TRIGGER: 15 → -PT15M, 0 → PT0M, ganztags «am Tag
// um 9» (−540) → PT9H, «1 Tag vorher um 9» (900) → -PT15H.
function icsVorlauf(min) {
  var m = Math.abs(min), t = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), r = m % 60;
  var zeit = (h ? h + 'H' : '') + (r || (!h && !t) ? r + 'M' : '');
  return (min > 0 ? '-' : '') + 'P' + (t ? t + 'D' : '') + (zeit ? 'T' + zeit : '');
}

function icsAlarm(trigger, text) {
  return ['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(text), 'TRIGGER:' + trigger, 'END:VALARM'];
}

// Was hinausgeht: Termine, die heute oder später noch einmal liegen, und jede
// laufende Gewohnheit mit Erinnerung. Vergangenes bleibt draußen.
function exportTermine(heute) {
  return state.termine.filter(function (t) {
    return t.wiederholung === 'keine' ? t.tag >= heute : !t.wiederholungBis || t.wiederholungBis >= heute;
  }).sort(function (a, b) {
    if (a.tag !== b.tag) return a.tag < b.tag ? -1 : 1;
    return (a.von || '') < (b.von || '') ? -1 : (a.von || '') > (b.von || '') ? 1 : 0;
  });
}
function exportGewohnheiten() {
  return state.gewohnheiten.filter(function (g) { return !g.archiviert && !!g.erinnerung; });
}

function terminEreignis(t, stempel) {
  var z = ['BEGIN:VEVENT', 'UID:' + t.id + '@chillinal', 'DTSTAMP:' + stempel, 'SUMMARY:' + icsText(t.titel)];
  if (t.ganztags) {
    z.push('DTSTART;VALUE=DATE:' + icsDatum(t.tag), 'DTEND;VALUE=DATE:' + icsDatum(tagPlus(t.tag, 1)));
  } else {
    z.push('DTSTART:' + icsUhr(t.tag, t.von), 'DTEND:' + (t.bis ? icsUhr(t.tag, t.bis) : icsUhr(t.tag, t.von, ICS_TERMIN_MIN)));
  }
  // UNTIL hat dieselbe Art wie DTSTART: ganztags ein Tag, sonst das Ende dieses
  // Tages in der Zeit des Geräts.
  if (ICS_FREQ[t.wiederholung]) {
    z.push('RRULE:FREQ=' + ICS_FREQ[t.wiederholung] + (t.wiederholungBis
      ? ';UNTIL=' + icsDatum(t.wiederholungBis) + (t.ganztags ? '' : 'T235959') : ''));
  }
  if (t.ort) z.push('LOCATION:' + icsText(t.ort));
  if (t.notiz) z.push('DESCRIPTION:' + icsText(t.notiz));
  if (t.vorlauf !== null) z = z.concat(icsAlarm(icsVorlauf(t.vorlauf), t.titel));
  z.push('END:VEVENT');
  return z;
}

// Eine Gewohnheit beginnt im Kalender am ersten fälligen Tag ab dem Anlegen —
// DTSTART muß zur RRULE passen, sonst zählt er als zusätzlicher Termin.
function gewohnheitEreignis(g, stempel) {
  var r = g.rhythmus, start = g.angelegt, regel = 'FREQ=DAILY';
  if (r.art === 'wochentage') {
    while (r.tage.indexOf(ausSchluessel(start).getDay()) === -1) start = tagPlus(start, 1);
    regel = 'FREQ=WEEKLY;BYDAY=' + [1, 2, 3, 4, 5, 6, 0].filter(function (t) {
      return r.tage.indexOf(t) !== -1;
    }).map(function (t) { return ICS_TAG[t]; }).join(',');
  }
  return ['BEGIN:VEVENT', 'UID:' + g.id + '@chillinal', 'DTSTAMP:' + stempel, 'SUMMARY:' + icsText(g.name),
    'DTSTART:' + icsUhr(start, g.erinnerung),
    'DTEND:' + icsUhr(start, g.erinnerung, g.timer ? g.timer.minuten : ICS_GEWOHNHEIT_MIN),
    'RRULE:' + regel, 'DESCRIPTION:' + icsText('Gewohnheit aus Chilli Journal · ' + rhythmusText(r))]
    .concat(icsAlarm('PT0M', g.name), ['END:VEVENT']);
}

// ── Was schon im Kalender steht ─────────────────────────────────
//
// Jeder Eintrag merkt sich, wann er hinausging, und den Abdruck seines
// Ereignisses (ohne DTSTAMP). Neu ist, was keine Marke hat — das geht immer
// mit. Was schon draußen ist, geht nur, wenn es unter «Bearbeiten» dazugeholt
// wird; geändert heißt: der Abdruck von heute weicht ab (ADR 0011).
var exportWahl = {};      // 't:id' / 'g:id' → true: noch einmal mit hinaus
var exBearbeiten = false; // die Exportansicht zeigt Kästchen statt Wege

function exAbdruck(art, e) {
  var text = (art === 't' ? terminEreignis(e, '') : gewohnheitEreignis(e, '')).join('\n'), h = 5381;
  for (var i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function exStatus(art, e) {
  if (!e.imKalender) return 'neu';
  return e.imKalender.abdruck === exAbdruck(art, e) ? 'drin' : 'geaendert';
}

// Neues geht mit, außer es ist bewußt abgewählt (`state.exportOhne`, gemerkt);
// was schon im Kalender steht, nur wenn es dazugeholt ist (`exportWahl`, bis
// zum Export) — ADR 0011, 0034.
function exMit(art, e) {
  var k = art + ':' + e.id;
  return exStatus(art, e) === 'neu' ? !state.exportOhne[k] : !!exportWahl[k];
}

// Ein Eintrag hin oder her: Neues über die gemerkte Abwahl, Dagewesenes über
// die Wahl bis zum Export.
function exUmschalten(art, e, an) {
  var k = art + ':' + e.id;
  if (exStatus(art, e) === 'neu') { if (an) delete state.exportOhne[k]; else state.exportOhne[k] = true; }
  else if (an) exportWahl[k] = true;
  else delete exportWahl[k];
}

// «Alle» eines Abschnitts: Geht etwas davon mit, geht alles heraus. Sonst kommt
// alles Neue mit — und gibt es nichts Neues, alles noch einmal.
function exAlle(art, liste) {
  var an = !liste.some(function (e) { return exMit(art, e); });
  var neu = liste.filter(function (e) { return exStatus(art, e) === 'neu'; });
  (an && neu.length ? neu : liste).forEach(function (e) { exUmschalten(art, e, an); });
}

function exportAuswahl(heute) {
  return {
    termine: exportTermine(heute).filter(function (t) { return exMit('t', t); }),
    gewohnheiten: exportGewohnheiten().filter(function (g) { return exMit('g', g); })
  };
}

function kalenderDatei(heute, nun, auswahl) {
  var a = auswahl || exportAuswahl(heute);
  var stempel = icsStempel(nun), z = ['BEGIN:VCALENDAR', 'VERSION:2.0',
    'PRODID:-//Chilli//Chilli Journal ' + APP_VERSION + '//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  a.termine.forEach(function (t) { z = z.concat(terminEreignis(t, stempel)); });
  a.gewohnheiten.forEach(function (g) { z = z.concat(gewohnheitEreignis(g, stempel)); });
  z.push('END:VCALENDAR');
  return z.map(icsFalten).join('\r\n') + '\r\n';
}

// Ein Weg aufs Gerät: die Datei laden. Am Gerät abgenommen; Teilen kam nicht im
// Kalender an (ADR 0013).
function icsBlob(auswahl) {
  return new Blob([kalenderDatei(heuteSchluessel(), zeitJetzt(), auswahl)], { type: 'text/calendar;charset=utf-8' });
}

// Gemerkt wird genau, was in der Datei stand — die Auswahl von vor dem Laden.
function exportiertMerken(auswahl) {
  var nun = zeitJetzt();
  state.exportiert = nun;
  auswahl.termine.forEach(function (t) { t.imKalender = { am: nun, abdruck: exAbdruck('t', t) }; });
  auswahl.gewohnheiten.forEach(function (g) { g.imKalender = { am: nun, abdruck: exAbdruck('g', g) }; });
  exportWahl = {};
  exBearbeiten = false;
  speichern();
  if (ansicht === 'export') render();
}

function icsLaden() {
  var url, auswahl = exportAuswahl(heuteSchluessel()), knopf = $('exLaden');
  var quelle = zuSehen(knopf) ? knopf.getBoundingClientRect() : null;
  try { url = URL.createObjectURL(icsBlob(auswahl)); } catch (e) { melden('Die Datei ließ sich nicht anlegen.'); return; }
  var a = document.createElement('a');
  a.href = url;
  a.download = ICS_DATEI;
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  exportiertMerken(auswahl);
  // Kein Verschwinden nach Zeit: iOS legt gleichzeitig sein eigenes Blatt
  // darüber, und wer zurückkommt, soll den Satz noch finden.
  hinweisZeigen('Datei geladen', 'Öffne sie, um sie in den Kalender zu holen.', quelle, $('exZuletzt'), { zeichen: 'laden' });
}

// Markierung aufheben: Was unter «Bearbeiten» gewählt ist, vergißt, daß es im
// Kalender steht, und gilt wieder als neu — ohne Export. Für Einträge, die im
// Kalender von Hand gelöscht wurden und später wieder hinaus sollen.
function exAufheben() {
  var a = exportAuswahl(heuteSchluessel()), n = a.termine.length + a.gewohnheiten.length;
  a.termine.concat(a.gewohnheiten).forEach(function (e) { e.imKalender = null; });
  exportWahl = {};
  exBearbeiten = false;
  if (speichern()) melden(n === 1 ? 'Gilt wieder als neu.' : n + ' Einträge gelten wieder als neu.', 'haken');
  if (ansicht === 'export') render();
}

// ════════════════════════════════════════════════════════════════
//  Ansichten
// ════════════════════════════════════════════════════════════════
//
// Start ist das Dashboard. Alles Weitere öffnet das Menü; unterwegs trägt der
// Kopf den Rückweg. Eine Reiterleiste gibt es nicht.

var ansicht = 'home';

var ANSICHTEN = {
  home: { titel: 'Chilli Journal', zeichnen: zeichneHome },
  neu: { titel: 'Neue Gewohnheit', zeichnen: zeichneFormular },
  bearbeiten: { titel: 'Gewohnheit', zeichnen: zeichneFormular },
  abgewoehnen: { titel: 'Abgewöhnen', zeichnen: zeichneFormular },
  welle: { titel: 'Drang', zeichnen: zeichneWelle },
  rueckfall: { titel: 'Rückfall', zeichnen: zeichneRueckfall },
  terminNeu: { titel: 'Neuer Termin', zeichnen: zeichneTerminFormular },
  termin: { titel: 'Termin', zeichnen: zeichneTerminFormular },
  journal: { titel: 'Journal', zeichnen: zeichneJournal },
  reflexion: { titel: 'Wochenreflexion', zeichnen: zeichneReflexion },
  lesen: { titel: 'Wochenreflexion', zeichnen: zeichneLesen },
  export: { titel: 'Kalender-Export', zeichnen: zeichneExport },
  einstellungen: { titel: 'Einstellungen', zeichnen: zeichneEinstellungen },
  sicherung: { titel: 'Sicherung', zeichnen: zeichneSicherung },
  tickets: { titel: 'Tickets', zeichnen: zeichneTickets }
};

// Das Menü in der Reihenfolge des Pflichtenhefts. `ziel` ist eine Ansicht;
// ohne Ziel ist der Eintrag angekündigt, aber noch nicht gebaut.
var MENUE = [
  { id: 'gewohnheit', name: 'Neue Gewohnheit', icon: 'plus', ziel: 'neu' },
  { id: 'termin', name: 'Neuer Termin', icon: 'termin', ziel: 'terminNeu' },
  { id: 'journal', name: 'Journal', icon: 'journal', ziel: 'journal' },
  { id: 'export', name: 'Kalender-Export', icon: 'export', ziel: 'export' },
  { id: 'einstellungen', name: 'Einstellungen', icon: 'zahnrad', ziel: 'einstellungen' },
  { id: 'sicherung', name: 'Sicherung', icon: 'sicherung', ziel: 'sicherung' },
  { id: 'tickets', name: 'Tickets', icon: 'ticket', ziel: 'tickets' }
];

// `id` sagt «bearbeiten» die Gewohnheit, «abgewoehnen» und «rueckfall», worum
// es geht, «termin» den Termin. Ohne eine gültige geht es nach Hause, nicht in
// ein leeres Formular; «welle» ohne laufende Welle ebenso. «terminNeu» nimmt
// statt einer id den Tag, an dem der Termin liegen soll.
// Wer aus dem Export eine Gewohnheit oder einen Termin öffnet, kommt dorthin
// zurück — mit dem Rückweg wie nach dem Speichern; ebenso, wer aus dem leeren
// Export etwas anlegt; ebenso aus dem Journal in eine Reflexion. «reflexion»
// und «lesen» nehmen den Montag ihrer Woche; wer aus dem Lesen bearbeitet,
// kommt ins Lesen zurück, und das Lesen dorthin, woher es geöffnet wurde
// (ADR 0018).
var rueckZiel = null;
var lesenWoche = null, lesenZurueck = null;

function zeige(name, id) {
  if (name === 'home' && rueckZiel && ansicht !== 'home') name = rueckZiel;
  if (name === 'lesen' && id === undefined) id = lesenWoche;
  if (name === 'lesen' && !(ansicht === 'reflexion' && rueckZiel === 'lesen')) {
    lesenZurueck = ansicht === 'journal' ? 'journal' : ansicht === 'reflexion' ? rueckZiel : null;
  }
  rueckZiel = ansicht === 'export' && (name === 'bearbeiten' || name === 'termin' || name === 'terminNeu' ||
      name === 'neu') ? 'export'
    : ansicht === 'journal' && name === 'reflexion' ? 'journal'
    : ansicht === 'lesen' && name === 'reflexion' ? 'lesen'
    : name === 'lesen' ? lesenZurueck : null;
  // Eine gelöschte Reflexion gibt es nicht zu lesen: dann ins Journal.
  if (name === 'lesen' && !reflexionNach(id)) { name = 'journal'; rueckZiel = null; }
  if (name === 'lesen') lesenWoche = id;
  if (!ANSICHTEN[name]) name = 'home';
  if (name === 'bearbeiten' && !gewohnheitNach(id)) name = 'home';
  if (name === 'termin' && !terminNach(id)) name = 'home';
  if ((name === 'abgewoehnen' || name === 'rueckfall') && !lasterNach(id)) name = 'home';
  if (name === 'welle' && !state.welle) name = 'home';
  if (name === 'reflexion' && !reflexionMoeglich(id)) name = 'home';
  reflexionEntwurf = name === 'reflexion' ? reflexionEntwurfAus(id) : null;
  entwurf = name === 'neu' ? entwurfNeu(id) : name === 'bearbeiten' ? entwurfAus(gewohnheitNach(id))
    : name === 'abgewoehnen' ? entwurfAusLaster(lasterNach(id)) : null;
  terminEntwurf = name === 'termin' ? terminEntwurfAus(terminNach(id))
    : name === 'terminNeu' ? terminEntwurfAus(null, istSchluessel(id) ? id : null) : null;
  // Wer aus der Welle zum Rückfall kommt, kann zur Welle zurück.
  rueckfallFuer = name === 'rueckfall' ? { id: id, notiz: '',
    ausWelle: ansicht === 'welle' && !!state.welle && state.welle.id === id } : null;
  // Das Bild folgt weich (Bewegung: Tropfen); das Dashboard kommt dorthin
  // zurück, wo man es verlassen hat.
  var uebergang = uebergangVorbereiten(ansicht, name), heim = name === 'home' && ansicht !== 'home';
  if (ansicht !== name) wahlZuletzt = {};
  if (ansicht !== name) hm.fuer = null;   // eine Heatmap beginnt bei der laufenden Woche
  if (name !== 'export') exBearbeiten = false;
  ansicht = name;
  render();
  try { window.scrollTo(0, heim ? homeScroll : 0); } catch (e) { /* egal */ }
  uebergangAusfuehren(uebergang);
}

function render() {
  if (auftrittLaeuft) auftrittEnde(true);
  if ((ansicht === 'neu' || ansicht === 'bearbeiten' || ansicht === 'abgewoehnen') && !entwurf) ansicht = 'home';
  if ((ansicht === 'rueckfall' && !rueckfallFuer) || (ansicht === 'welle' && !state.welle)) ansicht = 'home';
  if ((ansicht === 'termin' || ansicht === 'terminNeu') && !terminEntwurf) ansicht = 'home';
  if (ansicht === 'reflexion' && !reflexionEntwurf) ansicht = 'home';
  if (ansicht === 'lesen' && !reflexionNach(lesenWoche)) ansicht = 'journal';
  renderKopf();
  // Ein neuer Rekord wird auf dem Dashboard gefeiert, sobald es ihn sieht —
  // ob er eben im Takt fiel oder während die App zu war.
  var rekord = ansicht === 'home' ? rekordFeiern(zeitJetzt()) : null;
  if (rekord) chiliFlammt = 'lodert';
  var feld = $('ansicht'), h0 = ansicht === 'home' ? heldHoehe() : 0;
  feld.innerHTML = ANSICHTEN[ansicht].zeichnen();
  bindeAnsicht();
  ringeFuellen();
  heldNachziehen(h0);
  wahlenSetzen();
  if (rekord) {
    chiliFlammt = false;
    jubeln('Neuer Rekord', '«' + rekord.name + '» — so lange frei wie noch nie.', rekord.id);
  }
}

// Ringe füllen sich vom zuletzt gezeigten Wert zum neuen. Gezeichnet wird mit
// dem Ziel; erst hier springt der Ring zurück und läuft hinüber.
function ringeFuellen() {
  var ringe = alleIn('.ring-fuell[data-von]');
  if (!ringe.length || bewegungAus()) return;
  ringe.forEach(function (r) {
    r.style.transition = 'none';
    r.style.strokeDashoffset = r.getAttribute('data-von');
  });
  void document.body.offsetWidth;
  ringe.forEach(function (r) {
    r.style.transition = '';
    r.style.strokeDashoffset = r.getAttribute('stroke-dashoffset');
  });
}

function alleIn(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

var markeLos = true;   // der Schriftzug läuft beim Start einmal ab, dann nur auf Wunsch

function renderKopf() {
  var kopf = $('kopf');
  if (ansicht === 'home') {
    var dunkel = themaWirksam() === 'dunkel';
    kopf.innerHTML =
      '<div class="kopf-titel"><h1><button type="button" class="kopf-heim" id="markeKnopf" aria-label="Chilli Journal">' +
        zeichneMarke(markeLos) + '</button></h1>' +
      '<div class="datum">' + esc(datumLang(jetzt())) + '</div></div>' +
      '<button type="button" class="thema-schalter" id="themaKnopf" role="switch" ' +
        'aria-checked="' + (dunkel ? 'true' : 'false') + '" aria-label="Dunkle Darstellung">' +
        '<span class="knauf"></span><span class="seite hell">' + ICON.sonne + '</span>' +
        '<span class="seite dunkel">' + ICON.mond + '</span></button>' +
      '<button type="button" class="rund" id="menuKnopf" aria-label="Menü" aria-haspopup="dialog">' +
        ICON.menue + '</button>';
    markeLos = false;
    $('markeKnopf').addEventListener('click', function () {
      try { window.scrollTo({ top: 0, behavior: bewegungAus() ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
      markeAbspielen(document.querySelector('#markeKnopf svg.wm'));
    });
    $('themaKnopf').addEventListener('click', themaUmschalten);
    $('menuKnopf').addEventListener('click', menueOeffnen);
  } else {
    kopf.innerHTML =
      '<button type="button" class="rund" id="zurueckKnopf" aria-label="Zurück">' + ICON.zurueck +
      '</button><div class="kopf-titel kopf-unter"><h1><button type="button" class="kopf-heim" id="titelHeim">' +
        esc(ANSICHTEN[ansicht].titel) + '</button></h1></div>';
    $('zurueckKnopf').addEventListener('click', zurueckGehen);
    // Die Überschrift führt immer zur Übersicht — auch dort, wo der Rückweg
    // einen Schritt zurück geht (aus dem Export).
    $('titelHeim').addEventListener('click', function () { rueckZiel = null; zeige('home'); });
  }
}

// Der Rückweg: nach Hause, oder über `rueckZiel` dorthin, woher man kam.
function zurueckGehen() {
  if (ansicht !== 'home') zeige('home');
}

// ── Vom Rand wischen ───────────────────────────────────────────
// Im Vollbild der Home-Bildschirm-Verknüpfung gibt es keine Zurück-Geste des
// Browsers. Wie in Chillingo nimmt ein Wisch vom linken Rand dem Pfeil oben
// links die Arbeit ab (ADR 0016): Er beginnt nur am äußersten Rand — dort
// liegt kein Bedienelement —, wirkt erst beim Loslassen und schweigt, solange
// Menü oder Hinweis offen sind; die schließen sich auf ihre eigene Art.
// Auf dem Dashboard gibt es kein Zurück — dort öffnet derselbe Wisch das Menü
// (ADR 0023).
var WISCH_RAND = 26;   // px vom linken Rand, in denen die Geste beginnen darf
var WISCH_WEG = 70;    // px, die der Finger mindestens waagerecht zurücklegt
var wischVon = null;

function blattOffen() {
  return !$('menue').hidden || !$('hinweisBlatt').hidden || !$('ticketBlatt').hidden;
}

// Vom rechten Rand nach links, zum Menüknopf hin, öffnet das Menü — auf dem
// Dashboard wie unterwegs (ADR 0025).
function wischBeginnen(e) {
  wischVon = null;
  if (e.touches.length !== 1 || blattOffen()) return;
  var t = e.touches[0], breite = window.innerWidth || document.documentElement.clientWidth;
  if (t.clientX <= WISCH_RAND) wischVon = { x: t.clientX, y: t.clientY, rechts: false };
  else if (t.clientX >= breite - WISCH_RAND) wischVon = { x: t.clientX, y: t.clientY, rechts: true };
}

function wischEnden(e) {
  var von = wischVon, t = e.changedTouches && e.changedTouches[0];
  wischVon = null;
  if (!von || !t || blattOffen()) return;
  var quer = von.rechts ? von.x - t.clientX : t.clientX - von.x, hoch = Math.abs(t.clientY - von.y);
  // Waagerecht muß deutlich überwiegen, sonst war es ein Blättern.
  if (quer < WISCH_WEG || hoch > quer * 0.7) return;
  if (von.rechts || ansicht === 'home') { if ($('menuKnopf')) menueOeffnen(); else zeige('home'); }
  else zurueckGehen();
}

// ── Dashboard ───────────────────────────────────────────────────
//
// Oben der Tagesring mit der Chili, darunter, was heute dran ist, darunter
// gedimmt, was heute nicht dran ist. Die Kacheln bleiben beim Abhaken stehen,
// wo sie sind — nichts springt unter dem Finger weg.
var ringZuletzt = {};          // id → zuletzt gezeigter Anteil, für die Animation
var geradeAbgehakt = null;     // die Kachel, die eben getippt wurde
var chiliFlammt = false;       // false, 'flammt' oder 'lodert' (Tag eben voll geworden)

function zeichneHome() {
  var aktiv = aktiveGewohnheiten(), laster = aktivesLaster();
  if (!aktiv.length && !laster.length && !state.termine.length) return zeichneWillkommen();
  var heute = heuteSchluessel(), termine = termineAm(heute);
  var liste = aktiv.map(function (g) { return { g: g, a: auswerten(g, heute) }; });
  var dran = liste.filter(function (e) { return e.a.faelligHeute; });
  var frei = liste.filter(function (e) { return !e.a.faelligHeute; });
  var fertig = dran.filter(function (e) { return e.a.erledigtHeute; }).length;
  return zeichneHeld(fertig, dran.length, heute) +
    (termine.length ? '<section class="abschnitt"><h2>Termine heute</h2><div class="tm-liste">' +
      termine.map(function (t) { return zeichneTerminZeile(t, heute); }).join('') + '</div></section>' : '') +
    (dran.length ? '<section class="abschnitt"><h2>Gewohnheiten</h2><div class="gw-liste">' +
      dran.map(zeichneKachel).join('') + '</div></section>' : '') +
    (aktiv.length ? '' : zeichneGewohnheitLeer()) +
    (ausSchluessel(heute).getDay() === 0 ? zeichneReflexionKachel(heute) : '') +
    (sicherungFaellig() ? zeichneSicherungKachel() : '') +
    (frei.length ? '<section class="abschnitt"><h2>Heute nicht dran</h2><div class="gw-liste gedimmt">' +
      frei.map(zeichneKachel).join('') + '</div></section>' : '') +
    (laster.length ? '<section class="abschnitt"><h2>Abgewöhnen</h2><div class="gw-liste">' +
      laster.map(zeichneLasterKachel).join('') + '</div></section>' : '');
}

// Oben eine Karte für heute und die Tage drumherum: die Chili im Tagesring,
// daneben Woche oder Monat, darunter der Kalender.
function zeichneHeld(fertig, von, heute) {
  return '<section class="kachel held" aria-label="Heute und Kalender">' +
    '<div class="held-kopf">' + zeichneTagesring(fertig, von) +
      '<div class="wahl" role="group" aria-label="Kalender">' +
        [['woche', 'Woche'], ['monat', 'Monat']].map(function (w) {
          return '<button type="button" data-kalender="' + w[0] + '" aria-pressed="' +
            (state.kalender === w[0] ? 'true' : 'false') + '">' + w[1] + '</button>';
        }).join('') + '</div>' +
    '</div>' + zeichneKalender(heute) + '</section>';
}

// Ein Ring: Spur und Füllung, gezeichnet mit dem Ziel. `schluessel` merkt sich
// den Wert, damit der nächste Ring vom alten aus losläuft.
function ring(anteil, schluessel) {
  var u = 2 * Math.PI * 15.5;
  var von = ringZuletzt[schluessel] === undefined ? 0 : ringZuletzt[schluessel];
  ringZuletzt[schluessel] = anteil;
  return '<svg class="ring" viewBox="0 0 36 36" aria-hidden="true">' +
    '<circle class="ring-spur" cx="18" cy="18" r="15.5"/>' +
    '<circle class="ring-fuell" cx="18" cy="18" r="15.5" stroke-dasharray="' + u.toFixed(2) + '" ' +
      'stroke-dashoffset="' + (u * (1 - anteil)).toFixed(2) + '" data-von="' + (u * (1 - von)).toFixed(2) + '"/>' +
    '</svg>';
}

function zeichneTagesring(fertig, von) {
  var zahl, text;
  if (!von) { zahl = 'frei'; text = 'Heute ist nichts fällig.'; }
  else {
    zahl = fertig + ' von ' + von;
    text = fertig === von ? 'Alles erledigt.' : 'Noch ' + (von - fertig) + ' offen.';
  }
  return '<div class="tagesring" role="group" aria-label="Heute ' + esc(zahl) + '">' +
    '<div class="tr-bild">' + ring(von ? fertig / von : 0, '#tag') +
      '<img id="chiliFigur"' + (chiliFlammt ? ' class="' + chiliFlammt + '"' : '') + ' src="' + CHILI_BILD + '" alt=""></div>' +
    '<button type="button" class="tr-text" id="heuteKnopf" aria-label="Heute, ' + esc(zahl) +
      ' — Kalender auf heute"><span class="etikett heute-pille">Heute</span>' +
      '<span class="tr-zahl" id="tagesZahl">' + esc(zahl) + '</span>' +
      '<span class="tr-satz">' + esc(text) + '</span></button>' +
    '</div>';
}

function zeichneKachel(e) {
  var g = e.g, a = e.a, woche = g.rhythmus.art === 'proWoche';
  var laeuft = !!state.timer && state.timer.id === g.id, rest = laeuft ? timerRest(zeitJetzt()) : 0;
  var zahl = g.zaehler ? zaehlStand(g, heuteSchluessel()) : 0;
  var info;
  if (a.warnen) {
    info = '<span class="gw-warnung">' + (woche ? 'Diese Woche nicht wieder' : 'Heute nicht wieder') + '</span>';
  } else {
    info = 'Stärke ' + prozent(a.staerke) + ' %' +
      (woche ? ' · ' + Math.min(a.treffer, a.ziel) + ' von ' + a.ziel + ' diese Woche'
        : a.serie ? ' · Serie ' + a.serie : '');
  }
  // Timer: läuft er, zeigt der Ring die Restzeit statt der Stärke; sonst steht
  // seine Dauer dabei. Zähler: die Zahl von heute (ADR 0038).
  if (laeuft) info = '<span data-timerrest>' + esc(restText(rest)) + '</span> · ' +
    (state.timer.pausiert ? 'pausiert' : 'läuft');
  else if (g.timer && !a.erledigtHeute) info += ' · ' + g.timer.minuten + ' min';
  else if (zahl) info = esc(mengeText(g, zahl)) + ' heute · ' + info;
  var klassen = 'gw-kachel' + (a.erledigtHeute ? ' erledigt' : '') + (a.warnen ? ' warnen' : '') +
    (geradeAbgehakt === g.id ? ' gerade' : '') + (laeuft ? ' laeuft' : '') + (zahl ? ' zaehlt' : '');
  return '<div class="' + klassen + '"' + (laeuft ? ' data-timerkachel="' + esc(g.id) + '"' : '') + '>' +
    '<button type="button" class="gw-haken" data-haken="' + esc(g.id) + '" aria-pressed="' +
      (a.erledigtHeute ? 'true' : 'false') + '"' + (g.zaehler ? ' aria-label="' + esc(g.name) + ', ' +
        esc(mengeText(g, zahl)) + ' heute, tippen zählt ' + esc(zahlText(g.zaehler.schritt)) + ' dazu"' : '') + '>' +
      '<span class="gw-ring">' + (laeuft ? timerRing(rest / state.timer.ms) : ring(a.staerke, g.id)) +
        '<span class="gw-scheibe">' + (zahl ? '<span class="gw-zahl' + (zahlText(zahl).length > 3 ? ' lang' : '') +
          '">' + esc(zahlText(zahl)) + '</span>' : ICON.haken) +
        '</span></span>' +
      '<span class="gw-text"><span class="gw-name">' + esc(g.name) + '</span>' +
        '<span class="gw-info">' + info + '</span>' +
        '<span class="gw-punkte" aria-hidden="true">' + a.punkte.map(function (p) {
          return '<span class="punkt ' + p.art + '"></span>';
        }).join('') + '</span></span>' +
    '</button>' +
    (zahl ? '<button type="button" class="rund gw-minus" data-minus="' + esc(g.id) + '" aria-label="Einen Schritt weniger">' +
      ICON.minus + '</button>' : '') +
    '</div>';
}

// Abgewöhnen: «frei seit» läuft live (`takt`), darunter Stärke und Rekord.
// Antippen oder lange drücken öffnet; die Knöpfe Drang und Rückfall sind
// eigene Ziele. Läuft eine Welle, trägt der Drang-Knopf ihre Restzeit.
function zeichneLasterKachel(a) {
  var e = lasterAuswerten(a, zeitJetzt()), welle = !!state.welle && state.welle.id === a.id;
  var info = 'Stärke ' + prozent(e.staerke) + ' % · ' +
    (!e.rueckfaelle ? 'Noch kein Rückfall' : e.rekordLaeuft ? 'Rekord läuft' : 'Rekord ' + dauer(e.rekord)) +
    (e.draenge ? ' · ' + e.draenge + (e.draenge === 1 ? ' Drang' : ' Dränge') + ' besiegt' : '');
  return '<div class="gw-kachel ab-kachel' + (welle ? ' welle' : '') + '">' +
    '<button type="button" class="gw-haken ab-oeffnen" data-ab="' + esc(a.id) + '">' +
      '<span class="gw-ring">' + ring(e.staerke, a.id) + '<span class="gw-scheibe ab-scheibe">' + ICON.frei + '</span></span>' +
      '<span class="gw-text"><span class="gw-name">' + esc(a.name) + '</span>' +
        '<span class="ab-frei">frei seit <span class="ab-zahl" data-frei="' + esc(a.id) + '">' +
          esc(dauer(e.frei)) + '</span></span>' +
        '<span class="gw-info">' + esc(info) + '</span></span>' +
    '</button>' +
    '<div class="ab-knoepfe">' +
      '<button type="button" class="ab-knopf" data-drang="' + esc(a.id) + '">' + ICON.welle +
        '<span' + (welle ? ' data-wellerest' : '') + '>' +
        esc(welle ? welleKnopfText(welleRest(zeitJetzt())) : 'Drang') + '</span></button>' +
      '<button type="button" class="ab-knopf" data-rueckfall="' + esc(a.id) + '">Rückfall</button>' +
    '</div>' +
    '</div>';
}

// Ein Termin als Zeile: links die Zeit, rechts Titel, Ort und Wiederholung.
// Der blaue Strich sagt «Termin». An einem Tag `k`, der nicht mehr kommt, ist
// die Zeile wie eine Kachel: Antippen hakt genau diesen Tag ab, lange drücken
// öffnet; rechts in ihr steht der Haken, abgehakt wird sie blaß und der Titel
// durchgestrichen (ADR 0041, 0042). Sonst öffnet schon das Antippen.
function zeichneTerminZeile(t, k) {
  if (!k || k > heuteSchluessel()) return terminZeileKnopf(t);
  var erl = t.erledigt.indexOf(k) !== -1;
  return '<div class="tm-reihe' + (erl ? ' erledigt' : '') + (geradeAbgehakt === 't:' + t.id ? ' gerade' : '') + '">' +
    terminZeileKnopf(t, k, erl) + '</div>';
}

function terminZeileKnopf(t, k, erl) {
  var mehr = [t.ort, wiederholungText(t)].filter(function (x) { return !!x; }).join(' · ');
  var text = t.titel + ', ' + terminZeitText(t) + (mehr ? ', ' + mehr : '');
  return '<button type="button" class="tm-zeile" data-termin="' + esc(t.id) + '"' +
      (k ? ' data-terminhaken="' + esc(t.id) + '" data-tag="' + esc(k) + '" aria-pressed="' + (erl ? 'true' : 'false') + '"' +
        ' aria-label="' + esc(text + (erl ? ', erledigt' : '') + ', tippen hakt ab, lange drücken öffnet') + '"'
      : ' aria-label="' + esc(text) + '"') + '>' +
    '<span class="tm-zeit' + (t.ganztags ? ' ganz' : '') + '">' + (t.ganztags ? 'ganztägig'
      : esc(t.von) + (t.bis ? '<span class="tm-bis">' + esc(t.bis) + '</span>' : '')) + '</span>' +
    '<span class="tm-text"><span class="tm-titel">' + esc(t.titel) + '</span>' +
      (mehr ? '<span class="tm-mehr">' + esc(mehr) + '</span>' : '') + '</span>' +
    (k ? '<span class="tm-haken"><span class="kal-haken">' + ICON.haken + '</span></span>' : '') +
    '</button>';
}

function welleKnopfText(rest) { return rest ? 'Welle ' + restText(rest) : 'Welle vorbei'; }

// Noch gibt es nichts abzuhaken: Die Chili begrüßt, ein Knopf führt zur
// ersten Gewohnheit. Kein Tutorial — der Knopf ist die Anleitung. Wer schon
// alles archiviert hat, fängt nicht zum ersten Mal an; sie sagt es anders.
function zeichneWillkommen() {
  var wieder = state.gewohnheiten.length + state.abgewoehnen.length > 0;
  return '<section class="kachel willkommen">' +
    '<img id="chiliFigur" src="' + CHILI_BILD + '" alt="Die Chili winkt">' +
    (wieder
      ? '<h2>Alles ruht gerade.</h2>' +
        '<p>Was du archiviert hast, bleibt gespeichert. Fang etwas Neues an — eins reicht.</p>'
      : '<h2>Hallo, ich bin die Chili.</h2>' +
        '<p>Hier wächst bald deine erste Gewohnheit. Fang mit einer an — das reicht.</p>') +
    '<button type="button" class="knopf" id="ersteGewohnheit">' + ICON.plus +
    '<span>' + (wieder ? 'Neue Gewohnheit anlegen' : 'Erste Gewohnheit anlegen') + '</span></button>' +
    '</section>';
}

// Abgewöhnen oder Termine, aber nichts anzugewöhnen: Wo die Gewohnheiten
// stünden, steht der Weg dorthin — leise, ohne Chili, die sitzt oben im Ring.
function zeichneGewohnheitLeer() {
  return '<section class="abschnitt"><h2>Gewohnheiten</h2><div class="kachel leer">' +
    '<p>Noch keine Gewohnheit. Eine reicht für den Anfang.</p>' +
    '<button type="button" class="knopf zart" id="gwAnlegen">' + ICON.plus +
    '<span>Gewohnheit anlegen</span></button></div></section>';
}

// ── Dashboard: Kalender ─────────────────────────────────────────
//
// Woche oder Monat, umschaltbar; die Wahl bleibt gespeichert. Jeder Tag trägt
// einen Punkt je Gewohnheit und, wenn er Termine hat, vorn einen blauen. Ein
// angetippter Tag zeigt darunter seine Termine und Gewohnheiten — bis
// NACHTRAG_TAGE zurück lassen sich die Gewohnheiten nachtragen.
var kalVersatz = 0;        // Wochen oder Monate von heute aus
var kalTag = null;         // der angetippte Tag, null = keiner
var kalGewechselt = false; // das Raster ist eben neu — es darf einblenden

var MON_KURZ = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sep.', 'Okt.', 'Nov.', 'Dez.'];

// Wie voll ein Tag war. «x-mal pro Woche» hat keinen fälligen Tag: Ein
// erledigter zählt als genutzte Gelegenheit, ein freier gar nicht.
function tagesStand(k) {
  var von = 0, fertig = 0;
  aktiveGewohnheiten().forEach(function (g) {
    if (k < g.angelegt) return;
    var erl = g.erledigt.indexOf(k) !== -1;
    if (g.rhythmus.art === 'proWoche' ? erl : faelligAm(g, k)) {
      von++;
      if (erl) fertig++;
    }
  });
  return { von: von, fertig: fertig };
}

// Die Tönung eines Tages. Heute offen ist noch kein «null» — wie bei der Stärke.
function kalStufe(t, k, heute) {
  if (k > heute) return 'zukunft';
  if (!t.von) return 'frei';
  if (t.fertig === t.von) return 'voll';
  if (!t.fertig) return k === heute ? 'frei' : 'null';
  return t.fertig / t.von >= 0.5 ? 'viel' : 'wenig';
}

// Ein Punkt je Gewohnheit, die an dem Tag zählt — in der Reihenfolge der
// Kacheln. «x-mal pro Woche» zeigt sich nur, wenn sie erledigt ist; an einem
// Tag ist sie weder offen noch verpaßt.
function kalPunkte(k, heute) {
  var p = [];
  aktiveGewohnheiten().forEach(function (g) {
    if (k < g.angelegt) return;
    if (g.erledigt.indexOf(k) !== -1) p.push('erledigt');
    else if (g.rhythmus.art !== 'proWoche' && faelligAm(g, k)) {
      p.push(k > heute ? 'kommt' : k === heute ? 'offen' : 'verpasst');
    }
  });
  return p;
}

// Kalenderwoche nach ISO: Woche 1 enthält den 4. Januar.
function kalenderwoche(montag) {
  var jahr = ausSchluessel(tagPlus(montag, 3)).getFullYear();
  var n = 1;
  for (var k = wochenAnfang(jahr + '-01-04'); k < montag; k = tagPlus(k, 7)) n++;
  return n;
}

function spanne(von, bis) {
  var a = ausSchluessel(von), b = ausSchluessel(bis);
  if (a.getMonth() === b.getMonth()) return a.getDate() + '.–' + b.getDate() + '. ' + MONATE[b.getMonth()];
  return a.getDate() + '. ' + MON_KURZ[a.getMonth()] + ' – ' + b.getDate() + '. ' + MON_KURZ[b.getMonth()];
}

// Welche Tage das Raster zeigt: eine Woche ab Montag, oder ein Monat, auf
// ganze Wochen aufgefüllt.
function kalBereich(heute) {
  if (state.kalender === 'monat') {
    var d = ausSchluessel(heute);
    var erster = new Date(d.getFullYear(), d.getMonth() + kalVersatz, 1);
    var monat = erster.getMonth(), jahr = erster.getFullYear();
    var letzter = tagSchluessel(new Date(jahr, monat + 1, 0));
    return { von: wochenAnfang(tagSchluessel(erster)), bis: tagPlus(wochenAnfang(letzter), 6),
      monat: monat, titel: MONATE[monat] + ' ' + jahr };
  }
  var mo = tagPlus(wochenAnfang(heute), 7 * kalVersatz), so = tagPlus(mo, 6);
  return { von: mo, bis: so, monat: null, titel: 'KW ' + kalenderwoche(mo) + ' · ' + spanne(mo, so) };
}

// Den Kalender auf einen Tag stellen und ihn aufschlagen — nach dem Speichern
// eines Termins sieht man so, wo er liegt. Gezählt wird in Wochen bzw. Monaten.
function kalZeige(k) {
  var heute = heuteSchluessel(), n = 0;
  if (state.kalender === 'monat') {
    var a = ausSchluessel(heute), b = ausSchluessel(k);
    n = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  } else {
    var ziel = wochenAnfang(k), w = wochenAnfang(heute), schritt = ziel < w ? -7 : 7;
    for (; w !== ziel; w = tagPlus(w, schritt)) n += schritt / 7;
  }
  kalVersatz = n;
  kalTag = k;
}

// Der Tag, um den es beim Umschalten geht: der gewählte, sonst heute — oder,
// wer weggeblättert hat, die Mitte des Gezeigten (der Donnerstag der Woche,
// der Erste des Monats).
function kalAnker(heute) {
  if (kalTag) return kalTag;
  if (!kalVersatz) return heute;
  var b = kalBereich(heute);
  if (b.monat === null) return tagPlus(b.von, 3);
  for (var k = b.von; ausSchluessel(k).getDate() !== 1; k = tagPlus(k, 1)) { /* bis zum Ersten */ }
  return k;
}

// Wie weit die gewählte Darstellung von heute aus blättern muß, damit `anker`
// zu sehen ist.
function versatzFuer(anker, heute) {
  var a = ausSchluessel(anker), h = ausSchluessel(heute);
  if (state.kalender === 'monat') return (a.getFullYear() - h.getFullYear()) * 12 + a.getMonth() - h.getMonth();
  var von = wochenAnfang(heute), nach = wochenAnfang(anker), n = 0;
  while (nach > von) { von = tagPlus(von, 7); n++; }
  while (nach < von) { von = tagPlus(von, -7); n--; }
  return n;
}

// Die Zeile des Rasters, in der `k` liegt: oben und unten, am Bildschirm.
function reiheVon(k) {
  var mo = wochenAnfang(k), so = tagPlus(mo, 6), r = null;
  alleIn('#kalRaster [data-kaltag]').forEach(function (z) {
    var t = z.getAttribute('data-kaltag');
    if (t < mo || t > so) return;
    var b = z.getBoundingClientRect();
    r = r ? { top: Math.min(r.top, b.top), bottom: Math.max(r.bottom, b.bottom) } : { top: b.top, bottom: b.bottom };
  });
  return r;
}

// Auf: Der Monat quillt aus der Zeile der Woche, nach oben und unten, die
// Ecken erst bauchig, dann glatt. Zu: Der Monat zieht sich als Geist in die
// Zeile zusammen und legt sich auf die neue Woche; die blendet darunter auf.
function kalFliessen(anker, vorher) {
  var raster = $('kalRaster'), reihe = reiheVon(anker);
  if (!raster || !reihe || bewegungAus()) return;
