// ── Sprachfakten ────────────────────────────────────────────
// Kurze, stabile Kennung je Fakt (Hash über den Text) — überlebt Umsortieren
// und hält den Sicherungscode klein.
function faktId(text) {
  var h = 0;
  for (var i = 0; i < text.length; i++) {
    h = (h * 31 + text.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(36);
}
function faktStand(text) {
  return state.fakten[faktId(text)] || { n: 0, f: false };
}
function faktGezeigt(text) {
  var id = faktId(text);
  var e = state.fakten[id] || { n: 0, f: false };
  e.n++;
  state.fakten[id] = e;
}
function faktFavorit(text) {
  var id = faktId(text);
  var e = state.fakten[id] || { n: 0, f: false };
  e.f = !e.f;
  state.fakten[id] = e;
  save();
  return e.f;
}
// Zeigt zuerst Ungesehenes, dann das am seltensten Gezeigte.
function naechsterFakt() {
  var sortiert = FACTS.slice().sort(function (a, b) {
    return faktStand(a).n - faktStand(b).n;
  });
  var wenigsten = faktStand(sortiert[0]).n;
  var kandidaten = sortiert.filter(function (f) { return faktStand(f).n === wenigsten; });
  return kandidaten[Math.floor(Math.random() * kandidaten.length)];
}

// ── Hilfsfunktionen ─────────────────────────────────────────
function normalize(s) {
  return (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
}

// ── Buchstabe für Buchstabe ─────────────────────────────────
// «Falsch» ist eine dürftige Auskunft, wenn ein einziges Zeichen daneben lag.
// Nach der Abgabe wird das Getippte darum eingefärbt: Was stimmt, steht grün,
// was falsch dasteht, rot, und wo etwas fehlt, ein schmaler Strich.
//
// Steht hier bei den Hilfsfunktionen, nicht in einer Übung: Vier fragen danach
// — «Übersetzen», «Tippen», «Grammatik» und das Power-Training.
//
// Der Abstand allein sagt nur, *wie viel* daneben war — nicht *wo*. Es braucht
// also Levenshtein mit Rückweg, nicht bloß `editAbstand()`.
//
// Satzzeichen, Groß- und Kleinschreibung und ё/е kosten nichts. Sonst stünde
// eine Antwort, die als richtig gewertet wurde, rot da — `normalize()` sieht
// über genau diese Unterschiede hinweg, und die Farbe muss dasselbe tun.
function zeichenNeutral(c) { return /[.,!?;:\s]/.test(c); }
function zeichenGleich(a, b) {
  return a.toLowerCase().replace(/ё/g, 'е') === b.toLowerCase().replace(/ё/g, 'е');
}

function zeichenMarken(eingabe, loesung) {
  var a = String(eingabe), b = String(loesung);
  var n = a.length, m = b.length;
  var kosten = [], i, j;
  for (i = 0; i <= n; i++) {
    kosten[i] = [];
    for (j = 0; j <= m; j++) {
      if (i === 0 && j === 0) { kosten[0][0] = 0; continue; }
      if (i === 0) {
        kosten[0][j] = kosten[0][j - 1] + (zeichenNeutral(b.charAt(j - 1)) ? 0 : 1);
        continue;
      }
      if (j === 0) {
        kosten[i][0] = kosten[i - 1][0] + (zeichenNeutral(a.charAt(i - 1)) ? 0 : 1);
        continue;
      }
      var ca = a.charAt(i - 1), cb = b.charAt(j - 1);
      kosten[i][j] = Math.min(
        kosten[i - 1][j] + (zeichenNeutral(ca) ? 0 : 1),   // zu viel getippt
        kosten[i][j - 1] + (zeichenNeutral(cb) ? 0 : 1),   // fehlt
        kosten[i - 1][j - 1] + (zeichenGleich(ca, cb) ? 0 : 1)
      );
    }
  }
  // Rückweg. Die Diagonale wird zuerst geprüft: Zwei Zeichen an derselben
  // Stelle sollen einander zugeordnet bleiben, statt als «zu viel» und
  // «fehlt» nebeneinanderzustehen.
  var marken = [];
  i = n;
  j = m;
  while (i > 0 || j > 0) {
    var za = i > 0 ? a.charAt(i - 1) : '';
    var zb = j > 0 ? b.charAt(j - 1) : '';
    if (i > 0 && j > 0 &&
      kosten[i][j] === kosten[i - 1][j - 1] + (zeichenGleich(za, zb) ? 0 : 1)) {
      marken.unshift({ z: za, art: zeichenGleich(za, zb) ? 'ok' : 'weg' });
      i--;
      j--;
    } else if (i > 0 &&
      kosten[i][j] === kosten[i - 1][j] + (zeichenNeutral(za) ? 0 : 1)) {
      marken.unshift({ z: za, art: zeichenNeutral(za) ? 'ok' : 'weg' });
      i--;
    } else {
      if (!zeichenNeutral(zb)) marken.unshift({ z: '', art: 'fehlt' });
      j--;
    }
  }
  return marken;
}

// `gestalt` sagt, an wessen Stelle die Zeile tritt: 'satz' für das große Feld
// in «Übersetzen», 'wort' für die mittige Zeile in «Tippen», 'form' für die
// kleinen Felder in «Grammatik» und im Power-Training. Der Blick soll beim
// Wechsel nicht springen.
function pruefzeileHtml(eingabe, loesung, kyrillisch, gestalt) {
  if (!String(eingabe).replace(/^\s+|\s+$/g, '')) return '';
  var marken = zeichenMarken(eingabe, loesung);
  var fehlt = 0, falsch = 0;
  var html = '<p class="pruefzeile ' + (gestalt || 'satz') +
    (kyrillisch ? ' cyr' : '') + '">';
  marken.forEach(function (mk) {
    if (mk.art === 'fehlt') {
      fehlt++;
      html += '<span class="z-fehlt" aria-hidden="true"></span>';
      return;
    }
    if (mk.art === 'weg') falsch++;
    html += '<span class="z-' + mk.art + '">' + esc(mk.z) + '</span>';
  });
  html += '</p>';
  // Die Farbe allein darf nichts tragen: Wer sie nicht unterscheidet, liest
  // hier, worum es geht. (Die falschen Zeichen sind zusätzlich unterstrichen.)
  if (falsch || fehlt) {
    html += '<p class="pruef-note">' +
      (falsch ? falsch + (falsch === 1 ? ' Zeichen steht' : ' Zeichen stehen') + ' falsch' : '') +
      (falsch && fehlt ? ' · ' : '') +
      (fehlt ? fehlt + (fehlt === 1 ? ' fehlt' : ' fehlen') : '') + '</p>';
  }
  return html;
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function tokenize(sentence) {
  return sentence.replace(/[.,!?;:]/g, '').split(/\s+/).filter(Boolean);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// Vorlesen — russisch, wenn nichts anderes gesagt wird. iOS braucht dafür eine
// Nutzergeste, liefert Stimmen verzögert und schweigt im Stummschalter-Modus;
// kein Ablauf darf davon abhängen, darum alles in try/catch und ohne Rückgabe.
function speak(text, sprache) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = sprache === 'de' ? 'de-DE' : 'ru-RU';
    // Deutsch liest man mit, Russisch buchstabiert man mit — darum langsamer.
    u.rate = sprache === 'de' ? 0.95 : 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

// Ein Hörknopf, überall derselbe: Der Text hängt am Knopf, ein einziger
// Zuhörer auf #main fängt jeden Tipp ab — so muss keine Ansicht daran denken,
// ihre Knöpfe zu verdrahten.
function hoerknopf(text, sprache) {
  if (!text) return '';
  return '<button class="speak" data-say="' + esc(text) + '" data-lang="' +
    (sprache === 'de' ? 'de' : 'ru') + '" aria-label="Anhören' +
    (sprache === 'de' ? ', deutsch' : ', russisch') + '">' + ICON.lautsprecher + '</button>';
}

// Nach der Auflösung beide Seiten zum Anhören. Beschriftet, weil zwei gleiche
// Lautsprecher nebeneinander nicht sagen, welcher welche Sprache spricht.
function hoerzeile(ru, de) {
  var chip = function (text, sprache, name) {
    return '<button class="chip" data-say="' + esc(text) + '" data-lang="' + sprache + '">' +
      ICON.lautsprecher + name + '</button>';
  };
  return '<div class="hoerzeile">' + (ru ? chip(ru, 'ru', 'Russisch') : '') +
    (de ? chip(de, 'de', 'Deutsch') : '') + '</div>';
}

// ── Zustand & Speichern (localStorage) ──────────────────────
function defaultSettings() {
  return {
    confirmUeben: true,        // beim Vokabeltraining erst auswählen, dann bestätigen
    confirmUebersetzen: true,  // in «Übersetzen» erst legen, dann bestätigen
    requireComplete: false,    // Bestätigen erst bei vollständiger Lösung
    tippenStufe: 3,            // ab welcher Leitner-Stufe ein Wort im Tippen erscheint
    auffrischen: 21,           // Tage, bis Fertiges zur Sicherheit noch einmal drankommt
    // Verlangt eine Aufgabe Kyrillisch, kommt die eingebaute Tastatur von
    // selbst — dafür ist sie da. Neuer Schlüssel, weil die alte Vorgabe «aus»
    // war und die neue auch bestehende Geräte erreichen soll.
    tastaturAuto: true,
    // Ein Schema, nicht zwei Achsen: «Dark» ist die Vorgabe, «Classic» das
    // helle Cremeweiß, die drei Farben sind Cremetöne (ADR 0039). Neuer
    // Schlüssel, damit bestehende Geräte die Umstellung mitbekommen.
    schema: 'dark',
    ton: true                  // kurzer Klang bei richtig und falsch
  };
}
function defaultState() {

    boxes: {},
    lastSeen: {},              // Zeitstempel je Wort, Grundlage der Fälligkeit
    typingStats: { correct: 0, wrong: 0 },
    transStats: { correct: 0, wrong: 0 },
    satzBox: {},               // Leitner-Stufe je Satz, Kennung ist der russische Satz
    satzSeen: {},              // Zeitstempel je Satz, Grundlage der Fälligkeit
    abcBox: {},                // Leitner-Stufe je Buchstabe — freiwillig, eigener Topf
    abcSeen: {},               // Zeitstempel je Buchstabe
    // Grammatik: die Karteikarte ist die **Regel**, nicht das Wort. Gemeistert
    // ist eine Regel, wenn sie viermal auf verschiedene Wörter gewirkt hat.
    gramBox: {},               // Leitner-Stufe je Baustein
    gramSeen: {},              // Zeitstempel je Baustein; fehlt er, ist er noch unentdeckt
    // Wie oft ein Wort in «Übersetzen» **hintereinander** falsch geschrieben
    // wurde. Richtig geschrieben löscht den Eintrag — nur eine Serie zählt.
    wortFehler: {},
    // Wörter, die dreimal hintereinander verschrieben und darum zurückgestuft
    // wurden. Sie bleiben vermerkt, bis sie wieder sitzen — daraus speist sich
    // das Power-Training (ADR 0034).
    patzer: {},
    // Bei wie vielen lesbaren Wörtern der Wink zuletzt weggeklickt wurde. Er
    // kommt wieder, wenn es mehr geworden sind — dann ist er neue Nachricht
    // und keine Wiederholung.
    leseWinkAb: 0,
    // Wie oft ein Buchstabe im Lesemodus **hintereinander** gefehlt hat.
    // Richtig gelegt löscht den Eintrag — wie wortFehler eine Momentaufnahme
    // und darum nicht im Sicherungscode (ADR 0035).
    leseFehler: {},
    zuletzt: null,             // { uebung, zeit } — woran zuletzt gearbeitet wurde
    streak: 0,
    bestStreak: 0,
    answered: 0,
    factIdx: 0,
    fakten: {},                // je Fakt: { n: wie oft gezeigt, f: Favorit }
    settings: defaultSettings()

}
// Gespeicherten Stand mit den Vorgaben verschmelzen: fehlende Felder behalten

function mergeState(parsed) {
  var d = defaultState();
  Object.keys(d).forEach(function (k) { if (parsed[k] !== undefined) d[k] = parsed[k]; });
  d.boxes = migriereIds(d.boxes);
  d.lastSeen = migriereIds(d.lastSeen);
  d.satzBox = migriereSaetze(d.satzBox);
  d.satzSeen = migriereSaetze(d.satzSeen);
  d.abcBox = nurBuchstaben(d.abcBox);
  d.abcSeen = nurBuchstaben(d.abcSeen);
  d.gramBox = nurBausteine(d.gramBox);
  d.gramSeen = nurBausteine(d.gramSeen);
  d.wortFehler = migriereIds(d.wortFehler);
  d.patzer = migriereIds(d.patzer);
  d.leseFehler = nurBuchstaben(d.leseFehler);
  // «Zuletzt» zeigt auf eine Übung, die es noch gibt — sonst führte die
  // Empfehlung nach einem Umbau ins Leere.
  if (!d.zuletzt || !UEBUNG_NAME[d.zuletzt.uebung] || d.zuletzt.uebung === 'home' ||
    typeof d.zuletzt.zeit !== 'number') d.zuletzt = null;
  // Ältere Stände kannten nur «gesehen», keine Stufe. Ein gesehener Satz
  // startet auf Stufe 1 und gilt als sofort fällig — nichts geht verloren,
  // aber als sitzend wird auch nichts verbucht, was nie geprüft wurde.

      d.satzSeen[ru] = 0;

  if (parsed.settings && typeof parsed.settings === 'object') {
    Object.keys(d.settings).forEach(function (k) {

    });
    var stufe = d.settings.tippenStufe;
    if (!(stufe >= 1 && stufe <= BOX_MAX)) d.settings.tippenStufe = 3;
    if ([7, 14, 21, 30].indexOf(d.settings.auffrischen) === -1) d.settings.auffrischen = 21;

    // die Übersetzung der beiden alten Achsen käme nie zum Zug.
    if (schemaVon(parsed.settings.schema).wert !== parsed.settings.schema) {

}
// Fakten werden über eine kurze Kennung gemerkt, nicht über ihren ganzen Text —
// sonst bläht der Sicherungscode auf. Einträge zu unbekannten Fakten fallen weg.
function saubereFakten(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  FACTS.forEach(function (f) { bekannt[faktId(f)] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) {
    if (!bekannt[k] || !obj[k] || typeof obj[k] !== 'object') return;
    neu[k] = { n: obj[k].n > 0 ? obj[k].n : 0, f: obj[k].f === true };

  return neu;
}

// Bis Version 3 waren Sätze über «Stufe-Nummer» vermerkt. Die Nummer hing an der
// Reihenfolge in der Datei; jetzt zählt der Satz selbst. Unbekannte Schlüssel fallen weg.
// Einträge zu Zeichen, die nicht im Alphabet stehen, fallen weg.
function nurBuchstaben(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  ALPHABET.forEach(function (b) { bekannt[b[1]] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) { if (bekannt[k]) neu[k] = obj[k]; });
  return neu;
}

// Einträge zu Bausteinen, die es nicht mehr gibt, fallen weg — sonst trüge der
// Sicherungscode Stände zu Regeln mit, die niemand mehr lernen kann.
function nurBausteine(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  GRAMMATIK.forEach(function (b) { bekannt[b.id] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) { if (bekannt[k]) neu[k] = obj[k]; });
  return neu;
}

function migriereSaetze(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var bekannt = {};
  SENTENCES.forEach(function (s) { bekannt[s.ru] = true; });
  var neu = {};
  Object.keys(obj).forEach(function (k) { if (bekannt[k]) neu[k] = obj[k]; });
  return neu;
}

// Bis Version 3 lautete die Wort-Kennung «Thema::wort». Sie hing damit am
// Themennamen; eine Umbenennung hätte den Lernstand gelöscht. Jetzt zählt nur
// das russische Wort — alte Stände werden beim Laden umgeschrieben.
function migriereIds(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var neu = {};
  Object.keys(obj).forEach(function (k) {
    var pos = k.indexOf('::');
    var id = pos === -1 ? k : k.slice(pos + 2);
    if (neu[id] === undefined || obj[k] > neu[id]) neu[id] = obj[k];
  });
  return neu;
}
var state = defaultState();
var saveTimer = null;

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = mergeState(JSON.parse(raw));
  } catch (e) {
    zeigeStatus('err', 'Speicher nicht verfügbar — der Fortschritt geht beim Schließen verloren.');
  }
}
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      zeigeStatus('ok', 'gespeichert');
    } catch (e) {
      zeigeStatus('err', 'Speichern fehlgeschlagen — Sicherungscode im Menü erzeugen.');
    }
  }, 400);
}
// Erfolgsmeldungen verschwinden von selbst, Fehler bleiben stehen.
var statusTimer = null;
function zeigeStatus(art, text) {
  var n = document.getElementById('saveNote');
  if (!n) return;
  if (statusTimer) clearTimeout(statusTimer);
  n.className = art + ' show';
  n.innerHTML = (art === 'ok' ? ICON.haken : '') + '<span>' + esc(text) + '</span>';
  if (art === 'ok') {
    statusTimer = setTimeout(function () {
      n.className = art;
      statusTimer = setTimeout(function () { n.innerHTML = ''; }, 400);
    }, 2000);
  }
}

// Die Farbschemata. Eine Liste, keine zwei Achsen: «Dark» ist eines davon, und
// die drei Farben sind Cremetöne — die gibt es nur hell (ADR 0039). Die
// Flächenwerte stehen im Stylesheet; hier steht je Schema nur der Grund, weil
// die Statusleiste ihn als Zahl braucht und keine Medienabfrage kennt.
var SCHEMATA = [
  { wert: 'dark', text: 'Dark', grund: '#1A1A18' },
  { wert: 'classic', text: 'Classic', grund: '#E7E2D7' },
  { wert: 'gruen', text: 'Grün', grund: '#D5E9DF' },
  { wert: 'blau', text: 'Blau', grund: '#D3E0EB' },
  { wert: 'rosa', text: 'Rosa', grund: '#EBD3D9' }
];

function schemaVon(wert) {
  for (var i = 0; i < SCHEMATA.length; i++) {
    if (SCHEMATA[i].wert === wert) return SCHEMATA[i];
  }
  return SCHEMATA[0];
}

// Bis ADR 0039 standen Darstellung (system/dunkel/hell) und Farbton
// (nacht/grün/blau/rosa) als zwei Achsen nebeneinander. Ein Gerät oder ein
// Sicherungscode von damals wird hierüber übersetzt: Der Farbton wiegt
// schwerer, weil ihn jemand ausdrücklich gewählt hat; ohne Farbton entscheidet
// hell gegen dunkel.
var FARBTOENE_ALT = ['nacht', 'gruen', 'blau', 'rosa'];

function schemaAusAchsen(darstellung, farbe) {
  if (['gruen', 'blau', 'rosa'].indexOf(farbe) !== -1) return farbe;
  return darstellung === 'hell' ? 'classic' : 'dark';
}

// Ein Schema, ein Attribut. «Dark» ist die Vorgabe und trägt keines — es steht
// im `:root` selbst, wie zuvor die dunkle Palette.
function updateDarstellung() {
  var schema = schemaVon(state.settings.schema);
  var wurzel = document.documentElement;
  if (schema.wert === 'dark') wurzel.removeAttribute('data-schema');
  else wurzel.setAttribute('data-schema', schema.wert);
  // Safari färbt die Statusleiste nach diesem Wert.
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', schema.grund);
}


function woerterGemeistert() {
  var n = 0;
  ALL_VOCAB.forEach(function (v) { if ((state.boxes[v.id] || 0) >= BOX_MAX) n++; });
  return n;
}

// Kopfzeile: Anteil gemeisterter Wörter und laufende Serie.
function updateKopf() {
  var gemeistert = woerterGemeistert();
  var anteil = ALL_VOCAB.length ? gemeistert / ALL_VOCAB.length * 100 : 0;
  document.getElementById('kopfFill').style.width = anteil + '%';
  var text = gemeistert + ' von ' + ALL_VOCAB.length + ' gemeistert';
  if (state.streak >= 3) text += ' · <span class="kopf-serie">Serie ' + state.streak + '</span>';
  document.getElementById('kopfLabel').innerHTML = text;
}
// Wurde mit dieser Antwort die Endstufe **erreicht**? Nur der Übergang zählt:
// Wer ein schon gemeistertes Wort auffrischt, hat es nicht noch einmal

var meisterMeldung = null;   // { was: 'Wort'|'Satz'|'Buchstabe', text, hinweis }

function meisterPruefen(vorher, nachher, was, text, hinweis, kyrillisch) {
  if (vorher >= BOX_MAX || nachher < BOX_MAX) return false;
  meisterMeldung = {
    was: was, text: text, hinweis: hinweis || '', kyrillisch: kyrillisch !== false
  };
  return true;
}

// Die Meldung selbst: eine Zeile unter der Auflösung. Ein eigener Bildschirm
// wäre im Weg — gemeistert wird oft, und jedes Mal wegtippen zu müssen macht
// aus der Belohnung eine Hürde. Für ein ganzes Lernset gibt es weiter die
// Jubelkarte; die ist der seltenere, größere Anlass.
function meisterHtml() {
  var m = meisterMeldung;
  if (!m) return '';
  return '<div class="meister">' + ICON.sternVoll +
    '<span><strong>' + esc(m.was) + ' gemeistert</strong>' +
    '<span class="meister-wort' + (m.kyrillisch ? ' cyr' : '') + '">' + esc(m.text) + '</span>' +
    (m.hinweis ? '<span class="meister-note">' + esc(m.hinweis) + '</span>' : '') +
    '</span></div>';
}

// ── Jubel ───────────────────────────────────────────────────

// Quittung. Ausgelost wird bei jedem Anlass neu.
var JUBEL = {
  set: [
    ['Set {n}. Erledigt.', 'Die Wörter wissen jetzt, wer hier lernt. {m} {s} freigeschaltet.'],
    ['SET {n} GEMEISTERT!!', 'Ich habe vor Freude eine Paprika geküsst. {m} neue {s} warten, ' +
      'ich habe sie schon angeschrien.'],
    ['Set {n} sitzt.', 'Sauber gemacht. {m} {s} stehen jetzt offen — kein Grund zur Eile.']
  ],
  thema: [
    ['«{n}». Durch.', 'Jedes Wort auf der letzten Stufe. Das war nicht wenig.'],
    ['«{n}» IST GEFALLEN!', 'Alle Wörter gemeistert. Ich lege mich kurz hin.'],
    ['«{n}» sitzt komplett.', 'Alle Wörter auf der Endstufe — dieses Thema kann Ihnen nichts mehr.']
  ],
  abc: [
    ['33 von 33.', 'Das Alphabet ist durch. Sie lesen jetzt Kyrillisch, ohne zu stocken.'],
    ['DAS GANZE ALPHABET!', 'Alle 33. Ich habe mitgezählt, mehrmals, ich konnte nicht anders.'],
    ['Das Alphabet steht.', 'Alle 33 Buchstaben gemeistert. Der Anfang ist damit vorbei.']
  ],
  regel: [
    ['Alle {m} Regeln.', 'Keine Endung überrascht Sie mehr. Das ist selten.'],
    ['ZEHN VON ZEHN REGELN!', 'Sie beugen besser als mein Onkel, und der ist Russe.'],
    ['{m} von {m} Regeln.', 'Die ganze Grammatik dieser App sitzt. Ordentlich.']
  ],
  power: [
    ['Topf leer.', 'Alle gefallenen Wörter wieder oben. Als wäre nichts gewesen.'],
    ['ALLE ZURÜCKGEHOLT!', 'Kein einziges liegt mehr unten. Ich bin den Tränen nahe.'],
    ['Nichts mehr gefallen.', 'Alle Wörter zurück auf ihrer Stufe. Gut aufgeräumt.']
  ]
};

var jubelOffen = false;
var jubelWege = [];   // was die Knöpfe tun sollen

// Einsetzen statt Zusammenkleben: die Vorlagen führen {n}, {m} und {s}, damit
// alle drei Tonlagen dieselben Zahlen bekommen und keine vergisst.
function jubelFuellen(text, werte) {
  return text.replace(/\{(\w+)\}/g, function (_, k) {
    return werte[k] === undefined ? '' : String(werte[k]);
  });
}

// anlass: Schlüssel in JUBEL · werte: {n, m, s} · wege: [{text, tun}]
function jubelZeigen(anlass, werte, wege) {
  var reihe = JUBEL[anlass];
  if (!reihe) return;
  var gewaehlt = reihe[Math.floor(Math.random() * reihe.length)];
  document.getElementById('jubelAnlass').textContent = JUBEL_ANLASS[anlass] || '';
  document.getElementById('jubelTitel').textContent = jubelFuellen(gewaehlt[0], werte || {});
  document.getElementById('jubelText').textContent = jubelFuellen(gewaehlt[1], werte || {});
  jubelWege = wege && wege.length ? wege : [{ text: 'Weiter', tun: null }];
  var knoepfe = document.getElementById('jubelKnoepfe');
  knoepfe.innerHTML = jubelWege.map(function (w, i) {
    return '<button class="btn ' + (i === jubelWege.length - 1 ? 'primary' : 'ghost') +
      '" data-jubel="' + i + '">' + esc(w.text) + '</button>';
  }).join('');
  knoepfe.querySelectorAll('[data-jubel]').forEach(function (b) {
    b.addEventListener('click', function () {
      var weg = jubelWege[parseInt(b.dataset.jubel, 10)];
      jubelSchliessen();
      if (weg && weg.tun) weg.tun();
    });
  });
  jubelSetzen(true);
  try { tonMeister(); } catch (e) { /* ohne Ton geht es auch */ }
}

function jubelSetzen(auf) {
  var vorher = jubelOffen;
  jubelOffen = auf;
  document.body.classList.toggle('jubel-offen', auf);
  document.getElementById('jubelHof').hidden = !auf;
  document.getElementById('jubelBlatt').setAttribute('aria-hidden', auf ? 'false' : 'true');
  if (jubelOffen !== vorher) chiliAktualisieren();
}

function jubelSchliessen() { jubelSetzen(false); }

var JUBEL_ANLASS = {
  set: 'Lernset', thema: 'Thema', abc: 'Alphabet', regel: 'Grammatik', power: 'Power-Training'
};

// Ein Klang für den Augenblick statt des gewöhnlichen «richtig».
function meisterTon(richtig) {
  if (meisterMeldung) tonMeister();
  else ton(richtig);
}

function updateBox(id, correct) {
  var cur = state.boxes[id] || 0;
  state.boxes[id] = correct ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.lastSeen[id] = Date.now();
  state.streak = correct ? state.streak + 1 : 0;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.answered++;
  updateKopf();
  save();
}

// ── Lernsets und Fälligkeit ─────────────────────────────────
// Ein Lernset bündelt die Wörter, die die nächsten Sätze brauchen. Wer ein Set
// schafft, schaltet damit genau diese Sätze in «Übersetzen» frei — das ist der
// kurze Weg vom Vokabeltraining zum ganzen Satz.
var SET_MAX = 12;
var TAG = 86400000;
// Wiedervorlage je Leitner-Stufe: neu · 1 Tag · 3 · 7 · 21
var INTERVALL = [0, TAG, 3 * TAG, 7 * TAG, 21 * TAG];

var LERNSETS = (function () {
  // Sätze in der Reihenfolge, in der sie erreichbar werden: nach dem im Lehrplan
  // spätesten Wort, das sie voraussetzen.
  var reife = function (satz) {
    return Math.max.apply(null, satz.benoetigt.map(function (w) {
      return VOKABEL[w] ? VOKABEL[w].nr : 0;
    }));
  };
  var sortiert = SENTENCES.slice().sort(function (a, b) { return reife(a) - reife(b); });
  var gesehen = {};
  var sets = [];
  var offen = { woerter: [], saetze: [] };
  sortiert.forEach(function (satz) {
    var neue = satz.benoetigt.filter(function (w) { return !gesehen[w] && VOKABEL[w]; });
    if (offen.woerter.length && offen.woerter.length + neue.length > SET_MAX) {
      sets.push(offen);
      offen = { woerter: [], saetze: [] };
    }
    neue.forEach(function (w) { gesehen[w] = true; offen.woerter.push(VOKABEL[w]); });
    offen.saetze.push(satz);
  });
  if (offen.woerter.length || offen.saetze.length) sets.push(offen);
  return sets.map(function (set, i) {
    return { nr: i, woerter: set.woerter, saetze: set.saetze };
  });
})();

function setReif(nr) {
  return LERNSETS[nr].woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= SATZ_STUFE; }).length;
}
function setGeschafft(nr) {
  return setReif(nr) === LERNSETS[nr].woerter.length;
}
// Nummer des ersten nicht geschafften Sets — dort wird gelernt.
function aktuellesSet() {
  for (var i = 0; i < LERNSETS.length; i++) if (!setGeschafft(i)) return i;
  return LERNSETS.length - 1;
}
function setFrei(nr) {
  return nr <= aktuellesSet();
}
// Alle Wörter bis einschließlich des laufenden Sets.
function freigeschalteteWoerter() {
  var liste = [];
  for (var i = 0; i <= aktuellesSet(); i++) liste = liste.concat(LERNSETS[i].woerter);
  return liste;
}
// Wörter, mit denen schon gearbeitet wurde — Quelle für Ablenker.
function verwechslungsPool() {
  var begonnen = ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
  return begonnen.length >= 8 ? begonnen : ALL_VOCAB;
}
// Auf der Endstufe entscheidet die Einstellung, sonst die Leitner-Leiter.
function intervallFuer(box) {
  if (box >= BOX_MAX) return (state.settings.auffrischen || 21) * TAG;
  return INTERVALL[Math.min(box, INTERVALL.length - 1)];
}
function faellig(v, jetzt) {
  var seit = state.lastSeen[v.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(state.boxes[v.id] || 0);
}

// ── Stand eines Satzes ──────────────────────────────────────
// Sätze führen dieselbe Leiter wie Wörter: BOX_MAX Mal richtig heißt «sitzt».
// Kennung ist der russische Satz, wie bei Wörtern das russische Wort.
function satzBox(s) { return state.satzBox[s.ru] || 0; }
function satzFaellig(s, jetzt) {
  var seit = state.satzSeen[s.ru];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(satzBox(s));
}
function satzUpdate(s, richtig) {
  var cur = satzBox(s);
  state.satzBox[s.ru] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.satzSeen[s.ru] = Date.now();
}
function faelligeAnzahl(liste) {
  var jetzt = Date.now();
  return liste.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); }).length;
}

// ── Auswahl (Filter) ────────────────────────────────────────
// Statt Klappmenüs und langer Chip-Reihen in jeder Übung: ein Knopf im Kopf,
// dahinter dasselbe Aufklapp-Panel wie beim Menü. Weicht die Auswahl vom
// Regelfall ab, färbt sich der Knopf wie ein gesetzter Chip.
var filterOffen = false;

function filterSetzen(auf) {
  var vorher = filterOffen;
  filterOffen = auf && filterHatWahl();
  document.body.classList.toggle('filter-offen', filterOffen);
  var knopf = document.getElementById('filterKnopf');
  knopf.setAttribute('aria-expanded', filterOffen ? 'true' : 'false');
  document.getElementById('filterPanel').setAttribute('aria-hidden', filterOffen ? 'false' : 'true');
  // Nur beim echten Umschalten. `renderFilter()` ruft diese Funktion bei jedem
  // Zeichnen mit `false` — beim Aufbau noch, bevor `#main` gefüllt ist. Die
  // Figur bekäme dann eine Station im Kopf und flöge sichtbar auf ihren Platz,
  // sobald die Ansicht dasteht.
  if (filterOffen !== vorher) chiliAktualisieren();
}

function filterHatWahl() {
  return currentTab === 'lernsets' || currentTab === 'freestyle' ||
    currentTab === 'tippen' || currentTab === 'uebersetzen' ||
    currentTab === 'buchstaben' || currentTab === 'grammatik';
}

// Weicht etwas vom Regelfall ab? Nur dann ist der Knopf farbig.
function filterAktiv() {
  if (currentTab === 'lernsets') return uebAuswahl !== 'aktuell';
  if (currentTab === 'freestyle') return uebThema !== 'Alle';
  if (currentTab === 'tippen') return tippenModus !== 'lernen';
  if (currentTab === 'uebersetzen') {
    return trLevel !== 1 || trDir !== 'gemischt' || trModus !== 'lernen';
  }
  if (currentTab === 'buchstaben') return abcRichtung !== 'gemischt';
  if (currentTab === 'grammatik') return gramWahl !== null;
  return false;
}

function filterGruppe(titel, chips) {
  return '<div class="filtergruppe"><span class="filter-titel">' + esc(titel) +
    '</span><div class="filter-reihe">' + chips + '</div></div>';
}
function filterChip(gruppe, wert, text, gesetzt, gesperrt) {
  return '<button class="chip' + (gesetzt ? ' active' : '') + '" data-fw="' + gruppe +
    '" data-fv="' + esc(String(wert)) + '"' + (gesperrt ? ' disabled' : '') + '>' +
    esc(text) + '</button>';
}

function filterInhaltHtml() {
  if (currentTab === 'lernsets') {
    var aktuell = aktuellesSet();
    var chips = filterChip('set', 'aktuell', 'Aktuelles Set ' + (aktuell + 1), uebAuswahl === 'aktuell') +
      filterChip('set', 'alle', 'Alles Freigeschaltete', uebAuswahl === 'alle');
    var einzeln = '';
    LERNSETS.forEach(function (set, i) {
      einzeln += filterChip('set', i, 'Set ' + (i + 1), uebAuswahl === i, !setFrei(i));
    });
    return filterGruppe('Auswahl', chips) + filterGruppe('Einzelnes Set', einzeln);
  }
  if (currentTab === 'freestyle') {
    var themen = filterChip('thema', 'Alle', 'Alle', uebThema === 'Alle');
    Object.keys(VOCAB_THEMES).forEach(function (t) {
      themen += filterChip('thema', t, t, uebThema === t);
    });
    return filterGruppe('Thema', themen);
  }
  if (currentTab === 'grammatik') {
    // Gemeistertes lässt sich damit jederzeit wiederholen — der Reihe nach
    // kommt es sonst erst zurück, wenn die Auffrischfrist um ist.
    var bausteine = filterChip('gramwahl', '', 'Der Reihe nach', gramWahl === null);
    GRAMMATIK.forEach(function (b) {
      var stufe = gramBox(b);
      bausteine += filterChip('gramwahl', b.id,
        b.name + ' · ' + (gramGemeistert(b) ? 'sitzt' : 'Stufe ' + stufe),
        gramWahl === b.id);
    });
    return filterGruppe('Baustein', bausteine);
  }
  if (currentTab === 'tippen') {
    return filterGruppe('Stapel',
      filterChip('tmodus', 'lernen', 'Lernen · ' + tippenLernen().length, tippenModus === 'lernen') +
      filterChip('tmodus', 'wiederholung', 'Wiederholung · ' + tippenWiederholung().length,
        tippenModus === 'wiederholung'));
  }
  if (currentTab === 'uebersetzen') {
    var st = '';
    satzStufen().forEach(function (n) {
      st += filterChip('stufe', n, 'Stufe ' + n + ' · ' + freieSaetze(n).length + '/' +
        stufenSaetze(n).length, trLevel === n);
    });
    return filterGruppe('Stufe', st) +
      filterGruppe('Richtung',
        filterChip('richtung', 'gemischt', 'Gemischt', trDir === 'gemischt') +
        filterChip('richtung', 'ru-de', 'RU \u2192 DE', trDir === 'ru-de') +
        filterChip('richtung', 'de-ru', 'DE \u2192 RU', trDir === 'de-ru')) +
      filterGruppe('Stapel',
        filterChip('trmodus', 'lernen', 'Lernen \u00b7 ' + trLernen(trLevel).length, trModus === 'lernen') +
        filterChip('trmodus', 'wiederholung', 'Wiederholung \u00b7 ' + trWiederholung(trLevel).length,
          trModus === 'wiederholung') +
        filterChip('trmodus', 'alle', 'Alle \u00b7 ' + freieSaetze(trLevel).length,
          trModus === 'alle'));
  }
  if (currentTab === 'buchstaben') {
    // Die Tafel steckt im eigenen Knopf daneben, nicht mehr hier — sie ist
    // keine Einstellung, sondern ein zweiter Ort.
    return filterGruppe('Gefragt wird',
      filterChip('abcrichtung', 'gemischt', 'Gemischt', abcRichtung === 'gemischt') +
      filterChip('abcrichtung', 'zeichen', 'Zeichen \u2192 Laut', abcRichtung === 'zeichen') +
      filterChip('abcrichtung', 'laut', 'Laut \u2192 Zeichen', abcRichtung === 'laut'));
  }
  return '';
}

// Eine Auswahl wirkt sofort: Panel zu, Übung neu aufsetzen, Knopf nachziehen.
function filterWaehlen(gruppe, wert) {
  filterSetzen(false);
  if (gruppe === 'set') {
    uebAuswahl = (wert === 'aktuell' || wert === 'alle') ? wert : parseInt(wert, 10);
    uebNext(true);
  } else if (gruppe === 'thema') {
    uebThema = wert;
    uebNext(true);
  } else if (gruppe === 'tmodus') {
    if (tippenModus !== wert) {
      tippenModus = wert;
      tWord = null; tResult = null; tHint = false;
    }
    renderTippen();
  } else if (gruppe === 'gramwahl') {
    gramWahl = wert || null;
    gramBaustein = gramWahl;
    gramQ = null;
    gramRegelNeu = false;
    gramRegelOffen = false;
    renderGrammatik();
    renderKopf();
  } else if (gruppe === 'abcrichtung') {
    if (abcRichtung !== wert) {
      abcRichtung = wert;
      abcQ = null;   // die laufende Frage passt zur alten Richtung
    }
    abcOffen = null;
    renderBuchstaben();
    renderKopf();
  } else {
    if (gruppe === 'stufe') trLevel = parseInt(wert, 10);
    if (gruppe === 'richtung') trDir = wert;
    if (gruppe === 'trmodus') trModus = wert;
    trTask = null; trBuilt = []; trPhase = 'ask'; trCorrect = null; trRevealed = false;
    buildTransTask();
    renderUebersetzen();
  }
  renderFilter();
}

function renderFilter() {
  var knopf = document.getElementById('filterKnopf');
  var hat = filterHatWahl();
  knopf.hidden = !hat;
  if (!hat) { filterSetzen(false); return; }
  knopf.classList.toggle('aktiv', filterAktiv());
  var panel = document.getElementById('filterInhalt');
  panel.innerHTML = filterInhaltHtml();
  panel.querySelectorAll('[data-fw]').forEach(function (b) {
    b.addEventListener('click', function () { filterWaehlen(b.dataset.fw, b.dataset.fv); });
    b.tabIndex = filterOffen ? 0 : -1;
  });
}

// ── Wissen: warum steht dieses Wort so da? ──────────────────
// Die Frage entsteht mitten im Satz — also wird sie dort beantwortet. Zwei Wege
// hinein: ein Wort antippen oder der Knopf für den ganzen Satz. Er heißt
// «Wissen» und nicht «Tipp»: Ein Tipp ist etwas, das man sich versagt, Wissen
// soll man sich holen (ADR 0030).
var wissenOffen = false;
var wissenWort = null;   // angetipptes Wort, sonst alle

function wissenSetzen(auf) {
  var vorher = wissenOffen;
  wissenOffen = auf && wissenHatWas();
  document.body.classList.toggle('wissen-offen', wissenOffen);
  var knopf = document.getElementById('wissenKnopf');
  knopf.setAttribute('aria-expanded', wissenOffen ? 'true' : 'false');
  document.getElementById('wissenPanel').setAttribute('aria-hidden', wissenOffen ? 'false' : 'true');
  if (!wissenOffen) wissenWort = null;
  // Nur beim echten Umschalten — sonst flöge die Figur bei jedem Zeichnen.
  if (wissenOffen !== vorher) chiliAktualisieren();
}

// Erklärt wird nur die russische Seite — und nur dann, wenn sie ohnehin
// dasteht. In der Richtung DE → RU wäre jede Erklärung die halbe Lösung.
function wissenHatWas() {
  return currentTab === 'uebersetzen' && !!trTask &&
    (trTask.dir === 'ru-de' || trPhase === 'feedback');
}

// Ein Wort des Satzes nachschlagen: erst als gebeugte Form, dann als Grundform.
function wissenZuWort(wort) {
  var rein = String(wort).replace(/[.,!?;:«»]/g, '');
  var klein = rein.toLowerCase();
  var formen = (trTask && trTask.satz && trTask.satz.formen) || {};
  var schluessel = null;
  Object.keys(formen).forEach(function (f) {
    if (f.toLowerCase() === klein) schluessel = f;
  });
  if (schluessel) {
    var grundform = formen[schluessel][0];
    var rolle = formen[schluessel][1];
    var v = VOKABEL[grundform];
    return {
      wort: rein, art: 'form', grundform: grundform, rolle: rolle,
      vokabel: v, geschlecht: v ? geschlecht(v.art) : ''
    };
  }
  var direkt = VOKABEL[klein] || VOKABEL[rein];
  if (direkt) return { wort: rein, art: 'grundform', vokabel: direkt };
  return { wort: rein, art: 'offen' };
}

var ROLLE_NAME = {
  akk: 'Akkusativ — wen? was?',
  praep: 'Präpositiv — wo?'
};
PERSONEN.forEach(function (p) {
  ROLLE_NAME['praes' + p] = 'Präsens · ' + PERSON_NAME[p] + ' — ' + PERSON_DE[p];
});

function wissenKarteHtml(e) {
  if (e.art === 'grundform') {
    var v = e.vokabel;
    return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(v.ru) +
      hoerknopf(v.ru, 'ru') + '</p>' +
      '<p class="wissen-zeile">' + esc(v.de) + ' · <span class="translit">[' +
      esc(v.tr) + ']</span></p>' +
      (istNomen(v.art)
        ? '<p class="wissen-regel">Grundform · ' + GESCHLECHT_NAME[geschlecht(v.art)] + '</p>'
        : '<p class="wissen-regel">Grundform</p>') + '</div>';
  }
  if (e.art === 'offen') {
    return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(e.wort) + '</p>' +
      '<p class="wissen-regel offen">Diese Form ist noch nicht erklärt — sie kommt mit ' +
      'einem späteren Baustein in «Grammatik».</p></div>';
  }
  var g = e.geschlecht;
  var grund = e.grundform;
  var gleich = e.wort.toLowerCase() === grund.toLowerCase();
  var verb = e.rolle.indexOf('praes') === 0;
  // Am Satzanfang steht die Form groß. Kleinschreiben darf man sie nur, wenn
  // auch die Grundform klein ist — «Россия» bleibt sonst «россии».
  var form = grund.charAt(0) === grund.charAt(0).toLowerCase()
    ? e.wort.toLowerCase() : e.wort;
  var warum;
  if (verb) warum = gramVerbWarum(grund, e.rolle.slice(5), form);
  else if (e.rolle === 'praep' && e.vokabel) {
    warum = gramNomenWarum(grund, e.vokabel.art, form);
  } else if (gleich) {
    warum = 'Hier ändert sich nichts — die Form ist dieselbe wie die Grundform.';
  } else {
    warum = '<span class="cyr">' + esc(grund.slice(-1)) + '</span> wird zu <span class="cyr">' +
      esc(e.wort.slice(-1).toLowerCase()) + '</span>.';
  }
  return '<div class="wissen-karte"><p class="wissen-wort cyr">' + esc(e.wort) +
    hoerknopf(e.wort, 'ru') + '</p>' +
    '<p class="wissen-zeile"><span class="cyr">' + esc(grund) + '</span>' +
    (e.vokabel ? ' · ' + esc(e.vokabel.de) : '') +
    (g && !verb ? ' · ' + GESCHLECHT_NAME[g] : '') + '</p>' +
    '<p class="wissen-regel">' + esc(ROLLE_NAME[e.rolle] || e.rolle) + '</p>' +
    '<p class="wissen-warum">' + warum + '</p></div>';
}

function wissenInhaltHtml() {
  if (!trTask) return '';
  var text = trTask.dir === 'ru-de' ? trTask.prompt : trTask.solution;
  var worte = text.split(/\s+/).filter(Boolean);
  var eintraege = wissenWort ? [wissenZuWort(wissenWort)] : worte.map(wissenZuWort);
  var html = '';
  if (wissenWort) {
    html += '<button class="chip wissen-alle" id="wissenAlle">Ganzer Satz</button>';
  }
  eintraege.forEach(function (e) { html += wissenKarteHtml(e); });
  return html;
}

// Knopf und Blatt ziehen um: in die Kachel, sobald eine einen Platz aufstellt,
// sonst zurück in den Kopf. Umhängen statt neu bauen — sonst verlöre der Knopf
// seinen Zuhörer, und die Chili stünde in einem Element, das es nicht mehr gibt.
// Umgehängt wird erst, wenn die Ansicht steht: `renderKopf()` läuft **vor**
// dem Zeichnen, und ein Platzhalter der alten Ansicht wäre gleich darauf mit

function wissenHeimschicken() {
  var huelle = document.getElementById('wissenHuelle');

  var platz = main.querySelector('[data-wissenplatz]');

  if (ziel && huelle.parentElement !== ziel) ziel.appendChild(huelle);
}

// ── Der Rückweg ─────────────────────────────────────────────
// Zurück heißt: dorthin, wo man herkam — nicht stur nach Home. Wer aus der
// Bilanz zu den Fakten abbiegt, will von dort in die Bilanz zurück, nicht an
// den Anfang. Der Stapel merkt sich die Ansichten davor.
//
// Er kann nicht wachsen: Home räumt ihn leer — dort endet jeder Weg —, und wer
// dorthin zurücksteuert, wo er gerade herkam, nimmt den Schritt zurück, statt
// einen zweiten daraufzusetzen. Ein Hin und Her zwischen zwei Ansichten
// hinterlässt also keinen Rest. Die Obergrenze ist nur die Reißleine.
var STAPEL_MAX = 12;
var ansichtStapel = [];

function stapelMerken(neu) {
  if (neu === currentTab) return;
  if (neu === 'home') { ansichtStapel.length = 0; return; }
  if (ansichtStapel[ansichtStapel.length - 1] === neu) { ansichtStapel.pop(); return; }
  ansichtStapel.push(currentTab);
  if (ansichtStapel.length > STAPEL_MAX) ansichtStapel.shift();
}

function setTab(name, zurueck) {
  if (UEBUNG_NAME[name] || name === 'home') letzterTab = name;
  if (!zurueck) stapelMerken(name);
  currentTab = name;
  window.scrollTo(0, 0);
  render();
  // Erst zeichnen, dann schließen: die Platzwahl der Chili liefe sonst noch
  // über den Inhalt der alten Ansicht.
  chiliZusammen(function () {
    filterSetzen(false);
    wissenSetzen(false);
    menuSetzen(false);
  });
}

function zurueckGehen() {
  if (currentTab === 'home') return;
  // Aus einer Detailansicht der Bilanz führt der Weg zunächst dorthin zurück.
  if (currentTab === 'bilanz' && bilanzDetail) {
    bilanzDetail = null;
    renderBilanz();
    renderKopf();
    return;
  }
  setTab(ansichtStapel.pop() || 'home', true);
}

document.getElementById('zurueck').addEventListener('click', zurueckGehen);

// ── Vom Rand wischen ────────────────────────────────────────
// Im Vollbild der Home-Bildschirm-Verknüpfung gibt es die Zurück-Geste des
// Browsers nicht; der Pfeil oben links ist der einzige Weg. Eine Wischgeste
// vom linken Rand nimmt ihm die Arbeit ab.
//
// Sie startet nur am äußersten Rand — dort liegt kein Bedienelement — und
// wirkt erst am Ende der Berührung. Ein Tippen bewegt nichts und löst darum
// nichts aus. Ist ein Blatt offen, schweigt sie: Menü, Auswahl und Meldeblatt
// haben ihre eigene Art, sich zu schließen.
var WISCH_RAND = 26;          // px vom linken Rand, in denen die Geste beginnen darf
var WISCH_WEG = 70;           // px, die der Finger mindestens zurücklegen muss
var wischVonX = 0, wischVonY = 0, wischBereit = false;

function blattOffen() {
  return menuOffen || filterOffen || wissenOffen || meldeOffen;
}

document.addEventListener('touchstart', function (e) {
  wischBereit = false;
  if (e.touches.length !== 1 || currentTab === 'home' || blattOffen()) return;
  var t = e.touches[0];
  if (t.clientX > WISCH_RAND) return;
  wischBereit = true;
  wischVonX = t.clientX;
  wischVonY = t.clientY;
}, { passive: true });

document.addEventListener('touchend', function (e) {
  if (!wischBereit) return;
  wischBereit = false;
  if (blattOffen()) return;
  var t = e.changedTouches[0];
  var quer = t.clientX - wischVonX;
  var hoch = Math.abs(t.clientY - wischVonY);
  // Waagerecht muss deutlich überwiegen, sonst war es ein Scrollen.
  if (quer >= WISCH_WEG && hoch <= quer * 0.7) zurueckGehen();
}, { passive: true });

document.addEventListener('touchcancel', function () { wischBereit = false; }, { passive: true });

// ── Home ────────────────────────────────────────────────────
// Nicht bloß ein Verzeichnis: jede Kachel sagt, was dort gerade ansteht.
// Was auf der Kachel steht — und zwei Kennzeichen für die Empfehlung:
// `gesperrt` heißt «hier geht noch nichts», `leer` heißt «hier ist gerade
// nichts zu tun». Beides darf sie nicht vorschlagen.
function uebungsStand(id) {
  var jetzt = Date.now();
  if (id === 'lernsets') {
    var set = LERNSETS[aktuellesSet()];
    var offen = set.woerter.filter(function (v) { return (state.boxes[v.id] || 0) < SATZ_STUFE; }).length;
    return offen
      ? { text: 'Set ' + (aktuellesSet() + 1) + ' · ' + offen + ' offen', warm: true }
      : { text: 'Set ' + (aktuellesSet() + 1) + ' · bereit' };
  }
  if (id === 'freestyle') {
    var faellige = faelligeAnzahl(ALL_VOCAB);
    var begonnen = ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) > 0; }).length;
    return faellige
      ? { text: faellige + ' fällig', warm: true }
      : { text: begonnen + ' von ' + ALL_VOCAB.length + ' begonnen' };
  }
  if (id === 'tippen') {
    var lernen = tippenLernen().length, frisch = tippenWiederholung().length;
    if (!lernen && !frisch) {
      return tippenRuhend().length
        ? { text: 'alles getippt', leer: true }
        : { text: 'noch gesperrt', gesperrt: true };
    }
    return { text: lernen + ' offen' + (frisch ? ' · ' + frisch + ' fällig' : ''), warm: !!frisch };
  }
  if (id === 'uebersetzen') {
    var frei = 0, offen2 = 0, faellig2 = 0;
    [1, 2, 3].forEach(function (n) {
      frei += freieSaetze(n).length;
      offen2 += trLernen(n).length;
      faellig2 += trWiederholung(n).length;
    });
    if (!frei) return { text: 'noch gesperrt', gesperrt: true };
    if (!offen2 && !faellig2) return { text: 'alles übersetzt', leer: true };
    return { text: offen2 + ' offen' + (faellig2 ? ' · ' + faellig2 + ' fällig' : ''), warm: !!faellig2 };
  }
  if (id === 'buchstaben') {
    var sitzt = abcGelernt();
    var offen2 = abcPool().length;
    if (!offen2) return { text: 'alles gemeistert', leer: true };
    var faelligAbc = ALPHABET.filter(function (b) {
      return abcGemeistert(b) && abcFaellig(b, jetzt);
    }).length;
    return {
      text: sitzt + ' von ' + ALPHABET.length + ' sitzen' +
        (faelligAbc ? ' · ' + faelligAbc + ' fällig' : ''),
      warm: sitzt === 0 || !!faelligAbc
    };
  }
  if (id === 'grammatik') {
    var sitzen = gramMeisterschaft();
    var offenG = gramPool().length;
    if (!offenG) return { text: 'alle Regeln sitzen', leer: true };
    var naechster = gramWaehlen();
    return {
      text: naechster && !gramEntdeckt(naechster)
        ? naechster.name + ' · neu'
        : sitzen + ' von ' + GRAMMATIK.length + ' Regeln',
      warm: sitzen === 0
    };
  }
  if (id === 'power') {
    var gefallen = ptPool().length;
    if (gefallen < PT_MINDEST) {
      return {
        text: gefallen ? gefallen + ' von ' + PT_MINDEST + ' Wörtern' : 'nichts gefallen',
        gesperrt: true
      };
    }
    return { text: gefallen + ' Wörter warten', warm: true };
  }
  return { text: '' };
}

// Der eine Knopf, der immer richtig ist: was jetzt am meisten bringt.
// ── Wo war ich stehen geblieben? ────────────────────────────
// Eine abgegebene Antwort ist der einzige verlässliche Beleg dafür, woran
// jemand gearbeitet hat — Herumblättern zählt nicht.
function zuletztGeuebt(id) {
  state.zuletzt = { uebung: id, zeit: Date.now() };
}

// Zwei Stunden: lang genug, um eine Unterbrechung zu überstehen, kurz genug,
// dass die Empfehlung am nächsten Tag wieder aus dem Lernstand kommt und nicht
// aus dem Gedächtnis.
var FORTSETZEN_FRIST = 2 * 60 * 60 * 1000;

function empfehlung() {
  var z = state.zuletzt;
  if (z && Date.now() - z.zeit < FORTSETZEN_FRIST && UEBUNG_NAME[z.uebung]) {
    var stand = uebungsStand(z.uebung);
    // «Weiter mit …» nur, wenn dort auch etwas wartet. Wer die Buchstaben
    // gerade fertig gemeistert hat, wurde sonst dorthin zurückgeschickt — in
    // einen Leerzustand, der ihn wieder nach Home schickt.
    if (!stand.gesperrt && !stand.leer) {
      return {
        ziel: z.uebung,
        titel: 'Weiter mit «' + UEBUNG_NAME[z.uebung] + '»',
        note: stand.text + ' · Sie waren gerade dort.'
      };
    }
  }
  var set = LERNSETS[aktuellesSet()];
  var offen = set.woerter.filter(function (v) { return (state.boxes[v.id] || 0) < SATZ_STUFE; }).length;
  var frisch = tippenWiederholung().length;
  var trFrisch = trWiederholung(1).length + trWiederholung(2).length + trWiederholung(3).length;

  if (frisch + trFrisch >= 5) {
    return {
      ziel: frisch >= trFrisch ? 'tippen' : 'uebersetzen',
      titel: 'Erst auffrischen',
      note: (frisch + trFrisch) + ' Dinge warten auf die Sicherheitsrunde.'
    };
  }
  if (offen) {
    return {
      ziel: 'lernsets',
      titel: 'Weiter mit Set ' + (aktuellesSet() + 1),
      note: offen + (offen === 1 ? ' Wort' : ' Wörter') + ' bis zu ' +
        set.saetze.length + (set.saetze.length === 1 ? ' neuen Satz' : ' neuen Sätzen') + '.'
    };
  }
  var offeneSaetze = trLernen(1).length + trLernen(2).length + trLernen(3).length;
  if (offeneSaetze) {
    return { ziel: 'uebersetzen', titel: 'Sätze bauen', note: offeneSaetze + ' Sätze warten auf Sie.' };
  }
  if (tippenLernen().length) {
    return { ziel: 'tippen', titel: 'Schreiben üben', note: tippenLernen().length + ' Wörter sitzen fast.' };
  }
  return { ziel: 'freestyle', titel: 'Freies Training', note: 'Alles Fällige ist erledigt — Zeit für eine Kür.' };
}

function renderHome() {
  var e = empfehlung();
  var html = '<section>' +
    '<button class="empfehlung" id="homeEmpf">' + maskottchen('klein') +
    '<span class="empf-text"><span class="empf-label">Als Nächstes</span>' +

    '<span class="empf-note">' + esc(e.note) + '</span></span></button>';

  html += '<div class="kachelfeld">';
  UEBUNGEN.forEach(function (u) {
    var st = uebungsStand(u.id);
    html += '<button class="kachel' + (st.gesperrt ? ' gesperrt' : '') + '" data-uebung="' + u.id + '">' +
      '<span class="kachel-name">' + esc(u.name) + '</span>' +
      '<span class="kachel-note">' + esc(u.note) + '</span>' +
      '<span class="kachel-stand' + (st.warm ? ' faellig' : '') + '">' + esc(st.text) + '</span></button>';
  });
  html += '</div></section>';
  main.innerHTML = html;

  document.getElementById('homeEmpf').addEventListener('click', function () { setTab(e.ziel); });
  main.querySelectorAll('[data-uebung]').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.uebung); });
  });
}

function render() {
  // Erst nach Hause, dann zeichnen: Steckt die Wissenshülle noch in der alten
  // Kachel, wirft `main.innerHTML` sie mit weg — Knopf, Blatt und Zuhörer
  // wären fort. `renderWissen()` holt sie danach wieder in die neue.
  wissenHeimschicken();
  renderKopf();
  if (currentTab === 'home') renderHome();
  else if (currentTab === 'lernsets' || currentTab === 'freestyle') {
    var modus = currentTab;
    if (modus !== uebModus) { uebModus = modus; uebZuruecksetzen(); }
    renderUeben();
  }
  else if (currentTab === 'uebersetzen') renderUebersetzen();
  else if (currentTab === 'tippen') renderTippen();
  else if (currentTab === 'buchstaben') renderBuchstaben();
  else if (currentTab === 'grammatik') renderGrammatik();
  else if (currentTab === 'power') renderPower();
  else if (currentTab === 'einstellungen') renderEinstellungen();
  else if (currentTab === 'fakten') renderFakten();
  else if (currentTab === 'tickets') renderTickets();
  else if (currentTab === 'sicherung') renderSicherung();
  else renderBilanz();
  wissenUmhaengen();
  updateKopf();
}

// ── ÜBEN: LERNSETS UND FREESTYLE ────────────────────────────
// Beide Übungen teilen sich Fragelogik und Zustand; unterschiedlich sind nur
// der Wortvorrat und der Kopf über der Frage.
var uebModus = 'lernsets';   // 'lernsets' · 'freestyle'
var uebAuswahl = 'aktuell';  // 'aktuell' · 'alle' · Nummer eines freien Sets
var uebThema = 'Alle';       // nur im Freestyle
var uebLesen = false;        // nur im Freestyle: nur Wörter aus gemeisterten Buchstaben
var uebQ = null;
var uebPhase = 'ask'; // ask | feedback | fact
var uebBuilt = [];
var uebPicked = null;
var uebCorrect = null;
var uebRevealed = false;
var uebFactText = '';
var uebGeschafftesSet = null; // Nummer eines Sets, das gerade fertig wurde

// «Lernsets» arbeiten das laufende Set ab, «Freestyle» ein Thema freier Wahl.
function uebPool() {
  if (uebModus === 'freestyle') {
    var frei = uebThema === 'Alle' ? ALL_VOCAB
      : ALL_VOCAB.filter(function (v) { return v.theme === uebThema; });
    // Der Lesemodus schneidet quer durch die Themen: Er fragt nicht, wovon ein
    // Wort handelt, sondern ob man es überhaupt entziffern kann.
    if (uebLesen) {
      var meister = gemeisterteBuchstaben();
      frei = frei.filter(function (v) { return wortLesbar(v, meister); });
    }
    return frei;
  }
  if (uebAuswahl === 'alle') return freigeschalteteWoerter();
  var nr = uebAuswahl === 'aktuell' ? aktuellesSet() : uebAuswahl;
  if (!setFrei(nr)) nr = aktuellesSet();
  return LERNSETS[nr].woerter;
}

// Auswahl in drei Stufen: erstens fällige Wiederholungen, zweitens noch nie
// gesehene Wörter, drittens — innerhalb einer Sitzung der Regelfall — das am
// längsten Zurückliegende mit der niedrigsten Stufe.
// «nurWiederholen» überspringt die ersten beiden Stufen: Wer ausdrücklich
// wiederholt, will den ganzen Bestand, nicht bloß das noch Unbekannte.
function waehleWort(pool, nurWiederholen) {
  if (!pool.length) return null;
  var jetzt = Date.now();
  var faellige = pool.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); });
  var neue = pool.filter(function (v) { return !state.lastSeen[v.id]; });
  var quelle, nachAlter = false;
  if (nurWiederholen) {
    // Wiederholen heißt: bereits Begonnenes, das am längsten zurückliegt.
    quelle = pool.filter(function (v) { return state.lastSeen[v.id]; });
    nachAlter = true;
    if (!quelle.length) { quelle = pool; nachAlter = false; }
  } else if (faellige.length && (!neue.length || Math.random() < 0.65)) quelle = faellige;
  else if (neue.length) quelle = neue;
  else quelle = pool;

  var sortiert = quelle.slice().sort(function (a, b) {
    var boxA = state.boxes[a.id] || 0, boxB = state.boxes[b.id] || 0;
    var zeitA = state.lastSeen[a.id] || 0, zeitB = state.lastSeen[b.id] || 0;
    if (nachAlter) return zeitA - zeitB || boxA - boxB;
    if (boxA !== boxB) return boxA - boxB;
    return zeitA - zeitB;
  });
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}
// Zwei bis drei Buchstaben, die nicht im Wort stehen — bevorzugt solche, die
// dem Wort ähnlich sehen könnten.
function zusatzBuchstaben(wort) {
  var drin = {};
  wort.split('').forEach(function (c) { drin[c] = true; });
  var alphabet = KB_ROWS.reduce(function (a, reihe) { return a.concat(reihe); }, []);
  var frei = alphabet.filter(function (c) { return !drin[c]; });
  var wieviele = wort.length <= 4 ? 2 : 3;
  return shuffle(frei).slice(0, Math.min(wieviele, frei.length));
}

function buildQuestion() {
  var pool = uebPool();
  var word = waehleWort(pool, uebModus === 'lernsets' && uebAuswahl === 'alle');
  if (!word) return null;
  var box = state.boxes[word.id] || 0;
  // Unter drei Buchstaben ist nichts zusammenzusetzen — «я» oder «в» als Kachelaufgabe
  // wäre eine Farce. Über zwölf Buchstaben passt die Reihe nicht mehr aufs Telefon.
  var canTile = word.ru.indexOf(' ') === -1 && word.ru.length >= 3 && word.ru.length <= 12;
  var mode;
  // Im Lesemodus rücken die Kacheln eine Stufe vor: Dort geht es um die
  // Buchstaben, und zusammensetzen ist die Übung, die danach fragt. Auf Stufe 0
  // bleibt es bei der Auswahl — ein nie gesehenes Wort zu legen wäre Raten.
  var kachelAb = uebLesen ? 1 : 2;
  if (box < kachelAb) mode = Math.random() < 0.5 ? 'mc-de' : 'mc-ru';
  else mode = canTile ? 'tiles' : 'mc-ru';

  if (mode === 'tiles') {
    // Mehr Kacheln als Buchstaben: erst dadurch zeigt sich, ob die Schreibweise
    // wirklich sitzt, statt dass man die vorhandenen Kacheln durchprobiert.
    var buchstaben = word.ru.split('');
    var tiles = shuffle(buchstaben.concat(zusatzBuchstaben(word.ru)));
    for (var i = 0; i < 10 && tiles.slice(0, buchstaben.length).join('') === word.ru; i++) {
      tiles = shuffle(tiles);
    }
    return {
      word: word, mode: mode, laenge: buchstaben.length,
      tiles: tiles.map(function (ch, k) { return { ch: ch, key: k }; })
    };
  }
  // Ablenker aus allem, womit schon gearbeitet wurde — sonst wiederholen sich
  // innerhalb eines Sets immer dieselben drei. Gleiches Thema zuerst, das fordert mehr.
  var quelle = verwechslungsPool();
  if (quelle.length < 4) quelle = ALL_VOCAB;
  var sameTheme = quelle.filter(function (v) { return v.theme === word.theme && v.id !== word.id; });
  var others = quelle.filter(function (v) { return v.theme !== word.theme && v.id !== word.id; });
  var distractors = shuffle(sameTheme).concat(shuffle(others)).slice(0, 3);
  return { word: word, mode: mode, options: shuffle([word].concat(distractors)) };
}
// Setzt die laufende Frage zurück, ohne zu zeichnen.

}
