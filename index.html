document.getElementById('heimKnopf').innerHTML = ICON.heim;
document.getElementById('heimKnopf').addEventListener('click', function () { setTab('home'); });
document.getElementById('wissenKnopf').addEventListener('click', function (e) {
  e.stopPropagation();
  chiliZusammen(function () {
    menuSetzen(false);
    filterSetzen(false);
    wissenWort = null;
    wissenSetzen(!wissenOffen);
  });
  renderWissen();
});
document.getElementById('tafelKnopf').addEventListener('click', function (e) {
  e.stopPropagation();
  chiliZusammen(function () {
    menuSetzen(false);
    filterSetzen(false);
  });
  abcAnsicht = abcAnsicht === 'tafel' ? 'ueben' : 'tafel';
  abcOffen = null;
  renderBuchstaben();
  renderKopf();
});
document.querySelectorAll('.menueintrag').forEach(function (b) {
  b.addEventListener('click', function () {
    ansichtAnfang(b.dataset.ziel);
    setTab(b.dataset.ziel);
  });
});
// Daneben tippen schließt — aber nur, wenn offen; sonst kostet jeder Tipp auf
// der Seite unnötig Arbeit.
document.addEventListener('click', function (e) {
  if (!menuOffen && !filterOffen && !wissenOffen) return;
  var daneben = function (id) {
    return !document.getElementById(id + 'Panel').contains(e.target) &&
      !document.getElementById(id + 'Knopf').contains(e.target);
  };
  chiliZusammen(function () {
    if (menuOffen && daneben('menu')) menuSetzen(false);
    if (filterOffen && daneben('filter')) filterSetzen(false);
    if (wissenOffen && daneben('wissen')) wissenSetzen(false);
  });
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  chiliZusammen(function () {
    if (menuOffen) menuSetzen(false);
    if (filterOffen) filterSetzen(false);
    if (wissenOffen) wissenSetzen(false);
  });
});

// ── Home ────────────────────────────────────────────────────
// Nicht bloß ein Verzeichnis: jede Kachel sagt, was dort gerade ansteht.
// Was auf der Kachel steht — und zwei Kennzeichen für die Empfehlung:
// `gesperrt` heißt «hier geht noch nichts», `leer` heißt «hier ist gerade
// nichts zu tun». Beides darf sie nicht vorschlagen.
function uebungsStand(id) {
  var jetzt = Date.now();
  if (id === 'lernsets') {
    var set = LERNSETS[aktuellesSet()];
    // Bremst das Tagesmaß das ganze Set aus, ist hier nichts zu holen — und
    // eine Übung ohne Arbeit wird nie empfohlen.
    if (!uebVorrat(set.woerter).length) return { text: 'Tagesmaß erreicht', leer: true };
    var offen = set.woerter.filter(function (v) { return (state.boxes[v.id] || 0) < SATZ_STUFE; }).length;
    return offen
      ? { text: 'Set ' + (aktuellesSet() + 1) + ' · ' + offen + ' offen', warm: true }
      : { text: 'Set ' + (aktuellesSet() + 1) + ' · bereit' };
  }
  if (id === 'freestyle') {
    var faellige = faelligeAnzahl(ALL_VOCAB);
    var begonnen = ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) > 0; }).length;
    return faellige
      ? { text: faellige + ' fällig', warm: true }
      : { text: begonnen + ' von ' + ALL_VOCAB.length + ' begonnen' };
  }
  if (id === 'tippen') {
    var lernen = tippenLernen().length, frisch = tippenWiederholung().length;
    if (!lernen && !frisch) {
      return tippenRuhend().length
        ? { text: 'alles getippt', leer: true }
        : { text: 'noch gesperrt', gesperrt: true };
    }
    return { text: lernen + ' offen' + (frisch ? ' · ' + frisch + ' fällig' : ''), warm: !!frisch };
  }
  if (id === 'uebersetzen') {
    var frei = 0, offen2 = 0, faellig2 = 0;
    [1, 2, 3].forEach(function (n) {
      frei += freieSaetze(n).length;
      offen2 += trLernen(n).length;
      faellig2 += trWiederholung(n).length;
    });
    if (!frei) return { text: 'noch gesperrt', gesperrt: true };
    if (!offen2 && !faellig2) return { text: 'alles übersetzt', leer: true };
    return { text: offen2 + ' offen' + (faellig2 ? ' · ' + faellig2 + ' fällig' : ''), warm: !!faellig2 };
  }
  if (id === 'buchstaben') {
    var sitzt = abcGelernt();
    var offen2 = abcPool().length;
    if (!offen2) return { text: 'alles gemeistert', leer: true };
    var faelligAbc = ALPHABET.filter(function (b) {
      return abcGemeistert(b) && abcFaellig(b, jetzt);
    }).length;
    return {
      text: sitzt + ' von ' + ALPHABET.length + ' sitzen' +
        (faelligAbc ? ' · ' + faelligAbc + ' fällig' : ''),
      warm: sitzt === 0 || !!faelligAbc
    };
  }
  if (id === 'grammatik') {
    var sitzen = gramMeisterschaft();
    var offenG = gramPool().length;
    if (!offenG) return { text: 'alle Regeln sitzen', leer: true };
    var naechster = gramWaehlen();
    return {
      text: naechster && !gramEntdeckt(naechster)
        ? naechster.name + ' · neu'
        : sitzen + ' von ' + GRAMMATIK.length + ' Regeln',
      warm: sitzen === 0
    };
  }
  if (id === 'schreibung') {
    var sitzenS = orthoMeisterschaft();
    if (!orthoPool().length) return { text: 'alle Regeln sitzen', leer: true };
    var naechsteS = orthoWaehlen();
    return {
      text: naechsteS && !orthoEntdeckt(naechsteS)
        ? naechsteS.name + ' · neu'
        : sitzenS + ' von ' + ORTHO.length + ' Regeln',
      warm: sitzenS === 0
    };
  }
  if (id === 'power') {
    var gefallen = ptPool().length;
    if (gefallen < PT_MINDEST) {
      return {
        text: gefallen ? gefallen + ' von ' + PT_MINDEST + ' Wörtern' : 'nichts gefallen',
        gesperrt: true
      };
    }
    return { text: gefallen + ' Wörter warten', warm: true };
  }
  return { text: '' };
}

// Der eine Knopf, der immer richtig ist: was jetzt am meisten bringt.
// ── Wo war ich stehen geblieben? ────────────────────────────
// Eine abgegebene Antwort ist der einzige verlässliche Beleg dafür, woran
// jemand gearbeitet hat — Herumblättern zählt nicht.
function zuletztGeuebt(id) {
  state.zuletzt = { uebung: id, zeit: Date.now() };
}

// Zwei Stunden: lang genug, um eine Unterbrechung zu überstehen, kurz genug,
// dass die Empfehlung am nächsten Tag wieder aus dem Lernstand kommt und nicht
// aus dem Gedächtnis.
var FORTSETZEN_FRIST = 2 * 60 * 60 * 1000;

// Drei Zahlen, an denen die Leiter hängt. Sie stehen hier und nicht in den
// Einstellungen: Das ist Didaktik, keine Vorliebe.
//
// `ABC_ZUERST_BIS` — bis zu so vielen gemeisterten Wörtern gehen die Zeichen
// vor. Danach hat man den Beweis erbracht, dass man liest, und eine Ermahnung
// wäre Bevormundung.
var ABC_ZUERST_BIS = 40;
// Ab so vielen überfälligen Dingen lohnt eine eigene Runde. Darunter nimmt man
// sie nebenbei mit.
var AUFFRISCHEN_AB = 5;
// Vor dem zweiten Lernset erklärt Grammatik nichts, was man schon gesehen
// hätte — dieselbe Schwelle, die das Tutorial nennt.
var GRAMMATIK_AB_SET = 1;

// **Was fehlt, geht vor** (ADR 0066). Bis 2.4.7 fragte die Empfehlung als
// Erstes, wo man zuletzt war — und blieb dort, solange dort irgendetwas zu tun
// war. Das war eine Auskunft über die Vergangenheit, kein Vorschlag: Wer eine
// Stunde Freestyle gespielt hatte, bekam Freestyle, auch wenn zwölf Wörter
// zurückgefallen waren und die Buchstaben noch nicht saßen.
//
// Jetzt läuft eine Leiter von oben nach unten, und **die ersten beiden Sprossen
// sind Defizite** — etwas ist kaputtgegangen oder fehlt an der Wurzel. Sie
// stechen die Fortsetzung. Alles darunter sind Angebote; dort gewinnt die
// Fortsetzung, wenn man gerade dort war, denn eine Sitzung mittendrin
// abzubrechen hilft niemandem.
//
// Jede Sprosse nennt ihren **Grund**. Die Karte sagt damit nicht nur, wohin,
// sondern warum — das ist der ganze Unterschied zwischen einem Vorschlag und
// einer Ansage.
function empfLeiter() {
  var stufen = [];

  // 1 · Zurückgefallenes. Drei Fehlschreibungen hintereinander werfen ein Wort
  //     zurück und schließen seinen Satz wieder (ADR 0033). Das ist der einzige
  //     Weg, auf dem Gelerntes verlorengeht — er hat Vorrang vor allem.
  var gefallen = ptPool().length;
  if (gefallen >= PT_MINDEST) {
    stufen.push({
      ziel: 'power', dringend: true, titel: 'Zurückgeholt werden',
      note: gefallen + ' Wörter sind zurückgefallen und blockieren ihre Sätze.'
    });
  }

  // 2 · Die Zeichen. Solange sie nicht sitzen, ist jedes Wort nur ein Bild —
  //     und der ganze Weg darüber wackelt. Gefragt wird aber nur, solange man
  //     am Anfang steht: Wer längst Sätze baut, braucht keine Ermahnung mehr.
  var abcOffen = ALPHABET.filter(function (b) { return !abcSitzt(b); }).length;
  if (abcOffen && woerterGemeistert() < ABC_ZUERST_BIS) {
    stufen.push({
      ziel: 'buchstaben', dringend: true, titel: 'Erst die Zeichen',
      note: abcOffen + ' von 33 Buchstaben sitzen noch nicht.'
    });
  }

  // 3 · Überfälliges. Was die Auffrischfrist überschritten hat, verblasst.
  var frisch = tippenWiederholung().length;
  var trFrisch = trWiederholung(1).length + trWiederholung(2).length + trWiederholung(3).length;
  if (frisch + trFrisch >= AUFFRISCHEN_AB) {
    stufen.push({
      ziel: frisch >= trFrisch ? 'tippen' : 'uebersetzen', titel: 'Erst auffrischen',
      note: (frisch + trFrisch) + ' Dinge warten auf die Sicherheitsrunde.'
    });
  }

  // 4 · Der Hauptweg: die Wörter des laufenden Sets.
  var set = LERNSETS[aktuellesSet()];
  var offen = set.woerter.filter(function (v) { return (state.boxes[v.id] || 0) < SATZ_STUFE; }).length;
  if (offen) {
    stufen.push({
      ziel: 'lernsets', titel: 'Weiter mit Set ' + (aktuellesSet() + 1),
      note: offen + (offen === 1 ? ' Wort' : ' Wörter') + ' bis zu ' +
        set.saetze.length + (set.saetze.length === 1 ? ' neuen Satz' : ' neuen Sätzen') + '.'
    });
  }

  // 5 · Die Regel vor dem Satz. Wer Sätze offen hat und noch keinen einzigen
  //     Baustein entdeckt, versteht die Endungen nicht, die dort auf ihn
  //     warten — dann lohnt die Grammatik zuerst.
  var offeneSaetze = trLernen(1).length + trLernen(2).length + trLernen(3).length;
  var regelnGesehen = Object.keys(state.gramSeen || {}).length;
  if (offeneSaetze && !regelnGesehen && aktuellesSet() >= GRAMMATIK_AB_SET) {
    stufen.push({
      ziel: 'grammatik', titel: 'Warum sich Wörter ändern',
      note: 'Deine Sätze beugen Wörter — hier steht, nach welcher Regel.'
    });
  }

  // 6 · Die Sätze selbst.
  if (offeneSaetze) {
    stufen.push({
      ziel: 'uebersetzen', titel: 'Sätze bauen',
      note: offeneSaetze + (offeneSaetze === 1 ? ' Satz wartet' : ' Sätze warten') + ' auf dich.'
    });
  }

  // 7 · Schreiben, wo Wörter fast sitzen.
  if (tippenLernen().length) {
    stufen.push({
      ziel: 'tippen', titel: 'Schreiben üben',
      note: tippenLernen().length + ' Wörter sitzen fast.'
    });
  }

  // 8 · Und wenn alles erledigt ist, die Kür.
  stufen.push({
    ziel: 'freestyle', titel: 'Freies Training',
    note: 'Alles Fällige ist erledigt — Zeit für eine Kür.'
  });
  return stufen;
}

function empfehlung() {
  var stufen = empfLeiter().filter(function (st) {
    // Eine Übung, die nichts hergibt, wird nie empfohlen — und eine, die der
    // Nutzer auf der Übersicht ausgeblendet hat, auch nicht: Ihm etwas
    // vorzuschlagen, das er weggeräumt hat, wäre Widerspruch statt Rat.
    var stand = uebungsStand(st.ziel);
    return !stand.gesperrt && !stand.leer && kachelSichtbar(st.ziel);
  });
  if (!stufen.length) {
    return { ziel: 'freestyle', titel: 'Freies Training',
      note: 'Alles Fällige ist erledigt — Zeit für eine Kür.' };
  }
  var oben = stufen[0];

  // **Die Fortsetzung sticht nur die Angebote, nicht die Defizite.** Wer vor
  // fünf Minuten mitten in einer Übung war, soll dorthin zurück — aber nicht,
  // wenn inzwischen etwas zurückgefallen ist.
  var z = state.zuletzt;
  if (!oben.dringend && z && Date.now() - z.zeit < FORTSETZEN_FRIST && UEBUNG_NAME[z.uebung]) {
    var stand = uebungsStand(z.uebung);
    // Gefragt wird die Übung selbst, nicht die Leiter: Auch was dort nicht
    // vorkommt — «Buchstaben» für den, der längst Sätze baut — darf man
    // fortsetzen. Nur leer oder gesperrt darf es nicht sein.
    if (!stand.gesperrt && !stand.leer && kachelSichtbar(z.uebung)) {
      var aufLeiter = null;
      stufen.forEach(function (st) { if (st.ziel === z.uebung && !aufLeiter) aufLeiter = st; });
      return {
        ziel: z.uebung,
        titel: 'Weiter mit «' + UEBUNG_NAME[z.uebung] + '»',
        note: aufLeiter ? aufLeiter.note : stand.text + ' · Du warst gerade dort.'
      };
    }
  }
  return oben;
}

function renderHome() {
  var e = empfehlung();
  // **Wer die App noch nicht kennt, findet den Knopf zuerst.** Solange das
  // Tutorial nicht **einmal ganz** gelaufen ist, steht er ganz oben — über der
  // Empfehlung, als Erstes im Bild. Danach wandert er ans Ende: Wer ihn einmal
  // hatte, soll ihn übersehen dürfen, und der Platz oben gehört dann dem, was
  // zu tun ist.
  var neu = !state.tutorialFertig;
  var tutHtml = '<button class="tut-knopf' + (neu ? ' oben' : '') +
    '" id="tutKnopf">Tutorial</button>';
  var html = '<section>' + (neu ? tutHtml : '') +
    '<button class="empfehlung" id="homeEmpf">' + maskottchen('klein') +
    '<span class="empf-text"><span class="empf-label">Als Nächstes</span>' +
    '<span class="empf-titel">' + esc(e.titel) + '</span>' +
    '<span class="empf-note">' + esc(e.note) + '</span></span></button>';

  // **Meine Auswahl** (ADR 0075): automatisch das Fällige, oder genau das, was
  // im Einrichte-Fenster hierhergezogen wurde. Was empfohlen ist, steht schon
  // oben und wird hier nicht wiederholt.
  var offen = homeOben(e.ziel);
  if (offen.length) {
    html += '<p class="gruppe-titel">Meine Auswahl</p>' +
      '<div class="kachelfeld">' + offen.map(kachelHtml).join('') + '</div>';
  }

  // Und darunter das ganze Angebot hinter **einem** Tipp. Es steht immer im
  // Baum, nur zugeklappt: Das Tutorial zeigt auf einzelne Kacheln, und ein
  // Ziel, das es gar nicht gibt, wäre ein stiller Fehler (ADR 0051).
  html += '<button class="alle-knopf" id="homeAlleKnopf" aria-expanded="' +
    (homeOffen ? 'true' : 'false') + '" aria-controls="homeAlle">' +
    '<span>Weitere Übungen</span>' + ICON.winkelRunter + '</button>' +
    '<div class="alle-klapp" id="homeAlle"' + (homeOffen ? '' : ' hidden') + '>';
  var weitere = homeWeitere(offen);
  UEBUNG_GRUPPEN.forEach(function (g) {
    var sichtbar = g.ids.filter(function (id) { return weitere.indexOf(id) !== -1; });
    // Eine Gruppe, aus der alles ausgeräumt ist, hat auch keine Überschrift
    // verdient — sonst stünde dort ein Titel über nichts.
    if (!sichtbar.length) return;
    html += '<p class="gruppe-titel">' + esc(g.titel) + '</p>' +
      '<div class="kachelfeld' + (sichtbar.length === 1 ? ' breit' : '') + '">' +
      sichtbar.map(kachelHtml).join('') + '</div>';
  });
  // Alles oben und nichts übrig: Der Bereich bekommt eine Zeile statt einer
  // Leere — ein aufklappbarer Kasten, in dem nichts steht, sieht kaputt aus.
  if (!weitere.length) {
    html += '<p class="backup-note">Alles steht schon oben. Im Fenster ' +
      '«Übersicht einrichten» lässt sich das ändern.</p>';
  }
  html += '</div>';

  // **Nur solange es noch nie ganz lief** (ADR 0080). Danach sitzt der Knopf
  // klein und rund im Kopf, wie in jeder anderen Ansicht mit eigener Spur — ein
  // ruhiger Riegel am Seitenende war für etwas, das man selten braucht, immer
  // noch zu viel Platz.
  html += '</section>';
  main.innerHTML = html;

  document.getElementById('homeEmpf').addEventListener('click', function () { setTab(e.ziel); });
  // **Nicht `tutStarten` unmittelbar hängen** (ADR 0071): Der Zuhörer bekommt
  // das Ereignis als erstes Argument, und das landete in `ruhig` — jeder Klick
  // war damit ein «ohne Sprung», und die Figur stand im Tutorial plötzlich da,
  // statt hinzufliegen. Nur der automatische Start beim allerersten Öffnen ist
  // wirklich ruhig; dort steht das `true` ausgeschrieben.
  // Den goldenen Riegel gibt es nur, solange das Tutorial noch nie ganz lief —
  // danach trägt der runde Knopf im Kopf die Einladung (ADR 0080).
  var tutK = document.getElementById('tutKnopf');
  if (tutK) tutK.addEventListener('click', function () { tutStarten('home'); });
  document.getElementById('homeAlleKnopf').addEventListener('click', function () {
    homeOffen = !homeOffen;
    renderHome();
  });
  main.querySelectorAll('[data-uebung]').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.uebung); });
  });
}

// **Zeigt die Übersicht diese Kachel?** Der Nutzer darf ausräumen, was er nicht
// braucht (ADR 0066) — aber **nicht vor dem Scheinwerfer**: Solange das Tutorial
// läuft, stehen alle acht da. Acht seiner dreizehn Schritte zeigen auf je eine
// Kachel, und ein Wähler, der ins Leere zeigt, ist ein stiller Fehler
// (ADR 0051).
function kachelSichtbar(id) {
  if (tutOffen) return true;
  var aus = state.settings.homeAus;
  return !(aus && aus.indexOf(id) !== -1);
}

// Eine Kachel — dieselbe Gestalt oben wie unten. Sie steht genau einmal im
// Code: Eine Übung, die in beiden Listen anders aussähe, wäre zwei Übungen.
function kachelHtml(id) {
  var u = uebungVon(id);
  if (!u) return '';
  var st = uebungsStand(id);
  return '<button class="kachel' + (st.gesperrt ? ' gesperrt' : '') + '" data-uebung="' + id + '">' +
    '<span class="kachel-name">' + esc(u.name) + '</span>' +
    '<span class="kachel-note">' + esc(u.note) + '</span>' +
    '<span class="kachel-stand' + (st.warm ? ' faellig' : '') + '">' + esc(st.text) + '</span></button>';
}

// **Was heute noch wartet.** Eine Übung zählt, wenn dort wirklich etwas zu tun
// ist — `gesperrt` («geht noch nicht») und `leer` («gerade nichts») fallen
// weg, dieselbe Frage wie bei der Empfehlung. Das Empfohlene selbst bleibt
// draußen: Es steht schon darüber, und zweimal dasselbe anzubieten hilft
// niemandem beim Anfangen.
//
// Sortiert: Was drängt (`warm`), zuerst. Gekappt bei drei — die Übersicht soll
// einen Weg zeigen, keine zweite Liste sein. Der Rest liegt einen Tipp weiter.
var HOME_FAELLIG_MAX = 3;
function homeFaellig(ausser) {
  var warm = [];
  var rest = [];
  UEBUNG_GRUPPEN.forEach(function (g) {
    g.ids.forEach(function (id) {
      if (id === ausser || !kachelSichtbar(id)) return;
      var st = uebungsStand(id);
      if (st.gesperrt || st.leer) return;
      (st.warm ? warm : rest).push(id);
    });
  });
  return warm.concat(rest).slice(0, HOME_FAELLIG_MAX);
}

// Alle Übungen in ihrer Lehrplanreihenfolge — die Quelle für alle drei
// Rubriken, damit keine sie in eigener Ordnung führt.
function alleUebungIds() {
  var raus = [];
  UEBUNG_GRUPPEN.forEach(function (g) {
    g.ids.forEach(function (id) { if (uebungVon(id)) raus.push(id); });
  });
  return raus;
}

// **Die obere Rubrik: «Meine Auswahl»** (ADR 0075). Zwei Zustände, und der
// Unterschied ist der ganze Punkt des Fensters:
//
//   `homeOben === null`  automatisch — was gerade fällig ist, höchstens drei
//   ein Array           von Hand eingerichtet — genau das, und zwar immer
//
// Von Hand hingezogen heißt «ich will sie sehen»: Eine angeheftete Kachel
// bleibt auch stehen, wenn sie «alles gelernt» meldet. Sonst verschwände
// etwas, das der Nutzer gerade hingestellt hat, und das sähe aus wie ein
// Fehler. Die Höchstzahl gilt dann auch nicht — er hat ja gewählt.
function homeOben(ausser) {
  var eigen = state.settings.homeOben;
  // Die Automatik wiederholt nicht, was sie eben selbst vorgeschlagen hat.
  if (!eigen) return homeFaellig(ausser);
  // Von Hand ist etwas anderes: Wer eine Übung hierhergezogen hat, will sie
  // hier sehen — auch wenn sie gerade obendrein empfohlen wird. Sie steht dann
  // einmal als Empfehlungskarte und einmal als Kachel, und das ist kein
  // Widerspruch, sondern seine Anordnung.
  return eigen.filter(function (id) {
    return uebungVon(id) && kachelSichtbar(id);
  });
}

// **Weitere Übungen**: alles Übrige. Nicht mehr «alle» — was oben steht,
// wiederholt sich hier nicht, sonst hieße «weitere» nichts.
//
// Im Tutorial stehen sie **alle** darin: Acht seiner Schritte zeigen auf je
// eine Kachel, und ein Wähler, der ins Leere zeigt, ist ein stiller Fehler
// (ADR 0051).
function homeWeitere(oben) {
  return alleUebungIds().filter(function (id) {
    if (tutOffen) return true;
    return kachelSichtbar(id) && oben.indexOf(id) === -1;
  });
}

function render() {
  // Erst nach Hause, dann zeichnen: Steckt die Wissenshülle noch in der alten
  // Kachel, wirft `main.innerHTML` sie mit weg — Knopf, Blatt und Zuhörer
  // wären fort. `renderWissen()` holt sie danach wieder in die neue.
  leisteHeimschicken();
  renderKopf();
  if (currentTab === 'home') renderHome();
  else if (currentTab === 'lernsets' || currentTab === 'freestyle') {
    var modus = currentTab;
    if (modus !== uebModus) { uebModus = modus; uebZuruecksetzen(); }
    renderUeben();
  }
  else if (currentTab === 'uebersetzen') renderUebersetzen();
  else if (currentTab === 'tippen') renderTippen();
  else if (currentTab === 'buchstaben') renderBuchstaben();
  else if (currentTab === 'grammatik') renderGrammatik();
  else if (currentTab === 'schreibung') renderSchreibung();
  else if (currentTab === 'power') renderPower();
  else if (currentTab === 'einstellungen') renderEinstellungen();
  else if (currentTab === 'fakten') renderFakten();
  else if (currentTab === 'merkzettel') renderMerkzettel();
  else if (currentTab === 'tickets') renderTickets();
  else if (currentTab === 'sicherung') renderSicherung();
  else if (currentTab === 'einrichten') renderEinrichten();
  else renderBilanz();
  leisteUmhaengen();
  updateKopf();
}

// ── ÜBEN: LERNSETS UND FREESTYLE ────────────────────────────
// Beide Übungen teilen sich Fragelogik und Zustand; unterschiedlich sind nur
// der Wortvorrat und der Kopf über der Frage.
var uebModus = 'lernsets';   // 'lernsets' · 'freestyle'
var uebAuswahl = 'aktuell';  // 'aktuell' · 'alle' · Nummer eines freien Sets
var uebThema = 'Alle';       // nur im Freestyle
var uebLesen = false;        // nur im Freestyle: nur Wörter aus gemeisterten Buchstaben
var uebQ = null;
var uebPhase = 'ask'; // ask | feedback | fact
var uebBuilt = [];
var uebPicked = null;
var uebCorrect = null;
var uebRevealed = false;
var uebGeschafftesSet = null; // Nummer eines Sets, das gerade fertig wurde

// «Lernsets» arbeiten das laufende Set ab, «Freestyle» ein Thema freier Wahl.
function uebPool() {
  if (uebModus === 'freestyle') {
    var frei = uebThema === 'Alle' ? ALL_VOCAB
      : ALL_VOCAB.filter(function (v) { return v.theme === uebThema; });
    // Der Lesemodus schneidet quer durch die Themen: Er fragt nicht, wovon ein
    // Wort handelt, sondern ob man es überhaupt entziffern kann.
    if (uebLesen) {
      var meister = gemeisterteBuchstaben();
      frei = frei.filter(function (v) { return wortLesbar(v, meister); });
    }
    return frei;
  }
  if (uebAuswahl === 'alle') return freigeschalteteWoerter();
  var nr = uebAuswahl === 'aktuell' ? aktuellesSet() : uebAuswahl;
  if (!setFrei(nr)) nr = aktuellesSet();
  return LERNSETS[nr].woerter;
}

// Auswahl in drei Stufen: erstens fällige Wiederholungen, zweitens noch nie
// gesehene Wörter, drittens — innerhalb einer Sitzung der Regelfall — das am
// längsten Zurückliegende mit der niedrigsten Stufe.
// «nurWiederholen» überspringt die ersten beiden Stufen: Wer ausdrücklich
// wiederholt, will den ganzen Bestand, nicht bloß das noch Unbekannte.
function waehleWort(pool, nurWiederholen) {
  // **Die eine Stelle, an der das Tagesmaß greift** (ADR 0056). Sie liegt hier,
  // weil «Lernsets», «Freestyle» und «Tippen» sich diese Auswahl teilen — in
  // «Tippen» ist der Filter ohnehin wirkungslos, dort ist nichts unbekannt.
  pool = uebVorrat(pool);
  if (!pool.length) return null;
  var jetzt = Date.now();
  var faellige = pool.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); });
  var neue = pool.filter(function (v) { return !state.lastSeen[v.id]; });
  var quelle, nachAlter = false;
  if (nurWiederholen) {
    // Wiederholen heißt: bereits Begonnenes, das am längsten zurückliegt.
    quelle = pool.filter(function (v) { return state.lastSeen[v.id]; });
    nachAlter = true;
    if (!quelle.length) { quelle = pool; nachAlter = false; }
  } else if (faellige.length && (!neue.length || Math.random() < 0.65)) quelle = faellige;
  else if (neue.length) quelle = neue;
  else quelle = pool;

  var sortiert = quelle.slice().sort(function (a, b) {
    var boxA = state.boxes[a.id] || 0, boxB = state.boxes[b.id] || 0;
    var zeitA = state.lastSeen[a.id] || 0, zeitB = state.lastSeen[b.id] || 0;
    if (nachAlter) return zeitA - zeitB || boxA - boxB;
    if (boxA !== boxB) return boxA - boxB;
    return zeitA - zeitB;
  });
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}
// Zwei bis drei Buchstaben, die nicht im Wort stehen — bevorzugt solche, die
// dem Wort ähnlich sehen könnten.
function zusatzBuchstaben(wort) {
  var drin = {};
  wort.split('').forEach(function (c) { drin[c] = true; });
  var alphabet = KB_ROWS.reduce(function (a, reihe) { return a.concat(reihe); }, []);
  var frei = alphabet.filter(function (c) { return !drin[c]; });
  var wieviele = wort.length <= 4 ? 2 : 3;
  return shuffle(frei).slice(0, Math.min(wieviele, frei.length));
}

// ── Die Kontext-Lücke ───────────────────────────────────────
// Ein Wort steht im Satz, nicht daneben. Statt «книга — was heißt das?» steht
// da «Я читаю ___» und die Frage nach der Form. Das ist die didaktisch
// stärkere Aufgabe: Man lernt das Wort und seine Beugung in einem Zug, und man
// sieht, wozu es gut ist.
//
// **Sie greift nur, wo es einen Satz gibt, den man auch lesen kann** — also
// einen freigeschalteten. Ein Satz voller unbekannter Wörter erklärt nichts.

// Die Rollen, aus denen sich Ablenker bauen lassen. Sie müssen nicht sinnvoll
// sein — sie sind ja falsch —, nur plausibel aussehen.
var LUECKE_ROLLEN = {
  n: ['akk', 'praep', 'gen', 'plural'],
  v: ['praes1s', 'praes2s', 'praes3s', 'praes1p', 'praes3p'],
  a: ['adjm', 'adjw', 'adjs', 'adjp']
};

// In welchen freigeschalteten Sätzen kommt das Wort vor, und in welcher Form?
// Die Form steht entweder in `formen` vermerkt oder das Wort taucht in seiner
// Grundform auf — beides zählt.
function lueckeStellen(word) {
  var treffer = [];
  SENTENCES.forEach(function (satz) {
    if (satz.benoetigt.indexOf(word.ru) === -1 || !satzFrei(satz)) return;
    var form = null;
    if (satz.formen) {
      Object.keys(satz.formen).forEach(function (f) {
        if (satz.formen[f][0] === word.ru) form = f;
      });
    }
    // Ohne Vermerk steht das Wort unverändert im Satz — oder gar nicht, dann
    // ist es nur eine Voraussetzung und keine Lücke.
    if (!form && lueckeFindet(satz.ru, word.ru)) form = word.ru;
    if (form && lueckeFindet(satz.ru, form)) {
      treffer.push({ satz: satz, form: lueckeSchreibung(satz, form, word) });
    }
  });
  return treffer;
}

// **Der große Anfangsbuchstabe gehört dem Satz, nicht dem Wort.** Steht die
// gesuchte Form am Satzanfang, ist sie in den Daten großgeschrieben — und
// stünde dann als einzige Kachel groß neben lauter kleinen. Man erkennt sie,
// ohne sie zu kennen. Bei einem Namen bleibt der Buchstabe: Москва ist immer
// groß, egal wo sie steht.
function lueckeSchreibung(satz, form, word) {
  if (satz.ru.indexOf(form) !== 0) return form;
  if (word.ru.charAt(0) !== word.ru.charAt(0).toLowerCase()) return form;
  return form.charAt(0).toLowerCase() + form.slice(1);
}

// Steht dieses Wort als eigenes Wort im Satz? Groß am Satzanfang zählt mit,
// eine Teilzeichenkette mitten in einem anderen Wort nicht.
function lueckeFindet(ru, form) {
  var wörter = ru.split(/[\s.,!?;:]+/);
  for (var i = 0; i < wörter.length; i++) {
    if (wörter[i].toLowerCase() === form.toLowerCase()) return true;
  }
  return false;
}

// Den Satz mit der Lücke — die getroffene Stelle wird zum Strich, alles andere
// bleibt stehen, samt Satzzeichen.
function lueckeText(ru, form) {
  var raus = false;
  return ru.replace(/[^\s.,!?;:]+/g, function (w) {
    if (!raus && w.toLowerCase() === form.toLowerCase()) { raus = true; return '\u2014\u2014'; }
    return w;
  });
}

// Drei Ablenker: andere Formen desselben Wortes. Das ist der eigentliche
// Gewinn — wer zwischen книга, книгу und книге wählt, lernt die Endung, nicht
// die Vokabel.
function lueckeAblenker(word, richtig) {
  var rollen = LUECKE_ROLLEN[istNomen(word.art) ? 'n' : word.art] || [];
  var kandidaten = [];
  var gesehen = {};
  gesehen[richtig.toLowerCase()] = true;
  rollen.forEach(function (rolle) {
    var f = grammForm(word.ru, word.art, rolle);
    if (f && !gesehen[f.toLowerCase()]) { gesehen[f.toLowerCase()] = true; kandidaten.push(f); }
  });
  // Die Grundform selbst ist ein guter Ablenker, wenn sie es nicht schon ist.
  if (!gesehen[word.ru.toLowerCase()]) kandidaten.push(word.ru);
  return shuffle(kandidaten).slice(0, 3);
}

function buildQuestion() {
  var pool = uebPool();
  var word = waehleWort(pool, uebModus === 'lernsets' && uebAuswahl === 'alle');
  if (!word) return null;
  var box = state.boxes[word.id] || 0;
  // Unter drei Buchstaben ist nichts zusammenzusetzen — «я» oder «в» als Kachelaufgabe
  // wäre eine Farce. Über zwölf Buchstaben passt die Reihe nicht mehr aufs Telefon.
  var canTile = word.ru.indexOf(' ') === -1 && word.ru.length >= 3 && word.ru.length <= 12;
  var mode;
  // Im Lesemodus rücken die Kacheln eine Stufe vor: Dort geht es um die
  // Buchstaben, und zusammensetzen ist die Übung, die danach fragt. Auf Stufe 0
  // bleibt es bei der Auswahl — ein nie gesehenes Wort zu legen wäre Raten.
  var kachelAb = uebLesen ? 1 : 2;
  if (box < kachelAb) mode = Math.random() < 0.5 ? 'mc-de' : 'mc-ru';
  else mode = canTile ? 'tiles' : 'mc-ru';

  // Sitzt das Wort und steht es in einem lesbaren Satz, wird daraus eine
  // Lücke — jedes zweite Mal, damit die Kachelaufgabe nicht verschwindet.
  // Im Lesemodus nicht: Dort geht es um Buchstaben, nicht um Formen.
  if (box >= SATZ_STUFE && !uebLesen && Math.random() < 0.5) {
    var stellen = lueckeStellen(word);
    if (stellen.length) {
      var stelle = stellen[Math.floor(Math.random() * stellen.length)];
      var ablenker = lueckeAblenker(word, stelle.form);
      // Unter zwei Ablenkern wäre es keine Wahl, sondern eine Behauptung.
      if (ablenker.length >= 2) {
        return {
          word: word, mode: 'luecke', satz: stelle.satz, form: stelle.form,
          luecke: lueckeText(stelle.satz.ru, stelle.form),
          options: shuffle([stelle.form].concat(ablenker)).map(function (f) {
            return { id: f, ru: f };
          })
        };
      }
    }
  }

  if (mode === 'tiles') {
    // Mehr Kacheln als Buchstaben: erst dadurch zeigt sich, ob die Schreibweise
    // wirklich sitzt, statt dass man die vorhandenen Kacheln durchprobiert.
    var buchstaben = word.ru.split('');
    var tiles = shuffle(buchstaben.concat(zusatzBuchstaben(word.ru)));
    for (var i = 0; i < 10 && tiles.slice(0, buchstaben.length).join('') === word.ru; i++) {
      tiles = shuffle(tiles);
    }
    return {
      word: word, mode: mode, laenge: buchstaben.length,
      tiles: tiles.map(function (ch, k) { return { ch: ch, key: k }; })
    };
  }
  // **Die eigenen Verwechslungen zuerst** (ADR 0056). Wer «сестра» schon einmal
  // für «сестру» gehalten hat, soll die beiden wiedersehen — das ist der
  // Unterschied zwischen einem Kartenstapel und einem Trainer. Höchstens zwei
  // davon: Drei bekannte Ablenker machten aus der Frage eine Wiedervorlage.
  var distractors = verwechseltMit(word.id).slice(0, 2);
  // Der Rest aus allem, womit schon gearbeitet wurde — sonst wiederholen sich
  // innerhalb eines Sets immer dieselben drei. Gleiches Thema zuerst, das fordert mehr.
  var quelle = verwechslungsPool();
  if (quelle.length < 4) quelle = ALL_VOCAB;
  var drin = { };
  drin[word.id] = true;
  distractors.forEach(function (v) { drin[v.id] = true; });
  var frei = quelle.filter(function (v) { return !drin[v.id]; });
  var sameTheme = frei.filter(function (v) { return v.theme === word.theme; });
  var others = frei.filter(function (v) { return v.theme !== word.theme; });
  distractors = distractors.concat(shuffle(sameTheme)).concat(shuffle(others)).slice(0, 3);
  return { word: word, mode: mode, options: shuffle([word].concat(distractors)) };
}
// Setzt die laufende Frage zurück, ohne zu zeichnen.
function uebZuruecksetzen() {
  leseMeldung = null;
  uebGeschafftesSet = null;
  uebQ = null;
  uebPhase = 'ask';

  uebPicked = null;
  uebCorrect = null;
  uebRevealed = false;
}

// Wechselt der Lernstand als Ganzes — beim Wiederherstellen einer Sicherung
// oder beim Zurücksetzen —, müssen *alle* Übungen neu aufbauen. Jede hält
// ihren eigenen Zustand: die laufende Frage, das getippte Wort, den gelegten

function ansichtenZuruecksetzen() {

  swKnopfLage = 'ruhe';

function uebNext(skipFact) {
  // Der Jubel ist jetzt ein Fenster, kein eigener Bildschirm: Die nächste Frage
  // steht schon dahinter, und wer weiterlernen will, tippt einmal.
  if (uebGeschafftesSet !== null) {
    var nr = uebGeschafftesSet;
    uebGeschafftesSet = null;
    var offen = LERNSETS[nr].saetze.filter(satzFrei).length;
    jubelEinmal('set:' + nr, 'set',
      { n: nr + 1, m: offen, s: offen === 1 ? 'Satz' : 'Sätze' },
      [{ text: 'Weiter lernen', tun: null },
       { text: 'Zu «Übersetzen»', tun: function () {
         uebZuruecksetzen();
         trTask = null;
         buildTransTask();
         setTab('uebersetzen');
       } }]);
  }
  if (!skipFact && faktFaellig()) {
    uebPhase = 'fact';
    renderUeben();
    return;
  }
  uebQ = buildQuestion();
  aufgabeBeginnt();
  uebPhase = 'ask';
  uebBuilt = [];
  meisterMeldung = null;
  leseMeldung = null;
  uebPicked = null;
  uebCorrect = null;
  uebRevealed = false;
  renderUeben();
}

// Kopf über der Frage — je nach Übung das Lernset oder die Themenwahl.
function uebKopfHtml() {
  return uebModus === 'lernsets' ? setKopfHtml() : themaKopfHtml();
}

function setKopfHtml() {
  var aktuell = aktuellesSet();
  var nr = uebAuswahl === 'alle' ? aktuell : (uebAuswahl === 'aktuell' ? aktuell : uebAuswahl);
  // Die Auswahl steckt im Filterknopf oben; hier steht nur, was gerade gilt.
  var html = '<p class="task-label">' +
    (uebAuswahl === 'alle' ? 'Alles Freigeschaltete'
      : 'Set ' + (nr + 1) + ' von ' + LERNSETS.length) + '</p>';

  var woerter = uebAuswahl === 'alle' ? freigeschalteteWoerter() : LERNSETS[nr].woerter;
  var reif = woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= SATZ_STUFE; }).length;
  var offen = faelligeAnzahl(woerter);

  html += '<div class="paket"><div class="paket-punkte" aria-hidden="true">';
  woerter.slice(0, 40).forEach(function (v) {
    html += ppHtml(state.boxes[v.id] || 0);
  });
  html += '</div><p class="paket-text">' + reif + ' von ' + woerter.length + ' auf Stufe ' + SATZ_STUFE;
  if (uebAuswahl !== 'alle') {
    var saetze = LERNSETS[nr].saetze.length;
    html += reif === woerter.length
      ? ' · <span class="paket-frei">' + saetze + ' Sätze freigeschaltet</span>'
      : ' · noch ' + (woerter.length - reif) + ' bis zu ' + saetze + ' Sätzen';
  }
  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Der Weg vom Alphabet in den Wortschatz. Er steht über dem Thema, nicht in der
// Auswahl: Wer die Buchstaben gerade gemeistert hat, soll ihn sehen, nicht
// suchen. Solange nichts zu lesen ist, steht er auch nicht da.
function leseSchalterHtml() {
  var lesbar = leseWoerter().length;
  if (!uebLesen && lesbar < LESE_MINDEST) return '';
  return '<button class="lese-schalter' + (uebLesen ? ' an' : '') + '" id="leseSchalter"' +
    ' aria-pressed="' + (uebLesen ? 'true' : 'false') + '">' + ICON.tafel +
    '<span class="ls-text">' + (uebLesen ? 'Nur was ich lesen kann' : 'Aus Buchstaben lesen') +
    '</span><span class="ls-zahl">' + lesbar + '</span></button>';
}

function themaKopfHtml() {
  var html = leseSchalterHtml() +
    '<p class="task-label">' + esc(uebThema === 'Alle' ? 'Alle Themen' : uebThema) + '</p>';

  var woerter = uebPool();
  var begonnen = woerter.filter(function (v) { return (state.boxes[v.id] || 0) > 0; }).length;
  var gemeistert = woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= BOX_MAX; }).length;
  html += '<div class="paket"><p class="paket-text">' + woerter.length + ' Wörter · ' +
    begonnen + ' begonnen · ' + gemeistert + ' gemeistert';
  var offen = faelligeAnzahl(woerter);
  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function uebAbgabeBereit() {
  if (!uebQ) return false;
  if (uebQ.mode === 'tiles') {
    return state.settings.requireComplete
      ? uebBuilt.length === uebQ.laenge
      : uebBuilt.length > 0;
  }
  return uebPicked !== null;
}

// ── Wenn ein Buchstabe nicht trägt ──────────────────────────
// Dieselbe Idee wie beim Verschreiben in «Übersetzen» (ADR 0033), nur milder:
// Wer im Lesemodus ein Wort legt und dabei einen Buchstaben gar nicht
// unterbringt, kennt ihn nicht — nach LESE_STRAFE Malen fällt er eine Stufe.
//
// Gewertet wird nur, was **fehlt**, nicht was falsch steht: Wer alle
// Buchstaben hat und bloß die Reihenfolge verdreht, kennt sie ja. Und nur
// beim Legen — Auswahlfragen sagen über Buchstaben nichts aus.
var leseMeldung = null;

function fehlendeBuchstaben(loesung, versuch) {
  var uebrig = {};
  versuch.toLowerCase().split('').forEach(function (c) {
    uebrig[c] = (uebrig[c] || 0) + 1;
  });
  var fehlt = [];
  loesung.toLowerCase().split('').forEach(function (c) {
    if (leseZeichenEgal(c)) return;
    if (uebrig[c]) { uebrig[c]--; return; }
    if (fehlt.indexOf(c) === -1) fehlt.push(c);
  });
  return fehlt;
}

function leseWerten(wort, versuch, richtig) {
  if (!uebLesen) return;
  var buchstaben = wort.toLowerCase().split('').filter(function (c) {
    return !leseZeichenEgal(c);
  });
  if (richtig) {
    // Eine Serie ist eine Serie: Richtig gelegt löscht sie ganz.
    buchstaben.forEach(function (c) { delete state.leseFehler[c]; });
    return;
  }
  var gefallen = [];
  fehlendeBuchstaben(wort, versuch).forEach(function (c) {
    var n = (state.leseFehler[c] || 0) + 1;
    if (n < LESE_STRAFE) { state.leseFehler[c] = n; return; }
    delete state.leseFehler[c];
    var jetzt = state.abcBox[c] || 0;
    if (jetzt <= 0) return;
    state.abcBox[c] = jetzt - 1;
    state.abcSeen[c] = Date.now();
    gefallen.push(c);
  });
  if (gefallen.length) {
    leseMeldung = {
      zeichen: gefallen,
      // Ein gefallener Buchstabe nimmt Wörter aus dem Lesemodus mit. Das ist
      // keine Nebenwirkung, sondern der Sinn: Er sitzt eben nicht mehr.
      note: gefallen.length === 1
        ? 'Er steht wieder in «Buchstaben» — und die Wörter mit ihm sind hier vorerst weg.'
        : 'Sie stehen wieder in «Buchstaben» — und die Wörter mit ihnen sind hier vorerst weg.'
    };
  }
}

function leseFallHtml() {
  if (!leseMeldung) return '';
  return '<div class="lese-fall"><strong>' +
    (leseMeldung.zeichen.length === 1
      ? 'Dieser Buchstabe braucht noch eine Runde.'
      : 'Diese Buchstaben brauchen noch eine Runde.') + '</strong>' +
    '<span class="lf-zeichen cyr">' +
    esc(leseMeldung.zeichen.join(' · ')) + '</span>' +
    '<span class="lf-note">' + esc(leseMeldung.note) + '</span></div>';
}

// Sind alle Wörter eines Themas auf der Endstufe? Nur für den Jubel gedacht —
// gefragt wird unmittelbar nach der Antwort, die es geschafft haben könnte.
function themaGemeistert(thema) {
  var woerter = VOCAB_THEMES[thema] || [];
  if (!woerter.length) return false;
  for (var i = 0; i < woerter.length; i++) {
    if ((state.boxes[woerter[i][0]] || 0) < BOX_MAX) return false;
  }
  return true;
}

function uebPruefen() {
  var q = uebQ;
  var setVorher = aktuellesSet();
  var attempt = '';
  if (q.mode === 'tiles') {
    attempt = uebBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    uebCorrect = normalize(attempt) === normalize(q.word.ru);
  } else if (q.mode === 'luecke') {
    uebCorrect = uebPicked === q.form;
  } else {
    uebCorrect = uebPicked === q.word.id;
    // Womit verwechselt wurde — nur bei Wortkacheln, denn nur dort steht auf
    // beiden Seiten eine Vokabel. In der Lücke sind die Kacheln Formen.
    if (!uebCorrect && !uebRevealed) verwechseltNotieren(q.word.id, uebPicked);
  }
  leseMeldung = null;
  var loesung = q.mode === 'luecke' ? q.form : q.word.ru;
  kommentarSetzen({
    ok: uebCorrect, aufgedeckt: uebRevealed, loesung: loesung,
    eingabe: attempt, getippt: false,
    daneben: q.mode === 'tiles' ? danebenZeichen(attempt, q.word.ru) : (uebCorrect ? 0 : 99)
  });
  if (q.mode === 'tiles' && !uebRevealed) leseWerten(q.word.ru, attempt, uebCorrect);
  // Die Nachschrift nur nach gelegten Kacheln (ADR 0070): Dort hat der Nutzer
  // eine Schreibweise behauptet. Bei «Was bedeutet …» und in der Lücke hat er
  // unter fertigen Wörtern gewählt — da gibt es nichts nachzuschreiben.
  rekoVerlangen(q.word.ru, q.mode === 'tiles', uebCorrect, false);
  var vorher = state.boxes[q.word.id] || 0;
  updateBox(q.word.id, uebCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, state.boxes[q.word.id], 'Wort', q.word.ru + ' — ' + q.word.de,
    woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
  meisterTon(uebCorrect);
  zuletztGeuebt(uebModus);
  // Hat diese Antwort das laufende Set vollgemacht? Dann wartet der Jubel
  // auf das nächste «Weiter» — mitten in der Auflösung wäre er im Weg. Nur
  // beim ersten Mal: Ein Set, dem ein zurückgefallenes Wort fehlte, wird
  // repariert, nicht noch einmal geschafft.
  if (aktuellesSet() !== setVorher && setGeschafft(setVorher) &&
    !jubelSchon('set:' + setVorher)) uebGeschafftesSet = setVorher;
  // War das der letzte Fehlende eines ganzen Themas? Nur der Übergang zählt.
  if (uebCorrect && vorher < BOX_MAX && state.boxes[q.word.id] >= BOX_MAX &&
    themaGemeistert(q.word.theme)) {
    jubelEinmal('thema:' + q.word.theme, 'thema', { n: q.word.theme });
  }
  uebPhase = 'feedback';
  renderUeben();
}

// Der Lesemodus lässt sich aus zwei Zuständen heraus umlegen — aus der Aufgabe
// und aus dem Leerzustand. Beide hängen dieselben Zuhörer an.
function leseBinden() {
  var schalter = document.getElementById('leseSchalter');
  if (schalter) schalter.addEventListener('click', function () {
    uebLesen = !uebLesen;
    uebZuruecksetzen();
    renderUeben();
  });
  var aus = document.getElementById('leseAus');
  if (aus) aus.addEventListener('click', function () {
    uebLesen = false;
    uebZuruecksetzen();
    renderUeben();
  });
  var zuAbc = document.getElementById('leseZuAbc');
  if (zuAbc) zuAbc.addEventListener('click', function () { setTab('buchstaben'); });
}

function renderUeben() { leisteRahmen(uebInhaltZeichnen); }

function uebInhaltZeichnen() {
  if (uebPhase === 'fact' && faktKarte) {
    main.innerHTML = faktKarteHtml();
    faktKarteBinden(function () { uebNext(true); });
    return;
  }
  if (!uebQ) uebQ = buildQuestion();
  if (!uebQ) {
    // **Leer heißt hier dreierlei.** Neben dem Lesemodus kann jetzt auch das
    // Tagesmaß bremsen — dann ist der Vorrat nicht leer, sondern zugehalten,
    // und das muss dastehen. Ein Ausgang gehört dazu: Wiederholen bleibt immer
    // erlaubt, und die Grenze steht in den Einstellungen.
    if (uebPool().length && tagesmassVoll()) {
      main.innerHTML = '<section>' + uebKopfHtml() +
        '<div class="leer">' + maskottchen('gross') +
        '<h3>Das Tagesmaß ist erreicht</h3>' +
        '<p>' + neuHeute() + ' neue Wörter heute — mehr Neues wäre in drei Wochen eine ' +
        'Lawine. Wiederholen kannst du weiter, so viel du magst.</p>' +
        '<div class="btn-row">' +
        '<button class="btn ghost" id="massEinst">Maß ändern</button>' +
        '<button class="btn primary" id="massWiederholen">Wiederholen</button>' +
        '</div></div></section>';
      var einst = document.getElementById('massEinst');
      if (einst) einst.addEventListener('click', function () {
        einstReiter = 'lernweg';
        setTab('einstellungen');
      });
      var wdh = document.getElementById('massWiederholen');
      if (wdh) wdh.addEventListener('click', function () {
        if (uebModus === 'lernsets') uebAuswahl = 'alle';
        else uebThema = 'Alle';
        uebLesen = false;
        uebZuruecksetzen();
        renderUeben();
        renderKopf();
      });
      return;
    }
    // Im Lesemodus kann der Vorrat weggeschmolzen sein, weil ein Buchstabe
    // zurückgefallen ist — dann muss der Weg hinaus sichtbar sein, sonst steht
    // man vor einer leeren Seite ohne Knopf.
    main.innerHTML = '<section>' + uebKopfHtml() +
      (uebLesen
        ? '<div class="leer">' + maskottchen('gross') +
          '<h3>Dafür reichen die Buchstaben noch nicht</h3>' +
          '<p>Zu diesem Thema lässt sich noch kein Wort vollständig entziffern. ' +
          'Üb ein paar Buchstaben — oder nimm den Modus heraus.</p>' +
          '<div class="btn-row">' +
          '<button class="btn ghost" id="leseAus">Alle Wörter</button>' +
          '<button class="btn primary" id="leseZuAbc">Zu «Buchstaben»</button>' +
          '</div></div>'
        : '') + '</section>';
    leseBinden();
    return;
  }
  var q = uebQ;
  var box = state.boxes[q.word.id] || 0;
  var promptRu = q.mode === 'mc-de';
  // Zwei Fassungen derselben Frage: `prompt` ist der blanke Text — er geht an
  // den Hörknopf, und der soll kein Zeichen zu deuten haben. `promptHtml` trägt
  // die Hülle um den betonten Vokal (ADR 0065).
  var promptWort = (q.mode === 'tiles' || q.mode === 'mc-ru') ? q.word.de : q.word.ru;
  var prompt = promptWort;
  var promptHtml = (q.mode === 'tiles' || q.mode === 'mc-ru')
    ? esc(q.word.de) : ruAnzeigeHtml(q.word.ru);
  var taskLabel = q.mode === 'mc-de' ? 'Was bedeutet …' : q.mode === 'mc-ru' ? 'Welches Wort passt?' : 'Setz das Wort zusammen';
  if (q.mode === 'luecke') {
    promptRu = true;
    prompt = q.luecke;
    promptHtml = esc(q.luecke);
    taskLabel = 'Welche Form fehlt?';
  }

  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) dots += '<span class="' + (i <= box && box > 0 ? 'on' : '') + '"></span>';

  var html = '<section>' + uebKopfHtml();

  html += '<p class="kachel-ort">' + esc(q.word.theme) + '</p>' +
    '<div data-leiste></div>' +
    '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="mitte">' + (q.mode === 'luecke' ? 'im Satz'
      : q.mode === 'tiles' ? 'legen' : 'wählen') + '</span>' +
    '<span></span></div>' +
    '<p class="task-label">' + taskLabel + '</p>' +
    '<p class="word' + (promptRu ? ' cyr' : '') +
      (q.mode === 'luecke' ? ' luecke-satzfrage' : '') + '">' + promptHtml +
    // Bei der Lücke schweigt der Knopf: Vorgelesen würde der Satz **mit** dem
    // fehlenden Wort — die Antwort also. Nach der Auflösung steht er wieder da.
    (q.mode === 'luecke' ? '' : hoerknopf(prompt, promptRu ? 'ru' : 'de')) + '</p>';

  if (q.mode === 'tiles') {
    html += '<div class="slots cyr">';
    for (var s = 0; s < q.laenge; s++) {
      var filled = s < uebBuilt.length;
      var ch = filled ? q.tiles.filter(function (t) { return t.key === uebBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (filled ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (uebPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var used = uebBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (used ? ' used' : '') + '" data-tile="' + t.key + '"' + (used ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="tileUndo" aria-label="Letzten Buchstaben entfernen">' + ICON.ruecktaste + '</button></div>';
    }
  }

  // Die deutsche Fassung steht mit da: Ohne sie wäre die Lücke ein Ratespiel
  // über die Bedeutung statt eine Frage nach der Form.
  if (q.mode === 'luecke') {
    html += '<p class="luecke-de">' + esc(q.satz.de) + '</p>';
  }

  if (q.mode === 'mc-de' || q.mode === 'mc-ru' || q.mode === 'luecke') {
    var richtigeId = q.mode === 'luecke' ? q.form : q.word.id;
    html += '<div class="options">';
    q.options.forEach(function (opt, oi) {
      var cls = '';
      if (uebPhase === 'feedback') {
        if (opt.id === richtigeId) cls = ' right';
        else if (opt.id === uebPicked) cls = ' wrong';
        else cls = ' muted';
      } else if (opt.id === uebPicked) {
        cls = ' picked';
      }
      html += '<button class="option' + (q.mode !== 'mc-de' ? ' cyr' : '') + cls + '" data-opt="' + oi + '"' +
        (uebPhase !== 'ask' ? ' disabled' : '') + '>' +
        (q.mode === 'mc-de' ? esc(opt.de) : ruAnzeigeHtml(opt.ru)) + '</button>';
    });
    html += '</div>';
  }

  if (uebPhase === 'feedback') {
    html += '<div class="feedback ' + (uebCorrect ? 'good' : 'bad') + '">';
    if (uebCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig!</p>';
    else if (q.mode === 'luecke') {
      html += '<p>' + ICON.kreuz + (uebRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
        '<strong class="cyr">' + esc(q.form) + '</strong> — von ' +
        '<span class="cyr">' + esc(q.word.ru) + '</span>, ' + esc(q.word.de) + '</p>';
    } else html += '<p>' + ICON.kreuz + (uebRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="cyr">' + betontesWortHtml(q.word.ru) + '</strong> — ' + esc(q.word.de) +
      ' <span class="translit">[' + esc(q.word.tr) + ']</span></p>';
    // Nach der Auflösung steht der ganze Satz da — das ist der Zweck der
    // Übung: das Wort an seinem Platz zu sehen, nicht die Endung allein.
    if (q.mode === 'luecke') {
      html += '<p class="luecke-satz cyr">' + esc(q.satz.ru) + '</p>';
    }
    html += '</div>' + hoerzeile(q.mode === 'luecke' ? q.satz.ru : q.word.ru,
      q.mode === 'luecke' ? q.satz.de : q.word.de) +
      meisterHtml() + leseFallHtml();
  }

  html += '</div>' + rekoHtml() + '<div class="btn-row">';
  if (uebPhase === 'ask') {
    html += '<button class="btn ghost" id="uebReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="uebConfirm"' + (uebAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="uebNext"' + (rekoFertig() ? '' : ' disabled') +
      '>Weiter \u2192</button>';
  }
  html += '</div>';
  html += '<p class="session-info">' + state.answered + ' beantwortet · Beste Serie: ' + state.bestStreak + '</p></section>';

  main.innerHTML = html;
  leseBinden();

  if (uebPhase === 'ask') {
    document.getElementById('uebReveal').addEventListener('click', function () {
      uebRevealed = true;
      uebCorrect = false;
      updateBox(q.word.id, false);
      uebPhase = 'feedback';
      renderUeben();
    });
    main.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        uebPicked = q.options[parseInt(b.dataset.opt, 10)].id;
        if (state.settings.confirmUeben) renderUeben();
        else uebPruefen();
      });
    });
    main.querySelectorAll('[data-tile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.tile, 10);
        if (uebBuilt.indexOf(key) !== -1 || uebBuilt.length >= q.laenge) return;
        uebBuilt.push(key);
        if (!state.settings.confirmUeben && uebBuilt.length === q.laenge) uebPruefen();
        else renderUeben();
      });
    });
    var confirmBtn = document.getElementById('uebConfirm');
    if (confirmBtn) confirmBtn.addEventListener('click', function () {
      if (uebAbgabeBereit()) uebPruefen();
    });
    var undo = document.getElementById('tileUndo');
    if (undo) undo.addEventListener('click', function () {
      uebBuilt.pop();
      renderUeben();
    });
  } else {
    rekoBinden(renderUeben);
    document.getElementById('uebNext').addEventListener('click', function () {
      if (!rekoFertig()) return;
      uebNext(false);
    });
  }
}

// ── ÜBERSETZEN ──────────────────────────────────────────────
// Ein Satz wird erst angeboten, wenn jede seiner Voraussetzungen (Grundformen
// aus dem Lehrplan) mindestens SATZ_STUFE erreicht hat.
var SATZ_STUFE = 2;
var trLevel = 1, trDir = 'gemischt';   // 'gemischt' · 'ru-de' · 'de-ru'
var trModus = 'lernen';   // 'lernen' · 'wiederholung' · 'alle'
// 'gemischt' ist der Regelfall: die Richtung wechselt dann mit der Stufe.
var trTask = null, trBuilt = [], trPhase = 'ask', trCorrect = null, trRevealed = false;
// Der getippte Satz und die eingeblendete Tastatur. Beides gehört an die
// Ansicht, nicht ins Feld: Zwischen zwei Renderläufen wäre der Wert sonst weg.
var trEingabe = '', trKb = null;

// Ein Satz wird **zweimal getippt**, bevor er sitzt: Kacheln zeigen nur, dass
// man die Wörter wiedererkennt und ihre Reihenfolge kennt. Ab Stufe TR_TIPPEN
// (2) schreibt man ihn selbst — das sind die letzten beiden Runden vor der
// Endstufe, und dieselbe Form kommt in der Auffrischung wieder (ADR 0026).
var TR_TIPPEN = 2;
function trArt(satz) {
  return satzBox(satz) >= TR_TIPPEN ? 'tippen' : 'kacheln';
}

// **Die Richtung wechselt mit der Stufe.** «Gemischt» heißt hier nicht Zufall:
// Ein Satz, den man nur versteht, ist nicht derselbe wie einer, den man
// hinschreiben kann — beides muss dran sein, und beides in fester Ordnung,
// sonst hinge die Stufe vom Losglück ab (ADR 0029).
//
//   Stufe 0  RU → DE  Kacheln    verstehen
//   Stufe 1  DE → RU  Kacheln    bauen
//   Stufe 2  RU → DE  getippt    selbst formulieren
//   Stufe 3  DE → RU  getippt    das Schwerste
//   Stufe 4  DE → RU  getippt    Auffrischung — prüft die stärkste Behauptung
function trRichtungFuer(satz) {
  if (trDir !== 'gemischt') return trDir;
  var box = satzBox(satz);
  if (box >= BOX_MAX) return 'de-ru';
  return box % 2 === 0 ? 'ru-de' : 'de-ru';
}

// Deutsche Artikel zählen beim Vergleich nicht mit: Das Russische hat keine,
// und «Ich lese ein Buch» gegen «Ich lese das Buch» ist kein Übersetzungs-,
// sondern ein Ratefehler. Im Russischen wird dagegen jedes Wort gewertet.
var DE_ARTIKEL = {
  der: 1, die: 1, das: 1, den: 1, dem: 1, des: 1,
  ein: 1, eine: 1, einen: 1, einem: 1, einer: 1, eines: 1
};
function trVergleichbar(text, deutsch) {
  var worte = tokenize(normalize(text));
  if (deutsch) worte = worte.filter(function (w) { return !DE_ARTIKEL[w]; });
  return worte.join(' ');
}

// ── Was genau war falsch? ───────────────────────────────────
// «Falsch» ist eine dürftige Auskunft. Wer einen Buchstaben vertippt hat, hat
// etwas anderes getan als wer das Wort nicht kennt — und beides verdient eine
// andere Antwort (ADR 0033).

// Levenshtein: wie viele Buchstaben trennen zwei Wörter? Zwei Zeilen genügen,
// die Wörter sind kurz.
function editAbstand(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  var vor = [];
  for (var j = 0; j <= b.length; j++) vor[j] = j;
  for (var i = 1; i <= a.length; i++) {
    var jetzt = [i];
    for (var k = 1; k <= b.length; k++) {
      jetzt[k] = Math.min(
        vor[k] + 1,                                              // löschen
        jetzt[k - 1] + 1,                                        // einfügen
        vor[k - 1] + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1) // ersetzen
      );
    }
    vor = jetzt;
  }
  return vor[b.length];
}

// Ordnet jedem Wort der Lösung das Wort zu, das dafür geschrieben wurde. Die
// Sätze sind kurz, darum genügt die gierige Wahl: das nächstliegende freie
// Wort, bei gleichem Abstand das mit der ähnlichsten Position. So zählt ein
// vertauschtes Wortpaar nicht als zwei unbekannte Wörter.
function trWortDiff(eingabe, loesung) {
  var ziel = tokenize(normalize(loesung));
  var hat = tokenize(normalize(eingabe));
  var frei = hat.map(function () { return true; });
  return ziel.map(function (z, i) {
    var beste = -1, bestRang = Infinity;
    hat.forEach(function (h, j) {
      if (!frei[j]) return;
      var rang = editAbstand(z, h) * 100 + Math.abs(i - j);
      if (rang < bestRang) { bestRang = rang; beste = j; }
    });
    if (beste === -1) return { ziel: z, getippt: '', abstand: z.length };
    frei[beste] = false;
    return { ziel: z, getippt: hat[beste], abstand: editAbstand(z, hat[beste]) };
  });
}

// Welche Vokabel steckt hinter dieser Wortform? Erst über die vermerkten
// Formen des Satzes, dann als Grundform. Findet sich keine — «будет» etwa —,
// bleibt die Form ungewertet: Was der Lehrplan nicht führt, kann er auch nicht
// zurückstufen.
function trVokabelZu(satz, form) {
  var formen = (satz && satz.formen) || {};
  var klein = String(form).toLowerCase();
  var grund = null;
  Object.keys(formen).forEach(function (f) {
    if (normalize(f) === klein) grund = formen[f][0];
  });
  if (grund && VOKABEL[grund]) return VOKABEL[grund];
  return VOKABEL[klein] || null;
}

function satzFrei(s) {
  return s.benoetigt.every(function (w) { return (state.boxes[w] || 0) >= SATZ_STUFE; });
}
function satzFehlt(s) {
  return s.benoetigt.filter(function (w) { return (state.boxes[w] || 0) < SATZ_STUFE; });
}
function stufenSaetze(stufe) {
  return SENTENCES.filter(function (s) { return s.stufe === stufe; });
}
// Welche Stufen es überhaupt gibt — aus den Daten, nicht geraten.
function satzStufen() {
  var stufen = [];
  SENTENCES.forEach(function (s) { if (stufen.indexOf(s.stufe) === -1) stufen.push(s.stufe); });
  return stufen.sort(function (a, b) { return a - b; });
}
function freieSaetze(stufe) {
  return stufenSaetze(stufe).filter(satzFrei);
}

// Dieselbe Teilung wie in «Tippen»: was noch nicht sitzt, und was sitzt, aber
// nach der Auffrischfrist einmal zur Sicherheit drankommt. Beim Lernen wird
// nicht nach Fälligkeit gefiltert — wer üben will, soll üben dürfen.
function trLernen(stufe) {
  return freieSaetze(stufe).filter(function (s) { return satzBox(s) < BOX_MAX; });
}
function trWiederholung(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && satzFaellig(s, jetzt);
  });
}
function trRuhend(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && !satzFaellig(s, jetzt);
  });
}
// Home zählt über alle Stufen, die Übung zeigt nur eine. Wer seine Stufe
// fertig hat, stand darum vor «Stufe 1 sitzt», während die Kachel weiter
// «1 offen» meldete. Diese Stufe nennt den Weg dorthin.
function trStufeMitArbeit() {
  var beste = null;
  satzStufen().forEach(function (n) {
    if (n === trLevel || beste) return;
    var offen = trLernen(n).length;
    var faellig = trWiederholung(n).length;
    if (offen || faellig) beste = { stufe: n, offen: offen, faellig: faellig };
  });
  return beste;
}

// Drei Stapel. «Lernen» und «Wiederholung» teilen den Bestand nach ADR 0015;
// «Alle» hebt die Teilung auf. Es musste einen Weg geben, Fertiges vor Ablauf
// der Frist noch einmal anzusehen — «Lernsets» hat ihn längst («alle»),
// «Übersetzen» hatte ihn nicht, und wer alles gemeistert hatte, stand vor
// zwei Stapeln mit null.
function trPool() {
  if (trModus === 'alle') return freieSaetze(trLevel);
  return trModus === 'wiederholung' ? trWiederholung(trLevel) : trLernen(trLevel);
}
function trNaechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  // Abgeschaltet gibt es kein «nächstes Mal» — und «in Infinity Tagen» wäre
  // die Art von Satz, die man einmal auf dem Gerät sieht und nie vergisst.
  if (!isFinite(frist)) return '';
  var beste = null;
  trRuhend(trLevel).forEach(function (s) {
    var wann = (state.satzSeen[s.ru] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Niedrigste Stufe zuerst, bei Gleichstand das am längsten Zurückliegende.
// Aus den vordersten vieren wird gelost, damit sich nicht jede Sitzung gleich
// anfühlt; der gerade gelöste Satz kommt nicht sofort wieder.
function waehleSatz(pool, ausser) {
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = satzBox(a), bb = satzBox(b);
    if (ba !== bb) return ba - bb;
    return (state.satzSeen[a.ru] || 0) - (state.satzSeen[b.ru] || 0);
  });
  if (ausser && sortiert.length > 1) {
    sortiert = sortiert.filter(function (s) { return s !== ausser; });
  }
  var fenster = sortiert.slice(0, Math.min(4, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Ohne Argument wird der nächste Satz gewählt; mit Argument ein bestimmter.
function buildTransTask(vorgabe) {
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln.
  if (!vorgabe && trModus !== 'alle' && !trPool().length) {
    var anderer = trModus === 'lernen' ? 'wiederholung' : 'lernen';
    trModus = anderer;
    if (!trPool().length) trModus = 'lernen';
  }
  var liste = freieSaetze(trLevel);
  var satz = vorgabe || waehleSatz(trPool(), trTask ? trTask.satz : null);
  if (!satz) { trTask = null; return; }
  var ru = satz.ru, de = satz.de;
  // Ab hier zählt die Richtung *dieser* Aufgabe, nicht die eingestellte: Beim
  // Zeichnen darf sich nichts mehr verschieben, auch wenn der Filter wechselt.
  var richtung = trRichtungFuer(satz);
  var nachDe = richtung === 'ru-de';
  var prompt = nachDe ? ru : de;
  var targetTokens = tokenize(nachDe ? de : ru);
  var solution = nachDe ? de : ru;
  var targetNorm = {};
  targetTokens.forEach(function (w) { targetNorm[normalize(w)] = true; });
  // Ablenker kommen aus allen freigeschalteten Sätzen der Stufe, nicht nur aus
  // dem aktuellen Stapel — sonst wird die Auswahl mit der Zeit dünn.
  var otherWords = [];
  liste.forEach(function (p) {
    if (p === satz) return;
    tokenize(nachDe ? p.de : p.ru).forEach(function (w) {
      if (!targetNorm[normalize(w)]) otherWords.push(w);
    });
  });
  var uniq = [];
  var seen = {};
  otherWords.forEach(function (w) { if (!seen[w]) { seen[w] = true; uniq.push(w); } });
  var distractors = shuffle(uniq).slice(0, Math.min(3, uniq.length));
  var tiles = shuffle(targetTokens.concat(distractors)).map(function (word, i) {
    return { word: word, key: i };
  });
  trTask = {
    prompt: prompt, targetTokens: targetTokens, solution: solution, tiles: tiles,
    ru: ru, de: de, satz: satz, art: trArt(satz), dir: richtung,
    // Getippt wird in der Sprache der Lösung — die Tastatur richtet sich danach.
    loesungRu: !nachDe
  };
  trBuilt = [];
  trEingabe = '';
  trPhase = 'ask';
  aufgabeBeginnt();
  trCorrect = null;
  trRevealed = false;
  meisterMeldung = null;
  patzerMeldung = null;
}

function trWort(key) {
  return trTask.tiles.filter(function (x) { return x.key === key; })[0].word;
}

// Ist genug gelegt oder geschrieben, um abgeben zu dürfen?
function trAbgabeBereit() {
  if (!trTask) return false;
  if (trTask.art === 'tippen') return normalize(trEingabe) !== '';
  return state.settings.requireComplete
    ? trBuilt.length === trTask.targetTokens.length
    : trBuilt.length > 0;
}

function trPruefen() {
  var ok;
  if (trTask.art === 'tippen') {
    // Wortweise verglichen, nicht Zeichen für Zeichen: `normalize()` räumt
    // Satzzeichen und Groß-/Kleinschreibung weg, ein doppeltes Leerzeichen
    // soll keinen Fehler bedeuten. Ins Deutsche zählen Artikel nicht mit.
    var deutsch = !trTask.loesungRu;
    ok = trVergleichbar(trEingabe, deutsch) === trVergleichbar(trTask.solution, deutsch);
  } else {
    ok = trBuilt.length === trTask.targetTokens.length && trBuilt.every(function (k, i) {
      return normalize(trWort(k)) === normalize(trTask.targetTokens[i]);
    });
  }
  trFinish(ok);
}

function trFinish(ok) {
  trCorrect = ok;
  trPhase = 'feedback';
  // Nur die russische Seite, und nur wer aufgibt, hat nichts geschrieben. Ein
  // ganzer Satz ist die Ausnahme, nicht die Vorgabe (ADR 0056) — er kommt erst
  // auf ausdrückliche Ansage, und `satz = true` hält ihn dort.
  //
  // **Gelegt zählt hier mit, und aus einem anderen Grund als in ADR 0070**
  // (siehe ADR 0073). Dort war die Frage, ob eine Antwort eine *Schreibweise*
  // behauptet; hier ist sie es nicht: Wer «auch Sätze» einstellt, verlangt,
  // jeden falschen Satz einmal hinzuschreiben — wie die Antwort zustande kam,
  // spielt dabei keine Rolle. Bis 2.4.14 griff die Einstellung darum nur in
  // zwei von fünf Stufen: Stufe 1 legt den russischen Satz aus Wortkacheln,
  // und die waren ausgeschlossen.
  rekoVerlangen(trTask.satz.ru, !!trTask.loesungRu && !trRevealed, ok, true);
  var vorher = satzBox(trTask.satz);
  satzUpdate(trTask.satz, ok);
  meisterMeldung = null;
  meisterPruefen(vorher, satzBox(trTask.satz), 'Satz', trTask.satz.ru,
    saetzeGemeistert() + ' von ' + SENTENCES.length + ' Sätzen');
  kommentarSetzen({
    ok: ok, aufgedeckt: trRevealed, loesung: trTask.satz.ru, eingabe: trEingabe,
    getippt: trTask.art === 'tippen',
    daneben: trTask.art === 'tippen' ? danebenZeichen(trEingabe, trTask.satz.ru) : (ok ? 0 : 99)
  });
  patzerPruefen(ok);
  meisterTon(ok);
  state.transStats.correct += ok ? 1 : 0;
  state.transStats.wrong += ok ? 0 : 1;
  zuletztGeuebt('uebersetzen');
  save();
}

// ── Wer schreibt, der bleibt ────────────────────────────────
// Dreimal hintereinander dasselbe Wort verschrieben heißt: Es sitzt nicht,
// gleich was der Leitner-Stand behauptet. Dann geht es zurück unter die
// Satzschwelle — und der Satz damit wieder zu.
var WORT_STRAFE = 3;
var patzerMeldung = null;

function patzerPruefen(ok) {
  patzerMeldung = null;
  // Gewertet wird nur die russische Seite und nur Geschriebenes: Aus Kacheln
  // lässt sich ein Wort nicht verschreiben, und die deutsche Rechtschreibung
  // ist hier nicht der Lehrstoff.
  if (!trTask || trTask.art !== 'tippen' || !trTask.loesungRu) return;
  // Aufgeben ist kein Verschreiben. Wer «Aufdecken» drückt, hat gar nichts
  // behauptet — dafür ein Wort zurückzustufen wäre eine Strafe für Ehrlichkeit.
  if (trRevealed) return;

  var diff = trWortDiff(trEingabe, trTask.solution);
  var zurueck = [], warnung = [], buchstaben = 0, danebenWorte = 0;

  diff.forEach(function (d) {
    if (d.abstand) { buchstaben += d.abstand; danebenWorte++; }
    var v = trVokabelZu(trTask.satz, d.ziel);
    if (!v) return;
    if (!d.abstand) { delete state.wortFehler[v.id]; return; }
    var n = (state.wortFehler[v.id] || 0) + 1;
    if (n < WORT_STRAFE) {
      state.wortFehler[v.id] = n;
      if (n === WORT_STRAFE - 1) warnung.push(v);
      return;
    }
    delete state.wortFehler[v.id];
    // Wer schon unter der Schwelle steht, kann nicht tiefer fallen — und
    // verdient keine zweite Strafe für dieselbe Lücke.
    if ((state.boxes[v.id] || 0) < SATZ_STUFE) return;
    state.boxes[v.id] = SATZ_STUFE - 1;
    state.lastSeen[v.id] = Date.now();
    state.patzer[v.id] = Date.now();
    zurueck.push(v);
  });

  if (zurueck.length) {
    patzerMeldung = {
      art: 'zurueck', woerter: zurueck,
      text: zurueck.length === 1
        ? 'Dreimal hintereinander verschrieben — das ist kein Vertipper mehr.'
        : 'Dreimal hintereinander verschrieben. Das ist kein Vertipper mehr.',
      note: satzFrei(trTask.satz)
        ? 'Der Satz bleibt offen, in «Lernsets» begegnet er dir wieder.'
        : 'Der Satz ist damit wieder zu, bis ' +
          (zurueck.length === 1 ? 'es sitzt.' : 'sie sitzen.')
    };
    return;
  }
  if (ok || !danebenWorte) return;
  // Wie knapp es war, sagt jetzt die Kommentarzeile darüber (ADR 0049) — hier
  // bleibt nur stehen, was Folgen ankündigt. Ohne eine Warnung gäbe es nichts
  // zu melden, was der Kommentar nicht schon gesagt hätte.
  if (!warnung.length) return;
  patzerMeldung = {
    art: 'knapp', woerter: warnung,
    text: warnung.length === 1 ? 'Vorsicht bei diesem Wort.' : 'Vorsicht bei diesen Wörtern.',
    note: 'Noch einmal daneben, dann geht ' + (warnung.length === 1 ? 'es' : 'das') +
      ' zurück in die Lehre.'
  };
}

function patzerHtml() {
  var p = patzerMeldung;
  if (!p) return '';
  var woerter = p.woerter.map(function (v) {
    return '<span class="cyr">' + esc(v.ru) + '</span>';
  }).join(' · ');
  return '<div class="patzer' + (p.art === 'zurueck' ? ' hart' : '') + '">' +
    '<strong>' + (p.art === 'zurueck'
      ? 'Uff. ' + (p.woerter.length === 1 ? 'Dieses Wort' : 'Diese Wörter') +
        ' musst du noch mal lernen.'
      : esc(p.text)) + '</strong>' +
    (p.art === 'zurueck' ? '<span class="patzer-worte">' + woerter + '</span>' +
      '<span class="patzer-note">' + esc(p.text) + ' ' + esc(p.note) + '</span>'
      : (woerter ? '<span class="patzer-worte">' + woerter + '</span>' : '') +
        (p.note ? '<span class="patzer-note">' + esc(p.note) + '</span>' : '')) +
    // Der Augenblick, in dem ein Wort fällt, ist der beste, um es
    // zurückzuholen — sofern schon genug beisammen ist für eine Runde.
    (p.art === 'zurueck' && ptOffen()
      ? '<button class="btn ghost patzer-los" id="ptLos">Power-Training \u2192</button>' : '') +
    '</div>';
}

function saetzeGemeistert() {
  return SENTENCES.filter(function (s) { return satzBox(s) >= BOX_MAX; }).length;
}

// Drei Gr\u00fcnde f\u00fcr eine leere Ansicht, die sich sehr verschieden anf\u00fchlen:
// noch kein Satz freigeschaltet, alle S\u00e4tze sitzen, oder nichts f\u00e4llig.
function renderUebersetzenLeer() {
  var frei = freieSaetze(trLevel);
  var offen = trLernen(trLevel).length;
  var frisch = trWiederholung(trLevel).length;
  var ruhend = trRuhend(trLevel).length;

  var andere = trStufeMitArbeit();
  var andereKnopf = andere
    ? '<button class="btn primary" id="trZuStufe">Zu Stufe ' + andere.stufe + ' \u00b7 ' +
      (andere.offen ? andere.offen + ' offen' : andere.faellig + ' f\u00e4llig') + '</button>'
    : '';

  var html = '<section><div class="leer">' + maskottchen('gross');

  if (!frei.length) {
    var stufe = stufenSaetze(trLevel);
    var naechster = stufe.slice().sort(function (a, b) {
      return satzFehlt(a).length - satzFehlt(b).length;
    })[0];
    var fehlt = naechster ? satzFehlt(naechster) : [];
    html += '<h3>Noch kein Satz auf Stufe ' + trLevel + '</h3>' +
      '<p>Ein Satz erscheint, sobald alle seine W\u00f6rter in \u00abLernsets\u00bb oder \u00abFreestyle\u00bb ' +
      'mindestens Stufe ' + SATZ_STUFE + ' erreicht haben.</p>';
    if (fehlt.length) {
      html += '<p class="naechste">Dem n\u00e4chsten Satz fehlen noch: ' + fehlt.slice(0, 6).map(function (w) {
        return '<span class="cyr">' + esc(w) + '</span>';
      }).join(' \u00b7 ') + (fehlt.length > 6 ? ' \u2026' : '') + '</p>';
    }
    html += '<div class="btn-row">' + andereKnopf +
      '<button class="btn ' + (andereKnopf ? 'ghost' : 'primary') +
      '" id="trZuUeben">Zu \u00abLernsets\u00bb</button></div>';
  } else if (trModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts f\u00e4llig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Satz sitzt und ruht.' : ' S\u00e4tze sitzen und ruhen.') +
          ruhtWeiter(trNaechsteAuffrischung())
        : 'Hier erscheinen S\u00e4tze, die du ' + BOX_MAX + '\u00d7 richtig \u00fcbersetzt hast \u2014 ' +
          auffrischSatz()) + '</p>';
    if (offen || andereKnopf) {
      html += '<div class="btn-row">' +
        (offen ? '<button class="btn primary" id="trZuLernen">' +
          offen + (offen === 1 ? ' Satz offen' : ' S\u00e4tze offen') + '</button>' : '') +
        andereKnopf + '</div>';
    }
  } else {
    html += '<h3>Stufe ' + trLevel + ' sitzt</h3>' +
      '<p>Alle ' + frei.length + ' freigeschalteten S\u00e4tze dieser Stufe hast du ' + BOX_MAX +
      '\u00d7 richtig \u00fcbersetzt. ' +
      (frisch
        ? frisch + (frisch === 1 ? ' wartet' : ' warten') + ' zum Auffrischen.'
        : auffrischKommt(trNaechsteAuffrischung())) + '</p>' +
      '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="trZuFrisch">Wiederholen</button>' : '') +
      andereKnopf +
      '<button class="btn ghost" id="trZuUeben">Neue W\u00f6rter lernen</button></div>';
  }

  html += '</div></section>';
  main.innerHTML = html;

  var zu = document.getElementById('trZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('trZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    trModus = 'wiederholung';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
  });
  var lernBtn = document.getElementById('trZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    trModus = 'lernen';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
  });
  var stufeBtn = document.getElementById('trZuStufe');
  if (stufeBtn && andere) stufeBtn.addEventListener('click', function () {
    trLevel = andere.stufe;
    trModus = andere.offen ? 'lernen' : 'wiederholung';
    trTask = null;
    buildTransTask();
    renderUebersetzen();
    renderFilter();   // die Stufe steht auch als Chip in der Auswahl
  });
}


// Jedes Wort des russischen Satzes wird ein Knopf: Antippen fragt, warum es so
// dasteht. Der Satz bleibt dabei lesbar — die Knöpfe tragen keine Ränder.
function satzMitWissen(text) {
  return text.split(/(\s+)/).map(function (teil) {
    if (!/\S/.test(teil)) return teil;
    return '<button class="satzwort" data-wissenwort="' + esc(teil) + '">' +
      esc(teil) + '</button>';
  }).join('');
}

// Stufenwahl mit Angabe, wie viele S\u00e4tze je Stufe schon offen sind.
function renderUebersetzen() { leisteRahmen(trInhaltZeichnen); }

function trInhaltZeichnen() {
  if (faktKarte) {
    main.innerHTML = faktKarteHtml();
    faktKarteBinden(function () { buildTransTask(); renderUebersetzen(); });
    chiliAktualisieren();
    return;
  }
  if (!trTask) buildTransTask();
  if (!trTask) { renderUebersetzenLeer(); return; }
  var t = trTask;
  var promptIsRu = t.dir === 'ru-de';
  var liste = freieSaetze(trLevel);

  var html = '<section>';

  var getippt = t.art === 'tippen';
  // Der Ort im Lernweg über die Kachel, Richtung und Spielart hinein: links
  // wohin übersetzt wird, mittig wie. Rechts bleibt der Platz für «Wissen».
  html += '<p class="kachel-ort">Stufe ' + trLevel +
    (trModus === 'wiederholung' ? ' · zur Sicherheit' : '') + '</p>' +
    '<div data-leiste></div>' +
    '<div class="card">' +
    '<div class="card-meta"><span>' + (promptIsRu ? 'RU → DE' : 'DE → RU') + '</span>' +
    '<span class="mitte">' + (getippt ? 'selbst schreiben' : 'legen') + '</span>' +
    '<span></span></div>' +
    '<p class="sentence' + (promptIsRu ? ' cyr' : '') + '">' +
    (promptIsRu ? satzMitWissen(t.prompt) : esc(t.prompt)) +
    hoerknopf(t.prompt, promptIsRu ? 'ru' : 'de') + '</p>';

  if (getippt) {
    // Nach der Abgabe tritt an die Stelle des Feldes der eingefärbte Satz. Ein
    // `textarea` kann seinen Text nicht stellenweise färben — es muss also
    // weichen, statt bloß gesperrt zu werden.
    if (trPhase === 'feedback') {
      html += pruefzeileHtml(trEingabe, t.solution, !!t.loesungRu, 'satz');
    } else {
      html += '<textarea id="trInput" rows="2" class="fliess' + (t.loesungRu ? ' cyr' : '') +
        '" lang="' + (t.loesungRu ? 'ru' : 'de') + '" autocapitalize="sentences"' +
        ' autocorrect="off" spellcheck="false" enterkeyhint="go"' + kbFeldAttr(trKb) +
        ' placeholder="' + (t.loesungRu ? 'Den Satz auf Russisch schreiben …'
          : 'Den Satz auf Deutsch schreiben …') + '">' + esc(trEingabe) + '</textarea>';
      if (!t.loesungRu) {
        html += '<p class="hint">Artikel zählen nicht mit — das Russische hat keine.</p>';
      }
    }
  } else {
    html += '<div class="built' + (promptIsRu ? '' : ' cyr') + '">';
    if (trBuilt.length === 0 && trPhase === 'ask') {
      html += '<span class="built-placeholder">Wörter in der richtigen Reihenfolge antippen</span>';
    } else {
      trBuilt.forEach(function (k, i) {
        var w = esc(trWort(k));
        // In der Frage-Phase ist jedes gelegte Wort einzeln antippbar zum Entfernen.
        html += trPhase === 'ask'
          ? '<button class="built-word" data-built="' + i + '" aria-label="«' + w + '» entfernen">' + w + '</button>'
          : '<span class="built-word">' + w + '</span>';
      });
    }
    html += '</div>';
  }

  if (trPhase === 'ask' && !getippt) {
    if (trBuilt.length > 0) html += '<p class="hint">Zum Entfernen ein gelegtes Wort antippen.</p>';
    html += '<div class="tiles">';
    t.tiles.forEach(function (tile) {
      var used = trBuilt.indexOf(tile.key) !== -1;
      html += '<button class="wordtile' + (promptIsRu ? '' : ' cyr') + (used ? ' used' : '') +
        '" data-wtile="' + tile.key + '"' + (used ? ' disabled' : '') + '>' + esc(tile.word) + '</button>';
    });
    html += '<button class="wordtile fn" id="trUndo" aria-label="Letztes Wort entfernen">' + ICON.ruecktaste + '</button></div>';
  }

  if (trPhase === 'feedback') {
    html += '<div class="feedback ' + (trCorrect ? 'good' : 'bad') + '">';
    if (trCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig übersetzt!</p>';
    else html += '<p>' + ICON.kreuz + (trRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="' + (promptIsRu ? '' : 'cyr') + '">' + esc(t.solution) + '</strong></p>';
    html += '</div>' + hoerzeile(t.ru, t.de) + patzerHtml() + meisterHtml();
  }

  html += '</div>' + rekoHtml() + '<div class="btn-row">';
  if (trPhase === 'ask') {
    html += '<button class="btn ghost" id="trReveal">Aufdecken</button>';
    // Beim Schreiben braucht es die Abgabe immer \u2014 anders als bei den Kacheln
    // gibt es keinen Augenblick, an dem die Antwort erkennbar fertig ist.
    if (getippt || state.settings.confirmUebersetzen) {
      html += '<button class="btn primary" id="trConfirm"' + (trAbgabeBereit() ? '' : ' disabled') +
        '>' + (getippt ? 'Pr\u00fcfen' : 'Best\u00e4tigen') + '</button>';
    }
  } else {
    html += '<button class="btn primary" id="trNext"' + (rekoFertig() ? '' : ' disabled') +
