function uebNext(skipFact) {
  // Der Jubel ist jetzt ein Fenster, kein eigener Bildschirm: Die nächste Frage
  // steht schon dahinter, und wer weiterlernen will, tippt einmal.
  if (uebGeschafftesSet !== null) {
    var nr = uebGeschafftesSet;
    uebGeschafftesSet = null;
    var offen = LERNSETS[nr].saetze.filter(satzFrei).length;
    jubelZeigen('set',
      { n: nr + 1, m: offen, s: offen === 1 ? 'Satz' : 'Sätze' },
      [{ text: 'Weiter lernen', tun: null },
       { text: 'Zu «Übersetzen»', tun: function () {
         uebZuruecksetzen();
         trTask = null;
         buildTransTask();
         setTab('uebersetzen');
       } }]);
  }
  if (!skipFact && state.answered > 0 && state.answered % 5 === 0) {
    uebFactText = naechsterFakt();
    faktGezeigt(uebFactText);
    state.factIdx++;
    save();
    uebPhase = 'fact';
    renderUeben();
    return;
  }
  uebQ = buildQuestion();
  uebPhase = 'ask';
  uebBuilt = [];
  meisterMeldung = null;
  leseMeldung = null;
  uebPicked = null;
  uebCorrect = null;
  uebRevealed = false;
  renderUeben();
}

// Kopf über der Frage — je nach Übung das Lernset oder die Themenwahl.
function uebKopfHtml() {
  return uebModus === 'lernsets' ? setKopfHtml() : themaKopfHtml();
}

function setKopfHtml() {
  var aktuell = aktuellesSet();
  var nr = uebAuswahl === 'alle' ? aktuell : (uebAuswahl === 'aktuell' ? aktuell : uebAuswahl);
  // Die Auswahl steckt im Filterknopf oben; hier steht nur, was gerade gilt.
  var html = '<p class="task-label">' +
    (uebAuswahl === 'alle' ? 'Alles Freigeschaltete'
      : 'Set ' + (nr + 1) + ' von ' + LERNSETS.length) + '</p>';

  var woerter = uebAuswahl === 'alle' ? freigeschalteteWoerter() : LERNSETS[nr].woerter;
  var reif = woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= SATZ_STUFE; }).length;
  var offen = faelligeAnzahl(woerter);

  html += '<div class="paket"><div class="paket-punkte" aria-hidden="true">';
  woerter.slice(0, 40).forEach(function (v) {
    html += '<span class="pp s' + (state.boxes[v.id] || 0) + '"></span>';
  });
  html += '</div><p class="paket-text">' + reif + ' von ' + woerter.length + ' auf Stufe ' + SATZ_STUFE;
  if (uebAuswahl !== 'alle') {
    var saetze = LERNSETS[nr].saetze.length;
    html += reif === woerter.length
      ? ' · <span class="paket-frei">' + saetze + ' Sätze freigeschaltet</span>'
      : ' · noch ' + (woerter.length - reif) + ' bis zu ' + saetze + ' Sätzen';
  }
  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Der Weg vom Alphabet in den Wortschatz. Er steht über dem Thema, nicht in der
// Auswahl: Wer die Buchstaben gerade gemeistert hat, soll ihn sehen, nicht
// suchen. Solange nichts zu lesen ist, steht er auch nicht da.
function leseSchalterHtml() {
  var lesbar = leseWoerter().length;
  if (!uebLesen && lesbar < LESE_MINDEST) return '';
  return '<button class="lese-schalter' + (uebLesen ? ' an' : '') + '" id="leseSchalter"' +
    ' aria-pressed="' + (uebLesen ? 'true' : 'false') + '">' + ICON.tafel +
    '<span class="ls-text">' + (uebLesen ? 'Nur was ich lesen kann' : 'Aus Buchstaben lesen') +
    '</span><span class="ls-zahl">' + lesbar + '</span></button>';
}

function themaKopfHtml() {
  var html = leseSchalterHtml() +
    '<p class="task-label">' + esc(uebThema === 'Alle' ? 'Alle Themen' : uebThema) + '</p>';

  var woerter = uebPool();
  var begonnen = woerter.filter(function (v) { return (state.boxes[v.id] || 0) > 0; }).length;
  var gemeistert = woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= BOX_MAX; }).length;
  html += '<div class="paket"><p class="paket-text">' + woerter.length + ' Wörter · ' +
    begonnen + ' begonnen · ' + gemeistert + ' gemeistert';
  var offen = faelligeAnzahl(woerter);
  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function uebAbgabeBereit() {
  if (!uebQ) return false;
  if (uebQ.mode === 'tiles') {
    return state.settings.requireComplete
      ? uebBuilt.length === uebQ.laenge
      : uebBuilt.length > 0;
  }
  return uebPicked !== null;
}

// ── Wenn ein Buchstabe nicht trägt ──────────────────────────
// Dieselbe Idee wie beim Verschreiben in «Übersetzen» (ADR 0033), nur milder:
// Wer im Lesemodus ein Wort legt und dabei einen Buchstaben gar nicht
// unterbringt, kennt ihn nicht — nach LESE_STRAFE Malen fällt er eine Stufe.
//
// Gewertet wird nur, was **fehlt**, nicht was falsch steht: Wer alle
// Buchstaben hat und bloß die Reihenfolge verdreht, kennt sie ja. Und nur
// beim Legen — Auswahlfragen sagen über Buchstaben nichts aus.
var leseMeldung = null;

function fehlendeBuchstaben(loesung, versuch) {
  var uebrig = {};
  versuch.toLowerCase().split('').forEach(function (c) {
    uebrig[c] = (uebrig[c] || 0) + 1;
  });
  var fehlt = [];
  loesung.toLowerCase().split('').forEach(function (c) {
    if (leseZeichenEgal(c)) return;
    if (uebrig[c]) { uebrig[c]--; return; }
    if (fehlt.indexOf(c) === -1) fehlt.push(c);
  });
  return fehlt;
}

function leseWerten(wort, versuch, richtig) {
  if (!uebLesen) return;
  var buchstaben = wort.toLowerCase().split('').filter(function (c) {
    return !leseZeichenEgal(c);
  });
  if (richtig) {
    // Eine Serie ist eine Serie: Richtig gelegt löscht sie ganz.
    buchstaben.forEach(function (c) { delete state.leseFehler[c]; });
    return;
  }
  var gefallen = [];
  fehlendeBuchstaben(wort, versuch).forEach(function (c) {
    var n = (state.leseFehler[c] || 0) + 1;
    if (n < LESE_STRAFE) { state.leseFehler[c] = n; return; }
    delete state.leseFehler[c];
    var jetzt = state.abcBox[c] || 0;
    if (jetzt <= 0) return;
    state.abcBox[c] = jetzt - 1;
    state.abcSeen[c] = Date.now();
    gefallen.push(c);
  });
  if (gefallen.length) {
    leseMeldung = {
      zeichen: gefallen,
      // Ein gefallener Buchstabe nimmt Wörter aus dem Lesemodus mit. Das ist
      // keine Nebenwirkung, sondern der Sinn: Er sitzt eben nicht mehr.
      note: gefallen.length === 1
        ? 'Er steht wieder in «Buchstaben» — und die Wörter mit ihm sind hier vorerst weg.'
        : 'Sie stehen wieder in «Buchstaben» — und die Wörter mit ihnen sind hier vorerst weg.'
    };
  }
}

function leseFallHtml() {
  if (!leseMeldung) return '';
  return '<div class="lese-fall"><strong>' +
    (leseMeldung.zeichen.length === 1
      ? 'Dieser Buchstabe braucht noch eine Runde.'
      : 'Diese Buchstaben brauchen noch eine Runde.') + '</strong>' +
    '<span class="lf-zeichen cyr">' +
    esc(leseMeldung.zeichen.join(' · ')) + '</span>' +
    '<span class="lf-note">' + esc(leseMeldung.note) + '</span></div>';
}

// Sind alle Wörter eines Themas auf der Endstufe? Nur für den Jubel gedacht —
// gefragt wird unmittelbar nach der Antwort, die es geschafft haben könnte.
function themaGemeistert(thema) {
  var woerter = VOCAB_THEMES[thema] || [];
  if (!woerter.length) return false;
  for (var i = 0; i < woerter.length; i++) {
    if ((state.boxes[woerter[i][0]] || 0) < BOX_MAX) return false;
  }
  return true;
}

function uebPruefen() {
  var q = uebQ;
  var setVorher = aktuellesSet();
  var attempt = '';
  if (q.mode === 'tiles') {
    attempt = uebBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    uebCorrect = normalize(attempt) === normalize(q.word.ru);
  } else {
    uebCorrect = uebPicked === q.word.id;
  }
  leseMeldung = null;
  if (q.mode === 'tiles' && !uebRevealed) leseWerten(q.word.ru, attempt, uebCorrect);
  var vorher = state.boxes[q.word.id] || 0;
  updateBox(q.word.id, uebCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, state.boxes[q.word.id], 'Wort', q.word.ru + ' — ' + q.word.de,
    woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
  meisterTon(uebCorrect);
  zuletztGeuebt(uebModus);
  // Hat diese Antwort das laufende Set vollgemacht? Dann wartet der Jubel
  // auf das nächste «Weiter» — mitten in der Auflösung wäre er im Weg.
  if (aktuellesSet() !== setVorher && setGeschafft(setVorher)) uebGeschafftesSet = setVorher;
  // War das der letzte Fehlende eines ganzen Themas? Nur der Übergang zählt.
  if (uebCorrect && vorher < BOX_MAX && state.boxes[q.word.id] >= BOX_MAX &&
    themaGemeistert(q.word.theme)) {
    jubelZeigen('thema', { n: q.word.theme });
  }
  uebPhase = 'feedback';
  renderUeben();
}

// Der Lesemodus lässt sich aus zwei Zuständen heraus umlegen — aus der Aufgabe
// und aus dem Leerzustand. Beide hängen dieselben Zuhörer an.
function leseBinden() {
  var schalter = document.getElementById('leseSchalter');
  if (schalter) schalter.addEventListener('click', function () {
    uebLesen = !uebLesen;
    uebZuruecksetzen();
    renderUeben();
  });
  var aus = document.getElementById('leseAus');
  if (aus) aus.addEventListener('click', function () {
    uebLesen = false;
    uebZuruecksetzen();
    renderUeben();
  });
  var zuAbc = document.getElementById('leseZuAbc');
  if (zuAbc) zuAbc.addEventListener('click', function () { setTab('buchstaben'); });
}

function renderUeben() {
  if (uebPhase === 'fact') {
    main.innerHTML =
      '<section>' +
      '<div class="sprechblase">' +
      '<span class="fact-label">Wussten Sie?</span>' +
      '<p class="fact-text">' + esc(uebFactText) + '</p></div>' +
      '<div class="fakt-fuss">' + maskottchen('klein') +
      '<button class="sternbtn' + (faktStand(uebFactText).f ? ' an' : '') + '" id="factFav" ' +
      'aria-pressed="' + (faktStand(uebFactText).f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
      (faktStand(uebFactText).f ? ICON.sternVoll : ICON.stern) + '</button></div>' +
      '<div class="btn-row"><button class="btn ghost" id="factAlle">Alle Fakten</button>' +
      '<button class="btn primary" id="factNext">Weiter üben</button></div>' +
      '</section>';
    document.getElementById('factNext').addEventListener('click', function () { uebNext(true); });
    document.getElementById('factAlle').addEventListener('click', function () { setTab('fakten'); });
    document.getElementById('factFav').addEventListener('click', function () {
      faktFavorit(uebFactText);
      renderUeben();
    });
    return;
  }
  if (!uebQ) uebQ = buildQuestion();
  if (!uebQ) {
    // Leer heißt hier zweierlei. Im Lesemodus kann der Vorrat weggeschmolzen
    // sein, weil ein Buchstabe zurückgefallen ist — dann muss der Weg hinaus
    // sichtbar sein, sonst steht man vor einer leeren Seite ohne Knopf.
    main.innerHTML = '<section>' + uebKopfHtml() +
      (uebLesen
        ? '<div class="leer">' + maskottchen('gross') +
          '<h3>Dafür reichen die Buchstaben noch nicht</h3>' +
          '<p>Zu diesem Thema lässt sich noch kein Wort vollständig entziffern. ' +
          'Üben Sie ein paar Buchstaben — oder nehmen Sie den Modus heraus.</p>' +
          '<div class="btn-row">' +
          '<button class="btn ghost" id="leseAus">Alle Wörter</button>' +
          '<button class="btn primary" id="leseZuAbc">Zu «Buchstaben»</button>' +
          '</div></div>'
        : '') + '</section>';
    leseBinden();
    return;
  }
  var q = uebQ;
  var box = state.boxes[q.word.id] || 0;
  var promptRu = q.mode === 'mc-de';
  var prompt = (q.mode === 'tiles' || q.mode === 'mc-ru') ? q.word.de : q.word.ru;
  var taskLabel = q.mode === 'mc-de' ? 'Was bedeutet …' : q.mode === 'mc-ru' ? 'Welches Wort passt?' : 'Setzen Sie das Wort zusammen';

  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) dots += '<span class="' + (i <= box && box > 0 ? 'on' : '') + '"></span>';

  var html = '<section>' + uebKopfHtml();

  html += '<p class="kachel-ort">' + esc(q.word.theme) + '</p>' +
    '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="mitte">' + (q.modus === 'tippen' ? 'selbst schreiben'
      : q.modus === 'kacheln' ? 'legen' : 'wählen') + '</span>' +
    '<span></span></div>' +
    '<p class="task-label">' + taskLabel + '</p>' +
    '<p class="word' + (promptRu ? ' cyr' : '') + '">' + esc(prompt) +
    hoerknopf(prompt, promptRu ? 'ru' : 'de') + '</p>';

  if (q.mode === 'tiles') {
    html += '<div class="slots cyr">';
    for (var s = 0; s < q.laenge; s++) {
      var filled = s < uebBuilt.length;
      var ch = filled ? q.tiles.filter(function (t) { return t.key === uebBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (filled ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (uebPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var used = uebBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (used ? ' used' : '') + '" data-tile="' + t.key + '"' + (used ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="tileUndo" aria-label="Letzten Buchstaben entfernen">' + ICON.ruecktaste + '</button></div>';
    }
  }

  if (q.mode === 'mc-de' || q.mode === 'mc-ru') {
    html += '<div class="options">';
    q.options.forEach(function (opt, oi) {
      var cls = '';
      if (uebPhase === 'feedback') {
        if (opt.id === q.word.id) cls = ' right';
        else if (opt.id === uebPicked) cls = ' wrong';
        else cls = ' muted';
      } else if (opt.id === uebPicked) {
        cls = ' picked';
      }
      html += '<button class="option' + (q.mode === 'mc-ru' ? ' cyr' : '') + cls + '" data-opt="' + oi + '"' +
        (uebPhase !== 'ask' ? ' disabled' : '') + '>' +
        esc(q.mode === 'mc-de' ? opt.de : opt.ru) + '</button>';
    });
    html += '</div>';
  }

  if (uebPhase === 'feedback') {
    html += '<div class="feedback ' + (uebCorrect ? 'good' : 'bad') + '">';
    if (uebCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig!</p>';
    else html += '<p>' + ICON.kreuz + (uebRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="cyr">' + esc(q.word.ru) + '</strong> — ' + esc(q.word.de) +
      ' <span class="translit">[' + esc(q.word.tr) + ']</span></p>';
    html += '</div>' + hoerzeile(q.word.ru, q.word.de) + meisterHtml() + leseFallHtml();
  }

  html += '</div><div class="btn-row">';
  if (uebPhase === 'ask') {
    html += '<button class="btn ghost" id="uebReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="uebConfirm"' + (uebAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="uebNext">Weiter \u2192</button>';
  }
  html += '</div>';
  html += '<p class="session-info">' + state.answered + ' beantwortet · Beste Serie: ' + state.bestStreak + '</p></section>';

  main.innerHTML = html;
  leseBinden();

  if (uebPhase === 'ask') {
    document.getElementById('uebReveal').addEventListener('click', function () {
      uebRevealed = true;
      uebCorrect = false;
      updateBox(q.word.id, false);
      uebPhase = 'feedback';
      renderUeben();
    });
    main.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        uebPicked = q.options[parseInt(b.dataset.opt, 10)].id;
        if (state.settings.confirmUeben) renderUeben();
        else uebPruefen();
      });
    });
    main.querySelectorAll('[data-tile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.tile, 10);
        if (uebBuilt.indexOf(key) !== -1 || uebBuilt.length >= q.laenge) return;
        uebBuilt.push(key);
        if (!state.settings.confirmUeben && uebBuilt.length === q.laenge) uebPruefen();
        else renderUeben();
      });
    });
    var confirmBtn = document.getElementById('uebConfirm');
    if (confirmBtn) confirmBtn.addEventListener('click', function () {
      if (uebAbgabeBereit()) uebPruefen();
    });
    var undo = document.getElementById('tileUndo');
    if (undo) undo.addEventListener('click', function () {
      uebBuilt.pop();
      renderUeben();
    });
  } else {
    document.getElementById('uebNext').addEventListener('click', function () { uebNext(false); });
  }
}

// ── ÜBERSETZEN ──────────────────────────────────────────────
// Ein Satz wird erst angeboten, wenn jede seiner Voraussetzungen (Grundformen
// aus dem Lehrplan) mindestens SATZ_STUFE erreicht hat.
var SATZ_STUFE = 2;
var trLevel = 1, trDir = 'gemischt';   // 'gemischt' · 'ru-de' · 'de-ru'
var trModus = 'lernen';   // 'lernen' · 'wiederholung' · 'alle'
// 'gemischt' ist der Regelfall: die Richtung wechselt dann mit der Stufe.
var trTask = null, trBuilt = [], trPhase = 'ask', trCorrect = null, trRevealed = false;
// Der getippte Satz und die eingeblendete Tastatur. Beides gehört an die
// Ansicht, nicht ins Feld: Zwischen zwei Renderläufen wäre der Wert sonst weg.
var trEingabe = '', trKb = null;

// Ein Satz wird **zweimal getippt**, bevor er sitzt: Kacheln zeigen nur, dass
// man die Wörter wiedererkennt und ihre Reihenfolge kennt. Ab Stufe TR_TIPPEN
// (2) schreibt man ihn selbst — das sind die letzten beiden Runden vor der
// Endstufe, und dieselbe Form kommt in der Auffrischung wieder (ADR 0026).
var TR_TIPPEN = 2;
function trArt(satz) {
  return satzBox(satz) >= TR_TIPPEN ? 'tippen' : 'kacheln';
}

// **Die Richtung wechselt mit der Stufe.** «Gemischt» heißt hier nicht Zufall:
// Ein Satz, den man nur versteht, ist nicht derselbe wie einer, den man
// hinschreiben kann — beides muss dran sein, und beides in fester Ordnung,
// sonst hinge die Stufe vom Losglück ab (ADR 0029).
//
//   Stufe 0  RU → DE  Kacheln    verstehen
//   Stufe 1  DE → RU  Kacheln    bauen
//   Stufe 2  RU → DE  getippt    selbst formulieren
//   Stufe 3  DE → RU  getippt    das Schwerste
//   Stufe 4  DE → RU  getippt    Auffrischung — prüft die stärkste Behauptung
function trRichtungFuer(satz) {
  if (trDir !== 'gemischt') return trDir;
  var box = satzBox(satz);
  if (box >= BOX_MAX) return 'de-ru';
  return box % 2 === 0 ? 'ru-de' : 'de-ru';
}

// Deutsche Artikel zählen beim Vergleich nicht mit: Das Russische hat keine,
// und «Ich lese ein Buch» gegen «Ich lese das Buch» ist kein Übersetzungs-,
// sondern ein Ratefehler. Im Russischen wird dagegen jedes Wort gewertet.
var DE_ARTIKEL = {
  der: 1, die: 1, das: 1, den: 1, dem: 1, des: 1,
  ein: 1, eine: 1, einen: 1, einem: 1, einer: 1, eines: 1
};
function trVergleichbar(text, deutsch) {
  var worte = tokenize(normalize(text));
  if (deutsch) worte = worte.filter(function (w) { return !DE_ARTIKEL[w]; });
  return worte.join(' ');
}

// ── Was genau war falsch? ───────────────────────────────────
// «Falsch» ist eine dürftige Auskunft. Wer einen Buchstaben vertippt hat, hat
// etwas anderes getan als wer das Wort nicht kennt — und beides verdient eine
// andere Antwort (ADR 0033).

// Levenshtein: wie viele Buchstaben trennen zwei Wörter? Zwei Zeilen genügen,
// die Wörter sind kurz.
function editAbstand(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  var vor = [];
  for (var j = 0; j <= b.length; j++) vor[j] = j;
  for (var i = 1; i <= a.length; i++) {
    var jetzt = [i];
    for (var k = 1; k <= b.length; k++) {
      jetzt[k] = Math.min(
        vor[k] + 1,                                              // löschen
        jetzt[k - 1] + 1,                                        // einfügen
        vor[k - 1] + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1) // ersetzen
      );
    }
    vor = jetzt;
  }
  return vor[b.length];
}

// Ordnet jedem Wort der Lösung das Wort zu, das dafür geschrieben wurde. Die
// Sätze sind kurz, darum genügt die gierige Wahl: das nächstliegende freie
// Wort, bei gleichem Abstand das mit der ähnlichsten Position. So zählt ein
// vertauschtes Wortpaar nicht als zwei unbekannte Wörter.
function trWortDiff(eingabe, loesung) {
  var ziel = tokenize(normalize(loesung));
  var hat = tokenize(normalize(eingabe));
  var frei = hat.map(function () { return true; });
  return ziel.map(function (z, i) {
    var beste = -1, bestRang = Infinity;
    hat.forEach(function (h, j) {
      if (!frei[j]) return;
      var rang = editAbstand(z, h) * 100 + Math.abs(i - j);
      if (rang < bestRang) { bestRang = rang; beste = j; }
    });
    if (beste === -1) return { ziel: z, getippt: '', abstand: z.length };
    frei[beste] = false;
    return { ziel: z, getippt: hat[beste], abstand: editAbstand(z, hat[beste]) };
  });
}

// Welche Vokabel steckt hinter dieser Wortform? Erst über die vermerkten
// Formen des Satzes, dann als Grundform. Findet sich keine — «будет» etwa —,
// bleibt die Form ungewertet: Was der Lehrplan nicht führt, kann er auch nicht
// zurückstufen.
function trVokabelZu(satz, form) {
  var formen = (satz && satz.formen) || {};
  var klein = String(form).toLowerCase();
  var grund = null;
  Object.keys(formen).forEach(function (f) {
    if (normalize(f) === klein) grund = formen[f][0];
  });
  if (grund && VOKABEL[grund]) return VOKABEL[grund];
  return VOKABEL[klein] || null;
}

function satzFrei(s) {
  return s.benoetigt.every(function (w) { return (state.boxes[w] || 0) >= SATZ_STUFE; });
}
function satzFehlt(s) {
  return s.benoetigt.filter(function (w) { return (state.boxes[w] || 0) < SATZ_STUFE; });
}
function stufenSaetze(stufe) {
  return SENTENCES.filter(function (s) { return s.stufe === stufe; });
}
// Welche Stufen es überhaupt gibt — aus den Daten, nicht geraten.
function satzStufen() {
  var stufen = [];
  SENTENCES.forEach(function (s) { if (stufen.indexOf(s.stufe) === -1) stufen.push(s.stufe); });
  return stufen.sort(function (a, b) { return a - b; });
}
function freieSaetze(stufe) {
  return stufenSaetze(stufe).filter(satzFrei);
}

// Dieselbe Teilung wie in «Tippen»: was noch nicht sitzt, und was sitzt, aber
// nach der Auffrischfrist einmal zur Sicherheit drankommt. Beim Lernen wird
// nicht nach Fälligkeit gefiltert — wer üben will, soll üben dürfen.
function trLernen(stufe) {
  return freieSaetze(stufe).filter(function (s) { return satzBox(s) < BOX_MAX; });
}
function trWiederholung(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && satzFaellig(s, jetzt);
  });
}
function trRuhend(stufe) {
  var jetzt = Date.now();
  return freieSaetze(stufe).filter(function (s) {
    return satzBox(s) >= BOX_MAX && !satzFaellig(s, jetzt);
  });
}
// Home zählt über alle Stufen, die Übung zeigt nur eine. Wer seine Stufe
// fertig hat, stand darum vor «Stufe 1 sitzt», während die Kachel weiter
// «1 offen» meldete. Diese Stufe nennt den Weg dorthin.
function trStufeMitArbeit() {
  var beste = null;
  satzStufen().forEach(function (n) {
    if (n === trLevel || beste) return;
    var offen = trLernen(n).length;
    var faellig = trWiederholung(n).length;
    if (offen || faellig) beste = { stufe: n, offen: offen, faellig: faellig };
  });
  return beste;
}

// Drei Stapel. «Lernen» und «Wiederholung» teilen den Bestand nach ADR 0015;
// «Alle» hebt die Teilung auf. Es musste einen Weg geben, Fertiges vor Ablauf
// der Frist noch einmal anzusehen — «Lernsets» hat ihn längst («alle»),
// «Übersetzen» hatte ihn nicht, und wer alles gemeistert hatte, stand vor
// zwei Stapeln mit null.
function trPool() {
  if (trModus === 'alle') return freieSaetze(trLevel);
  return trModus === 'wiederholung' ? trWiederholung(trLevel) : trLernen(trLevel);
}
function trNaechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  var beste = null;
  trRuhend(trLevel).forEach(function (s) {
    var wann = (state.satzSeen[s.ru] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Niedrigste Stufe zuerst, bei Gleichstand das am längsten Zurückliegende.
// Aus den vordersten vieren wird gelost, damit sich nicht jede Sitzung gleich
// anfühlt; der gerade gelöste Satz kommt nicht sofort wieder.
function waehleSatz(pool, ausser) {
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = satzBox(a), bb = satzBox(b);
    if (ba !== bb) return ba - bb;
    return (state.satzSeen[a.ru] || 0) - (state.satzSeen[b.ru] || 0);
  });
  if (ausser && sortiert.length > 1) {
    sortiert = sortiert.filter(function (s) { return s !== ausser; });
  }
  var fenster = sortiert.slice(0, Math.min(4, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Ohne Argument wird der nächste Satz gewählt; mit Argument ein bestimmter.
function buildTransTask(vorgabe) {
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln.
  if (!vorgabe && trModus !== 'alle' && !trPool().length) {
    var anderer = trModus === 'lernen' ? 'wiederholung' : 'lernen';
    trModus = anderer;
    if (!trPool().length) trModus = 'lernen';
  }
  var liste = freieSaetze(trLevel);
  var satz = vorgabe || waehleSatz(trPool(), trTask ? trTask.satz : null);
  if (!satz) { trTask = null; return; }
  var ru = satz.ru, de = satz.de;
  // Ab hier zählt die Richtung *dieser* Aufgabe, nicht die eingestellte: Beim
  // Zeichnen darf sich nichts mehr verschieben, auch wenn der Filter wechselt.
  var richtung = trRichtungFuer(satz);
  var nachDe = richtung === 'ru-de';
  var prompt = nachDe ? ru : de;
  var targetTokens = tokenize(nachDe ? de : ru);
  var solution = nachDe ? de : ru;
  var targetNorm = {};
  targetTokens.forEach(function (w) { targetNorm[normalize(w)] = true; });
  // Ablenker kommen aus allen freigeschalteten Sätzen der Stufe, nicht nur aus
  // dem aktuellen Stapel — sonst wird die Auswahl mit der Zeit dünn.
  var otherWords = [];
  liste.forEach(function (p) {
    if (p === satz) return;
    tokenize(nachDe ? p.de : p.ru).forEach(function (w) {
      if (!targetNorm[normalize(w)]) otherWords.push(w);
    });
  });
  var uniq = [];
  var seen = {};
  otherWords.forEach(function (w) { if (!seen[w]) { seen[w] = true; uniq.push(w); } });
  var distractors = shuffle(uniq).slice(0, Math.min(3, uniq.length));
  var tiles = shuffle(targetTokens.concat(distractors)).map(function (word, i) {
    return { word: word, key: i };
  });
  trTask = {
    prompt: prompt, targetTokens: targetTokens, solution: solution, tiles: tiles,
    ru: ru, de: de, satz: satz, art: trArt(satz), dir: richtung,
    // Getippt wird in der Sprache der Lösung — die Tastatur richtet sich danach.
    loesungRu: !nachDe
  };
  trBuilt = [];
  trEingabe = '';
  trPhase = 'ask';
  trCorrect = null;
  trRevealed = false;
  meisterMeldung = null;
  patzerMeldung = null;
}

function trWort(key) {
  return trTask.tiles.filter(function (x) { return x.key === key; })[0].word;
}

// Ist genug gelegt oder geschrieben, um abgeben zu dürfen?
function trAbgabeBereit() {
  if (!trTask) return false;
  if (trTask.art === 'tippen') return normalize(trEingabe) !== '';
  return state.settings.requireComplete
    ? trBuilt.length === trTask.targetTokens.length
    : trBuilt.length > 0;
}

function trPruefen() {
  var ok;
  if (trTask.art === 'tippen') {
    // Wortweise verglichen, nicht Zeichen für Zeichen: `normalize()` räumt
    // Satzzeichen und Groß-/Kleinschreibung weg, ein doppeltes Leerzeichen
    // soll keinen Fehler bedeuten. Ins Deutsche zählen Artikel nicht mit.
    var deutsch = !trTask.loesungRu;
    ok = trVergleichbar(trEingabe, deutsch) === trVergleichbar(trTask.solution, deutsch);
  } else {
    ok = trBuilt.length === trTask.targetTokens.length && trBuilt.every(function (k, i) {
      return normalize(trWort(k)) === normalize(trTask.targetTokens[i]);
    });
  }
  trFinish(ok);
}

function trFinish(ok) {
  trCorrect = ok;
  trPhase = 'feedback';
  var vorher = satzBox(trTask.satz);
  satzUpdate(trTask.satz, ok);
  meisterMeldung = null;
  meisterPruefen(vorher, satzBox(trTask.satz), 'Satz', trTask.satz.ru,
    saetzeGemeistert() + ' von ' + SENTENCES.length + ' Sätzen');
  patzerPruefen(ok);
  meisterTon(ok);
  state.transStats.correct += ok ? 1 : 0;
  state.transStats.wrong += ok ? 0 : 1;
  zuletztGeuebt('uebersetzen');
  save();
}

// ── Wer schreibt, der bleibt ────────────────────────────────
// Dreimal hintereinander dasselbe Wort verschrieben heißt: Es sitzt nicht,
// gleich was der Leitner-Stand behauptet. Dann geht es zurück unter die
// Satzschwelle — und der Satz damit wieder zu.
var WORT_STRAFE = 3;
var patzerMeldung = null;

function patzerPruefen(ok) {
  patzerMeldung = null;
  // Gewertet wird nur die russische Seite und nur Geschriebenes: Aus Kacheln
  // lässt sich ein Wort nicht verschreiben, und die deutsche Rechtschreibung
  // ist hier nicht der Lehrstoff.
  if (!trTask || trTask.art !== 'tippen' || !trTask.loesungRu) return;
  // Aufgeben ist kein Verschreiben. Wer «Aufdecken» drückt, hat gar nichts
  // behauptet — dafür ein Wort zurückzustufen wäre eine Strafe für Ehrlichkeit.
  if (trRevealed) return;

  var diff = trWortDiff(trEingabe, trTask.solution);
  var zurueck = [], warnung = [], buchstaben = 0, danebenWorte = 0;

  diff.forEach(function (d) {
    if (d.abstand) { buchstaben += d.abstand; danebenWorte++; }
    var v = trVokabelZu(trTask.satz, d.ziel);
    if (!v) return;
    if (!d.abstand) { delete state.wortFehler[v.id]; return; }
    var n = (state.wortFehler[v.id] || 0) + 1;
    if (n < WORT_STRAFE) {
      state.wortFehler[v.id] = n;
      if (n === WORT_STRAFE - 1) warnung.push(v);
      return;
    }
    delete state.wortFehler[v.id];
    // Wer schon unter der Schwelle steht, kann nicht tiefer fallen — und
    // verdient keine zweite Strafe für dieselbe Lücke.
    if ((state.boxes[v.id] || 0) < SATZ_STUFE) return;
    state.boxes[v.id] = SATZ_STUFE - 1;
    state.lastSeen[v.id] = Date.now();
    state.patzer[v.id] = Date.now();
    zurueck.push(v);
  });

  if (zurueck.length) {
    patzerMeldung = {
      art: 'zurueck', woerter: zurueck,
      text: zurueck.length === 1
        ? 'Dreimal hintereinander verschrieben — das ist kein Vertipper mehr.'
        : 'Dreimal hintereinander verschrieben. Das ist kein Vertipper mehr.',
      note: satzFrei(trTask.satz)
        ? 'Der Satz bleibt offen, in «Lernsets» sehen Sie sich wieder.'
        : 'Der Satz ist damit wieder zu, bis ' +
          (zurueck.length === 1 ? 'es sitzt.' : 'sie sitzen.')
    };
    return;
  }
  if (ok || !danebenWorte) return;
  patzerMeldung = {
    art: 'knapp', woerter: warnung,
    text: patzerSpruch(danebenWorte, buchstaben),
    note: warnung.length
      ? 'Noch einmal daneben, dann geht ' + (warnung.length === 1 ? 'es' : 'das') +
        ' zurück in die Lehre.'
      : ''
  };
}

// Wie knapp war es? Ein Buchstabe ist etwas anderes als ein fehlendes Wort,
// und die Meldung darf das ruhig sagen.
function patzerSpruch(worte, buchstaben) {
  if (worte === 1 && buchstaben === 1) {
    return 'Ein einziger Buchstabe. Aber wer schreibt, der bleibt.';
  }
  if (worte === 1) {
    return buchstaben + ' Buchstaben daneben — war zwar nur ein Wort, aber knapp daneben ist auch vorbei.';
  }
  if (buchstaben <= worte + 1) {
    return worte + ' Wörter, ' + buchstaben + ' Buchstaben. So nah dran und doch vorbei.';
  }
  return worte + ' Wörter sind noch nicht da. Noch mal von vorn.';
}

function patzerHtml() {
  var p = patzerMeldung;
  if (!p) return '';
  var woerter = p.woerter.map(function (v) {
    return '<span class="cyr">' + esc(v.ru) + '</span>';
  }).join(' · ');
  return '<div class="patzer' + (p.art === 'zurueck' ? ' hart' : '') + '">' +
    '<strong>' + (p.art === 'zurueck'
      ? 'Uff. ' + (p.woerter.length === 1 ? 'Dieses Wort' : 'Diese Wörter') +
        ' müssen Sie noch mal lernen.'
      : esc(p.text)) + '</strong>' +
    (p.art === 'zurueck' ? '<span class="patzer-worte">' + woerter + '</span>' +
      '<span class="patzer-note">' + esc(p.text) + ' ' + esc(p.note) + '</span>'
      : (woerter ? '<span class="patzer-worte">' + woerter + '</span>' : '') +
        (p.note ? '<span class="patzer-note">' + esc(p.note) + '</span>' : '')) +
    // Der Augenblick, in dem ein Wort fällt, ist der beste, um es
    // zurückzuholen — sofern schon genug beisammen ist für eine Runde.
    (p.art === 'zurueck' && ptOffen()
      ? '<button class="btn ghost patzer-los" id="ptLos">Power-Training \u2192</button>' : '') +
    '</div>';
}

// Jedes Wort des russischen Satzes wird ein Knopf: Antippen fragt, warum es so
// dasteht. Der Satz bleibt dabei lesbar — die Knöpfe tragen keine Ränder.
function satzMitWissen(text) {
  return text.split(/(\s+)/).map(function (teil) {
    if (!/\S/.test(teil)) return teil;
    return '<button class="satzwort" data-wissenwort="' + esc(teil) + '">' +
      esc(teil) + '</button>';
  }).join('');
}

// Stufenwahl mit Angabe, wie viele S\u00e4tze je Stufe schon offen sind.
function renderUebersetzen() {

    } else {

// ── BUCHSTABEN ──────────────────────────────────────────────
// Freiwillig: blockiert nichts, schaltet nichts frei und zählt weder in die
// Serie noch in «beantwortet». Wer das Alphabet schon kann, verpasst nichts.
// Eigener Topf (state.abcBox / abcSeen), damit der Wortschatz sauber bleibt.
//
// Die sechs falschen Freunde stehen hier und nicht in den Daten: Dass В wie ein
// B aussieht, ist eine Eigenschaft des *lateinischen* Alphabets, nicht des
// russischen. Sie treten im Quiz bevorzugt als Ablenker gegeneinander an.
var ABC_TUECKISCH = 'внрсух';
// Geübt wird ohne Umweg; die Tafel ist ein Nachschlagewerk und liegt hinter
// dem Knopf links neben der Auswahl.
var abcAnsicht = 'ueben';     // 'ueben' · 'tafel'
var abcRichtung = 'gemischt'; // 'zeichen' · 'laut' · 'gemischt'
var abcOffen = null;          // Buchstabe, dessen Merkhilfe in der Tafel aufgeklappt ist
var abcQ = null, abcPhase = 'ask', abcPicked = null, abcCorrect = null;
var abcBuilt = [], abcRevealed = false;

function abcBox(b) { return state.abcBox[b[1]] || 0; }
function abcFaellig(b, jetzt) {
  var seit = state.abcSeen[b[1]];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(abcBox(b));
}
// Dieselben zwei Schwellen wie beim Wortschatz: ab SATZ_STUFE «sitzt» ein
// Buchstabe — man erkennt ihn —, ab BOX_MAX ist er «gemeistert» und verlässt
// den Stapel bis zur Auffrischung. Dazwischen liegt die Kachelaufgabe.
function abcSitzt(b) { return abcBox(b) >= SATZ_STUFE; }
function abcGemeistert(b) { return abcBox(b) >= BOX_MAX; }
function abcGelernt() { return ALPHABET.filter(abcSitzt).length; }
function abcMeisterschaft() { return ALPHABET.filter(abcGemeistert).length; }

function abcUpdate(b, richtig) {
  var cur = abcBox(b);
  state.abcBox[b[1]] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.abcSeen[b[1]] = Date.now();
  save();
}

// Offen ist, was noch nicht gemeistert ist; dazu kommt Fertiges, dessen Frist
// um ist. Ein Buchstabe, der erst «sitzt», bleibt also im Stapel — genau dort
// wartet die Kachelaufgabe auf ihn.
function abcPool() {
  var jetzt = Date.now();
  var offen = ALPHABET.filter(function (b) { return !abcGemeistert(b); });
  var frisch = ALPHABET.filter(function (b) { return abcGemeistert(b) && abcFaellig(b, jetzt); });
  return offen.concat(frisch);
}

// ── Lesen: was die Buchstaben schon hergeben ────────────────
// «Buchstaben» und «Freestyle» standen nebeneinander, ohne voneinander zu
// wissen: Wer das Alphabet übte, sah nie, wozu. Ein Wort, dessen Buchstaben
// alle gemeistert sind, lässt sich lesen — und das ist der erste Lohn des
// Alphabets. Genau diese Wörter sammelt der Lesemodus (ADR 0035).
var LESE_MINDEST = 3;   // ab so vielen lesbaren Wörtern lohnt der Hinweis
var LESE_STRAFE = 4;    // so oft darf ein Buchstabe danebengehen, dann fällt er

function gemeisterteBuchstaben() {
  var meister = {};
  ALPHABET.forEach(function (b) {
    if (abcGemeistert(b)) meister[b[1]] = true;
  });
  return meister;
}

// Was in keinem Alphabet steht, hält kein Wort auf: Leerzeichen und Striche
// muss man nicht gemeistert haben.
function leseZeichenEgal(c) {
  return c === ' ' || c === '-' || c === '‑' || c === '’' || c === '\'';
}

function wortLesbar(v, meister) {
  var w = v.ru.toLowerCase();
  for (var i = 0; i < w.length; i++) {
    var c = w.charAt(i);
    if (leseZeichenEgal(c)) continue;
    if (!meister[c]) return false;
  }
  return true;
}

function leseWoerter() {
  var meister = gemeisterteBuchstaben();
  return ALL_VOCAB.filter(function (v) { return wortLesbar(v, meister); });
}

function abcWaehlen() {
  var pool = abcPool();
  if (!pool.length) return null;
  var sortiert = pool.slice().sort(function (a, b) {
    var ba = abcBox(a), bb = abcBox(b);
    if (ba !== bb) return ba - bb;
    return (state.abcSeen[a[1]] || 0) - (state.abcSeen[b[1]] || 0);
  });
  if (abcQ && sortiert.length > 1) {
    sortiert = sortiert.filter(function (b) { return b[1] !== abcQ.b[1]; });
  }
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}

// Einstellige Laute wie «a» oder «w» kann man nicht zusammensetzen — «щ» mit
// seinen sieben Zeichen dagegen sehr wohl, und genau dort sitzt der Fehler.
// Ъ und Ь tragen ein deutsches Wort statt einer Lautschrift und fallen heraus.
function abcKachelbar(b) { return /^[a-z]{2,8}$/.test(b[2]); }

// Zwei bis drei lateinische Buchstaben, die im Laut nicht vorkommen — gezogen
// aus den Lauten des Alphabets, damit die Ablenker plausibel bleiben.
function abcZusatzKacheln(laut) {
  var drin = {};
  laut.split('').forEach(function (c) { drin[c] = true; });
  var vorrat = {};
  ALPHABET.forEach(function (x) {
    if (abcKachelbar(x)) x[2].split('').forEach(function (c) { vorrat[c] = true; });
  });
  var frei = Object.keys(vorrat).filter(function (c) { return !drin[c]; });
  return shuffle(frei).slice(0, Math.min(laut.length <= 3 ? 2 : 3, frei.length));
}

function abcFrageBauen() {
  var b = abcWaehlen();
  if (!b) { abcQ = null; return; }
  // Dieselbe Steigerung wie beim Wortschatz: erst wiedererkennen, dann
  // hinschreiben. Wer die Richtung fest wählt, behält sie — «Laut → Zeichen»
  // ist ohnehin schon die fordernde Seite.
  var box = abcBox(b);
  var basis = abcRichtung === 'gemischt'
    ? (Math.random() < 0.5 ? 'zeichen' : 'laut')
    : abcRichtung;
  var modus = (box >= SATZ_STUFE && basis === 'zeichen' && abcKachelbar(b))
    ? 'kacheln' : basis;

  abcPhase = 'ask';
  abcPicked = null;
  abcCorrect = null;
  abcBuilt = [];
  abcRevealed = false;

  gramBaustein = null;
  gramQ = null;
  gramPhase = 'ask';
  gramPicked = null;
  gramCorrect = null;
  gramEingabe = '';
  gramKb = null;
  gramRegelOffen = false;
  gramRegelNeu = false;

  if (modus === 'kacheln') {
    var laut = b[2];
    var zeichen = laut.split('');
    var kacheln = shuffle(zeichen.concat(abcZusatzKacheln(laut)));
    for (var i = 0; i < 10 && kacheln.slice(0, zeichen.length).join('') === laut; i++) {
      kacheln = shuffle(kacheln);
    }
    abcQ = {
      b: b, modus: modus, laut: laut, laenge: zeichen.length,
      tiles: kacheln.map(function (ch, k) { return { ch: ch, key: k }; })
    };
    return;
  }

  // Ablenker: bei einem falschen Freund die anderen falschen Freunde, sonst
  // Buchstaben mit ähnlich langem Laut — beides ist schwerer als Zufall.
  var tueckisch = ABC_TUECKISCH.indexOf(b[1]) !== -1;
  var kandidaten = ALPHABET.filter(function (x) {
    if (x[1] === b[1] || x[2] === b[2]) return false;
    return tueckisch ? ABC_TUECKISCH.indexOf(x[1]) !== -1 : true;
  });
  if (kandidaten.length < 3) {
    kandidaten = ALPHABET.filter(function (x) { return x[1] !== b[1] && x[2] !== b[2]; });
  }
  var optionen = shuffle(kandidaten).slice(0, 3).concat([b]);
  abcQ = { b: b, modus: modus, options: shuffle(optionen) };
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function abcAbgabeBereit() {
  if (!abcQ) return false;
  if (abcQ.modus === 'kacheln') {
    return state.settings.requireComplete
      ? abcBuilt.length === abcQ.laenge
      : abcBuilt.length > 0;
  }
  return abcPicked !== null;
}

function abcPruefen() {
  var q = abcQ;
  if (q.modus === 'kacheln') {
    var versuch = abcBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    abcCorrect = versuch === q.laut;
  } else {
    abcCorrect = abcPicked === q.b[1];
  }
  var vorher = abcBox(q.b);
  abcUpdate(q.b, abcCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, abcBox(q.b), 'Buchstabe', q.b[0] + ' ' + q.b[1] + ' — ' + q.b[2],
    abcMeisterschaft() + ' von ' + ALPHABET.length + ' Buchstaben');
  meisterTon(abcCorrect);
  zuletztGeuebt('buchstaben');
  // Nur der Übergang: War das der dreiunddreißigste?
  if (vorher < BOX_MAX && abcBox(q.b) >= BOX_MAX &&
    abcMeisterschaft() === ALPHABET.length) jubelZeigen('abc');
  abcPhase = 'feedback';
  renderBuchstaben();
}

// Kopf über der Frage — dasselbe Paket wie in «Lernsets», nur mit dem

function renderBuchstaben() {
  main.innerHTML = '<section>' +
    (abcAnsicht === 'tafel' ? abcTafelHtml() : abcUebenHtml()) + '</section>';

  main.querySelectorAll('[data-abc]').forEach(function (b) {
    b.addEventListener('click', function () {
      var gew = ALPHABET[parseInt(b.dataset.abc, 10)];
      abcOffen = abcOffen === gew[1] ? null : gew[1];
      renderBuchstaben();
    });
  });
  var zurTafel = document.getElementById('abcZurTafel');
  if (zurTafel) zurTafel.addEventListener('click', function () {
    abcAnsicht = 'tafel';
    renderBuchstaben();
    renderKopf();
  });
  main.querySelectorAll('[data-abcopt]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (abcPhase !== 'ask') return;
      abcPicked = abcQ.options[parseInt(b.dataset.abcopt, 10)][1];
      if (state.settings.confirmUeben) renderBuchstaben();
      else abcPruefen();
    });
  });
  main.querySelectorAll('[data-abctile]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (abcPhase !== 'ask') return;
      var key = parseInt(b.dataset.abctile, 10);
      if (abcBuilt.indexOf(key) !== -1 || abcBuilt.length >= abcQ.laenge) return;
      abcBuilt.push(key);
      if (!state.settings.confirmUeben && abcBuilt.length === abcQ.laenge) abcPruefen();
      else renderBuchstaben();
    });
  });
  var undo = document.getElementById('abcUndo');
  if (undo) undo.addEventListener('click', function () {
    abcBuilt.pop();
    renderBuchstaben();
  });
  var reveal = document.getElementById('abcReveal');
  if (reveal) reveal.addEventListener('click', function () {
    abcRevealed = true;
    abcCorrect = false;
    abcUpdate(abcQ.b, false);
    abcPhase = 'feedback';
    renderBuchstaben();
  });
  var conf = document.getElementById('abcConfirm');
  if (conf) conf.addEventListener('click', function () { if (abcAbgabeBereit()) abcPruefen(); });
  var next = document.getElementById('abcNext');
  if (next) next.addEventListener('click', function () {
    abcFrageBauen();
    renderBuchstaben();
  });
  var winkZu = document.getElementById('leseWinkZu');
  if (winkZu) winkZu.addEventListener('click', function () {
    // Weg — bis mehr Wörter lesbar sind als jetzt.
    state.leseWinkAb = leseWoerter().length;
    save();
    renderBuchstaben();
  });
  var los = document.getElementById('leseLos');
  if (los) los.addEventListener('click', function () {
    // Der Wink führt in genau den Modus, den er anpreist — nicht bloß in die
    // Übung, in der man ihn erst suchen müsste.
    uebModus = 'freestyle';
    uebThema = 'Alle';
    uebLesen = true;
    uebZuruecksetzen();
    setTab('freestyle');
  });
}

// Die eingebaute kyrillische Tastatur. Sie steht in drei Übungen; das
// Datenattribut sagt, wer die Tasten abholt.
// Die Eingabetaste der **Gerätetastatur** gibt ab — dieselbe Wirkung wie
// «Prüfen». Sie klickt den Abgabeknopf, statt die Prüfung selbst zu rufen: So
// gibt es nur einen Weg, und die beiden können nicht auseinanderlaufen. Ist der
// Knopf gesperrt, weil noch nichts dasteht, tut sie nichts.
//
// `preventDefault()` verhindert den Zeilenumbruch, den ein `textarea` sonst
// einfügt. Mit Umschalt bleibt der Umbruch möglich — gebraucht wird er hier
// zwar nie, aber ihn zu verbieten wäre eine Anmaßung.
//
// Nur in den Übungen: Im Meldeblatt schreibt man Absätze, dort wäre die Taste
// eine Falle.
function enterGibtAb(feld, knopfId) {
  if (!feld) return;
  feld.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    // Ein leeres Feld gibt nichts ab. In drei Übungen sperrt schon der Knopf;
    // in «Tippen» tut er es nicht — dort zählt eine leere Abgabe als Fehler,
    // und die Taste liegt beim Schreiben zu nah, um das zu riskieren.
    if (!feld.value.replace(/^\s+|\s+$/g, '')) return;
    var knopf = document.getElementById(knopfId);
    if (knopf && !knopf.disabled) knopf.click();
  });
}

// Kommt die eingebaute Tastatur von selbst? Nur da, wo sie überhaupt hilft:
// Ein deutscher Satz lässt sich mit der Gerätetastatur schreiben, ein
// kyrillischer auf einem deutschen iPhone nicht. Die Sprache der
// *Gerätetastatur* kann eine Seite nicht wählen — das ist Sache von iOS.
function tastaturVorgabe(kyrillisch) {
  return !!kyrillisch && state.settings.tastaturAuto;
}

// Der Aufbau folgt der gewohnten Tastatur: die Rücktaste rechts am Ende der
// dritten Reihe, das Leerzeichen allein in einer vierten — breit und mittig.
// Vorher hingen beide hinten an der dritten Reihe; die brach dadurch um, und
// die Rücktaste landete allein und mittig auf einer eigenen Zeile.
function tastaturHtml(attr) {
  var html = '<div>';
  KB_ROWS.forEach(function (row, ri) {
    html += '<div class="kb-row">';
    row.forEach(function (ch) {
      html += '<button class="key cyr" data-' + attr + '="' + esc(ch) + '">' + esc(ch) + '</button>';
    });
    if (ri === KB_ROWS.length - 1) {
      html += '<button class="key wide" data-' + attr + '="BS" aria-label="Zeichen löschen">' +
        ICON.ruecktaste + '</button>';
    }
    html += '</div>';
  });
  html += '<div class="kb-row"><button class="key space" data-' + attr + '=" "' +
    ' aria-label="Leerzeichen">\u2423</button></div>';
  return html + '</div>';
}

// ── GRAMMATIK ───────────────────────────────────────────────
// Vokabeln sind Fakten, Regeln sind Funktionen. Darum ist hier die Karteikarte
// die **Regel** und nicht das Wort: Gemeistert ist sie, wenn sie viermal auf
// verschiedene Wörter gewirkt hat. Und darum verlangt die Aufgabe ein bekanntes
// Wort in einer nie gesehenen Form — wer auswendig gelernt hat, scheitert
// daran, wer die Regel hat, nicht (ADR 0030).
//
// Freiwillig wie die Buchstaben: blockiert nichts, zählt nicht in Serie und
// «beantwortet», eigener Topf.
var gramBaustein = null;   // Kennung des laufenden Bausteins
var gramQ = null;          // die laufende Aufgabe
var gramPhase = 'ask';     // 'ask' · 'feedback'
var gramPicked = null;
var gramCorrect = null;
var gramEingabe = '';
var gramKb = null;
var gramRegelOffen = false;   // Regelkarte über «Mehr …» aufgeklappt
// Ausdrücklich gewählter Baustein. Null heißt: der Reihe nach. Damit lässt
// sich auch Gemeistertes wiederholen, ohne auf die Auffrischfrist zu warten.
var gramWahl = null;
var gramRegelNeu = false;     // frisch entdeckt: die Regel steht ganzseitig da

function gramBox(b) { return state.gramBox[b.id] || 0; }
function gramEntdeckt(b) { return state.gramSeen[b.id] !== undefined; }
function gramGemeistert(b) { return gramBox(b) >= BOX_MAX; }
function gramFaellig(b, jetzt) {
  var seit = state.gramSeen[b.id];
  if (!seit) return true;
  return jetzt - seit >= intervallFuer(gramBox(b));
}
function gramMeisterschaft() { return GRAMMATIK.filter(gramGemeistert).length; }

function gramFinde(id) {
  return GRAMMATIK.filter(function (b) { return b.id === id; })[0] || null;
}

// Offen ist, was noch nicht gemeistert ist; dazu Fertiges, dessen Frist um ist.
function gramPool() {
  var jetzt = Date.now();
  var offen = GRAMMATIK.filter(function (b) { return !gramGemeistert(b); });
  var frisch = GRAMMATIK.filter(function (b) { return gramGemeistert(b) && gramFaellig(b, jetzt); });
  return offen.concat(frisch);
}

// Der Reihe nach: Bausteine bauen aufeinander auf, ein Zufallsgriff wäre hier
// falsch. Der erste, der noch nicht sitzt, ist dran.
function gramWaehlen() {
  var pool = gramPool();
  return pool.length ? pool[0] : null;
}

function gramAktuell() {
  if (gramWahl) {
    var gewaehlt = gramFinde(gramWahl);
    if (gewaehlt) { gramBaustein = gewaehlt.id; return gewaehlt; }
    gramWahl = null;
  }
  var b = gramBaustein ? gramFinde(gramBaustein) : null;
  if (!b) { b = gramWaehlen(); gramBaustein = b ? b.id : null; }
  return b;
}

function gramUpdate(b, richtig) {
  var cur = gramBox(b);
  state.gramBox[b.id] = richtig ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.gramSeen[b.id] = Date.now();
  save();
}

// ── Die Wörter, an denen geübt wird ─────────────────────────
// Aus dem begonnenen Wortschatz: Die Regel soll auf ein Wort wirken, das man
// kennt — sonst prüft die Aufgabe zwei Dinge auf einmal. Ist noch nichts
// begonnen, tun es die Beispiele des Bausteins.
// Verben, an denen sich eine Regel zeigen lässt. Wer einen eigenen Stamm hat,
// bleibt draußen: «писать → пиш-» kann man nicht herleiten, nur wissen — die
// Aufgabe prüfte dann Gedächtnis statt Regel. Im Satz erklärt «Wissen» solche
// Formen trotzdem. Bei der Ich-Form ist es anders: Dort liegt der Stamm offen
// vor (die ты-Form steht da), also darf auch спать mitspielen.
function gramVerbPasst(b, v) {
  if (v.art !== 'v') return false;
  if (/ться$/.test(v.ru)) return false;      // rückbezüglich — eigener Baustein
  // Die Vergangenheit hat ihre eigene Regel: Sie greift auch bei Verben mit
  // eigenem Präsensstamm (писать → писал), aber nicht bei denen mit eigener
  // Vergangenheit (идти → шёл) und nicht bei denen ohne -ть.
  if (b.aufgabe === 'praet') {
    return !(VERBEN[v.ru] && VERBEN[v.ru].praet) && !!praeteritum(v.ru, 'm');
  }
  if (!verbBau(v.ru)) return false;
  var klasse = verbKlasse(v.ru);
  if (!klasse) return false;                 // folgt keiner Reihe
  if (b.aufgabe === 'ichform') return verbIchWandel(v.ru);
  if (VERBEN[v.ru]) return false;
  return !b.klasse || klasse === b.klasse;
}

// Adjektive, an denen sich die Übereinstimmung zeigen lässt: alle, deren
// Grundform die Maschine beugen kann. «холодно» und «жарко» sind keine —
// sie stehen in den Daten als unveränderlich.
function gramAdjektive() {
  return ALL_VOCAB.filter(function (v) { return v.art === 'a' && adjTeile(v.ru); });
}

function gramWortPool(b) {
  var stufe = gramBox(b);
  // Die Übereinstimmung zeigt sich am Adjektiv, nicht am Nomen — geübt wird
  // also an Adjektiven, das Nomen kommt als Partner dazu.
  if (b.aufgabe === 'adj') {
    var adj = gramAdjektive();
    var begonnenA = adj.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
    if (begonnenA.length >= 4) return begonnenA;
    var vorratA = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
      .filter(function (v) { return v && v.art === 'a' && adjTeile(v.ru); });
    begonnenA.forEach(function (v) { if (vorratA.indexOf(v) === -1) vorratA.push(v); });
    return vorratA.length ? vorratA : adj.slice(0, 12);
  }
  if (b.aufgabe === 'praes' || b.aufgabe === 'ichform' || b.aufgabe === 'praet') {
    var verben = ALL_VOCAB.filter(function (v) {
      return (state.boxes[v.id] || 0) > 0 && gramVerbPasst(b, v);
    });
    if (verben.length >= 4) return verben;
    var vorrat = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
      .filter(function (v) { return v && gramVerbPasst(b, v); });
    verben.forEach(function (v) {
      if (vorrat.indexOf(v) === -1) vorrat.push(v);
    });
    return vorrat;
  }
  // «Wo?» verlangt einen Ort — und ob ein Wort einer sein kann, sagt keine
  // Endung. «в маме» wäre grammatisch richtig und Unsinn, «в утре» ebenso.
  // Darum ist der Präpositiv die eine Rubrik mit ausgesuchten Wörtern: Der
  // Baustein nennt sie, die Regel selbst gilt trotzdem für jedes Nomen — im
  // Satz führt «Wissen» sie vor.
  // Dieselbe Vorsicht bei Mehrzahl und Genitiv: «zwei Wasser» ist keine
  // Mehrzahl, sondern eine Sonderbedeutung, und «нет музыки» sagt niemand.
  // Auch hier nennt der Baustein seine Wörter selbst.
  if (b.aufgabe === 'praep' || b.aufgabe === 'plural' || b.aufgabe === 'gen') {
    var taugt = function (v) {
      if (!v || NOMEN[v.ru] || !istNomen(v.art)) return false;
      return b.aufgabe !== 'praep' || !belebt(v.art);
    };
    var orte = b.beispiele.map(function (ru) { return VOKABEL[ru]; }).filter(taugt);
    var gelernt = orte.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
    return gelernt.length >= 4 ? gelernt : orte;
  }
  var passt = function (v) {
    if (!istNomen(v.art)) return false;
    // Belebte männliche Nomen im Akkusativ bleiben draußen, bis ihr eigener
    // Baustein dran ist — sonst verlangte die Übung eine ungelernte Regel.
    if (b.aufgabe === 'akk' && v.art === 'mb') return false;
    // Im Präpositiv bleibt draußen, was die Regel nicht trägt: flüchtige
    // Vokale, eigene Stämme, der Ortsfall auf -у. Im Satz erklärt «Wissen»
    // solche Formen trotzdem — erklären und abfragen sind zwei Dinge.
    // Erst wenn die Regel sitzt, kommen die Wörter dazu, die sie nicht verrät.
    if (b.aufgabe === 'geschlecht' && stufe < SATZ_STUFE &&
      geschlecht(v.art) !== wortartRegel(v.ru)) return false;
    return true;
  };
  var begonnen = ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) > 0 && passt(v);
  });
  if (begonnen.length >= 6) return begonnen;
  var aus = b.beispiele.map(function (ru) { return VOKABEL[ru]; })
    .filter(function (v) { return v && passt(v); });
  // Beispiele zuerst, damit auch ein leerer Lernstand sofort üben kann.
  var drin = {};
  aus.forEach(function (v) { drin[v.id] = true; });
  begonnen.forEach(function (v) { if (!drin[v.id]) aus.push(v); });
  return aus.length ? aus : ALL_VOCAB.filter(passt).slice(0, 12);
}

// Ablenker für den Akkusativ: dasselbe Wort mit anderen Endungen. Sie sind
// keine erfundenen Wörter, sondern Formen, die es gibt — nur nicht hier.
function gramAblenker(ru, richtig) {
  var stamm = ru.replace(/[аяоеьйы]$/, '');
  var enden = ['а', 'у', 'е', 'и', 'ы', 'о'];
  var aus = [];
  enden.forEach(function (e) {
    var f = stamm + e;
    // «ы» steht nie nach к г х ж ч ш щ — ein Ablenker, den die Rechtschreibung
    // schon ausschließt, wäre kein Ablenker.
    if (e === 'ы' && nachZischlaut(stamm)) return;
    if (f !== richtig && f !== ru && aus.indexOf(f) === -1) aus.push(f);
  });
  if (ru !== richtig && aus.indexOf(ru) === -1) aus.push(ru);
  return shuffle(aus).slice(0, 3);
}

// Ablenker fürs Präsens: dasselbe Verb in anderen Personen. Auch sie sind echte
// Formen — wer sie wählt, hat nicht falsch gebaut, sondern die falsche Person.
function gramAblenkerPerson(ru, richtig) {
  var formen = verbBau(ru) || [];
  var aus = [];
  shuffle(formen.slice()).forEach(function (f) {
    if (f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  });
  return aus.slice(0, 3);
}

// Ablenker für die Ich-Form. Hier steht ausnahmsweise auch ein Wort dabei, das
// es nicht gibt: der ungewandelte Stamm mit der Endung («любю»). Genau das ist
// der Fehler, um den es geht — ihn nicht zu wählen, ist die Aufgabe.
function gramAblenkerIch(ru, richtig) {
  var stamm = verbStamm(ru);
  var aus = [];
  var dazu = function (f) {
    if (f && f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  };
  dazu(stamm + (nachZischlaut(stamm) ? 'у' : 'ю'));
  dazu(stamm + 'ю');
  gramAblenkerPerson(ru, richtig).forEach(dazu);
  return aus.slice(0, 3);
}

// Ablenker für die Vergangenheit und für die Übereinstimmung: dieselbe Form in
// den anderen drei Geschlechtern. Wer sie wählt, hat nicht falsch gebaut,
// sondern sich nach dem falschen Wort gerichtet.
function gramAblenkerGenus(bauen, richtig) {
  var aus = [];
  shuffle(GENERA.slice()).forEach(function (g) {
    var f = bauen(g);
    if (f && f !== richtig && aus.indexOf(f) === -1) aus.push(f);
  });
  return aus.slice(0, 3);
}

function gramFrageBauen() {
  var b = gramAktuell();
  gramPhase = 'ask';
  gramPicked = null;
  gramCorrect = null;
  gramEingabe = '';
  meisterMeldung = null;
  if (!b) { gramQ = null; return; }

  var pool = gramWortPool(b);
  if (!pool.length) { gramQ = null; return; }
  var wort = pool[Math.floor(Math.random() * pool.length)];
  if (gramQ && pool.length > 1) {
    var ohne = pool.filter(function (v) { return v.id !== gramQ.wort.id; });
    if (ohne.length) wort = ohne[Math.floor(Math.random() * ohne.length)];
  }

  var tippen = gramBox(b) >= SATZ_STUFE;

  if (b.aufgabe === 'geschlecht') {
    gramQ = {
      baustein: b.id, art: 'geschlecht', wort: wort,
      loesung: geschlecht(wort.art),
      optionen: ['m', 'w', 's']
    };
    return;
  }
  // Ich-Form: gegeben ist die ты-Form, damit der Stamm offen daliegt. Gefragt
  // ist allein, was mit ihm geschieht.
  if (b.aufgabe === 'ichform') {
    var ich = praesens(wort.ru, '1s');
    gramQ = {
      baustein: b.id, art: 'ichform', wort: wort, person: '1s',
      von: praesens(wort.ru, '2s'), loesung: ich, tippen: tippen,
      optionen: shuffle([ich].concat(gramAblenkerIch(wort.ru, ich)))
    };
    return;
  }
  // Präsens: eine Person auslosen, die Form dazu bauen.
  if (b.aufgabe === 'praes') {
    var person = b.person || PERSONEN[Math.floor(Math.random() * PERSONEN.length)];
    if (gramQ && gramQ.person === person && !b.person) {
      person = PERSONEN[(PERSONEN.indexOf(person) + 1 + Math.floor(Math.random() * 5)) % 6];
    }
    var pform = praesens(wort.ru, person);
    gramQ = {
      baustein: b.id, art: 'praes', wort: wort, person: person,
      von: wort.ru, loesung: pform, tippen: tippen,
      optionen: shuffle([pform].concat(gramAblenkerPerson(wort.ru, pform)))
    };
    return;
  }
  // Vergangenheit: ausgelost wird, wer gehandelt hat — davon hängt die Endung
  // ab, nicht von der Person.
  if (b.aufgabe === 'praet') {
    var genus = GENERA[Math.floor(Math.random() * GENERA.length)];
    if (gramQ && gramQ.genus === genus) {
      genus = GENERA[(GENERA.indexOf(genus) + 1 + Math.floor(Math.random() * 3)) % 4];
    }
    var vform = praeteritum(wort.ru, genus);
    gramQ = {
      baustein: b.id, art: 'praet', wort: wort, genus: genus,
      von: wort.ru, loesung: vform, tippen: tippen,
      optionen: shuffle([vform].concat(gramAblenkerGenus(function (g) {
        return praeteritum(wort.ru, g);
      }, vform)))
    };
    return;
  }
  // Übereinstimmung: das Nomen bestimmt, wie das Adjektiv aussieht. Es wird
  // mitgelost — die Mehrzahl steht dabei für sich, sie hat kein Geschlecht.
  if (b.aufgabe === 'adj') {
    var partner = gramNomenPartner(b);
    var agenus = partner ? partner.genus : 'w';
    var aform = adjektiv(wort.ru, agenus);
    gramQ = {
      baustein: b.id, art: 'adj', wort: wort, genus: agenus,
      partner: partner, von: wort.ru, loesung: aform, tippen: tippen,
      optionen: shuffle([aform].concat(gramAblenkerGenus(function (g) {
        return adjektiv(wort.ru, g);
      }, aform)))
    };
    return;
  }
  // Fälle: unter der Endstufe die Form wählen, darüber selbst schreiben.
  var form = grammForm(wort.ru, wort.art, b.aufgabe);
  gramQ = {
    baustein: b.id, art: b.aufgabe, wort: wort, loesung: form,
    tippen: tippen,
    optionen: shuffle([form].concat(gramAblenker(wort.ru, form)))
  };
}

// Das Nomen, nach dem sich das Adjektiv richtet — aus der Liste des Bausteins,
// nicht aus dem ganzen Wortschatz. Grammatisch ginge jedes: «тёмный папа» ist
// tadellos gebeugt und trotzdem Unsinn. Wo eine Aufgabe etwas über die Welt
// voraussetzt und nicht nur über die Sprache, nennt der Baustein seine Wörter
// selbst — dieselbe Regel wie beim Präpositiv.
// Bekanntes zuerst: Ein Nomen, das man schon kennt, macht die Aufgabe zu einer
// über die Endung statt zu zweien auf einmal.
function gramNomenPartner(b) {
  var alleP = b.partner.map(function (ru) { return VOKABEL[ru]; })
    .filter(function (v) { return v && istNomen(v.art); });
  var pool = alleP.filter(function (v) { return (state.boxes[v.id] || 0) > 0; });
  if (pool.length < 3) pool = alleP;
  if (!pool.length) return null;
  var v = pool[Math.floor(Math.random() * pool.length)];
  var mehrzahl = Math.random() < 0.25;
  return {
    wort: v,
    genus: mehrzahl ? 'p' : geschlecht(v.art),
    text: mehrzahl ? plural(v.ru, v.art) : v.ru,
    mehrzahl: mehrzahl
  };
}

function gramAbgabeBereit() {
  if (!gramQ) return false;
  if (gramQ.tippen) return normalize(gramEingabe) !== '';
  return gramPicked !== null;
}

function gramPruefen() {
  var q = gramQ;
  var b = gramFinde(q.baustein);
  gramCorrect = q.tippen
    ? normalize(gramEingabe) === normalize(q.loesung)
    : gramPicked === q.loesung;
  var vorher = gramBox(b);
  gramUpdate(b, gramCorrect);
  meisterMeldung = null;
  meisterPruefen(vorher, gramBox(b), 'Regel', b.name,
    gramMeisterschaft() + ' von ' + GRAMMATIK.length + ' Regeln', false);
  if (vorher < BOX_MAX && gramBox(b) >= BOX_MAX &&
    gramMeisterschaft() === GRAMMATIK.length) {
    jubelZeigen('regel', { m: GRAMMATIK.length });
  }
  meisterTon(gramCorrect);
  zuletztGeuebt('grammatik');
  gramPhase = 'feedback';
  renderGrammatik();
}

// ── Entdecken ───────────────────────────────────────────────
// Erst sehen, dann benennen, dann die Regel: Was man selbst gefunden hat,
// behält man. Freie Eingabe wäre nicht bewertbar — die Wahl unter drei
// Deutungen ist die bewertbare Form desselben Gedankens.
// Die Beispiele müssen **kontrastieren**, sonst gibt es nichts zu entdecken:
// Vier weibliche Wörter zeigen kein Muster, sie zeigen vier Mal dasselbe. Für
// das Geschlecht also je eines pro Geschlecht; für den Akkusativ zwei, die sich
// ändern, und eines, das bleibt — erst der Unterschied ist die Regel.
function gramEntdeckenWoerter(b) {
  var pool = gramWortPool(b);
  // Bei Verben gibt es kein Geschlecht zu mischen — den Gegensatz stellt
  // gramPaare() über Personen und Reihen her.
  if (b.aufgabe === 'praes' || b.aufgabe === 'ichform' ||
    b.aufgabe === 'praet' || b.aufgabe === 'adj') return pool.slice(0, 4);
  var nach = function (g) {
    return pool.filter(function (v) { return geschlecht(v.art) === g; });
  };
  var aus = [];
  var nimm = function (liste, wieviele) {
    liste.forEach(function (v) {
      if (aus.length < 4 && wieviele > 0 && aus.indexOf(v) === -1) { aus.push(v); wieviele--; }
    });
  };
  // Präpositiv wie Geschlecht: je eines pro Geschlecht. Der Gegensatz ist hier
  // gerade, dass es *keinen* gibt — dreimal dieselbe Endung, und genau das soll
  // auffallen, weil der Akkusativ es anders macht.
  if (b.aufgabe === 'geschlecht' || b.aufgabe === 'praep' ||
    b.aufgabe === 'plural' || b.aufgabe === 'gen') {
    nimm(nach('w'), 1); nimm(nach('m'), 1); nimm(nach('s'), 1); nimm(pool, 1);
  } else {
    nimm(nach('w'), 2); nimm(nach('s'), 1); nimm(nach('m'), 1);
  }
  if (aus.length < 3) nimm(pool, 4 - aus.length);
  return aus;
}

// Die Gegenüberstellung, aus der die Regel hervorgehen soll. Was links und was
// rechts steht, hängt an der Aufgabe — der Unterschied dazwischen ist die Regel.
//   Präsens: ein Verb in drei Personen — die Endung sagt, wer.
//   i-Reihe: dieselbe Person bei Verben beider Reihen — der Infinitiv entscheidet.
//   Ich-Form: die ты-Form neben der я-Form, darunter eines ohne Wandel.
function gramPaare(b) {
  var aus = [];
  if (b.aufgabe === 'ichform') {
    gramEntdeckenWoerter(b).slice(0, 3).forEach(function (v) {
      aus.push({ links: praesens(v.ru, '2s'), rechts: praesens(v.ru, '1s'), kyr: true });
    });
    var glatt = gramGlattesVerb(b);
    if (glatt) {
      aus.push({ links: praesens(glatt.ru, '2s'), rechts: praesens(glatt.ru, '1s'), kyr: true });
    }
    return aus;
  }
  // Vergangenheit: ein Verb, vier Handelnde — nicht die Person entscheidet,
  // sondern wer handelt. Das ist der Gegensatz zum Präsens, und genau er soll
  // auffallen.
  if (b.aufgabe === 'praet') {
    var eines = gramEntdeckenWoerter(b)[0];
    if (!eines) return aus;
    GENERA.forEach(function (g) {
      aus.push({
        links: eines.ru + ' · ' + (g === 'p' ? 'они' : { m: 'он', w: 'она', s: 'оно' }[g]),
        rechts: praeteritum(eines.ru, g), kyr: true
      });
    });
    return aus;
  }
  // Übereinstimmung: dasselbe Adjektiv neben Nomen dreier Geschlechter.
  if (b.aufgabe === 'adj') {
    var adjektive = gramEntdeckenWoerter(b);
    var eins2 = adjektive[0];
    if (!eins2) return aus;
    var muster = b.partner.map(function (ru) { return VOKABEL[ru]; })
      .filter(function (v) { return v && istNomen(v.art) && !NOMEN[v.ru]; });
    ['m', 'w', 's'].forEach(function (g) {
      var n = muster.filter(function (v) { return geschlecht(v.art) === g; })[0];
      if (n) aus.push({ links: eins2.ru + ' · ' + n.ru, rechts: adjektiv(eins2.ru, g), kyr: true });
    });
    var mz = muster[0];
    if (mz) {
      aus.push({
        links: eins2.ru + ' · ' + plural(mz.ru, mz.art), rechts: adjektiv(eins2.ru, 'p'), kyr: true
      });
    }
    return aus;
  }
  if (b.aufgabe === 'praes') {
    var pool = gramEntdeckenWoerter(b);
    if (b.klasse === 'i') {
      // Der Gegensatz sitzt zwischen den Reihen, nicht zwischen den Personen.
      var andere = gramVerbe({ aufgabe: 'praes', klasse: 'e' });
      pool.slice(0, 3).forEach(function (v) {
        aus.push({ links: v.ru + ' · он', rechts: praesens(v.ru, '3s'), kyr: true });
      });
      if (andere.length) {
        aus.push({ links: andere[0].ru + ' · он', rechts: praesens(andere[0].ru, '3s'), kyr: true });
      }
      return aus;
    }
    var eins = pool[0];
    if (!eins) return aus;
    ['1s', '2s', '3s', '3p'].forEach(function (p) {
      aus.push({
        links: eins.ru + ' · ' + PERSON_NAME[p], rechts: praesens(eins.ru, p), kyr: true
      });
    });
    return aus;
  }
  gramEntdeckenWoerter(b).forEach(function (v) {
    aus.push({
      links: v.ru,
      rechts: b.aufgabe === 'geschlecht'
        ? GESCHLECHT_NAME[geschlecht(v.art)]
        : (b.aufgabe === 'praep' ? 'в ' : b.aufgabe === 'gen' ? 'нет ' : '') +
          grammForm(v.ru, v.art, b.aufgabe),
      kyr: b.aufgabe !== 'geschlecht'
    });
  });
  return aus;
}

// Ein Verb derselben Reihe, dessen Stamm sich *nicht* wandelt — es ist die
// Gegenprobe: Ohne ein Beispiel ohne Wandel sähe es aus, als wandle sich immer
// etwas.
function gramGlattesVerb(b) {
  void b;
  var glatt = gramVerbe({ aufgabe: 'praes', klasse: 'i' }).filter(function (v) {
    return !verbIchWandel(v.ru);
  });
  return glatt.length ? glatt[0] : null;
}

// Alle Verben des Lehrplans, an denen dieser Baustein etwas zeigen kann.
function gramVerbe(b) {
  return ALL_VOCAB.filter(function (v) { return gramVerbPasst(b, v); });
}

function gramEntdeckenHtml(b) {
  var html = '<p class="task-label">' + esc(b.name) + ' · entdecken</p>' +
    '<div class="card"><p class="hint">' + esc(b.frage) + '</p><div class="gram-paare">';
  gramPaare(b).forEach(function (p) {
    html += '<div class="gram-paar"><span class="cyr">' + esc(p.links) + '</span>' +
      '<span class="gram-pfeil" aria-hidden="true">→</span>' +
      '<span class="' + (p.kyr ? 'cyr' : 'gram-deutung') + '">' +
      esc(p.rechts) + '</span></div>';
  });
  html += '</div><div class="options">';
  b.deutungen.forEach(function (d, i) {
    var klasse = 'option';
    if (gramPhase === 'feedback') {
      if (i === b.richtig) klasse += ' right';
      else if (gramPicked === i) klasse += ' wrong';
      else klasse += ' muted';
    } else if (gramPicked === i) klasse += ' picked';
    html += '<button class="' + klasse + '" data-gramdeutung="' + i + '"' +
      (gramPhase !== 'ask' ? ' disabled' : '') + '>' + esc(d) + '</button>';
  });
  html += '</div>';
  if (gramPhase === 'feedback') {
    html += '<div class="feedback ' + (gramCorrect ? 'good' : 'bad') + '"><p>' +
      (gramCorrect ? ICON.haken + 'Genau das ist es.' : ICON.kreuz + 'Nicht ganz — so ist es:') +
      '</p></div>';
  }
  html += '</div><div class="btn-row">';
  html += gramPhase === 'ask'
    ? '<button class="btn primary" id="gramDeutungAb"' + (gramPicked === null ? ' disabled' : '') +
      '>Bestätigen</button>'
    : '<button class="btn primary" id="gramZurRegel">Die Regel →</button>';
  return html + '</div>';
}

// ── Die Regelkarte ──────────────────────────────────────────
function gramRegelHtml(b, mitKnopf) {

    ' · ' + esc(b.kurz) + '</p>' +

      '<span class="gram-was">' + esc(z[1]) + '</span>' +
