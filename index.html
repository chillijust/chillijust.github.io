// ── Anwenden ────────────────────────────────────────────────
function gramUebenHtml(b) {
  if (!gramQ || gramQ.baustein !== b.id) gramFrageBauen();
  if (!gramQ) {
    return '<div class="leer">' + maskottchen('gross') +
      '<h3>Nichts zu üben</h3><p>Für diese Regel fehlen noch passende Wörter. ' +
      'Lernen Sie ein paar Vokabeln — dann kommt sie von selbst zurück.</p></div>';
  }
  var q = gramQ;
  var stufe = gramBox(b);
  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) {
    dots += '<span class="' + (i <= stufe && stufe > 0 ? 'on' : '') + '"></span>';
  }
  var html = gramKopfHtml(b) + '<p class="kachel-ort">' + esc(b.name) + '</p>' +
    '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="mitte">' + (q.tippen ? 'selbst schreiben' : 'wählen') + '</span>' +
    '<span></span></div>';

  if (q.art === 'geschlecht') {
    html += '<p class="task-label">Welches Geschlecht?</p>' +
      '<p class="word cyr">' + esc(q.wort.ru) + hoerknopf(q.wort.ru, 'ru') + '</p>' +
      gramVorgabe(q.wort.de, '') + '<div class="options abc-optionen">';
    q.optionen.forEach(function (g) {
      var klasse = 'option';
      if (gramPhase === 'feedback') {
        if (g === q.loesung) klasse += ' right';
        else if (gramPicked === g) klasse += ' wrong';
        else klasse += ' muted';
      } else if (gramPicked === g) klasse += ' picked';
      html += '<button class="' + klasse + '" data-gramopt="' + esc(g) + '"' +
        (gramPhase !== 'ask' ? ' disabled' : '') + '>' + GESCHLECHT_NAME[g] + '</button>';
    });
    html += '</div>';
  } else {
    if (q.art === 'akk' || q.art === 'praep' || q.art === 'gen' || q.art === 'plural') {
      var FALLFRAGE = {
        praep: 'Wo? — die Form nach <span class="cyr">в</span> und <span class="cyr">на</span>',
        akk: 'Wen? Was? — die Form dazu',
        gen: 'Was fehlt? — die Form nach <span class="cyr">нет</span>',
        plural: 'Und in der Mehrzahl?'
      };
      html += '<p class="task-label">' + FALLFRAGE[q.art] + '</p>' +
        '<p class="word cyr">' + esc(q.wort.ru) + '</p>' +
        gramVorgabe(q.wort.de, GESCHLECHT_NAME[geschlecht(q.wort.art)]);
    } else if (q.art === 'praet') {
      html += '<p class="task-label">Gestern — wer hat gehandelt?</p>' +
        '<p class="word cyr">' + esc(q.von) + '</p>' +
        gramVorgabe(q.wort.de, GENUS_SUBJEKT[q.genus]);
    } else if (q.art === 'adj') {
      // Das Nomen steht groß daneben: Nach ihm richtet sich die Antwort, es ist
      // also nicht Beiwerk, sondern die halbe Aufgabe.
      html += '<p class="task-label">Welche Form passt zum Wort daneben?</p>' +
        '<p class="word cyr">' + esc(q.von) + ' <span class="wort-partner">' +
        esc(q.partner ? q.partner.text : '') + '</span></p>' +
        gramVorgabe(q.wort.de, q.partner
          ? esc(q.partner.wort.de) + (q.partner.mehrzahl ? ' — Mehrzahl' : ' — ' +
            GESCHLECHT_NAME[geschlecht(q.partner.wort.art)])
          : '');
    } else {
      html += '<p class="task-label">' +
        (q.art === 'ichform' ? 'Und in der Ich-Form?' : 'Die Form für diese Person') +
        '</p><p class="word cyr">' + esc(q.von) + '</p>' +
        gramVorgabe(q.wort.de,
          '<span class="cyr">' + esc(PERSON_NAME[q.person]) + '</span> — ' +
          esc(PERSON_DE[q.person]));
    }
    if (q.tippen) {
      html += gramPhase === 'feedback'
        ? pruefzeileHtml(gramEingabe, q.loesung, true, 'form')
        : '<textarea id="gramInput" rows="1" class="fliess cyr"' +
          ' lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
          ' enterkeyhint="go" placeholder="Die Form schreiben …">' + esc(gramEingabe) + '</textarea>';
    } else {
      html += '<div class="options abc-optionen">';
      q.optionen.forEach(function (f, i) {
        var klasse = 'option cyr';
        if (gramPhase === 'feedback') {
          if (f === q.loesung) klasse += ' right';
          else if (gramPicked === f) klasse += ' wrong';
          else klasse += ' muted';
        } else if (gramPicked === f) klasse += ' picked';
        html += '<button class="' + klasse + '" data-gramopt="' + esc(f) + '"' +
          (gramPhase !== 'ask' ? ' disabled' : '') + '>' + esc(f) + '</button>';
        void i;
      });
      html += '</div>';
    }
  }

  if (gramPhase === 'feedback') {
    html += '<div class="feedback ' + (gramCorrect ? 'good' : 'bad') + '"><p>';
    if (gramCorrect) html += ICON.haken + 'Richtig!';
    else if (q.art === 'geschlecht') {
      html += ICON.kreuz + '<strong>' + GESCHLECHT_NAME[q.loesung] + '</strong>';
    } else {
      html += ICON.kreuz + 'Richtig wäre <strong class="cyr">' + esc(q.loesung) + '</strong>';
    }
    html += '</p></div>' + gramWarumHtml(b, q) + meisterHtml();
  }

  html += '</div><div class="btn-row">';
  if (gramPhase === 'ask') {
    html += '<button class="btn ghost" id="gramWarum" aria-expanded="' +
      (gramRegelOffen ? 'true' : 'false') + '" aria-controls="gramRegelKlapp">Mehr \u2026</button>' +
      '<button class="btn primary" id="gramConfirm"' + (gramAbgabeBereit() ? '' : ' disabled') +
      '>' + (q.tippen ? 'Prüfen' : 'Bestätigen') + '</button>';
  } else {
    html += '<button class="btn primary" id="gramNext">Weiter →</button>';
  }
  html += '</div>';
  // Die Karte steht immer im Baum, nur zugeklappt — sonst gäbe es nichts, was
  // sich aufklappen könnte, und der Wechsel wäre ein Sprung statt einer Bewegung.
  html += '<div class="regelklapp' + (gramRegelOffen ? ' auf' : '') + '" id="gramRegelKlapp"' +
    ' aria-hidden="' + (gramRegelOffen ? 'false' : 'true') + '"><div class="klappwrap">' +
    gramRegelHtml(b, false) + '</div></div>';
  if (q.tippen && gramPhase === 'ask') {
    if (gramKb === null) gramKb = tastaturVorgabe(true);
    html += '<button class="kb-toggle" id="gramKbToggle">' +
      (gramKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (gramKb) html += tastaturHtml('gramkey');
  }
  html += '<p class="session-info">' + gramPool().length + ' offen · ' +
    gramMeisterschaft() + ' von ' + GRAMMATIK.length + ' Regeln sitzen</p>';
  return html;
}

// Was die Aufgabe außer dem Wort noch vorgibt — die Bedeutung und, wenn es
// eine gibt, die verlangte Person oder das Geschlecht. Das stand als graue
// Nebenbemerkung da und wurde überlesen; jetzt ist es ein eigenes Feld, und
// der verlangte Teil trägt die Goldfarbe.
function gramVorgabe(bedeutung, verlangt) {
  return '<p class="gram-vorgabe"><span class="gv-bedeutung">' + esc(bedeutung) + '</span>' +
    (verlangt ? '<span class="gv-trenner" aria-hidden="true"></span>' +
      '<strong class="gv-verlangt">' + verlangt + '</strong>' : '') + '</p>';
}

// Die Begründung *zu dieser Antwort* — nicht die Regel im Allgemeinen. Sie
// steht nach der Auflösung da, wo man sie braucht.
function gramWarumHtml(b, q) {
  var v = q.wort;
  var g = geschlecht(v.art);
  if (q.art === 'geschlecht') {
    // Ausnahme heißt: ein anderes Geschlecht als die Endung sagt. Dass ein Wort
    // zusätzlich belebt ist, macht es nicht zur Ausnahme.
    var ausRegel = geschlecht(v.art) === wortartRegel(v.ru);
    return '<p class="hint">' + (ausRegel
      ? '«' + esc(v.ru) + '» endet auf <strong class="cyr">' +
        esc(v.ru.slice(-1)) + '</strong> — also ' + GESCHLECHT_NAME[g] + '.'
      : '«' + esc(v.ru) + '» ist eine Ausnahme: Die Endung sagt etwas anderes, ' +
        'das Wort ist ' + GESCHLECHT_NAME[g] + '.') + '</p>';
  }
  if (q.art === 'praes' || q.art === 'ichform') {
    return '<p class="hint">' + gramVerbWarum(v.ru, q.person, q.loesung) + '</p>';
  }
  if (q.art === 'praep') {
    return '<p class="hint">' + gramNomenWarum(v.ru, v.art, q.loesung) + '</p>';
  }
  if (q.art === 'praet') {
    return '<p class="hint"><strong class="cyr">' + esc(v.ru) + '</strong> ohne ' +
      '<span class="cyr">-ть</span> ist <strong class="cyr">' + esc(v.ru.slice(0, -2)) +
      '</strong>; ' + (q.genus === 'p' ? 'in der Mehrzahl' : 'für ' + GENUS_NAME[q.genus]) +
      ' kommt <strong class="cyr">-' + esc(PRAET_ENDE[q.genus]) +
      '</strong> daran. Die Person spielt keine Rolle.</p>';
  }
  if (q.art === 'adj') {
    var t = adjTeile(v.ru) || { stamm: v.ru, zisch: false, velar: false, weich: false };
    var warum = t.weich
      ? 'Der Stamm ist weich (<span class="cyr">' + esc(t.stamm) + '</span> + ' +
        '<span class="cyr">-ий</span>), darum die weiche Reihe.'
      : (t.zisch || t.velar
        ? 'Nach <span class="cyr">' + esc(t.stamm.slice(-1)) + '</span> steht nie ' +
          '<span class="cyr">-ы</span> — in der Mehrzahl also <span class="cyr">-ие</span>.'
        : 'Harter Stamm, harte Endungen.');
    return '<p class="hint">' + (q.partner
      ? '<strong class="cyr">' + esc(q.partner.text) + '</strong> ist ' +
        (q.genus === 'p' ? 'Mehrzahl' : GENUS_NAME[q.genus]) + ' — darum ' +
        '<strong class="cyr">' + esc(q.loesung) + '</strong>. '
      : '') + warum + '</p>';
  }
  if (q.art === 'gen' || q.art === 'plural') {
    var letzt = v.ru.slice(-1);
    var neuLetzt = q.loesung.slice(v.ru.length - 1);
    return '<p class="hint">' + esc(v.ru) + ' ist ' + GESCHLECHT_NAME[g] + ' und endet auf ' +
      '<strong class="cyr">' + esc(letzt) + '</strong>' +
      (q.art === 'plural' && nachZischlaut(v.ru.replace(/[аяоеьйы]$/, ''))
        ? ' — und nach <span class="cyr">' + esc(v.ru.replace(/[аяоеьйы]$/, '').slice(-1)) +
          '</span> steht nie <span class="cyr">-ы</span>'
        : '') +
      ', darum <strong class="cyr">' + esc(q.loesung) + '</strong>' +
      (neuLetzt ? ' auf <strong class="cyr">' + esc(q.loesung.slice(-1)) + '</strong>' : '') +
      '.</p>';
  }
  var gleich = q.loesung === v.ru;
  void b;
  return '<p class="hint">' + esc(v.ru) + ' ist ' + GESCHLECHT_NAME[g] + ' — ' +
    (gleich ? 'und bleibt im Akkusativ unverändert.'
      : 'darum wird <strong class="cyr">' + esc(v.ru.slice(-1)) + '</strong> zu <strong class="cyr">' +
        esc(q.loesung.slice(-1)) + '</strong>.') + '</p>';
}

// Warum diese Präpositivform — in Worten. Auch sie braucht «Wissen» im Satz.
function gramNomenWarum(ru, art, form) {
  var eigen = NOMEN[ru] || null;
  if (eigen && eigen.starr) {
    return '<strong class="cyr">' + esc(ru) + '</strong> ist ein Lehnwort und ' +
      'ändert sich nie — in keinem Fall.';
  }
  if (eigen && eigen.praep) {
    if (/у$/.test(form)) {
      return 'Eine Handvoll männlicher Wörter nimmt nach в und на ein ' +
        '<strong class="cyr">-у</strong> statt <strong class="cyr">-е</strong>: ' +
        '<strong class="cyr">' + esc(ru) + ' → ' + esc(form) + '</strong>. Das muss man ' +
        'wissen, herleiten kann man es nicht.';
    }
    return '<strong class="cyr">' + esc(ru) + '</strong> verliert vor der Endung einen ' +
      'Laut: <strong class="cyr">' + esc(form) + '</strong>. Auch das gehört gewusst.';
  }
  if (form === ru) {
    return '<strong class="cyr">' + esc(ru) + '</strong> endet schon auf ' +
      '<strong class="cyr">-е</strong> — da bleibt nichts zu ändern.';
  }
  if (/(ия|ий|ие)$/.test(ru)) {
    return 'Wörter auf <strong class="cyr">-ия</strong>, <strong class="cyr">-ий</strong> ' +
      'und <strong class="cyr">-ие</strong> gehen auf <strong class="cyr">-ии</strong> ' +
      'statt auf -е: <strong class="cyr">' + esc(ru) + ' → ' + esc(form) + '</strong>.';
  }
  if (/ь$/.test(ru) && art === 'w') {
    return 'Weibliche Wörter auf <strong class="cyr">-ь</strong> nehmen ' +
      '<strong class="cyr">-и</strong>: <strong class="cyr">' + esc(ru) + ' → ' +
      esc(form) + '</strong>.';
  }
  var alt = /[аяоьй]$/.test(ru) ? ru.slice(-1) : '';
  return '<strong class="cyr">' + esc(ru) + '</strong> ist ' +
    GESCHLECHT_NAME[geschlecht(art)] + ' und folgt der Hauptregel: ' +
    (alt ? '<strong class="cyr">' + esc(alt) + '</strong> wird zu '
      : 'es kommt ein ') + '<strong class="cyr">-е</strong> → ' +
    '<strong class="cyr">' + esc(form) + '</strong>.';
}

// Stamm plus Endung, in Worten — und wo der Stamm sich wandelt, auch das.
// Dieselbe Erklärung braucht «Wissen» im Satz, darum steht sie hier für beide.
function gramVerbWarum(ru, person, form) {
  var stamm = verbStamm(ru);
  var klasse = verbKlasse(ru);
  if (!stamm || !form) {
    return '«' + esc(ru) + '» folgt keiner der beiden Reihen — diese Formen ' +
      'muss man einzeln kennen.';
  }
  var gewandelt = person === '1s' && klasse === 'i' ? stammIch(stamm) : stamm;
  var endung = form.indexOf(gewandelt) === 0 ? form.slice(gewandelt.length) : '';
  var text = '<strong class="cyr">' + esc(ru) + '</strong> hat den Stamm ' +
    '<strong class="cyr">' + esc(stamm) + '-</strong>';
  if (gewandelt !== stamm) {
    text += ', der in der Ich-Form zu <strong class="cyr">' + esc(gewandelt) +
      '-</strong> wird';
  }
  text += '. Dazu die Endung der ' + (klasse === 'i' ? 'i' : 'e') + '-Reihe für ' +
    esc(PERSON_NAME[person]) + ': <strong class="cyr">-' + esc(endung) +
    '</strong> → <strong class="cyr">' + esc(form) + '</strong>.';
  return text;
}

// Kopf über der Aufgabe: ein Punkt je Baustein, wie das Paket in «Lernsets».
function gramKopfHtml(b) {
  var html = '<p class="task-label">Regeln</p><div class="paket">' +
    '<div class="paket-punkte" aria-hidden="true">';
  GRAMMATIK.forEach(function (x) {
    html += '<span class="pp s' + gramBox(x) + '"></span>';
  });
  html += '</div><p class="paket-text">' + gramMeisterschaft() + ' von ' +
    GRAMMATIK.length + ' sitzen · gerade: ' + esc(b.name) + '</p></div>';
  return html;
}

function renderGrammatik() {
  var b = gramAktuell();
  if (!b) {
    var jetzt = Date.now();
    var ruhend = GRAMMATIK.filter(function (x) {
      return gramGemeistert(x) && !gramFaellig(x, jetzt);
    }).length;
    main.innerHTML = '<section><div class="leer">' + maskottchen('gross') +
      '<h3>Alle Regeln sitzen</h3><p>Alle ' + GRAMMATIK.length +
      ' Bausteine sind ' + BOX_MAX + '× richtig angewandt. ' + ruhend +
      ' ruhen bis zur nächsten Auffrischung.</p>' +
      '<p class="naechste">Wiederholen können Sie trotzdem jederzeit: ' +
      'Über die Auswahl oben lässt sich jeder Baustein einzeln vornehmen.</p>' +
      '</div></section>';
    return;
  }

  var html = '<section>';
  if (!gramEntdeckt(b)) html += gramEntdeckenHtml(b);
  else if (gramRegelNeu) html += gramKopfHtml(b) + gramRegelHtml(b, true);
  else html += gramUebenHtml(b);
  main.innerHTML = html + '</section>';

  main.querySelectorAll('[data-gramdeutung]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (gramPhase !== 'ask') return;
      gramPicked = parseInt(el.dataset.gramdeutung, 10);
      renderGrammatik();
    });
  });
  var ab = document.getElementById('gramDeutungAb');
  if (ab) ab.addEventListener('click', function () {
    if (gramPicked === null) return;
    gramCorrect = gramPicked === b.richtig;
    ton(gramCorrect);
    gramPhase = 'feedback';
    renderGrammatik();
  });
  var zurRegel = document.getElementById('gramZurRegel');
  if (zurRegel) zurRegel.addEventListener('click', function () {
    // Entdeckt ist entdeckt — die Stufe steigt erst beim Anwenden.
    state.gramSeen[b.id] = Date.now();
    save();
    gramRegelNeu = true;
    gramPhase = 'ask';
    gramPicked = null;
    renderGrammatik();
  });
  var zurUebung = document.getElementById('gramZurUebung');
  if (zurUebung) zurUebung.addEventListener('click', function () {
    gramRegelNeu = false;
    gramFrageBauen();
    renderGrammatik();
  });

  main.querySelectorAll('[data-gramopt]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (gramPhase !== 'ask') return;
      gramPicked = el.dataset.gramopt;
      if (state.settings.confirmUeben) renderGrammatik();
      else gramPruefen();
    });
  });
  var feld = document.getElementById('gramInput');
  enterGibtAb(feld, 'gramConfirm');
  if (feld) feld.addEventListener('input', function () {
    gramEingabe = feld.value;
    var k = document.getElementById('gramConfirm');
    if (k) k.disabled = !gramAbgabeBereit();
  });
  var kb = document.getElementById('gramKbToggle');
  if (kb) kb.addEventListener('click', function () { gramKb = !gramKb; renderGrammatik(); });
  main.querySelectorAll('[data-gramkey]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (gramPhase !== 'ask') return;
      var k = el.dataset.gramkey;
      gramEingabe = k === 'BS' ? gramEingabe.slice(0, -1) : gramEingabe + k;
      var f = document.getElementById('gramInput');
      if (f) f.value = gramEingabe;
      var c = document.getElementById('gramConfirm');
      if (c) c.disabled = !gramAbgabeBereit();
    });
  });
  var warum = document.getElementById('gramWarum');
  if (warum) warum.addEventListener('click', function () {
    // Nicht neu zeichnen: Die Karte liegt schon da, nur zugeklappt. Ein
    // Neuaufbau setzte sie fertig aufgeklappt ein — dann gibt es keinen
    // Übergang, den der Browser noch laufen lassen könnte.
    gramRegelOffen = !gramRegelOffen;
    var klapp = document.getElementById('gramRegelKlapp');
    if (klapp) {
      klapp.classList.toggle('auf', gramRegelOffen);
      klapp.setAttribute('aria-hidden', gramRegelOffen ? 'false' : 'true');
    }
    warum.setAttribute('aria-expanded', gramRegelOffen ? 'true' : 'false');
    // Die Karte steht unterhalb der Knöpfe und wäre sonst halb im Nichts.
    // Erst nach dem Aufklappen steht ihre Höhe fest, darum verzögert.
    if (gramRegelOffen && klapp) {
      setTimeout(function () {
        try { klapp.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
        catch (e) { klapp.scrollIntoView(false); }
      }, 380);
    }
  });
  var conf = document.getElementById('gramConfirm');
  if (conf) conf.addEventListener('click', function () {
    if (gramAbgabeBereit()) gramPruefen();
  });
  var next = document.getElementById('gramNext');
  if (next) next.addEventListener('click', function () {
    gramBaustein = null;    // gemeisterte Regel abgeben, sonst dieselbe weiter
    gramFrageBauen();
    renderGrammatik();
  });
}

// ── POWER-TRAINING ──────────────────────────────────────────
// Wer ein Wort dreimal hintereinander verschreibt, verliert es (ADR 0033) —
// und findet es danach irgendwann im großen Stapel wieder. Das ist richtig,
// aber langsam. Hier kommen genau diese Wörter noch einmal geballt: **drei
// Stück, jedes fünfmal**, mit steigender Schwierigkeit.
//
// Warum drei und nicht alle: Ein Stapel aus zwölf gefallenen Wörtern ist
// dasselbe wie der große Stapel, nur kürzer. Drei Wörter fünfmal hintereinander
// sind eine Einheit, die man zu Ende bringt — und genau darum wirkt sie.
var PT_MINDEST = 3;      // ab so vielen gefallenen Wörtern öffnet die Übung
var PT_WOERTER = 3;      // so viele kommen in eine Runde
var PT_RUNDEN = 5;       // so oft muss jedes richtig sein

// Ansichtszustand — gehört nach ADR 0017 in ansichtenZuruecksetzen().
var ptSatz = null;       // die laufende Runde: [{ v, treffer }]
var ptQ = null;          // die laufende Frage
var ptPhase = 'ask';     // 'ask' · 'feedback' · 'fertig'
var ptEingabe = '';
var ptBuilt = [];
var ptKb = null;

// Der Vorrat: gefallene Wörter, die noch unter der Satzschwelle stehen. Wer
// wieder oben ist, hat es geschafft und fliegt aus der Liste — das Aufräumen
// geschieht hier, damit es nicht an einer Schreibstelle vergessen wird.
function ptPool() {
  var aus = [];
  Object.keys(state.patzer).forEach(function (id) {
    var v = VOKABEL[id];
    if (!v) { delete state.patzer[id]; return; }
    if ((state.boxes[id] || 0) >= SATZ_STUFE) { delete state.patzer[id]; return; }
    aus.push(v);
  });
  // Das zuletzt Gefallene zuerst: Es sitzt am wenigsten.
  aus.sort(function (a, b) { return (state.patzer[b.id] || 0) - (state.patzer[a.id] || 0); });
  return aus;
}

function ptOffen() {
  return ptPool().length >= PT_MINDEST;
}

// Eine Runde aufsetzen: die drei zuletzt gefallenen Wörter, jedes mit einem
// eigenen Zähler.
function ptRundeStarten() {
  ptSatz = ptPool().slice(0, PT_WOERTER).map(function (v) {
    return { v: v, treffer: 0 };
  });
  ptPhase = 'ask';
  ptQ = null;
  ptFrageBauen();
}

// Welches Wort ist dran? Das mit den wenigsten Treffern, aber nie zweimal
// hintereinander dasselbe, solange es eine Alternative gibt.
function ptNaechstes() {
  var offen = ptSatz.filter(function (e) { return e.treffer < PT_RUNDEN; });
  if (!offen.length) return null;
  var wenigste = offen.slice().sort(function (a, b) { return a.treffer - b.treffer; });
  if (ptQ && wenigste.length > 1 && wenigste[0].v.id === ptQ.wort.id) {
    return wenigste[1];
  }
  return wenigste[0];
}

// Die Schwierigkeit steigt mit dem Zähler — dieselbe Leiter wie überall, nur
// im Zeitraffer: erst zusammensetzen, dann schreiben mit Umschrift, dann ohne.
function ptStufe(treffer) {
  if (treffer < 2) return 'kacheln';
  if (treffer < 4) return 'tippen-hilfe';
  return 'tippen';
}

function ptFrageBauen() {
  var eintrag = ptNaechstes();
  ptPhase = 'ask';
  ptEingabe = '';
  ptBuilt = [];
  meisterMeldung = null;
  if (!eintrag) { ptQ = null; ptPhase = 'fertig'; return; }
  var stufe = ptStufe(eintrag.treffer);
  var q = { wort: eintrag.v, eintrag: eintrag, stufe: stufe };
  if (stufe === 'kacheln') {
    // Die Buchstaben des Wortes, gemischt — plus ein paar fremde, damit es
    // kein Abzählen wird.
    var zeichen = eintrag.v.ru.split('');
    var stoerer = ptStoerer(eintrag.v.ru, Math.min(3, Math.max(1, 8 - zeichen.length)));
    q.tiles = shuffle(zeichen.concat(stoerer)).map(function (ch, i) {
      return { key: i, ch: ch };
    });
    q.laenge = zeichen.length;
  }
  ptQ = q;
}

// Fremde Buchstaben aus dem Alphabet, die im Wort nicht vorkommen.
function ptStoerer(wort, wieviele) {
  var drin = {};
  wort.split('').forEach(function (c) { drin[c] = true; });
  var frei = ALPHABET.map(function (b) { return b[1]; }).filter(function (c) { return !drin[c]; });
  return shuffle(frei).slice(0, wieviele);
}

function ptAbgabeBereit() {
  if (!ptQ) return false;
  if (ptQ.stufe === 'kacheln') return ptBuilt.length === ptQ.laenge;
  return normalize(ptEingabe) !== '';
}

function ptPruefen() {
  var q = ptQ;
  var versuch = q.stufe === 'kacheln'
    ? ptBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('')
    : ptEingabe;
  var richtig = normalize(versuch) === normalize(q.wort.ru);
  ptCorrect = richtig;
  // Gewertet wird auch hier im Leitner-System: Wer das Wort hier zurückholt,
  // holt es wirklich zurück — sonst wäre das Power-Training ein Spielplatz
  // ohne Folgen.
  var vorher = state.boxes[q.wort.id] || 0;
  updateBox(q.wort.id, richtig);
  meisterMeldung = null;
  meisterPruefen(vorher, state.boxes[q.wort.id], 'Wort', q.wort.ru + ' — ' + q.wort.de,
    woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
  meisterTon(richtig);
  if (richtig) q.eintrag.treffer++;
  else q.eintrag.treffer = Math.max(0, q.eintrag.treffer - 1);
  zuletztGeuebt('power');
  // Der Topf war eben noch voll und ist es nicht mehr — nur dann.
  if (vorher < SATZ_STUFE && state.boxes[q.wort.id] >= SATZ_STUFE &&
    ptPool().length === 0) jubelZeigen('power');
  save();
  ptPhase = 'feedback';
  renderPower();
}

var ptCorrect = null;

function ptKopfHtml() {
  var html = '<p class="task-label">Power-Training</p><div class="paket">' +
    '<div class="paket-punkte" aria-hidden="true">';
  ptSatz.forEach(function (e) {
    for (var i = 0; i < PT_RUNDEN; i++) {
      html += '<span class="pp' + (i < e.treffer ? ' s4' : ' s0') + '"></span>';
    }
  });
  var gesamt = ptSatz.reduce(function (n, e) { return n + e.treffer; }, 0);
  html += '</div><p class="paket-text">' + gesamt + ' von ' +
    (ptSatz.length * PT_RUNDEN) + ' · ' + ptSatz.length +
    (ptSatz.length === 1 ? ' Wort zurückholen' : ' Wörter zurückholen') + '</p></div>';
  return html;
}

function renderPower() {
  if (!ptOffen() && !ptSatz) { renderPowerLeer(); return; }
  if (!ptSatz) ptRundeStarten();
  if (ptPhase === 'fertig') { renderPowerFertig(); return; }
  if (!ptQ) ptFrageBauen();
  if (!ptQ) { renderPowerFertig(); return; }

  var q = ptQ;
  var html = '<section>' + ptKopfHtml() +
    '<p class="kachel-ort">' + esc(q.wort.theme) + '</p><div class="card">' +
    '<div class="card-meta"><span>' + (q.eintrag.treffer + 1) + ' von ' + PT_RUNDEN + '</span>' +
    '<span class="mitte">' + (q.stufe === 'kacheln' ? 'legen' : 'selbst schreiben') + '</span>' +
    '<span></span></div>' +
    '<p class="task-label">' + (q.stufe === 'kacheln'
      ? 'Setzen Sie das Wort zusammen'
      : 'Schreiben Sie es auf Russisch') + '</p>' +
    '<p class="word">' + esc(q.wort.de) + hoerknopf(q.wort.de, 'de') + '</p>';

  if (q.stufe === 'tippen-hilfe' && ptPhase === 'ask') {
    html += '<p class="translit">[' + esc(q.wort.tr) + ']</p>';
  }

  if (q.stufe === 'kacheln') {
    html += '<div class="slots">';
    for (var i = 0; i < q.laenge; i++) {
      var gefuellt = i < ptBuilt.length;
      var ch = gefuellt ? q.tiles.filter(function (t) { return t.key === ptBuilt[i]; })[0].ch : '';
      html += '<span class="slot' + (gefuellt ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (ptPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var benutzt = ptBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (benutzt ? ' used' : '') + '" data-pttile="' + t.key + '"' +
          (benutzt ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="ptUndo" aria-label="Letztes Zeichen entfernen">' +
        ICON.ruecktaste + '</button></div>';
    }
  } else {
    html += ptPhase === 'feedback'
      ? pruefzeileHtml(ptEingabe, q.wort.ru, true, 'form')
      : '<textarea id="ptInput" rows="1" class="fliess cyr"' +
        ' lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
        ' enterkeyhint="go" placeholder="кириллица …">' + esc(ptEingabe) + '</textarea>';
  }

  if (ptPhase === 'feedback') {
    html += '<div class="feedback ' + (ptCorrect ? 'good' : 'bad') + '"><p>' +
      (ptCorrect ? ICON.haken + 'Правильно — richtig!'
        : ICON.kreuz + 'Richtig wäre <strong class="cyr">' + esc(q.wort.ru) + '</strong>') +
      '</p></div>' + hoerzeile(q.wort.ru, q.wort.de) + meisterHtml();
  }

  html += '</div><div class="btn-row">';
  if (ptPhase === 'ask') {
    html += '<button class="btn primary" id="ptConfirm"' + (ptAbgabeBereit() ? '' : ' disabled') +
      '>Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="ptNext">Weiter →</button>';
  }
  html += '</div>';

  if (q.stufe !== 'kacheln' && ptPhase === 'ask') {
    if (ptKb === null) ptKb = tastaturVorgabe(true);
    html += '<button class="kb-toggle" id="ptKbToggle">' +
      (ptKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
    if (ptKb) html += tastaturHtml('ptkey');
  }
  html += '<p class="session-info">' + ptPool().length + ' gefallene Wörter insgesamt</p></section>';
  main.innerHTML = html;
  ptBinden();
}

function ptBinden() {
  main.querySelectorAll('[data-pttile]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (ptPhase !== 'ask') return;
      var key = parseInt(b.dataset.pttile, 10);
      if (ptBuilt.indexOf(key) !== -1 || ptBuilt.length >= ptQ.laenge) return;
      ptBuilt.push(key);
      if (ptBuilt.length === ptQ.laenge) ptPruefen();
      else renderPower();
    });
  });
  var undo = document.getElementById('ptUndo');
  if (undo) undo.addEventListener('click', function () { ptBuilt.pop(); renderPower(); });

  var feld = document.getElementById('ptInput');
  enterGibtAb(feld, 'ptConfirm');
  if (feld) {
    feld.addEventListener('input', function () {
      ptEingabe = feld.value;
      var knopf = document.getElementById('ptConfirm');
      if (knopf) knopf.disabled = !ptAbgabeBereit();
    });
  }
  main.querySelectorAll('[data-ptkey]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.ptkey;
      ptEingabe = k === 'BS' ? ptEingabe.slice(0, -1) : ptEingabe + k;
      var f = document.getElementById('ptInput');
      if (f) f.value = ptEingabe;
      var knopf = document.getElementById('ptConfirm');
      if (knopf) knopf.disabled = !ptAbgabeBereit();
    });
  });
  var kbToggle = document.getElementById('ptKbToggle');
  if (kbToggle) kbToggle.addEventListener('click', function () { ptKb = !ptKb; renderPower(); });

  var confirm = document.getElementById('ptConfirm');
  if (confirm) confirm.addEventListener('click', function () {
    if (ptAbgabeBereit()) ptPruefen();
  });
  var next = document.getElementById('ptNext');
  if (next) next.addEventListener('click', function () { ptFrageBauen(); renderPower(); });
  var neu = document.getElementById('ptNeu');
  if (neu) neu.addEventListener('click', function () { ptSatz = null; renderPower(); });
  var heim = document.getElementById('ptHeim');
  if (heim) heim.addEventListener('click', function () { setTab('home'); });
}

// Zwei Leerzustände, die sich sehr verschieden anfühlen: noch nichts gefallen
// (schön) und zu wenig für eine Runde (bald).
function renderPowerLeer() {
  var da = ptPool().length;
  main.innerHTML = '<section><div class="leer">' + maskottchen('gross') +
    (da === 0
      ? '<h3>Nichts gefallen</h3><p>Hier sammeln sich die Wörter, die Sie in ' +
        '«Übersetzen» dreimal hintereinander verschrieben haben. Bisher ist ' +
        'keines dabei — das ist die beste Nachricht, die diese Seite zu bieten hat.</p>'
      : '<h3>Noch zu wenige</h3><p>' + da + ' von ' + PT_MINDEST +
        ' Wörtern sind gefallen. Ab ' + PT_MINDEST + ' lohnt sich eine Runde; ' +
        'für weniger genügt der gewöhnliche Weg über «Lernsets».</p>') +
    '<div class="btn-row"><button class="btn primary" id="ptHeim">Zur Übersicht</button></div>' +
    '</div></section>';
  ptBinden();
}

function renderPowerFertig() {
  var geschafft = ptSatz || [];
  var raus = geschafft.filter(function (e) {
    return (state.boxes[e.v.id] || 0) >= SATZ_STUFE;
  });
  var html = '<section><div class="leer">' + maskottchen('gross') +
    '<h3>Runde geschafft</h3>' +
    '<p>' + geschafft.length + (geschafft.length === 1 ? ' Wort' : ' Wörter') +
    ' je ' + PT_RUNDEN + '× richtig geschrieben.</p>' +
    '<div class="pt-liste">';
  geschafft.forEach(function (e) {
    var frei = (state.boxes[e.v.id] || 0) >= SATZ_STUFE;
    html += '<div class="pt-zeile"><span class="cyr">' + esc(e.v.ru) + '</span>' +
      '<span class="pt-de">' + esc(e.v.de) + '</span>' +
      '<span class="pt-stand' + (frei ? ' frei' : '') + '">' +
      (frei ? 'wieder frei' : 'Stufe ' + (state.boxes[e.v.id] || 0)) + '</span></div>';
  });
  html += '</div>';
  if (raus.length) {
    html += '<p class="naechste">' + raus.length +
      (raus.length === 1 ? ' Wort steht' : ' Wörter stehen') +
      ' wieder auf Satzstufe — die zugehörigen Sätze sind damit offen.</p>';
  }
  html += '<div class="btn-row">';
  if (ptOffen()) html += '<button class="btn ghost" id="ptNeu">Noch eine Runde</button>';
  html += '<button class="btn primary" id="ptHeim">Zur Übersicht</button></div></div></section>';
  main.innerHTML = html;

// ── TIPPEN ──────────────────────────────────────────────────
// Getippt wird, was beim Vokabeltraining angefangen hat zu sitzen — ab
// settings.tippenStufe. Wer ein Wort richtig tippt, macht damit die letzte
// Stufe voll; danach ist es **aus dem Pool**. Nach der Auffrischfrist kommt es
// einmal zur Sicherheit wieder — richtig getippt, und es ist wieder draußen.
var tWord = null, tResult = null, tHint = false, tKb = null;
// Der getippte Text. Er stand bisher nur im Feld und wurde nach jedem
// Renderlauf von Hand zurückgeschrieben — mit der Prüfzeile gibt es das Feld
// in der Auflösung aber nicht mehr.
var tEingabe = '';
var tippenModus = 'lernen';   // 'lernen' · 'wiederholung'

// Offen: begonnen, aber noch nicht fertig. Ohne Fälligkeitsfilter — wer üben
// will, soll üben dürfen, nicht auf den nächsten Tag warten.
function tippenLernen() {
  var schwelle = state.settings.tippenStufe;
  return ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b >= schwelle && b < BOX_MAX;
  });
}
// Fertig und die Frist ist um: einmal zur Sicherheit.
function tippenWiederholung() {
  var jetzt = Date.now();
  return ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && faellig(v, jetzt);
  });
}
function tippenPool() {
  return tippenModus === 'wiederholung' ? tippenWiederholung() : tippenLernen();
}
// Fertig, aber noch nicht fällig — das sind die, die gerade ruhen.
function tippenRuhend() {
  var jetzt = Date.now();
  return ALL_VOCAB.filter(function (v) {
    return (state.boxes[v.id] || 0) >= BOX_MAX && !faellig(v, jetzt);
  });
}
// Wann wird das nächste ruhende Wort wieder fällig?
function naechsteAuffrischung() {
  var jetzt = Date.now();
  var frist = intervallFuer(BOX_MAX);
  var beste = null;
  tippenRuhend().forEach(function (v) {
    var wann = (state.lastSeen[v.id] || 0) + frist;
    if (beste === null || wann < beste) beste = wann;
  });
  if (beste === null) return '';
  var tage = Math.max(1, Math.ceil((beste - jetzt) / TAG));
  return tage === 1 ? 'morgen' : 'in ' + tage + ' Tagen';
}

// Leerzustand: drei Fälle, die sich sehr verschieden anfühlen — noch nichts
// freigeschaltet, alles getippt, oder gerade nichts fällig.
function renderTippenLeer() {
  var schwelle = state.settings.tippenStufe;
  var ruhend = tippenRuhend().length;
  var offen = tippenLernen().length;
  var frisch = tippenWiederholung().length;
  var fast = ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b > 0 && b < schwelle;
  }).sort(function (a, b) { return (state.boxes[b.id] || 0) - (state.boxes[a.id] || 0); });

  var html = '<section><div class="leer">' + maskottchen('gross');

  if (tippenModus === 'wiederholung') {
    html += '<h3>' + (ruhend ? 'Gerade nichts fällig' : 'Noch nichts zum Auffrischen') + '</h3>' +
      '<p>' + (ruhend
        ? ruhend + (ruhend === 1 ? ' Wort sitzt' : ' Wörter sitzen') + ' und ruhen. Das nächste kommt ' +
          esc(naechsteAuffrischung()) + ' zur Sicherheit noch einmal.'
        : 'Hier erscheinen Wörter, die Sie fertig gelernt haben — nach ' +
          (state.settings.auffrischen || 21) + ' Tagen einmal zur Sicherheit.') + '</p>';
    if (offen) {
      html += '<div class="btn-row"><button class="btn primary" id="tZuLernen">' +
        offen + (offen === 1 ? ' Wort offen' : ' Wörter offen') + '</button></div>';
    }
  } else if (ruhend || frisch) {
    html += '<h3>Alles getippt</h3>' +
      '<p>Auf der Lernstufe wartet kein Wort mehr. ' +
      (ruhend ? ruhend + (ruhend === 1 ? ' Wort sitzt und ruht. ' : ' Wörter sitzen und ruhen. ') : '') +
      (frisch
        ? frisch + (frisch === 1 ? ' ist' : ' sind') + ' zum Auffrischen bereit.'
        : 'Die nächste Auffrischung kommt ' + esc(naechsteAuffrischung()) + '.') +
      '</p>';
    html += '<div class="btn-row">' +
      (frisch ? '<button class="btn primary" id="tZuFrisch">Wiederholen</button>' : '') +
      '<button class="btn ghost" id="tZuUeben">Neue Wörter lernen</button></div>';
  } else {
    html += '<h3>Noch kein Wort freigeschaltet</h3>' +
      '<p>Hier tippen Sie nur Wörter, die in «Lernsets» oder «Freestyle» angefangen haben zu sitzen — ' +
      'ab Stufe ' + schwelle + ' von ' + BOX_MAX + ', also ' + schwelle +
      '× nacheinander richtig beantwortet.</p>';
    if (fast.length) {
      html += '<p class="naechste">Am nächsten dran: ' + fast.slice(0, 3).map(function (v) {
        return '<span class="cyr">' + esc(v.ru) + '</span> (Stufe ' + (state.boxes[v.id] || 0) + ')';
      }).join(' · ') + '</p>';
    } else {
      html += '<p class="naechste">Noch kein Wort begonnen — fangen Sie mit dem ersten Lernset an.</p>';
    }
    html += '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Lernsets»</button></div>';
  }

  html += '</div><p class="session-info">Schwelle und Auffrischfrist stehen in den Einstellungen.</p></section>';
  main.innerHTML = html;

  var zu = document.getElementById('tZuUeben');
  if (zu) zu.addEventListener('click', function () { setTab('lernsets'); });
  var frischBtn = document.getElementById('tZuFrisch');
  if (frischBtn) frischBtn.addEventListener('click', function () {
    tippenModus = 'wiederholung';
    tWord = null;
    renderTippen();
  });
  var lernBtn = document.getElementById('tZuLernen');
  if (lernBtn) lernBtn.addEventListener('click', function () {
    tippenModus = 'lernen';
    tWord = null;
    renderTippen();
  });
}

function renderTippen() {
  if (tKb === null) tKb = tastaturVorgabe(true);
  // Ist der gewählte Stapel leer und der andere nicht, dorthin wechseln —
  // sonst stünde man vor einem Leerzustand, obwohl es etwas zu tun gibt.
  if (!tResult && !tippenPool().length) {
    var anderer = tippenModus === 'lernen' ? 'wiederholung' : 'lernen';
    tippenModus = anderer;
    if (!tippenPool().length) tippenModus = 'lernen';
  }
  var pool = tippenPool();
  // Während der Rückmeldung bleibt das Wort stehen, auch wenn es nach einem
  // Fehler unter die Schwelle gerutscht ist — sonst verschwände die Auflösung.
  if (!tResult && (!tWord || pool.indexOf(tWord) === -1)) tWord = waehleWort(pool);
  if (!tWord) { renderTippenLeer(); return; }
  var w = tWord;
  var stats = state.typingStats;
  var total = stats.correct + stats.wrong;

  var html = '<section><div class="card">' +
    '<p class="task-label">' + (tippenModus === 'wiederholung'
      ? 'Zur Sicherheit noch einmal' : 'Schreiben Sie auf Russisch') + '</p>' +
    '<p class="word">' + esc(w.de) + hoerknopf(w.de, 'de') + '</p>' +
    (tHint ? '<p class="translit">[' + esc(w.tr) + ']</p>' : '') +
    (tResult
      ? pruefzeileHtml(tEingabe, w.ru, true, 'wort')
      : '<input type="text" id="tInput" class="cyr" value="' + esc(tEingabe) + '"' +
        ' placeholder="кириллица \u2026" lang="ru" autocapitalize="off"' +
        ' autocorrect="off" spellcheck="false" enterkeyhint="go">');

  if (tResult === 'wrong') html += '<p class="feedback bad">' + ICON.kreuz + 'Richtig: <strong class="cyr">' + esc(w.ru) + '</strong></p>';
  if (tResult === 'right') html += '<p class="feedback good">' + ICON.haken + 'Правильно — richtig!</p>';
  // Erst nach der Abgabe zu hören: vorher wäre die Aussprache die halbe Antwort.
  if (tResult) html += hoerzeile(w.ru, w.de) + meisterHtml();
  html += '</div><div class="btn-row">';
  if (!tResult) {
    html += '<button class="btn ghost" id="tHintBtn">Hinweis</button>' +
      '<button class="btn primary" id="tCheck">Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="tNext">Nächstes Wort \u2192</button>';
  }
  html += '</div>';
  html += '<button class="kb-toggle" id="tKbToggle">' + (tKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
  // Dieselbe Tastatur wie in den anderen drei Übungen — sie stand hier
  // gleichlautend ein zweites Mal, und ein Layout an zwei Stellen ist eines zu viel.
  if (tKb) html += tastaturHtml('key');
  html += '<p class="session-info">' + pool.length +
    (tippenModus === 'wiederholung' ? ' zum Auffrischen' : ' offen') + ' · ' +
    stats.correct + ' richtig · ' + stats.wrong + ' falsch' +
    (total > 0 ? ' · Quote ' + Math.round(stats.correct / total * 100) + ' %' : '') + '</p></section>';

  main.innerHTML = html;

  // In der Auflösung steht hier kein Feld mehr, sondern die Prüfzeile.
  var input = document.getElementById('tInput');

  function check() {
    if (tResult) return;
    var ok = normalize(tEingabe) === normalize(w.ru);
    tResult = ok ? 'right' : 'wrong';
    var vorher = state.boxes[w.id] || 0;
    updateBox(w.id, ok);
    meisterMeldung = null;
    meisterPruefen(vorher, state.boxes[w.id], 'Wort', w.ru + ' — ' + w.de,
      woerterGemeistert() + ' von ' + ALL_VOCAB.length + ' Wörtern');
    meisterTon(ok);
    state.typingStats.correct += ok ? 1 : 0;
    state.typingStats.wrong += ok ? 0 : 1;
    zuletztGeuebt('tippen');
    save();
    renderTippen();
  }
  function next() {
    tResult = null;
    tHint = false;
    tEingabe = '';
    meisterMeldung = null;
    tWord = waehleWort(tippenPool());
    renderTippen();
  }

  enterGibtAb(input, 'tCheck');
  if (input) {
    input.addEventListener('input', function () { tEingabe = input.value; });
  }
  var hintBtn = document.getElementById('tHintBtn');
  if (hintBtn) hintBtn.addEventListener('click', function () {
    tHint = true;
    renderTippen();
  });
  var checkBtn = document.getElementById('tCheck');
  if (checkBtn) checkBtn.addEventListener('click', check);
  var nextBtn = document.getElementById('tNext');
  if (nextBtn) nextBtn.addEventListener('click', next);
  document.getElementById('tKbToggle').addEventListener('click', function () {
    tKb = !tKb;
    renderTippen();
  });
  main.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (tResult) return;
      var k = b.dataset.key;
      tEingabe = k === 'BS' ? tEingabe.slice(0, -1) : tEingabe + k;
      var inp = document.getElementById('tInput');
      if (inp) inp.value = tEingabe;
    });
  });
}

// ── EINSTELLUNGEN ───────────────────────────────────────────
function renderEinstellungen() {
  var s = state.settings;

  function schalter(key, titel, hinweis, gesperrt) {
    var an = s[key];
    return '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<button class="switch' + (an ? ' on' : '') + '" role="switch" aria-checked="' + (an ? 'true' : 'false') +
      '" aria-label="' + esc(titel) + '" data-set="' + key + '"' + (gesperrt ? ' disabled' : '') +
      '><span class="knob"></span></button></div>';
  }

  // Auswahl aus mehreren Werten (Leitner-Stufe) als Chip-Reihe.
  function wahl(key, titel, hinweis, werte) {
    var html = '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahl="' + key +
        '" data-wert="' + w.wert + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

  function wahlText(key, titel, hinweis, werte) {
    // Ab vier Knöpfen bliebe für den Hinweis eine Schlucht von wenigen Wörtern
    // Breite — dann rückt die Wahl unter den Text.
    var html = '<div class="setting' + (werte.length > 3 ? ' breit' : '') +
      '"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahltext="' + key +
        '" data-wert="' + esc(w.wert) + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

var faktenFilter = 'gesehen'; // 'gesehen' · 'favoriten' · 'alle'

function renderFakten() {
  var gesehen = FACTS.filter(function (f) { return faktStand(f).n > 0; });
  var favoriten = FACTS.filter(function (f) { return faktStand(f).f; });
  var liste = faktenFilter === 'alle' ? FACTS
    : faktenFilter === 'favoriten' ? favoriten
    : gesehen;
  if (faktenFilter === 'gesehen') {
    // am häufigsten Gezeigtes zuerst — das sind die, die man wirklich kennt
    liste = liste.slice().sort(function (a, b) { return faktStand(b).n - faktStand(a).n; });
  }

  var html = '<section><div class="controls">' +
    [['gesehen', 'Gesehen ' + gesehen.length], ['favoriten', 'Favoriten ' + favoriten.length],
      ['alle', 'Alle ' + FACTS.length]].map(function (w) {
      return '<button class="chip' + (faktenFilter === w[0] ? ' active' : '') +
        '" data-filter="' + w[0] + '">' + esc(w[1]) + '</button>';
    }).join('') + '</div>';

  if (!liste.length) {
    html += '<div class="leer">' + maskottchen('gross') + '<h3>' +
      (faktenFilter === 'favoriten' ? 'Noch keine Favoriten' : 'Noch keinen Fakt gesehen') + '</h3>' +
      '<p>' + (faktenFilter === 'favoriten'
        ? 'Tippen Sie auf den Stern, wenn Ihnen einer gefällt — hier finden Sie ihn wieder.'
        : 'Nach je fünf Antworten erscheint ein Sprachfakt. Sie sammeln sich hier an.') +
      '</p></div>';
  } else {
    html += '<div class="faktenliste">';
    liste.forEach(function (f, i) {
      var stand = faktStand(f);
      html += '<div class="faktzeile' + (stand.n === 0 ? ' neu' : '') + '">' +
        '<span class="fakttext">' + esc(f) +
        '<span class="faktzahl">' + (stand.n === 0 ? 'noch nicht gezeigt'
          : stand.n === 1 ? 'einmal gezeigt' : stand.n + '× gezeigt') + '</span></span>' +
        '<button class="sternbtn' + (stand.f ? ' an' : '') + '" data-fav="' + i +
        '" aria-pressed="' + (stand.f ? 'true' : 'false') + '" aria-label="Als Favorit merken">' +
        (stand.f ? ICON.sternVoll : ICON.stern) + '</button></div>';
    });
    html += '</div>';
  }

  html += '<div class="btn-row"><button class="btn ghost" id="faktenBack">Zurück</button></div></section>';
  main.innerHTML = html;

  main.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () { faktenFilter = b.dataset.filter; renderFakten(); });
  });
  main.querySelectorAll('[data-fav]').forEach(function (b) {
    b.addEventListener('click', function () {
      faktFavorit(liste[parseInt(b.dataset.fav, 10)]);
      renderFakten();
    });
  });
  document.getElementById('faktenBack').addEventListener('click', zurueckGehen);
}

// ── Melden ──────────────────────────────────────────────────
// Ein Ticket schreibt man dort, wo einem etwas auffällt — nicht erst nach dem
// Weg über das Menü. Der Knopf schwebt darum über jeder Ansicht, und das Blatt
// deckt nur den unteren Teil ab, damit man weiter sieht, worum es geht.
var meldeOffen = false;
var meldeArt = 'bug';
var meldeBezugAn = true;
// Die Kennung des Tickets, das gerade bearbeitet wird — sonst null.
var meldeBearbeitet = null;
var meldeBezugName = '';   // beim Bearbeiten der schon vergebene Bezug

function meldeBezugQuelle() {
  // Die Ansicht, über der man steht — die ist gemeint, nicht «Tickets».
  return currentTab === 'tickets' ? letzterTab : currentTab;
}

function meldeArtHtml() {
  return [['bug', 'Fehler'], ['feature', 'Wunsch']].map(function (a) {
    return '<button class="chip' + (meldeArt === a[0] ? ' active' : '') +
      '" data-melde-art="' + a[0] + '">' + a[1] + '</button>';
  }).join('');
}

function meldeFuellen() {
  document.getElementById('meldeArt').innerHTML = meldeArtHtml();
  document.querySelectorAll('[data-melde-art]').forEach(function (b) {
    b.addEventListener('click', function () {
      meldeArt = b.dataset.meldeArt;
      document.getElementById('meldeText').placeholder = meldeArt === 'bug'
        ? 'Was ist passiert, was hatten Sie erwartet?'
        : 'Was soll die App können?';
      meldeFuellen();
    });
  });
  document.getElementById('meldeBezugName').textContent = meldeBearbeitet
    ? (meldeBezugName || ansichtName(meldeBezugQuelle()))
    : ansichtName(meldeBezugQuelle());
  document.getElementById('meldeBezug').checked = meldeBezugAn;
  document.getElementById('meldeSichern').textContent = meldeBearbeitet ? 'Ändern' : 'Sichern';
  document.getElementById('meldeAbbruch').textContent = meldeBearbeitet ? 'Verwerfen' : 'Abbrechen';
  // In der Liste selbst führt der Weg nirgendwohin — und beim Bearbeiten käme
  // man aus der Liste, in der man ohnehin schon steht.
  document.getElementById('meldeAlle').hidden = currentTab === 'tickets';
}

// Ein vorhandenes Ticket zum Bearbeiten ins Blatt holen.
function meldeBearbeiten(id) {
  var t = tickets.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  meldeBearbeitet = id;
  meldeArt = t.art;
  meldeBezugAn = !!t.reiter;
  meldeBezugName = t.reiter;
  document.getElementById('meldeTitel').value = t.titel;
  document.getElementById('meldeText').value = t.text;
  meldeSetzen(true);
}

// Ist ein angefangenes Ticket im Blatt? Dann bleibt es dort liegen, auch wenn
// das Blatt zugeht — verworfen wird nur ausdrücklich.
function meldeEntwurfDa() {
  var t = document.getElementById('meldeTitel');
  var x = document.getElementById('meldeText');
  return !!((t && t.value.replace(/^\s+|\s+$/g, '')) || (x && x.value.replace(/^\s+|\s+$/g, '')));
}

function meldeKnopfZeigen() {
  var knopf = document.getElementById('meldeKnopf');
  var entwurf = meldeEntwurfDa();
  knopf.classList.toggle('hat-entwurf', entwurf);
  knopf.setAttribute('aria-label', entwurf
    ? (meldeBearbeitet ? 'Ticket weiter bearbeiten' : 'Angefangenes Ticket weiterschreiben')
    : 'Rückmeldung geben');
}

function meldeSetzen(auf) {
  meldeOffen = auf;
  document.body.classList.toggle('melden-offen', auf);
  var blatt = document.getElementById('meldeBlatt');
  blatt.setAttribute('aria-hidden', auf ? 'false' : 'true');
  document.getElementById('meldeKnopf').setAttribute('aria-expanded', auf ? 'true' : 'false');
  var hof = document.getElementById('meldeHof');
  if (auf) {
    hof.hidden = false;
    meldeFuellen();
  } else {
    blatt.style.transform = '';
    // Der Hof verschwindet erst, wenn er ausgeblendet ist — sonst blitzt er weg.
    setTimeout(function () { if (!meldeOffen) hof.hidden = true; }, 300);
  }
  document.querySelectorAll('#meldeBlatt button, #meldeBlatt input, #meldeBlatt textarea')
    .forEach(function (el) { el.tabIndex = auf ? 0 : -1; });
  meldeKnopfZeigen();
}

function meldeLeeren() {
  document.getElementById('meldeTitel').value = '';
  document.getElementById('meldeText').value = '';
  meldeArt = 'bug';
  meldeBezugAn = true;
  meldeBearbeitet = null;
  meldeBezugName = '';
  meldeKnopfZeigen();
}

// Das Blatt folgt dem Finger — aber nur nach unten, dorthin, wo es ohnehin
// verschwindet. Weit genug gezogen, geht es zu; der Entwurf bleibt dabei
// stehen. Weggeworfen wird ein Ticket ausschließlich über «Verwerfen».
var MELDE_SCHWELLE = 90;   // ab hier gilt das Ziehen als «zu»
function meldeZiehenBinden() {
  var blatt = document.getElementById('meldeBlatt');
  var start = null, weg = 0;

  function daempfen(d) {
    // Je weiter, desto zäher: die Wurzel wächst langsamer als der Weg.
    return Math.pow(d, 0.72) * 1.6;
  }
  function los(e) {
    if (!meldeOffen) return;
    var z = e.target;
    // Auf Eingabefeldern hat das Ziehen nichts zu suchen.
    if (z.closest('input, textarea, button')) return;
    start = { y: e.clientY };
    weg = 0;
    blatt.classList.add('zieht');
    try { blatt.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function bewegt(e) {
    if (!start) return;
    // Nach oben gibt das Blatt nicht nach: dort ist kein Weg hin.
    weg = Math.max(0, e.clientY - start.y);
    blatt.style.transform = 'translateY(' + daempfen(weg).toFixed(1) + 'px)';
  }
  function fertig() {
    if (!start) return;
    start = null;
    blatt.classList.remove('zieht');
    blatt.style.transform = '';   // der Übergang federt zurück
    if (weg >= MELDE_SCHWELLE) meldeSetzen(false);
    weg = 0;
  }

  blatt.addEventListener('pointerdown', los);
  blatt.addEventListener('pointermove', bewegt);
  blatt.addEventListener('pointerup', fertig);
  blatt.addEventListener('pointercancel', fertig);
  // Danebentippen schließt genauso — der Entwurf bleibt auch dann liegen.
  document.getElementById('meldeHof').addEventListener('click', function () {
    meldeSetzen(false);
  });
}
