<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>Russisch · Тренажёр</title>
<style>
:root {
  --bg: #101418;
  --card: #171C23;
  --card-2: #1D232C;
  --line: #262E39;
  --text: #E7E4DD;
  --dim: #8B93A1;
  --ice: #8FB4EA;
  --gold: #D2A24E;
  --gold-ink: #14110A;
  --good: #5FBF8F;
  --bad: #E07A6E;
  --glow: #1C242F;
  --lip: rgba(255, 255, 255, .035);
  --shade: rgba(0, 0, 0, .28);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F4F2ED;
    --card: #FFFFFF;
    --card-2: #EDEAE2;
    --line: #D8D4C9;
    --text: #23272E;
    --dim: #6E7683;
    --ice: #2F5FA8;
    --gold: #A87B2A;
    --gold-ink: #FFFFFF;
    --good: #2E7D5B;
    --bad: #B4443C;
    --glow: #FFFFFF;
    --lip: rgba(255, 255, 255, .6);
    --shade: rgba(35, 39, 46, .07);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  /* flacher Schein hinter dem Kopf, damit die Fläche nicht tot wirkt */
  background-image: radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 70%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
           calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  max-width: 560px;
  margin: 0 auto;
  -webkit-text-size-adjust: 100%;
}
.cyr { font-family: Georgia, "Times New Roman", serif; }
button { font-family: inherit; }

header { margin-bottom: 14px; }
.masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.eyebrow { display: block; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; font-family: Georgia, serif; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; margin: 0; font-weight: 600; line-height: 1.1; }
.title-dot { color: var(--gold); }

.iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--card-2); color: var(--dim); cursor: pointer;
  box-shadow: inset 0 1px 0 var(--lip);
}
.iconbtn:active { transform: scale(.94); }
#gear.active { border-color: var(--gold); color: var(--gold); }
#gear .icon { transition: opacity .2s; }

.kopf-rail {
  height: 3px; border-radius: 999px; background: var(--line);
  margin: 14px 0 7px; overflow: hidden;
}
.kopf-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width .35s; }
.kopf-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 13px; }
.kopf-label {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kopf-serie { color: var(--gold); }
#saveNote {
  flex: none; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); display: inline-flex; align-items: center; gap: 4px;
  opacity: 0; transition: opacity .35s;
}
#saveNote.show { opacity: 1; }
#saveNote.ok { color: var(--good); }
#saveNote.err { color: var(--bad); text-transform: none; letter-spacing: 0; opacity: 1; text-align: right; white-space: normal; }

.icon { width: 20px; height: 20px; display: block; pointer-events: none; flex: none; }

nav {
  display: flex; gap: 2px; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto;
  position: sticky; top: env(safe-area-inset-top); z-index: 5; background: var(--bg);
}
/* deckt beim Scrollen den Streifen über der klebenden Leiste ab (Notch + Innenabstand) */
nav::before {
  content: ''; position: absolute; left: -16px; right: -16px; bottom: 100%;
  height: calc(env(safe-area-inset-top) + 16px); background: var(--bg);
}
nav button {
  background: none; border: none; color: var(--dim); font-size: 14px;
  padding: 12px 14px; min-height: 44px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
nav::-webkit-scrollbar { display: none; }
nav button.active { color: var(--text); border-bottom-color: var(--gold); }

.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
select {
  flex: 1; min-width: 140px; min-height: 44px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 14px;
}
.chip {
  padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--dim); font-size: 13px; cursor: pointer;
}
.chip.active { border-color: var(--gold); color: var(--gold); }

.paket { margin: -4px 0 14px; }
.paket-punkte { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
.pp { width: 100%; max-width: 22px; flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
.pp.s1 { background: var(--dim); }
.pp.s2 { background: var(--ice); opacity: .6; }
.pp.s3 { background: var(--ice); }
.pp.s4 { background: var(--gold); }
.paket-text { font-size: 11px; color: var(--dim); margin: 0; }
.paket-frei { color: var(--gold); }

.leer {
  border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center;
}
.leer h3 { font-family: Georgia, serif; font-size: 17px; margin: 0 0 8px; font-weight: 600; }
.leer p { font-size: 13px; color: var(--dim); line-height: 1.55; margin: 0 0 6px; }
.leer .naechste { margin-top: 14px; font-size: 13px; }
.leer .naechste span { color: var(--text); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 24px 18px; text-align: center;
  box-shadow: inset 0 1px 0 var(--lip), 0 6px 18px -12px var(--shade);
}
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 10px; color: var(--dim); }
.boxdots { display: flex; gap: 4px; }
.boxdots span { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--line); }
.boxdots span.on { background: var(--gold); border-color: var(--gold); }
.card-theme { text-transform: uppercase; letter-spacing: .12em; }

.task-label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); margin: 0 0 6px; }
.word { font-size: 30px; margin: 4px 0 6px; font-weight: 600; }
.sentence { font-size: 22px; line-height: 1.45; margin: 4px 0 12px; }
.answer { font-size: 17px; color: var(--ice); margin: 12px 0 0; }
.translit { font-size: 13px; color: var(--dim); font-style: italic; margin: 4px 0 0; }
.hint { font-size: 13px; color: var(--dim); margin-top: 12px; }

.speak {
  background: none; border: none; color: var(--ice);
  cursor: pointer; margin-left: 6px; vertical-align: middle; opacity: .85;
  min-width: 44px; min-height: 44px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.speak:active { transform: scale(.92); }
.tile.fn, .wordtile.fn, .key.wide { display: inline-flex; align-items: center; justify-content: center; }
.tile.fn .icon, .wordtile.fn .icon, .key.wide .icon { width: 18px; height: 18px; }

.slots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 14px 0 16px; min-height: 42px; }
.slot {
  width: 32px; height: 42px; border-bottom: 2px solid var(--line);
  font-size: 24px; display: flex; align-items: center; justify-content: center;
}
.slot.filled { border-bottom-color: var(--gold); }

.tiles { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.tile {
  min-width: 44px; min-height: 44px; padding: 10px 8px; border-radius: 10px; font-size: 20px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer;
}
.tile:active { transform: scale(.94); }
.tile.used { opacity: .18; }
.tile.fn { color: var(--dim); font-size: 16px; }

.built {
  min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  align-items: center; padding: 8px 6px; margin: 6px 0 14px; border-bottom: 1px solid var(--line);
}
.built-placeholder { font-size: 12px; color: var(--dim); }
.built-word {
  font-size: 17px; min-height: 44px; padding: 8px 12px; border-radius: 8px;
  background: var(--card-2); border: 1px solid var(--gold); color: var(--text);
}
button.built-word { cursor: pointer; }
button.built-word:active { transform: scale(.95); }
.wordtile {
  padding: 11px 13px; min-height: 44px; border-radius: 10px; font-size: 16px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer;
}
.wordtile:active { transform: scale(.95); }
.wordtile.used { opacity: .18; }
.wordtile.fn { color: var(--dim); }

.options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
.option {
  padding: 13px 14px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--text); font-size: 16px; cursor: pointer;
}
.option.picked { border-color: var(--gold); color: var(--gold); background: var(--card); }
.option.right { border-color: var(--good); color: var(--good); }
.option.wrong { border-color: var(--bad); color: var(--bad); }
.option.muted { opacity: .35; }

.feedback { margin-top: 14px; font-size: 15px; }
.feedback p, p.feedback { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.feedback .icon { width: 17px; height: 17px; }
.feedback.good { color: var(--good); }
.feedback.bad strong { color: var(--bad); font-size: 18px; }

.factcard { border-color: var(--gold); }
.fact-label { display: block; font-family: Georgia, serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.fact-text { font-size: 17px; line-height: 1.55; margin: 0; text-align: left; }

input[type="text"] {
  width: 100%; margin-top: 16px; padding: 13px; min-height: 48px; font-size: 22px; text-align: center;
  border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input[type="text"]:focus { outline: none; border-color: var(--ice); }
input.ok { border-color: var(--good); }
input.err { border-color: var(--bad); }

.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 13px; min-height: 48px; border-radius: 12px; font-size: 15px;
  cursor: pointer; font-weight: 600; border: 1px solid transparent;
}
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: none; border-color: var(--line); color: var(--dim); }
.btn.danger { background: none; border-color: var(--bad); color: var(--bad); }

#gear {
  background: none; border: none; color: var(--dim); font-size: 19px; line-height: 1;
  min-width: 44px; min-height: 44px; cursor: pointer; padding: 0;
}
#gear.active { color: var(--gold); }

.setting {
  display: flex; align-items: center; gap: 14px; padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.setting-text { flex: 1; }
.setting-title { display: block; font-size: 15px; }
.setting-note { display: block; font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
.switch {
  flex: none; width: 52px; height: 32px; padding: 3px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card-2); position: relative;
}
.switch::before {
  content: ''; position: absolute; inset: -6px; /* Trefferfläche auf 44 px vergrößern */
}
.switch .knob {
  display: block; width: 24px; height: 24px; border-radius: 50%;
  background: var(--dim); transition: transform .15s, background .15s;
}
.switch:disabled { opacity: .35; cursor: default; }
.switch.on { border-color: var(--gold); background: rgba(210, 162, 78, .18); }
.switch.on .knob { transform: translateX(20px); background: var(--gold); }
.settings-note { font-size: 12px; color: var(--dim); line-height: 1.5; margin: 16px 0 0; }
.seg { flex: none; display: flex; gap: 4px; }
.seg .chip { min-width: 44px; padding: 10px 0; text-align: center; }

.session-info { text-align: center; font-size: 12px; color: var(--dim); margin-top: 16px; }

.kb-toggle {
  display: block; margin: 16px auto 0; background: none; border: none;
  color: var(--dim); font-size: 12px; min-height: 44px; cursor: pointer; text-decoration: underline;
}
.kb-row { display: flex; gap: 4px; justify-content: center; margin-bottom: 4px; flex-wrap: wrap; }
.key {
  min-width: 27px; min-height: 44px; padding: 9px 3px; border-radius: 8px; font-size: 17px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
}
.key:active { background: var(--gold); color: var(--gold-ink); }
.key.wide { min-width: 46px; font-size: 14px; }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: center;
  box-shadow: inset 0 1px 0 var(--lip), 0 6px 18px -12px var(--shade);
}
.stat.accent { border-color: var(--gold); }
.stat-value { display: block; font-size: 25px; font-weight: 600; font-family: Georgia, serif; }
.stat.accent .stat-value { color: var(--gold); }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }

h2 { font-family: Georgia, serif; font-size: 16px; margin: 24px 0 12px; font-weight: 600; }
.boxes { display: flex; gap: 10px; align-items: flex-end; }
.boxstat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.boxbar-wrap { height: 90px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.boxbar { width: 55%; background: var(--ice); border-radius: 5px 5px 0 0; min-height: 4px; opacity: .85; }
.boxbar.gold { background: var(--gold); opacity: 1; }
.boxnum { font-size: 13px; font-weight: 600; }
.boxlabel { font-size: 10px; color: var(--dim); }

.theme-list { display: flex; flex-direction: column; gap: 8px; }
.theme-row { display: grid; grid-template-columns: 112px 1fr 46px; gap: 8px; align-items: center; font-size: 12px; }
.theme-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.theme-bar { height: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.theme-fill { height: 100%; background: var(--gold); }
.theme-count { text-align: right; color: var(--dim); }

.backup-note { font-size: 12px; color: var(--dim); margin: 0 0 4px; }
textarea {
  width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  font-size: 11px; font-family: monospace; resize: vertical; word-break: break-all;
}
textarea:focus { outline: none; border-color: var(--ice); }
.danger-zone { margin-top: 34px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <div>
      <span class="eyebrow">Русский · Тренажёр</span>
      <h1>Russisch<span class="title-dot">.</span></h1>
    </div>
    <button id="gear" class="iconbtn" aria-label="Einstellungen" title="Einstellungen"><!-- Symbol wird gesetzt --></button>
  </div>
  <div class="kopf-rail"><div class="kopf-fill" id="kopfFill" style="width:0"></div></div>
  <div class="kopf-meta">
    <span class="kopf-label" id="kopfLabel"></span>
    <span id="saveNote" role="status" aria-live="polite"></span>
  </div>
</header>

<nav id="tabs">
  <button data-tab="ueben" class="active">Üben</button>
  <button data-tab="tippen">Tippen</button>
  <button data-tab="uebersetzen">Übersetzen</button>
  <button data-tab="bilanz">Bilanz</button>
</nav>

<main id="main"></main>

// ── Hilfsfunktionen ─────────────────────────────────────────
function normalize(s) {
  return (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function tokenize(sentence) {
  return sentence.replace(/[.,!?;:]/g, '').split(/\s+/).filter(Boolean);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

// ── Zustand & Speichern (localStorage) ──────────────────────
function defaultSettings() {
  return {
    confirmUeben: true,        // in «Üben» erst auswählen, dann bestätigen
    confirmUebersetzen: true,  // in «Übersetzen» erst legen, dann bestätigen
    requireComplete: false,    // Bestätigen erst bei vollständiger Lösung
    tippenAbStufe: BOX_MAX,    // ab welcher Leitner-Stufe ein Wort im Tippen erscheint
    paketSperre: true          // Päckchen der Reihe nach freischalten
  };
}
function defaultState() {
  return {
    boxes: {},
    lastSeen: {},              // Zeitstempel je Wort, Grundlage der Fälligkeit
    typingStats: { correct: 0, wrong: 0 },
    transStats: { correct: 0, wrong: 0 },
    readSeen: {},
    streak: 0,
    bestStreak: 0,
    answered: 0,
    factIdx: 0,
    settings: defaultSettings()
  };
}
// Gespeicherten Stand mit den Vorgaben verschmelzen: fehlende Felder behalten
// ihren Standardwert, neu hinzugekommene Einstellungen ebenso.
function mergeState(parsed) {
  var d = defaultState();
  Object.keys(d).forEach(function (k) { if (parsed[k] !== undefined) d[k] = parsed[k]; });
  d.boxes = migriereIds(d.boxes);
  d.lastSeen = migriereIds(d.lastSeen);
  d.settings = defaultSettings();
  if (parsed.settings && typeof parsed.settings === 'object') {
    Object.keys(d.settings).forEach(function (k) {
      var wert = parsed.settings[k];
      if (typeof wert === typeof d.settings[k]) d.settings[k] = wert;
    });
    var stufe = d.settings.tippenAbStufe;
    if (!(stufe >= 1 && stufe <= BOX_MAX)) d.settings.tippenAbStufe = BOX_MAX;
  }
  return d;
}
// Bis Version 3 lautete die Wort-Kennung «Thema::wort». Sie hing damit am
// Themennamen; eine Umbenennung hätte den Lernstand gelöscht. Jetzt zählt nur
// das russische Wort — alte Stände werden beim Laden umgeschrieben.
function migriereIds(obj) {
  if (!obj || typeof obj !== 'object') return {};
  var neu = {};
  Object.keys(obj).forEach(function (k) {
    var pos = k.indexOf('::');
    var id = pos === -1 ? k : k.slice(pos + 2);
    if (neu[id] === undefined || obj[k] > neu[id]) neu[id] = obj[k];
  });
  return neu;
}
var state = defaultState();
var saveTimer = null;

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = mergeState(JSON.parse(raw));
  } catch (e) {
    zeigeStatus('err', 'Speicher nicht verfügbar — der Fortschritt geht beim Schließen verloren.');
  }
}
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      zeigeStatus('ok', 'gespeichert');
    } catch (e) {
      zeigeStatus('err', 'Speichern fehlgeschlagen — Sicherung unter Bilanz nutzen.');
    }
  }, 400);
}
// Erfolgsmeldungen verschwinden von selbst, Fehler bleiben stehen.
var statusTimer = null;
function zeigeStatus(art, text) {
  var n = document.getElementById('saveNote');
  if (!n) return;
  if (statusTimer) clearTimeout(statusTimer);
  n.className = art + ' show';
  n.innerHTML = (art === 'ok' ? ICON.haken : '') + '<span>' + esc(text) + '</span>';
  if (art === 'ok') {
    statusTimer = setTimeout(function () {
      n.className = art;
      statusTimer = setTimeout(function () { n.innerHTML = ''; }, 400);
    }, 2000);
  }
}

// Kopfzeile: Anteil gemeisterter Wörter und laufende Serie.
function updateKopf() {
  var gemeistert = 0;
  ALL_VOCAB.forEach(function (v) { if ((state.boxes[v.id] || 0) >= BOX_MAX) gemeistert++; });
  var anteil = ALL_VOCAB.length ? gemeistert / ALL_VOCAB.length * 100 : 0;
  document.getElementById('kopfFill').style.width = anteil + '%';
  var text = gemeistert + ' von ' + ALL_VOCAB.length + ' gemeistert';
  if (state.streak >= 3) text += ' · <span class="kopf-serie">Serie ' + state.streak + '</span>';
  document.getElementById('kopfLabel').innerHTML = text;
}
function updateBox(id, correct) {
  var cur = state.boxes[id] || 0;
  state.boxes[id] = correct ? Math.min(BOX_MAX, cur + 1) : Math.max(0, cur - 1);
  state.lastSeen[id] = Date.now();
  state.streak = correct ? state.streak + 1 : 0;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.answered++;
  updateKopf();
  save();
}

// ── Päckchen und Fälligkeit ─────────────────────────────────
// Gelernt wird in Päckchen von PAKET_GROESSE Wörtern in der Reihenfolge der
// Daten. Das nächste Päckchen öffnet, wenn jedes Wort des laufenden mindestens
// PAKET_STUFE erreicht hat.
var PAKET_GROESSE = 12;
var PAKET_STUFE = 3;
var TAG = 86400000;
// Wiedervorlage je Leitner-Stufe: neu · 1 Tag · 3 · 7 · 21
var INTERVALL = [0, TAG, 3 * TAG, 7 * TAG, 21 * TAG];

function paketAnzahl() {
  return Math.ceil(ALL_VOCAB.length / PAKET_GROESSE);
}
function paketWoerter(nr) {
  return ALL_VOCAB.slice(nr * PAKET_GROESSE, (nr + 1) * PAKET_GROESSE);
}
function paketName(nr) {
  var themen = [];
  paketWoerter(nr).forEach(function (v) {
    if (themen.indexOf(v.theme) === -1) themen.push(v.theme);
  });
  return themen.slice(0, 2).join(' & ');
}
// Ein Päckchen ist geschafft, wenn jedes Wort mindestens PAKET_STUFE hat.
function paketGeschafft(nr) {
  return paketWoerter(nr).every(function (v) { return (state.boxes[v.id] || 0) >= PAKET_STUFE; });
}
function paketReif(nr) {
  return paketWoerter(nr).filter(function (v) { return (state.boxes[v.id] || 0) >= PAKET_STUFE; }).length;
}
// Nummer des ersten nicht geschafften Päckchens — dort wird gelernt.
function aktuellesPaket() {
  for (var i = 0; i < paketAnzahl(); i++) if (!paketGeschafft(i)) return i;
  return paketAnzahl() - 1;
}
function paketFrei(nr) {
  return !state.settings.paketSperre || nr <= aktuellesPaket();
}
// Alle Wörter bis einschließlich des laufenden Päckchens.
function freigeschalteteWoerter() {
  return ALL_VOCAB.slice(0, (aktuellesPaket() + 1) * PAKET_GROESSE);
}
function faellig(v, jetzt) {
  var box = state.boxes[v.id] || 0;
  var seit = state.lastSeen[v.id];
  if (!seit) return true;
  return jetzt - seit >= INTERVALL[Math.min(box, INTERVALL.length - 1)];
}
function faelligeAnzahl(liste) {
  var jetzt = Date.now();
  return liste.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); }).length;
}

// ── Tabs ────────────────────────────────────────────────────
var currentTab = 'ueben';
var main = document.getElementById('main');

var letzterTab = 'ueben'; // Rückweg aus den Einstellungen

function setTab(name) {
  if (currentTab !== 'einstellungen') letzterTab = currentTab;
  currentTab = name;
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.getElementById('gear').classList.toggle('active', name === 'einstellungen');
  render();
}

document.getElementById('tabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  setTab(btn.dataset.tab);
});

document.getElementById('gear').addEventListener('click', function () {
  setTab(currentTab === 'einstellungen' ? letzterTab : 'einstellungen');
});

function render() {
  if (currentTab === 'ueben') renderUeben();
  else if (currentTab === 'uebersetzen') renderUebersetzen();
  else if (currentTab === 'tippen') renderTippen();
  else if (currentTab === 'einstellungen') renderEinstellungen();
  else renderBilanz();
  updateKopf();
}

// ── ÜBEN ────────────────────────────────────────────────────
var uebAuswahl = 'paket'; // 'paket' · 'alle' · Nummer eines freigeschalteten Päckchens
var uebQ = null;
var uebPhase = 'ask'; // ask | feedback | fact
var uebBuilt = [];
var uebPicked = null;
var uebCorrect = null;
var uebRevealed = false;
var uebFactText = '';

function uebPool() {
  if (uebAuswahl === 'alle') return freigeschalteteWoerter();
  var nr = uebAuswahl === 'paket' ? aktuellesPaket() : uebAuswahl;
  if (!paketFrei(nr)) nr = aktuellesPaket();
  return paketWoerter(nr);
}

// Auswahl in drei Stufen: erstens fällige Wiederholungen, zweitens noch nie
// gesehene Wörter, drittens — innerhalb einer Sitzung der Regelfall — das am
// längsten Zurückliegende mit der niedrigsten Stufe.
// «nurWiederholen» überspringt die ersten beiden Stufen: Wer ausdrücklich
// wiederholt, will den ganzen Bestand, nicht bloß das noch Unbekannte.
function waehleWort(pool, nurWiederholen) {
  if (!pool.length) return null;
  var jetzt = Date.now();
  var faellige = pool.filter(function (v) { return (state.boxes[v.id] || 0) > 0 && faellig(v, jetzt); });
  var neue = pool.filter(function (v) { return !state.lastSeen[v.id]; });
  var quelle, nachAlter = false;
  if (nurWiederholen) {
    // Wiederholen heißt: bereits Begonnenes, das am längsten zurückliegt.
    quelle = pool.filter(function (v) { return state.lastSeen[v.id]; });
    nachAlter = true;
    if (!quelle.length) { quelle = pool; nachAlter = false; }
  } else if (faellige.length && (!neue.length || Math.random() < 0.65)) quelle = faellige;
  else if (neue.length) quelle = neue;
  else quelle = pool;

  var sortiert = quelle.slice().sort(function (a, b) {
    var boxA = state.boxes[a.id] || 0, boxB = state.boxes[b.id] || 0;
    var zeitA = state.lastSeen[a.id] || 0, zeitB = state.lastSeen[b.id] || 0;
    if (nachAlter) return zeitA - zeitB || boxA - boxB;
    if (boxA !== boxB) return boxA - boxB;
    return zeitA - zeitB;
  });
  var fenster = sortiert.slice(0, Math.min(5, sortiert.length));
  return fenster[Math.floor(Math.random() * fenster.length)];
}
function buildQuestion() {
  var pool = uebPool();
  var word = waehleWort(pool, uebAuswahl === 'alle');
  var box = state.boxes[word.id] || 0;
  var canTile = word.ru.indexOf(' ') === -1 && word.ru.length <= 12;
  var mode;
  if (box <= 1) mode = Math.random() < 0.5 ? 'mc-de' : 'mc-ru';
  else mode = canTile ? 'tiles' : 'mc-ru';

  if (mode === 'tiles') {
    var tiles = word.ru.split('');
    for (var i = 0; i < 10 && tiles.join('') === word.ru; i++) tiles = shuffle(tiles);
    return { word: word, mode: mode, tiles: tiles.map(function (ch, k) { return { ch: ch, key: k }; }) };
  }
  // Ablenker aus allen freigeschalteten Wörtern, sonst wiederholen sich innerhalb
  // eines Päckchens immer dieselben drei. Gleiches Thema zuerst — das fordert mehr.
  var quelle = freigeschalteteWoerter();
  if (quelle.length < 4) quelle = ALL_VOCAB;
  var sameTheme = quelle.filter(function (v) { return v.theme === word.theme && v.id !== word.id; });
  var others = quelle.filter(function (v) { return v.theme !== word.theme && v.id !== word.id; });
  var distractors = shuffle(sameTheme).concat(shuffle(others)).slice(0, 3);
  return { word: word, mode: mode, options: shuffle([word].concat(distractors)) };
}
function uebNext(skipFact) {
  if (!skipFact && state.answered > 0 && state.answered % 5 === 0) {
    uebFactText = FACTS[state.factIdx % FACTS.length];
    state.factIdx++;
    save();
    uebPhase = 'fact';
    renderUeben();
    return;
  }
  uebQ = buildQuestion();
  uebPhase = 'ask';
  uebBuilt = [];
  uebPicked = null;
  uebCorrect = null;
  uebRevealed = false;
  renderUeben();
}

// Kopf über der Frage: Auswahl des Päckchens, Fortschritt darin, Fälligkeit.
function paketKopfHtml() {
  var aktuell = aktuellesPaket();
  var nr = uebAuswahl === 'alle' ? aktuell : (uebAuswahl === 'paket' ? aktuell : uebAuswahl);
  var html = '<div class="controls"><select id="uebWahl">' +
    '<option value="paket"' + (uebAuswahl === 'paket' ? ' selected' : '') + '>' +
    'Päckchen ' + (aktuell + 1) + ' · ' + esc(paketName(aktuell)) + '</option>' +
    '<option value="alle"' + (uebAuswahl === 'alle' ? ' selected' : '') + '>' +
    'Wiederholung · alle freigeschalteten</option>';
  for (var i = 0; i < paketAnzahl(); i++) {
    var frei = paketFrei(i);
    html += '<option value="' + i + '"' + (uebAuswahl === i ? ' selected' : '') + (frei ? '' : ' disabled') + '>' +
      'Päckchen ' + (i + 1) + ' · ' + esc(paketName(i)) + (frei ? '' : ' · gesperrt') + '</option>';
  }
  html += '</select></div>';

  var woerter = uebAuswahl === 'alle' ? freigeschalteteWoerter() : paketWoerter(nr);
  var reif = uebAuswahl === 'alle'
    ? woerter.filter(function (v) { return (state.boxes[v.id] || 0) >= PAKET_STUFE; }).length
    : paketReif(nr);
  var offen = faelligeAnzahl(woerter);

  html += '<div class="paket">';
  html += '<div class="paket-punkte" aria-hidden="true">';
  woerter.slice(0, PAKET_GROESSE * 2).forEach(function (v) {
    var box = state.boxes[v.id] || 0;
    html += '<span class="pp s' + box + '"></span>';
  });
  html += '</div><p class="paket-text">' + reif + ' von ' + woerter.length + ' auf Stufe ' + PAKET_STUFE;
  if (uebAuswahl !== 'alle' && state.settings.paketSperre) {
    html += reif === woerter.length
      ? ' · <span class="paket-frei">Päckchen geschafft</span>'
      : ' · noch ' + (woerter.length - reif) + ' bis zum nächsten Päckchen';
  }
  if (offen > 0) html += ' · ' + offen + ' fällig';
  html += '</p></div>';
  return html;
}

// Ist genug gewählt oder gelegt, um abgeben zu dürfen?
function uebAbgabeBereit() {
  if (!uebQ) return false;
  if (uebQ.mode === 'tiles') {
    return state.settings.requireComplete
      ? uebBuilt.length === uebQ.tiles.length
      : uebBuilt.length > 0;
  }
  return uebPicked !== null;
}

function uebPruefen() {
  var q = uebQ;
  if (q.mode === 'tiles') {
    var attempt = uebBuilt.map(function (k) {
      return q.tiles.filter(function (t) { return t.key === k; })[0].ch;
    }).join('');
    uebCorrect = normalize(attempt) === normalize(q.word.ru);
  } else {
    uebCorrect = uebPicked === q.word.id;
  }
  updateBox(q.word.id, uebCorrect);
  uebPhase = 'feedback';
  renderUeben();
}

function renderUeben() {
  if (uebPhase === 'fact') {
    main.innerHTML =
      '<section>' +
      '<div class="card factcard"><span class="fact-label">Wussten Sie?</span>' +
      '<p class="fact-text">' + esc(uebFactText) + '</p></div>' +
      '<div class="btn-row"><button class="btn primary" id="factNext">Weiter üben</button></div>' +
      '</section>';
    document.getElementById('factNext').addEventListener('click', function () { uebNext(true); });
    return;
  }
  if (!uebQ) uebQ = buildQuestion();
  var q = uebQ;
  var box = state.boxes[q.word.id] || 0;
  var promptRu = q.mode === 'mc-de';
  var prompt = (q.mode === 'tiles' || q.mode === 'mc-ru') ? q.word.de : q.word.ru;
  var taskLabel = q.mode === 'mc-de' ? 'Was bedeutet …' : q.mode === 'mc-ru' ? 'Welches Wort passt?' : 'Setzen Sie das Wort zusammen';

  var dots = '';
  for (var i = 0; i <= BOX_MAX; i++) dots += '<span class="' + (i <= box && box > 0 ? 'on' : '') + '"></span>';

  var html = '<section>' + paketKopfHtml();

  html += '<div class="card">' +
    '<div class="card-meta"><span class="boxdots">' + dots + '</span>' +
    '<span class="card-theme">' + esc(q.word.theme) + '</span></div>' +
    '<p class="task-label">' + taskLabel + '</p>' +
    '<p class="word' + (promptRu ? ' cyr' : '') + '">' + esc(prompt) +
    (promptRu ? '<button class="speak" id="speakBtn" aria-label="Anhören">' + ICON.lautsprecher + '</button>' : '') + '</p>';

  if (q.mode === 'tiles') {
    html += '<div class="slots cyr">';
    for (var s = 0; s < q.tiles.length; s++) {
      var filled = s < uebBuilt.length;
      var ch = filled ? q.tiles.filter(function (t) { return t.key === uebBuilt[s]; })[0].ch : '';
      html += '<span class="slot' + (filled ? ' filled' : '') + '">' + esc(ch) + '</span>';
    }
    html += '</div>';
    if (uebPhase === 'ask') {
      html += '<div class="tiles">';
      q.tiles.forEach(function (t) {
        var used = uebBuilt.indexOf(t.key) !== -1;
        html += '<button class="tile cyr' + (used ? ' used' : '') + '" data-tile="' + t.key + '"' + (used ? ' disabled' : '') + '>' + esc(t.ch) + '</button>';
      });
      html += '<button class="tile fn" id="tileUndo" aria-label="Letzten Buchstaben entfernen">' + ICON.ruecktaste + '</button></div>';
    }
  }

  if (q.mode === 'mc-de' || q.mode === 'mc-ru') {
    html += '<div class="options">';
    q.options.forEach(function (opt, oi) {
      var cls = '';
      if (uebPhase === 'feedback') {
        if (opt.id === q.word.id) cls = ' right';
        else if (opt.id === uebPicked) cls = ' wrong';
        else cls = ' muted';
      } else if (opt.id === uebPicked) {
        cls = ' picked';
      }
      html += '<button class="option' + (q.mode === 'mc-ru' ? ' cyr' : '') + cls + '" data-opt="' + oi + '"' +
        (uebPhase !== 'ask' ? ' disabled' : '') + '>' +
        esc(q.mode === 'mc-de' ? opt.de : opt.ru) + '</button>';
    });
    html += '</div>';
  }

  if (uebPhase === 'feedback') {
    html += '<div class="feedback ' + (uebCorrect ? 'good' : 'bad') + '">';
    if (uebCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig!</p>';
    else html += '<p>' + ICON.kreuz + (uebRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="cyr">' + esc(q.word.ru) + '</strong> — ' + esc(q.word.de) +
      ' <span class="translit">[' + esc(q.word.tr) + ']</span></p>';
    html += '</div>';
  }

  html += '</div><div class="btn-row">';
  if (uebPhase === 'ask') {
    html += '<button class="btn ghost" id="uebReveal">Aufdecken</button>';
    if (state.settings.confirmUeben) {
      html += '<button class="btn primary" id="uebConfirm"' + (uebAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="uebNext">Weiter \u2192</button>';
  }
  html += '</div>';
  html += '<p class="session-info">' + state.answered + ' beantwortet · Beste Serie: ' + state.bestStreak + '</p></section>';

  main.innerHTML = html;

  document.getElementById('uebWahl').addEventListener('change', function (e) {
    var w = e.target.value;
    uebAuswahl = (w === 'paket' || w === 'alle') ? w : parseInt(w, 10);
    uebNext(true);
  });
  var sp = document.getElementById('speakBtn');
  if (sp) sp.addEventListener('click', function () { speak(q.word.ru); });

  if (uebPhase === 'ask') {
    document.getElementById('uebReveal').addEventListener('click', function () {
      uebRevealed = true;
      uebCorrect = false;
      updateBox(q.word.id, false);
      uebPhase = 'feedback';
      renderUeben();
    });
    main.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        uebPicked = q.options[parseInt(b.dataset.opt, 10)].id;
        if (state.settings.confirmUeben) renderUeben();
        else uebPruefen();
      });
    });
    main.querySelectorAll('[data-tile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.tile, 10);
        if (uebBuilt.indexOf(key) !== -1) return;
        uebBuilt.push(key);
        if (!state.settings.confirmUeben && uebBuilt.length === q.tiles.length) uebPruefen();
        else renderUeben();
      });
    });
    var confirmBtn = document.getElementById('uebConfirm');
    if (confirmBtn) confirmBtn.addEventListener('click', function () {
      if (uebAbgabeBereit()) uebPruefen();
    });
    var undo = document.getElementById('tileUndo');
    if (undo) undo.addEventListener('click', function () {
      uebBuilt.pop();
      renderUeben();
    });
  } else {
    document.getElementById('uebNext').addEventListener('click', function () { uebNext(false); });
  }
}

// ── ÜBERSETZEN ──────────────────────────────────────────────
var trLevel = 1, trIdx = 0, trDir = 'ru-de';
var trTask = null, trBuilt = [], trPhase = 'ask', trCorrect = null, trRevealed = false;

function buildTransTask() {
  var pair = SENTENCES[trLevel][trIdx];
  var ru = pair[0], de = pair[1];
  var prompt = trDir === 'ru-de' ? ru : de;
  var targetTokens = tokenize(trDir === 'ru-de' ? de : ru);
  var solution = trDir === 'ru-de' ? de : ru;
  var targetNorm = {};
  targetTokens.forEach(function (w) { targetNorm[normalize(w)] = true; });
  var otherWords = [];
  SENTENCES[trLevel].forEach(function (p, i) {
    if (i === trIdx) return;
    tokenize(trDir === 'ru-de' ? p[1] : p[0]).forEach(function (w) {
      if (!targetNorm[normalize(w)]) otherWords.push(w);
    });
  });
  var uniq = [];
  var seen = {};
  otherWords.forEach(function (w) { if (!seen[w]) { seen[w] = true; uniq.push(w); } });
  var distractors = shuffle(uniq).slice(0, Math.min(3, uniq.length));
  var tiles = shuffle(targetTokens.concat(distractors)).map(function (word, i) {
    return { word: word, key: i };
  });
  trTask = { prompt: prompt, targetTokens: targetTokens, solution: solution, tiles: tiles, ru: ru };
  trBuilt = [];
  trPhase = 'ask';
  trCorrect = null;
  trRevealed = false;
}

function trWort(key) {
  return trTask.tiles.filter(function (x) { return x.key === key; })[0].word;
}

// Ist genug gelegt, um abgeben zu dürfen?
function trAbgabeBereit() {
  if (!trTask) return false;
  return state.settings.requireComplete
    ? trBuilt.length === trTask.targetTokens.length
    : trBuilt.length > 0;
}

function trPruefen() {
  var ok = trBuilt.length === trTask.targetTokens.length && trBuilt.every(function (k, i) {
    return normalize(trWort(k)) === normalize(trTask.targetTokens[i]);
  });
  trFinish(ok);
}

function trFinish(ok) {
  trCorrect = ok;
  trPhase = 'feedback';
  state.readSeen[trLevel + '-' + trIdx] = true;
  state.transStats.correct += ok ? 1 : 0;
  state.transStats.wrong += ok ? 0 : 1;
  save();
}

function renderUebersetzen() {
  if (!trTask) buildTransTask();
  var t = trTask;
  var promptIsRu = trDir === 'ru-de';
  var list = SENTENCES[trLevel];
  var seenCount = Object.keys(state.readSeen).filter(function (k) {
    return k.indexOf(trLevel + '-') === 0;
  }).length;

  var html = '<section><div class="controls">';
  [1, 2, 3].forEach(function (l) {
    html += '<button class="chip' + (trLevel === l ? ' active' : '') + '" data-level="' + l + '">Stufe ' + l + '</button>';
  });
  html += '<button class="chip" id="trDir">' + (trDir === 'ru-de' ? 'RU \u2192 DE' : 'DE \u2192 RU') + '</button></div>';

  html += '<div class="card"><p class="task-label">Übersetzen Sie</p>' +
    '<p class="sentence' + (promptIsRu ? ' cyr' : '') + '">' + esc(t.prompt) +
    (promptIsRu ? '<button class="speak" id="trSpeak" aria-label="Anhören">' + ICON.lautsprecher + '</button>' : '') + '</p>';

  html += '<div class="built' + (promptIsRu ? '' : ' cyr') + '">';
  if (trBuilt.length === 0 && trPhase === 'ask') {
    html += '<span class="built-placeholder">Wörter in der richtigen Reihenfolge antippen</span>';
  } else {
    trBuilt.forEach(function (k, i) {
      var w = esc(trWort(k));
      // In der Frage-Phase ist jedes gelegte Wort einzeln antippbar zum Entfernen.
      html += trPhase === 'ask'
        ? '<button class="built-word" data-built="' + i + '" aria-label="«' + w + '» entfernen">' + w + '</button>'
        : '<span class="built-word">' + w + '</span>';
    });
  }
  html += '</div>';

  if (trPhase === 'ask') {
    if (trBuilt.length > 0) html += '<p class="hint">Zum Entfernen ein gelegtes Wort antippen.</p>';
    html += '<div class="tiles">';
    t.tiles.forEach(function (tile) {
      var used = trBuilt.indexOf(tile.key) !== -1;
      html += '<button class="wordtile' + (promptIsRu ? '' : ' cyr') + (used ? ' used' : '') +
        '" data-wtile="' + tile.key + '"' + (used ? ' disabled' : '') + '>' + esc(tile.word) + '</button>';
    });
    html += '<button class="wordtile fn" id="trUndo" aria-label="Letztes Wort entfernen">' + ICON.ruecktaste + '</button></div>';
  }

  if (trPhase === 'feedback') {
    html += '<div class="feedback ' + (trCorrect ? 'good' : 'bad') + '">';
    if (trCorrect) html += '<p>' + ICON.haken + 'Правильно — richtig übersetzt!</p>';
    else html += '<p>' + ICON.kreuz + (trRevealed ? 'Lösung: ' : 'Richtig wäre: ') +
      '<strong class="' + (promptIsRu ? '' : 'cyr') + '">' + esc(t.solution) + '</strong></p>';
    html += '</div>';
  }

  html += '</div><div class="btn-row">';
  if (trPhase === 'ask') {
    html += '<button class="btn ghost" id="trReveal">Aufdecken</button>';
    if (state.settings.confirmUebersetzen) {
      html += '<button class="btn primary" id="trConfirm"' + (trAbgabeBereit() ? '' : ' disabled') +
        '>Best\u00e4tigen</button>';
    }
  } else {
    html += '<button class="btn primary" id="trNext">Weiter \u2192</button>';
  }
  html += '</div>';

  html += '<p class="session-info">Satz ' + (trIdx + 1) + ' / ' + list.length + ' · ' +
    seenCount + ' von ' + list.length + ' geübt';
  if (state.transStats.correct + state.transStats.wrong > 0) {
    html += ' · ' + state.transStats.correct + ' richtig, ' + state.transStats.wrong + ' falsch';
  }
  html += '</p></section>';

  main.innerHTML = html;

  main.querySelectorAll('[data-level]').forEach(function (b) {
    b.addEventListener('click', function () {
      trLevel = parseInt(b.dataset.level, 10);
      trIdx = 0;
      buildTransTask();
      renderUebersetzen();
    });
  });
  document.getElementById('trDir').addEventListener('click', function () {
    trDir = trDir === 'ru-de' ? 'de-ru' : 'ru-de';
    buildTransTask();
    renderUebersetzen();
  });
  var sp = document.getElementById('trSpeak');
  if (sp) sp.addEventListener('click', function () { speak(trTask.ru); });

  if (trPhase === 'ask') {
    main.querySelectorAll('[data-wtile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = parseInt(b.dataset.wtile, 10);
        if (trBuilt.indexOf(key) !== -1) return;
        trBuilt.push(key);
        if (!state.settings.confirmUebersetzen && trBuilt.length === trTask.targetTokens.length) trPruefen();
        renderUebersetzen();
      });
    });
    main.querySelectorAll('[data-built]').forEach(function (b) {
      b.addEventListener('click', function () {
        trBuilt.splice(parseInt(b.dataset.built, 10), 1);
        renderUebersetzen();
      });
    });
    var trConfirm = document.getElementById('trConfirm');
    if (trConfirm) trConfirm.addEventListener('click', function () {
      if (!trAbgabeBereit()) return;
      trPruefen();
      renderUebersetzen();
    });
    document.getElementById('trUndo').addEventListener('click', function () {
      trBuilt.pop();
      renderUebersetzen();
    });
    document.getElementById('trReveal').addEventListener('click', function () {
      trRevealed = true;
      trFinish(false);
      renderUebersetzen();
    });
  } else {
    document.getElementById('trNext').addEventListener('click', function () {
      trIdx = (trIdx + 1) % list.length;
      buildTransTask();
      renderUebersetzen();
    });
  }
}

// ── TIPPEN ──────────────────────────────────────────────────
// Getippt wird nur, was in «Üben» sitzt: ab Leitner-Stufe settings.tippenAbStufe.
var tWord = null, tResult = null, tHint = false, tKb = true;

function tippenPool() {
  var schwelle = state.settings.tippenAbStufe;
  return ALL_VOCAB.filter(function (v) { return (state.boxes[v.id] || 0) >= schwelle; });
}

// Leerzustand: sagen, woran es liegt und was als Nächstes ansteht.
function renderTippenLeer() {
  var schwelle = state.settings.tippenAbStufe;
  var fast = ALL_VOCAB.filter(function (v) {
    var b = state.boxes[v.id] || 0;
    return b > 0 && b < schwelle;
  }).sort(function (a, b) { return (state.boxes[b.id] || 0) - (state.boxes[a.id] || 0); });

  var html = '<section><div class="leer"><h3>Noch kein Wort freigeschaltet</h3>' +
    '<p>Hier tippen Sie nur Wörter, die in «Üben» sitzen — ab Stufe ' + schwelle +
    ' von ' + BOX_MAX + ', also ' + schwelle + '× nacheinander richtig beantwortet.</p>';
  if (fast.length) {
    html += '<p class="naechste">Am nächsten dran: ' + fast.slice(0, 3).map(function (v) {
      return '<span class="cyr">' + esc(v.ru) + '</span> (Stufe ' + (state.boxes[v.id] || 0) + ')';
    }).join(' · ') + '</p>';
  } else {
    html += '<p class="naechste">Noch kein Wort begonnen — fangen Sie mit dem ersten Päckchen an.</p>';
  }
  html += '<div class="btn-row"><button class="btn primary" id="tZuUeben">Zu «Üben»</button></div>';
  html += '</div><p class="session-info">Schwelle änderbar in den Einstellungen.</p></section>';
  main.innerHTML = html;
  document.getElementById('tZuUeben').addEventListener('click', function () { setTab('ueben'); });
}

function renderTippen() {
  var pool = tippenPool();
  // Während der Rückmeldung bleibt das Wort stehen, auch wenn es nach einem
  // Fehler unter die Schwelle gerutscht ist — sonst verschwände die Auflösung.
  if (!tResult && (!tWord || pool.indexOf(tWord) === -1)) tWord = waehleWort(pool);
  if (!tWord) { renderTippenLeer(); return; }
  var w = tWord;
  var stats = state.typingStats;
  var total = stats.correct + stats.wrong;

  var html = '<section><div class="card">' +
    '<p class="task-label">Schreiben Sie auf Russisch</p>' +
    '<p class="word">' + esc(w.de) + '</p>' +
    (tHint ? '<p class="translit">[' + esc(w.tr) + ']</p>' : '') +
    '<input type="text" id="tInput" class="cyr' + (tResult === 'right' ? ' ok' : tResult === 'wrong' ? ' err' : '') + '"' +
    ' placeholder="кириллица \u2026" lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false"' +
    (tResult ? ' readonly' : '') + '>';

  if (tResult === 'wrong') html += '<p class="feedback bad">' + ICON.kreuz + 'Richtig: <strong class="cyr">' + esc(w.ru) + '</strong></p>';
  if (tResult === 'right') html += '<p class="feedback good">' + ICON.haken + 'Правильно — richtig!</p>';
  html += '</div><div class="btn-row">';
  if (!tResult) {
    html += '<button class="btn ghost" id="tHintBtn">Hinweis</button>' +
      '<button class="btn primary" id="tCheck">Prüfen</button>';
  } else {
    html += '<button class="btn primary" id="tNext">Nächstes Wort \u2192</button>';
  }
  html += '</div>';
  html += '<button class="kb-toggle" id="tKbToggle">' + (tKb ? 'Tastatur ausblenden' : 'Tastatur einblenden') + '</button>';
  if (tKb) {
    html += '<div>';
    KB_ROWS.forEach(function (row, ri) {
      html += '<div class="kb-row">';
      row.forEach(function (ch) {
        html += '<button class="key cyr" data-key="' + esc(ch) + '">' + esc(ch) + '</button>';
      });
      if (ri === 2) {
        html += '<button class="key wide" data-key=" ">\u2423</button>' +
          '<button class="key wide" data-key="BS" aria-label="Zeichen löschen">' + ICON.ruecktaste + '</button>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<p class="session-info">' + stats.correct + ' richtig · ' + stats.wrong + ' falsch' +
    (total > 0 ? ' · Quote ' + Math.round(stats.correct / total * 100) + ' %' : '') + '</p></section>';

  main.innerHTML = html;

  var input = document.getElementById('tInput');

  function check() {
    if (tResult) return;
    var ok = normalize(input.value) === normalize(w.ru);
    tResult = ok ? 'right' : 'wrong';
    updateBox(w.id, ok);
    state.typingStats.correct += ok ? 1 : 0;
    state.typingStats.wrong += ok ? 0 : 1;
    save();
    var v = input.value;
    renderTippen();
    document.getElementById('tInput').value = v;
  }
  function next() {
    tResult = null;
    tHint = false;
    tWord = waehleWort(tippenPool());
    renderTippen();
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { if (tResult) next(); else check(); }
  });
  var hintBtn = document.getElementById('tHintBtn');
  if (hintBtn) hintBtn.addEventListener('click', function () {
    tHint = true;
    var v = input.value;
    renderTippen();
    document.getElementById('tInput').value = v;
  });
  var checkBtn = document.getElementById('tCheck');
  if (checkBtn) checkBtn.addEventListener('click', check);
  var nextBtn = document.getElementById('tNext');
  if (nextBtn) nextBtn.addEventListener('click', next);
  document.getElementById('tKbToggle').addEventListener('click', function () {
    tKb = !tKb;
    var v = document.getElementById('tInput').value;
    renderTippen();
    document.getElementById('tInput').value = v;
  });
  main.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (tResult) return;
      var inp = document.getElementById('tInput');
      var k = b.dataset.key;
      if (k === 'BS') inp.value = inp.value.slice(0, -1);
      else inp.value += k;
    });
  });
}

// ── EINSTELLUNGEN ───────────────────────────────────────────
function renderEinstellungen() {
  var s = state.settings;

  function schalter(key, titel, hinweis, gesperrt) {
    var an = s[key];
    return '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<button class="switch' + (an ? ' on' : '') + '" role="switch" aria-checked="' + (an ? 'true' : 'false') +
      '" aria-label="' + esc(titel) + '" data-set="' + key + '"' + (gesperrt ? ' disabled' : '') +
      '><span class="knob"></span></button></div>';
  }

  // Auswahl aus mehreren Werten (Leitner-Stufe) als Chip-Reihe.
  function wahl(key, titel, hinweis, werte) {
    var html = '<div class="setting"><span class="setting-text">' +
      '<span class="setting-title">' + esc(titel) + '</span>' +
      '<span class="setting-note">' + esc(hinweis) + '</span></span>' +
      '<span class="seg" role="group" aria-label="' + esc(titel) + '">';
    werte.forEach(function (w) {
      html += '<button class="chip' + (s[key] === w.wert ? ' active' : '') + '" data-wahl="' + key +
        '" data-wert="' + w.wert + '">' + esc(w.text) + '</button>';
    });
    return html + '</span></div>';
  }

  var ohneBestaetigung = !s.confirmUeben && !s.confirmUebersetzen;

  main.innerHTML = '<section><h2>Lernweg</h2>' +
    schalter('paketSperre', 'Päckchen der Reihe nach',
      'Es wird in Päckchen zu ' + PAKET_GROESSE + ' Wörtern gelernt; das nächste öffnet, wenn alle Wörter Stufe ' +
      PAKET_STUFE + ' erreicht haben. Aus: Sie können jederzeit in jedes Päckchen springen.') +
    wahl('tippenAbStufe', 'Tippen ab Stufe',
      'Ab welcher Leitner-Stufe ein Wort in «Tippen» erscheint. Stufe 4 heißt: vier Mal nacheinander richtig — dafür sitzt es dann auch.',
      [{ wert: 2, text: '2' }, { wert: 3, text: '3' }, { wert: 4, text: '4' }]) +
    '<h2>Abgabe</h2>' +
    schalter('confirmUeben', 'Bestätigen in «Üben»',
      'Antwort erst auswählen, dann mit «Bestätigen» abgeben. Aus: Der erste Tipp zählt sofort.') +
    schalter('confirmUebersetzen', 'Bestätigen in «Übersetzen»',
      'Satz erst zusammenstellen, dann mit «Bestätigen» abgeben. Aus: Der Satz zählt, sobald das letzte Wort liegt.') +
    schalter('requireComplete', 'Erst bei vollständiger Lösung',
      'Bestätigen ist erst möglich, wenn alle Buchstaben beziehungsweise Wörter liegen. Verrät dadurch die Länge der Lösung.',
      ohneBestaetigung) +
    '<p class="settings-note">Die Einstellungen gelten nur auf diesem Gerät und werden zusammen mit dem ' +
    'Lernstand gespeichert. «Fortschritt zurücksetzen» in der Bilanz lässt sie unberührt.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="setBack">Zurück</button></div></section>';

  main.querySelectorAll('[data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      var key = b.dataset.set;
      state.settings[key] = !state.settings[key];
      save();
      renderEinstellungen();
    });
  });
  main.querySelectorAll('[data-wahl]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.settings[b.dataset.wahl] = parseInt(b.dataset.wert, 10);
      save();
      renderEinstellungen();
    });
  });
  document.getElementById('setBack').addEventListener('click', function () { setTab(letzterTab); });
}

// ── BILANZ ──────────────────────────────────────────────────
var backupOpen = false, backupCode = '', backupMsg = '', confirmReset = false;

function encodeBackup() {
  return btoa(unescape(encodeURIComponent(JSON.stringify(state))));
}
function decodeBackup(code) {
  return JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
}

function renderBilanz() {
  var counts = [];
  for (var i = 0; i <= BOX_MAX; i++) counts.push(0);
  ALL_VOCAB.forEach(function (v) { counts[state.boxes[v.id] || 0]++; });
  var mastered = counts[BOX_MAX];
  var started = ALL_VOCAB.length - counts[0];
  var readTotal = 0;
  Object.keys(SENTENCES).forEach(function (l) { readTotal += SENTENCES[l].length; });
  var readSeen = Object.keys(state.readSeen).length;

  function stat(label, value, accent) {
    return '<div class="stat' + (accent ? ' accent' : '') + '"><span class="stat-value">' + value +
      '</span><span class="stat-label">' + label + '</span></div>';
  }

  var html = '<section><div class="stats-grid">' +
    stat('Wörter gesamt', ALL_VOCAB.length) +
    stat('Begonnen', started) +
    stat('Gemeistert', mastered, true) +
    stat('Sätze übersetzt', readSeen + '/' + readTotal) +
    stat('Beantwortet', state.answered) +
    stat('Beste Serie', state.bestStreak, true) +
    '</div>';

  var aktuell = aktuellesPaket();
  var frei = freigeschalteteWoerter();
  html += '<h2>Lernweg</h2><div class="theme-list">' +
    '<div class="theme-row"><span class="theme-name">Päckchen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + ((aktuell + 1) / paketAnzahl() * 100) + '%"></div></div>' +
    '<span class="theme-count">' + (aktuell + 1) + '/' + paketAnzahl() + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Freigeschaltet</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (frei.length / ALL_VOCAB.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + frei.length + '</span></div>' +
    '<div class="theme-row"><span class="theme-name">Im Tippen</span>' +
    '<div class="theme-bar"><div class="theme-fill" style="width:' + (tippenPool().length / ALL_VOCAB.length * 100) + '%"></div></div>' +
    '<span class="theme-count">' + tippenPool().length + '</span></div></div>' +
    '<p class="backup-note">Aktuell: Päckchen ' + (aktuell + 1) + ' · ' + esc(paketName(aktuell)) +
    ' · ' + faelligeAnzahl(frei) + ' Wiederholungen fällig</p>';

  html += '<h2>Leitner-Stufen</h2><div class="boxes">';
  counts.forEach(function (n, bi) {
    var h = Math.max(4, n / ALL_VOCAB.length * 100);
    html += '<div class="boxstat"><div class="boxbar-wrap">' +
      '<div class="boxbar' + (bi === BOX_MAX ? ' gold' : '') + '" style="height:' + h + '%"></div></div>' +
      '<span class="boxnum">' + n + '</span><span class="boxlabel">' + (bi === 0 ? 'neu' : 'St. ' + bi) + '</span></div>';
  });
  html += '</div>';

  html += '<h2>Nach Themen (gemeistert)</h2><div class="theme-list">';
  Object.keys(VOCAB_THEMES).forEach(function (t) {
    var ids = VOCAB_THEMES[t].map(function (w) { return w[0]; });
    var m = ids.filter(function (id) { return (state.boxes[id] || 0) >= BOX_MAX; }).length;
    html += '<div class="theme-row"><span class="theme-name">' + esc(t) + '</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' + (m / ids.length * 100) + '%"></div></div>' +
      '<span class="theme-count">' + m + '/' + ids.length + '</span></div>';
  });
  html += '</div>';

  html += '<h2>Sicherung</h2>' +
    '<p class="backup-note">Ihr Fortschritt als kopierbarer Code — unabhängig vom automatischen Speichern.</p>' +
    '<div class="btn-row"><button class="btn ghost" id="bkMake">Sicherungscode erzeugen</button></div>' +
    (backupOpen ? '<textarea id="bkOut" readonly rows="3" aria-label="Sicherungscode">' + esc(backupCode) + '</textarea>' : '') +
    '<textarea id="bkIn" rows="2" placeholder="Sicherungscode hier einfügen \u2026" aria-label="Sicherungscode einfügen"></textarea>' +
    '<div class="btn-row"><button class="btn ghost" id="bkImport">Sicherung wiederherstellen</button></div>' +
    (backupMsg ? '<p class="session-info">' + esc(backupMsg) + '</p>' : '');

  html += '<div class="danger-zone">';
  if (!confirmReset) {
    html += '<button class="btn danger" id="rsAsk">Fortschritt zurücksetzen \u2026</button>';
  } else {
    html += '<div class="btn-row"><button class="btn ghost" id="rsNo">Abbrechen</button>' +
      '<button class="btn danger" id="rsYes">Endgültig löschen</button></div>';
  }
  html += '</div></section>';

  main.innerHTML = html;

  document.getElementById('bkMake').addEventListener('click', function () {
    backupCode = encodeBackup();
    backupOpen = true;
    backupMsg = '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupCode).then(function () {
        backupMsg = 'Code in die Zwischenablage kopiert.';
        renderBilanz();
      }, function () {
        backupMsg = 'Bitte Code manuell markieren und kopieren.';
        renderBilanz();
      });
    } else {
      backupMsg = 'Bitte Code manuell markieren und kopieren.';
      renderBilanz();
    }
  });
  var out = document.getElementById('bkOut');
  if (out) out.addEventListener('focus', function () { out.select(); });
  document.getElementById('bkImport').addEventListener('click', function () {
    var code = document.getElementById('bkIn').value;
    if (!code.trim()) { backupMsg = 'Bitte zuerst einen Code einfügen.'; renderBilanz(); return; }
    try {
      var data = decodeBackup(code);
      if (!data || typeof data !== 'object' || !data.boxes) throw new Error('ungültig');
      state = mergeState(data);
      save();
      updateKopf();
      backupMsg = 'Sicherung wiederhergestellt.';
    } catch (e) {
      backupMsg = 'Code ungültig — bitte vollständig einfügen.';
    }
    renderBilanz();
  });
  var rsAsk = document.getElementById('rsAsk');
  if (rsAsk) rsAsk.addEventListener('click', function () { confirmReset = true; renderBilanz(); });
  var rsNo = document.getElementById('rsNo');
  if (rsNo) rsNo.addEventListener('click', function () { confirmReset = false; renderBilanz(); });
  var rsYes = document.getElementById('rsYes');
  if (rsYes) rsYes.addEventListener('click', function () {
    var behalten = state.settings; // Einstellungen sind kein Fortschritt
    state = defaultState();
    state.settings = behalten;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    confirmReset = false;
    backupOpen = false;
    backupMsg = '';
    updateKopf();
    save();
    renderBilanz();
  });
}
