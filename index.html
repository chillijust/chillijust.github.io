// ── Menü ────────────────────────────────────────────────────────

function menueZeichnen() {
  $('menueListe').innerHTML = MENUE.map(function (m) {
    return '<li><button type="button" class="menue-eintrag" data-menue="' + esc(m.id) + '"' +
      (m.ziel ? '' : ' aria-disabled="true"') + '>' + ICON[m.icon] +
      '<span class="name">' + esc(m.name) + '</span>' +
      (m.ziel ? '' : '<span class="bald">bald</span>') + '</button></li>';
  }).join('');
  var eintraege = document.querySelectorAll('[data-menue]');
  for (var i = 0; i < eintraege.length; i++) {
    eintraege[i].addEventListener('click', menueWahl);
  }
}

// Ein Eintrag mit Ziel: Die Ansicht quillt als Tropfen aus ihm, das Menü ist
// im selben Augenblick weg — beides zugleich sähe aus wie zwei Tropfen.
function menueWahl() {
  var id = this.getAttribute('data-menue');
  var eintrag = null;
  for (var i = 0; i < MENUE.length; i++) if (MENUE[i].id === id) eintrag = MENUE[i];
  if (eintrag && eintrag.ziel) {
    zeige(eintrag.ziel);
    menueSchliessen(true);
  } else {
    menueSchliessen();
    bald();
  }
}

// Woran das Menü hängt: am Menüknopf — oder, ist der hinausgerollt, an
// seinem Gast, der oben ins Bild getropft ist (ADR 0041).
function menueAnker() { return $('menueGast') || $('menuKnopf'); }

// Ist der Menüknopf nach oben aus dem Bild gerollt, tropft er herab: Ein Gast
// mit seinem Symbol fällt von dort, wo der Knopf steht, an den oberen Rand,
// erst dann klappt das Menü unter ihm auf. Gesetzt wird er still; fallen läßt
// ihn `menueGastFallen`, nachdem das Blatt an ihm gemessen ist.
function menueGastSetzen(huelle) {
  var k = $('menuKnopf');
  menueGastWeg();
  if (!k || !zuSehen(k)) return 0;
  var kr = k.getBoundingClientRect(), gast = document.createElement('button');
  gast.type = 'button';
  gast.id = 'menueGast';
  gast.className = 'rund menue-gast';
  gast.setAttribute('aria-label', 'Menü schließen');
  gast.innerHTML = ICON.menue;
  gast.style.right = px(Math.max(8, document.documentElement.clientWidth - kr.right));
  huelle.appendChild(gast);
  if (kr.top >= gast.getBoundingClientRect().top - 1) { weg(gast); return 0; }
  gast.addEventListener('click', function () { menueSchliessen(); });
  // Solange er unterwegs ist, ist sein Knopf es auch — zwei Menüknöpfe gibt
  // es nie (ADR 0043).
  document.documentElement.classList.add('menue-gast-da');
  return kr.top;
}

function menueGastWeg() {
  weg($('menueGast'));
  document.documentElement.classList.remove('menue-gast-da');
}

// Rollt die Seite bei offenem Menü, rollt der Knopf nicht davon: Das Blatt
// folgt ihm, bis er ganz aus dem Bild ist; dann tropft sein Gast aus der Ecke
// oben rechts herab, und das Blatt fällt mit. Kommt der Knopf zurück an seinen
// Platz, ist der Gast wieder er (ADR 0042, 0043).
function menueMitrollen() {
  var huelle = $('menue'), b = document.querySelector('#menue .blatt');
  if (huelle.hidden || !huelle.classList.contains('offen') || !b) return;
  var gast = $('menueGast'), k = $('menuKnopf');
  // Fällt er noch, bleibt es beim Fall; danach wird nachgesehen.
  if (gast && gast.getAnimations && gast.getAnimations().length) return;
  var kr = k && zuSehen(k) ? k.getBoundingClientRect() : null;
  if (gast && kr && kr.top >= gast.getBoundingClientRect().top) menueGastWeg();
  else if (!gast && kr && kr.bottom <= 0) {
    var alt = b.getBoundingClientRect().top, von = menueGastSetzen(huelle);
    blattLegen();
    var fall = menueGastFallen(von);
    if (fall) {
      bewegt(b, [{ transform: 'translateY(' + px(alt - b.getBoundingClientRect().top) + ')' }, { transform: 'none' }],
        { dauer: fall, kurve: TROPFEN_KURVE });
      setTimeout(menueMitrollen, fall + 30);
    }
    return;
  }
  blattLegen();
}

// Gibt die Dauer des Falls zurück — so lange wartet das Blatt.
function menueGastFallen(von) {
  var gast = $('menueGast');
  if (!gast || bewegungAus()) return 0;
  bewegt(gast, [{ transform: 'translateY(' + px(von - gast.getBoundingClientRect().top) + ')' }, { transform: 'none' }],
    { dauer: MENUE_DAUER, kurve: TROPFEN_KURVE });
  return MENUE_DAUER;
}

// Die Einträge tropfen nacheinander auf, wie die Zeilen unter «Alle Tickets»:
// jeder als Perle an seinem Symbol, die zur Zeile wächst (ADR 0041). Enger
// gestaffelt als dort — das Menü öffnet man oft, und sieben Zeilen in je
// 160 ms ließen auf das letzte Ziel fast zwei Sekunden warten.
var MENUE_STAFFEL = 70, MENUE_ZEILE = 460;
function menueEintraegeTropfen(warten) {
  alleIn('#menueListe .menue-eintrag').forEach(function (z, i) {
    var w = z.offsetWidth, h = z.offsetHeight;
    if (!w || !h) return;
    var d = Math.min(h, 40), perle = 'inset(' + px((h - d) / 2) + ' ' + px(w - d - 2) + ' ' + px((h - d) / 2) + ' 2px round ' +
      px(d / 2) + ')';
    bewegt(z, [
      { clipPath: perle, opacity: 0, transform: 'translateY(-6px)' },
      { clipPath: perle, opacity: 1, transform: 'none', offset: 0.3 },
      { clipPath: 'inset(0px 0px 0px 0px round 12px)', opacity: 1, transform: 'none' }
    ], { dauer: MENUE_ZEILE, warten: warten + MENUE_STAFFEL * i, kurve: TROPFEN_KURVE, fill: 'backwards' });
  });
}

// Das Blatt hängt unter dem Knopf, rechtsbündig mit ihm.
function blattLegen() {
  var k = menueAnker(), b = document.querySelector('#menue .blatt');
  if (!k || !b) return;
  var r = k.getBoundingClientRect();
  b.style.top = px(r.bottom + 8);
  b.style.right = px(Math.max(8, document.documentElement.clientWidth - r.right));
}

// Die Bilder des Blatts zwischen Knopf und voller Größe: von oben rechts
// skaliert, die Ecken vom Tropfen zur Karte.
function blattBilder() {
  var k = menueAnker(), b = document.querySelector('#menue .blatt');
  var kr = k ? k.getBoundingClientRect() : null, br = b.getBoundingClientRect();
  if (!kr || !br.width || !br.height) return null;
  var dy = kr.top - br.top;
  function bild(sx, sy, y, r, off) {
    return { transform: 'translateY(' + px(y) + ') scale(' + sx.toFixed(4) + ', ' + sy.toFixed(4) + ')', borderRadius: r, offset: off };
  }
  var klein = bild(kr.width / br.width, kr.height / br.height, dy, TROPFEN, 0);
  var mitte = bild(0.55, 0.42, dy * 0.4, '40%', 0.45);
  var voll = bild(1, 1, 0, '18px', 1);
  var leise = {}, k;
  for (k in klein) leise[k] = klein[k];
  // Am Knopf blendet der Tropfen ein und aus, statt zu erscheinen oder zu
  // verschwinden — sonst endet das Schließen mit einem Ruck.
  klein.opacity = 1;
  leise.opacity = 0;
  mitte.opacity = 1;
  voll.opacity = 1;
  klein.offset = 0.14;
  return [leise, klein, mitte, voll];
}

function menueOeffnen() {
  var huelle = $('menue'), b = document.querySelector('#menue .blatt');
  menueZeichnen();
  huelle.hidden = false;
  b.style.visibility = '';
  var von = menueGastSetzen(huelle);
  blattLegen();
  // Erst sichtbar, dann einblenden — sonst springt der Schleier ohne Übergang.
  void huelle.offsetWidth;
  huelle.classList.add('offen');
  var bilder = blattBilder(), fall = menueGastFallen(von);
  if (bilder) {
    bewegt(b, bilder, { dauer: MENUE_DAUER, warten: fall, kurve: TROPFEN_KURVE, fill: 'backwards' });
    menueEintraegeTropfen(fall + MENUE_DAUER * 0.4);
  }
}

// Zu fließt das Blatt als Tropfen zurück in den Knopf. `sofort`: ohne Bild,
// wenn gerade eine Ansicht aus einem Eintrag quillt.
function menueSchliessen(sofort) {
  var huelle = $('menue'), b = document.querySelector('#menue .blatt');
  if (huelle.hidden) return;
  huelle.classList.remove('offen');
  var gast = $('menueGast');
  function zu() {
    if (huelle.classList.contains('offen')) return;
    huelle.hidden = true;
    if ($('menueGast') === gast) menueGastWeg();
    else weg(gast);
  }
  // Der Gast steigt zurück, dorthin, wo sein Knopf steht — danach ist zu.
  function hoch() {
    var k = $('menuKnopf');
    if (!gast || !k || huelle.classList.contains('offen')) { zu(); return; }
    var heben = bewegt(gast, [{ transform: 'none' }, { transform: 'translateY(' +
      px(k.getBoundingClientRect().top - gast.getBoundingClientRect().top) + ')' }],
      { dauer: MENUE_DAUER, kurve: TROPFEN_KURVE, fill: 'forwards' }, function () { zu(); if (heben) heben.cancel(); });
  }
  var bilder = sofort ? null : blattBilder();
  if (!bilder || bewegungAus()) { zu(); return; }
  // Das Schließen ist das Öffnen rückwärts — dieselben Bilder, dieselbe Dauer,
  // gespiegelte Zeitpunkte. Der Inhalt geht, bevor das Blatt sich staucht.
  // Nur die eigenen Bilder abräumen: Wer währenddessen wieder öffnet, behält
  // seinen Tropfen.
  var liste = bewegt($('menueListe'), [{ opacity: 1 }, { opacity: 0 }], { dauer: MENUE_DAUER * 0.35, kurve: 'ease-in',
    fill: 'forwards' });
  var blatt = null;
  blatt = bewegt(b, bilder.reverse().map(function (f) { f.offset = 1 - f.offset; return f; }),
    { dauer: MENUE_DAUER, kurve: TROPFEN_KURVE, fill: 'forwards' }, function () {
      if (gast) b.style.visibility = 'hidden';
      hoch();
      if (blatt) blatt.cancel();
      if (liste) liste.cancel();
    });
}

// ════════════════════════════════════════════════════════════════
//  Service Worker (sw.js) — legt die App beiseite, mehr nicht
// ════════════════════════════════════════════════════════════════
//
// Ein Update lädt nie von selbst: Der neue Worker wartet, bis «Jetzt laden»
// oder der Knopf in den Einstellungen getippt wird.

var swStand = { bereit: false, version: '', wartet: null, neuladen: false, gemeldet: false };
var swKnopfLage = 'ruhe';

function swAnmelden() {
  try {
    if (!navigator.serviceWorker || !window.isSecureContext) return;
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      swWartendPruefen(reg);
      reg.addEventListener('updatefound', function () {
        var neu = reg.installing;
        if (!neu) return;
        neu.addEventListener('statechange', function () { swWartendPruefen(reg); });
      });
    }).catch(function () { /* kein Worker, kein Problem */ });
    // Übernimmt ein neuer Worker, ist die Seite veraltet — einmal neu laden,
    // und nur, wenn der Nutzer es angestoßen hat.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (swStand.neuladen) swNeustart();
      else swVersionHolen(swBereitZeichnen);
    });
    swVersionHolen(swBereitZeichnen);
  } catch (e) { /* siehe oben */ }
}

// Wartet eine neue Fassung? Nur dann, und nur wenn schon eine läuft — beim
// allerersten Besuch ist der «neue» Worker schlicht der erste.
function swWartendPruefen(reg) {
  try {
    var wartet = reg.waiting;
    if (!wartet || !navigator.serviceWorker.controller) return;
    swStand.wartet = wartet;
    swHinweisZeigen();
  } catch (e) { /* nichts zu melden */ }
}

function swHinweisZeigen() {
  var leiste = $('swNeu');
  if (!leiste || swStand.gemeldet) return;
  leiste.hidden = false;
  if (ansicht === 'einstellungen') render();
}

function swUebernehmen() {
  if (!swStand.wartet) return;
  swStand.neuladen = true;
  try { swStand.wartet.postMessage({ art: 'uebernehmen' }); } catch (e) { swNeustart(); }
}

var swNeugeladen = false;
function swNeustart() {
  if (swNeugeladen) return;
  swNeugeladen = true;
  window.location.reload();
}

// Welche Fassung liegt gespeichert? Der Worker weiß es, die Seite nicht.
function swVersionHolen(fertig) {
  try {
    var ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!ctrl) { if (fertig) fertig(); return; }
    swStand.bereit = true;
    var kanal = new MessageChannel();
    kanal.port1.onmessage = function (e) {
      swStand.version = (e.data && e.data.version) || '';
      if (fertig) fertig();
    };
    ctrl.postMessage({ art: 'version' }, [kanal.port2]);
  } catch (e) { if (fertig) fertig(); }
}

// «Offline bereit» liest nur, was auf dem Gerät liegt — gilt auch im Funkloch.
function swAuskunft() {
  if (!('serviceWorker' in navigator)) return 'nicht unterstützt';
  if (!swStand.bereit) return 'noch nicht';
  return 'bereit' + (swStand.version ? ' · ' + swStand.version : '');
}

function swBereitZeichnen() {
  var feld = $('swBereit');
  if (!feld) return;
  feld.textContent = swAuskunft();
  feld.classList.toggle('bereit', !!swStand.bereit);
}

// Nachsehen, ob es etwas Neues gibt. **Ohne Netz kommt kein Urteil**: Wer ein
// gescheitertes `update()` still abfängt, meldet danach «Aktuell» über einen
// Stand, den er nie gesehen hat. Der Rückruf sagt darum, woran er war:
// 'ok' · 'kein netz' · 'unmoeglich'.
function swNachsehen(fertig) {
  var raus = false;
  function ende(lage) {
    if (raus) return;   // der Rückruf kommt genau einmal
    raus = true;
    if (fertig) fertig(lage);
  }
  try {
    if (!navigator.serviceWorker) { ende('unmoeglich'); return; }
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) { ende('unmoeglich'); return; }
      reg.update().then(function () {
        swWartendPruefen(reg);
        if (swStand.wartet) { ende('ok'); return; }
        // **`update()` ist fertig, bevor die neue Fassung wartet** — der neue
        // Worker steckt danach oft noch in `installing`. Auf ihn warten, aber
        // nicht ewig.
        var neu = reg.installing;
        if (!neu) { ende('ok'); return; }
        neu.addEventListener('statechange', function () {
          if (neu.state === 'installing') return;
          swWartendPruefen(reg);
          ende('ok');
        });
        setTimeout(function () { swWartendPruefen(reg); ende('ok'); }, 8000);
      }).catch(function () { ende('kein netz'); });
    }).catch(function () { ende('unmoeglich'); });
  } catch (e) { ende('unmoeglich'); }
}

function swKnopfText() {
  if (swStand.wartet) return 'Neue Fassung laden';
  if (swKnopfLage === 'sucht') return 'Suche …';
  if (swKnopfLage === 'aktuell') return 'Aktuell';
  if (swKnopfLage === 'kein netz') return 'Kein Netz';
  if (swKnopfLage === 'unmoeglich') return 'Nicht möglich';
  return 'Nach Aktualisierung suchen';
}

function swKnopfTippen() {
  if (swStand.wartet) { swUebernehmen(); return; }
  if (swKnopfLage === 'sucht') return;
  swKnopfLage = 'sucht';
  swKnopfZeichnen();
  swNachsehen(function (lage) {
    if (lage === 'ok') swKnopfLage = swStand.wartet ? 'ruhe' : 'aktuell';
    else swKnopfLage = lage;
    swKnopfZeichnen();
  });
}

function swKnopfZeichnen() {
  var knopf = $('swKnopf');
  if (knopf) knopf.textContent = swKnopfText();
}

// **Der Notausgang.** Ein Worker, der sich verschluckt, ist auf dem Telefon
// sonst nicht loszuwerden: abmelden, Speicher leeren, neu laden. Gelöscht
// werden nur die Caches — der localStorage, und damit alle Daten, bleibt.
function swAufraeumen(fertig) {
  var schritte = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      schritte.push(navigator.serviceWorker.getRegistrations().then(function (alle) {
        return Promise.all(alle.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      schritte.push(caches.keys().then(function (namen) {
        return Promise.all(namen.map(function (n) { return caches.delete(n); }));
      }));
    }
  } catch (e) { /* was nicht geht, geht nicht */ }
  Promise.all(schritte).catch(function () { return null; }).then(function () {
    if (fertig) fertig();
  });
}

// ════════════════════════════════════════════════════════════════
//  Auftritt
// ════════════════════════════════════════════════════════════════
//
// Beim Kaltstart steht erst nur der Schriftzug groß in der Mitte und schreibt
// sich; dann wandert er, kleiner werdend, an seinen Platz oben links, und das
// Dashboard tropft Karte für Karte auf (ADR 0029). Ein Tipp überspringt das;
// kommt die App nur aus dem Hintergrund zurück, gibt es keinen Auftritt.

var AUFTRITT_SCHRIFT = 2300;   // so lange schreibt sich der Schriftzug (Flammen bis 2,15 s)
var AUFTRITT_WEG = 700;        // so lange wandert er an seinen Platz
var AUFTRITT_GROESSE = 2;      // so viel größer steht er in der Mitte
var auftrittLaeuft = false, auftrittBewegung = null;

function auftritt() {
  var svg = document.querySelector('#markeKnopf svg.wm');
  if (!svg || ansicht !== 'home' || bewegungAus()) return;
  auftrittLaeuft = true;
  document.documentElement.classList.add('auftritt');
  markeAbspielen(svg);
  var r = svg.getBoundingClientRect();
  var mitte = 'translate(' + px(window.innerWidth / 2 - r.left - r.width / 2) + ', ' +
    px(window.innerHeight / 2 - r.top - r.height / 2) + ') scale(' + AUFTRITT_GROESSE + ')';
  var ganz = AUFTRITT_SCHRIFT + AUFTRITT_WEG;
  auftrittBewegung = bewegt(svg, [{ transform: mitte },
    { transform: mitte, offset: AUFTRITT_SCHRIFT / ganz, easing: KAL_TAKT.kurve },
    { transform: 'none' }], { dauer: ganz, kurve: 'linear' }, function () { auftrittEnde(); });
  if (!auftrittBewegung) auftrittEnde(true);
}

// `still`: ohne Auftropfen — wenn neu gezeichnet wird oder der Prüfstand
// das Bild gleich braucht.
function auftrittEnde(still) {
  if (!auftrittLaeuft) return;
  auftrittLaeuft = false;
  var a = auftrittBewegung;
  auftrittBewegung = null;
  if (a) { try { a.cancel(); } catch (e) { /* schon fort */ } }
  document.documentElement.classList.remove('auftritt');
  if (!still) dashboardAuftropfen();
}

// Datum, Schalter und Knöpfe blenden auf; die Karten tropfen von oben nach
// unten einzeln auf, je als Perle, die sich zur Karte streckt. Was unter dem
// Bildrand liegt, ist einfach da.
function dashboardAuftropfen() {
  if (bewegungAus()) return;
  alleIn('#kopf .datum, #themaKnopf, #menuKnopf, #ticketKnopf').forEach(function (el) {
    bewegt(el, [{ opacity: 0 }, { opacity: 1 }], { dauer: 420, kurve: 'ease-out', fill: 'backwards' });
  });
  var teile = [];
  alleIn('#ansicht > *').forEach(function (el) {
    if (el.classList.contains('abschnitt')) {
      Array.prototype.forEach.call(el.children, function (k) {
        if (k.tagName === 'H2') teile.push(k);
        else if (k.children.length) Array.prototype.forEach.call(k.children, function (z) { teile.push(z); });
        else teile.push(k);
      });
    } else teile.push(el);
  });
  var i = 0;
  teile.forEach(function (el) {
    var b = el.getBoundingClientRect();
    if (!b.width || !b.height || b.top > window.innerHeight) return;
    var d = Math.min(b.width, b.height, 44), seite = px((b.width - d) / 2);
    bewegt(el, [
      { clipPath: 'inset(0px ' + seite + ' ' + px(b.height - d) + ' ' + seite + ' round ' + px(d / 2) + ')', opacity: 0 },
      { clipPath: 'inset(0px ' + seite + ' ' + px(b.height - d) + ' ' + seite + ' round ' + px(d / 2) + ')', opacity: 1, offset: 0.15 },
      { clipPath: 'inset(-40px -40px -40px -40px round 0px)', opacity: 1 }
    ], { dauer: 620, warten: 110 * i, kurve: TROPFEN_KURVE, fill: 'backwards' });
    i++;
  });
}

// ════════════════════════════════════════════════════════════════
//  Start
// ════════════════════════════════════════════════════════════════

function start() {
  themaAnwenden();
  document.documentElement.style.setProperty('--feder', FEDER);
  render();
  auftritt();
  // Ein Tipp irgendwohin überspringt den Auftritt.
  document.addEventListener('pointerdown', function () { if (auftrittLaeuft) auftrittEnde(); }, true);

  // Woher ein Tipp kam, damit die nächste Ansicht dort herauswachsen kann.
  document.addEventListener('pointerdown', tippMerken, true);
  document.addEventListener('click', tippMerken, true);
  // Die Marken der Umschalter sitzen erst richtig, wenn die Schriften da sind.
  window.addEventListener('resize', wahlenSetzen);
  // Bei offenem Menü rollt sein Knopf nicht davon (ADR 0042).
  window.addEventListener('scroll', menueMitrollen, { passive: true });
  try { document.fonts.ready.then(wahlenSetzen); } catch (e) { /* ohne Schriftereignis bleibt es beim Start */ }
  // Der Rahmen der Heatmap mißt das Raster; ändert sich die Breite, mißt er neu.
  window.addEventListener('resize', function () { hmRahmenSetzen(false); });
  try { document.fonts.ready.then(function () { hmRahmenSetzen(false); }); } catch (e) { /* wie oben */ }

  document.addEventListener('touchstart', wischBeginnen, { passive: true });
  document.addEventListener('touchend', wischEnden, { passive: true });
  document.addEventListener('touchcancel', function () { wischVon = null; }, { passive: true });

  $('swLaden').addEventListener('click', function () { swUebernehmen(); });
  $('hinweisOk').addEventListener('click', function () {
    var f = hinweisFrage;
    hinweisFrage = null;
    if (f) f.beiJa();
    if (!$('hinweisKarte').classList.contains('bestaetigung')) hinweisSchliessen();
  });
  $('hinweisNein').addEventListener('click', function () {
    hinweisFrage = null;
    hinweisSchliessen();
  });
  // Eine Bestätigung geht auch mit einem Tipp irgendwohin.
  // Eine Wahl («Hinzufügen») bricht ab, wer danebentippt (ADR 0026).
  $('hinweisBlatt').addEventListener('click', function (e) {
    if ($('hinweisKarte').classList.contains('bestaetigung')) { hinweisSchliessen(); return; }
    if (hinweisWahl && e.target === this) { hinweisWahl = null; hinweisSchliessen(); }
  });
  // Danebentippen schließt das Timerfenster; der Timer läuft weiter (ADR 0038).
  $('timerBlatt').addEventListener('click', function (e) { if (e.target === this) timerSchliessen(); });
  $('swSpaeter').addEventListener('click', function () {
    swStand.gemeldet = true;
    $('swNeu').hidden = true;
  });
  $('menue').addEventListener('click', function (e) {
    if (e.target === this) menueSchliessen();
  });
  $('ticketKnopf').innerHTML = ICON.melden;
  $('ticketKnopf').addEventListener('click', function () { ticketBlattOeffnen(this); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', ticketTastatur);
    window.visualViewport.addEventListener('scroll', ticketTastatur);
  }
  // Danebentippen klappt das Blatt zu; der Entwurf bleibt liegen.
  $('ticketBlatt').addEventListener('click', function (e) {
    if (e.target === this) ticketBlattSchliessen();
  });
  ticketKnopfZeigen();
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    menueSchliessen();
    if (ticketBlattOffen()) ticketBlattSchliessen();
  });

  // Folgt die App dem Gerät, folgt auch die Statusleiste und der Schalter.
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var neu = function () { if (state.thema === 'auto') { themaAnwenden(); render(); } };
    if (mq.addEventListener) mq.addEventListener('change', neu);
    else if (mq.addListener) mq.addListener(neu);
  } catch (e) { /* ohne Medienabfrage bleibt es hell */ }

  // Nach Mitternacht ist ein anderer Tag: Datum, Tagesring und Kacheln stimmen
  // auch dann, wenn die App über Nacht offen blieb.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && (ansicht === 'home' || ansicht === 'welle')) render();
  });
  setInterval(takt, 1000);

  swAnmelden();
}

start();
</script>
